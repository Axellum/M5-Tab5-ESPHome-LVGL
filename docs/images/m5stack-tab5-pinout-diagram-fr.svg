      .gpio{stroke:#9aa3b2}
      .dsi{stroke:#9aa3b2}
      .aud{fill:#2a1f3a;stroke:#b98bf0}
      .ecr{fill:#16283d;stroke:#4ea1f3}
    }
  </style>
