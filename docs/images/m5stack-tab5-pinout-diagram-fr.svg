<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" role="img" aria-labelledby="titre desc" xml:lang="fr">
  <title id="titre">Câblage du M5Stack Tab5 : ESP32-P4, ESP32-C6, expandeurs d'E/S, codecs et bus I2C</title>
  <desc id="desc">Schéma fonctionnel du M5Stack Tab5 tel que ce firmware le configure. L'ESP32-P4 parle au co-processeur Wi-Fi ESP32-C6 par SDIO (horloge GPIO 12, commande GPIO 13, données GPIO 11, 10, 9 et 8, reset GPIO 15). Un seul bus I2C (SDA GPIO 31, SCL GPIO 32, 400 kHz) atteint deux expandeurs d'E/S PI4IOE5V6408 (0x43 et 0x44), le contrôleur tactile, les codecs audio ES8388 et ES7210, le capteur de mouvement BMI270 (0x68), l'horloge RX8130CE et le moniteur de batterie INA226 (0x41). L'écran est en MIPI-DSI, le rétroéclairage sur GPIO 22 et l'interruption du tactile sur GPIO 23. Les deux codecs partagent un bus I2S : horloge bit GPIO 27, sélection de mot GPIO 29, horloge maître GPIO 30, données du micro GPIO 28, données du haut-parleur GPIO 26. Les expandeurs portent les resets, l'ampli, les interrupteurs d'alimentation et les lignes du chargeur de batterie.</desc>
