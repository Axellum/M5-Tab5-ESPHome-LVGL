<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" role="img" aria-labelledby="titre desc" xml:lang="en">
  <title id="titre">M5Stack Tab5 wiring: ESP32-P4, ESP32-C6, I/O expanders, codecs and the I2C bus</title>
  <desc id="desc">Functional diagram of the M5Stack Tab5 as this firmware configures it. The ESP32-P4 talks to the ESP32-C6 Wi-Fi co-processor over SDIO (clock GPIO 12, command GPIO 13, data GPIO 11, 10, 9 and 8, reset GPIO 15). One I2C bus (SDA GPIO 31, SCL GPIO 32, 400 kHz) reaches two PI4IOE5V6408 I/O expanders (0x43 and 0x44), the touch controller, the ES8388 and ES7210 audio codecs, the BMI270 motion sensor (0x68), the RX8130CE clock and the INA226 battery monitor (0x41). The display is on MIPI-DSI with the backlight on GPIO 22 and the touch interrupt on GPIO 23. The two codecs share one I2S bus: bit clock GPIO 27, word select GPIO 29, master clock GPIO 30, microphone data GPIO 28, speaker data GPIO 26. The expanders carry the resets, the amplifier, the power switches and the battery charger lines.</desc>
