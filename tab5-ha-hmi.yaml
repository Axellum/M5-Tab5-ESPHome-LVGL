  # Chronologie du démarrage (10/10/2026, accord d'Axel : des marques seulement,
  # Tab5/socle/tab5_demarrage.h) : chaque `demarrage_marquer(...)` de cette séquence lit
  # une horloge et l'écrit en mémoire, rien d'autre (publication après setup() seulement).
  # Les entrées « marque seule » sont À LA FIN de la liste, pour ne rien déplacer ici.
  on_boot:
    - priority: 700
      then:
        - lambda: 'demarrage_marquer(EtapeDemarrage::AVANT1S);'
        # [AI-WARNING-CRITICAL] INTERDICTION FORMELLE DE SUPPRIMER CE DELAI (Tab5 : 1000 ms, ADR-0005)
        # [06/07/2026] FIX CONFIRME du bug "ecran noir apres reboot logiciel" : le GPIO expander I2C
        # du Tab5 (PI4IOE5V6408) a besoin d'1 s avant l'init de l'écran DSI ; durée par carte, 0 sur la 7B
        # (carte-*.yaml). CE DOIT RESTER UN LAMBDA C++ BLOQUANT, PAS UN `delay:` ESPHome.
        - lambda: |-
            delay(${carte_attente_ecran_ms});
        - lambda: 'demarrage_marquer(EtapeDemarrage::APRES1S);'
    - priority: 600
      then:
        - lambda: 'demarrage_marquer(EtapeDemarrage::P600);'
        # lvgl.resume explicite (05/07/2026) : ajoute comme premiere piste pour
        # le bug "ecran noir apres reboot logiciel" (le light backlight a
        # restore_mode: RESTORE_DEFAULT_ON, qui ne declenche pas on_turn_on/
        # lvgl.resume au boot car pas de vraie transition d'etat). TESTE SEUL
        # -> N'A PAS SUFFI (ecran reste noir). La vraie cause/fix (confirme le
        # 06/07/2026) est le delai bloquant a priority:700 ci-dessus — voir le
        # gros commentaire dans logger: de tab5-hardware.yaml pour le detail.
        # Cette ligne lvgl.resume est gardee car harmless, mais ne sert a rien
        # a elle seule.
        - lvgl.resume:
        - light.turn_on: backlight
        - delay: 1s
        - media_player.volume_set:
            id: speaker_player
            volume: 1.0
        # Allumer l'ampli APRES le media_player pour eviter le bruit I2S
        - switch.turn_on: speaker_enable
        # L'événement qui déclenche la poussée complète de HA, envoyé à HA lui-même dès
        # qu'il écoute les actions : ha_evenement_envoyer() (tab5_journal.cpp) ne l'envoie
        # qu'à un client « Home Assistant » abonné aux actions, et rend faux sans rien
        # envoyer tant qu'il n'y en a pas ; wait_until la rappelle à chaque passage de
        # boucle, l'événement part donc une fois. Avant (17/10/2026) : garde
        # `api.connected: state_subscription_only`, vraie dès qu'UN client est abonné aux
        # états — un outil aioesphomeapi passé avant HA la levait et l'événement était
        # jeté, aux 10 redémarrages de la nuit du 16/10/2026 (écran sans météo ni agenda
        # jusqu'aux poussées périodiques). Plus tôt, `api.connected` nu : perdu 2 boots sur
        # 3 le 25/09/2026. on_client_connected (tab5-api-logic.yaml) ne tire pas au boot
        # (boot_complete encore faux). Un événement perdu se verrait au journal :
        # « HA injoignable au boot (timeout 30s) ».
        - wait_until:
            condition:
              lambda: |-
                if (!id(boot_evt_connecte)) id(boot_evt_connecte) = ha_evenement_envoyer("esphome.tab5_connected");
                return id(boot_evt_connecte);
            timeout: 30s
        - if:
            condition:
              lambda: 'return !id(boot_evt_connecte);'
            then:
              - logger.log: "HA injoignable au boot (timeout 30s) - interface locale disponible quand meme"
        - globals.set:
            id: boot_complete
            value: 'true'
        - if:
            condition:
              - switch.is_on: tab5_wake_word_active
            then:
              - micro_wake_word.start:
            else:
              - micro_wake_word.stop:
        # Synchronisation visuelle de l'icône + bordure des boutons du mode d'assistant vocal (Domotique vs Discussion)
        - script.execute:
            id: tab5_set_assist_mode
            discussion: !lambda 'return id(conversation_mode);'
        # Initialisation des pointeurs LVGL du contexte carte centrale (fixes apres boot).
        - lambda: |-
            g_central_ctx.planning_wrap = id(planning_wrapper);
            g_central_ctx.rain_wrap = id(rain_wrapper);
            g_central_ctx.alert_cont = id(alert_container);
            g_central_ctx.info_wrap = id(info_wrapper);
            g_central_ctx.ha_wrap[0] = id(ha_alert_wrapper_0);
            g_central_ctx.ha_wrap[1] = id(ha_alert_wrapper_1);
            g_central_ctx.ha_wrap[2] = id(ha_alert_wrapper_2);
            g_central_ctx.ha_wrap[3] = id(ha_alert_wrapper_3);
            // Slots meteo jour (D2 : plus de duplication dans chaque lambda).
            g_day_slots[0] = {id(j0_day), id(j0_max), id(j0_min), id(j0_icon_layer1), id(j0_icon_layer2), id(btn_j0_action), id(icon_card_pc), nullptr, nullptr};
            g_day_slots[1] = {id(j1_day), id(j1_max), id(j1_min), id(j1_icon_layer1), id(j1_icon_layer2), id(btn_j1_action), id(icon_card_shutter1), id(icon_card_shutter_arrow), id(btn_j1_dir)};
            g_day_slots[2] = {id(j2_day), id(j2_max), id(j2_min), id(j2_icon_layer1), id(j2_icon_layer2), id(btn_j2_action), id(icon_card_lit_j2), id(icon_card_light_j2), nullptr};
            g_day_slots[3] = {id(j3_day), id(j3_max), id(j3_min), id(j3_icon_layer1), id(j3_icon_layer2), id(btn_j3_action), id(icon_card_salon_j3), id(icon_card_light_j3), nullptr};
            g_day_slots[4] = {id(j4_day), id(j4_max), id(j4_min), id(j4_icon_layer1), id(j4_icon_layer2), id(btn_j4_action), id(icon_card_led_j4), id(icon_card_light_j4), nullptr};
            // Slots meteo heure.
            g_hour_slots[0] = {id(h4_time), id(h4_temp), id(h4_prob), id(h4_icon_layer1), id(h4_icon_layer2)};
            g_hour_slots[1] = {id(h3_time), id(h3_temp), id(h3_prob), id(h3_icon_layer1), id(h3_icon_layer2)};
            g_hour_slots[2] = {id(h2_time), id(h2_temp), id(h2_prob), id(h2_icon_layer1), id(h2_icon_layer2)};
            g_hour_slots[3] = {id(h1_time), id(h1_temp), id(h1_prob), id(h1_icon_layer1), id(h1_icon_layer2)};
            g_hour_slots[4] = {id(h0_time), id(h0_temp), id(h0_prob), id(h0_icon_layer1), id(h0_icon_layer2)};
        # Réveil : restaurer le plancher anti-re-sonnerie AVANT le premier calcul,
        # sinon un redémarrage juste après un arrêt referait sonner l'alarme dans
        # la fenêtre de grâce (ALARM_GRACE_S). tab5_alarm_refresh remplit ensuite
        # `g_alarm_cfg` depuis les entités déjà restaurées et repeint la pastille.
        - lambda: 'alarm_set_skip_floor(id(alarm_skip_before));'
        - script.execute: tab5_alarm_refresh
        - script.execute: tab5_central_rotator_auto
        # Pré-fetch calendrier : charge le mois courant + M+1 en arrière-plan pour
        # que le popup calendrier s'ouvre instantanément (stale-while-revalidate).
        - delay: 3s
        - script.execute: tab5_cal_prefetch_boot
        # Après setup() : la marque publie (une fois).
        - lambda: 'if (demarrage_marquer(EtapeDemarrage::FIN600)) id(tab5_chronologie_publier).execute();'
    # Micro-interactions des boutons verre (transform_scale au pressed : ESPHome n'a
    # pas de state_pressed dans style_definitions -> helper C++) et pose des pointeurs
    # du rouleau d'horloge. 2 s après la fin du setup : LVGL a fait son premier
    # layout, apply_pressed_scale_to_tree() lit la taille de chaque bouton (pivot).
    # La géométrie de l'horloge, elle, est entièrement dans tab5-lvgl.yaml depuis le
    # 01/10/2026 (plus de layout_clock_roller : ses cadres provisoires coupaient le
    # bas des chiffres jusqu'ici) — l'heure est juste dès la première image.
    # Était un `interval: 2s` à flag `static` dans tab5-styles.yaml (logique d'init
    # dans le fichier de styles, audit du 06/09/2026 §4.1 point 8) : on_boot ne
    # s'exécute qu'une fois, plus besoin de flag. Priorité -100 = après tous les
    # setup(), juste avant la boucle ; le delay compte à partir de là.
    - priority: -100
      then:
        - lambda: 'demarrage_marquer(EtapeDemarrage::FIN);'
        # Barre de chargement : fermée avant la première image (la dalle revient à LVGL seul).
        - lambda: 'barre_demarrage_fermer();'
        # Langue de l'écran (lot 4, 27/09/2026 — ajout autorisé par Axel) : traduit
        # les textes posés par le YAML, en fin de setup, AVANT la première image.
        # Sans effet en français. La langue est déjà réglée : le select « Langue »
        # (restore_value) a publié sa valeur pendant son propre setup.
        - lambda: 'i18n_apply_boot({id(page_main)->obj});'
        # Les pages du module des jeux (ADR-0065) : traduites par lui, rien sans lui.
        - script.execute: tab5_jeux_traduire
        - lambda: 'demarrage_marquer(EtapeDemarrage::I18N);'
        # Zones optionnelles (lot 5, 27/09/2026 — ajout autorisé par Axel) : masque les
        # zones absentes mémorisées, AVANT la première image (pas de clignotement).
        - script.execute: tab5_zones_apply
        - lambda: 'demarrage_marquer(EtapeDemarrage::ZONES);'
        - delay: 2s
        - lambda: |-
            apply_pressed_scale_to_tree(lv_screen_active());
            g_clock_roller.d[0] = {id(clock_roll_h10), {id(lbl_time_h10_a), id(lbl_time_h10_b)}, 0, 0};
            g_clock_roller.d[1] = {id(clock_roll_h1),  {id(lbl_time_h1_a),  id(lbl_time_h1_b)},  0, 0};
            g_clock_roller.d[2] = {id(clock_roll_m10), {id(lbl_time_m10_a), id(lbl_time_m10_b)}, 0, 0};
            g_clock_roller.d[3] = {id(clock_roll_m1),  {id(lbl_time_m1_a),  id(lbl_time_m1_b)},  0, 0};
            // Repeint l'heure tout de suite : sans ca l'horloge garderait le
            // placeholder YAML jusqu'au prochain tick minute (on_time_sync a
            // pu passer avant que les pointeurs du rouleau soient poses).
            auto t_now = id(sntp_time).now();
            if (t_now.is_valid()) {
                update_clock_date_ui(id(lbl_date), t_now.hour, t_now.minute,
                    t_now.day_of_week, t_now.day_of_month, t_now.month);
            }
        # Après setup() : la marque publie (une fois).
        - lambda: 'if (demarrage_marquer(EtapeDemarrage::TARD)) id(tab5_chronologie_publier).execute();'
    # ── Entrées « marque seule » de la chronologie (10/10/2026) ──
    # ESPHome lance chaque entrée on_boot dans le setup() d'un composant de SA priorité ;
    # les composants passent par priorité décroissante (ordre d'enregistrement à égalité).
    # Ces entrées, à des priorités qu'aucune autre n'a, bornent donc les bandes de
    # priorité : la différence entre deux marques est la durée des setup() d'entre elles.
    # Contenu de chaque bande : docs/performance.md, « Chronologie du démarrage ».
    - priority: 2000  # la plus haute : premier setup(), fin de la construction de main()
      then:
        - lambda: |-
            demarrage_marquer(EtapeDemarrage::SETUP);
            demarrage_noter_ordo(millis());
    - priority: 801  # après le bus I²C, le LDO (1000) et les deux expandeurs (900)
      then:
        - lambda: 'demarrage_marquer(EtapeDemarrage::BUS);'
    # Barre de chargement (16/10/2026, accord d'Axel : « je t'autorise a toucher on_boot pour
    # ca ») : LVGL ne dessine qu'après setup(), la dalle est prête dès la bande 600. La barre
    # (Tab5/ecran/tab5_barre_demarrage.cpp) s'ouvre à 500, avance à 399 et 249, se ferme au
    # début de -100. Ajoutée APRÈS chaque marque : la chronologie reste comparable.
    - priority: 500  # après la bande 600 : écran, tactile, codecs audio, capteurs
      then:
        - lambda: 'demarrage_marquer(EtapeDemarrage::DONNEES);'
        - lambda: |-
            if (barre_demarrage_ouvrir(id(tab5_display))) {
              // Rétroéclairage tout de suite, à la valeur que la lumière écrira à sa
              // première boucle (même calcul que `monochromatic` : courbe gamma, puis le
              // plafond du mode économie dans backlight_plafonne) : pas de saut à l'image.
              float b = 0.0f;
              id(backlight).remote_values.as_brightness(&b);
              if (b > 0.0f) id(backlight_plafonne).set_level(id(backlight).gamma_correct_lut(b));
            }
    - priority: 399  # après la bande 400 : haut-parleur, setup() de LVGL, lecteur
      then:
        - lambda: 'demarrage_marquer(EtapeDemarrage::LVGL);'
        - lambda: 'barre_demarrage_etape(1);'
    - priority: 249  # après les lambdas LVGL (395 et 380), le réseau (300), le Wi-Fi (250)
      then:
        - lambda: 'demarrage_marquer(EtapeDemarrage::WIFIINIT);'
        - lambda: 'barre_demarrage_etape(2);'
    - priority: 199  # après SNTP (220), l'API, l'OTA et le mode sans échec (200)
      then:
        - lambda: 'demarrage_marquer(EtapeDemarrage::RESEAU);'
    - priority: 99  # après micro_wake_word et l'assistant vocal (100)
      then:
        - lambda: 'demarrage_marquer(EtapeDemarrage::ECOUTE);'

# Plus de battement `interval: 5min` qui réémettait esphome.tab5_connected (retiré le
# 25/09/2026, audit lot 3) : il relançait la chaîne complète côté HA sans raison, ou
# finissait en « Already running » (×1 627 en 6 jours). L'événement part désormais au
# boot (on_boot ci-dessus) et à chaque RECONNEXION de Home Assistant (api:
# on_client_connected, tab5-api-logic.yaml) — les deux seuls cas où l'écran a besoin
# d'un push complet ; le cycle /10 min côté HA couvre le reste.

# Plus d'images! image: !include supprimé au profit des polices C++ vectorielles LVGL

packages:
  tab5_ui_tokens: !include Tab5/paquets/tab5-ui-tokens.yaml
  # Carte (ADR-0061) : `tab5_carte:` dans Tab5/user_entities.yaml (ou `-s tab5_carte …`)
  # = tab5 (défaut : M5Stack Tab5, son matériel tab5-hardware.yaml et la révision de sa
  # dalle, `tab5_ecran:`, voir carte-tab5.yaml) ou waveshare-7b (Waveshare
  # ESP32-P4-WIFI6-Touch-LCD-7B, 1024×600, prise en charge : l'écran de l'auteur depuis
  # le 14/10/2026, sans les jeux par défaut). Chaque carte porte la taille de son écran
  # (geometrie-<carte>.yaml). Même place dans la liste que les deux packages qu'elle
  # regroupe : l'ordre de la configuration du Tab5 ne change pas.
  tab5_carte: !include Tab5/paquets/carte-${ tab5_carte | default('tab5') | lower }.yaml
  # Publication (lot 6c, ADR-0022) : `locale` (défaut, compilation sur son PC) n'ajoute
  # rien ; `stable` / `beta`, donnés par la CI de publication (`-s tab5_publication …`),
  # ajoutent l'entité de mise à jour qui lit le manifeste de la page de flashage.
  tab5_publication: !include Tab5/paquets/publication-${ tab5_publication | default('locale') }.yaml
  tab5_sensors_diagnostics: !include Tab5/paquets/tab5-sensors-diagnostics.yaml
  tab5_sensors_domotique: !include Tab5/paquets/tab5-sensors-domotique.yaml
  tab5_api_logic: !include Tab5/paquets/tab5-api-logic.yaml
  tab5_styles: !include Tab5/paquets/tab5-styles.yaml
  tab5_globals: !include Tab5/paquets/tab5-globals.yaml
  tab5_scripts: !include Tab5/paquets/tab5-scripts.yaml
  tab5_lvgl: !include Tab5/paquets/tab5-lvgl.yaml
  # Un package par fonctionnalité (audit du 25/09/2026, lot 8c), APRÈS tab5_lvgl
  # comme tab5_alarm : leurs scripts référencent des pages et des widgets LVGL.
  # Jeux : un module (ADR-0065). `tab5_jeux:` dans Tab5/user_entities.yaml (ou
  # `-s tab5_jeux …`) = oui ou non ; par défaut oui sur le Tab5, non sur une carte sans
  # IMU (Waveshare 7B : la moitié des consoles se jouent en inclinant). Non =
  # tab5-arcade-absente.yaml : ni code, ni pages, ni couleurs des jeux, l'Arcade n'est
  # plus un écran. APRÈS tab5_lvgl : ses pages suivent page_main (l'index 0).
  tab5_arcade: !include Tab5/paquets/tab5-arcade${ '' if (tab5_jeux | default('oui' if (tab5_carte | default('tab5') | lower) == 'tab5' else 'non') | lower) == 'oui' else '-absente' }.yaml
  tab5_calendar: !include Tab5/paquets/tab5-calendar.yaml
  tab5_assist: !include Tab5/paquets/tab5-assist.yaml
  # IMU (BMI270) : le Tab5 seulement (tab5-imu.yaml). Une carte sans IMU prend
  # tab5-imu-absente.yaml (« Tab5 Tap-to-Wake » sans capteur, que lit le popup Réglages) ;
  # ses consoles n'ont ni inclinaison ni secousse (ADR-0061).
  tab5_imu: !include Tab5/paquets/tab5-imu${ '' if (tab5_carte | default('tab5') | lower) == 'tab5' else '-absente' }.yaml
  # Navigation (08/10/2026) : registre des fenetres, « Aller a l'ecran », « Ecran courant »,
  # tab5_ecran_ouvrir. APRES tab5_lvgl : ses lambdas referencent des ids de widgets LVGL.
  tab5_navigation: !include Tab5/paquets/tab5-navigation.yaml
  # Entites exposees a HA pour regler l'ecran depuis un dashboard HA.
  tab5_ha_controls: !include Tab5/paquets/tab5-ha-controls.yaml
  # Reveil matin + annonce des rendez-vous. Comme ci-dessus : APRES tab5_lvgl
  # (ses scripts referencent les ids de alarm_popup.yaml / alarm_ring_overlay.yaml).
  tab5_alarm: !include Tab5/paquets/tab5-alarm.yaml
  # Pièces et tuiles (ADR-0023) : APRES tab5_lvgl (widgets), script lancé par tab5_zones_apply.
  tab5_tuiles: !include Tab5/paquets/tab5-tuiles.yaml
  # Roue d'actions rapides (ADR-0036) : APRES tab5_lvgl (widgets), script lancé par tab5_tuiles_ui.
  tab5_roue: !include Tab5/paquets/tab5-roue.yaml
  # Rangée sous l'horloge (ADR-0031) : APRES tab5_lvgl (widgets), script lancé par tab5_zones_apply.
  tab5_rangee: !include Tab5/paquets/tab5-rangee.yaml
  # Tuile − / + (ADR-0033) : APRES tab5_lvgl (widgets), script lancé par tab5_zones_apply.
  tab5_reglables: !include Tab5/paquets/tab5-reglables.yaml
  # Popup Énergie (ADR-0028) : APRES tab5_lvgl (widgets), ouvert par une tuile ou par HA.
  tab5_energie: !include Tab5/paquets/tab5-energie.yaml
  # Popup Température (ADR-0032) : APRES tab5_lvgl (widgets), ouvert par un appui long.
  tab5_historique: !include Tab5/paquets/tab5-historique.yaml
  # Popup Alertes (lot 4 du plan des alertes) : APRES tab5_lvgl (widgets), ouvert par un
  # appui long sur la carte centrale ou par HA.
  tab5_alertes: !include Tab5/paquets/tab5-alertes.yaml
  # Popup Maison (ADR-0037) : APRES tab5_lvgl (widgets), ouvert par HA ou par le titre de la pièce.
  tab5_maison: !include Tab5/paquets/tab5-maison.yaml
  # Popup Météo (ADR-0043) : APRES tab5_lvgl (widgets), ouvert par HA, un geste ou une tuile.
  tab5_meteo: !include Tab5/paquets/tab5-meteo.yaml
  # Lecteur de musique (ADR-0050) : APRES tab5_lvgl (widgets) et tab5_assist (client HTTP
  # des images), ouvert par une tuile med, la mini-barre, un geste ou HA.
  tab5_lecteur: !include Tab5/paquets/tab5-lecteur.yaml
  # Musique de toute la maison (ADR-0067) : APRES tab5_lvgl (widgets) et tab5_assist (client
  # HTTP des pochettes), poussée par HA, ouverte avec le popup Musique.
  tab5_musique: !include Tab5/paquets/tab5-musique.yaml
  # Popup Caméras (ADR-0049) : APRES tab5_lvgl (widgets), ouvert par HA ou par un geste.
  tab5_cameras: !include Tab5/paquets/tab5-cameras.yaml
  # Capteurs suivis (ADR-0054) : APRES tab5_lvgl (widgets), poussés par HA, ouverts par la
  # carte de la zone à gauche de l'horloge, un geste ou HA.
  tab5_suivi: !include Tab5/paquets/tab5-suivi.yaml
  # Froid (ADR-0055) : APRES tab5_lvgl (widgets), poussé par HA, ouvert par l'icône de
  # l'horloge, un geste, la roue de navigation ou HA.
  tab5_froid: !include Tab5/paquets/tab5-froid.yaml
  # Serveur IA (ADR-0059) : APRES tab5_lvgl (widgets), poussé par HA, ouvert par un geste,
  # la roue de navigation ou HA.
  tab5_serveur_ia: !include Tab5/paquets/tab5-serveur-ia.yaml
  # Télécommandes (ADR-0056) : APRES tab5_lvgl (widgets), script lancé par tab5_tuiles_ui.
  tab5_telecommande: !include Tab5/paquets/tab5-telecommande.yaml
  # Zones optionnelles (lot 5) : APRES tab5_lvgl (widgets). Ses substitutions sont les
  # valeurs par défaut des entity_… : une clé de Tab5/user_entities.yaml l'emporte.
  tab5_zones: !include Tab5/paquets/tab5-zones.yaml
  # Popup Réglages (06/10/2026) : APRES tab5_lvgl (widgets), ouvert par l'engrenage ou par HA.
  tab5_reglages: !include Tab5/paquets/tab5-reglages.yaml
  # Mode économie d'énergie (06/10/2026) : plafond du rétroéclairage, animations, cadence
  # de LVGL. Ses entrées viennent du matériel (INA226, toucher), qui lance son script.
  tab5_economie: !include Tab5/paquets/tab5-economie.yaml
  # Thèmes (ADR-0029) : EN DERNIER, sa repeinture lit les widgets, les capteurs et les
  # scripts des packages ci-dessus.
  tab5_themes: !include Tab5/paquets/tab5-themes.yaml

# Portail captif, conservé à dessein (audit du 06/09/2026, §4.1 point 16) : il
# n'est actif que quand l'AP de secours l'est (`wifi: ap:` dans
# Tab5/paquets/tab5-sensors-diagnostics.yaml), c'est-à-dire après l'échec de la connexion
# Wi-Fi — la seule voie de récupération sans câble USB. Coût en fonctionnement
# normal : le code du serveur web dans le binaire et ses objets en RAM.
captive_portal:
