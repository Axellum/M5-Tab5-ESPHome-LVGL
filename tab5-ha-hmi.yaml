# ============================================================================
# [AI-CONTEXT]
# @file tab5-ha-hmi.yaml
# @role Point d'entrée principal ESPHome.
# @architecture_constraint Contient les substitutions, l'inclusion des packages, et le boot.
# @ai_instruction Ne JAMAIS modifier la séquence on_boot sans l'autorisation expresse d'Axel.
# ============================================================================
# Entity IDs HA : fichier local gitignoré (comme secrets.yaml).
# Setup : cp Tab5/user_entities.example.yaml Tab5/user_entities.yaml puis éditer.
substitutions: !include Tab5/user_entities.yaml

esphome:
  # Nom de l'appareil (ADR-0063, plusieurs écrans) : un par écran quand plusieurs
  # tournent ensemble (`tab5_nom: ecran-cuisine` dans Tab5/user_entities.yaml, ou
  # `-s tab5_nom …`). Il donne le nom réseau (mDNS), le dossier de build et le préfixe
  # des actions que HA appelle (`esphome.ecran_cuisine_tab5_maj_…`), publié par le
  # capteur « Tab5 Préfixe des actions ». Défaut inchangé : une tablette déjà installée
  # garde son nom, ses entités et ses actions. Le modèle de l'appareil (le `name` du bloc project, plus bas)
  # ne change pas : c'est lui qui fait reconnaître la tablette par HA.
  name: ${ tab5_nom | default('tab5-ha-hmi') }
  friendly_name: ${ tab5_nom_affiche | default('M5Stack Tab5 Home Assistant HMI') }
  # Identité du firmware (lot 6b, ADR-0020) : HA l'affiche dans la fiche de l'appareil,
  # et le manifeste de mise à jour (lot 6c, ADR-0022) porte ce même `name`. La version
  # suit le CHANGELOG ; « -dev » pour une compilation locale. Un firmware publié reçoit
  # celle du tag de sa release (`-s tab5_version …`, .github/workflows/publication.yml),
  # que l'entité de mise à jour compare au manifeste. Le défaut = dernière version publiée
  # du CHANGELOG + « -dev » : à relever à chaque release (tests/test_version.py).
  project:
    name: axellum.tab5-ha-hmi
    version: ${ tab5_version | default('3.9.0-dev') }
  # [2026.7.0] Plancher DUR d'origine : st7123 officiel + audio zero-copy + VAD + PSRAM SDIO.
  # [2026.8.1] Relevé le 26/08/2026. Le code compile encore tel quel en 2026.7.x — ce
  # plancher n'est donc pas une dépendance d'API, c'est un choix : 2026.8 corrige trois
  # choses que ce projet exerce tous les jours, et rien ici ne justifie de laisser
  # quelqu'un compiler sans elles.
  #   - api #18577 : la loop se bloque et déclenche le watchdog quand l'envoi de la liste
  #     d'entités bloque. On expose 58 entités, et CONFIG_ESP_TASK_WDT_TIMEOUT_S est
  #     justement monté à 15 s dans tab5-hardware.yaml à cause de ce genre de blocage.
  #   - voice_assistant #17043 : lecture hachée quand le CPU est chargé — exactement le
  #     cas LVGL + jeux + TTS streamé, celui que buffer_duration: 500ms amortit à peine.
  #   - esp32 #17769 / #17770 : le handler de crash capture enfin MTVAL (l'adresse
  #     fautive sur RISC-V) et signale un crash décodé contre un autre binaire.
  #   (Redescendre à 2026.7.0 ne cassait rien de fonctionnel tant que ce plancher tenait.)
  # [2026.9.0] Relevé le 16/09/2026 — cette fois c'est une dépendance d'API : le bloc
  # `ota: encryption:` (chiffrement OTA avec la clé API, tab5-hardware.yaml) n'existe pas
  # avant 2026.9.0, une version antérieure refuse la config. En prime, sans rien changer :
  #   - ota #18580 / #19041 : effacement flash paresseux par blocs de 64 Kio (préparation
  #     < 0,2 s au lieu de ~4 s) et délais 105 s / 160 s qui survivent aux acks perdus ;
  #   - i2s_audio #19045 / #19027 / #19046 : plus de « Parent bus is busy » auto-infligé
  #     en STATE_STARTING, plus de 2e flux muet quand la fréquence change (sonnerie RTTTL
  #     puis TTS 24 kHz — notre bus I2S partagé micro/haut-parleur, ADR-0010) ;
  #   - api #18802 / #18803 : la connexion est coupée au lieu de crasher quand l'allocation
  #     d'un tampon échoue (payloads bulk).
  # [lot 6b, 27/09/2026] Le bloc `ota: encryption:` est parti (ADR-0020), mais le
  # plancher reste : `provisioning:` (fenêtre d'appairage), la clé API fournie par HA
  # par une connexion chiffrée et `signed_ota_verification` sont vérifiés en 2026.9.0
  # (le job CI build-min compile à ce plancher). Pas cherché si une version plus
  # ancienne les connaît tous.
  min_version: 2026.9.0
  # Une macro de LV_DEFINES (que lv_conf.h, écrit par ESPHome, met sinon à 0) passe par
  # ICI : ESPHome 2026.9.0 ne lit que platformio_options pour l'écarter de lv_conf.h
  # (esphome: build_flags seulement depuis 2026.9.1, #19743). Clé dépréciée, retirée en
  # 2026.12.0 : avant, plancher à 2026.9.1 et ligne déplacée dans build_flags ci-dessous
  # (un #error de tab5_cameras.cpp arrête le build si elle se perd).
  platformio_options:
    build_flags:
      # Images RGB565 réduites ou recolorées (17/10/2026, discussion #278) : caméras
      # (cadre et vignettes plus petits que l'image de HA, vignette appuyée), pochettes
      # du lecteur en COVER. lv_draw_sw_transform les convertit en RGB565A8 ; ESPHome
      # ne l'active que pour une `image:` RGB565 transparente, et sans lui LVGL écrit
      # « Color format 0x12 is not enabled » et dessine un tampon non initialisé.
      - -DLV_DRAW_SW_SUPPORT_RGB565A8=1
  # Réglages LVGL : ESPHome compile LVGL avec -DLV_KCONFIG_IGNORE, donc un
  # CONFIG_LV_* du sdkconfig n'a aucun effet ; une macro absente de ses LV_DEFINES
  # passe par ici.
  build_flags:
    # Boutons instantanés (demande d'Axel, 26/09/2026 ; réellement appliqué le
    # 28/09/2026) : le thème LVGL par défaut animait chaque appui en 80 ms, et chaque
    # relâchement en 80 ms APRÈS 70 ms de délai, ce qui se voyait pendant l'ouverture
    # d'un popup (lv_theme_default.c, trans_delayed / trans_normal). À 0, LVGL ne crée
    # plus ces transitions : boutons, curseurs, interrupteurs et barres de défilement
    # basculent d'une image à l'autre. Les animations propres au projet
    # (tab5_anim.cpp : swipe, rouleaux, alertes) ne dépendent pas de ce réglage.
    - -DLV_THEME_DEFAULT_TRANSITION_TIME=0
    # Taille de l'écran et rotation de repos de LVGL, celles de la carte (ADR-0061,
    # Tab5/paquets/geometrie-<carte>.yaml) : kEcranL, kEcranH et kRotationRepos de
    # Tab5/socle/tab5_geometrie.h. Sans ces drapeaux (tests sur PC), les valeurs du Tab5.
    # TAB5_POLICE_PCT : l'échelle des grosses polices en pour cent (police_pct,
    # tab5-ui-tokens.yaml), celle de la géométrie de l'horloge (lot 3 du portage).
    - -DTAB5_ECRAN_L=${carte_ecran_l}
    - -DTAB5_ECRAN_H=${carte_ecran_h}
    - -DTAB5_ROTATION=${carte_rotation}
    - -DTAB5_POLICE_PCT=${police_pct}
    # Extinction de la dalle avec le rétroéclairage (Tab5/ecran/tab5_dalle.cpp, audit
    # anti-casse du 16/10/2026) : commandes DCS que tient la dalle (0 voile seul, 1 + display
    # off, 2 + sleep in) et dalle noire pendant une OTA, selon la carte ou la révision de dalle
    # (substitutions carte_dalle_* de carte-waveshare-7b.yaml et des Tab5/paquets/ecran-*.yaml).
    - -DTAB5_DALLE_EXTINCTION=${carte_dalle_extinction}
    - -DTAB5_DALLE_NOIRE_OTA=${carte_dalle_noire_ota}
  includes:
    # Jetons sans dépendance (UIColor/UIAnim/UIIdle), inclus par tab5_custom.h et par
    # les deux jeux qui en ont besoin (25/09/2026, audit lot 8a).
    - Tab5/socle/tab5_tokens.h
    # Catalogue des thèmes (THEMES[]), écrit par tools/gen_themes.py : inclus par
    # tab5_theme.cpp et tab5_reglages.cpp seulement (audit du 07/10/2026, DO-3).
    - Tab5/socle/tab5_themes_data.h
    # Palette des icônes des tuiles de pièce (ADR-0023), écrite par tools/gen_tuiles_icones.py.
    - Tab5/socle/tab5_tuiles_icones.h
    # Langue de l'écran (lot 4, 27/09/2026) : tr() pur, compilé aussi sur PC par les
    # tests du réveil, et ses tables générées par tools/gen_i18n.py depuis
    # Tab5/lang/*.yaml. Avant tab5_core, qui s'en sert pour les dates.
    - Tab5/socle/tab5_i18n_data.h
    - Tab5/socle/tab5_i18n.h
    - Tab5/socle/tab5_i18n.cpp
    # Logique pure (dates, données calendrier) : compilée aussi sur PC par les tests
    # du réveil (tools/test_alarm_clock.cpp, lot 8b).
    - Tab5/socle/tab5_core.h
    - Tab5/socle/tab5_core.cpp
    # Lecture bornée des payloads de HA (champs, nombres) : pure, testée sur PC par
    # tools/test_tab5_socle.cpp (audit du 07/10/2026, lot L5).
    - Tab5/socle/tab5_champs.h
    - Tab5/socle/tab5_champs.cpp
    # Lecture des payloads de HA par service (prévisions, vigilance, alertes, pluie…) :
    # pure, testée sur PC par tools/test_parse.cpp et fuzzée (lot F de l'audit du 30/09/2026).
    - Tab5/socle/tab5_parse.h
    - Tab5/socle/tab5_parse.cpp
    # Géométrie partagée des popups construits en C++ (écran, carte modale, pièces) :
    # en-tête seul, inclus par les .cpp qui s'en servent (lot L5).
    - Tab5/socle/tab5_geometrie.h
    # Découpe d'une zone autour d'une carte opaque (popup_voile_carte, tab5_anim.cpp,
    # 17/10/2026) : en-tête seul et pur.
    - Tab5/socle/tab5_decoupe.h
    # Disposition des éléments d'une pièce sur les cinq places, tuiles coupées en deux ou en
    # quatre (ADR-0066, 18/10/2026) : en-tête seul et pur.
    - Tab5/socle/tab5_disposition.h
    # Ce que les tuiles de pièce et la tuile - / + ont en commun (tailles, état hors
    # ligne, code d'icône) : en-tête seul et pur (lot L5).
    - Tab5/socle/tab5_modele_ha.h
    - Tab5/ecran/tab5_custom.h
    # Un en-tête par module (08/10/2026), inclus par tab5_custom.h dans l'ordre de leurs
    # dépendances : listés ici parce qu'ESPHome ne copie dans son build que ces fichiers.
    - Tab5/ecran/tab5_forecast.h
    - Tab5/ecran/tab5_services.h
    - Tab5/ecran/tab5_anim.h
    - Tab5/ecran/tab5_text.h
    - Tab5/ecran/tab5_central.h
    - Tab5/ecran/tab5_cards.h
    - Tab5/ecran/tab5_console.h
    - Tab5/ecran/tab5_clim.h
    - Tab5/ecran/tab5_assist.h
    - Tab5/ecran/tab5_calendar.h
    - Tab5/ecran/tab5_journal.h
    - Tab5/ecran/tab5_zones.h
    - Tab5/ecran/tab5_tuiles.h
    - Tab5/ecran/tab5_rangee.h
    - Tab5/ecran/tab5_reglables.h
    - Tab5/ecran/tab5_roue.h
    - Tab5/ecran/tab5_energie.h
    - Tab5/ecran/tab5_reglages.h
    - Tab5/ecran/tab5_historique.h
    - Tab5/ecran/tab5_alertes.h
    - Tab5/ecran/tab5_maison.h
    - Tab5/ecran/tab5_piece_climat.h
    - Tab5/ecran/tab5_meteo.h
    - Tab5/ecran/tab5_zone_gauche.h
    - Tab5/ecran/tab5_lecteur.h
    - Tab5/ecran/tab5_musique.h
    - Tab5/ecran/tab5_cameras.h
    - Tab5/ecran/tab5_suivi.h
    - Tab5/ecran/tab5_cameras_charge.h
    - Tab5/ecran/tab5_froid.h
    - Tab5/ecran/tab5_serveur_ia.h
    - Tab5/ecran/tab5_telecommande.h
    - Tab5/ecran/tab5_theme.h
    - Tab5/ecran/tab5_barre_demarrage.h
    - Tab5/ecran/tab5_custom.cpp
    # Couche C++ scindée en unités (lot (e), 08/09/2026) : tab5_custom.h reste l'unique
    # en-tête public, tab5_internal.h déclare les helpers partagés entre unités.
    - Tab5/ecran/tab5_internal.h
    - Tab5/ecran/tab5_text.cpp
    - Tab5/ecran/tab5_forecast.cpp
    - Tab5/ecran/tab5_central.cpp
    - Tab5/ecran/tab5_services.cpp
    - Tab5/ecran/tab5_assist.cpp
    - Tab5/ecran/tab5_cards.cpp
    # Clim (ADR-0026, ADR-0027) : sortie de tab5_cards.cpp le 08/10/2026 (lot L7).
    - Tab5/ecran/tab5_clim.cpp
    - Tab5/ecran/tab5_console.cpp
    - Tab5/ecran/tab5_anim.cpp
    - Tab5/ecran/tab5_calendar.cpp
    # Journal des démarrages et des coupures (plantages, lien Wi-Fi / C6), 26/09/2026.
    - Tab5/ecran/tab5_journal.cpp
    # Zones optionnelles : ce qui disparaît quand l'entité manque dans HA (lot 5, 27/09/2026).
    - Tab5/ecran/tab5_zones.cpp
    # Pièces et tuiles génériques décrites par HA (ADR-0023, 28/09/2026) ; leurs popups et
    # leur roue d'actions rapides, l'en-tête que les trois partagent (lot L7, 08/10/2026).
    - Tab5/ecran/tab5_tuiles_priv.h
    - Tab5/ecran/tab5_tuiles.cpp
    - Tab5/ecran/tab5_tuiles_popups.cpp
    - Tab5/ecran/tab5_tuiles_roue.cpp
    # Cases des tuiles coupées en deux ou en quatre du mode HA (ADR-0066, 18/10/2026).
