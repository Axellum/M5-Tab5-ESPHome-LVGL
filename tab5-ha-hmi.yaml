# ============================================================================
# [AI-CONTEXT]
# @file tab5-ha-hmi.yaml
# @role Point d'entrée principal ESPHome.
# @architecture_constraint Contient les substitutions, l'inclusion des packages, et le boot.
# @ai_instruction Ne JAMAIS modifier la séquence on_boot sans l'autorisation expresse d'Axel.
# ============================================================================
# Entity IDs HA : fichier local gitignoré (comme secrets.yaml).
# Setup : cp Tab5/user_entities.example.yaml Tab5/user_entities.yaml puis éditer.
substitutions: !include Tab5/user_entities.yaml

esphome:
  name: tab5-ha-hmi
  friendly_name: M5Stack Tab5 Home Assistant HMI
  min_version: 2026.7.0    # [2026.7.0] Requis pour st7123 officiel + audio zero-copy + VAD + PSRAM SDIO
  includes:
    - Tab5/tab5_custom.h
    - Tab5/tab5_custom.cpp
    # Jeu « Fil d'Or » (overlay plein écran) — sous-module isolé du HMI.
    - Tab5/marble_game.h
    - Tab5/marble_game.cpp
    # Jeu « Arcanoïde » (casse-briques rétro) — sous-module isolé du HMI.
    - Tab5/arkanoid_game.h
    - Tab5/arkanoid_game.cpp
    # Jeu « Coureur d'Or » (Lode Runner) — sous-module isolé du HMI.
    - Tab5/lode_game.h
    - Tab5/lode_game.cpp
    # Jeu « Roi Noir » (échiquier FIDE + IA embarquée) — sous-module isolé du HMI.
    # chess_ai.* = moteur pur (aucun LVGL) ; chess_game.* = UI et machine à états.
    - Tab5/chess_ai.h
    - Tab5/chess_ai.cpp
    - Tab5/chess_game.h
    - Tab5/chess_game.cpp
    # Jeu « Go Tab » — sous-module isolé (moteur + IA + UI).
    - Tab5/go_engine.h
    - Tab5/go_engine.cpp
    - Tab5/go_ai.h
    - Tab5/go_ai.cpp
    - Tab5/go_game.h
    - Tab5/go_game.cpp
    # Jeu « Trial Poursuite » (Trivial Pursuit rétro-salon) — sous-module isolé.
    # trivia_questions.h est inclus par trivia_game.cpp : il DOIT figurer ici,
    # sinon ESPHome ne le copie pas dans le dossier de build et la compilation
    # échoue sur un « No such file or directory ».
    - Tab5/trivia_game.h
    - Tab5/trivia_questions.h
    - Tab5/trivia_game.cpp
    # Jeu « Dames » (dames internationales / anglaises) — sous-module isolé.
    # draughts_ai.* = moteur + IA ; draughts_game.* = UI et machine à états.
    - Tab5/draughts_ai.h
    - Tab5/draughts_ai.cpp
    - Tab5/draughts_game.h
    - Tab5/draughts_game.cpp
    # Jeu « Neon Apron » (flipper PORTRAIT) — sous-module isolé du HMI.
    # Seule console qui bascule l'écran : elle passe LVGL en 720×1280 le temps
    # d'une partie puis restaure `rotation: 270`. Voir le bloc [AI-CONTEXT]
    # ORIENTATION en tête de pinball_game.cpp avant d'y toucher.
    - Tab5/pinball_game.h
    - Tab5/pinball_game.cpp
    # Réveil matin + annonce des rendez-vous — moteur PUR (dates, calendrier,
    # machine d'état), aucune dépendance HA ni réseau. Il lit `cal_jours_data[]`
    # de tab5_custom.h : garder cet ordre d'inclusion.
    - Tab5/alarm_clock.h
    - Tab5/alarm_clock.cpp

  on_boot:
    - priority: 700
      then:
        # [AI-WARNING-CRITICAL] INTERDICTION FORMELLE DE SUPPRIMER CE DELAI
        # [06/07/2026] FIX CONFIRME pour le bug "ecran noir apres reboot logiciel".
        # Le GPIO expander I2C (PI4IOE5V6408) a besoin d'une seconde pour se stabiliser
        # avant l'init de l'écran DSI. CE DOIT RESTER UN LAMBDA C++ BLOQUANT, PAS UN `delay:` ESPHome.
        - lambda: |-
            delay(1000);
    - priority: 600
      then:
      # lvgl.resume explicite (05/07/2026) : ajoute comme premiere piste pour
      # le bug "ecran noir apres reboot logiciel" (le light backlight a
      # restore_mode: RESTORE_DEFAULT_ON, qui ne declenche pas on_turn_on/
      # lvgl.resume au boot car pas de vraie transition d'etat). TESTE SEUL
      # -> N'A PAS SUFFI (ecran reste noir). La vraie cause/fix (confirme le
      # 06/07/2026) est le delai bloquant a priority:700 ci-dessus — voir le
      # gros commentaire dans logger: de tab5-hardware.yaml pour le detail.
      # Cette ligne lvgl.resume est gardee car harmless, mais ne sert a rien
      # a elle seule.
      - lvgl.resume:
      - light.turn_on: backlight
      - delay: 1s
      - media_player.volume_set:
          id: speaker_player
          volume: 1.0
      # Allumer l'ampli APRES le media_player pour eviter le bruit I2S
      - switch.turn_on: speaker_enable
      - wait_until:
          condition:
            api.connected:
          timeout: 30s
      - delay: 500ms
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.event:
                event: esphome.tab5_connected
          else:
            - logger.log: "HA injoignable au boot (timeout 30s) - interface locale disponible quand meme"
      - globals.set:
          id: boot_complete
          value: 'true'
      - if:
          condition:
            - switch.is_on: tab5_wake_word_active
          then:
            - micro_wake_word.start:
          else:
            - micro_wake_word.stop:
      # Synchronisation visuelle de l'icône + bordure des boutons du mode d'assistant vocal (Domotique vs Discussion)
      - script.execute:
          id: tab5_set_assist_mode
          discussion: !lambda 'return id(conversation_mode);'
      # Initialisation des pointeurs LVGL du contexte carte centrale (fixes apres boot).
      - lambda: |-
          g_central_ctx.planning_wrap = id(planning_wrapper);
          g_central_ctx.rain_wrap = id(rain_wrapper);
          g_central_ctx.alert_cont = id(alert_container);
          g_central_ctx.info_wrap = id(info_wrapper);
          g_central_ctx.ha_wrap[0] = id(ha_alert_wrapper_0);
          g_central_ctx.ha_wrap[1] = id(ha_alert_wrapper_1);
          g_central_ctx.ha_wrap[2] = id(ha_alert_wrapper_2);
          g_central_ctx.ha_wrap[3] = id(ha_alert_wrapper_3);
          g_central_ctx.page_title_sub = id(lbl_page_title_sub);
          g_central_ctx.current_panel = id(current_central_panel);
          g_central_ctx.has_rain = id(has_rain);
          g_central_ctx.has_mf_alerts = id(has_alerts);
          g_central_ctx.has_info = id(has_info);
          g_central_ctx.has_ha[0] = id(has_ha_alert_0);
          g_central_ctx.has_ha[1] = id(has_ha_alert_1);
          g_central_ctx.has_ha[2] = id(has_ha_alert_2);
          g_central_ctx.has_ha[3] = id(has_ha_alert_3);
          // Slots meteo jour (D2 : plus de duplication dans chaque lambda).
          g_day_slots[0] = {id(j0_day), id(j0_max), id(j0_min), id(j0_icon_layer1), id(j0_icon_layer2), id(btn_j0_action), id(icon_card_pc), nullptr, nullptr};
          g_day_slots[1] = {id(j1_day), id(j1_max), id(j1_min), id(j1_icon_layer1), id(j1_icon_layer2), id(btn_j1_action), id(icon_card_shutter1), id(icon_card_shutter_arrow), id(btn_j1_dir)};
          g_day_slots[2] = {id(j2_day), id(j2_max), id(j2_min), id(j2_icon_layer1), id(j2_icon_layer2), id(btn_j2_action), id(icon_card_lit_j2), id(icon_card_light_j2), nullptr};
          g_day_slots[3] = {id(j3_day), id(j3_max), id(j3_min), id(j3_icon_layer1), id(j3_icon_layer2), id(btn_j3_action), id(icon_card_salon_j3), id(icon_card_light_j3), nullptr};
          g_day_slots[4] = {id(j4_day), id(j4_max), id(j4_min), id(j4_icon_layer1), id(j4_icon_layer2), id(btn_j4_action), id(icon_card_led_j4), id(icon_card_light_j4), nullptr};
          // Slots meteo heure.
          g_hour_slots[0] = {id(h4_time), id(h4_temp), id(h4_prob), id(h4_icon_layer1), id(h4_icon_layer2)};
          g_hour_slots[1] = {id(h3_time), id(h3_temp), id(h3_prob), id(h3_icon_layer1), id(h3_icon_layer2)};
          g_hour_slots[2] = {id(h2_time), id(h2_temp), id(h2_prob), id(h2_icon_layer1), id(h2_icon_layer2)};
          g_hour_slots[3] = {id(h1_time), id(h1_temp), id(h1_prob), id(h1_icon_layer1), id(h1_icon_layer2)};
          g_hour_slots[4] = {id(h0_time), id(h0_temp), id(h0_prob), id(h0_icon_layer1), id(h0_icon_layer2)};
      # Réveil : restaurer le plancher anti-re-sonnerie AVANT le premier calcul,
      # sinon un redémarrage juste après un arrêt referait sonner l'alarme dans
      # la fenêtre de grâce (ALARM_GRACE_S). tab5_alarm_refresh remplit ensuite
      # `g_alarm_cfg` depuis les entités déjà restaurées et repeint la pastille.
      - lambda: 'alarm_set_skip_floor(id(alarm_skip_before));'
      - script.execute: tab5_alarm_refresh
      - script.execute: tab5_central_rotator_auto
      # Pré-fetch calendrier : charge le mois courant + M+1 en arrière-plan pour
      # que le popup calendrier s'ouvre instantanément (stale-while-revalidate).
      - delay: 3s
      - script.execute: tab5_cal_prefetch_boot

interval:
  - interval: 5min
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.event:
                event: esphome.tab5_connected

# Plus d'images! image: !include supprimé au profit des polices C++ vectorielles LVGL

packages:
  tab5_ui_tokens: !include Tab5/tab5-ui-tokens.yaml
  tab5_hardware: !include Tab5/tab5-hardware.yaml
  tab5_sensors_diagnostics: !include Tab5/tab5-sensors-diagnostics.yaml
  tab5_sensors_domotique: !include Tab5/tab5-sensors-domotique.yaml
  tab5_api_logic: !include Tab5/tab5-api-logic.yaml
  tab5_styles: !include Tab5/tab5-styles.yaml
  tab5_globals: !include Tab5/tab5-globals.yaml
  tab5_scripts: !include Tab5/tab5-scripts.yaml
  tab5_lvgl: !include Tab5/tab5-lvgl.yaml
  tab5_imu: !include Tab5/tab5-imu.yaml
  # Entites exposees a HA pour piloter/observer l'ecran depuis un dashboard HA.
  # Charge APRES tab5_lvgl : ses lambdas referencent des ids de widgets LVGL.
  tab5_ha_controls: !include Tab5/tab5-ha-controls.yaml
  # Reveil matin + annonce des rendez-vous. Comme ci-dessus : APRES tab5_lvgl
  # (ses scripts referencent les ids de alarm_popup.yaml / alarm_ring_overlay.yaml).
  tab5_alarm: !include Tab5/tab5-alarm.yaml

captive_portal: