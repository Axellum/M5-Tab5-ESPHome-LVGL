# ============================================================================
# [AI-CONTEXT]
# @file tab5_emplacements.yaml
# @role Blueprint HA (lot 6a de l'audit « ouverture », ADR-0019 ; pièces, ADR-0023) :
#       choisir à la souris les appareils de l'écran du M5Stack Tab5. Une automatisation
#       par tablette. Elle :
#       - décrit les pièces (firmware 3.2 et plus, ADR-0023) : jusqu'à 5 pièces de 5
#         tuiles, une par page de la rangée du bas. Définitions (tab5_maj_tuiles :
#         type, icône, options, complément, nom) à la connexion, au rechargement des
#         automatisations et à la demande des zones ; puis états « tRT|état|valeur|couleur »
#         par tab5_maj_emplacements : tous après les définitions, une tuile quand son
#         appareil change, les capteurs (cap) avec les mesures lentes de 5 minutes ;
#       - pousse l'état des emplacements 3.x (action tab5_maj_emplacements, « clé|état|valeur;… ») :
#         tous à la connexion (esphome.tab5_connected) ; lumières, PC et TV quand ce que
#         montre l'écran change ; les mesures lentes (températures, humidités, pots,
#         batterie) groupées toutes les 5 minutes, celles qui ont changé seulement ;
#       - pousse la clim (tab5_maj_clim) et un volet qui signale sa course (tab5_maj_volet_etat) ;
#       - exécute les commandes de l'écran (événement esphome.tab5_action) : clés 3.x vers
#         l'entité choisie, tuiles (tRT) et pièces (pR) selon le DOMAINE de l'entité de la
#         tuile, jamais sur une entité qu'aucune tuile ne porte ;
#       - répond à la demande des zones (esphome.tab5_zones → tab5_maj_zones) : un
#         emplacement vide, ou dont l'entité n'existe pas, disparaît de l'écran (ADR-0018).
# @architecture_constraint Aucun placeholder : ce fichier est générique, il s'importe tel
#       quel. Les clés d'emplacement et les commandes sont celles du firmware
#       (tab5-api-logic.yaml, script tab5_action) ; tests/test_emplacements.py et
#       tests/test_tuiles_blueprint.py comparent (tableaux de l'ADR-0023 compris).
#       Les événements esphome.* n'exigent pas l'option « autoriser l'appareil à effectuer
#       des actions HA » (manager.py de l'intégration ESPHome).
#       Protocole (ADR-0023, Compatibilité) : la version du projet se lit dans le
#       sw_version de l'appareil (« 3.1.0 (ESPHome 2026.9.0) ») ; 3.2.0 ou plus =
#       tuiles ; en dessous, illisible ou aucune tablette = jamais tab5_maj_tuiles (une
#       action absente est une erreur que continue_on_error n'attrape pas).
# @ai_instruction Les entrées 3.x (lumiere_1..3, pc, volet) gardent leurs noms : des
#       automatisations existantes les référencent. Le bloc « icones » entre les
#       marqueurs est écrit par tools/gen_tuiles_icones.py : ne pas l'éditer à la main.
# ============================================================================
blueprint:
  name: "Tab5 — emplacements de l'écran"
  description: >-
    Choisissez les appareils de l'écran du M5Stack Tab5. Firmware 3.2 et plus : jusqu'à
    cinq pièces de cinq appareils, une par page de la rangée du bas (l'accueil, puis les
    pages atteintes d'un glissement) ; le nom, l'icône et le type de chaque tuile viennent
    de Home Assistant. Firmware 3.0 et 3.1 : les réglages 3.x (section repliée) servent
    toujours. Un emplacement laissé vide disparaît de l'écran, avec ses boutons. Une seule
    automatisation par tablette. Les états sont poussés à la connexion, puis à chaque
    changement visible ; les mesures (températures, humidités, plantes, batterie,
    capteurs des pièces) sont regroupées toutes les 5 minutes.
  domain: automation
  author: Axellum
  source_url: https://github.com/Axellum/M5-Tab5-ESPHome-LVGL/blob/main/HomeAssistant_Config/blueprints/automation/tab5/tab5_emplacements.yaml
  homeassistant:
    # Celle que demande le firmware 3.0 (clé API fournie par HA, docs/installation.md).
    # Elle couvre aussi les sélecteurs des pièces : objet à champs (2025.7) et entités
    # réordonnables (2025.8), relevés dans l'historique de homeassistant/helpers/selector.py.
    min_version: 2026.8.0
  input:
    # Pièce n ↔ page de la rangée du bas, dans l'ordre où un glissement les atteint
    # depuis l'accueil (ADR-0023) : R = n − 1.
    piece_1:
      name: "Pièce 1 — accueil (aujourd'hui → J+4)"
      icon: mdi:home
      description: >-
        Les cinq tuiles de l'accueil (firmware 3.2 et plus). Laissée vide, elle reprend
        les réglages de la section « Tuiles de l'accueil (réglage 3.x) ».
      input:
        piece_1_nom:
          name: Nom de la pièce
          description: Vide = l'aire de ses appareils, s'ils en ont une seule, sinon « Pièce 1 ».
          default: ""
          selector:
            text:
        piece_1_tuiles:
          name: Appareils
          description: >-
            Cinq au plus, dans l'ordre des tuiles (de gauche à droite). Lumières,
            interrupteurs, volets, lecteurs, scènes et scripts, capteurs, climatisation.
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: &domaines_tuiles
                    - light
                    - switch
                    - input_boolean
                    - fan
                    - humidifier
                    - automation
                    - cover
                    - valve
                    - media_player
                    - scene
                    - script
                    - button
                    - input_button
                    - sensor
                    - number
                    - input_number
                    - binary_sensor
                    - device_tracker
                    - person
                    - lock
                    - climate
    piece_2:
      name: "Pièce 2 — J+5 → J+9"
      icon: mdi:home-outline
      description: Un glissement vers la gauche depuis l'accueil.
      collapsed: true
      input:
        piece_2_nom:
          name: Nom de la pièce
          description: Vide = l'aire de ses appareils, s'ils en ont une seule, sinon « Pièce 2 ».
          default: ""
          selector:
            text:
        piece_2_tuiles:
          name: Appareils
          description: Cinq au plus, dans l'ordre des tuiles (de gauche à droite).
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: *domaines_tuiles
    piece_3:
      name: "Pièce 3 — J+10 → J+14"
      icon: mdi:home-outline
      description: Deux glissements vers la gauche depuis l'accueil.
      collapsed: true
      input:
        piece_3_nom:
          name: Nom de la pièce
          description: Vide = l'aire de ses appareils, s'ils en ont une seule, sinon « Pièce 3 ».
          default: ""
          selector:
            text:
        piece_3_tuiles:
          name: Appareils
          description: Cinq au plus, dans l'ordre des tuiles (de gauche à droite).
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: *domaines_tuiles
    piece_4:
      name: "Pièce 4 — prochaines heures"
      icon: mdi:home-outline
      description: Un glissement vers la droite depuis l'accueil.
      collapsed: true
      input:
        piece_4_nom:
          name: Nom de la pièce
          description: Vide = l'aire de ses appareils, s'ils en ont une seule, sinon « Pièce 4 ».
          default: ""
          selector:
            text:
        piece_4_tuiles:
          name: Appareils
          description: Cinq au plus, dans l'ordre des tuiles (de gauche à droite).
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: *domaines_tuiles
    piece_5:
      name: "Pièce 5 — heures suivantes"
      icon: mdi:home-outline
      description: Deux glissements vers la droite depuis l'accueil.
      collapsed: true
      input:
        piece_5_nom:
          name: Nom de la pièce
          description: Vide = l'aire de ses appareils, s'ils en ont une seule, sinon « Pièce 5 ».
          default: ""
          selector:
            text:
        piece_5_tuiles:
          name: Appareils
          description: Cinq au plus, dans l'ordre des tuiles (de gauche à droite).
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: *domaines_tuiles
    personnaliser:
      name: Personnaliser des tuiles
      icon: mdi:palette-outline
      description: >-
        Facultatif. Sans réglage, une tuile prend le nom de l'appareil (sans le nom de la
        pièce) et son icône dans Home Assistant.
      collapsed: true
      input:
        personnalisation:
          name: Personnalisations
          description: >-
            Une ligne par appareil. L'icône doit être dans la palette de l'écran ; sinon,
            celle de son type. « Confirmer » : un second appui dans les 3 s envoie la commande.
          default: []
          selector:
            object:
              multiple: true
              label_field: entite
              description_field: nom
              fields:
                entite:
                  label: Appareil
                  required: true
                  selector:
                    entity:
                      filter:
                        - domain: *domaines_tuiles
                nom:
                  label: Nom sur l'écran
                  selector:
                    text:
                icone:
                  label: Icône
                  selector:
                    icon:
                comportement:
                  label: Comportement
                  selector:
                    select:
                      mode: dropdown
                      options:
                        - label: Normal
                          value: normal
                        - label: Allumer seulement (jamais éteint depuis l'écran)
                          value: allumer_seulement
                        - label: Confirmer (un second appui dans les 3 s)
                          value: confirmer
                        - label: Lecture seule (aucun appui)
                          value: lecture_seule
    appareils:
      name: TV, téléphone
      icon: mdi:television
      input:
        tv:
          name: TV
          description: Le bouton « TV » ; placée dans une pièce, sa tuile ouvre la télécommande (appui long).
          default: []
          selector:
            entity:
              filter:
                - domain: media_player
        tv_telecommande:
          name: Télécommande de la TV
          description: Pour les touches du popup TV. Les applications passent par le script tab5_tv_app, s'il existe.
          default: []
          selector:
            entity:
              filter:
                - domain: remote
        telephone:
          name: Batterie du téléphone
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery
    temperatures:
      name: Températures
      icon: mdi:thermometer
      input:
        salon_temperature:
          name: Température de la pièce
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        salon_humidite:
          name: Humidité de la pièce
          description: Colore l'icône de la pièce.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        serre_temperature:
          name: Seconde température (serre)
          description: Sans elle, une manette ouvre l'arcade à sa place.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
    climatisation:
      name: Climatisation
      icon: mdi:air-conditioner
      input:
        clim:
          name: Climatisation
          description: − / consigne / + et le popup ; placée dans une pièce, sa tuile ouvre aussi le popup.
          default: []
          selector:
            entity:
              filter:
                - domain: climate
    plantes:
      name: Plantes
      icon: mdi:sprout
      description: >-
        Le capteur d'humidité de chaque pot. Conductivité, éclairement, température et
        batterie sont pris sur le même appareil (capteurs Flower Care et semblables).
      input:
        pot_1:
          name: Pot 1
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: moisture
        pot_2:
          name: Pot 2
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: moisture
        pot_3:
          name: Pot 3
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: moisture
        pot_4:
          name: Pot 4
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: moisture
        pot_5:
          name: Pot 5
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: moisture
    planning:
      name: Planning de travail
      icon: mdi:calendar-clock
      input:
        agenda_travail:
          name: Agenda de travail
          description: >-
            Sans agenda, le panneau planning sort de la carte centrale. Les horaires
            eux-mêmes viennent encore du package tab5_push.yaml (VOTRE_EMAIL).
          default: []
          selector:
            entity:
              filter:
                - domain: calendar
    # Réglage 3.x (ADR-0019) : les cinq places fixes de l'accueil. Lu par un firmware
    # 3.0/3.1, et par un firmware 3.2 tant que la pièce 1 est vide (ADR-0023).
    accueil_3x:
      name: Tuiles de l'accueil (réglage 3.x)
      icon: mdi:lightbulb-group
      description: >-
        Les cinq places fixes de l'accueil d'avant la 3.2 : PC ou TV, volet, trois lumières.
        Un firmware 3.0 ou 3.1 n'affiche que celles-ci ; un firmware 3.2 les montre tant
        que la pièce 1 est vide (et la tuile PC garde alors son comportement PC + TV).
      collapsed: true
      input:
        lumiere_1:
          name: Lumière 1 (tuile 3)
          default: []
          selector:
            entity:
              filter:
                - domain: light
        lumiere_2:
          name: Lumière 2 (tuile 4)
          default: []
          selector:
            entity:
              filter:
                - domain: light
        lumiere_3:
          name: Lumière 3 (tuile 5)
          default: []
          selector:
            entity:
              filter:
                - domain: light
        pc:
          name: PC
          description: >-
            Une prise ou un interrupteur (allumé par la tuile 1), ou un suivi de présence
            (affichage seul). La tuile 1 éteint la TV allumée, sinon allume PC et TV.
          default: []
          selector:
            entity:
              filter:
                - domain: [switch, input_boolean, device_tracker, binary_sensor]
        volet:
          name: Volet
          description: >-
            Tuile 2. Un volet qui signale sa course (opening/closing) est poussé ici ;
            avec le package volet_serre_tracking.yaml (volet qui ne la signale pas),
            c'est le package qui pousse son état. Laissez ici le volet que suit ce package,
            même s'il est aussi dans une pièce : ses commandes passent alors par le script
            du package et sa tuile montre l'état que le package tient.
          default: []
          selector:
            entity:
              filter:
                - domain: cover
    avance:
      name: Avancé
      icon: mdi:cog
      collapsed: true
      input:
        tablette:
          name: Nom de la tablette dans ESPHome
          description: Préfixe de ses actions (esphome.<nom>_tab5_maj_…). Ne changer que si l'appareil a été renommé.
          default: tab5_ha_hmi
          selector:
            text:

mode: queued
max: 25
max_exceeded: silent
# Les capteurs de plantes déclenchent souvent : avec les 5 traces par défaut, celle
# d'une commande de l'écran disparaît en quelques minutes.
trace:
  stored_traces: 20

variables:
