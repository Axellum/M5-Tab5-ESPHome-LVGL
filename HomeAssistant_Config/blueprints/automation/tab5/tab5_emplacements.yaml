      name: Zone à gauche de l'horloge · Left of the clock
      icon: mdi:view-carousel
      collapsed: true
      description: >-
        La colonne de gauche de l'accueil, au-dessus du cadre Ok Nabu (firmware 3.8 ou plus
        récent) : le micro et les boutons Domo / Discu, les prévisions des 15 heures qui
        viennent en graphique (les températures en courbe, la pluie en barres ; un tap
