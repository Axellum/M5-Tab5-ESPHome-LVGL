    not_from: [null]
    not_to: [null]
    id: reglable_vitesse
  - trigger: state
    entity_id: !input reglables
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: reglable_position
  # Volet suivi par le package volet_serre_tracking.yaml : son état est dans le
  # package (le moteur ne donne pas de position). Sans le package, ne se déclenche jamais.
  - trigger: state
    entity_id: input_text.volet_serre_etat
    id: volet_suivi
  # Volet choisi (ou remis à « Aucun ») dans la liste « Tab5 · volet à course simulée » :
  # volet_suivi change, les tuiles concernées et le volet de l'entrée Volet repartent
  # avec la bonne source d'état. Sans le package, ne se déclenche jamais.
  - trigger: state
    entity_id: select.tab5_volet_a_course_simulee
    to: ~
    id: volet_choisi
  # Pipeline de discussion choisi, ou remis à « Aucun » (liste du package) : la réponse
  # des zones repart, sans attendre que la tablette la redemande (boutons Domo / Discu).
  # Sans la liste (package plus ancien), ne se déclenche jamais.
  - trigger: state
    entity_id: select.tab5_pipeline_de_discussion
    id: pipeline_discussion
  # Téléphone, températures, humidité de la pièce, pots et tuiles « mesures » : voir
  # cles_mesures et types_mesures.
  - trigger: time_pattern
    minutes: "/5"
    id: mesures
  # Automatisation créée ou modifiée (un emplacement changé, par exemple) alors que
  # la tablette est déjà connectée : tout repousser, zones comprises, sans attendre
  # sa reconnexion. Dans l'ordre « Sans compiler » du guide, elle est créée après
  # l'ajout de la tablette : l'écran restait vide jusqu'à la reconnexion suivante
  # (test « HA neuf », 28/09/2026). L'événement suit tout rechargement des
  # automatisations : une poussée de plus, sans effet visible.
  - trigger: event
    event_type: automation_reloaded
    id: rechargement
  # Bouton « MAJ Écran » de la console système (événement de la tablette, ADR-0025) :
  # il relançait la poussée complète de tab5_push.yaml, pas les emplacements ni les
  # tuiles ; même traitement qu'un rechargement, zones comprises.
  - trigger: event
    event_type: esphome.tab5_maj_ecran
    id: maj_ecran
  # Démarrage de HA : la tablette, restée allumée, se reconnecte souvent AVANT que les
  # automatisations soient actives ; son tab5_connected est alors perdu (HA 2026.9.4
  # le 28/09/2026 : entités de la tablette revenues à 21:11:12, tab5_connected vers
  # 21:11:14, automatisations actives à 21:11:16, aucune exécution jusqu'au
  # rechargement de 21:13). Un appareil changé pendant la coupure restait faux à
  # l'écran jusqu'à son prochain changement. Ce déclencheur part au moment où les
  # automatisations deviennent actives et rejoue la connexion perdue : définitions,
  # tous les états, clim, volet. Pas les zones : la tablette ne les demande qu'avec la
  # première poussée des prévisions (tab5-api-logic.yaml), qui vient d'une
  # automatisation active. Tablette pas encore reconnectée : la condition « tablette
  # connectée » arrête ici, et son tab5_connected, émis plus tard, sera entendu. Pas de
  # délai : les variables (tuiles, protocole) sont calculées au déclenchement ; une
  # entité d'une intégration encore en chargement revient seule (redefinir, ou le
  # déclencheur de son emplacement).
  - trigger: homeassistant
    event: start
    id: demarrage_ha
  # Météo choisie dans le blueprint (section « Météo », variable meteo_a_ecrire) : écrite
  # dans les listes du package à l'enregistrement de l'automatisation, au démarrage de HA,
  # et remise quand quelqu'un change une liste. Des déclencheurs À PART (mêmes événements
  # que rechargement et demarrage_ha, un passage de plus) : ceux-là s'arrêtent sans
  # tablette connectée, les listes doivent suivre quand même. Champs vides, ou listes déjà
  # à jour : arrêt aux conditions, sans ligne au journal. `to: ~` : l'état seulement (la
  # liste des options d'un input_select peut changer au rechargement).
  - trigger: event
    event_type: automation_reloaded
    id: meteo_rechargement
  - trigger: homeassistant
    event: start
    id: meteo_demarrage
  - trigger: state
    entity_id:
      - input_text.tab5_meteo_previsions
      - input_select.tab5_source_pluie
      - input_select.tab5_source_vigilance
    to: ~
    id: meteo_liste

conditions:
  # Garde d'origine (audit sécurité du 30/09/2026) : un événement esphome.tab5_* ne
  # compte que s'il vient d'une tablette, reconnue au modèle de son appareil comme dans
  # packages/tab5_evenements.yaml. Sans elle, n'importe quel autre appareil ESPHome de
  # la maison pouvait émettre esphome.tab5_action et piloter toutes les tuiles. Un
  # événement sans device_id (tiré à la main) ou dont le device_id est une entité est
  # ignoré ; `| string` parce que device_attr() refuse autre chose qu'un texte. Les
  # autres déclencheurs (état, heure, démarrage, rechargement) passent.
  # tests/test_garde_origine.py vérifie cette garde sur chaque automatisation.
  - condition: template
    value_template: >-
      {%- from 'tab5_tablette.jinja' import tab5_origine -%}
      {{ tab5_origine(trigger) == 'oui' }}
  # Rien de neuf pour l'écran (aucune mesure changée, attribut invisible, tuile d'un
  # firmware qui n'en a pas) : arrêt ici, sans ligne au journal. Météo (meteo_declencheurs) :
  # seulement s'il y a une liste à écrire.
  - condition: template
    value_template: >-
      {%- if trigger.id in meteo_declencheurs -%}
        {{ meteo_a_ecrire | count > 0 }}
      {%- else -%}
        {{ trigger.id in ['connexion', 'zones', 'action', 'clim', 'volet', 'volet_choisi', 'pipeline_discussion', 'energie', 'historique', 'lecteur', 'cameras'] or cles | count > 0
           or solaire_a_pousser
           or (protocole == 2 and (redefinir or tuiles_a_pousser | count > 0 or reglables_a_pousser | count > 0
                                   or pieces_climat_a_pousser | count > 0)) }}
      {%- endif -%}
  # Déclencheurs venus de HA (rechargement, démarrage, mesures, changements d'état) : seulement
  # si une tablette est connectée, sinon « Action … not found » (pas encore ajoutée)
  # ou « Not connected » (hors ligne). Elle est trouvée par le modèle de l'appareil
  # (bloc `project:` du firmware), pas par son nom. Les événements de la tablette
  # prouvent d'eux-mêmes qu'elle est là. La météo (meteo_declencheurs) n'écrit que dans HA.
  - condition: template
    value_template: >-
      {%- from 'tab5_tablette.jinja' import tab5_connectee -%}
      {{ trigger.id in ['connexion', 'zones', 'action', 'maj_ecran', 'energie', 'historique', 'lecteur', 'cameras'] + meteo_declencheurs
         or tab5_connectee() == 'oui' }}

actions:
  - variables:
      # « clé|état|valeur; » : état tel quel, valeur = luminosité (lampes) ou nombre de
      # l'état (capteurs), nan sinon. Une entité absente n'est pas poussée (zone absente).
      payload: >-
        {%- set ns = namespace(r='') -%}
        {%- for c in cles -%}
          {%- set x = sources.get(c, '') -%}
          {%- if x and states[x] is not none -%}
            {%- if c.startswith('lumiere_') -%}
              {%- set v = state_attr(x, 'brightness') | float('nan') -%}
            {%- elif c in ['pc', 'tv'] -%}
              {%- set v = 'nan' -%}
            {%- else -%}
              {%- set v = states(x) | float('nan') -%}
            {%- endif -%}
            {%- set ns.r = ns.r ~ c ~ '|' ~ (states(x) | replace('|', '/') | replace(';', ',')) ~ '|' ~ v ~ ';' -%}
          {%- endif -%}
        {%- endfor -%}
        {#- Gestes de l'horloge et des boutons du haut (variables appuis, puis gestes),
            défilement au choix (variable defil) et zone à gauche de l'horloge (variable
            gauche, ADR-0051) et télécommandes du popup (variable telecommandes_pousse,
            ADR-0056), avec tous les états. Un firmware sans ces choix ignore les clés (clé
            inconnue). -#}
        {%- if tout_pousser -%}
          {%- set ns.r = ns.r ~ appuis ~ gestes ~ defil ~ gauche ~ telecommandes_pousse -%}
        {%- endif -%}
        {#- Icône solaire du bandeau : « solaire|pourcentage; » (voir solaire_a_pousser). Un
            firmware sans cette icône ignore la clé (clé inconnue). -#}
        {%- if solaire_a_pousser -%}
          {%- set ns.r = ns.r ~ 'solaire|' ~ solaire_pourcent ~ ';' -%}
        {%- endif -%}
        {{ ns.r }}
      absentes: >-
        {%- set ns = namespace(l=[]) -%}
        {%- for c in cles_zones -%}
          {%- if c == 'discussion' -%}
            {#- Pas une entrée : la liste « Tab5 · pipeline de discussion ». « Aucun » masque
                les boutons Domo / Discu ; sans la liste (package plus ancien), ils restent. -#}
            {%- if states('select.tab5_pipeline_de_discussion') == 'Aucun' -%}{%- set ns.l = ns.l + [c] -%}{%- endif -%}
          {%- else -%}
            {%- set x = sources.get(c, '') -%}
            {%- if not x or states[x] is none -%}{%- set ns.l = ns.l + [c] -%}{%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | join(',') }}
      clim: "{{ sources.clim if sources.clim and states[sources.clim] is not none else '' }}"
      volet: "{{ sources.volet if sources.volet and states[sources.volet] is not none else '' }}"
      # Réglages des clims (ADR-0026) : entité → « min|max|pas|unité|capacités|nom », pour
      # la clim du blueprint (clé climr), pour chaque clim de tuile (clé crRT, ADR-0027) et
      # de pièce (clé crpR, ADR-0040) : une seule traduction pour toutes. Un firmware plus
      # ancien ignore ces clés (clé inconnue) ; sans climr, le nouveau garde 16-30, 0,5, °C
      # et tous les boutons.
      # Unité : celle d'une entité weather.*, qui suit le système d'unités de HA comme les
      # attributs de la clim (min_temp, temperature…) ; sans météo, une borne basse de 40
      # ou plus ne peut être qu'en °F. Pas : target_temp_step, sinon 1 en °F, 0,5 en °C.
      # Capacités : une lettre par bouton de l'écran que l'appareil sait faire (ADR-0026).
      reglages_clims: >-
        {%- set ns = namespace(d={}) -%}
        {%- set u = namespace(s='') -%}
        {%- for w in states.weather if not u.s -%}
          {%- set t = w.attributes.get('temperature_unit', '') | string -%}
          {%- if t in ['°C', '°F'] -%}{%- set u.s = t -%}{%- endif -%}
        {%- endfor -%}
        {%- for e in ([clim] if clim else []) + (tuiles_clim | map(attribute='e') | list)
                     + (pieces_climat | map(attribute='clim') | select | list) -%}
          {%- if e not in ns.d and states[e] is not none -%}
            {%- set mn = state_attr(e, 'min_temp') | float(16.0) -%}
            {%- set mx = state_attr(e, 'max_temp') | float(30.0) -%}
            {%- set unite = u.s if u.s else ('°F' if mn >= 40 else '°C') -%}
            {%- set pas = state_attr(e, 'target_temp_step') | float(0) -%}
            {%- set pas = pas if pas > 0 else (1.0 if unite == '°F' else 0.5) -%}
            {%- set hvac = state_attr(e, 'hvac_modes') or [] -%}
            {%- set pm = state_attr(e, 'preset_modes') or [] -%}
            {%- set fm = state_attr(e, 'fan_modes') or [] -%}
            {%- set sm = state_attr(e, 'swing_modes') or [] -%}
            {%- set capacites = ('c' if 'cool' in hvac else '')
                              ~ ('h' if 'heat' in hvac else '')
                              ~ ('d' if 'dry' in hvac else '')
                              ~ ('f' if 'fan_only' in hvac else '')
                              ~ ('e' if clim_eco | select('in', pm) | list | count > 0 else '')
                              ~ ('b' if 'boost' in pm else '')
                              ~ ('q' if clim_silence | select('in', fm) | list | count > 0 else '')
                              ~ ('s' if clim_oscillation | select('in', sm) | list | count > 0
                                       and clim_arret_oscillation | select('in', sm) | list | count > 0 else '')
                              ~ ('w' if 'windnice' in sm else '') -%}
            {%- set nom = (state_attr(e, 'friendly_name') or '') | string | replace('|', '/') | replace(';', ',') -%}
            {%- set ns.d = dict(ns.d, **{e: mn ~ '|' ~ mx ~ '|' ~ pas ~ '|' ~ unite ~ '|' ~ capacites ~ '|' ~ nom}) -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.d }}
      # « climr|…; », poussée par tab5_maj_emplacements juste avant tab5_maj_clim.
      clim_reglages: "{{ ('climr|' ~ reglages_clims[clim] ~ ';') if clim in reglages_clims else '' }}"
      # Les réglages d'une clim ont-ils pu changer à ce déclenchement ? Elle apparaît,
      # revient d'une panne, ou l'un des attributs de clim_attributs_reglages change (pas
      # à chaque degré de la pièce). Faux hors d'un changement d'état. Pour climr (branche
      # « Clim : son état a changé ») et crRT (clims des tuiles).
      reglages_changes: >-
        {%- if trigger.from_state is defined and trigger.to_state is defined -%}
          {%- set avant = trigger.from_state -%}
          {%- set apres = trigger.to_state -%}
          {%- set ns = namespace(v=avant is none or apres is none or avant.state in ['unavailable', 'unknown']) -%}
          {%- for a in clim_attributs_reglages if not ns.v -%}
            {%- if avant.attributes.get(a) != apres.attributes.get(a) -%}{%- set ns.v = true -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.v }}
        {%- else -%}
          {{ false }}
        {%- endif -%}
  - choose:
      # Section « Météo » remplie (variable meteo_a_ecrire) : son choix écrit dans les
      # listes du package, que lisent les capteurs et les poussées (tab5_push.yaml suit
      # sensor.tab5_meteo, sensor.tab5_pluie_dans_l_heure et sensor.tab5_vigilance). Une
      # liste changée à la main revient à ce choix : une notification le dit (une seule,
      # remplacée à chaque fois), pour que les deux réglages ne se contredisent pas en
      # silence.
      - alias: "Météo choisie dans le blueprint : l'écrire dans les listes « Tab5 · … »"
        conditions: "{{ trigger.id in meteo_declencheurs }}"
        sequence:
          - repeat:
              for_each: "{{ meteo_a_ecrire }}"
              sequence:
                - if: "{{ repeat.item.entite.startswith('input_text.') }}"
                  then:
                    - action: input_text.set_value
                      target:
                        entity_id: "{{ repeat.item.entite }}"
                      data:
                        value: "{{ repeat.item.valeur }}"
                  else:
                    - action: input_select.select_option
                      target:
                        entity_id: "{{ repeat.item.entite }}"
                      data:
                        option: "{{ repeat.item.valeur }}"
          - if: "{{ trigger.id == 'meteo_liste' }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: tab5_meteo_blueprint
                  title: "Tab5 — météo choisie dans le blueprint · weather picked in the blueprint"
                  message: |-
                    {%- set noms = {'input_text.tab5_meteo_previsions': 'Tab5 · source des prévisions',
                                    'input_select.tab5_source_pluie': "Tab5 · source de la pluie dans l'heure",
                                    'input_select.tab5_source_vigilance': 'Tab5 · source des vigilances'} -%}
                    {%- set auto = this.attributes.friendly_name | default('Tab5 — emplacements', true) %}
                    {% for e in meteo_a_ecrire -%}
                    - « {{ noms.get(e.entite, e.entite) }} » → {{ e.valeur }}
                    {% endfor %}
                    Ce choix est fait dans l'automatisation « {{ auto }} » (section Météo) : la liste y revient. Pour choisir dans la liste, videz ce champ de l'automatisation.

                    This choice is made in the « {{ auto }} » automation (Weather section): the list goes back to it. To choose in the list, empty that field of the automation.
      # Aussi quand le pipeline de discussion change : même réponse, sans attendre la
      # demande de la tablette (une fois par connexion).
      # Popup Énergie (ADR-0028) : la tablette dit quelle vue elle montre ; le script du
      # package tab5_energie pousse l'historique et l'instantané tant qu'il reste ouvert
      # (script.turn_on : sans attendre, la file de cette automatisation reste libre).
      # Section vide : une réponse vide, le popup dit qu'aucun capteur n'est choisi. Sans
      # le package : rien, le popup attend.
      - alias: "La tablette ouvre le popup Énergie"
        conditions: "{{ trigger.id == 'energie' }}"
        sequence:
          - if: "{{ energie_capteurs | count == 0 }}"
            then:
              - action: "esphome.{{ tablette }}_tab5_maj_energie"
                data:
                  payload: "|||||||"
                continue_on_error: true
            else:
              - if: "{{ states['script.tab5_energie'] is not none }}"
                then:
                  - action: script.turn_on
                    target:
                      entity_id: script.tab5_energie
                    data:
                      variables:
                        appareil: "{{ trigger.event.data.device_id | default('', true) | string }}"
                        tablette: "{{ tablette }}"
                        vue: "{{ trigger.event.data.vue | default('heures', true) }}"
                        capteurs: >-
                          {{ dict(energie, solaires=energie_solaires, productions=energie_productions,
                                  reseau_inverse=energie_reseau_inverse | bool(false),
                                  batterie_inverse=energie_batterie_inverse | bool(false)) }}

      # Popup Caméras (ADR-0049) : la tablette demande ses caméras à l'ouverture, puis toutes
      # les 4 minutes et après un échec tant qu'il reste ouvert. La réponse donne le
      # entity_picture du moment : son jeton change toutes les 5 minutes et l'ancien reste
      # valable 5 minutes de plus (homeassistant/components/camera), la tablette n'a donc
      # jamais une URL périmée. ADR-0057 : chaque caméra porte sa pièce (area_name : celle
      # de l'entité, sinon de son appareil ; vide sans pièce) et, si elle est
      # « unavailable », l'heure depuis laquelle (last_changed, secondes Unix) : la
      # tablette ne la demande pas et dit « Hors ligne depuis … ». « nom|image|pièce|depuis » :
      # un firmware d'avant lit « nom|image » et ignore la suite. Une caméra ni en ligne
      # avec une image, ni indisponible (supprimée, pas encore chargée) est sautée ; seize
      # au plus. Section vide : une réponse vide, le popup dit qu'aucune caméra n'est
      # choisie. Pas de script ni de package : une seule action.
      - alias: "La tablette demande ses caméras"
        conditions: "{{ trigger.id == 'cameras' }}"
        sequence:
          - action: "esphome.{{ tablette }}_tab5_maj_cameras"
            data:
              adresse: "{{ cameras_adresse | default('', true) | string | trim }}"
              cameras: >-
                {%- set l = cameras_liste if cameras_liste is list else ([cameras_liste] if cameras_liste else []) -%}
                {%- set ns = namespace(r=[]) -%}
                {%- for c in l if c is string and states[c] is not none -%}
                  {%- set image = state_attr(c, 'entity_picture') or '' -%}
                  {%- set hors = states(c) == 'unavailable' -%}
                  {%- if image or hors -%}
                    {%- set nom = (state_attr(c, 'friendly_name') or c) | string | replace('|', '/') | replace(';', ',') -%}
                    {%- set piece = (area_name(c) or '') | string | replace('|', '/') | replace(';', ',') -%}
                    {%- set depuis = (as_timestamp(states[c].last_changed, 0) | int(0)) if hors else '' -%}
                    {%- set ns.r = ns.r + [nom ~ '|' ~ image ~ '|' ~ piece ~ '|' ~ depuis] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.r[:16] | join(';') }}
            continue_on_error: true

      # Popup Température (ADR-0032) : la tablette dit quelle température (salon, serre) et
      # quelle vue (jour, semaine, mois) elle montre ; le script du package tab5_historique
      # lit les statistiques du recorder et la prévision, et pousse la série
      # (script.turn_on : sans attendre, la file de cette automatisation reste libre). Sans
      # le package : rien, le popup attend.
      # Clés p0 à p4 (ADR-0040) : la température d'une pièce en mode HA, sa sonde de la
      # section « Pièce R + 1 ». Humidité (ADR-0047) : celle du salon (« Salon —
      # humidité ») ou de la pièce, tracée avec la température ; aucune pour la serre.
      - alias: "La tablette ouvre l'historique d'une température"
        conditions: "{{ trigger.id == 'historique' }}"
        sequence:
          - variables:
              h_cle: "{{ trigger.event.data.cle | default('') | string }}"
              h_piece: >-
                {{ pieces_climat | selectattr('r', 'eq', (h_cle[1:] | int(-1)) if h_cle[:1] == 'p' else -1)
                   | first | default({}, true) }}
              h_capteur: >-
                {%- if h_cle in ['salon', 'serre'] -%}{{ sources.get(h_cle, '') }}
                {%- else -%}{{ h_piece.get('temperature', '') }}
                {%- endif -%}
              h_humidite: >-
                {%- if h_cle == 'salon' -%}{{ sources.get('salon_hum', '') }}
                {%- elif h_cle == 'serre' -%}{{ '' }}
                {%- else -%}{{ h_piece.get('humidite', '') }}
                {%- endif -%}
          - if: >-
              {{ states['script.tab5_historique'] is not none
                 and h_cle in ['salon', 'serre', 'p0', 'p1', 'p2', 'p3', 'p4'] }}
            then:
              - action: script.turn_on
                target:
                  entity_id: script.tab5_historique
                data:
                  variables:
                    tablette: "{{ tablette }}"
                    cle: "{{ h_cle }}"
                    vue: "{{ trigger.event.data.vue | default('jour', true) }}"
                    capteur: "{{ h_capteur }}"
                    exterieur: "{{ h_cle == 'serre' and serre_exterieure | bool(false) }}"
                    humidite: "{{ h_humidite }}"

      # Popup Musique (ADR-0050) : l'appui long d'une tuile med sans option t ouvre le
      # lecteur de musique sur le media_player de la tuile. Le blueprint est la liste
      # blanche : une clé sans tuile, ou dont l'entité n'est pas un media_player, ne montre
      # rien de neuf (le package pousse alors le lecteur courant). Les autres actions de
      # l'événement (commandes, choix d'un lecteur) sont au package : rien ici, et
      # l'événement s'arrête dans cette branche (jamais dans la branche par défaut).
      - alias: "La tablette ouvre le lecteur de musique depuis une tuile"
        conditions: "{{ trigger.id == 'lecteur' }}"
        sequence:
          - variables:
              l_cle: >-
                {{ (trigger.event.data.lecteur | default('') | string)
                   if (trigger.event.data.action | default('')) == 'ouvrir' else '' }}
              l_tuile: >-
                {{ tuiles | selectattr('cle', 'eq', l_cle) | list | first | default({}, true)
                   if l_cle[:1] == 't' else {} }}
              l_entite: >-
                {{ l_tuile.e if (l_tuile.e | default('') | string).startswith('media_player.')
                   and states[l_tuile.e] is not none else '' }}
          - if: "{{ states['script.tab5_lecteur_montrer'] is not none and l_entite != '' }}"
            then:
              - action: script.turn_on
                target:
                  entity_id: script.tab5_lecteur_montrer
                data:
                  variables:
                    entite: "{{ l_entite }}"

      - alias: "La tablette demande quelles zones sont absentes"
        conditions: "{{ trigger.id in ['zones', 'pipeline_discussion'] }}"
        sequence:
          - action: "esphome.{{ tablette }}_tab5_maj_zones"
            data:
              absentes: "{{ absentes }}"
            continue_on_error: true

      - alias: "Commande d'un bouton de l'écran"
        conditions: "{{ trigger.id == 'action' }}"
        sequence:
          - variables:
              emplacement: "{{ trigger.event.data.emplacement | default('') }}"
              commande: "{{ trigger.event.data.action | default('') }}"
              valeur: "{{ trigger.event.data.valeur | default('') }}"
              cible: "{{ sources.get(emplacement, '') }}"
              # Popup télécommande (ADR-0056) : « tv », « tv1 »… = la télécommande de ce rang
              # (variable telecommandes), si elle existe encore ; « boitier » = l'intégration
              # Apple TV, dont les touches sont traduites (telecommande_apple_tv).
              tc_rang: "{{ telecommande_emplacements.index(emplacement) if emplacement in telecommande_emplacements else -1 }}"
              tc_entite: >-
                {{ telecommandes[tc_rang] if 0 <= tc_rang < telecommandes | length
                   and states[telecommandes[tc_rang]] is not none else '' }}
              tc_boitier: "{{ tc_entite != '' and tc_entite in integration_entities('apple_tv') }}"
              # Tuile tRT (ADR-0023) : son entité, si elle existe encore. Le blueprint
              # est la liste blanche : une clé sans tuile ne commande rien.
              tuile: "{{ tuiles | selectattr('cle', 'eq', emplacement) | first | default({}, true) }}"
              t_entite: "{{ tuile.e if tuile and states[tuile.e] is not none else '' }}"
              t_domaine: "{{ t_entite.split('.')[0] if t_entite else '' }}"
              # Comportement personnalisé : lecture seule = rien ; allumer seulement =
              # basculer allume, éteindre ne fait rien (le firmware n'envoie déjà que
              # « allumer », ceci en est la garde côté HA).
              t_commande: >-
                {%- set c = perso.get(t_entite, {}).get('comportement', 'normal') if t_entite else 'lecture_seule' -%}
                {%- if c == 'lecture_seule' -%}
                {%- elif c == 'allumer_seulement' and commande in ['basculer', 'allumer'] -%}allumer
                {%- elif c == 'allumer_seulement' and commande == 'eteindre' -%}
                {%- else -%}{{ commande }}
                {%- endif -%}
              # Appareil de la tuile − / + (rN, ADR-0033) : son entité, si elle existe
              # encore. La liste reglables est la liste blanche : une clé rN qui n'y est
              # pas ne commande rien.
              reglable: "{{ reglables | selectattr('cle', 'eq', emplacement) | first | default({}, true) }}"
              r_entite: "{{ reglable.e if reglable and states[reglable.e] is not none else '' }}"
              r_domaine: "{{ r_entite.split('.')[0] if r_entite else '' }}"
              # Clim visée par le popup (ADR-0027) : celle du blueprint (emplacement
              # « clim »), ou celle d'une tuile (tRT dont l'entité est une clim : la liste
              # blanche reste « une entité qu'une tuile porte »). Les mêmes branches
              # « Clim : … » traduisent pour les deux. Une clim de la tuile − / + (rN,
              # ADR-0033) aussi, pour sa consigne seulement. Et la clim d'une pièce
              # (emplacement « cpR », ADR-0040), si la section « Pièce R + 1 » en déclare une.
              p_clim: "{{ pieces_climat | selectattr('cle', 'eq', emplacement) | map(attribute='clim') | first | default('', true) }}"
              clim_cible: >-
                {%- if emplacement == 'clim' -%}{{ clim }}
                {%- elif t_domaine == 'climate' -%}{{ t_entite }}
                {%- elif r_domaine == 'climate' and commande == 'consigne' -%}{{ r_entite }}
                {%- elif p_clim -%}{{ p_clim }}
                {%- endif -%}
              # Sa commande : telle quelle pour la clim du blueprint, celle de la tuile
              # − / + et celle d'une pièce ; pour une tuile, après son comportement (lecture
              # seule : rien ; allumer seulement : pas d'arrêt).
              clim_commande: "{{ commande if emplacement == 'clim' or r_domaine == 'climate' or p_clim else t_commande }}"
          - choose:
              - alias: "Lumière : basculer"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'basculer' and cible != '' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: "{{ cible }}"
              - alias: "Lumière : luminosité 0-255"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'luminosite' and cible != '' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ cible }}"
                    data:
                      brightness: "{{ valeur | int(0) }}"
              - alias: "Lumière : luminosité en %"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'luminosite_pct' and cible != '' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ cible }}"
                    data:
                      brightness_pct: "{{ valeur | int(0) }}"
              - alias: "Lumière : couleur"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'couleur' and cible != '' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ cible }}"
                    data:
                      color_name: "{{ valeur }}"
              - alias: "Tout éteindre"
                conditions: "{{ emplacement == 'lumieres' and commande == 'eteindre' }}"
                sequence:
                  - variables:
                      # Pas de filtre `extract` dans le Jinja de HA (c'est un filtre Ansible).
                      # Mêmes lampes épargnées que « Pièce : tout éteindre » (personnalisation
                      # de la tuile de la même entité) : voir cette branche.
                      lampes: >-
                        {%- set ns = namespace(l=[]) -%}
                        {%- for c in ['lumiere_1', 'lumiere_2', 'lumiere_3'] -%}
                          {%- set x = sources.get(c, '') -%}
                          {%- if x and states[x] is not none
                                and perso.get(x, {}).get('comportement', 'normal') not in ['allumer_seulement', 'confirmer', 'lecture_seule'] -%}
                            {%- set ns.l = ns.l + [x] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.l }}
                  - if: "{{ lampes | count > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ lampes }}"
              # La tuile PC d'un accueil construit depuis les entrées 3.x (t00 venu de
              # l'entrée PC) garde ce comportement.
              - alias: "PC : la TV allumée s'éteint, sinon PC et TV s'allument"
                conditions: >-
                  {{ (emplacement == 'pc' and commande == 'basculer')
                     or (tuile.get('s', '') == 'pc' and t_commande == 'basculer') }}
                sequence:
                  - variables:
                      tv: "{{ sources.tv }}"
                      pc: "{{ sources.pc }}"
                  - choose:
                      - conditions: "{{ tv != '' and states(tv) in ['on', 'idle', 'playing', 'paused'] }}"
                        sequence:
                          - action: media_player.turn_off
                            target:
                              entity_id: "{{ tv }}"
                    default:
                      - if: "{{ pc != '' and pc.split('.')[0] in ['switch', 'input_boolean'] and states[pc] is not none }}"
                        then:
                          - action: homeassistant.turn_on
                            target:
                              entity_id: "{{ pc }}"
                      - if: "{{ tv != '' and states[tv] is not none }}"
                        then:
                          - action: media_player.turn_on
                            target:
                              entity_id: "{{ tv }}"
              # Clim (ADR-0026) : l'écran parle comme la Daikin de l'auteur ; chaque branche
              # envoie le mode équivalent que l'appareil connaît, ou rien (une valeur
              # inconnue de l'appareil est une erreur de HA). Clim du blueprint ou d'une
              # tuile (ADR-0027) : clim_cible, même traduction.
              - alias: "Clim : consigne (bornée ; éteinte : froid, sinon chaud, chaud/froid, auto)"
                conditions: "{{ clim_commande == 'consigne' and clim_cible != '' }}"
                sequence:
                  - variables:
                      # HA refuse une consigne hors de min_temp / max_temp.
                      consigne: >-
                        {%- set t = valeur | float(20) -%}
                        {%- set mn = state_attr(clim_cible, 'min_temp') | float(t) -%}
                        {%- set mx = state_attr(clim_cible, 'max_temp') | float(t) -%}
                        {{ [[t, mn] | max, mx] | min }}
                      # Allumée : son mode. Éteinte (Daikin refuse set_temperature en off) : le
                      # premier mode de consigne qu'elle connaît, froid d'abord comme avant ;
                      # aucun : sans hvac_mode.
                      mode_consigne: >-
                        {%- if states(clim_cible) in ['off', 'unknown', 'unavailable'] -%}
                          {{ clim_modes_consigne | select('in', state_attr(clim_cible, 'hvac_modes') or []) | first | default('') }}
                        {%- else -%}
                          {{ states(clim_cible) }}
                        {%- endif -%}
                  - if: "{{ mode_consigne != '' }}"
                    then:
                      - action: climate.set_temperature
                        target:
                          entity_id: "{{ clim_cible }}"
                        data:
                          temperature: "{{ consigne }}"
                          hvac_mode: "{{ mode_consigne }}"
                    else:
                      - action: climate.set_temperature
                        target:
                          entity_id: "{{ clim_cible }}"
                        data:
                          temperature: "{{ consigne }}"
              - alias: "Clim : éteindre"
                conditions: "{{ clim_commande == 'eteindre' and clim_cible != '' }}"
                sequence:
                  - action: climate.turn_off
                    target:
                      entity_id: "{{ clim_cible }}"
              - alias: "Clim : mode (s'il existe sur l'appareil)"
                conditions: >-
                  {{ clim_commande == 'mode' and clim_cible != ''
                     and valeur in (state_attr(clim_cible, 'hvac_modes') or []) }}
                sequence:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: "{{ clim_cible }}"
                    data:
                      hvac_mode: "{{ valeur }}"
              - alias: "Clim : préréglage (Éco = eco ou away ; aucun = none, home ou comfort)"
                conditions: "{{ clim_commande == 'preset' and clim_cible != '' }}"
                sequence:
                  - variables:
                      preset: >-
                        {%- set pm = state_attr(clim_cible, 'preset_modes') or [] -%}
                        {%- if valeur == 'away' -%}
                          {{ clim_eco | select('in', pm) | first | default('') }}
                        {%- elif valeur == 'none' -%}
                          {{ ['none', 'home', 'comfort'] | select('in', pm) | first | default('') }}
                        {%- elif valeur in pm -%}
                          {{ valeur }}
                        {%- endif -%}
                  - if: "{{ preset != '' }}"
                    then:
                      - action: climate.set_preset_mode
                        target:
                          entity_id: "{{ clim_cible }}"
                        data:
                          preset_mode: "{{ preset }}"
              - alias: "Clim : ventilation (silence : quiet, silence, low… ; auto, sinon moyenne)"
                conditions: "{{ clim_commande == 'ventilation' and clim_cible != '' }}"
                sequence:
                  - variables:
                      # Fin du silence (auto) : auto, sinon une vitesse moyenne, sinon le
                      # premier mode qui n'est pas un silence (sinon le premier tout court).
                      ventilation: >-
                        {%- set fm = (state_attr(clim_cible, 'fan_modes') or []) | list -%}
                        {%- if valeur == 'quiet' -%}
                          {{ clim_silence | select('in', fm) | first | default('') }}
                        {%- elif valeur == 'auto' -%}
                          {%- set bruyants = fm | reject('in', clim_silence) | list -%}
                          {{ ((['auto'] + clim_ventilation_normale) | select('in', fm) | list + bruyants + fm) | first | default('') }}
                        {%- endif -%}
                  - if: "{{ ventilation != '' }}"
                    then:
                      - action: climate.set_fan_mode
                        target:
                          entity_id: "{{ clim_cible }}"
                        data:
                          fan_mode: "{{ ventilation }}"
              - alias: "Clim : oscillation (arrêt : stop ou off ; marche : swing, on, both…)"
                conditions: "{{ clim_commande == 'oscillation' and clim_cible != '' }}"
                sequence:
                  - variables:
                      oscillation: >-
                        {%- set sm = state_attr(clim_cible, 'swing_modes') or [] -%}
                        {%- if valeur == 'stop' -%}
                          {{ clim_arret_oscillation | select('in', sm) | first | default('') }}
                        {%- elif valeur == 'swing' -%}
                          {{ clim_oscillation | select('in', sm) | first | default('') }}
                        {%- elif valeur == 'windnice' and 'windnice' in sm -%}
                          windnice
                        {%- endif -%}
                  - if: "{{ oscillation != '' }}"
                    then:
                      - action: climate.set_swing_mode
                        target:
                          entity_id: "{{ clim_cible }}"
                        data:
                          swing_mode: "{{ oscillation }}"
              - alias: "Télécommande : marche / arrêt"
                conditions: "{{ tc_rang >= 0 and commande == 'alimentation' }}"
                sequence:
                  - choose:
                      # Intégration Apple TV : remote.turn_on / turn_off ne font que connecter
                      # HA à l'appareil ; l'allumer ou le mettre en veille passe par les
                      # commandes turn_on / turn_off, selon l'état de son media_player.
                      - conditions: "{{ tc_boitier }}"
                        sequence:
                          - variables:
                              tc_lecteur: >-
                                {{ device_entities(device_id(tc_entite)) | select('match', 'media_player\\.')
                                   | first | default('') }}
                          - action: remote.send_command
                            target:
                              entity_id: "{{ tc_entite }}"
                            data:
                              command: >-
                                {{ 'turn_off' if tc_lecteur != '' and states(tc_lecteur) not in
                                   ['off', 'standby', 'unavailable', 'unknown'] else 'turn_on' }}
                            continue_on_error: true
                      - conditions: "{{ tc_entite != '' }}"
                        sequence:
                          - action: remote.toggle
                            target:
                              entity_id: "{{ tc_entite }}"
                      # Sans télécommande (blueprint rempli avant l'ADR-0056, ou rien de
                      # choisi) : la TV du bouton « TV », comme avant.
                      - conditions: "{{ tc_rang == 0 and sources.tv != '' and states[sources.tv] is not none }}"
                        sequence:
                          - action: media_player.toggle
                            target:
                              entity_id: "{{ sources.tv }}"
              - alias: "Télécommande : touche"
                conditions: "{{ tc_rang >= 0 and commande == 'touche' and tc_entite != '' }}"
                sequence:
                  - variables:
                      # Une touche sans équivalent (Source, Muet sur un boîtier) : rien.
                      tc_commande: "{{ telecommande_apple_tv.get(valeur, '') if tc_boitier else valeur }}"
                  - if: "{{ tc_commande != '' }}"
                    then:
                      - action: remote.send_command
                        target:
                          entity_id: "{{ tc_entite }}"
                        data:
                          command: "{{ tc_commande }}"
                        continue_on_error: true
              # Les applications de la TV choisie dans « Tab5 · TV Samsung » (une seule TV),
              # depuis la page d'une télécommande « tv ».
              - alias: "Télécommande : application (script tab5_tv_app, package tab5_tv.yaml)"
                conditions: "{{ tc_rang >= 0 and commande == 'appli' and states['script.tab5_tv_app'] is not none }}"
                sequence:
                  - action: script.tab5_tv_app
                    data:
                      app: "{{ valeur }}"
              - alias: "Volet : ouvrir, fermer, arrêter"
                conditions: "{{ emplacement == 'volet' and commande in ['ouvrir', 'fermer', 'arreter'] }}"
                sequence:
                  - variables:
                      sens: "{{ {'ouvrir': 'open', 'fermer': 'close', 'arreter': 'stop'}[commande] }}"
                  - choose:
                      - alias: "Volet suivi par le package (course simulée)"
                        conditions: "{{ volet_par_package }}"
                        sequence:
                          # script.turn_on : sans attendre la fin de la course (26 s). Appelé
                          # directement, le script retenait l'automatisation (mode queued) : la
                          # commande suivante, dont « arrêter », n'arrivait qu'une fois le volet au
                          # bout (vu le 28/09 : une lampe basculée 2 min après l'appui).
                          - action: script.turn_on
                            target:
                              entity_id: script.tab5_volet_action
                            data:
                              variables:
                                action: "{{ sens }}"
                      - alias: "Volet qui signale sa course"
                        conditions: "{{ volet != '' }}"
                        sequence:
                          - action: "cover.{{ sens }}_cover"
                            target:
                              entity_id: "{{ volet }}"

              # ---- Tuiles et pièces (ADR-0023), par domaine de l'entité de la tuile ----
              - alias: "Tuile : basculer, allumer, éteindre (lum, int, med)"
                conditions: >-
                  {{ t_commande in ['basculer', 'allumer', 'eteindre']
                     and t_domaine in ['light', 'switch', 'input_boolean', 'fan', 'humidifier', 'automation', 'media_player'] }}
                sequence:
                  - action: "{{ t_domaine }}.{{ {'basculer': 'toggle', 'allumer': 'turn_on', 'eteindre': 'turn_off'}[t_commande] }}"
                    target:
                      entity_id: "{{ t_entite }}"
              - alias: "Tuile : ouvrir, fermer, arrêter (vol)"
                conditions: "{{ t_commande in ['ouvrir', 'fermer', 'arreter'] and t_domaine in ['cover', 'valve'] }}"
                sequence:
                  - variables:
                      sens: "{{ {'ouvrir': 'open', 'fermer': 'close', 'arreter': 'stop'}[t_commande] }}"
                  - choose:
                      - alias: "Volet suivi par le package (course simulée)"
                        conditions: "{{ t_entite == volet_suivi }}"
                        sequence:
                          # script.turn_on : sans attendre la fin de la course (26 s). Appelé
                          # directement, le script retenait l'automatisation (mode queued) : la
                          # commande suivante, dont « arrêter », n'arrivait qu'une fois le volet au
                          # bout (vu le 28/09 : une lampe basculée 2 min après l'appui).
                          - action: script.turn_on
                            target:
                              entity_id: script.tab5_volet_action
                            data:
                              variables:
                                action: "{{ sens }}"
                    default:
                      - action: "{{ t_domaine }}.{{ sens }}_{{ t_domaine }}"
                        target:
                          entity_id: "{{ t_entite }}"
              # Popup du volet (05/10/2026, discussion #278) : le curseur envoie la position
              # 0-100 au relâcher (un nombre, sinon rien : jamais « 0 » = fermer par défaut).
              # Seulement à une entité qui sait la régler (bit 4, SET_POSITION, des
              # supported_features de cover comme de valve) ; jamais au volet à course
              # simulée du package (il n'a pas de position : la tablette n'a pas de curseur
              # pour lui, voir etats_tuiles).
              - alias: "Tuile : position 0-100 (vol, popup du volet)"
                conditions: >-
                  {{ t_commande == 'position' and t_domaine in ['cover', 'valve'] and t_entite != volet_suivi
                     and valeur is match('^[0-9]{1,3}$')
                     and (state_attr(t_entite, 'supported_features') | int(0)) // 4 % 2 == 1 }}
                sequence:
                  - action: "{{ t_domaine }}.set_{{ t_domaine }}_position"
                    target:
                      entity_id: "{{ t_entite }}"
                    data:
                      position: "{{ [valeur | int(0), 100] | min }}"
              - alias: "Tuile : lancer (act)"
                conditions: "{{ t_commande == 'lancer' and t_domaine in ['scene', 'script', 'button', 'input_button'] }}"
                sequence:
                  - action: >-
                      {{ {'scene': 'scene.turn_on', 'script': 'script.turn_on', 'button': 'button.press',
                          'input_button': 'input_button.press'}[t_domaine] }}
                    target:
                      entity_id: "{{ t_entite }}"
              - alias: "Tuile lumière : luminosité 0-255"
                conditions: "{{ t_commande == 'luminosite' and t_domaine == 'light' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ t_entite }}"
                    data:
                      brightness: "{{ valeur | int(0) }}"
              - alias: "Tuile lumière : luminosité en %"
                conditions: "{{ t_commande == 'luminosite_pct' and t_domaine == 'light' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ t_entite }}"
                    data:
                      brightness_pct: "{{ valeur | int(0) }}"
              - alias: "Tuile lumière : couleur"
                conditions: "{{ t_commande == 'couleur' and t_domaine == 'light' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ t_entite }}"
                    data:
                      color_name: "{{ valeur }}"
              - alias: "Pièce : tout éteindre (ses lumières)"
                conditions: "{{ emplacement is match('^p[0-4]$') and commande == 'eteindre' }}"
                sequence:
                  - variables:
                      # Épargnées : « allumer seulement » (jamais éteinte depuis l'écran),
                      # « lecture seule » (aucun appui) et « confirmer » (audit du 07/10/2026,
                      # UI-2) : une commande confirmée ne passe jamais par un seul toucher
                      # (ADR-0036), et ce bouton n'en demande qu'un pour toute la pièce.
                      lampes: >-
                        {%- set ns = namespace(l=[]) -%}
                        {%- for t in tuiles | selectattr('r', 'eq', emplacement[1] | int) | selectattr('type', 'eq', 'lum') -%}
                          {%- if states[t.e] is not none and t.e not in ns.l
                                and perso.get(t.e, {}).get('comportement', 'normal') not in ['allumer_seulement', 'confirmer', 'lecture_seule'] -%}
                            {%- set ns.l = ns.l + [t.e] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.l }}
                  - if: "{{ lampes | count > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ lampes }}"

              # ---- Tuile − / + au choix (ADR-0033), par domaine de l'entité de rN ----
              # La valeur visée, un nombre (sinon rien), bornée à reglables_bornes ; une clim
              # passe par « Clim : consigne » (commande consigne, clim_cible). 0 éteint une
              # lampe ou un ventilateur ; sans position réglable, un volet ou une vanne
              # s'ouvre au-dessus de 50 et se ferme en dessous.
              - alias: "Tuile − / + : régler (volume, luminosité, vitesse, humidité, position, consigne, nombre)"
                conditions: "{{ commande == 'regler' and r_entite != '' and r_domaine != 'climate' and valeur | is_number }}"
                sequence:
                  - variables:
                      bornes: "{{ reglables_bornes.get(reglable.cle, [0, 100, 1, '']) }}"
                      v: "{{ [[valeur | float(0), bornes[0] | float(0)] | max, bornes[1] | float(100)] | min }}"
                      position_reglable: >-
                        {{ r_domaine in ['cover', 'valve'] and r_entite != volet_suivi
                           and (state_attr(r_entite, 'supported_features') | int(0)) // 4 % 2 == 1 }}
                  - choose:
                      - conditions: "{{ r_domaine == 'media_player' }}"
                        sequence:
                          - action: media_player.volume_set
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              volume_level: "{{ (v / 100) | round(2) }}"
                      - conditions: "{{ r_domaine in ['light', 'fan'] and v <= 0 }}"
                        sequence:
                          - action: "{{ r_domaine }}.turn_off"
                            target:
                              entity_id: "{{ r_entite }}"
                      - conditions: "{{ r_domaine == 'light' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              brightness_pct: "{{ v | round(0) | int }}"
                      - conditions: "{{ r_domaine == 'fan' }}"
                        sequence:
                          - action: fan.set_percentage
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              percentage: "{{ v | round(0) | int }}"
                      - conditions: "{{ r_domaine == 'humidifier' }}"
                        sequence:
                          - action: humidifier.set_humidity
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              humidity: "{{ v | round(0) | int }}"
                      - conditions: "{{ r_domaine == 'water_heater' }}"
                        sequence:
                          - action: water_heater.set_temperature
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              temperature: "{{ v }}"
                      - conditions: "{{ position_reglable }}"
                        sequence:
                          - action: "{{ r_domaine }}.set_{{ r_domaine }}_position"
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              position: "{{ v | round(0) | int }}"
                      - alias: "Volet suivi par le package (course simulée)"
                        conditions: "{{ r_entite == volet_suivi }}"
                        sequence:
                          - action: script.turn_on
                            target:
                              entity_id: script.tab5_volet_action
                            data:
                              variables:
                                action: "{{ 'open' if v >= 50 else 'close' }}"
                      - conditions: "{{ r_domaine in ['cover', 'valve'] }}"
                        sequence:
                          - action: "{{ r_domaine }}.{{ 'open' if v >= 50 else 'close' }}_{{ r_domaine }}"
                            target:
                              entity_id: "{{ r_entite }}"
                      - conditions: "{{ r_domaine in ['number', 'input_number'] }}"
                        sequence:
                          - action: "{{ r_domaine }}.set_value"
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              value: "{{ v }}"

      - alias: "Clim : son état a changé"
        conditions: "{{ trigger.id == 'clim' and clim != '' }}"
        sequence:
          # Réglages d'abord (ADR-0026), s'ils ont pu changer (reglages_changes : la clim
          # apparaît, revient d'une panne, ou l'un des attributs de clim_attributs_reglages
          # change). Pas à chaque degré de la pièce.
          - if: "{{ clim_reglages != '' and reglages_changes }}"
            then:
              - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
                data:
                  payload: "{{ clim_reglages }}"
                continue_on_error: true
          # Ancre &maj_clim : la même action part dans la poussée complète (default, plus
          # bas, *maj_clim). Un champ ajouté ici part donc dans les deux (audit du
          # 07/10/2026, HA-8 : le bloc était recopié).
          - &maj_clim
            action: "esphome.{{ tablette }}_tab5_maj_clim"
            data:
              target: "{{ state_attr(clim, 'temperature') | float(20) }}"
              current: "{{ state_attr(clim, 'current_temperature') | float(20) }}"
              mode: "{{ states(clim) }}"
              preset: "{{ state_attr(clim, 'preset_mode') | default('none', true) }}"
              fan: "{{ state_attr(clim, 'fan_mode') | default('auto', true) }}"
              swing: "{{ state_attr(clim, 'swing_mode') | default('stop', true) }}"
            continue_on_error: true

      # Aussi quand la liste du package ne nomme plus ce volet (volet_choisi) : son état
      # réel revient à l'écran.
      - alias: "Volet qui signale sa course : son état a changé"
        conditions: "{{ trigger.id in ['volet', 'volet_choisi'] and volet != '' and not volet_par_package }}"
        sequence:
          - action: "esphome.{{ tablette }}_tab5_maj_volet_etat"
            data:
              etat_physique: >-
                {{ {'opening': 'En_mouvement', 'closing': 'En_mouvement', 'open': 'Ouvert', 'closed': 'Ferme'}.get(states(volet), states(volet)) }}
            continue_on_error: true

    # Connexion ou changement d'un emplacement : ses valeurs ; à la connexion, aussi la
    # clim et le volet (sans package), à la suite, sans pause (retirée le 01/10/2026 :
    # elle ne faisait que retarder l'écran, comme celles de packages/tab5_push.yaml).
    default:
      - if: "{{ payload != '' }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
            data:
              payload: "{{ payload }}"
            continue_on_error: true
      - if: "{{ tout_pousser and clim != '' }}"
        then:
          # Réglages de la clim (clé climr, ADR-0026) avant son état : bornes, pas et
          # unité sont en place quand la consigne arrive.
          - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
            data:
              payload: "{{ clim_reglages }}"
            continue_on_error: true
          - *maj_clim
      - if: "{{ tout_pousser and volet != '' and not volet_par_package }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_volet_etat"
            data:
              etat_physique: >-
                {{ {'opening': 'En_mouvement', 'closing': 'En_mouvement', 'open': 'Ouvert', 'closed': 'Ferme'}.get(states(volet), states(volet)) }}
            continue_on_error: true
      # Après un rechargement, les zones aussi : un emplacement vidé ou rempli dans
      # l'automatisation doit disparaître ou revenir sans attendre que la tablette les
      # redemande (elle ne le fait qu'à sa connexion, ADR-0018).
      - if: "{{ trigger.id in ['rechargement', 'maj_ecran'] }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_zones"
            data:
              absentes: "{{ absentes }}"
            continue_on_error: true

  # ---- Tuiles des pièces (ADR-0023) ----
  # Définitions : un instantané complet (ce qui n'y est pas est vide), avant les états.
  # Calculées à chaque connexion quel que soit le protocole (la trace montre ce qui
  # partirait), envoyées seulement à une tablette 3.2 ou plus.
  - if: "{{ tout_pousser or trigger.id == 'zones' or redefinir }}"
    then:
      - variables:
          # Nom de chaque pièce : saisi, sinon l'aire de ses appareils quand ceux qui en
          # ont une en ont une seule ET qu'elle couvre au moins la moitié des appareils
          # (une seule lampe rangée dans « Chambre » ne nomme pas une pièce de cinq
          # appareils, vu chez l'auteur le 28/09), sinon vide (la tablette écrit « Pièce n »).
          noms_pieces: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for n in range(5) -%}
              {%- set saisi = (noms_saisis[n] or '') | string | trim -%}
              {%- set es = tuiles | selectattr('r', 'eq', n) | map(attribute='e') | list -%}
              {%- set avec = es | map('area_name') | reject('none') | list -%}
              {%- set aires = avec | unique | list -%}
              {%- set commune = aires[0] if aires | count == 1 and (avec | count) * 2 >= (es | count) else '' -%}
              {%- set ns.l = ns.l + [saisi if saisi else commune] -%}
            {%- endfor -%}
            {{ ns.l }}
          # « pR|nom; » puis « tRT|type|icône|options|complément|nom; » (ADR-0023) ; puis la
          # rangée sous l'horloge (ADR-0031) : « hp|place des plantes; » (0 à 2, « - » :
          # masquées), « hd|secondes d'une ligne; », « hLI|type|icône|options|complément|
          # nom|classe; » (classe d'appareil : la couleur de la valeur) ; puis le panneau
          # Ok Nabu (ADR-0041), au même format : « np|place de l'écoute; », « nd|…; »,
          # « nLI|…; ». n = 5 : la rangée, n = 6 : le panneau, avec la même traduction que
          # les tuiles.
          definitions: >-
            {%- set ns = namespace(r='') -%}
            {%- for n in range(7) -%}
              {%- set dans = (tuiles | selectattr('r', 'eq', n) | list) if n < 5
                             else (rangee | selectattr('z', 'eq', 'h' if n == 5 else 'n') | list) -%}
              {%- if n == 5 -%}
                {%- set piece = '' -%}
                {%- set ns.r = ns.r ~ 'hp|' ~ ('-' if rangee_plantes not in ['0', '1', '2'] else rangee_plantes)
                              ~ ';hd|' ~ (rangee_duree | float(32) | round(0) | int) ~ ';' -%}
              {%- elif n == 6 -%}
                {%- set piece = '' -%}
                {%- set ns.r = ns.r ~ 'np|' ~ ('-' if nabu_ecoute not in ['0', '1', '2'] else nabu_ecoute)
                              ~ ';nd|' ~ (nabu_duree | float(32) | round(0) | int) ~ ';' -%}
              {%- endif -%}
              {%- if dans | count > 0 -%}
                {%- if n < 5 -%}
                  {%- set piece = noms_pieces[n] | string -%}
                  {%- set ns.r = ns.r ~ 'p' ~ n ~ '|' ~ (piece | replace('|', '/') | replace(';', ',')) ~ ';' -%}
                {%- endif -%}
                {%- for t in dans -%}
                  {%- set dom = t.e.split('.')[0] -%}
                  {%- set p = perso.get(t.e, {}) -%}
                  {%- set classe = (state_attr(t.e, 'device_class') or '') | string -%}
                  {#- Icône : personnalisée, sinon l'attribut icon, sinon la classe, sinon le
                      domaine ; un « mdi: » hors palette prend le défaut du domaine. -#}
                  {%- set defaut = icones_defaut.get(dom ~ '.' ~ classe, icones_defaut.get(dom, '')) if classe else icones_defaut.get(dom, '') -%}
                  {#- Tuile PC du réglage 3.x : l'écran d'ordinateur de la 3.1, pas l'icône
                      générique d'un interrupteur. -#}
                  {%- set defaut = 'ordinateur' if t.s == 'pc' else defaut -%}
                  {#- Capteurs solaires de la section « Énergie » : le panneau (ADR-0028). -#}
                  {%- set defaut = 'solaire' if t.e in energie_solaires else defaut -%}
                  {%- set mdi = (p.get('icone') or state_attr(t.e, 'icon') or '') | string -%}
                  {%- set icone = icones_mdi.get(mdi, defaut) if mdi else defaut -%}
                  {#- Options : d (luminosité) et c (couleur) des modes de couleur ; o, k, r
                      du comportement ; t = la TV du blueprint ; m = sa clim ; e = un capteur
                      de sa section « Énergie » (popup Énergie, ADR-0028). -#}
                  {%- set modes = state_attr(t.e, 'supported_color_modes') or [] -%}
                  {%- set c = p.get('comportement', 'normal') -%}
                  {%- set options = ('d' if t.type == 'lum' and modes | reject('in', ['onoff', 'unknown']) | list | count > 0 else '')
                                  ~ ('c' if t.type == 'lum' and modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | count > 0 else '')
                                  ~ ('o' if c == 'allumer_seulement' else '')
                                  ~ ('k' if c == 'confirmer' else '')
                                  ~ ('r' if c == 'lecture_seule' else '')
                                  ~ ('t' if t.type == 'med' and t.e == sources.tv else '')
                                  ~ ('m' if t.type == 'cli' and t.e == sources.clim else '')
                                  ~ ('e' if t.type == 'cap' and t.e in energie_capteurs else '') -%}
                  {#- Complément : unité d'un capteur (7 octets au plus), classe d'un bin. -#}
                  {%- if t.type == 'cap' -%}
                    {%- set u = namespace(s=(state_attr(t.e, 'unit_of_measurement') or '') | string) -%}
                    {%- for i in range(8) -%}{%- if u.s.encode('utf-8') | length > 7 -%}{%- set u.s = u.s[:-1] -%}{%- endif -%}{%- endfor -%}
                    {%- set complement = u.s -%}
                  {%- elif t.type == 'bin' -%}
                    {%- set complement = 'presence' if dom in ['device_tracker', 'person'] else ('lock' if dom == 'lock' else classe) -%}
                  {%- else -%}
                    {%- set complement = '' -%}
                  {%- endif -%}
                  {#- Nom : personnalisé, sinon le nom de l'entité sans celui de la pièce (mot
                      entier, casse ignorée, liaison « du », « de la »… qui reste en bout
                      retirée), sinon le nom de l'entité. -#}
                  {%- set fn = (state_attr(t.e, 'friendly_name') or t.e) | string | trim -%}
                  {%- set nom = namespace(s=(p.get('nom') or '') | string | trim) -%}
                  {%- if not nom.s -%}
                    {%- set nom.s = fn -%}
                    {%- set i = (fn | lower).find(piece | lower) if piece else -1 -%}
                    {%- set j = i + (piece | length) -%}
                    {%- if i >= 0 and (i == 0 or not fn[i - 1].isalnum()) and (j >= fn | length or not fn[j].isalnum()) -%}
                      {%- set reste = namespace(s=(fn[:i] ~ ' ' ~ fn[j:]).split() | join(' ')) -%}
                      {%- for m in [' de la', " de l'", ' du', ' des', ' de', " d'", ' la', ' le', ' les', " l'"] -%}
                        {%- if (reste.s | lower).endswith(m) -%}{%- set reste.s = reste.s[:(reste.s | length) - (m | length)] -%}{%- endif -%}
                      {%- endfor -%}
                      {%- set reste.s = reste.s | trim(' -–:,') -%}
                      {%- if reste.s -%}{%- set nom.s = reste.s -%}{%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- set ns.r = ns.r ~ t.cle ~ '|' ~ t.type ~ '|' ~ icone ~ '|' ~ options ~ '|'
                                ~ (complement | replace('|', '/') | replace(';', ',')) ~ '|'
                                ~ (nom.s | replace('|', '/') | replace(';', ','))
                                ~ (('|' ~ (classe | replace('|', '/') | replace(';', ','))) if n >= 5 else '') ~ ';' -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {#- Tuile − / + au choix (ADR-0033) : « rN|type|icône|options|lien|min|max|pas|
                unité|nom; ». Icône comme une tuile (personnalisée, attribut icon, classe,
                domaine) ; option t = la TV du blueprint (sa valeur ouvre la télécommande) ;
                lien = la première tuile qui porte la même entité (sa valeur ouvre le popup
                de cette tuile), vide sinon ; bornes de reglables_bornes ; nom personnalisé,
                sinon celui de l'entité. -#}
            {%- for g in reglables -%}
              {%- set dom = g.e.split('.')[0] -%}
              {%- set p = perso.get(g.e, {}) -%}
              {%- set classe = (state_attr(g.e, 'device_class') or '') | string -%}
              {%- set defaut = icones_defaut.get(dom ~ '.' ~ classe, icones_defaut.get(dom, '')) if classe else icones_defaut.get(dom, '') -%}
              {%- set mdi = (p.get('icone') or state_attr(g.e, 'icon') or '') | string -%}
              {%- set icone = icones_mdi.get(mdi, defaut) if mdi else defaut -%}
              {%- set lien = tuiles | selectattr('e', 'eq', g.e) | map(attribute='cle') | first | default('') -%}
              {%- set b = reglables_bornes.get(g.cle, [0, 100, 1, '']) -%}
              {%- set nom = (p.get('nom') or state_attr(g.e, 'friendly_name') or g.e) | string | trim -%}
              {#- Option t (la TV du blueprint) : hors du motif des options des tuiles, que
                  tests/test_tuiles_blueprint.py compte une fois chacune. -#}
              {%- set opt = 't' if dom == 'media_player' and g.e == sources.tv else '' -%}
              {%- set ns.r = ns.r ~ g.cle ~ '|' ~ g.type ~ '|' ~ icone ~ '|' ~ opt
                            ~ '|' ~ lien ~ '|' ~ b[0] ~ '|' ~ b[1] ~ '|' ~ b[2] ~ '|'
                            ~ (b[3] | string | replace('|', '/') | replace(';', ',')) ~ '|'
                            ~ (nom | replace('|', '/') | replace(';', ',')) ~ ';' -%}
            {%- endfor -%}
            {{ ns.r }}
      - if: "{{ protocole == 2 }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_tuiles"
            data:
              payload: "{{ definitions }}"
            continue_on_error: true
  # États : « tRT|état|valeur|couleur; » (ADR-0023). Valeur = luminosité 0-255 (lum),
  # position (vol), la mesure (cap), la température de la pièce (cli), nan sinon ;
  # couleur = « RRGGBB » d'une lumière allumée qui donne rgb_color. Dans la même
  # poussée, les clims des tuiles (crRT avant, ceRT après, ADR-0027) et les éléments de
  # la rangée sous l'horloge (« hLI|état|valeur|couleur; », mêmes champs, ADR-0031) et du
  # panneau Ok Nabu (« nLI|… », ADR-0041).
  - if: "{{ tuiles_a_pousser | count > 0 }}"
    then:
      - variables:
          etats_tuiles: >-
            {%- set ns = namespace(r='') -%}
            {%- for t in tuiles + rangee if t.cle in tuiles_a_pousser and states[t.e] is not none -%}
              {%- set st = states[t.e] -%}
              {%- if t.e == volet_suivi -%}
                {%- set etat = {'En_mouvement': 'opening', 'Ouvert': 'open', 'Ferme': 'closed', 'Partiel': 'open'}.get(states('input_text.volet_serre_etat'), st.state) -%}
                {#- Pas de vraie position (course simulée) : nan au bout de la course, où la
                    flèche de la tablette repart dans l'autre sens comme à 100 / 0 ; -1 pour
                    « Partiel » (arrêté en route), qui garde le sens choisi. nan plutôt que
                    100 / 0 depuis le 05/10/2026 : le popup du volet n'offre un curseur qu'à
                    une position connue, et ce volet ne sait pas en régler une. -#}
                {%- set v = {'Partiel': -1}.get(states('input_text.volet_serre_etat'), 'nan') -%}
              {%- else -%}
                {%- set etat = st.state -%}
                {%- set brut = st.attributes.get('brightness') if t.type == 'lum'
                          else st.attributes.get('current_position') if t.type == 'vol'
                          else st.state if t.type == 'cap'
                          else st.attributes.get('current_temperature') if t.type == 'cli'
                          else none -%}
                {%- set v = brut | float('nan') -%}
                {#- Lampe allumée qui annonce une luminosité de 0 (Govee, vu chez l'auteur) :
                    pas de « 0 % » à l'écran, « Allumé ». -#}
                {%- set v = 'nan' if t.type == 'lum' and not ((v | float(0)) > 0) else v -%}
              {%- endif -%}
              {%- set rgb = st.attributes.get('rgb_color') if t.type == 'lum' and st.state == 'on' else none -%}
              {%- set couleur = ('%02X%02X%02X' | format(rgb[0] | int(0), rgb[1] | int(0), rgb[2] | int(0))) if rgb and rgb | count == 3 else '' -%}
              {%- set ns.r = ns.r ~ t.cle ~ '|' ~ (etat | string | replace('|', '/') | replace(';', ',')) ~ '|' ~ v ~ '|' ~ couleur ~ ';' -%}
            {%- endfor -%}
            {{ ns.r }}
          # Clims des tuiles (ADR-0027), avec leurs tuiles : réglages « crRT|min|max|pas|
          # unité|capacités|nom; » (ceux de climr : reglages_clims) après les définitions,
          # ou quand ils ont pu changer (reglages_changes) ; état « ceRT|consigne|pièce|
          # mode|préréglage|ventilation|oscillation; » (les champs de tab5_maj_clim, nan
          # quand HA n'en a pas), à chaque poussée de la tuile. Un firmware sans les clims
          # des tuiles ignore ces clés.
          reglages_tuiles: >-
            {%- set tout = tout_pousser or trigger.id == 'zones' or redefinir -%}
            {%- set ns = namespace(r='') -%}
            {%- for t in tuiles_clim if t.cle in tuiles_a_pousser and t.e in reglages_clims -%}
              {%- if tout or (reglages_changes and trigger.entity_id == t.e) -%}
                {%- set ns.r = ns.r ~ 'cr' ~ t.cle[1:] ~ '|' ~ reglages_clims[t.e] ~ ';' -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.r }}
          etats_clims: >-
            {%- set ns = namespace(r='') -%}
            {%- for t in tuiles_clim if t.cle in tuiles_a_pousser and states[t.e] is not none -%}
              {%- set a = states[t.e].attributes -%}
              {%- set champs = [a.get('temperature') | float('nan'), a.get('current_temperature') | float('nan'),
                                states(t.e), a.get('preset_mode') | default('none', true),
                                a.get('fan_mode') | default('auto', true), a.get('swing_mode') | default('stop', true)] -%}
              {%- set ns.r = ns.r ~ 'ce' ~ t.cle[1:] ~ '|'
                            ~ (champs | map('string') | map('replace', '|', '/') | map('replace', ';', ',') | join('|')) ~ ';' -%}
            {%- endfor -%}
            {{ ns.r }}
      - if: "{{ protocole == 2 and (reglages_tuiles ~ etats_tuiles ~ etats_clims) != '' }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
            data:
              payload: "{{ reglages_tuiles ~ etats_tuiles ~ etats_clims }}"
            continue_on_error: true
  # Tuile − / + au choix (ADR-0033) : « rN|état|valeur; », valeur dans l'unité de sa
  # définition : volume, luminosité, vitesse et position en % (0 pour une lampe ou un
  # ventilateur éteint ; 0 / 100 pour un volet sans position, fermé / ouvert), consigne
  # d'une clim ou d'un chauffe-eau, humidité visée, valeur d'un nombre ; nan quand HA n'en
  # a pas (lecteur éteint, sans volume). Le volet à course simulée : l'état tenu par son
  # package, comme ses tuiles.
  - if: "{{ protocole == 2 and reglables_a_pousser | count > 0 }}"
    then:
      - variables:
          etats_reglables: >-
            {%- set ns = namespace(r='') -%}
            {%- for g in reglables if g.cle in reglables_a_pousser and states[g.e] is not none -%}
              {%- set st = states[g.e] -%}
              {%- set a = st.attributes -%}
              {%- set etat = st.state -%}
              {%- if g.e == volet_suivi -%}
                {%- set etat = {'En_mouvement': 'opening', 'Ouvert': 'open', 'Ferme': 'closed', 'Partiel': 'open'}.get(states('input_text.volet_serre_etat'), etat) -%}
              {%- endif -%}
              {%- set pas = reglables_bornes.get(g.cle, [0, 100, 1, ''])[2] | float(1) -%}
              {%- if g.type == 'son' -%}
                {#- Lecteur éteint : pas de volume_level (`float('nan')` rendrait le texte
                    « nan », qu'on ne multiplie pas). -#}
                {%- set vl = a.get('volume_level') -%}
                {%- set v = ((vl | float(0)) * 100) | round(0) if vl | is_number else 'nan' -%}
              {%- elif g.type in ['lum', 'ven'] -%}
                {%- set brut = a.get('brightness') if g.type == 'lum' else a.get('percentage') -%}
                {%- if etat == 'off' -%}
                  {%- set v = 0 -%}
                {%- elif brut is none -%}
                  {#- Allumé sans valeur (lampe sans variateur, ventilateur à une vitesse). -#}
                  {%- set v = 100 if etat == 'on' else 'nan' -%}
                {%- elif g.type == 'lum' -%}
                  {#- Lampe allumée qui annonce 0 (Govee) : 1 %, jamais « éteinte » à l'écran. -#}
                  {%- set v = [(brut | float(0) / 2.55) | round(0), 1] | max -%}
                {%- else -%}
                  {%- set v = brut | float('nan') -%}
                {%- endif -%}
              {%- elif g.type in ['cli', 'eau'] -%}
                {%- set v = a.get('temperature') | float('nan') -%}
              {%- elif g.type == 'hum' -%}
                {%- set v = a.get('humidity') | float('nan') -%}
              {%- elif g.type == 'vol' -%}
                {%- set v = a.get('current_position') | float('nan') if pas < 100 else ({'open': 100, 'closed': 0}.get(etat, 'nan')) -%}
              {%- else -%}
                {%- set v = st.state | float('nan') -%}
              {%- endif -%}
              {%- set ns.r = ns.r ~ g.cle ~ '|' ~ (etat | string | replace('|', '/') | replace(';', ',')) ~ '|' ~ v ~ ';' -%}
            {%- endfor -%}
            {{ ns.r }}
      - if: "{{ etats_reglables != '' }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
            data:
              payload: "{{ etats_reglables }}"
            continue_on_error: true
  # Climat des pièces (ADR-0040), pièce par pièce, dans cet ordre : réglages de sa clim
  # « crpR|min|max|pas|unité|capacités|nom; » (ceux de climr : reglages_clims) avec les
  # définitions ou quand ils ont pu changer ; « pR|température|humidité|clim; » (champ vide :
  # rien de déclaré ; nan : valeur inconnue ; clim 1 ou 0) ; état de sa clim
  # « cepR|consigne|pièce|mode|préréglage|ventilation|oscillation; » (les champs de ceRT).
  # Un firmware sans le climat des pièces ignore ces clés.
  - if: "{{ protocole == 2 and pieces_climat_a_pousser | count > 0 }}"
    then:
      - variables:
          climat_pieces: >-
            {%- set tout = tout_pousser or trigger.id == 'zones' or redefinir -%}
            {%- set ns = namespace(r='') -%}
            {%- for p in pieces_climat if p.r in pieces_climat_a_pousser -%}
              {%- if p.temperature and p.clim in reglages_clims
                    and (tout or (reglages_changes and trigger.entity_id == p.clim)) -%}
                {%- set ns.r = ns.r ~ 'crp' ~ p.r ~ '|' ~ reglages_clims[p.clim] ~ ';' -%}
              {%- endif -%}
              {%- set t = (states(p.temperature) | float('nan')) if p.temperature else '' -%}
              {%- set h = (states(p.humidite) | float('nan')) if p.temperature and p.humidite else '' -%}
              {%- set ns.r = ns.r ~ 'p' ~ p.r ~ '|' ~ t ~ '|' ~ h ~ '|' ~ ('1' if p.temperature and p.clim else '0') ~ ';' -%}
              {%- if p.temperature and p.clim -%}
                {%- set a = states[p.clim].attributes -%}
                {%- set champs = [a.get('temperature') | float('nan'), a.get('current_temperature') | float('nan'),
                                  states(p.clim), a.get('preset_mode') | default('none', true),
                                  a.get('fan_mode') | default('auto', true), a.get('swing_mode') | default('stop', true)] -%}
                {%- set ns.r = ns.r ~ 'cep' ~ p.r ~ '|'
                              ~ (champs | map('string') | map('replace', '|', '/') | map('replace', ';', ',') | join('|')) ~ ';' -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.r }}
      - if: "{{ climat_pieces != '' }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
            data:
              payload: "{{ climat_pieces }}"
            continue_on_error: true
