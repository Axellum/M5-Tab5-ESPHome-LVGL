        tablette (une sonnette, par exemple). Il montre une image fixe de chaque caméra,
        rafraîchie toutes les quelques secondes tant qu'il est ouvert : pas de vidéo, et
        rien n'est demandé quand il est fermé. Les caméras sont rangées par la pièce que
        Home Assistant leur donne (celle de la caméra ou de son appareil) : avec deux
        pièces ou plus, le popup les propose à gauche. Aucun réglage de plus.


        Optional: the cameras of the Cameras popup, opened by a home gesture (« Clock and
        top buttons » section) or by the tablet's « Aller à l'écran » entity (a doorbell,
        for instance). It shows a still image of each camera, refreshed every few seconds
        while it is open: no video, and nothing is asked while it is closed. Cameras are
        grouped by the area Home Assistant gives them (the camera's or its device's): with
        two areas or more, the popup lists them on the left. Nothing more to set.
      input:
        cameras_liste:
          name: Caméras · Cameras
          description: >-
            Seize au plus, dans l'ordre des pages du popup (les pièces suivent l'ordre de
            leur première caméra).


            Sixteen at most, in the popup's page order (areas follow the order of their
            first camera).
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: camera
        cameras_adresse:
          name: Adresse de Home Assistant · Home Assistant address
          description: >-
            Vide (le plus souvent) : l'adresse IP d'où Home Assistant se connecte à la
            tablette, port 8123. À remplir seulement si les images ne viennent pas (autre
            port, https, Home Assistant derrière un proxy) : l'adresse que la tablette
            doit appeler, par exemple https://ha.example.com.


            Empty (most often): the IP address Home Assistant connects to the tablet
            from, port 8123. Fill it only if the images do not come (other port, https,
            Home Assistant behind a proxy): the address the tablet must call, for
            instance https://ha.example.com.
          default: ""
          selector:
            text:
    # Réglage 3.x (ADR-0019) : les cinq places fixes de l'accueil. Lu par un firmware
    # 3.0/3.1, et par un firmware 3.2 tant que la pièce 1 est vide (ADR-0023).
    accueil_3x:
      name: Ancien accueil (si la pièce 1 est vide) · Former home page (if room 1 is empty)
      icon: mdi:lightbulb-group
      description: >-
        Les cinq places fixes de l'accueil des premières versions, de gauche à droite : PC
        ou TV, volet, trois lumières. Elles s'affichent tant que la pièce 1 est vide, et sur
        un firmware trop ancien pour les pièces. Pour une nouvelle installation, remplissez
        plutôt la pièce 1.


        The five fixed places of the first versions' home page, left to right: PC or TV,
        shutter, three lights. They show while room 1 is empty, and on a firmware too old
        for rooms. For a new installation, fill room 1 instead.
      collapsed: true
      input:
        lumiere_1:
          name: Lumière 1 · Light 1
          description: >-
            La troisième place de l'ancien accueil.


            The third place of the former home page.
          default: []
          selector:
            entity:
              filter:
                - domain: light
        lumiere_2:
          name: Lumière 2 · Light 2
          description: >-
            La quatrième place de l'ancien accueil.


            The fourth place of the former home page.
          default: []
          selector:
            entity:
              filter:
                - domain: light
        lumiere_3:
          name: Lumière 3 · Light 3
          description: >-
            La cinquième place de l'ancien accueil.


            The fifth place of the former home page.
          default: []
          selector:
            entity:
              filter:
                - domain: light
        pc:
          name: PC
          description: >-
            La première place : une prise ou un interrupteur, ou un suivi de présence
            (affichage seul). Un appui éteint la TV si elle est allumée, sinon allume le PC et
            la TV.


            The first place: a plug or a switch, or a presence tracker (shown only). A tap
            turns the TV off when it is on, otherwise turns the PC and the TV on.
          default: []
          selector:
            entity:
              filter:
                - domain: [switch, input_boolean, device_tracker, binary_sensor]
        volet:
          name: Volet · Shutter
          description: >-
            La deuxième place. Un volet qui ne dit pas quand il s'ouvre ou se ferme peut être
            suivi par le réglage facultatif « volet à course simulée » (liste « Tab5 · volet à
            course simulée ») : laissez alors ici ce même volet, même s'il est aussi dans une
            pièce ; ses commandes et son état passent par ce réglage.


            The second place. A shutter that does not say when it is opening or closing can
            be followed by the optional « simulated travel » setting (list « Tab5 · volet à
            course simulée »): then keep that same shutter here, even if it is also in a
            room; its commands and its state go through that setting.
          default: []
          selector:
            entity:
              filter:
                - domain: cover
    avance:
      name: Avancé · Advanced
      icon: mdi:cog
      collapsed: true
      input:
        tablette:
          name: Nom de la tablette dans ESPHome · Tablet name in ESPHome
          description: >-
            Le nom de la tablette dans ESPHome, les « - » remplacés par des « _ ». À changer
            seulement si vous avez renommé la tablette.


            The tablet's name in ESPHome, with « _ » instead of « - ». Change it only if you
            renamed the tablet.
          default: tab5_ha_hmi
          selector:
            text:

mode: queued
# max 50, plus 25 (audit du 07/10/2026, HA-2) : éteindre une maison depuis le popup
# Maison change d'un coup l'état de ~30 entités, donc ~30 déclenchements en file ; au-delà
# de 25, les derniers étaient abandonnés sans trace (max_exceeded: silent) et leur tuile
# restait fausse jusqu'à la reconnexion. Chaque passage est court (une mesure, un envoi).
max: 50
max_exceeded: silent
# Les capteurs de plantes déclenchent souvent : avec les 5 traces par défaut, celle
# d'une commande de l'écran disparaît en quelques minutes.
trace:
  stored_traces: 20

