        lecteurs de musique · music players », the sensor the first one of « Tab5 ·
        capteurs suivis · tracked sensors »; with none, the tablet skips them. A tap on the second temperature (on the
        right of the home page) shows the next content, as does a « Left of the clock: next
        content » gesture (« Clock and top buttons » section). The tablet keeps the content
        shown when it restarts.
      input:
        gauche_depart:
          name: Au départ · At start
          description: >-
            Le contenu montré dès que ce choix change, puis jusqu'au prochain tap.


            The content shown as soon as this choice changes, then until the next tap.
