    id: rangee_3
  - trigger: state
    entity_id: !input rangee_ligne_3
    from: *etats_visibles
    not_to: *etats_visibles
    id: rangee_3_sortie
  # <<< déclencheurs de la rangée
  # Panneau Ok Nabu (ADR-0041) : comme la rangée.
  # >>> déclencheurs du panneau Ok Nabu (généré par tools/gen_blueprint_emplacements.py, ne pas éditer)
  - trigger: state
    entity_id: !input nabu_ligne_1
