    - !input piece_1_nom
    - !input piece_2_nom
    - !input piece_3_nom
    - !input piece_4_nom
    - !input piece_5_nom
  # Climat des pièces (ADR-0040) : sonde de température, d'humidité et clim de chaque
  # section « Pièce n », toutes facultatives.
  pieces_climat_choix:
    - temperature: !input piece_1_temperature
      humidite: !input piece_1_humidite
      clim: !input piece_1_clim
    - temperature: !input piece_2_temperature
      humidite: !input piece_2_humidite
      clim: !input piece_2_clim
    - temperature: !input piece_3_temperature
      humidite: !input piece_3_humidite
      clim: !input piece_3_clim
    - temperature: !input piece_4_temperature
      humidite: !input piece_4_humidite
      clim: !input piece_4_clim
    - temperature: !input piece_5_temperature
      humidite: !input piece_5_humidite
      clim: !input piece_5_clim
  personnalisation: !input personnalisation
  # Rangée sous l'horloge (ADR-0031) : lignes choisies, place des plantes, durée.
  # Les lignes des deux zones à lignes : la rangée sous l'horloge (0 à 2, clés h…) puis
  # le panneau Ok Nabu (3 à 5, clés n…, lot 3, ADR-0041).
  rangee_lignes:
