  # <<< icones
  tablette: !input tablette
  choix:
    lumiere_1: !input lumiere_1
    lumiere_2: !input lumiere_2
    lumiere_3: !input lumiere_3
    pc: !input pc
    tv: !input tv
    tv_telecommande: !input tv_telecommande
    telephone: !input telephone
    salon: !input salon_temperature
    salon_hum: !input salon_humidite
    serre: !input serre_temperature
    clim: !input clim
    volet: !input volet
    pot_1: !input pot_1
    pot_2: !input pot_2
    pot_3: !input pot_3
    pot_4: !input pot_4
    pot_5: !input pot_5
    planning: !input agenda_travail
  # Pièces (ADR-0023) : pieces[n] = entités de la pièce n + 1, dans l'ordre choisi.
  pieces:
    - !input piece_1_tuiles
    - !input piece_2_tuiles
    - !input piece_3_tuiles
    - !input piece_4_tuiles
    - !input piece_5_tuiles
  noms_saisis:
    - !input piece_1_nom
    - !input piece_2_nom
    - !input piece_3_nom
    - !input piece_4_nom
    - !input piece_5_nom
  personnalisation: !input personnalisation
  # clé -> entité (chaîne vide si rien n'est choisi). Les détails des pots viennent de
  # l'appareil du capteur d'humidité, par classe (vérifié sur des Flower Care).
  sources: >-
    {%- set ns = namespace(d={}) -%}
    {%- for cle, v in choix.items() -%}
      {%- set ns.d = dict(ns.d, **{cle: (v if v is string else (v | first if v else ''))}) -%}
    {%- endfor -%}
    {%- for n in range(1, 6) -%}
      {%- set p = ns.d['pot_' ~ n] -%}
      {%- set dev = device_id(p) if p else none -%}
      {%- for suffixe, classe in [('ec', 'conductivity'), ('lux', 'illuminance'), ('temp', 'temperature'), ('bat', 'battery')] -%}
        {%- set e = (device_entities(dev) | select('match', 'sensor\\.') | select('is_state_attr', 'device_class', classe) | first | default('')) if dev else '' -%}
        {%- set ns.d = dict(ns.d, **{'pot_' ~ n ~ '_' ~ suffixe: e}) -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ ns.d }}
  # Type de tuile par domaine : le tableau « Type | HA domains » de l'ADR-0023
  # (tests/test_tuiles_blueprint.py compare). Un autre domaine n'a pas de tuile.
  types_par_domaine:
    light: lum
    switch: int
    input_boolean: int
    fan: int
    humidifier: int
    automation: int
    cover: vol
    valve: vol
    media_player: med
    scene: act
    script: act
    button: act
    input_button: act
    sensor: cap
    number: cap
    input_number: cap
    binary_sensor: bin
    device_tracker: bin
    person: bin
    lock: bin
    climate: cli
  # entité -> {nom, icone, comportement} de la section « Personnaliser des tuiles » ;
  # la première ligne d'une entité compte.
  perso: >-
    {%- set ns = namespace(d={}) -%}
    {%- set lignes = personnalisation if personnalisation is iterable and personnalisation is not string and personnalisation is not mapping else [] -%}
    {%- for p in lignes -%}
      {%- if p is mapping and p.get('entite') is string and p.get('entite') not in ns.d -%}
        {%- set ns.d = dict(ns.d, **{p.get('entite'): {'nom': (p.get('nom') or '') | string, 'icone': (p.get('icone') or '') | string, 'comportement': (p.get('comportement') or 'normal') | string}}) -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.d }}
  # Protocole de la tablette : 2 (tuiles) si sa version de projet est 3.2.0 ou plus,
  # sinon 1. sw_version = « 3.1.0 (ESPHome 2026.9.0) », « 3.2.0-dev (…) » ; « rendu »
  # ou illisible = 1. Plusieurs tablettes : la plus ancienne décide (jamais une action
  # qu'une tablette n'a pas).
  protocole: >-
    {%- set ns = namespace(p=0) -%}
    {%- for e in integration_entities('esphome') | select('match', 'binary_sensor[.].*_ha_api_status$') -%}
      {%- if device_attr(e, 'model') == 'tab5-ha-hmi' -%}
        {%- set m = (device_attr(e, 'sw_version') or '') | string | regex_findall('^ *([0-9]+)[.]([0-9]+)[.]([0-9]+)') -%}
        {%- set p = 2 if m and (m[0][0] | int(0)) * 1000000 + (m[0][1] | int(0)) * 1000 + (m[0][2] | int(0)) >= 3002000 else 1 -%}
        {%- set ns.p = p if ns.p == 0 else [ns.p, p] | min -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.p if ns.p else 1 }}
  # Tuiles : [{cle: 'tRT', r: R, e: entité, type, s: entrée 3.x d'origine ou ''}].
  # Les cinq premières entités de chaque pièce qui existent et dont le domaine a un
  # type, dans l'ordre choisi. Pièce 1 vide : les entrées 3.x, à leurs places
  # (t00 = PC, à défaut TV ; t01 = volet ; t02..t04 = lumières 1 à 3). Une même
  # entité peut être dans plusieurs tuiles.
  tuiles: >-
    {%- set ns = namespace(l=[], t=0) -%}
    {%- for n in range(5) -%}
      {%- set brut = pieces[n] -%}
      {%- set liste = [brut] if brut is string else (brut if brut else []) -%}
      {%- set ns.t = 0 -%}
      {%- for e in liste -%}
        {%- if ns.t < 5 and e is string and e.split('.')[0] in types_par_domaine and states[e] is not none -%}
          {%- set ns.l = ns.l + [{'cle': 't' ~ n ~ ns.t, 'r': n, 'e': e, 'type': types_par_domaine[e.split('.')[0]], 's': ''}] -%}
          {%- set ns.t = ns.t + 1 -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if n == 0 and ns.t == 0 -%}
        {%- set premiere = 'pc' if sources.pc and states[sources.pc] is not none else 'tv' -%}
        {%- for s in [premiere, 'volet', 'lumiere_1', 'lumiere_2', 'lumiere_3'] -%}
          {%- set e = sources.get(s, '') -%}
          {%- if e and e.split('.')[0] in types_par_domaine and states[e] is not none -%}
            {%- set ns.l = ns.l + [{'cle': 't0' ~ loop.index0, 'r': 0, 'e': e, 'type': types_par_domaine[e.split('.')[0]], 's': s}] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.l }}
  volet_par_package: "{{ states['script.tab5_volet_action'] is not none }}"
  # Le volet que suit le package volet_serre_tracking.yaml : l'entrée Volet (3.x). Sa
  # tuile montre l'état tenu par le package (input_text.volet_serre_etat), ses
  # commandes passent par script.tab5_volet_action.
  volet_suivi: "{{ sources.volet if volet_par_package and sources.volet else '' }}"
  # Clés poussées par tab5_maj_emplacements (clim et volet ont leurs actions).
  cles_emplacements:
    - lumiere_1
    - lumiere_2
    - lumiere_3
    - pc
    - tv
    - telephone
    - salon
    - salon_hum
    - serre
    - pot_1
    - pot_2
    - pot_3
    - pot_4
    - pot_5
  # Clés des zones de l'écran (kCles de Tab5/tab5_zones.cpp).
  cles_zones:
    - lumiere_1
    - lumiere_2
    - lumiere_3
    - pc
    - tv
    - telephone
    - salon
    - serre
    - pot_1
    - pot_2
    - pot_3
    - pot_4
    - pot_5
    - clim
    - volet
    - planning
  # Mesures lentes : poussées ensemble toutes les 5 minutes (déclencheur « mesures »),
  # celles qui ont changé seulement ; un pot part avec ses 4 détails si l'un des 5 a
  # changé. Poussées à chaque changement, elles faisaient ~1 300 exécutions par jour
  # chez l'auteur, dont 775 pour une température de serre qui oscille d'un dixième
  # toutes les 40 s (28/09/2026). L'écran affiche ce dixième : filtrer sur la valeur
  # affichée n'aurait rien retiré.
  cles_mesures:
    - telephone
    - salon
    - salon_hum
    - serre
    - pot_1
    - pot_2
    - pot_3
    - pot_4
    - pot_5
  # Période du déclencheur « mesures » (300 s), plus une marge : une mesure changée
  # juste au moment d'un passage repart au suivant, jamais perdue.
  fenetre_mesures: 310
  # Tuiles dont la valeur part avec les mesures lentes : les capteurs (état = la mesure)
  # et la température de la pièce d'une clim (current_temperature). Une clim part
  # aussi à chaque changement de mode ; un capteur, jamais.
  types_mesures:
    - cap
    - cli
  types_immediats:
    - lum
    - int
    - vol
    - med
    - act
    - bin
    - cli
  # Emplacements à pousser pour ce déclenchement.
  cles: >-
    {%- if trigger.id in ['connexion', 'rechargement'] -%}
      {%- set ns = namespace(l=[]) -%}
      {%- for c in cles_emplacements -%}
        {%- set ns.l = ns.l + [c] + ([c ~ '_ec', c ~ '_lux', c ~ '_temp', c ~ '_bat'] if c.startswith('pot_') else []) -%}
      {%- endfor -%}
      {{ ns.l }}
    {%- elif trigger.id == 'mesures' -%}
      {%- set ns = namespace(l=[], vu=false) -%}
      {%- for c in cles_mesures -%}
        {%- set groupe = [c] + ([c ~ '_ec', c ~ '_lux', c ~ '_temp', c ~ '_bat'] if c.startswith('pot_') else []) -%}
        {%- set ns.vu = false -%}
        {%- for k in groupe -%}
          {%- set x = sources.get(k, '') -%}
          {%- if x and states[x] is not none and (now() - states[x].last_changed).total_seconds() < fenetre_mesures -%}
            {%- set ns.vu = true -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if ns.vu -%}{%- set ns.l = ns.l + groupe -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.l }}
    {%- elif trigger.id in cles_emplacements -%}
      {#- Lumières, PC, TV : seulement si ce que montre l'écran change (état, luminosité),
          pas pour un autre attribut (couleur, titre en cours de lecture…). -#}
      {%- set avant = trigger.from_state -%}
      {%- set apres = trigger.to_state -%}
      {%- if avant is none or apres is none or avant.state != apres.state
            or avant.attributes.get('brightness') != apres.attributes.get('brightness') -%}
        {{ [trigger.id] }}
      {%- else -%}
        {{ [] }}
      {%- endif -%}
    {%- else -%}
      {{ [] }}
    {%- endif -%}
  # Une entité d'une tuile apparaît ou disparaît : les définitions changent, elles
  # repartent (avec tous les états), sans attendre une reconnexion.
  redefinir: >-
    {{ protocole == 2
       and (trigger.id.startswith('piece_') or trigger.id in ['pc', 'tv', 'volet', 'lumiere_1', 'lumiere_2', 'lumiere_3'])
       and trigger.from_state is defined and (trigger.from_state is none or trigger.to_state is none) }}
  # Tuiles à pousser (clés tRT). Toutes après les définitions ; une tuile quand son
  # entité change ce que l'écran montre (état, luminosité, couleur, position) ; les
  # types_mesures avec les mesures lentes. Calculées quel que soit le protocole (la
  # trace montre ce qui partirait), poussées seulement au protocole 2.
  tuiles_a_pousser: >-
    {%- if trigger.id in ['connexion', 'rechargement', 'zones'] or redefinir -%}
      {{ tuiles | map(attribute='cle') | list }}
    {%- elif trigger.id == 'mesures' -%}
      {%- set ns = namespace(l=[]) -%}
      {%- for t in tuiles if t.type in types_mesures and states[t.e] is not none -%}
        {%- set depuis = states[t.e].last_changed if t.type == 'cap' else states[t.e].last_updated -%}
        {%- if (now() - depuis).total_seconds() < fenetre_mesures -%}{%- set ns.l = ns.l + [t.cle] -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.l }}
    {%- elif trigger.id == 'volet_suivi' -%}
      {{ (tuiles | selectattr('e', 'eq', volet_suivi) | map(attribute='cle') | list) if volet_suivi else [] }}
    {%- elif trigger.from_state is defined and (trigger.id.startswith('piece_') or trigger.id in ['pc', 'tv', 'volet', 'lumiere_1', 'lumiere_2', 'lumiere_3']) -%}
      {%- set avant = trigger.from_state -%}
      {%- set apres = trigger.to_state -%}
      {%- set ns = namespace(vu=avant is none or apres is none or avant.state != apres.state) -%}
      {%- for a in ['brightness', 'rgb_color', 'current_position'] -%}
        {%- if not ns.vu and avant.attributes.get(a) != apres.attributes.get(a) -%}{%- set ns.vu = true -%}{%- endif -%}
      {%- endfor -%}
      {%- if not ns.vu -%}
        {{ [] }}
      {%- elif trigger.id.startswith('piece_') -%}
        {{ tuiles | selectattr('r', 'eq', trigger.id[6] | int - 1) | selectattr('e', 'eq', trigger.entity_id)
           | selectattr('type', 'in', types_immediats) | map(attribute='cle') | list }}
      {%- else -%}
        {{ tuiles | selectattr('s', 'eq', trigger.id) | selectattr('type', 'in', types_immediats) | map(attribute='cle') | list }}
      {%- endif -%}
    {%- else -%}
      {{ [] }}
    {%- endif -%}

triggers:
  - trigger: event
    event_type: esphome.tab5_connected
    id: connexion
  - trigger: event
    event_type: esphome.tab5_zones
    id: zones
  - trigger: event
    event_type: esphome.tab5_action
    id: action
  - trigger: state
    entity_id: !input lumiere_1
    id: lumiere_1
  - trigger: state
    entity_id: !input lumiere_2
    id: lumiere_2
  - trigger: state
    entity_id: !input lumiere_3
    id: lumiere_3
  - trigger: state
    entity_id: !input pc
    id: pc
  - trigger: state
    entity_id: !input tv
    id: tv
  - trigger: state
    entity_id: !input clim
    id: clim
  - trigger: state
    entity_id: !input volet
    id: volet
  # Pièces (ADR-0023), cinq déclencheurs par pièce, pour ne jamais réveiller
  # l'automatisation sur un capteur qui change (une mesure part avec les mesures
  # lentes) ni sur un attribut que l'écran ne montre pas (position GPS d'une personne,
  # volume d'un lecteur) :
  #   piece_n          l'état passe à un état qui n'est pas une mesure (etats_visibles) ;
  #   piece_n_sortie   il en sort vers un autre (zone d'une personne, retour d'une mesure) ;
  #   piece_n_luminosite / _couleur / _position  l'attribut change pendant que l'appareil
  #                    reste allumé ou en place (not_from / not_to [null] : l'allumage et
  #                    l'extinction sont déjà vus par piece_n, sans passage en double).
  # « on » et « off » entre guillemets : sans eux, YAML 1.1 lit des booléens, que le
  # schéma du déclencheur refuse.
  - trigger: state
    entity_id: !input piece_1_tuiles
    to: &etats_visibles ["on", "off", open, closed, opening, closing, playing, paused, idle, standby, buffering, home, not_home, locked, unlocked, locking, unlocking, jammed, heat, cool, heat_cool, auto, dry, fan_only, unavailable, unknown]
    id: piece_1
  - trigger: state
    entity_id: !input piece_1_tuiles
    from: *etats_visibles
    not_to: *etats_visibles
    id: piece_1_sortie
  - trigger: state
    entity_id: !input piece_1_tuiles
    attribute: brightness
    not_from: [null]
    not_to: [null]
    id: piece_1_luminosite
  - trigger: state
    entity_id: !input piece_1_tuiles
    attribute: rgb_color
    not_from: [null]
    not_to: [null]
    id: piece_1_couleur
  - trigger: state
    entity_id: !input piece_1_tuiles
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: piece_1_position
  - trigger: state
    entity_id: !input piece_2_tuiles
    to: *etats_visibles
    id: piece_2
  - trigger: state
    entity_id: !input piece_2_tuiles
    from: *etats_visibles
    not_to: *etats_visibles
    id: piece_2_sortie
  - trigger: state
    entity_id: !input piece_2_tuiles
    attribute: brightness
    not_from: [null]
    not_to: [null]
    id: piece_2_luminosite
  - trigger: state
    entity_id: !input piece_2_tuiles
    attribute: rgb_color
    not_from: [null]
    not_to: [null]
    id: piece_2_couleur
  - trigger: state
    entity_id: !input piece_2_tuiles
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: piece_2_position
  - trigger: state
    entity_id: !input piece_3_tuiles
    to: *etats_visibles
    id: piece_3
  - trigger: state
    entity_id: !input piece_3_tuiles
    from: *etats_visibles
    not_to: *etats_visibles
    id: piece_3_sortie
  - trigger: state
    entity_id: !input piece_3_tuiles
    attribute: brightness
    not_from: [null]
    not_to: [null]
    id: piece_3_luminosite
  - trigger: state
    entity_id: !input piece_3_tuiles
    attribute: rgb_color
    not_from: [null]
    not_to: [null]
    id: piece_3_couleur
  - trigger: state
    entity_id: !input piece_3_tuiles
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: piece_3_position
  - trigger: state
    entity_id: !input piece_4_tuiles
    to: *etats_visibles
    id: piece_4
  - trigger: state
    entity_id: !input piece_4_tuiles
    from: *etats_visibles
    not_to: *etats_visibles
    id: piece_4_sortie
  - trigger: state
    entity_id: !input piece_4_tuiles
    attribute: brightness
    not_from: [null]
    not_to: [null]
    id: piece_4_luminosite
  - trigger: state
    entity_id: !input piece_4_tuiles
    attribute: rgb_color
    not_from: [null]
    not_to: [null]
    id: piece_4_couleur
  - trigger: state
    entity_id: !input piece_4_tuiles
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: piece_4_position
  - trigger: state
    entity_id: !input piece_5_tuiles
    to: *etats_visibles
    id: piece_5
  - trigger: state
    entity_id: !input piece_5_tuiles
    from: *etats_visibles
    not_to: *etats_visibles
    id: piece_5_sortie
  - trigger: state
    entity_id: !input piece_5_tuiles
    attribute: brightness
    not_from: [null]
    not_to: [null]
    id: piece_5_luminosite
  - trigger: state
    entity_id: !input piece_5_tuiles
    attribute: rgb_color
    not_from: [null]
    not_to: [null]
    id: piece_5_couleur
  - trigger: state
    entity_id: !input piece_5_tuiles
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: piece_5_position
  # Volet suivi par le package volet_serre_tracking.yaml : son état est dans le
  # package (le moteur ne donne pas de position). Sans le package, ne se déclenche jamais.
  - trigger: state
    entity_id: input_text.volet_serre_etat
    id: volet_suivi
  # Téléphone, températures, humidité de la pièce, pots et tuiles « mesures » : voir
  # cles_mesures et types_mesures.
  - trigger: time_pattern
    minutes: "/5"
    id: mesures
  # Automatisation créée ou modifiée (un emplacement changé, par exemple) alors que
  # la tablette est déjà connectée : tout repousser, zones comprises, sans attendre
  # sa reconnexion. Dans l'ordre « Sans compiler » du guide, elle est créée après
  # l'ajout de la tablette : l'écran restait vide jusqu'à la reconnexion suivante
  # (test « HA neuf », 28/09/2026). L'événement suit tout rechargement des
  # automatisations : une poussée de plus, sans effet visible.
  - trigger: event
    event_type: automation_reloaded
    id: rechargement

conditions:
  # Garde-fou des packages (ADR-0008) : absent, il laisse passer.
  - condition: template
    value_template: "{{ states('input_boolean.is_primary_active') != 'off' }}"
  # Rien de neuf pour l'écran (aucune mesure changée, attribut invisible, tuile d'un
  # firmware qui n'en a pas) : arrêt ici, sans ligne au journal.
  - condition: template
    value_template: >-
      {{ trigger.id in ['connexion', 'zones', 'action', 'clim', 'volet'] or cles | count > 0
         or (protocole == 2 and (redefinir or tuiles_a_pousser | count > 0)) }}
  # Déclencheurs venus de HA (rechargement, mesures, changements d'état) : seulement
  # si une tablette est connectée, sinon « Action … not found » (pas encore ajoutée)
  # ou « Not connected » (hors ligne). Elle est trouvée par le modèle de l'appareil
  # (bloc `project:` du firmware), pas par son nom. Les événements de la tablette
  # prouvent d'eux-mêmes qu'elle est là.
  - condition: template
    value_template: >-
      {{ trigger.id in ['connexion', 'zones', 'action']
         or integration_entities('esphome') | select('match', 'binary_sensor[.].*_ha_api_status$')
            | select('is_state', 'on') | map('device_attr', 'model') | select('eq', 'tab5-ha-hmi')
            | list | count > 0 }}

actions:
  - variables:
      # « clé|état|valeur; » : état tel quel, valeur = luminosité (lampes) ou nombre de
      # l'état (capteurs), nan sinon. Une entité absente n'est pas poussée (zone absente).
      payload: >-
        {%- set ns = namespace(r='') -%}
        {%- for c in cles -%}
          {%- set x = sources.get(c, '') -%}
          {%- if x and states[x] is not none -%}
            {%- if c.startswith('lumiere_') -%}
              {%- set v = state_attr(x, 'brightness') | float('nan') -%}
            {%- elif c in ['pc', 'tv'] -%}
              {%- set v = 'nan' -%}
            {%- else -%}
              {%- set v = states(x) | float('nan') -%}
            {%- endif -%}
            {%- set ns.r = ns.r ~ c ~ '|' ~ (states(x) | replace('|', '/') | replace(';', ',')) ~ '|' ~ v ~ ';' -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.r }}
      absentes: >-
        {%- set ns = namespace(l=[]) -%}
        {%- for c in cles_zones -%}
          {%- set x = sources.get(c, '') -%}
          {%- if not x or states[x] is none -%}{%- set ns.l = ns.l + [c] -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.l | join(',') }}
      clim: "{{ sources.clim if sources.clim and states[sources.clim] is not none else '' }}"
      volet: "{{ sources.volet if sources.volet and states[sources.volet] is not none else '' }}"
  - choose:
      - alias: "La tablette demande quelles zones sont absentes"
        conditions: "{{ trigger.id == 'zones' }}"
        sequence:
          - action: "esphome.{{ tablette }}_tab5_maj_zones"
            data:
              absentes: "{{ absentes }}"
            continue_on_error: true

      - alias: "Commande d'un bouton de l'écran"
        conditions: "{{ trigger.id == 'action' }}"
        sequence:
          - variables:
              emplacement: "{{ trigger.event.data.emplacement | default('') }}"
              commande: "{{ trigger.event.data.action | default('') }}"
              valeur: "{{ trigger.event.data.valeur | default('') }}"
              cible: "{{ sources.get(emplacement, '') }}"
              # Tuile tRT (ADR-0023) : son entité, si elle existe encore. Le blueprint
              # est la liste blanche : une clé sans tuile ne commande rien.
              tuile: "{{ tuiles | selectattr('cle', 'eq', emplacement) | first | default({}, true) }}"
              t_entite: "{{ tuile.e if tuile and states[tuile.e] is not none else '' }}"
              t_domaine: "{{ t_entite.split('.')[0] if t_entite else '' }}"
              # Comportement personnalisé : lecture seule = rien ; allumer seulement =
              # basculer allume, éteindre ne fait rien (le firmware n'envoie déjà que
              # « allumer », ceci en est la garde côté HA).
              t_commande: >-
                {%- set c = perso.get(t_entite, {}).get('comportement', 'normal') if t_entite else 'lecture_seule' -%}
                {%- if c == 'lecture_seule' -%}
                {%- elif c == 'allumer_seulement' and commande in ['basculer', 'allumer'] -%}allumer
                {%- elif c == 'allumer_seulement' and commande == 'eteindre' -%}
                {%- else -%}{{ commande }}
                {%- endif -%}
          - choose:
              - alias: "Lumière : basculer"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'basculer' and cible != '' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: "{{ cible }}"
              - alias: "Lumière : luminosité 0-255"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'luminosite' and cible != '' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ cible }}"
                    data:
                      brightness: "{{ valeur | int(0) }}"
              - alias: "Lumière : luminosité en %"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'luminosite_pct' and cible != '' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ cible }}"
                    data:
                      brightness_pct: "{{ valeur | int(0) }}"
              - alias: "Lumière : couleur"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'couleur' and cible != '' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ cible }}"
                    data:
                      color_name: "{{ valeur }}"
              - alias: "Tout éteindre"
                conditions: "{{ emplacement == 'lumieres' and commande == 'eteindre' }}"
                sequence:
                  - variables:
                      # Pas de filtre `extract` dans le Jinja de HA (c'est un filtre Ansible).
                      lampes: >-
                        {%- set ns = namespace(l=[]) -%}
                        {%- for c in ['lumiere_1', 'lumiere_2', 'lumiere_3'] -%}
                          {%- set x = sources.get(c, '') -%}
                          {%- if x and states[x] is not none -%}{%- set ns.l = ns.l + [x] -%}{%- endif -%}
                        {%- endfor -%}
                        {{ ns.l }}
                  - if: "{{ lampes | count > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ lampes }}"
              # La tuile PC d'un accueil construit depuis les entrées 3.x (t00 venu de
              # l'entrée PC) garde ce comportement.
              - alias: "PC : la TV allumée s'éteint, sinon PC et TV s'allument"
                conditions: >-
                  {{ (emplacement == 'pc' and commande == 'basculer')
                     or (tuile.get('s', '') == 'pc' and t_commande == 'basculer') }}
                sequence:
                  - variables:
                      tv: "{{ sources.tv }}"
                      pc: "{{ sources.pc }}"
                  - choose:
                      - conditions: "{{ tv != '' and states(tv) in ['on', 'idle', 'playing', 'paused'] }}"
                        sequence:
                          - action: media_player.turn_off
                            target:
                              entity_id: "{{ tv }}"
                    default:
                      - if: "{{ pc != '' and pc.split('.')[0] in ['switch', 'input_boolean'] and states[pc] is not none }}"
                        then:
                          - action: homeassistant.turn_on
                            target:
                              entity_id: "{{ pc }}"
                      - if: "{{ tv != '' and states[tv] is not none }}"
                        then:
                          - action: media_player.turn_on
                            target:
                              entity_id: "{{ tv }}"
              - alias: "Clim : consigne (mode froid si elle est éteinte)"
                conditions: "{{ emplacement == 'clim' and commande == 'consigne' and clim != '' }}"
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ clim }}"
                    data:
                      temperature: "{{ valeur | float(20) }}"
                      hvac_mode: "{{ 'cool' if states(clim) in ['off', 'unknown', 'unavailable'] else states(clim) }}"
              - alias: "Clim : éteindre"
                conditions: "{{ emplacement == 'clim' and commande == 'eteindre' and clim != '' }}"
                sequence:
                  - action: climate.turn_off
                    target:
                      entity_id: "{{ clim }}"
              - alias: "Clim : mode"
                conditions: "{{ emplacement == 'clim' and commande == 'mode' and clim != '' }}"
                sequence:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: "{{ clim }}"
                    data:
                      hvac_mode: "{{ valeur }}"
              - alias: "Clim : préréglage"
                conditions: "{{ emplacement == 'clim' and commande == 'preset' and clim != '' }}"
                sequence:
                  - action: climate.set_preset_mode
                    target:
                      entity_id: "{{ clim }}"
                    data:
                      preset_mode: "{{ valeur }}"
              - alias: "Clim : ventilation"
                conditions: "{{ emplacement == 'clim' and commande == 'ventilation' and clim != '' }}"
                sequence:
                  - action: climate.set_fan_mode
                    target:
                      entity_id: "{{ clim }}"
                    data:
                      fan_mode: "{{ valeur }}"
              - alias: "Clim : oscillation"
                conditions: "{{ emplacement == 'clim' and commande == 'oscillation' and clim != '' }}"
                sequence:
                  - action: climate.set_swing_mode
                    target:
                      entity_id: "{{ clim }}"
                    data:
                      swing_mode: "{{ valeur }}"
              - alias: "TV : marche / arrêt"
                conditions: "{{ emplacement == 'tv' and commande == 'alimentation' }}"
                sequence:
                  - if: "{{ sources.tv_telecommande != '' and states[sources.tv_telecommande] is not none }}"
                    then:
                      - action: remote.toggle
                        target:
                          entity_id: "{{ sources.tv_telecommande }}"
                    else:
                      - if: "{{ sources.tv != '' and states[sources.tv] is not none }}"
                        then:
                          - action: media_player.toggle
                            target:
                              entity_id: "{{ sources.tv }}"
              - alias: "TV : touche de la télécommande"
                conditions: >-
                  {{ emplacement == 'tv' and commande == 'touche' and sources.tv_telecommande != ''
                     and states[sources.tv_telecommande] is not none }}
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: "{{ sources.tv_telecommande }}"
                    data:
                      command: "{{ valeur }}"
              - alias: "TV : application (script tab5_tv_app, package tab5_tv.yaml)"
                conditions: "{{ emplacement == 'tv' and commande == 'appli' and states['script.tab5_tv_app'] is not none }}"
                sequence:
                  - action: script.tab5_tv_app
                    data:
                      app: "{{ valeur }}"
              - alias: "Volet : ouvrir, fermer, arrêter"
                conditions: "{{ emplacement == 'volet' and commande in ['ouvrir', 'fermer', 'arreter'] }}"
                sequence:
                  - variables:
                      sens: "{{ {'ouvrir': 'open', 'fermer': 'close', 'arreter': 'stop'}[commande] }}"
                  - choose:
                      - alias: "Volet suivi par le package (course simulée)"
                        conditions: "{{ volet_par_package }}"
                        sequence:
                          - action: script.tab5_volet_action
                            data:
                              action: "{{ sens }}"
                      - alias: "Volet qui signale sa course"
                        conditions: "{{ volet != '' }}"
                        sequence:
                          - action: "cover.{{ sens }}_cover"
                            target:
                              entity_id: "{{ volet }}"

              # ---- Tuiles et pièces (ADR-0023), par domaine de l'entité de la tuile ----
              - alias: "Tuile : basculer, allumer, éteindre (lum, int, med)"
                conditions: >-
                  {{ t_commande in ['basculer', 'allumer', 'eteindre']
                     and t_domaine in ['light', 'switch', 'input_boolean', 'fan', 'humidifier', 'automation', 'media_player'] }}
                sequence:
                  - action: "{{ t_domaine }}.{{ {'basculer': 'toggle', 'allumer': 'turn_on', 'eteindre': 'turn_off'}[t_commande] }}"
                    target:
                      entity_id: "{{ t_entite }}"
              - alias: "Tuile : ouvrir, fermer, arrêter (vol)"
                conditions: "{{ t_commande in ['ouvrir', 'fermer', 'arreter'] and t_domaine in ['cover', 'valve'] }}"
                sequence:
                  - variables:
                      sens: "{{ {'ouvrir': 'open', 'fermer': 'close', 'arreter': 'stop'}[t_commande] }}"
                  - choose:
                      - alias: "Volet suivi par le package (course simulée)"
                        conditions: "{{ t_entite == volet_suivi }}"
                        sequence:
                          - action: script.tab5_volet_action
                            data:
                              action: "{{ sens }}"
                    default:
                      - action: "{{ t_domaine }}.{{ sens }}_{{ t_domaine }}"
                        target:
                          entity_id: "{{ t_entite }}"
              - alias: "Tuile : lancer (act)"
                conditions: "{{ t_commande == 'lancer' and t_domaine in ['scene', 'script', 'button', 'input_button'] }}"
                sequence:
                  - action: >-
                      {{ {'scene': 'scene.turn_on', 'script': 'script.turn_on', 'button': 'button.press',
                          'input_button': 'input_button.press'}[t_domaine] }}
                    target:
                      entity_id: "{{ t_entite }}"
              - alias: "Tuile lumière : luminosité 0-255"
                conditions: "{{ t_commande == 'luminosite' and t_domaine == 'light' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ t_entite }}"
                    data:
                      brightness: "{{ valeur | int(0) }}"
              - alias: "Tuile lumière : luminosité en %"
                conditions: "{{ t_commande == 'luminosite_pct' and t_domaine == 'light' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ t_entite }}"
                    data:
                      brightness_pct: "{{ valeur | int(0) }}"
              - alias: "Tuile lumière : couleur"
                conditions: "{{ t_commande == 'couleur' and t_domaine == 'light' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ t_entite }}"
                    data:
                      color_name: "{{ valeur }}"
              - alias: "Pièce : tout éteindre (ses lumières)"
                conditions: "{{ emplacement is match('^p[0-4]$') and commande == 'eteindre' }}"
                sequence:
                  - variables:
                      lampes: >-
                        {%- set ns = namespace(l=[]) -%}
                        {%- for t in tuiles | selectattr('r', 'eq', emplacement[1] | int) | selectattr('type', 'eq', 'lum') -%}
                          {%- if states[t.e] is not none and t.e not in ns.l
                                and perso.get(t.e, {}).get('comportement', 'normal') not in ['allumer_seulement', 'lecture_seule'] -%}
                            {%- set ns.l = ns.l + [t.e] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.l }}
                  - if: "{{ lampes | count > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ lampes }}"

      - alias: "Clim : son état a changé"
        conditions: "{{ trigger.id == 'clim' and clim != '' }}"
        sequence:
          - action: "esphome.{{ tablette }}_tab5_maj_clim"
            data:
              target: "{{ state_attr(clim, 'temperature') | float(20) }}"
              current: "{{ state_attr(clim, 'current_temperature') | float(20) }}"
              mode: "{{ states(clim) }}"
              preset: "{{ state_attr(clim, 'preset_mode') | default('none', true) }}"
              fan: "{{ state_attr(clim, 'fan_mode') | default('auto', true) }}"
              swing: "{{ state_attr(clim, 'swing_mode') | default('stop', true) }}"
            continue_on_error: true

      - alias: "Volet qui signale sa course : son état a changé"
        conditions: "{{ trigger.id == 'volet' and volet != '' and not volet_par_package }}"
        sequence:
          - action: "esphome.{{ tablette }}_tab5_maj_volet_etat"
            data:
              etat_physique: >-
                {{ {'opening': 'En_mouvement', 'closing': 'En_mouvement', 'open': 'Ouvert', 'closed': 'Ferme'}.get(states(volet), states(volet)) }}
            continue_on_error: true

    # Connexion ou changement d'un emplacement : ses valeurs ; à la connexion, aussi la
    # clim et le volet (sans package), un peu après pour ne pas saturer la tablette.
    default:
      - if: "{{ payload != '' }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
            data:
              payload: "{{ payload }}"
            continue_on_error: true
      - if: "{{ trigger.id in ['connexion', 'rechargement'] and clim != '' }}"
        then:
          - delay: "00:00:01"
          - action: "esphome.{{ tablette }}_tab5_maj_clim"
            data:
              target: "{{ state_attr(clim, 'temperature') | float(20) }}"
              current: "{{ state_attr(clim, 'current_temperature') | float(20) }}"
              mode: "{{ states(clim) }}"
              preset: "{{ state_attr(clim, 'preset_mode') | default('none', true) }}"
              fan: "{{ state_attr(clim, 'fan_mode') | default('auto', true) }}"
              swing: "{{ state_attr(clim, 'swing_mode') | default('stop', true) }}"
            continue_on_error: true
      - if: "{{ trigger.id in ['connexion', 'rechargement'] and volet != '' and not volet_par_package }}"
        then:
          - delay: "00:00:01"
          - action: "esphome.{{ tablette }}_tab5_maj_volet_etat"
            data:
              etat_physique: >-
                {{ {'opening': 'En_mouvement', 'closing': 'En_mouvement', 'open': 'Ouvert', 'closed': 'Ferme'}.get(states(volet), states(volet)) }}
            continue_on_error: true
      # Après un rechargement, les zones aussi : un emplacement vidé ou rempli dans
      # l'automatisation doit disparaître ou revenir sans attendre que la tablette les
      # redemande (elle ne le fait qu'à sa connexion, ADR-0018).
      - if: "{{ trigger.id == 'rechargement' }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_zones"
            data:
              absentes: "{{ absentes }}"
            continue_on_error: true

  # ---- Tuiles des pièces (ADR-0023) ----
  # Définitions : un instantané complet (ce qui n'y est pas est vide), avant les états.
  # Calculées à chaque connexion quel que soit le protocole (la trace montre ce qui
  # partirait), envoyées seulement à une tablette 3.2 ou plus.
  - if: "{{ trigger.id in ['connexion', 'rechargement', 'zones'] or redefinir }}"
    then:
      - variables:
          # Nom de chaque pièce : saisi, sinon l'aire de ses appareils quand ceux qui en
          # ont une en ont une seule, sinon vide (la tablette écrit « Pièce n »).
          noms_pieces: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for n in range(5) -%}
              {%- set saisi = (noms_saisis[n] or '') | string | trim -%}
              {%- set aires = tuiles | selectattr('r', 'eq', n) | map(attribute='e') | map('area_name') | reject('none') | unique | list -%}
              {%- set ns.l = ns.l + [saisi if saisi else (aires[0] if aires | count == 1 else '')] -%}
            {%- endfor -%}
            {{ ns.l }}
          # « pR|nom; » puis « tRT|type|icône|options|complément|nom; » (ADR-0023).
          definitions: >-
            {%- set ns = namespace(r='') -%}
            {%- for n in range(5) -%}
              {%- set dans = tuiles | selectattr('r', 'eq', n) | list -%}
              {%- if dans | count > 0 -%}
                {%- set piece = noms_pieces[n] | string -%}
                {%- set ns.r = ns.r ~ 'p' ~ n ~ '|' ~ (piece | replace('|', '/') | replace(';', ',')) ~ ';' -%}
                {%- for t in dans -%}
                  {%- set dom = t.e.split('.')[0] -%}
                  {%- set p = perso.get(t.e, {}) -%}
                  {%- set classe = (state_attr(t.e, 'device_class') or '') | string -%}
                  {#- Icône : personnalisée, sinon l'attribut icon, sinon la classe, sinon le
                      domaine ; un « mdi: » hors palette prend le défaut du domaine. -#}
                  {%- set defaut = icones_defaut.get(dom ~ '.' ~ classe, icones_defaut.get(dom, '')) if classe else icones_defaut.get(dom, '') -%}
                  {%- set mdi = (p.get('icone') or state_attr(t.e, 'icon') or '') | string -%}
                  {%- set icone = icones_mdi.get(mdi, defaut) if mdi else defaut -%}
                  {#- Options : d (luminosité) et c (couleur) des modes de couleur ; o, k, r
                      du comportement ; t = la TV du blueprint ; m = sa clim. -#}
                  {%- set modes = state_attr(t.e, 'supported_color_modes') or [] -%}
                  {%- set c = p.get('comportement', 'normal') -%}
                  {%- set options = ('d' if t.type == 'lum' and modes | reject('in', ['onoff', 'unknown']) | list | count > 0 else '')
                                  ~ ('c' if t.type == 'lum' and modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | count > 0 else '')
                                  ~ ('o' if c == 'allumer_seulement' else '')
                                  ~ ('k' if c == 'confirmer' else '')
                                  ~ ('r' if c == 'lecture_seule' else '')
                                  ~ ('t' if t.type == 'med' and t.e == sources.tv else '')
                                  ~ ('m' if t.type == 'cli' and t.e == sources.clim else '') -%}
                  {#- Complément : unité d'un capteur (7 octets au plus), classe d'un bin. -#}
                  {%- if t.type == 'cap' -%}
                    {%- set u = namespace(s=(state_attr(t.e, 'unit_of_measurement') or '') | string) -%}
                    {%- for i in range(8) -%}{%- if u.s.encode('utf-8') | length > 7 -%}{%- set u.s = u.s[:-1] -%}{%- endif -%}{%- endfor -%}
                    {%- set complement = u.s -%}
                  {%- elif t.type == 'bin' -%}
                    {%- set complement = 'presence' if dom in ['device_tracker', 'person'] else ('lock' if dom == 'lock' else classe) -%}
                  {%- else -%}
                    {%- set complement = '' -%}
                  {%- endif -%}
                  {#- Nom : personnalisé, sinon le nom de l'entité sans celui de la pièce (mot
                      entier, casse ignorée, liaison « du », « de la »… qui reste en bout
                      retirée), sinon le nom de l'entité. -#}
                  {%- set fn = (state_attr(t.e, 'friendly_name') or t.e) | string | trim -%}
                  {%- set nom = namespace(s=(p.get('nom') or '') | string | trim) -%}
                  {%- if not nom.s -%}
                    {%- set nom.s = fn -%}
                    {%- set i = (fn | lower).find(piece | lower) if piece else -1 -%}
                    {%- set j = i + (piece | length) -%}
                    {%- if i >= 0 and (i == 0 or not fn[i - 1].isalnum()) and (j >= fn | length or not fn[j].isalnum()) -%}
                      {%- set reste = namespace(s=(fn[:i] ~ ' ' ~ fn[j:]).split() | join(' ')) -%}
                      {%- for m in [' de la', " de l'", ' du', ' des', ' de', " d'", ' la', ' le', ' les', " l'"] -%}
                        {%- if (reste.s | lower).endswith(m) -%}{%- set reste.s = reste.s[:(reste.s | length) - (m | length)] -%}{%- endif -%}
                      {%- endfor -%}
                      {%- set reste.s = reste.s | trim(' -–:,') -%}
                      {%- if reste.s -%}{%- set nom.s = reste.s -%}{%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- set ns.r = ns.r ~ t.cle ~ '|' ~ t.type ~ '|' ~ icone ~ '|' ~ options ~ '|'
                                ~ (complement | replace('|', '/') | replace(';', ',')) ~ '|'
                                ~ (nom.s | replace('|', '/') | replace(';', ',')) ~ ';' -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.r }}
      - if: "{{ protocole == 2 }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_tuiles"
            data:
              payload: "{{ definitions }}"
            continue_on_error: true
  # États : « tRT|état|valeur|couleur; » (ADR-0023). Valeur = luminosité 0-255 (lum),
  # position (vol), la mesure (cap), la température de la pièce (cli), nan sinon ;
  # couleur = « RRGGBB » d'une lumière allumée qui donne rgb_color.
  - if: "{{ tuiles_a_pousser | count > 0 }}"
    then:
      - variables:
          etats_tuiles: >-
            {%- set ns = namespace(r='') -%}
            {%- for t in tuiles if t.cle in tuiles_a_pousser and states[t.e] is not none -%}
              {%- set st = states[t.e] -%}
              {%- if t.e == volet_suivi -%}
                {%- set etat = {'En_mouvement': 'opening', 'Ouvert': 'open', 'Ferme': 'closed', 'Partiel': 'open'}.get(states('input_text.volet_serre_etat'), st.state) -%}
                {%- set v = 'nan' -%}
              {%- else -%}
                {%- set etat = st.state -%}
                {%- set brut = st.attributes.get('brightness') if t.type == 'lum'
                          else st.attributes.get('current_position') if t.type == 'vol'
                          else st.state if t.type == 'cap'
                          else st.attributes.get('current_temperature') if t.type == 'cli'
                          else none -%}
                {%- set v = brut | float('nan') -%}
              {%- endif -%}
              {%- set rgb = st.attributes.get('rgb_color') if t.type == 'lum' and st.state == 'on' else none -%}
              {%- set couleur = ('%02X%02X%02X' | format(rgb[0] | int(0), rgb[1] | int(0), rgb[2] | int(0))) if rgb and rgb | count == 3 else '' -%}
              {%- set ns.r = ns.r ~ t.cle ~ '|' ~ (etat | string | replace('|', '/') | replace(';', ',')) ~ '|' ~ v ~ '|' ~ couleur ~ ';' -%}
            {%- endfor -%}
            {{ ns.r }}
      - if: "{{ protocole == 2 and etats_tuiles != '' }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
            data:
              payload: "{{ etats_tuiles }}"
            continue_on_error: true
