    - !input rangee_ligne_2
    - !input rangee_ligne_3
    - !input nabu_ligne_1
    - !input nabu_ligne_2
    - !input nabu_ligne_3
  rangee_plantes: !input rangee_plantes
  rangee_duree: !input rangee_duree
  nabu_ecoute: !input nabu_ecoute
  nabu_duree: !input nabu_duree
  # Tuile − / + au choix (ADR-0033) : appareils choisis, dans l'ordre.
  reglables_choix: !input reglables
  # clé -> entité (chaîne vide si rien n'est choisi). Les détails des pots viennent de
  # l'appareil du capteur d'humidité, par classe (vérifié sur des Flower Care).
  sources: >-
    {%- set ns = namespace(d={}) -%}
    {%- for cle, v in choix.items() -%}
      {%- set ns.d = dict(ns.d, **{cle: (v if v is string else (v | first if v else ''))}) -%}
    {%- endfor -%}
    {%- for n in range(1, 6) -%}
      {%- set p = ns.d['pot_' ~ n] -%}
      {%- set dev = device_id(p) if p else none -%}
      {%- for suffixe, classe in [('ec', 'conductivity'), ('lux', 'illuminance'), ('temp', 'temperature'), ('bat', 'battery')] -%}
        {%- set e = (device_entities(dev) | select('match', 'sensor\\.') | select('is_state_attr', 'device_class', classe) | first | default('')) if dev else '' -%}
        {%- set ns.d = dict(ns.d, **{'pot_' ~ n ~ '_' ~ suffixe: e}) -%}
      {%- endfor -%}
    {%- endfor -%}
    {#- Agenda de travail laissé vide ici : celui de la liste « Tab5 · agenda de travail »
        (packages/tab5_reglages.yaml, ADR-0024), pour ne le choisir qu'une fois. -#}
    {%- set liste = states('select.tab5_agenda_de_travail') -%}
    {%- if not ns.d.get('planning') and liste.startswith('calendar.') and states[liste] is not none -%}
      {%- set ns.d = dict(ns.d, planning=liste) -%}
    {%- endif -%}
    {{ ns.d }}
  # Type de tuile par domaine : le tableau « Type | HA domains » de l'ADR-0023
  # (tests/test_tuiles_blueprint.py compare). Un autre domaine n'a pas de tuile.
  types_par_domaine:
    light: lum
    switch: int
    input_boolean: int
    fan: int
    humidifier: int
    automation: int
    cover: vol
    valve: vol
    media_player: med
    scene: act
    script: act
    button: act
    input_button: act
    sensor: cap
    number: cap
    input_number: cap
    binary_sensor: bin
    device_tracker: bin
    person: bin
    lock: bin
    climate: cli
  # entité -> {nom, icone, comportement} de la section « Personnaliser des tuiles » ;
  # la première ligne d'une entité compte.
  perso: >-
    {%- set ns = namespace(d={}) -%}
    {%- set lignes = personnalisation if personnalisation is iterable and personnalisation is not string and personnalisation is not mapping else [] -%}
    {%- for p in lignes -%}
      {%- if p is mapping and p.get('entite') is string and p.get('entite') not in ns.d -%}
        {%- set ns.d = dict(ns.d, **{p.get('entite'): {'nom': (p.get('nom') or '') | string, 'icone': (p.get('icone') or '') | string, 'comportement': (p.get('comportement') or 'normal') | string}}) -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.d }}
  # Protocole de la tablette : 2 (tuiles) si sa version de projet est 3.2.0 ou plus,
  # sinon 1. sw_version = « 3.1.0 (ESPHome 2026.9.0) », « 3.2.0-dev (…) » ; « rendu »
  # ou illisible = 1. Plusieurs tablettes : la plus ancienne décide (jamais une action
  # qu'une tablette n'a pas).
  protocole: >-
    {%- set ns = namespace(p=0) -%}
    {%- for e in integration_entities('esphome') | select('match', 'binary_sensor[.].*_ha_api_status$') -%}
      {%- if device_attr(e, 'model') == 'tab5-ha-hmi' -%}
        {%- set m = (device_attr(e, 'sw_version') or '') | string | regex_findall('^ *([0-9]+)[.]([0-9]+)[.]([0-9]+)') -%}
        {%- set p = 2 if m and (m[0][0] | int(0)) * 1000000 + (m[0][1] | int(0)) * 1000 + (m[0][2] | int(0)) >= 3002000 else 1 -%}
        {%- set ns.p = p if ns.p == 0 else [ns.p, p] | min -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.p if ns.p else 1 }}
  # Tuiles : [{cle: 'tRT', r: R, e: entité, type, s: entrée 3.x d'origine ou ''}].
  # Les cinq premières entités de chaque pièce qui existent et dont le domaine a un
  # type, dans l'ordre choisi. Pièce 1 vide : les entrées 3.x, à leurs places
  # (t00 = PC, à défaut TV ; t01 = volet ; t02..t04 = lumières 1 à 3). Une même
  # entité peut être dans plusieurs tuiles.
  tuiles: >-
    {%- set ns = namespace(l=[], t=0) -%}
    {%- for n in range(5) -%}
      {%- set brut = pieces[n] -%}
      {%- set liste = [brut] if brut is string else (brut if brut else []) -%}
      {%- set ns.t = 0 -%}
      {%- for e in liste -%}
        {%- if ns.t < 5 and e is string and e.split('.')[0] in types_par_domaine and states[e] is not none -%}
          {%- set ns.l = ns.l + [{'cle': 't' ~ n ~ ns.t, 'r': n, 'e': e, 'type': types_par_domaine[e.split('.')[0]], 's': ''}] -%}
          {%- set ns.t = ns.t + 1 -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if n == 0 and ns.t == 0 -%}
        {%- set premiere = 'pc' if sources.pc and states[sources.pc] is not none else 'tv' -%}
        {%- for s in [premiere, 'volet', 'lumiere_1', 'lumiere_2', 'lumiere_3'] -%}
          {%- set e = sources.get(s, '') -%}
          {%- if e and e.split('.')[0] in types_par_domaine and states[e] is not none -%}
            {%- set ns.l = ns.l + [{'cle': 't0' ~ loop.index0, 'r': 0, 'e': e, 'type': types_par_domaine[e.split('.')[0]], 's': s}] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.l }}
  # Rangée sous l'horloge (ADR-0031) et panneau Ok Nabu (lot 3, ADR-0041) :
  # [{cle: 'zLI', z: 'h' ou 'n', l: L, r: -1, e: entité, type, s: ''}], les quatre
  # premières entités de chaque ligne qui existent et dont le domaine a un type, sauf les
  # actions (scènes, scripts, boutons : rien à montrer). À part de `tuiles` : la liste
  # blanche des commandes de l'écran ne les connaît pas.
  rangee: >-
    {%- set ns = namespace(l=[], i=0) -%}
    {%- for n in range(6) -%}
      {%- set z = 'h' if n < 3 else 'n' -%}
      {%- set brut = rangee_lignes[n] -%}
      {%- set liste = [brut] if brut is string else (brut if brut else []) -%}
      {%- set ns.i = 0 -%}
      {%- for e in liste -%}
        {%- if ns.i < 4 and e is string and types_par_domaine.get(e.split('.')[0], 'act') != 'act' and states[e] is not none -%}
          {%- set ns.l = ns.l + [{'cle': z ~ (n % 3) ~ ns.i, 'z': z, 'l': n % 3, 'r': -1, 'e': e, 'type': types_par_domaine[e.split('.')[0]], 's': ''}] -%}
          {%- set ns.i = ns.i + 1 -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ ns.l }}
  # Clims des tuiles (ADR-0027) : les tuiles cli qui ne sont pas la clim du blueprint
  # (option m, dont climr et tab5_maj_clim portent les réglages et l'état). Chacune a ses
  # réglages (clé crRT) et son état (clé ceRT) ; son appui ouvre le popup pour elle.
  tuiles_clim: "{{ tuiles | selectattr('type', 'eq', 'cli') | rejectattr('e', 'eq', sources.clim) | list }}"
  # Climat des pièces (ADR-0040) : [{r: R, cle: 'cpR', temperature, humidite, clim}], une
  # entrée par pièce, chaque champ l'entité choisie si elle existe (et, pour la clim, si
  # c'est une clim), '' sinon. La tablette montre la pièce en mode HA quand temperature
  # est rempli. `cle` : l'emplacement des commandes de sa clim — la liste blanche des
  # commandes « cpR » (seule une clim déclarée ici en reçoit).
  pieces_climat: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for n in range(5) -%}
      {%- set choix = pieces_climat_choix[n] if pieces_climat_choix[n] is mapping else {} -%}
      {%- set v = namespace(d={'r': n, 'cle': 'cp' ~ n}) -%}
      {%- for k, domaine in [('temperature', 'sensor.'), ('humidite', 'sensor.'), ('clim', 'climate.')] -%}
        {%- set x = choix.get(k) -%}
        {%- set x = x if x is string else (x | first if x else '') -%}
        {%- set ok = x is string and x.startswith(domaine) and states[x] is not none -%}
        {%- set v.d = dict(v.d, **{k: x if ok else ''}) -%}
      {%- endfor -%}
      {%- set ns.l = ns.l + [v.d] -%}
    {%- endfor -%}
    {{ ns.l }}
  # Le volet que suit le package volet_serre_tracking.yaml : celui que nomme sa liste
  # « Tab5 · volet à course simulée », s'il existe. Sa tuile montre l'état tenu par le
  # package (input_text.volet_serre_etat), ses commandes passent par
  # script.tab5_volet_action. Liste sur « Aucun » (son défaut) ou package absent : '',
  # chaque volet est commandé directement. Avant le 06/10/2026, la seule présence du
  # script suffisait : un package copié sans choisir le volet rendait muet celui de
  # l'entrée Volet, le script s'arrêtant sur « Aucun » (discussion #278).
  volet_suivi: >-
    {%- set v = states('select.tab5_volet_a_course_simulee') -%}
    {{ v if states['script.tab5_volet_action'] is not none and v.startswith('cover.') and states[v] is not none else '' }}
  # L'entrée Volet (3.x) passe par le package seulement si c'est ce volet-là.
  volet_par_package: "{{ volet_suivi != '' and volet_suivi == sources.volet }}"
  # Tuile − / + au choix (ADR-0033) : type par domaine, le tableau de l'ADR (kTypes de
  # Tab5/ecran/tab5_reglables.cpp ; tests/test_reglables.py compare). Un autre domaine n'y
  # entre pas.
  types_reglables:
    media_player: son
    light: lum
    climate: cli
    water_heater: eau
    humidifier: hum
    fan: ven
    cover: vol
    valve: vol
    number: nbr
    input_number: nbr
  # [{cle: 'rN', e: entité, type}] : les huit premières entités choisies qui existent et
  # dont le domaine a un type, sans la clim du blueprint (la tablette la met déjà en
  # tête de sa liste), sans doublon ni appareil en lecture seule (personnalisation des
  # tuiles). C'est la liste blanche des commandes « regler » et « consigne » d'une clé rN.
  reglables: >-
    {%- set brut = reglables_choix -%}
    {%- set liste = [brut] if brut is string else (brut if brut else []) -%}
    {%- set ns = namespace(l=[], vus=[]) -%}
    {%- for e in liste -%}
      {%- if ns.l | count < 8 and e is string and e.split('.')[0] in types_reglables and states[e] is not none
            and e != sources.clim and e not in ns.vus
            and perso.get(e, {}).get('comportement', 'normal') != 'lecture_seule' -%}
        {%- set ns.l = ns.l + [{'cle': 'r' ~ (ns.l | count), 'e': e, 'type': types_reglables[e.split('.')[0]]}] -%}
        {%- set ns.vus = ns.vus + [e] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.l }}
  # Bornes de chacun : clé rN -> [min, max, pas, unité], lues sur l'appareil. Volume,
  # luminosité, vitesse, humidité et position en % ; une lampe sans variateur, un volet
  # ou une vanne sans position réglable ne connaissent que 0 et 100 (pas de 100 : − ferme
  # ou éteint, + ouvre ou allume). Consigne : bornes et pas de l'appareil, unité d'une
  # entité weather.* comme pour la clim (ADR-0026). Nombre : ses min, max, step et unité
  # (7 octets au plus). La même table borne la valeur reçue de la tablette.
  # Unités par « '' ~ » : dans HA ce sont des StrEnum, que « | string » laisse telles
  # quelles ; rangées dans la table, elles l'empêchent d'être relue (elle resterait du
  # texte : « 'str object' has no attribute 'get' »). tests/test_reglables.py.
  reglables_bornes: >-
    {%- set u = namespace(s='') -%}
    {%- for w in states.weather if not u.s -%}
      {%- set t = '' ~ w.attributes.get('temperature_unit', '') -%}
      {%- if t in ['°C', '°F'] -%}{%- set u.s = t -%}{%- endif -%}
    {%- endfor -%}
    {%- set ns = namespace(d={}) -%}
    {%- for r in reglables -%}
      {%- set a = states[r.e].attributes -%}
      {%- if r.type in ['cli', 'eau'] -%}
        {%- set mn = a.get('min_temp') | float(16.0 if r.type == 'cli' else 30.0) -%}
        {%- set mx = a.get('max_temp') | float(30.0 if r.type == 'cli' else 70.0) -%}
        {%- set unite = u.s if u.s else ('°F' if r.type == 'cli' and mn >= 40 else '°C') -%}
        {%- set pas = a.get('target_temp_step') | float(0) -%}
        {%- set b = [mn, mx, pas if pas > 0 else (1.0 if unite == '°F' else 0.5), unite] -%}
      {%- elif r.type == 'hum' -%}
        {%- set b = [a.get('min_humidity') | float(0), a.get('max_humidity') | float(100), 5, '%'] -%}
      {%- elif r.type == 'ven' -%}
        {%- set pas = a.get('percentage_step') | float(0) -%}
        {%- set b = [0, 100, (pas | round(2)) if pas >= 5 else 10, '%'] -%}
      {%- elif r.type == 'lum' -%}
        {%- set modes = a.get('supported_color_modes') or [] -%}
        {%- set b = [0, 100, 10 if modes | reject('in', ['onoff', 'unknown']) | list | count > 0 else 100, '%'] -%}
      {%- elif r.type == 'vol' -%}
        {%- set b = [0, 100, 10 if (a.get('supported_features') | int(0)) // 4 % 2 == 1 and r.e != volet_suivi else 100, '%'] -%}
      {%- elif r.type == 'nbr' -%}
        {%- set v = namespace(s='' ~ (a.get('unit_of_measurement') or '')) -%}
        {%- for i in range(8) -%}{%- if v.s.encode('utf-8') | length > 7 -%}{%- set v.s = v.s[:-1] -%}{%- endif -%}{%- endfor -%}
        {%- set pas = a.get('step') | float(1) -%}
        {%- set b = [a.get('min') | float(0), a.get('max') | float(100), pas if pas > 0 else 1, v.s] -%}
      {%- else -%}
        {%- set b = [0, 100, 5, '%'] -%}
      {%- endif -%}
      {%- set ns.d = dict(ns.d, **{r.cle: b}) -%}
    {%- endfor -%}
    {{ ns.d }}
  # Clés poussées par tab5_maj_emplacements (clim et volet ont leurs actions).
  cles_emplacements:
    - lumiere_1
    - lumiere_2
    - lumiere_3
    - pc
    - tv
    - telephone
    - salon
    - salon_hum
    - serre
    - pot_1
    - pot_2
    - pot_3
    - pot_4
    - pot_5
  # Clés des zones de l'écran (kCles de Tab5/ecran/tab5_zones.cpp). « discussion » n'est pas une
  # entrée : absente quand la liste « Tab5 · pipeline de discussion » vaut « Aucun »
  # (variable absentes, plus bas).
  cles_zones:
    - lumiere_1
    - lumiere_2
    - lumiere_3
    - pc
    - tv
    - telephone
    - salon
    - serre
    - pot_1
    - pot_2
    - pot_3
    - pot_4
    - pot_5
    - clim
    - volet
    - planning
    - discussion
  # Clim de n'importe quelle marque (ADR-0026) : les boutons de l'écran envoient les
  # noms de la Daikin de l'auteur (away pour Éco, quiet / auto, swing / stop, windnice) ;
  # les branches « Clim : … » envoient le premier de ces modes que l'appareil connaît, et
  # la clé climr dit à l'écran quels boutons montrer. Les mêmes listes que les fonctions
  # clim_*_actif() du firmware (Tab5/ecran/tab5_clim.cpp ; tests/test_clim.py compare). « on » et
  # « off » entre guillemets : sans eux, YAML 1.1 lit des booléens.
  clim_modes_consigne: [cool, heat, heat_cool, auto]
  clim_eco: [eco, away]
  clim_silence: [quiet, silence, Silence, low]
  clim_ventilation_normale: [medium, mid, middle, high]
  clim_oscillation: [swing, "on", both, vertical, 3d, horizontal]
  clim_arret_oscillation: [stop, "off"]
  # Attributs qui changent les réglages d'une clim : climr (ou crRT, clim d'une tuile)
  # repart quand l'un d'eux change, pas à chaque degré de la pièce.
  clim_attributs_reglages: [min_temp, max_temp, target_temp_step, hvac_modes, preset_modes, fan_modes, swing_modes, friendly_name]
  # Mesures lentes : poussées ensemble toutes les 5 minutes (déclencheur « mesures »),
  # celles qui ont changé seulement ; un pot part avec ses 4 détails si l'un des 5 a
  # changé. Poussées à chaque changement, elles faisaient ~1 300 exécutions par jour
  # chez l'auteur, dont 775 pour une température de serre qui oscille d'un dixième
  # toutes les 40 s (28/09/2026). L'écran affiche ce dixième : filtrer sur la valeur
  # affichée n'aurait rien retiré.
  cles_mesures:
    - telephone
    - salon
    - salon_hum
    - serre
    - pot_1
    - pot_2
    - pot_3
    - pot_4
    - pot_5
  # Période du déclencheur « mesures » (300 s), plus une marge : une mesure changée
  # juste au moment d'un passage repart au suivant, jamais perdue.
  fenetre_mesures: 310
  # Tuiles dont la valeur part avec les mesures lentes : les capteurs (état = la mesure)
  # et la température de la pièce d'une clim (current_temperature). Une clim part
  # aussi à chaque changement de mode et de consigne (déclencheur piece_n_consigne) ; un
  # capteur, jamais. Avec la tuile d'une clim part son état ceRT (ADR-0027) : sa
  # ventilation, son oscillation ou son préréglage changés depuis HA arrivent au plus
  # tard avec les mesures (5 minutes), sa consigne et son mode tout de suite.
  types_mesures:
    - cap
    - cli
  types_immediats:
    - lum
    - int
    - vol
    - med
    - act
    - bin
    - cli
  # Déclenchements qui poussent tout : la connexion de la tablette, le rechargement des
  # automatisations (dont l'enregistrement de celle-ci), « MAJ Écran » et le démarrage de
  # HA (la connexion d'une tablette plus rapide que HA est perdue, 28/09/2026). Une seule
  # liste, lue par cles, tuiles_a_pousser, solaire_a_pousser et les actions (audit du
  # 07/10/2026, HA-8 : elle était recopiée 9 fois).
  tout_pousser: "{{ trigger.id in ['connexion', 'rechargement', 'maj_ecran', 'demarrage_ha'] }}"
  # Emplacements à pousser pour ce déclenchement.
  cles: >-
    {%- if tout_pousser -%}
      {%- set ns = namespace(l=[]) -%}
      {%- for c in cles_emplacements -%}
        {%- set ns.l = ns.l + [c] + ([c ~ '_ec', c ~ '_lux', c ~ '_temp', c ~ '_bat'] if c.startswith('pot_') else []) -%}
      {%- endfor -%}
      {{ ns.l }}
    {%- elif trigger.id == 'mesures' -%}
      {%- set ns = namespace(l=[], vu=false) -%}
      {%- for c in cles_mesures -%}
        {%- set groupe = [c] + ([c ~ '_ec', c ~ '_lux', c ~ '_temp', c ~ '_bat'] if c.startswith('pot_') else []) -%}
        {%- set ns.vu = false -%}
        {%- for k in groupe -%}
          {%- set x = sources.get(k, '') -%}
          {%- if x and states[x] is not none and (now() - states[x].last_changed).total_seconds() < fenetre_mesures -%}
            {%- set ns.vu = true -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if ns.vu -%}{%- set ns.l = ns.l + groupe -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.l }}
    {%- elif trigger.id in cles_emplacements -%}
      {#- Lumières, PC, TV : seulement si ce que montre l'écran change (état, luminosité),
          pas pour un autre attribut (couleur, titre en cours de lecture…). -#}
      {%- set avant = trigger.from_state -%}
      {%- set apres = trigger.to_state -%}
      {%- if avant is none or apres is none or avant.state != apres.state
            or avant.attributes.get('brightness') != apres.attributes.get('brightness') -%}
        {{ [trigger.id] }}
      {%- else -%}
        {{ [] }}
      {%- endif -%}
    {%- else -%}
      {{ [] }}
    {%- endif -%}
  # Une entité d'une tuile apparaît ou disparaît : les définitions changent, elles
  # repartent (avec tous les états), sans attendre une reconnexion.
  redefinir: >-
    {{ protocole == 2
       and (trigger.id.startswith('piece_') or trigger.id.startswith('rangee_') or trigger.id.startswith('nabu_')
            or trigger.id.startswith('reglable')
            or trigger.id in ['pc', 'tv', 'volet', 'lumiere_1', 'lumiere_2', 'lumiere_3'])
       and trigger.from_state is defined and (trigger.from_state is none or trigger.to_state is none) }}
  # Tuiles à pousser (clés tRT), et éléments de la rangée sous l'horloge (clés hLI,
  # ADR-0031) et du panneau Ok Nabu (clés nLI, ADR-0041). Toutes après les définitions ; une tuile quand son entité change ce que
  # l'écran montre (état, luminosité, couleur, position, consigne d'une clim : les − / +
  # du popup comptent à partir d'elle) ; un élément de la rangée quand son état change ;
  # les types_mesures avec les mesures lentes. Calculées quel que soit le protocole (la
  # trace montre ce qui partirait), poussées seulement au protocole 2.
  tuiles_a_pousser: >-
    {%- if tout_pousser or trigger.id == 'zones' or redefinir -%}
      {{ (tuiles + rangee) | map(attribute='cle') | list }}
    {%- elif trigger.id == 'mesures' -%}
      {%- set ns = namespace(l=[]) -%}
      {%- for t in tuiles + rangee if t.type in types_mesures and states[t.e] is not none -%}
        {%- set depuis = states[t.e].last_changed if t.type == 'cap' else states[t.e].last_updated -%}
        {%- if (now() - depuis).total_seconds() < fenetre_mesures -%}{%- set ns.l = ns.l + [t.cle] -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.l }}
    {%- elif trigger.id == 'volet_suivi' -%}
      {{ ((tuiles + rangee) | selectattr('e', 'eq', volet_suivi) | map(attribute='cle') | list) if volet_suivi else [] }}
    {%- elif trigger.id == 'volet_choisi' -%}
      {#- Volet changé dans la liste du package : les tuiles de l'ancien (son état réel
          revient) et du nouveau (l'état tenu par le package). -#}
      {%- set vises = [trigger.from_state.state if trigger.from_state else '',
                       trigger.to_state.state if trigger.to_state else ''] | select('match', '^cover[.]') | list -%}
      {{ (tuiles + rangee) | selectattr('e', 'in', vises) | map(attribute='cle') | list }}
    {%- elif trigger.from_state is defined and (trigger.id.startswith('rangee_') or trigger.id.startswith('nabu_')) -%}
      {#- Rangée et panneau Ok Nabu : l'état seulement (déclencheurs rangee_n,
          rangee_n_sortie, nabu_n, nabu_n_sortie). -#}
      {{ rangee | selectattr('z', 'eq', 'h' if trigger.id.startswith('rangee_') else 'n')
         | selectattr('l', 'eq', trigger.id.split('_')[1] | int - 1) | selectattr('e', 'eq', trigger.entity_id)
         | selectattr('type', 'in', types_immediats) | map(attribute='cle') | list }}
    {%- elif trigger.from_state is defined and (trigger.id.startswith('piece_') or trigger.id in ['pc', 'tv', 'volet', 'lumiere_1', 'lumiere_2', 'lumiere_3']) -%}
      {%- set avant = trigger.from_state -%}
      {%- set apres = trigger.to_state -%}
      {%- set ns = namespace(vu=avant is none or apres is none or avant.state != apres.state) -%}
      {%- for a in ['brightness', 'rgb_color', 'current_position', 'temperature'] -%}
        {%- if not ns.vu and avant.attributes.get(a) != apres.attributes.get(a) -%}{%- set ns.vu = true -%}{%- endif -%}
      {%- endfor -%}
      {%- if not ns.vu -%}
        {{ [] }}
      {%- elif trigger.id.startswith('piece_') -%}
        {{ tuiles | selectattr('r', 'eq', trigger.id[6] | int - 1) | selectattr('e', 'eq', trigger.entity_id)
           | selectattr('type', 'in', types_immediats) | map(attribute='cle') | list }}
      {%- else -%}
        {{ tuiles | selectattr('s', 'eq', trigger.id) | selectattr('type', 'in', types_immediats) | map(attribute='cle') | list }}
      {%- endif -%}
    {%- else -%}
      {{ [] }}
    {%- endif -%}
  # Appareils de la tuile − / + (clés rN, ADR-0033) : tous après les définitions ; un
  # quand son entité change ce que la tuile montre (déclencheurs reglable_… : l'état, ou
  # l'attribut de sa valeur). Poussés seulement au protocole 2 (un firmware qui ne les
  # connaît pas ignore la clé).
  reglables_a_pousser: >-
    {%- if tout_pousser or trigger.id == 'zones' or redefinir -%}
      {{ reglables | map(attribute='cle') | list }}
    {%- elif trigger.from_state is defined and trigger.id.startswith('reglable') -%}
      {{ reglables | selectattr('e', 'eq', trigger.entity_id) | map(attribute='cle') | list }}
    {%- else -%}
      {{ [] }}
    {%- endif -%}
  # Climat des pièces à pousser (ADR-0040) : les numéros R des pièces. Toutes avec les
  # définitions, vides comprises (« pR|||0; » : la tablette oublie ce qui a été retiré du
  # blueprint) ; avec les mesures lentes, celles dont une sonde a changé ou dont la clim a
  # bougé (pièce, ventilation…) depuis le passage d'avant ; une seule quand sa clim change
  # d'état ou de consigne (déclencheurs piece_n_clim, piece_n_clim_consigne) : les − / +
  # comptent à partir de sa consigne. Poussées seulement au protocole 2.
  pieces_climat_a_pousser: >-
    {%- if tout_pousser or trigger.id == 'zones' or redefinir -%}
      {{ pieces_climat | map(attribute='r') | list }}
    {%- elif trigger.id == 'mesures' -%}
      {%- set ns = namespace(l=[]) -%}
      {%- for p in pieces_climat if p.temperature -%}
        {%- set vu = namespace(v=false) -%}
        {%- for x in [p.temperature, p.humidite] if x and (now() - states[x].last_changed).total_seconds() < fenetre_mesures -%}
          {%- set vu.v = true -%}
        {%- endfor -%}
        {%- if p.clim and (now() - states[p.clim].last_updated).total_seconds() < fenetre_mesures -%}
          {%- set vu.v = true -%}
        {%- endif -%}
        {%- if vu.v -%}{%- set ns.l = ns.l + [p.r] -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.l }}
    {%- elif trigger.from_state is defined and trigger.id.startswith('piece_')
          and (trigger.id.endswith('_clim') or trigger.id.endswith('_clim_consigne')) -%}
      {{ pieces_climat | selectattr('r', 'eq', trigger.id[6] | int - 1) | selectattr('clim', 'eq', trigger.entity_id)
         | map(attribute='r') | list }}
    {%- else -%}
      {{ [] }}
    {%- endif -%}
  # Météo choisie ici (section « Météo », discussion #278). Vide ([] ou « liste ») = rien.
  meteo_choisie:
    previsions: !input meteo_previsions
    pluie: !input meteo_pluie
    vigilance: !input meteo_vigilance
  # Déclencheurs de la météo (plus bas) : enregistrement, démarrage de HA, liste changée.
  meteo_declencheurs: [meteo_rechargement, meteo_demarrage, meteo_liste]
  # Ce que ces déclencheurs doivent écrire dans les listes du package
  # tab5_meteo_sources : [{entite, valeur}], seulement les champs remplis dont la liste
  # existe et dit autre chose. Une seule source fait foi à un instant donné : la liste, que
  # lisent sensor.tab5_sources_meteo, sensor.tab5_meteo et les capteurs de pluie et de
  # vigilance ; le blueprint, rempli, la tient à jour.
  #   - rechargement des automatisations (enregistrement du blueprint) et démarrage de HA :
  #     toujours ;
  #   - changement d'une liste : seulement s'il vient d'une personne (context.user_id de
  #     l'état, renseigné pour l'interface, l'API et le select « Tab5 · source des
  #     prévisions », qui écrit l'input_text dans le contexte de son appel). L'écriture
  #     d'une automatisation (celle-ci, ou celle d'une autre tablette réglée autrement) n'en
  #     a pas : jamais de ping-pong entre deux automatisations.
  # Météo choisie qui n'existe pas (encore) : rien d'écrit, la liste et son repli restent.
  # Option absente de la liste (package plus ancien) : rien non plus.
  meteo_a_ecrire: >-
    {%- set ns = namespace(l=[]) -%}
    {%- set par_une_personne = trigger.id != 'meteo_liste'
          or (trigger.to_state is not none and trigger.to_state.context.user_id is not none) -%}
    {%- if trigger.id in meteo_declencheurs and par_une_personne -%}
      {%- set m = meteo_choisie.previsions -%}
      {%- set m = m if m is string else (m | first if m else '') -%}
      {%- set liste = 'input_text.tab5_meteo_previsions' -%}
      {%- if m and states[m] is not none and states[liste] is not none and states(liste) != m -%}
        {%- set ns.l = ns.l + [{'entite': liste, 'valeur': m}] -%}
      {%- endif -%}
      {%- for cle, liste in [('pluie', 'input_select.tab5_source_pluie'), ('vigilance', 'input_select.tab5_source_vigilance')] -%}
        {%- set v = meteo_choisie[cle] if meteo_choisie[cle] is string else '' -%}
        {%- if v not in ['', 'liste'] and states[liste] is not none
              and v in (state_attr(liste, 'options') or []) and states(liste) != v -%}
          {%- set ns.l = ns.l + [{'entite': liste, 'valeur': v}] -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {{ ns.l }}
  # Énergie (ADR-0028) : capteurs de la section « Énergie », texte vide si rien n'est
  # choisi. Une tuile cap de l'un d'eux (energie_capteurs) prend l'option e ; tous partent
  # vers script.tab5_energie quand la tablette ouvre son popup (branche « popup Énergie »).
  energie_choix:
    solaire: !input energie_solaire
    production: !input energie_production
    reseau: !input energie_reseau
    reseau_export: !input energie_reseau_export
    maison: !input energie_maison
    batterie: !input energie_batterie
    batterie_puissance: !input energie_batterie_puissance
    batterie_temperature: !input energie_batterie_temperature
  energie: >-
    {%- set ns = namespace(d={}) -%}
    {%- for cle, v in energie_choix.items() -%}
      {%- set ns.d = dict(ns.d, **{cle: (v if v is string else (v | first if v else ''))}) -%}
    {%- endfor -%}
    {{ ns.d }}
  # Plusieurs sources solaires (discussion #278) : toutes les puissances et tous les
  # compteurs, le champ principal d'abord puis les « autres ». Chaque champ peut être une
  # chaîne (automatisation d'avant), une liste ou vide. energie garde, lui, la première
  # entité de chaque champ : un package tab5_energie plus ancien lit encore solaire et
  # production (la première source seulement), le nouveau lit solaires et productions.
  energie_solaire_autres: !input energie_solaire_autres
  energie_production_autres: !input energie_production_autres
  energie_solaires: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for v in [energie_choix.solaire, energie_solaire_autres] -%}
      {%- set ns.l = ns.l + ([v] if v is string else ((v | list) if v else [])) -%}
    {%- endfor -%}
    {{ ns.l | select('string') | reject('eq', '') | unique | list }}
  energie_productions: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for v in [energie_choix.production, energie_production_autres] -%}
      {%- set ns.l = ns.l + ([v] if v is string else ((v | list) if v else [])) -%}
    {%- endfor -%}
    {{ ns.l | select('string') | reject('eq', '') | unique | list }}
  energie_capteurs: "{{ ((energie.values() | select | list) + energie_solaires + energie_productions) | unique | list }}"
  energie_reseau_inverse: !input energie_reseau_inverse
  energie_batterie_inverse: !input energie_batterie_inverse
  # Icône solaire du bandeau d'état (clé solaire de tab5_maj_emplacements) : puissance
  # des panneaux en % de leur crête (energie_crete, kWc), arrondie et bornée 0-100 (un
  # onduleur qui lit -3 W la nuit donne 0). Plusieurs sources : la somme de celles qui
  # ont une valeur (un onduleur « unavailable » la nuit est ignoré). « nan » sans
  # capteur, sans crête ou sans aucune valeur : l'icône disparaît. Unité lue sur chaque
  # capteur (W, kW ou MW ; W sinon).
  energie_crete: !input energie_crete
  # Popup Température (ADR-0032) : la seconde température est-elle dehors ?
  serre_exterieure: !input serre_exterieure
  solaire_pourcent: >-
    {%- set crete = energie_crete | float(0) -%}
    {%- set ns = namespace(w=0, n=0) -%}
    {%- for x in energie_solaires if states(x) | is_number -%}
      {%- set u = state_attr(x, 'unit_of_measurement') | default('W', true) | string -%}
      {%- set ns.w = ns.w + states(x) | float * {'kW': 1000, 'MW': 1000000}.get(u, 1) -%}
      {%- set ns.n = ns.n + 1 -%}
    {%- endfor -%}
    {%- if crete > 0 and ns.n > 0 -%}
      {{ [[(ns.w / (crete * 1000) * 100) | round(0) | int, 0] | max, 100] | min }}
    {%- else -%}
      nan
    {%- endif -%}
  # Quand la pousser : avec tous les états (connexion, rechargement, MAJ Écran, démarrage
  # de HA), « nan » compris quand rien n'est choisi ; puis avec les mesures lentes, toutes
  # les 5 minutes, seulement si le capteur a changé depuis le passage d'avant. Pas à
  # chaque changement : un onduleur publie toutes les 5 à 30 s, et l'écran ne montre
  # qu'un palier de couleur. Au plus 12 poussées par heure de soleil, aucune la nuit
  # (capteur figé à 0), et elles partent dans le passage des mesures qui a lieu de toute
  # façon. Filtrer sur le palier demanderait de retenir le dernier envoyé (une entrée de
  # plus dans un package) : 5 minutes de retard au plus sur une couleur ont suffi.
  solaire_a_pousser: >-
    {%- set ns = namespace(change=false) -%}
    {%- for x in energie_solaires if states[x] is not none
          and (now() - states[x].last_changed).total_seconds() < fenetre_mesures -%}
      {%- set ns.change = true -%}
    {%- endfor -%}
    {{ tout_pousser
       or (trigger.id == 'mesures' and energie_crete | float(0) > 0 and ns.change) }}
  # Gestes de l'horloge et des boutons du haut (section « Horloge et boutons du haut ») :
  # codes de kCodesGestes (Tab5/ecran/tab5_zones.cpp) plus « auto », dans le même ordre
  # (tests/test_gestes.py). Un code hors de la liste (automatisation écrite à la main) part
  # en « auto ».
  codes_gestes: [auto, rien, assistant, calendrier, reveil, clim, plantes, tv, console, energie,
                 reglages, alertes, arcade, maison, mode_domo, appareil_suivant, rangee_suivante,
                 ecoute, nabu_suivant, lumieres, volet, temperature, roue, meteo, zone_gauche_suivante,
                 musique, cameras, suivi, froid]
  # Popup Caméras (ADR-0049) : lues par la branche « La tablette demande ses caméras ».
  cameras_liste: !input cameras_liste
  cameras_adresse: !input cameras_adresse
  # « gestes|c1|…|c12; » : les 12 gestes dans l'ORDRE de l'enum Geste (tab5_zones.h) —
  # heures tap, heures long, minutes tap, minutes long, date tap, date long, maison tap,
  # maison long, engrenage tap, engrenage long, manette tap, manette long. Poussé avec
  # tous les états (connexion, rechargement — dont l'enregistrement de l'automatisation —,
  # MAJ Écran, démarrage de HA). Un firmware plus ancien ignore la clé.
  gestes_choix:
    - !input geste_heures_court
    - !input geste_heures_long
    - !input geste_minutes_court
    - !input geste_minutes_long
    - !input geste_date_court
    - !input geste_date_long
    - !input geste_maison_court
    - !input appui_maison
    - !input geste_engrenage_court
    - !input appui_engrenage
    - !input geste_manette_court
    - !input appui_manette
  gestes: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for c in gestes_choix -%}
      {%- set ns.l = ns.l + [c if c is string and c in codes_gestes else 'auto'] -%}
    {%- endfor -%}
    gestes|{{ ns.l | join('|') }};
  # Appuis longs des boutons du haut, l'ancienne clé (07/10/2026) : « appuis|maison|
  # engrenage|manette; », pour un firmware 3.7, qui ne lit pas « gestes » (une action de
  # l'accueil y vaut « auto ») ; un firmware plus récent la laisse de côté quand « gestes »
  # est dans le même payload. Poussée avec tous les états, comme gestes.
  appuis_choix:
    - !input appui_maison
    - !input appui_engrenage
    - !input appui_manette
  appuis: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for c in appuis_choix -%}
      {%- set ns.l = ns.l + [c if c is string and c in codes_gestes else 'auto'] -%}
    {%- endfor -%}
    appuis|{{ ns.l | join('|') }};
  # Défilement au choix (lot 3, 09/10/2026, ADR-0041) : « defil|rangée|nabu|clim|
  # secondes; », chaque zone « auto » ou « fixe » (autre chose : son défaut, auto pour la
  # rangée, fixe pour les deux autres) ; secondes = durée d'un appareil de la tuile − / +
  # en auto. Poussée avec tous les états, comme gestes ; un firmware plus ancien ignore la
  # clé, un firmware 3.8 remet les défauts quand gestes arrive sans elle.
  defilement_choix:
    - !input rangee_defilement
    - !input nabu_defilement
    - !input reglables_defilement
  reglables_duree: !input reglables_duree
  defil: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for c in defilement_choix -%}
      {%- set ns.l = ns.l + [c if c in ['auto', 'fixe'] else ''] -%}
    {%- endfor -%}
    defil|{{ ns.l | join('|') }}|{{ reglables_duree | float(32) | round(0) | int }};
  # Zone à gauche de l'horloge (ADR-0051, 10/10/2026) : « gauche|départ|c1|c2…; », codes
  # de kZoneGaucheCodes (Tab5/socle/tab5_parse.h, même ordre). Un départ inconnu part en
  # « vocal » ; un code inconnu du cycle est laissé de côté. Poussée avec tous les états,
  # comme gestes ; un firmware plus ancien ignore la clé.
  codes_gauche: [vocal, graphique, lecteur, capteur]
  gauche_depart: !input gauche_depart
  gauche_cycle: !input gauche_cycle
  gauche: >-
    {%- set d = gauche_depart if gauche_depart is string and gauche_depart in codes_gauche else 'vocal' -%}
    {%- set liste = [gauche_cycle] if gauche_cycle is string else (gauche_cycle or []) -%}
    {%- set ns = namespace(l=[d]) -%}
    {%- for c in liste -%}
      {%- if c is string and c in codes_gauche and c not in ns.l -%}
        {%- set ns.l = ns.l + [c] -%}
      {%- endif -%}
    {%- endfor -%}
    gauche|{{ ns.l | join('|') }};
  # Télécommandes du popup (ADR-0056, 10/10/2026) : celle de la TV, puis les autres, sans
  # doublon, 4 au plus. Leur rang est leur emplacement (telecommande_emplacements, même
  # ordre que telecommande_emplacement() de Tab5/socle/tab5_parse.cpp) : « tv » pour la
  # première, celui qu'envoie un firmware d'avant l'ADR-0056. Une télécommande
  # indisponible garde sa place (les pages ne bougent pas quand un boîtier dort).
  telecommandes_choix: !input telecommandes_autres
  telecommande_emplacements: [tv, tv1, tv2, tv3]
  telecommandes: >-
    {%- set autres = [telecommandes_choix] if telecommandes_choix is string else (telecommandes_choix or []) -%}
    {%- set ns = namespace(l=[]) -%}
    {%- for e in [sources.tv_telecommande] + autres -%}
      {%- if e is string and e.startswith('remote.') and e not in ns.l and ns.l | length < 4 -%}
        {%- set ns.l = ns.l + [e] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.l }}
  # « telecommandes|écran|nom|…; » : écran « boitier » pour l'intégration Apple TV (Apple
  # TV, Freebox Player : pavé, lecture, volume), « tv » sinon (les touches KEY_* d'une TV
  # Samsung, ses applications) ; codes de kTelecommandeEcranCodes (tab5_parse.h). Nom :
  # celui de l'appareil sans sa pièce ni sa parenthèse finale (« Salon · Freebox Player
  # (Apple TV 3) » → « Freebox Player ») ; vide pour une entité que HA ne connaît plus (le
  # firmware écrit « Télécommande N », jamais un identifiant). Poussée avec tous les
  # états, même vide (une liste vidée efface les pages) ; un firmware plus ancien ignore
  # la clé.
  telecommandes_pousse: >-
    {%- set boitiers = integration_entities('apple_tv') -%}
    {%- set ns = namespace(l=[]) -%}
    {%- for e in telecommandes -%}
      {%- set dev = device_id(e) -%}
      {%- set fn = (((device_attr(dev, 'name_by_user') or device_attr(dev, 'name')) if dev else '')
                    or state_attr(e, 'friendly_name') or '') | string | trim -%}
      {%- set piece = (area_name(e) or '') | string -%}
      {%- set nom = namespace(s=fn) -%}
      {%- set i = (fn | lower).find(piece | lower) if piece else -1 -%}
      {%- set j = i + (piece | length) -%}
      {%- if i >= 0 and (i == 0 or not fn[i - 1].isalnum()) and (j >= fn | length or not fn[j].isalnum()) -%}
        {%- set reste = (fn[:i] ~ ' ' ~ fn[j:]).split() | join(' ') | trim(' -–:,·') -%}
        {%- if reste -%}{%- set nom.s = reste -%}{%- endif -%}
      {%- endif -%}
      {%- if nom.s.endswith(')') and nom.s.rfind(' (') > 0 -%}{%- set nom.s = nom.s[:nom.s.rfind(' (')] | trim -%}{%- endif -%}
      {%- set ns.l = ns.l + [('boitier' if e in boitiers else 'tv'), nom.s | replace('|', '/') | replace(';', ',')] -%}
    {%- endfor -%}
    telecommandes|{{ ns.l | join('|') }};
  # Touches de l'écran (codes KEY_* d'une TV Samsung, le vocabulaire commun) → commandes de
  # l'intégration Apple TV (méthodes RemoteControl de pyatv, vérifiées le 10/10/2026 dans
  # homeassistant/components/apple_tv/remote.py : tout nom passe par getattr, sauf
  # turn_on / turn_off / volume_up / volume_down). Pas de muet ni de source chez pyatv :
  # ces touches-là n'envoient rien (le popup ne les montre pas sur un boîtier).
  telecommande_apple_tv:
    KEY_UP: up
    KEY_DOWN: down
    KEY_LEFT: left
    KEY_RIGHT: right
    KEY_ENTER: select
    KEY_RETURN: menu
    KEY_MENU: top_menu
    KEY_HOME: home
    KEY_PLAY: play
    KEY_PAUSE: pause
    KEY_PLAYPAUSE: play_pause
    KEY_STOP: stop
    KEY_REWIND: skip_backward
    KEY_FF: skip_forward
    KEY_PREV: previous
    KEY_NEXT: next
    KEY_VOLUP: volume_up
    KEY_VOLDOWN: volume_down

triggers:
  - trigger: event
    event_type: esphome.tab5_connected
    id: connexion
  - trigger: event
    event_type: esphome.tab5_zones
    id: zones
  - trigger: event
    event_type: esphome.tab5_action
    id: action
  # Popup Énergie (ADR-0028) : ouvert, ou sa vue changée (donnée vue).
  - trigger: event
    event_type: esphome.tab5_energie
    id: energie
  # Popup Température (ADR-0032) : ouvert, ou sa vue changée (données cle, vue).
  - trigger: event
    event_type: esphome.tab5_historique
    id: historique
  # Popup Musique (ADR-0050) : ouvert par une tuile med (donnée lecteur = sa clé tRT).
  - trigger: event
    event_type: esphome.tab5_lecteur
    id: lecteur
  # Popup Caméras (ADR-0049) : ouvert, toutes les 4 minutes s'il le reste, après un échec.
  - trigger: event
    event_type: esphome.tab5_cameras
    id: cameras
  - trigger: state
    entity_id: !input lumiere_1
    id: lumiere_1
  - trigger: state
