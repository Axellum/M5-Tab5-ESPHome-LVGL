  # <<< icones
  tablette: !input tablette
  choix:
    lumiere_1: !input lumiere_1
    lumiere_2: !input lumiere_2
    lumiere_3: !input lumiere_3
    pc: !input pc
    tv: !input tv
    tv_telecommande: !input tv_telecommande
    telephone: !input telephone
    salon: !input salon_temperature
    salon_hum: !input salon_humidite
    serre: !input serre_temperature
    clim: !input clim
    volet: !input volet
    pot_1: !input pot_1
    pot_2: !input pot_2
    pot_3: !input pot_3
    pot_4: !input pot_4
    pot_5: !input pot_5
    planning: !input agenda_travail
  # Pièces (ADR-0023) : pieces[n] = entités de la pièce n + 1, dans l'ordre choisi.
  pieces:
    - !input piece_1_tuiles
    - !input piece_2_tuiles
    - !input piece_3_tuiles
    - !input piece_4_tuiles
    - !input piece_5_tuiles
  noms_saisis:
    - !input piece_1_nom
    - !input piece_2_nom
    - !input piece_3_nom
    - !input piece_4_nom
    - !input piece_5_nom
  personnalisation: !input personnalisation
  # Rangée sous l'horloge (ADR-0031) : lignes choisies, place des plantes, durée.
  rangee_lignes:
    - !input rangee_ligne_1
    - !input rangee_ligne_2
    - !input rangee_ligne_3
  rangee_plantes: !input rangee_plantes
  rangee_duree: !input rangee_duree
  # Tuile − / + au choix (ADR-0033) : appareils choisis, dans l'ordre.
  reglables_choix: !input reglables
  # clé -> entité (chaîne vide si rien n'est choisi). Les détails des pots viennent de
  # l'appareil du capteur d'humidité, par classe (vérifié sur des Flower Care).
  sources: >-
    {%- set ns = namespace(d={}) -%}
    {%- for cle, v in choix.items() -%}
      {%- set ns.d = dict(ns.d, **{cle: (v if v is string else (v | first if v else ''))}) -%}
    {%- endfor -%}
    {%- for n in range(1, 6) -%}
      {%- set p = ns.d['pot_' ~ n] -%}
      {%- set dev = device_id(p) if p else none -%}
      {%- for suffixe, classe in [('ec', 'conductivity'), ('lux', 'illuminance'), ('temp', 'temperature'), ('bat', 'battery')] -%}
        {%- set e = (device_entities(dev) | select('match', 'sensor\\.') | select('is_state_attr', 'device_class', classe) | first | default('')) if dev else '' -%}
        {%- set ns.d = dict(ns.d, **{'pot_' ~ n ~ '_' ~ suffixe: e}) -%}
      {%- endfor -%}
    {%- endfor -%}
    {#- Agenda de travail laissé vide ici : celui de la liste « Tab5 · agenda de travail »
        (packages/tab5_reglages.yaml, ADR-0024), pour ne le choisir qu'une fois. -#}
    {%- set liste = states('select.tab5_agenda_de_travail') -%}
    {%- if not ns.d.get('planning') and liste.startswith('calendar.') and states[liste] is not none -%}
      {%- set ns.d = dict(ns.d, planning=liste) -%}
    {%- endif -%}
    {{ ns.d }}
  # Type de tuile par domaine : le tableau « Type | HA domains » de l'ADR-0023
  # (tests/test_tuiles_blueprint.py compare). Un autre domaine n'a pas de tuile.
  types_par_domaine:
    light: lum
    switch: int
    input_boolean: int
    fan: int
    humidifier: int
    automation: int
    cover: vol
    valve: vol
    media_player: med
    scene: act
    script: act
    button: act
    input_button: act
    sensor: cap
    number: cap
    input_number: cap
    binary_sensor: bin
    device_tracker: bin
    person: bin
    lock: bin
    climate: cli
  # entité -> {nom, icone, comportement} de la section « Personnaliser des tuiles » ;
  # la première ligne d'une entité compte.
  perso: >-
    {%- set ns = namespace(d={}) -%}
    {%- set lignes = personnalisation if personnalisation is iterable and personnalisation is not string and personnalisation is not mapping else [] -%}
    {%- for p in lignes -%}
      {%- if p is mapping and p.get('entite') is string and p.get('entite') not in ns.d -%}
        {%- set ns.d = dict(ns.d, **{p.get('entite'): {'nom': (p.get('nom') or '') | string, 'icone': (p.get('icone') or '') | string, 'comportement': (p.get('comportement') or 'normal') | string}}) -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.d }}
  # Protocole de la tablette : 2 (tuiles) si sa version de projet est 3.2.0 ou plus,
  # sinon 1. sw_version = « 3.1.0 (ESPHome 2026.9.0) », « 3.2.0-dev (…) » ; « rendu »
  # ou illisible = 1. Plusieurs tablettes : la plus ancienne décide (jamais une action
  # qu'une tablette n'a pas).
  protocole: >-
    {%- set ns = namespace(p=0) -%}
    {%- for e in integration_entities('esphome') | select('match', 'binary_sensor[.].*_ha_api_status$') -%}
      {%- if device_attr(e, 'model') == 'tab5-ha-hmi' -%}
        {%- set m = (device_attr(e, 'sw_version') or '') | string | regex_findall('^ *([0-9]+)[.]([0-9]+)[.]([0-9]+)') -%}
        {%- set p = 2 if m and (m[0][0] | int(0)) * 1000000 + (m[0][1] | int(0)) * 1000 + (m[0][2] | int(0)) >= 3002000 else 1 -%}
        {%- set ns.p = p if ns.p == 0 else [ns.p, p] | min -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.p if ns.p else 1 }}
  # Tuiles : [{cle: 'tRT', r: R, e: entité, type, s: entrée 3.x d'origine ou ''}].
  # Les cinq premières entités de chaque pièce qui existent et dont le domaine a un
  # type, dans l'ordre choisi. Pièce 1 vide : les entrées 3.x, à leurs places
  # (t00 = PC, à défaut TV ; t01 = volet ; t02..t04 = lumières 1 à 3). Une même
  # entité peut être dans plusieurs tuiles.
  tuiles: >-
    {%- set ns = namespace(l=[], t=0) -%}
    {%- for n in range(5) -%}
      {%- set brut = pieces[n] -%}
      {%- set liste = [brut] if brut is string else (brut if brut else []) -%}
      {%- set ns.t = 0 -%}
      {%- for e in liste -%}
        {%- if ns.t < 5 and e is string and e.split('.')[0] in types_par_domaine and states[e] is not none -%}
          {%- set ns.l = ns.l + [{'cle': 't' ~ n ~ ns.t, 'r': n, 'e': e, 'type': types_par_domaine[e.split('.')[0]], 's': ''}] -%}
          {%- set ns.t = ns.t + 1 -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if n == 0 and ns.t == 0 -%}
        {%- set premiere = 'pc' if sources.pc and states[sources.pc] is not none else 'tv' -%}
        {%- for s in [premiere, 'volet', 'lumiere_1', 'lumiere_2', 'lumiere_3'] -%}
          {%- set e = sources.get(s, '') -%}
          {%- if e and e.split('.')[0] in types_par_domaine and states[e] is not none -%}
            {%- set ns.l = ns.l + [{'cle': 't0' ~ loop.index0, 'r': 0, 'e': e, 'type': types_par_domaine[e.split('.')[0]], 's': s}] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.l }}
  # Rangée sous l'horloge (ADR-0031) : [{cle: 'hLI', l: L, r: -1, e: entité, type, s: ''}],
  # les quatre premières entités de chaque ligne qui existent et dont le domaine a un
  # type, sauf les actions (scènes, scripts, boutons : rien à montrer). À part de
  # `tuiles` : la liste blanche des commandes de l'écran ne les connaît pas.
  rangee: >-
    {%- set ns = namespace(l=[], i=0) -%}
    {%- for n in range(3) -%}
      {%- set brut = rangee_lignes[n] -%}
      {%- set liste = [brut] if brut is string else (brut if brut else []) -%}
      {%- set ns.i = 0 -%}
      {%- for e in liste -%}
        {%- if ns.i < 4 and e is string and types_par_domaine.get(e.split('.')[0], 'act') != 'act' and states[e] is not none -%}
          {%- set ns.l = ns.l + [{'cle': 'h' ~ n ~ ns.i, 'l': n, 'r': -1, 'e': e, 'type': types_par_domaine[e.split('.')[0]], 's': ''}] -%}
          {%- set ns.i = ns.i + 1 -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ ns.l }}
  # Clims des tuiles (ADR-0027) : les tuiles cli qui ne sont pas la clim du blueprint
  # (option m, dont climr et tab5_maj_clim portent les réglages et l'état). Chacune a ses
  # réglages (clé crRT) et son état (clé ceRT) ; son appui ouvre le popup pour elle.
  tuiles_clim: "{{ tuiles | selectattr('type', 'eq', 'cli') | rejectattr('e', 'eq', sources.clim) | list }}"
  # Le volet que suit le package volet_serre_tracking.yaml : celui que nomme sa liste
  # « Tab5 · volet à course simulée », s'il existe. Sa tuile montre l'état tenu par le
  # package (input_text.volet_serre_etat), ses commandes passent par
  # script.tab5_volet_action. Liste sur « Aucun » (son défaut) ou package absent : '',
  # chaque volet est commandé directement. Avant le 06/10/2026, la seule présence du
  # script suffisait : un package copié sans choisir le volet rendait muet celui de
  # l'entrée Volet, le script s'arrêtant sur « Aucun » (discussion #278).
  volet_suivi: >-
    {%- set v = states('select.tab5_volet_a_course_simulee') -%}
    {{ v if states['script.tab5_volet_action'] is not none and v.startswith('cover.') and states[v] is not none else '' }}
  # L'entrée Volet (3.x) passe par le package seulement si c'est ce volet-là.
  volet_par_package: "{{ volet_suivi != '' and volet_suivi == sources.volet }}"
  # Tuile − / + au choix (ADR-0033) : type par domaine, le tableau de l'ADR (kTypes de
  # Tab5/tab5_reglables.cpp ; tests/test_reglables.py compare). Un autre domaine n'y
  # entre pas.
  types_reglables:
    media_player: son
    light: lum
    climate: cli
    water_heater: eau
    humidifier: hum
    fan: ven
    cover: vol
    valve: vol
    number: nbr
    input_number: nbr
  # [{cle: 'rN', e: entité, type}] : les huit premières entités choisies qui existent et
  # dont le domaine a un type, sans la clim du blueprint (la tablette la met déjà en
  # tête de sa liste), sans doublon ni appareil en lecture seule (personnalisation des
  # tuiles). C'est la liste blanche des commandes « regler » et « consigne » d'une clé rN.
  reglables: >-
    {%- set brut = reglables_choix -%}
    {%- set liste = [brut] if brut is string else (brut if brut else []) -%}
    {%- set ns = namespace(l=[], vus=[]) -%}
    {%- for e in liste -%}
      {%- if ns.l | count < 8 and e is string and e.split('.')[0] in types_reglables and states[e] is not none
            and e != sources.clim and e not in ns.vus
            and perso.get(e, {}).get('comportement', 'normal') != 'lecture_seule' -%}
        {%- set ns.l = ns.l + [{'cle': 'r' ~ (ns.l | count), 'e': e, 'type': types_reglables[e.split('.')[0]]}] -%}
        {%- set ns.vus = ns.vus + [e] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.l }}
  # Bornes de chacun : clé rN -> [min, max, pas, unité], lues sur l'appareil. Volume,
  # luminosité, vitesse, humidité et position en % ; une lampe sans variateur, un volet
  # ou une vanne sans position réglable ne connaissent que 0 et 100 (pas de 100 : − ferme
  # ou éteint, + ouvre ou allume). Consigne : bornes et pas de l'appareil, unité d'une
  # entité weather.* comme pour la clim (ADR-0026). Nombre : ses min, max, step et unité
  # (7 octets au plus). La même table borne la valeur reçue de la tablette.
  # Unités par « '' ~ » : dans HA ce sont des StrEnum, que « | string » laisse telles
  # quelles ; rangées dans la table, elles l'empêchent d'être relue (elle resterait du
  # texte : « 'str object' has no attribute 'get' »). tests/test_reglables.py.
  reglables_bornes: >-
    {%- set u = namespace(s='') -%}
    {%- for w in states.weather if not u.s -%}
      {%- set t = '' ~ w.attributes.get('temperature_unit', '') -%}
      {%- if t in ['°C', '°F'] -%}{%- set u.s = t -%}{%- endif -%}
    {%- endfor -%}
    {%- set ns = namespace(d={}) -%}
    {%- for r in reglables -%}
      {%- set a = states[r.e].attributes -%}
      {%- if r.type in ['cli', 'eau'] -%}
        {%- set mn = a.get('min_temp') | float(16.0 if r.type == 'cli' else 30.0) -%}
        {%- set mx = a.get('max_temp') | float(30.0 if r.type == 'cli' else 70.0) -%}
        {%- set unite = u.s if u.s else ('°F' if r.type == 'cli' and mn >= 40 else '°C') -%}
        {%- set pas = a.get('target_temp_step') | float(0) -%}
        {%- set b = [mn, mx, pas if pas > 0 else (1.0 if unite == '°F' else 0.5), unite] -%}
      {%- elif r.type == 'hum' -%}
        {%- set b = [a.get('min_humidity') | float(0), a.get('max_humidity') | float(100), 5, '%'] -%}
      {%- elif r.type == 'ven' -%}
        {%- set pas = a.get('percentage_step') | float(0) -%}
        {%- set b = [0, 100, (pas | round(2)) if pas >= 5 else 10, '%'] -%}
      {%- elif r.type == 'lum' -%}
        {%- set modes = a.get('supported_color_modes') or [] -%}
        {%- set b = [0, 100, 10 if modes | reject('in', ['onoff', 'unknown']) | list | count > 0 else 100, '%'] -%}
      {%- elif r.type == 'vol' -%}
        {%- set b = [0, 100, 10 if (a.get('supported_features') | int(0)) // 4 % 2 == 1 and r.e != volet_suivi else 100, '%'] -%}
      {%- elif r.type == 'nbr' -%}
        {%- set v = namespace(s='' ~ (a.get('unit_of_measurement') or '')) -%}
        {%- for i in range(8) -%}{%- if v.s.encode('utf-8') | length > 7 -%}{%- set v.s = v.s[:-1] -%}{%- endif -%}{%- endfor -%}
        {%- set pas = a.get('step') | float(1) -%}
        {%- set b = [a.get('min') | float(0), a.get('max') | float(100), pas if pas > 0 else 1, v.s] -%}
      {%- else -%}
        {%- set b = [0, 100, 5, '%'] -%}
      {%- endif -%}
      {%- set ns.d = dict(ns.d, **{r.cle: b}) -%}
    {%- endfor -%}
    {{ ns.d }}
  # Clés poussées par tab5_maj_emplacements (clim et volet ont leurs actions).
  cles_emplacements:
    - lumiere_1
    - lumiere_2
    - lumiere_3
    - pc
    - tv
    - telephone
    - salon
    - salon_hum
    - serre
    - pot_1
    - pot_2
    - pot_3
    - pot_4
    - pot_5
  # Clés des zones de l'écran (kCles de Tab5/tab5_zones.cpp). « discussion » n'est pas une
  # entrée : absente quand la liste « Tab5 · pipeline de discussion » vaut « Aucun »
  # (variable absentes, plus bas).
  cles_zones:
    - lumiere_1
    - lumiere_2
    - lumiere_3
    - pc
    - tv
    - telephone
    - salon
    - serre
    - pot_1
    - pot_2
    - pot_3
    - pot_4
    - pot_5
    - clim
    - volet
    - planning
    - discussion
  # Clim de n'importe quelle marque (ADR-0026) : les boutons de l'écran envoient les
  # noms de la Daikin de l'auteur (away pour Éco, quiet / auto, swing / stop, windnice) ;
  # les branches « Clim : … » envoient le premier de ces modes que l'appareil connaît, et
  # la clé climr dit à l'écran quels boutons montrer. Les mêmes listes que les fonctions
  # clim_*_actif() du firmware (tab5_cards.cpp ; tests/test_clim.py compare). « on » et
  # « off » entre guillemets : sans eux, YAML 1.1 lit des booléens.
  clim_modes_consigne: [cool, heat, heat_cool, auto]
  clim_eco: [eco, away]
  clim_silence: [quiet, silence, Silence, low]
  clim_ventilation_normale: [medium, mid, middle, high]
  clim_oscillation: [swing, "on", both, vertical, 3d, horizontal]
  clim_arret_oscillation: [stop, "off"]
  # Attributs qui changent les réglages d'une clim : climr (ou crRT, clim d'une tuile)
  # repart quand l'un d'eux change, pas à chaque degré de la pièce.
  clim_attributs_reglages: [min_temp, max_temp, target_temp_step, hvac_modes, preset_modes, fan_modes, swing_modes, friendly_name]
  # Mesures lentes : poussées ensemble toutes les 5 minutes (déclencheur « mesures »),
  # celles qui ont changé seulement ; un pot part avec ses 4 détails si l'un des 5 a
  # changé. Poussées à chaque changement, elles faisaient ~1 300 exécutions par jour
  # chez l'auteur, dont 775 pour une température de serre qui oscille d'un dixième
  # toutes les 40 s (28/09/2026). L'écran affiche ce dixième : filtrer sur la valeur
  # affichée n'aurait rien retiré.
  cles_mesures:
    - telephone
    - salon
    - salon_hum
    - serre
    - pot_1
    - pot_2
    - pot_3
    - pot_4
    - pot_5
  # Période du déclencheur « mesures » (300 s), plus une marge : une mesure changée
  # juste au moment d'un passage repart au suivant, jamais perdue.
  fenetre_mesures: 310
  # Tuiles dont la valeur part avec les mesures lentes : les capteurs (état = la mesure)
  # et la température de la pièce d'une clim (current_temperature). Une clim part
  # aussi à chaque changement de mode et de consigne (déclencheur piece_n_consigne) ; un
  # capteur, jamais. Avec la tuile d'une clim part son état ceRT (ADR-0027) : sa
  # ventilation, son oscillation ou son préréglage changés depuis HA arrivent au plus
  # tard avec les mesures (5 minutes), sa consigne et son mode tout de suite.
  types_mesures:
    - cap
    - cli
  types_immediats:
    - lum
    - int
    - vol
    - med
    - act
    - bin
    - cli
  # Emplacements à pousser pour ce déclenchement.
  cles: >-
    {%- if trigger.id in ['connexion', 'rechargement', 'maj_ecran', 'demarrage_ha'] -%}
      {%- set ns = namespace(l=[]) -%}
      {%- for c in cles_emplacements -%}
        {%- set ns.l = ns.l + [c] + ([c ~ '_ec', c ~ '_lux', c ~ '_temp', c ~ '_bat'] if c.startswith('pot_') else []) -%}
      {%- endfor -%}
      {{ ns.l }}
    {%- elif trigger.id == 'mesures' -%}
      {%- set ns = namespace(l=[], vu=false) -%}
      {%- for c in cles_mesures -%}
        {%- set groupe = [c] + ([c ~ '_ec', c ~ '_lux', c ~ '_temp', c ~ '_bat'] if c.startswith('pot_') else []) -%}
        {%- set ns.vu = false -%}
        {%- for k in groupe -%}
          {%- set x = sources.get(k, '') -%}
          {%- if x and states[x] is not none and (now() - states[x].last_changed).total_seconds() < fenetre_mesures -%}
            {%- set ns.vu = true -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if ns.vu -%}{%- set ns.l = ns.l + groupe -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.l }}
    {%- elif trigger.id in cles_emplacements -%}
      {#- Lumières, PC, TV : seulement si ce que montre l'écran change (état, luminosité),
          pas pour un autre attribut (couleur, titre en cours de lecture…). -#}
      {%- set avant = trigger.from_state -%}
      {%- set apres = trigger.to_state -%}
      {%- if avant is none or apres is none or avant.state != apres.state
            or avant.attributes.get('brightness') != apres.attributes.get('brightness') -%}
        {{ [trigger.id] }}
      {%- else -%}
        {{ [] }}
      {%- endif -%}
    {%- else -%}
      {{ [] }}
    {%- endif -%}
  # Une entité d'une tuile apparaît ou disparaît : les définitions changent, elles
  # repartent (avec tous les états), sans attendre une reconnexion.
  redefinir: >-
    {{ protocole == 2
       and (trigger.id.startswith('piece_') or trigger.id.startswith('rangee_') or trigger.id.startswith('reglable')
            or trigger.id in ['pc', 'tv', 'volet', 'lumiere_1', 'lumiere_2', 'lumiere_3'])
       and trigger.from_state is defined and (trigger.from_state is none or trigger.to_state is none) }}
  # Tuiles à pousser (clés tRT), et éléments de la rangée sous l'horloge (clés hLI,
  # ADR-0031). Toutes après les définitions ; une tuile quand son entité change ce que
  # l'écran montre (état, luminosité, couleur, position, consigne d'une clim : les − / +
  # du popup comptent à partir d'elle) ; un élément de la rangée quand son état change ;
  # les types_mesures avec les mesures lentes. Calculées quel que soit le protocole (la
  # trace montre ce qui partirait), poussées seulement au protocole 2.
  tuiles_a_pousser: >-
    {%- if trigger.id in ['connexion', 'rechargement', 'maj_ecran', 'demarrage_ha', 'zones'] or redefinir -%}
      {{ (tuiles + rangee) | map(attribute='cle') | list }}
    {%- elif trigger.id == 'mesures' -%}
      {%- set ns = namespace(l=[]) -%}
      {%- for t in tuiles + rangee if t.type in types_mesures and states[t.e] is not none -%}
        {%- set depuis = states[t.e].last_changed if t.type == 'cap' else states[t.e].last_updated -%}
        {%- if (now() - depuis).total_seconds() < fenetre_mesures -%}{%- set ns.l = ns.l + [t.cle] -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.l }}
    {%- elif trigger.id == 'volet_suivi' -%}
      {{ ((tuiles + rangee) | selectattr('e', 'eq', volet_suivi) | map(attribute='cle') | list) if volet_suivi else [] }}
    {%- elif trigger.id == 'volet_choisi' -%}
      {#- Volet changé dans la liste du package : les tuiles de l'ancien (son état réel
          revient) et du nouveau (l'état tenu par le package). -#}
      {%- set vises = [trigger.from_state.state if trigger.from_state else '',
                       trigger.to_state.state if trigger.to_state else ''] | select('match', '^cover[.]') | list -%}
      {{ (tuiles + rangee) | selectattr('e', 'in', vises) | map(attribute='cle') | list }}
    {%- elif trigger.from_state is defined and trigger.id.startswith('rangee_') -%}
      {#- Rangée : l'état seulement (déclencheurs rangee_n et rangee_n_sortie). -#}
      {{ rangee | selectattr('l', 'eq', trigger.id[7] | int - 1) | selectattr('e', 'eq', trigger.entity_id)
         | selectattr('type', 'in', types_immediats) | map(attribute='cle') | list }}
    {%- elif trigger.from_state is defined and (trigger.id.startswith('piece_') or trigger.id in ['pc', 'tv', 'volet', 'lumiere_1', 'lumiere_2', 'lumiere_3']) -%}
      {%- set avant = trigger.from_state -%}
      {%- set apres = trigger.to_state -%}
      {%- set ns = namespace(vu=avant is none or apres is none or avant.state != apres.state) -%}
      {%- for a in ['brightness', 'rgb_color', 'current_position', 'temperature'] -%}
        {%- if not ns.vu and avant.attributes.get(a) != apres.attributes.get(a) -%}{%- set ns.vu = true -%}{%- endif -%}
      {%- endfor -%}
      {%- if not ns.vu -%}
        {{ [] }}
      {%- elif trigger.id.startswith('piece_') -%}
        {{ tuiles | selectattr('r', 'eq', trigger.id[6] | int - 1) | selectattr('e', 'eq', trigger.entity_id)
           | selectattr('type', 'in', types_immediats) | map(attribute='cle') | list }}
      {%- else -%}
        {{ tuiles | selectattr('s', 'eq', trigger.id) | selectattr('type', 'in', types_immediats) | map(attribute='cle') | list }}
      {%- endif -%}
    {%- else -%}
      {{ [] }}
    {%- endif -%}
  # Appareils de la tuile − / + (clés rN, ADR-0033) : tous après les définitions ; un
  # quand son entité change ce que la tuile montre (déclencheurs reglable_… : l'état, ou
  # l'attribut de sa valeur). Poussés seulement au protocole 2 (un firmware qui ne les
  # connaît pas ignore la clé).
  reglables_a_pousser: >-
    {%- if trigger.id in ['connexion', 'rechargement', 'maj_ecran', 'demarrage_ha', 'zones'] or redefinir -%}
      {{ reglables | map(attribute='cle') | list }}
    {%- elif trigger.from_state is defined and trigger.id.startswith('reglable') -%}
      {{ reglables | selectattr('e', 'eq', trigger.entity_id) | map(attribute='cle') | list }}
    {%- else -%}
      {{ [] }}
    {%- endif -%}
  # Météo choisie ici (section « Météo », discussion #278). Vide ([] ou « liste ») = rien.
  meteo_choisie:
    previsions: !input meteo_previsions
    pluie: !input meteo_pluie
    vigilance: !input meteo_vigilance
  # Déclencheurs de la météo (plus bas) : enregistrement, démarrage de HA, liste changée.
  meteo_declencheurs: [meteo_rechargement, meteo_demarrage, meteo_liste]
  # Ce que ces déclencheurs doivent écrire dans les listes du package
  # tab5_meteo_sources : [{entite, valeur}], seulement les champs remplis dont la liste
  # existe et dit autre chose. Une seule source fait foi à un instant donné : la liste, que
  # lisent sensor.tab5_sources_meteo, sensor.tab5_meteo et les capteurs de pluie et de
  # vigilance ; le blueprint, rempli, la tient à jour.
  #   - rechargement des automatisations (enregistrement du blueprint) et démarrage de HA :
  #     toujours ;
  #   - changement d'une liste : seulement s'il vient d'une personne (context.user_id de
  #     l'état, renseigné pour l'interface, l'API et le select « Tab5 · source des
  #     prévisions », qui écrit l'input_text dans le contexte de son appel). L'écriture
  #     d'une automatisation (celle-ci, ou celle d'une autre tablette réglée autrement) n'en
  #     a pas : jamais de ping-pong entre deux automatisations.
  # Météo choisie qui n'existe pas (encore) : rien d'écrit, la liste et son repli restent.
  # Option absente de la liste (package plus ancien) : rien non plus.
  meteo_a_ecrire: >-
    {%- set ns = namespace(l=[]) -%}
    {%- set par_une_personne = trigger.id != 'meteo_liste'
          or (trigger.to_state is not none and trigger.to_state.context.user_id is not none) -%}
    {%- if trigger.id in meteo_declencheurs and par_une_personne -%}
      {%- set m = meteo_choisie.previsions -%}
      {%- set m = m if m is string else (m | first if m else '') -%}
      {%- set liste = 'input_text.tab5_meteo_previsions' -%}
      {%- if m and states[m] is not none and states[liste] is not none and states(liste) != m -%}
        {%- set ns.l = ns.l + [{'entite': liste, 'valeur': m}] -%}
      {%- endif -%}
      {%- for cle, liste in [('pluie', 'input_select.tab5_source_pluie'), ('vigilance', 'input_select.tab5_source_vigilance')] -%}
        {%- set v = meteo_choisie[cle] if meteo_choisie[cle] is string else '' -%}
        {%- if v not in ['', 'liste'] and states[liste] is not none
              and v in (state_attr(liste, 'options') or []) and states(liste) != v -%}
          {%- set ns.l = ns.l + [{'entite': liste, 'valeur': v}] -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {{ ns.l }}
  # Énergie (ADR-0028) : capteurs de la section « Énergie », texte vide si rien n'est
  # choisi. Une tuile cap de l'un d'eux (energie_capteurs) prend l'option e ; tous partent
  # vers script.tab5_energie quand la tablette ouvre son popup (branche « popup Énergie »).
  energie_choix:
    solaire: !input energie_solaire
    production: !input energie_production
    reseau: !input energie_reseau
    reseau_export: !input energie_reseau_export
    maison: !input energie_maison
    batterie: !input energie_batterie
    batterie_puissance: !input energie_batterie_puissance
    batterie_temperature: !input energie_batterie_temperature
  energie: >-
    {%- set ns = namespace(d={}) -%}
    {%- for cle, v in energie_choix.items() -%}
      {%- set ns.d = dict(ns.d, **{cle: (v if v is string else (v | first if v else ''))}) -%}
    {%- endfor -%}
    {{ ns.d }}
  # Plusieurs sources solaires (discussion #278) : toutes les puissances et tous les
  # compteurs, le champ principal d'abord puis les « autres ». Chaque champ peut être une
  # chaîne (automatisation d'avant), une liste ou vide. energie garde, lui, la première
  # entité de chaque champ : un package tab5_energie plus ancien lit encore solaire et
  # production (la première source seulement), le nouveau lit solaires et productions.
  energie_solaire_autres: !input energie_solaire_autres
  energie_production_autres: !input energie_production_autres
  energie_solaires: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for v in [energie_choix.solaire, energie_solaire_autres] -%}
      {%- set ns.l = ns.l + ([v] if v is string else ((v | list) if v else [])) -%}
    {%- endfor -%}
    {{ ns.l | select('string') | reject('eq', '') | unique | list }}
  energie_productions: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for v in [energie_choix.production, energie_production_autres] -%}
      {%- set ns.l = ns.l + ([v] if v is string else ((v | list) if v else [])) -%}
    {%- endfor -%}
    {{ ns.l | select('string') | reject('eq', '') | unique | list }}
  energie_capteurs: "{{ ((energie.values() | select | list) + energie_solaires + energie_productions) | unique | list }}"
  energie_reseau_inverse: !input energie_reseau_inverse
  energie_batterie_inverse: !input energie_batterie_inverse
  # Icône solaire du bandeau d'état (clé solaire de tab5_maj_emplacements) : puissance
  # des panneaux en % de leur crête (energie_crete, kWc), arrondie et bornée 0-100 (un
  # onduleur qui lit -3 W la nuit donne 0). Plusieurs sources : la somme de celles qui
  # ont une valeur (un onduleur « unavailable » la nuit est ignoré). « nan » sans
  # capteur, sans crête ou sans aucune valeur : l'icône disparaît. Unité lue sur chaque
  # capteur (W, kW ou MW ; W sinon).
  energie_crete: !input energie_crete
  # Popup Température (ADR-0032) : la seconde température est-elle dehors ?
  serre_exterieure: !input serre_exterieure
  solaire_pourcent: >-
    {%- set crete = energie_crete | float(0) -%}
    {%- set ns = namespace(w=0, n=0) -%}
    {%- for x in energie_solaires if states(x) | is_number -%}
      {%- set u = state_attr(x, 'unit_of_measurement') | default('W', true) | string -%}
      {%- set ns.w = ns.w + states(x) | float * {'kW': 1000, 'MW': 1000000}.get(u, 1) -%}
      {%- set ns.n = ns.n + 1 -%}
    {%- endfor -%}
    {%- if crete > 0 and ns.n > 0 -%}
      {{ [[(ns.w / (crete * 1000) * 100) | round(0) | int, 0] | max, 100] | min }}
    {%- else -%}
      nan
    {%- endif -%}
  # Quand la pousser : avec tous les états (connexion, rechargement, MAJ Écran, démarrage
  # de HA), « nan » compris quand rien n'est choisi ; puis avec les mesures lentes, toutes
  # les 5 minutes, seulement si le capteur a changé depuis le passage d'avant. Pas à
  # chaque changement : un onduleur publie toutes les 5 à 30 s, et l'écran ne montre
  # qu'un palier de couleur. Au plus 12 poussées par heure de soleil, aucune la nuit
  # (capteur figé à 0), et elles partent dans le passage des mesures qui a lieu de toute
  # façon. Filtrer sur le palier demanderait de retenir le dernier envoyé (une entrée de
  # plus dans un package) : 5 minutes de retard au plus sur une couleur ont suffi.
  solaire_a_pousser: >-
    {%- set ns = namespace(change=false) -%}
    {%- for x in energie_solaires if states[x] is not none
          and (now() - states[x].last_changed).total_seconds() < fenetre_mesures -%}
      {%- set ns.change = true -%}
    {%- endfor -%}
    {{ trigger.id in ['connexion', 'rechargement', 'maj_ecran', 'demarrage_ha']
       or (trigger.id == 'mesures' and energie_crete | float(0) > 0 and ns.change) }}
  # Appuis longs des boutons du haut (section « Boutons du haut ») : « appuis|maison|
  # engrenage|manette; », poussé avec tous les états (connexion, rechargement — dont
  # l'enregistrement de l'automatisation —, MAJ Écran, démarrage de HA). Un code hors de
  # la liste (automatisation écrite à la main) part en « auto ».
  appuis_choix:
    - !input appui_maison
    - !input appui_engrenage
    - !input appui_manette
  appuis: >-
    {%- set codes = ['auto', 'rien', 'assistant', 'calendrier', 'reveil', 'clim', 'plantes', 'tv',
                     'console', 'energie', 'reglages', 'alertes', 'arcade', 'maison'] -%}
    {%- set ns = namespace(l=[]) -%}
    {%- for c in appuis_choix -%}
      {%- set ns.l = ns.l + [c if c is string and c in codes else 'auto'] -%}
    {%- endfor -%}
    appuis|{{ ns.l | join('|') }};

triggers:
  - trigger: event
    event_type: esphome.tab5_connected
    id: connexion
  - trigger: event
    event_type: esphome.tab5_zones
    id: zones
  - trigger: event
    event_type: esphome.tab5_action
    id: action
  # Popup Énergie (ADR-0028) : ouvert, ou sa vue changée (donnée vue).
  - trigger: event
    event_type: esphome.tab5_energie
    id: energie
  # Popup Température (ADR-0032) : ouvert, ou sa vue changée (données cle, vue).
  - trigger: event
    event_type: esphome.tab5_historique
    id: historique
  - trigger: state
    entity_id: !input lumiere_1
    id: lumiere_1
  - trigger: state
    entity_id: !input lumiere_2
    id: lumiere_2
  - trigger: state
    entity_id: !input lumiere_3
    id: lumiere_3
  - trigger: state
    entity_id: !input pc
    id: pc
  - trigger: state
    entity_id: !input tv
    id: tv
  - trigger: state
    entity_id: !input clim
    id: clim
  - trigger: state
    entity_id: !input volet
    id: volet
  # Pièces (ADR-0023), six déclencheurs par pièce, pour ne jamais réveiller
  # l'automatisation sur un capteur qui change (une mesure part avec les mesures
  # lentes) ni sur un attribut que l'écran ne montre pas (position GPS d'une personne,
  # volume d'un lecteur, température de la pièce d'une clim) :
  #   piece_n          l'état passe à un état qui n'est pas une mesure (etats_visibles) ;
  #   piece_n_sortie   il en sort vers un autre (zone d'une personne, retour d'une mesure) ;
  #   piece_n_luminosite / _couleur / _position / _consigne  l'attribut change pendant que
  #                    l'appareil reste allumé ou en place (not_from / not_to [null] :
  #                    l'allumage et l'extinction sont déjà vus par piece_n, sans passage
  #                    en double). _consigne : l'attribut temperature, que seules les clims
  #                    portent parmi les domaines des tuiles (ADR-0027 : les − / + du popup
  #                    d'une clim de tuile partent de sa consigne, elle ne peut attendre
  #                    5 minutes).
  # « on » et « off » entre guillemets : sans eux, YAML 1.1 lit des booléens, que le
  # schéma du déclencheur refuse.
  - trigger: state
    entity_id: !input piece_1_tuiles
    to: &etats_visibles ["on", "off", open, closed, opening, closing, playing, paused, idle, standby, buffering, home, not_home, locked, unlocked, locking, unlocking, jammed, heat, cool, heat_cool, auto, dry, fan_only, unavailable, unknown]
    id: piece_1
  - trigger: state
    entity_id: !input piece_1_tuiles
    from: *etats_visibles
    not_to: *etats_visibles
    id: piece_1_sortie
  - trigger: state
    entity_id: !input piece_1_tuiles
    attribute: brightness
    not_from: [null]
    not_to: [null]
    id: piece_1_luminosite
  - trigger: state
    entity_id: !input piece_1_tuiles
    attribute: rgb_color
    not_from: [null]
    not_to: [null]
    id: piece_1_couleur
  - trigger: state
    entity_id: !input piece_1_tuiles
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: piece_1_position
  - trigger: state
    entity_id: !input piece_1_tuiles
    attribute: temperature
    not_from: [null]
    not_to: [null]
    id: piece_1_consigne
  - trigger: state
    entity_id: !input piece_2_tuiles
    to: *etats_visibles
    id: piece_2
  - trigger: state
    entity_id: !input piece_2_tuiles
    from: *etats_visibles
    not_to: *etats_visibles
    id: piece_2_sortie
  - trigger: state
    entity_id: !input piece_2_tuiles
    attribute: brightness
    not_from: [null]
    not_to: [null]
    id: piece_2_luminosite
  - trigger: state
    entity_id: !input piece_2_tuiles
    attribute: rgb_color
    not_from: [null]
    not_to: [null]
    id: piece_2_couleur
  - trigger: state
    entity_id: !input piece_2_tuiles
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: piece_2_position
  - trigger: state
    entity_id: !input piece_2_tuiles
    attribute: temperature
    not_from: [null]
    not_to: [null]
    id: piece_2_consigne
  - trigger: state
    entity_id: !input piece_3_tuiles
    to: *etats_visibles
    id: piece_3
  - trigger: state
    entity_id: !input piece_3_tuiles
    from: *etats_visibles
    not_to: *etats_visibles
    id: piece_3_sortie
  - trigger: state
    entity_id: !input piece_3_tuiles
    attribute: brightness
    not_from: [null]
    not_to: [null]
    id: piece_3_luminosite
  - trigger: state
    entity_id: !input piece_3_tuiles
    attribute: rgb_color
    not_from: [null]
    not_to: [null]
    id: piece_3_couleur
  - trigger: state
    entity_id: !input piece_3_tuiles
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: piece_3_position
  - trigger: state
    entity_id: !input piece_3_tuiles
    attribute: temperature
    not_from: [null]
    not_to: [null]
    id: piece_3_consigne
  - trigger: state
    entity_id: !input piece_4_tuiles
    to: *etats_visibles
    id: piece_4
  - trigger: state
    entity_id: !input piece_4_tuiles
    from: *etats_visibles
    not_to: *etats_visibles
    id: piece_4_sortie
  - trigger: state
    entity_id: !input piece_4_tuiles
    attribute: brightness
    not_from: [null]
    not_to: [null]
    id: piece_4_luminosite
  - trigger: state
    entity_id: !input piece_4_tuiles
    attribute: rgb_color
    not_from: [null]
    not_to: [null]
    id: piece_4_couleur
  - trigger: state
    entity_id: !input piece_4_tuiles
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: piece_4_position
  - trigger: state
    entity_id: !input piece_4_tuiles
    attribute: temperature
    not_from: [null]
    not_to: [null]
    id: piece_4_consigne
  - trigger: state
    entity_id: !input piece_5_tuiles
    to: *etats_visibles
    id: piece_5
  - trigger: state
    entity_id: !input piece_5_tuiles
    from: *etats_visibles
    not_to: *etats_visibles
    id: piece_5_sortie
  - trigger: state
    entity_id: !input piece_5_tuiles
    attribute: brightness
    not_from: [null]
    not_to: [null]
    id: piece_5_luminosite
  - trigger: state
    entity_id: !input piece_5_tuiles
    attribute: rgb_color
    not_from: [null]
    not_to: [null]
    id: piece_5_couleur
  - trigger: state
    entity_id: !input piece_5_tuiles
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: piece_5_position
  - trigger: state
    entity_id: !input piece_5_tuiles
    attribute: temperature
    not_from: [null]
    not_to: [null]
    id: piece_5_consigne
  # Rangée sous l'horloge (ADR-0031) : l'état seulement, comme piece_n et piece_n_sortie
  # (une mesure part avec les mesures lentes) ; elle ne montre ni luminosité ni position.
  - trigger: state
    entity_id: !input rangee_ligne_1
    to: *etats_visibles
    id: rangee_1
  - trigger: state
    entity_id: !input rangee_ligne_1
    from: *etats_visibles
    not_to: *etats_visibles
    id: rangee_1_sortie
  - trigger: state
    entity_id: !input rangee_ligne_2
    to: *etats_visibles
    id: rangee_2
  - trigger: state
    entity_id: !input rangee_ligne_2
    from: *etats_visibles
    not_to: *etats_visibles
    id: rangee_2_sortie
  - trigger: state
    entity_id: !input rangee_ligne_3
    to: *etats_visibles
    id: rangee_3
  - trigger: state
    entity_id: !input rangee_ligne_3
    from: *etats_visibles
    not_to: *etats_visibles
    id: rangee_3_sortie
  # Tuile − / + au choix (ADR-0033) : l'état (`to: ~`, sans les attributs), puis
  # l'attribut qui porte la valeur réglée tant que l'appareil reste allumé ou en place
  # (not_from / not_to [null] : l'allumage et l'extinction sont vus par « reglable »).
  # Un nombre porte sa valeur dans son état. Jamais sur tous les attributs : un lecteur
  # en change à chaque morceau (titre, position de lecture).
  - trigger: state
    entity_id: !input reglables
    to: ~
    id: reglable
  - trigger: state
    entity_id: !input reglables
    attribute: volume_level
    not_from: [null]
    not_to: [null]
    id: reglable_volume
  - trigger: state
    entity_id: !input reglables
    attribute: brightness
    not_from: [null]
    not_to: [null]
    id: reglable_luminosite
  - trigger: state
    entity_id: !input reglables
    attribute: temperature
    not_from: [null]
    not_to: [null]
    id: reglable_consigne
  - trigger: state
    entity_id: !input reglables
    attribute: humidity
    not_from: [null]
    not_to: [null]
    id: reglable_humidite
  - trigger: state
    entity_id: !input reglables
    attribute: percentage
    not_from: [null]
    not_to: [null]
    id: reglable_vitesse
  - trigger: state
    entity_id: !input reglables
    attribute: current_position
    not_from: [null]
    not_to: [null]
    id: reglable_position
  # Volet suivi par le package volet_serre_tracking.yaml : son état est dans le
  # package (le moteur ne donne pas de position). Sans le package, ne se déclenche jamais.
  - trigger: state
    entity_id: input_text.volet_serre_etat
    id: volet_suivi
  # Volet choisi (ou remis à « Aucun ») dans la liste « Tab5 · volet à course simulée » :
  # volet_suivi change, les tuiles concernées et le volet de l'entrée Volet repartent
  # avec la bonne source d'état. Sans le package, ne se déclenche jamais.
  - trigger: state
    entity_id: select.tab5_volet_a_course_simulee
    to: ~
    id: volet_choisi
  # Pipeline de discussion choisi, ou remis à « Aucun » (liste du package) : la réponse
  # des zones repart, sans attendre que la tablette la redemande (boutons Domo / Discu).
  # Sans la liste (package plus ancien), ne se déclenche jamais.
  - trigger: state
    entity_id: select.tab5_pipeline_de_discussion
    id: pipeline_discussion
  # Téléphone, températures, humidité de la pièce, pots et tuiles « mesures » : voir
  # cles_mesures et types_mesures.
  - trigger: time_pattern
    minutes: "/5"
    id: mesures
  # Automatisation créée ou modifiée (un emplacement changé, par exemple) alors que
  # la tablette est déjà connectée : tout repousser, zones comprises, sans attendre
  # sa reconnexion. Dans l'ordre « Sans compiler » du guide, elle est créée après
  # l'ajout de la tablette : l'écran restait vide jusqu'à la reconnexion suivante
  # (test « HA neuf », 28/09/2026). L'événement suit tout rechargement des
  # automatisations : une poussée de plus, sans effet visible.
  - trigger: event
    event_type: automation_reloaded
    id: rechargement
  # Bouton « MAJ Écran » de la console système (événement de la tablette, ADR-0025) :
  # il relançait la poussée complète de tab5_push.yaml, pas les emplacements ni les
  # tuiles ; même traitement qu'un rechargement, zones comprises.
  - trigger: event
    event_type: esphome.tab5_maj_ecran
    id: maj_ecran
  # Démarrage de HA : la tablette, restée allumée, se reconnecte souvent AVANT que les
  # automatisations soient actives ; son tab5_connected est alors perdu (HA 2026.9.4
  # le 28/09/2026 : entités de la tablette revenues à 21:11:12, tab5_connected vers
  # 21:11:14, automatisations actives à 21:11:16, aucune exécution jusqu'au
  # rechargement de 21:13). Un appareil changé pendant la coupure restait faux à
  # l'écran jusqu'à son prochain changement. Ce déclencheur part au moment où les
  # automatisations deviennent actives et rejoue la connexion perdue : définitions,
  # tous les états, clim, volet. Pas les zones : la tablette ne les demande qu'avec la
  # première poussée des prévisions (tab5-api-logic.yaml), qui vient d'une
  # automatisation active. Tablette pas encore reconnectée : la condition « tablette
  # connectée » arrête ici, et son tab5_connected, émis plus tard, sera entendu. Pas de
  # délai : les variables (tuiles, protocole) sont calculées au déclenchement ; une
  # entité d'une intégration encore en chargement revient seule (redefinir, ou le
  # déclencheur de son emplacement).
  - trigger: homeassistant
    event: start
    id: demarrage_ha
  # Météo choisie dans le blueprint (section « Météo », variable meteo_a_ecrire) : écrite
  # dans les listes du package à l'enregistrement de l'automatisation, au démarrage de HA,
  # et remise quand quelqu'un change une liste. Des déclencheurs À PART (mêmes événements
  # que rechargement et demarrage_ha, un passage de plus) : ceux-là s'arrêtent sans
  # tablette connectée, les listes doivent suivre quand même. Champs vides, ou listes déjà
  # à jour : arrêt aux conditions, sans ligne au journal. `to: ~` : l'état seulement (la
  # liste des options d'un input_select peut changer au rechargement).
  - trigger: event
    event_type: automation_reloaded
    id: meteo_rechargement
  - trigger: homeassistant
    event: start
    id: meteo_demarrage
  - trigger: state
    entity_id:
      - input_text.tab5_meteo_previsions
      - input_select.tab5_source_pluie
      - input_select.tab5_source_vigilance
    to: ~
    id: meteo_liste

conditions:
  # Garde d'origine (audit sécurité du 30/09/2026) : un événement esphome.tab5_* ne
  # compte que s'il vient d'une tablette, reconnue au modèle de son appareil comme dans
  # packages/tab5_evenements.yaml. Sans elle, n'importe quel autre appareil ESPHome de
  # la maison pouvait émettre esphome.tab5_action et piloter toutes les tuiles. Un
  # événement sans device_id (tiré à la main) ou dont le device_id est une entité est
  # ignoré ; `| string` parce que device_attr() refuse autre chose qu'un texte. Les
  # autres déclencheurs (état, heure, démarrage, rechargement) passent.
  # tests/test_garde_origine.py vérifie cette garde sur chaque automatisation.
  - condition: template
    value_template: >-
      {%- if trigger.id in ['connexion', 'zones', 'action', 'maj_ecran', 'energie', 'historique'] -%}
        {%- set d = trigger.event.data.device_id | default('', true) | string -%}
        {{ '.' not in d and device_attr(d, 'model') == 'tab5-ha-hmi' }}
      {%- else -%}
        {{ true }}
      {%- endif -%}
  # Garde-fou des packages (ADR-0008) : absent, il laisse passer.
  - condition: template
    value_template: "{{ states('input_boolean.is_primary_active') != 'off' }}"
  # Rien de neuf pour l'écran (aucune mesure changée, attribut invisible, tuile d'un
  # firmware qui n'en a pas) : arrêt ici, sans ligne au journal. Météo (meteo_declencheurs) :
  # seulement s'il y a une liste à écrire.
  - condition: template
    value_template: >-
      {%- if trigger.id in meteo_declencheurs -%}
        {{ meteo_a_ecrire | count > 0 }}
      {%- else -%}
        {{ trigger.id in ['connexion', 'zones', 'action', 'clim', 'volet', 'volet_choisi', 'pipeline_discussion', 'energie', 'historique'] or cles | count > 0
           or solaire_a_pousser
           or (protocole == 2 and (redefinir or tuiles_a_pousser | count > 0 or reglables_a_pousser | count > 0)) }}
      {%- endif -%}
  # Déclencheurs venus de HA (rechargement, démarrage, mesures, changements d'état) : seulement
  # si une tablette est connectée, sinon « Action … not found » (pas encore ajoutée)
  # ou « Not connected » (hors ligne). Elle est trouvée par le modèle de l'appareil
  # (bloc `project:` du firmware), pas par son nom. Les événements de la tablette
  # prouvent d'eux-mêmes qu'elle est là. La météo (meteo_declencheurs) n'écrit que dans HA.
  - condition: template
    value_template: >-
      {{ trigger.id in ['connexion', 'zones', 'action', 'maj_ecran', 'energie', 'historique'] + meteo_declencheurs
         or integration_entities('esphome') | select('match', 'binary_sensor[.].*_ha_api_status$')
            | select('is_state', 'on') | map('device_attr', 'model') | select('eq', 'tab5-ha-hmi')
            | list | count > 0 }}

actions:
  - variables:
      # « clé|état|valeur; » : état tel quel, valeur = luminosité (lampes) ou nombre de
      # l'état (capteurs), nan sinon. Une entité absente n'est pas poussée (zone absente).
      payload: >-
        {%- set ns = namespace(r='') -%}
        {%- for c in cles -%}
          {%- set x = sources.get(c, '') -%}
          {%- if x and states[x] is not none -%}
            {%- if c.startswith('lumiere_') -%}
              {%- set v = state_attr(x, 'brightness') | float('nan') -%}
            {%- elif c in ['pc', 'tv'] -%}
              {%- set v = 'nan' -%}
            {%- else -%}
              {%- set v = states(x) | float('nan') -%}
            {%- endif -%}
            {%- set ns.r = ns.r ~ c ~ '|' ~ (states(x) | replace('|', '/') | replace(';', ',')) ~ '|' ~ v ~ ';' -%}
          {%- endif -%}
        {%- endfor -%}
        {#- Appuis longs des boutons du haut (variable appuis), avec tous les états. Un
            firmware sans ce choix ignore la clé (clé inconnue). -#}
        {%- if trigger.id in ['connexion', 'rechargement', 'maj_ecran', 'demarrage_ha'] -%}
          {%- set ns.r = ns.r ~ appuis -%}
        {%- endif -%}
        {#- Icône solaire du bandeau : « solaire|pourcentage; » (voir solaire_a_pousser). Un
            firmware sans cette icône ignore la clé (clé inconnue). -#}
        {%- if solaire_a_pousser -%}
          {%- set ns.r = ns.r ~ 'solaire|' ~ solaire_pourcent ~ ';' -%}
        {%- endif -%}
        {{ ns.r }}
      absentes: >-
        {%- set ns = namespace(l=[]) -%}
        {%- for c in cles_zones -%}
          {%- if c == 'discussion' -%}
            {#- Pas une entrée : la liste « Tab5 · pipeline de discussion ». « Aucun » masque
                les boutons Domo / Discu ; sans la liste (package plus ancien), ils restent. -#}
            {%- if states('select.tab5_pipeline_de_discussion') == 'Aucun' -%}{%- set ns.l = ns.l + [c] -%}{%- endif -%}
          {%- else -%}
            {%- set x = sources.get(c, '') -%}
            {%- if not x or states[x] is none -%}{%- set ns.l = ns.l + [c] -%}{%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | join(',') }}
      clim: "{{ sources.clim if sources.clim and states[sources.clim] is not none else '' }}"
      volet: "{{ sources.volet if sources.volet and states[sources.volet] is not none else '' }}"
      # Réglages des clims (ADR-0026) : entité → « min|max|pas|unité|capacités|nom », pour
      # la clim du blueprint (clé climr) et pour chaque clim de tuile (clé crRT, ADR-0027) :
      # une seule traduction pour toutes. Un firmware plus ancien ignore ces clés (clé
      # inconnue) ; sans climr, le nouveau garde 16-30, 0,5, °C et tous les boutons.
      # Unité : celle d'une entité weather.*, qui suit le système d'unités de HA comme les
      # attributs de la clim (min_temp, temperature…) ; sans météo, une borne basse de 40
      # ou plus ne peut être qu'en °F. Pas : target_temp_step, sinon 1 en °F, 0,5 en °C.
      # Capacités : une lettre par bouton de l'écran que l'appareil sait faire (ADR-0026).
      reglages_clims: >-
        {%- set ns = namespace(d={}) -%}
        {%- set u = namespace(s='') -%}
        {%- for w in states.weather if not u.s -%}
          {%- set t = w.attributes.get('temperature_unit', '') | string -%}
          {%- if t in ['°C', '°F'] -%}{%- set u.s = t -%}{%- endif -%}
        {%- endfor -%}
        {%- for e in ([clim] if clim else []) + (tuiles_clim | map(attribute='e') | list) -%}
          {%- if e not in ns.d and states[e] is not none -%}
            {%- set mn = state_attr(e, 'min_temp') | float(16.0) -%}
            {%- set mx = state_attr(e, 'max_temp') | float(30.0) -%}
            {%- set unite = u.s if u.s else ('°F' if mn >= 40 else '°C') -%}
            {%- set pas = state_attr(e, 'target_temp_step') | float(0) -%}
            {%- set pas = pas if pas > 0 else (1.0 if unite == '°F' else 0.5) -%}
            {%- set hvac = state_attr(e, 'hvac_modes') or [] -%}
            {%- set pm = state_attr(e, 'preset_modes') or [] -%}
            {%- set fm = state_attr(e, 'fan_modes') or [] -%}
            {%- set sm = state_attr(e, 'swing_modes') or [] -%}
            {%- set capacites = ('c' if 'cool' in hvac else '')
                              ~ ('h' if 'heat' in hvac else '')
                              ~ ('d' if 'dry' in hvac else '')
                              ~ ('f' if 'fan_only' in hvac else '')
                              ~ ('e' if clim_eco | select('in', pm) | list | count > 0 else '')
                              ~ ('b' if 'boost' in pm else '')
                              ~ ('q' if clim_silence | select('in', fm) | list | count > 0 else '')
                              ~ ('s' if clim_oscillation | select('in', sm) | list | count > 0
                                       and clim_arret_oscillation | select('in', sm) | list | count > 0 else '')
                              ~ ('w' if 'windnice' in sm else '') -%}
            {%- set nom = (state_attr(e, 'friendly_name') or '') | string | replace('|', '/') | replace(';', ',') -%}
            {%- set ns.d = dict(ns.d, **{e: mn ~ '|' ~ mx ~ '|' ~ pas ~ '|' ~ unite ~ '|' ~ capacites ~ '|' ~ nom}) -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.d }}
      # « climr|…; », poussée par tab5_maj_emplacements juste avant tab5_maj_clim.
      clim_reglages: "{{ ('climr|' ~ reglages_clims[clim] ~ ';') if clim in reglages_clims else '' }}"
      # Les réglages d'une clim ont-ils pu changer à ce déclenchement ? Elle apparaît,
      # revient d'une panne, ou l'un des attributs de clim_attributs_reglages change (pas
      # à chaque degré de la pièce). Faux hors d'un changement d'état. Pour climr (branche
      # « Clim : son état a changé ») et crRT (clims des tuiles).
      reglages_changes: >-
        {%- if trigger.from_state is defined and trigger.to_state is defined -%}
          {%- set avant = trigger.from_state -%}
          {%- set apres = trigger.to_state -%}
          {%- set ns = namespace(v=avant is none or apres is none or avant.state in ['unavailable', 'unknown']) -%}
          {%- for a in clim_attributs_reglages if not ns.v -%}
            {%- if avant.attributes.get(a) != apres.attributes.get(a) -%}{%- set ns.v = true -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.v }}
        {%- else -%}
          {{ false }}
        {%- endif -%}
  - choose:
      # Section « Météo » remplie (variable meteo_a_ecrire) : son choix écrit dans les
      # listes du package, que lisent les capteurs et les poussées (tab5_push.yaml suit
      # sensor.tab5_meteo, sensor.tab5_pluie_dans_l_heure et sensor.tab5_vigilance). Une
      # liste changée à la main revient à ce choix : une notification le dit (une seule,
      # remplacée à chaque fois), pour que les deux réglages ne se contredisent pas en
      # silence.
      - alias: "Météo choisie dans le blueprint : l'écrire dans les listes « Tab5 · … »"
        conditions: "{{ trigger.id in meteo_declencheurs }}"
        sequence:
          - repeat:
              for_each: "{{ meteo_a_ecrire }}"
              sequence:
                - if: "{{ repeat.item.entite.startswith('input_text.') }}"
                  then:
                    - action: input_text.set_value
                      target:
                        entity_id: "{{ repeat.item.entite }}"
                      data:
                        value: "{{ repeat.item.valeur }}"
                  else:
                    - action: input_select.select_option
                      target:
                        entity_id: "{{ repeat.item.entite }}"
                      data:
                        option: "{{ repeat.item.valeur }}"
          - if: "{{ trigger.id == 'meteo_liste' }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: tab5_meteo_blueprint
                  title: "Tab5 — météo choisie dans le blueprint · weather picked in the blueprint"
                  message: |-
                    {%- set noms = {'input_text.tab5_meteo_previsions': 'Tab5 · source des prévisions',
                                    'input_select.tab5_source_pluie': "Tab5 · source de la pluie dans l'heure",
                                    'input_select.tab5_source_vigilance': 'Tab5 · source des vigilances'} -%}
                    {%- set auto = this.attributes.friendly_name | default('Tab5 — emplacements', true) %}
                    {% for e in meteo_a_ecrire -%}
                    - « {{ noms.get(e.entite, e.entite) }} » → {{ e.valeur }}
                    {% endfor %}
                    Ce choix est fait dans l'automatisation « {{ auto }} » (section Météo) : la liste y revient. Pour choisir dans la liste, videz ce champ de l'automatisation.

                    This choice is made in the « {{ auto }} » automation (Weather section): the list goes back to it. To choose in the list, empty that field of the automation.
      # Aussi quand le pipeline de discussion change : même réponse, sans attendre la
      # demande de la tablette (une fois par connexion).
      # Popup Énergie (ADR-0028) : la tablette dit quelle vue elle montre ; le script du
      # package tab5_energie pousse l'historique et l'instantané tant qu'il reste ouvert
      # (script.turn_on : sans attendre, la file de cette automatisation reste libre).
      # Section vide : une réponse vide, le popup dit qu'aucun capteur n'est choisi. Sans
      # le package : rien, le popup attend.
      - alias: "La tablette ouvre le popup Énergie"
        conditions: "{{ trigger.id == 'energie' }}"
        sequence:
          - if: "{{ energie_capteurs | count == 0 }}"
            then:
              - action: "esphome.{{ tablette }}_tab5_maj_energie"
                data:
                  payload: "|||||||"
                continue_on_error: true
            else:
              - if: "{{ states['script.tab5_energie'] is not none }}"
                then:
                  - action: script.turn_on
                    target:
                      entity_id: script.tab5_energie
                    data:
                      variables:
                        appareil: "{{ trigger.event.data.device_id | default('', true) | string }}"
                        tablette: "{{ tablette }}"
                        vue: "{{ trigger.event.data.vue | default('heures', true) }}"
                        capteurs: >-
                          {{ dict(energie, solaires=energie_solaires, productions=energie_productions,
                                  reseau_inverse=energie_reseau_inverse | bool(false),
                                  batterie_inverse=energie_batterie_inverse | bool(false)) }}

      # Popup Température (ADR-0032) : la tablette dit quelle température (salon, serre) et
      # quelle vue (jour, semaine, mois) elle montre ; le script du package tab5_historique
      # lit les statistiques du recorder et la prévision, et pousse la série
      # (script.turn_on : sans attendre, la file de cette automatisation reste libre). Sans
      # le package : rien, le popup attend.
      - alias: "La tablette ouvre l'historique d'une température"
        conditions: "{{ trigger.id == 'historique' }}"
        sequence:
          - if: >-
              {{ states['script.tab5_historique'] is not none
                 and trigger.event.data.cle | default('') in ['salon', 'serre'] }}
            then:
              - action: script.turn_on
                target:
                  entity_id: script.tab5_historique
                data:
                  variables:
                    tablette: "{{ tablette }}"
                    cle: "{{ trigger.event.data.cle }}"
                    vue: "{{ trigger.event.data.vue | default('jour', true) }}"
                    capteur: "{{ sources.get(trigger.event.data.cle, '') }}"
                    exterieur: "{{ trigger.event.data.cle == 'serre' and serre_exterieure | bool(false) }}"

      - alias: "La tablette demande quelles zones sont absentes"
        conditions: "{{ trigger.id in ['zones', 'pipeline_discussion'] }}"
        sequence:
          - action: "esphome.{{ tablette }}_tab5_maj_zones"
            data:
              absentes: "{{ absentes }}"
            continue_on_error: true

      - alias: "Commande d'un bouton de l'écran"
        conditions: "{{ trigger.id == 'action' }}"
        sequence:
          - variables:
              emplacement: "{{ trigger.event.data.emplacement | default('') }}"
              commande: "{{ trigger.event.data.action | default('') }}"
              valeur: "{{ trigger.event.data.valeur | default('') }}"
              cible: "{{ sources.get(emplacement, '') }}"
              # Tuile tRT (ADR-0023) : son entité, si elle existe encore. Le blueprint
              # est la liste blanche : une clé sans tuile ne commande rien.
              tuile: "{{ tuiles | selectattr('cle', 'eq', emplacement) | first | default({}, true) }}"
              t_entite: "{{ tuile.e if tuile and states[tuile.e] is not none else '' }}"
              t_domaine: "{{ t_entite.split('.')[0] if t_entite else '' }}"
              # Comportement personnalisé : lecture seule = rien ; allumer seulement =
              # basculer allume, éteindre ne fait rien (le firmware n'envoie déjà que
              # « allumer », ceci en est la garde côté HA).
              t_commande: >-
                {%- set c = perso.get(t_entite, {}).get('comportement', 'normal') if t_entite else 'lecture_seule' -%}
                {%- if c == 'lecture_seule' -%}
                {%- elif c == 'allumer_seulement' and commande in ['basculer', 'allumer'] -%}allumer
                {%- elif c == 'allumer_seulement' and commande == 'eteindre' -%}
                {%- else -%}{{ commande }}
                {%- endif -%}
              # Appareil de la tuile − / + (rN, ADR-0033) : son entité, si elle existe
              # encore. La liste reglables est la liste blanche : une clé rN qui n'y est
              # pas ne commande rien.
              reglable: "{{ reglables | selectattr('cle', 'eq', emplacement) | first | default({}, true) }}"
              r_entite: "{{ reglable.e if reglable and states[reglable.e] is not none else '' }}"
              r_domaine: "{{ r_entite.split('.')[0] if r_entite else '' }}"
              # Clim visée par le popup (ADR-0027) : celle du blueprint (emplacement
              # « clim »), ou celle d'une tuile (tRT dont l'entité est une clim : la liste
              # blanche reste « une entité qu'une tuile porte »). Les mêmes branches
              # « Clim : … » traduisent pour les deux. Une clim de la tuile − / + (rN,
              # ADR-0033) aussi, pour sa consigne seulement.
              clim_cible: >-
                {%- if emplacement == 'clim' -%}{{ clim }}
                {%- elif t_domaine == 'climate' -%}{{ t_entite }}
                {%- elif r_domaine == 'climate' and commande == 'consigne' -%}{{ r_entite }}
                {%- endif -%}
              # Sa commande : telle quelle pour la clim du blueprint et celle de la tuile
              # − / + ; pour une tuile, après son comportement (lecture seule : rien ;
              # allumer seulement : pas d'arrêt).
              clim_commande: "{{ commande if emplacement == 'clim' or r_domaine == 'climate' else t_commande }}"
          - choose:
              - alias: "Lumière : basculer"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'basculer' and cible != '' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: "{{ cible }}"
              - alias: "Lumière : luminosité 0-255"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'luminosite' and cible != '' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ cible }}"
                    data:
                      brightness: "{{ valeur | int(0) }}"
              - alias: "Lumière : luminosité en %"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'luminosite_pct' and cible != '' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ cible }}"
                    data:
                      brightness_pct: "{{ valeur | int(0) }}"
              - alias: "Lumière : couleur"
                conditions: "{{ emplacement.startswith('lumiere_') and commande == 'couleur' and cible != '' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ cible }}"
                    data:
                      color_name: "{{ valeur }}"
              - alias: "Tout éteindre"
                conditions: "{{ emplacement == 'lumieres' and commande == 'eteindre' }}"
                sequence:
                  - variables:
                      # Pas de filtre `extract` dans le Jinja de HA (c'est un filtre Ansible).
                      lampes: >-
                        {%- set ns = namespace(l=[]) -%}
                        {%- for c in ['lumiere_1', 'lumiere_2', 'lumiere_3'] -%}
                          {%- set x = sources.get(c, '') -%}
                          {%- if x and states[x] is not none -%}{%- set ns.l = ns.l + [x] -%}{%- endif -%}
                        {%- endfor -%}
                        {{ ns.l }}
                  - if: "{{ lampes | count > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ lampes }}"
              # La tuile PC d'un accueil construit depuis les entrées 3.x (t00 venu de
              # l'entrée PC) garde ce comportement.
              - alias: "PC : la TV allumée s'éteint, sinon PC et TV s'allument"
                conditions: >-
                  {{ (emplacement == 'pc' and commande == 'basculer')
                     or (tuile.get('s', '') == 'pc' and t_commande == 'basculer') }}
                sequence:
                  - variables:
                      tv: "{{ sources.tv }}"
                      pc: "{{ sources.pc }}"
                  - choose:
                      - conditions: "{{ tv != '' and states(tv) in ['on', 'idle', 'playing', 'paused'] }}"
                        sequence:
                          - action: media_player.turn_off
                            target:
                              entity_id: "{{ tv }}"
                    default:
                      - if: "{{ pc != '' and pc.split('.')[0] in ['switch', 'input_boolean'] and states[pc] is not none }}"
                        then:
                          - action: homeassistant.turn_on
                            target:
                              entity_id: "{{ pc }}"
                      - if: "{{ tv != '' and states[tv] is not none }}"
                        then:
                          - action: media_player.turn_on
                            target:
                              entity_id: "{{ tv }}"
              # Clim (ADR-0026) : l'écran parle comme la Daikin de l'auteur ; chaque branche
              # envoie le mode équivalent que l'appareil connaît, ou rien (une valeur
              # inconnue de l'appareil est une erreur de HA). Clim du blueprint ou d'une
              # tuile (ADR-0027) : clim_cible, même traduction.
              - alias: "Clim : consigne (bornée ; éteinte : froid, sinon chaud, chaud/froid, auto)"
                conditions: "{{ clim_commande == 'consigne' and clim_cible != '' }}"
                sequence:
                  - variables:
                      # HA refuse une consigne hors de min_temp / max_temp.
                      consigne: >-
                        {%- set t = valeur | float(20) -%}
                        {%- set mn = state_attr(clim_cible, 'min_temp') | float(t) -%}
                        {%- set mx = state_attr(clim_cible, 'max_temp') | float(t) -%}
                        {{ [[t, mn] | max, mx] | min }}
                      # Allumée : son mode. Éteinte (Daikin refuse set_temperature en off) : le
                      # premier mode de consigne qu'elle connaît, froid d'abord comme avant ;
                      # aucun : sans hvac_mode.
                      mode_consigne: >-
                        {%- if states(clim_cible) in ['off', 'unknown', 'unavailable'] -%}
                          {{ clim_modes_consigne | select('in', state_attr(clim_cible, 'hvac_modes') or []) | first | default('') }}
                        {%- else -%}
                          {{ states(clim_cible) }}
                        {%- endif -%}
                  - if: "{{ mode_consigne != '' }}"
                    then:
                      - action: climate.set_temperature
                        target:
                          entity_id: "{{ clim_cible }}"
                        data:
                          temperature: "{{ consigne }}"
                          hvac_mode: "{{ mode_consigne }}"
                    else:
                      - action: climate.set_temperature
                        target:
                          entity_id: "{{ clim_cible }}"
                        data:
                          temperature: "{{ consigne }}"
              - alias: "Clim : éteindre"
                conditions: "{{ clim_commande == 'eteindre' and clim_cible != '' }}"
                sequence:
                  - action: climate.turn_off
                    target:
                      entity_id: "{{ clim_cible }}"
              - alias: "Clim : mode (s'il existe sur l'appareil)"
                conditions: >-
                  {{ clim_commande == 'mode' and clim_cible != ''
                     and valeur in (state_attr(clim_cible, 'hvac_modes') or []) }}
                sequence:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: "{{ clim_cible }}"
                    data:
                      hvac_mode: "{{ valeur }}"
              - alias: "Clim : préréglage (Éco = eco ou away ; aucun = none, home ou comfort)"
                conditions: "{{ clim_commande == 'preset' and clim_cible != '' }}"
                sequence:
                  - variables:
                      preset: >-
                        {%- set pm = state_attr(clim_cible, 'preset_modes') or [] -%}
                        {%- if valeur == 'away' -%}
                          {{ clim_eco | select('in', pm) | first | default('') }}
                        {%- elif valeur == 'none' -%}
                          {{ ['none', 'home', 'comfort'] | select('in', pm) | first | default('') }}
                        {%- elif valeur in pm -%}
                          {{ valeur }}
                        {%- endif -%}
                  - if: "{{ preset != '' }}"
                    then:
                      - action: climate.set_preset_mode
                        target:
                          entity_id: "{{ clim_cible }}"
                        data:
                          preset_mode: "{{ preset }}"
              - alias: "Clim : ventilation (silence : quiet, silence, low… ; auto, sinon moyenne)"
                conditions: "{{ clim_commande == 'ventilation' and clim_cible != '' }}"
                sequence:
                  - variables:
                      # Fin du silence (auto) : auto, sinon une vitesse moyenne, sinon le
                      # premier mode qui n'est pas un silence (sinon le premier tout court).
                      ventilation: >-
                        {%- set fm = (state_attr(clim_cible, 'fan_modes') or []) | list -%}
                        {%- if valeur == 'quiet' -%}
                          {{ clim_silence | select('in', fm) | first | default('') }}
                        {%- elif valeur == 'auto' -%}
                          {%- set bruyants = fm | reject('in', clim_silence) | list -%}
                          {{ ((['auto'] + clim_ventilation_normale) | select('in', fm) | list + bruyants + fm) | first | default('') }}
                        {%- endif -%}
                  - if: "{{ ventilation != '' }}"
                    then:
                      - action: climate.set_fan_mode
                        target:
                          entity_id: "{{ clim_cible }}"
                        data:
                          fan_mode: "{{ ventilation }}"
              - alias: "Clim : oscillation (arrêt : stop ou off ; marche : swing, on, both…)"
                conditions: "{{ clim_commande == 'oscillation' and clim_cible != '' }}"
                sequence:
                  - variables:
                      oscillation: >-
                        {%- set sm = state_attr(clim_cible, 'swing_modes') or [] -%}
                        {%- if valeur == 'stop' -%}
                          {{ clim_arret_oscillation | select('in', sm) | first | default('') }}
                        {%- elif valeur == 'swing' -%}
                          {{ clim_oscillation | select('in', sm) | first | default('') }}
                        {%- elif valeur == 'windnice' and 'windnice' in sm -%}
                          windnice
                        {%- endif -%}
                  - if: "{{ oscillation != '' }}"
                    then:
                      - action: climate.set_swing_mode
                        target:
                          entity_id: "{{ clim_cible }}"
                        data:
                          swing_mode: "{{ oscillation }}"
              - alias: "TV : marche / arrêt"
                conditions: "{{ emplacement == 'tv' and commande == 'alimentation' }}"
                sequence:
                  - if: "{{ sources.tv_telecommande != '' and states[sources.tv_telecommande] is not none }}"
                    then:
                      - action: remote.toggle
                        target:
                          entity_id: "{{ sources.tv_telecommande }}"
                    else:
                      - if: "{{ sources.tv != '' and states[sources.tv] is not none }}"
                        then:
                          - action: media_player.toggle
                            target:
                              entity_id: "{{ sources.tv }}"
              - alias: "TV : touche de la télécommande"
                conditions: >-
                  {{ emplacement == 'tv' and commande == 'touche' and sources.tv_telecommande != ''
                     and states[sources.tv_telecommande] is not none }}
                sequence:
                  - action: remote.send_command
                    target:
                      entity_id: "{{ sources.tv_telecommande }}"
                    data:
                      command: "{{ valeur }}"
              - alias: "TV : application (script tab5_tv_app, package tab5_tv.yaml)"
                conditions: "{{ emplacement == 'tv' and commande == 'appli' and states['script.tab5_tv_app'] is not none }}"
                sequence:
                  - action: script.tab5_tv_app
                    data:
                      app: "{{ valeur }}"
              - alias: "Volet : ouvrir, fermer, arrêter"
                conditions: "{{ emplacement == 'volet' and commande in ['ouvrir', 'fermer', 'arreter'] }}"
                sequence:
                  - variables:
                      sens: "{{ {'ouvrir': 'open', 'fermer': 'close', 'arreter': 'stop'}[commande] }}"
                  - choose:
                      - alias: "Volet suivi par le package (course simulée)"
                        conditions: "{{ volet_par_package }}"
                        sequence:
                          # script.turn_on : sans attendre la fin de la course (26 s). Appelé
                          # directement, le script retenait l'automatisation (mode queued) : la
                          # commande suivante, dont « arrêter », n'arrivait qu'une fois le volet au
                          # bout (vu le 28/09 : une lampe basculée 2 min après l'appui).
                          - action: script.turn_on
                            target:
                              entity_id: script.tab5_volet_action
                            data:
                              variables:
                                action: "{{ sens }}"
                      - alias: "Volet qui signale sa course"
                        conditions: "{{ volet != '' }}"
                        sequence:
                          - action: "cover.{{ sens }}_cover"
                            target:
                              entity_id: "{{ volet }}"

              # ---- Tuiles et pièces (ADR-0023), par domaine de l'entité de la tuile ----
              - alias: "Tuile : basculer, allumer, éteindre (lum, int, med)"
                conditions: >-
                  {{ t_commande in ['basculer', 'allumer', 'eteindre']
                     and t_domaine in ['light', 'switch', 'input_boolean', 'fan', 'humidifier', 'automation', 'media_player'] }}
                sequence:
                  - action: "{{ t_domaine }}.{{ {'basculer': 'toggle', 'allumer': 'turn_on', 'eteindre': 'turn_off'}[t_commande] }}"
                    target:
                      entity_id: "{{ t_entite }}"
              - alias: "Tuile : ouvrir, fermer, arrêter (vol)"
                conditions: "{{ t_commande in ['ouvrir', 'fermer', 'arreter'] and t_domaine in ['cover', 'valve'] }}"
                sequence:
                  - variables:
                      sens: "{{ {'ouvrir': 'open', 'fermer': 'close', 'arreter': 'stop'}[t_commande] }}"
                  - choose:
                      - alias: "Volet suivi par le package (course simulée)"
                        conditions: "{{ t_entite == volet_suivi }}"
                        sequence:
                          # script.turn_on : sans attendre la fin de la course (26 s). Appelé
                          # directement, le script retenait l'automatisation (mode queued) : la
                          # commande suivante, dont « arrêter », n'arrivait qu'une fois le volet au
                          # bout (vu le 28/09 : une lampe basculée 2 min après l'appui).
                          - action: script.turn_on
                            target:
                              entity_id: script.tab5_volet_action
                            data:
                              variables:
                                action: "{{ sens }}"
                    default:
                      - action: "{{ t_domaine }}.{{ sens }}_{{ t_domaine }}"
                        target:
                          entity_id: "{{ t_entite }}"
              # Popup du volet (05/10/2026, discussion #278) : le curseur envoie la position
              # 0-100 au relâcher (un nombre, sinon rien : jamais « 0 » = fermer par défaut).
              # Seulement à une entité qui sait la régler (bit 4, SET_POSITION, des
              # supported_features de cover comme de valve) ; jamais au volet à course
              # simulée du package (il n'a pas de position : la tablette n'a pas de curseur
              # pour lui, voir etats_tuiles).
              - alias: "Tuile : position 0-100 (vol, popup du volet)"
                conditions: >-
                  {{ t_commande == 'position' and t_domaine in ['cover', 'valve'] and t_entite != volet_suivi
                     and valeur is match('^[0-9]{1,3}$')
                     and (state_attr(t_entite, 'supported_features') | int(0)) // 4 % 2 == 1 }}
                sequence:
                  - action: "{{ t_domaine }}.set_{{ t_domaine }}_position"
                    target:
                      entity_id: "{{ t_entite }}"
                    data:
                      position: "{{ [valeur | int(0), 100] | min }}"
              - alias: "Tuile : lancer (act)"
                conditions: "{{ t_commande == 'lancer' and t_domaine in ['scene', 'script', 'button', 'input_button'] }}"
                sequence:
                  - action: >-
                      {{ {'scene': 'scene.turn_on', 'script': 'script.turn_on', 'button': 'button.press',
                          'input_button': 'input_button.press'}[t_domaine] }}
                    target:
                      entity_id: "{{ t_entite }}"
              - alias: "Tuile lumière : luminosité 0-255"
                conditions: "{{ t_commande == 'luminosite' and t_domaine == 'light' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ t_entite }}"
                    data:
                      brightness: "{{ valeur | int(0) }}"
              - alias: "Tuile lumière : luminosité en %"
                conditions: "{{ t_commande == 'luminosite_pct' and t_domaine == 'light' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ t_entite }}"
                    data:
                      brightness_pct: "{{ valeur | int(0) }}"
              - alias: "Tuile lumière : couleur"
                conditions: "{{ t_commande == 'couleur' and t_domaine == 'light' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ t_entite }}"
                    data:
                      color_name: "{{ valeur }}"
              - alias: "Pièce : tout éteindre (ses lumières)"
                conditions: "{{ emplacement is match('^p[0-4]$') and commande == 'eteindre' }}"
                sequence:
                  - variables:
                      lampes: >-
                        {%- set ns = namespace(l=[]) -%}
                        {%- for t in tuiles | selectattr('r', 'eq', emplacement[1] | int) | selectattr('type', 'eq', 'lum') -%}
                          {%- if states[t.e] is not none and t.e not in ns.l
                                and perso.get(t.e, {}).get('comportement', 'normal') not in ['allumer_seulement', 'lecture_seule'] -%}
                            {%- set ns.l = ns.l + [t.e] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.l }}
                  - if: "{{ lampes | count > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ lampes }}"

              # ---- Tuile − / + au choix (ADR-0033), par domaine de l'entité de rN ----
              # La valeur visée, un nombre (sinon rien), bornée à reglables_bornes ; une clim
              # passe par « Clim : consigne » (commande consigne, clim_cible). 0 éteint une
              # lampe ou un ventilateur ; sans position réglable, un volet ou une vanne
              # s'ouvre au-dessus de 50 et se ferme en dessous.
              - alias: "Tuile − / + : régler (volume, luminosité, vitesse, humidité, position, consigne, nombre)"
                conditions: "{{ commande == 'regler' and r_entite != '' and r_domaine != 'climate' and valeur | is_number }}"
                sequence:
                  - variables:
                      bornes: "{{ reglables_bornes.get(reglable.cle, [0, 100, 1, '']) }}"
                      v: "{{ [[valeur | float(0), bornes[0] | float(0)] | max, bornes[1] | float(100)] | min }}"
                      position_reglable: >-
                        {{ r_domaine in ['cover', 'valve'] and r_entite != volet_suivi
                           and (state_attr(r_entite, 'supported_features') | int(0)) // 4 % 2 == 1 }}
                  - choose:
                      - conditions: "{{ r_domaine == 'media_player' }}"
                        sequence:
                          - action: media_player.volume_set
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              volume_level: "{{ (v / 100) | round(2) }}"
                      - conditions: "{{ r_domaine in ['light', 'fan'] and v <= 0 }}"
                        sequence:
                          - action: "{{ r_domaine }}.turn_off"
                            target:
                              entity_id: "{{ r_entite }}"
                      - conditions: "{{ r_domaine == 'light' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              brightness_pct: "{{ v | round(0) | int }}"
                      - conditions: "{{ r_domaine == 'fan' }}"
                        sequence:
                          - action: fan.set_percentage
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              percentage: "{{ v | round(0) | int }}"
                      - conditions: "{{ r_domaine == 'humidifier' }}"
                        sequence:
                          - action: humidifier.set_humidity
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              humidity: "{{ v | round(0) | int }}"
                      - conditions: "{{ r_domaine == 'water_heater' }}"
                        sequence:
                          - action: water_heater.set_temperature
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              temperature: "{{ v }}"
                      - conditions: "{{ position_reglable }}"
                        sequence:
                          - action: "{{ r_domaine }}.set_{{ r_domaine }}_position"
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              position: "{{ v | round(0) | int }}"
                      - alias: "Volet suivi par le package (course simulée)"
                        conditions: "{{ r_entite == volet_suivi }}"
                        sequence:
                          - action: script.turn_on
                            target:
                              entity_id: script.tab5_volet_action
                            data:
                              variables:
                                action: "{{ 'open' if v >= 50 else 'close' }}"
                      - conditions: "{{ r_domaine in ['cover', 'valve'] }}"
                        sequence:
                          - action: "{{ r_domaine }}.{{ 'open' if v >= 50 else 'close' }}_{{ r_domaine }}"
                            target:
                              entity_id: "{{ r_entite }}"
                      - conditions: "{{ r_domaine in ['number', 'input_number'] }}"
                        sequence:
                          - action: "{{ r_domaine }}.set_value"
                            target:
                              entity_id: "{{ r_entite }}"
                            data:
                              value: "{{ v }}"

      - alias: "Clim : son état a changé"
        conditions: "{{ trigger.id == 'clim' and clim != '' }}"
        sequence:
          # Réglages d'abord (ADR-0026), s'ils ont pu changer (reglages_changes : la clim
          # apparaît, revient d'une panne, ou l'un des attributs de clim_attributs_reglages
          # change). Pas à chaque degré de la pièce.
          - if: "{{ clim_reglages != '' and reglages_changes }}"
            then:
              - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
                data:
                  payload: "{{ clim_reglages }}"
                continue_on_error: true
          - action: "esphome.{{ tablette }}_tab5_maj_clim"
            data:
              target: "{{ state_attr(clim, 'temperature') | float(20) }}"
              current: "{{ state_attr(clim, 'current_temperature') | float(20) }}"
              mode: "{{ states(clim) }}"
              preset: "{{ state_attr(clim, 'preset_mode') | default('none', true) }}"
              fan: "{{ state_attr(clim, 'fan_mode') | default('auto', true) }}"
              swing: "{{ state_attr(clim, 'swing_mode') | default('stop', true) }}"
            continue_on_error: true

      # Aussi quand la liste du package ne nomme plus ce volet (volet_choisi) : son état
      # réel revient à l'écran.
      - alias: "Volet qui signale sa course : son état a changé"
        conditions: "{{ trigger.id in ['volet', 'volet_choisi'] and volet != '' and not volet_par_package }}"
        sequence:
          - action: "esphome.{{ tablette }}_tab5_maj_volet_etat"
            data:
              etat_physique: >-
                {{ {'opening': 'En_mouvement', 'closing': 'En_mouvement', 'open': 'Ouvert', 'closed': 'Ferme'}.get(states(volet), states(volet)) }}
            continue_on_error: true

    # Connexion ou changement d'un emplacement : ses valeurs ; à la connexion, aussi la
    # clim et le volet (sans package), à la suite, sans pause (retirée le 01/10/2026 :
    # elle ne faisait que retarder l'écran, comme celles de packages/tab5_push.yaml).
    default:
      - if: "{{ payload != '' }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
            data:
              payload: "{{ payload }}"
            continue_on_error: true
      - if: "{{ trigger.id in ['connexion', 'rechargement', 'maj_ecran', 'demarrage_ha'] and clim != '' }}"
        then:
          # Réglages de la clim (clé climr, ADR-0026) avant son état : bornes, pas et
          # unité sont en place quand la consigne arrive.
          - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
            data:
              payload: "{{ clim_reglages }}"
            continue_on_error: true
          - action: "esphome.{{ tablette }}_tab5_maj_clim"
            data:
              target: "{{ state_attr(clim, 'temperature') | float(20) }}"
              current: "{{ state_attr(clim, 'current_temperature') | float(20) }}"
              mode: "{{ states(clim) }}"
              preset: "{{ state_attr(clim, 'preset_mode') | default('none', true) }}"
              fan: "{{ state_attr(clim, 'fan_mode') | default('auto', true) }}"
              swing: "{{ state_attr(clim, 'swing_mode') | default('stop', true) }}"
            continue_on_error: true
      - if: "{{ trigger.id in ['connexion', 'rechargement', 'maj_ecran', 'demarrage_ha'] and volet != '' and not volet_par_package }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_volet_etat"
            data:
              etat_physique: >-
                {{ {'opening': 'En_mouvement', 'closing': 'En_mouvement', 'open': 'Ouvert', 'closed': 'Ferme'}.get(states(volet), states(volet)) }}
            continue_on_error: true
      # Après un rechargement, les zones aussi : un emplacement vidé ou rempli dans
      # l'automatisation doit disparaître ou revenir sans attendre que la tablette les
      # redemande (elle ne le fait qu'à sa connexion, ADR-0018).
      - if: "{{ trigger.id in ['rechargement', 'maj_ecran'] }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_zones"
            data:
              absentes: "{{ absentes }}"
            continue_on_error: true

  # ---- Tuiles des pièces (ADR-0023) ----
  # Définitions : un instantané complet (ce qui n'y est pas est vide), avant les états.
  # Calculées à chaque connexion quel que soit le protocole (la trace montre ce qui
  # partirait), envoyées seulement à une tablette 3.2 ou plus.
  - if: "{{ trigger.id in ['connexion', 'rechargement', 'maj_ecran', 'demarrage_ha', 'zones'] or redefinir }}"
    then:
      - variables:
          # Nom de chaque pièce : saisi, sinon l'aire de ses appareils quand ceux qui en
          # ont une en ont une seule ET qu'elle couvre au moins la moitié des appareils
          # (une seule lampe rangée dans « Chambre » ne nomme pas une pièce de cinq
          # appareils, vu chez l'auteur le 28/09), sinon vide (la tablette écrit « Pièce n »).
          noms_pieces: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for n in range(5) -%}
              {%- set saisi = (noms_saisis[n] or '') | string | trim -%}
              {%- set es = tuiles | selectattr('r', 'eq', n) | map(attribute='e') | list -%}
              {%- set avec = es | map('area_name') | reject('none') | list -%}
              {%- set aires = avec | unique | list -%}
              {%- set commune = aires[0] if aires | count == 1 and (avec | count) * 2 >= (es | count) else '' -%}
              {%- set ns.l = ns.l + [saisi if saisi else commune] -%}
            {%- endfor -%}
            {{ ns.l }}
          # « pR|nom; » puis « tRT|type|icône|options|complément|nom; » (ADR-0023) ; puis la
          # rangée sous l'horloge (ADR-0031) : « hp|place des plantes; » (0 à 2, « - » :
          # masquées), « hd|secondes d'une ligne; », « hLI|type|icône|options|complément|
          # nom|classe; » (classe d'appareil : la couleur de la valeur). n = 5 : la rangée,
          # avec la même traduction que les tuiles.
          definitions: >-
            {%- set ns = namespace(r='') -%}
            {%- for n in range(6) -%}
              {%- set dans = (tuiles | selectattr('r', 'eq', n) | list) if n < 5 else rangee -%}
              {%- if n == 5 -%}
                {%- set piece = '' -%}
                {%- set ns.r = ns.r ~ 'hp|' ~ ('-' if rangee_plantes not in ['0', '1', '2'] else rangee_plantes)
                              ~ ';hd|' ~ (rangee_duree | float(32) | round(0) | int) ~ ';' -%}
              {%- endif -%}
              {%- if dans | count > 0 -%}
                {%- if n < 5 -%}
                  {%- set piece = noms_pieces[n] | string -%}
                  {%- set ns.r = ns.r ~ 'p' ~ n ~ '|' ~ (piece | replace('|', '/') | replace(';', ',')) ~ ';' -%}
                {%- endif -%}
                {%- for t in dans -%}
                  {%- set dom = t.e.split('.')[0] -%}
                  {%- set p = perso.get(t.e, {}) -%}
                  {%- set classe = (state_attr(t.e, 'device_class') or '') | string -%}
                  {#- Icône : personnalisée, sinon l'attribut icon, sinon la classe, sinon le
                      domaine ; un « mdi: » hors palette prend le défaut du domaine. -#}
                  {%- set defaut = icones_defaut.get(dom ~ '.' ~ classe, icones_defaut.get(dom, '')) if classe else icones_defaut.get(dom, '') -%}
                  {#- Tuile PC du réglage 3.x : l'écran d'ordinateur de la 3.1, pas l'icône
                      générique d'un interrupteur. -#}
                  {%- set defaut = 'ordinateur' if t.s == 'pc' else defaut -%}
                  {#- Capteurs solaires de la section « Énergie » : le panneau (ADR-0028). -#}
                  {%- set defaut = 'solaire' if t.e in energie_solaires else defaut -%}
                  {%- set mdi = (p.get('icone') or state_attr(t.e, 'icon') or '') | string -%}
                  {%- set icone = icones_mdi.get(mdi, defaut) if mdi else defaut -%}
                  {#- Options : d (luminosité) et c (couleur) des modes de couleur ; o, k, r
                      du comportement ; t = la TV du blueprint ; m = sa clim ; e = un capteur
                      de sa section « Énergie » (popup Énergie, ADR-0028). -#}
                  {%- set modes = state_attr(t.e, 'supported_color_modes') or [] -%}
                  {%- set c = p.get('comportement', 'normal') -%}
                  {%- set options = ('d' if t.type == 'lum' and modes | reject('in', ['onoff', 'unknown']) | list | count > 0 else '')
                                  ~ ('c' if t.type == 'lum' and modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | count > 0 else '')
                                  ~ ('o' if c == 'allumer_seulement' else '')
                                  ~ ('k' if c == 'confirmer' else '')
                                  ~ ('r' if c == 'lecture_seule' else '')
                                  ~ ('t' if t.type == 'med' and t.e == sources.tv else '')
                                  ~ ('m' if t.type == 'cli' and t.e == sources.clim else '')
                                  ~ ('e' if t.type == 'cap' and t.e in energie_capteurs else '') -%}
                  {#- Complément : unité d'un capteur (7 octets au plus), classe d'un bin. -#}
                  {%- if t.type == 'cap' -%}
                    {%- set u = namespace(s=(state_attr(t.e, 'unit_of_measurement') or '') | string) -%}
                    {%- for i in range(8) -%}{%- if u.s.encode('utf-8') | length > 7 -%}{%- set u.s = u.s[:-1] -%}{%- endif -%}{%- endfor -%}
                    {%- set complement = u.s -%}
                  {%- elif t.type == 'bin' -%}
                    {%- set complement = 'presence' if dom in ['device_tracker', 'person'] else ('lock' if dom == 'lock' else classe) -%}
                  {%- else -%}
                    {%- set complement = '' -%}
                  {%- endif -%}
                  {#- Nom : personnalisé, sinon le nom de l'entité sans celui de la pièce (mot
                      entier, casse ignorée, liaison « du », « de la »… qui reste en bout
                      retirée), sinon le nom de l'entité. -#}
                  {%- set fn = (state_attr(t.e, 'friendly_name') or t.e) | string | trim -%}
                  {%- set nom = namespace(s=(p.get('nom') or '') | string | trim) -%}
                  {%- if not nom.s -%}
                    {%- set nom.s = fn -%}
                    {%- set i = (fn | lower).find(piece | lower) if piece else -1 -%}
                    {%- set j = i + (piece | length) -%}
                    {%- if i >= 0 and (i == 0 or not fn[i - 1].isalnum()) and (j >= fn | length or not fn[j].isalnum()) -%}
                      {%- set reste = namespace(s=(fn[:i] ~ ' ' ~ fn[j:]).split() | join(' ')) -%}
                      {%- for m in [' de la', " de l'", ' du', ' des', ' de', " d'", ' la', ' le', ' les', " l'"] -%}
                        {%- if (reste.s | lower).endswith(m) -%}{%- set reste.s = reste.s[:(reste.s | length) - (m | length)] -%}{%- endif -%}
                      {%- endfor -%}
                      {%- set reste.s = reste.s | trim(' -–:,') -%}
                      {%- if reste.s -%}{%- set nom.s = reste.s -%}{%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- set ns.r = ns.r ~ t.cle ~ '|' ~ t.type ~ '|' ~ icone ~ '|' ~ options ~ '|'
                                ~ (complement | replace('|', '/') | replace(';', ',')) ~ '|'
                                ~ (nom.s | replace('|', '/') | replace(';', ','))
                                ~ (('|' ~ (classe | replace('|', '/') | replace(';', ','))) if n == 5 else '') ~ ';' -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {#- Tuile − / + au choix (ADR-0033) : « rN|type|icône|options|lien|min|max|pas|
                unité|nom; ». Icône comme une tuile (personnalisée, attribut icon, classe,
                domaine) ; option t = la TV du blueprint (sa valeur ouvre la télécommande) ;
                lien = la première tuile qui porte la même entité (sa valeur ouvre le popup
                de cette tuile), vide sinon ; bornes de reglables_bornes ; nom personnalisé,
                sinon celui de l'entité. -#}
            {%- for g in reglables -%}
              {%- set dom = g.e.split('.')[0] -%}
              {%- set p = perso.get(g.e, {}) -%}
              {%- set classe = (state_attr(g.e, 'device_class') or '') | string -%}
              {%- set defaut = icones_defaut.get(dom ~ '.' ~ classe, icones_defaut.get(dom, '')) if classe else icones_defaut.get(dom, '') -%}
              {%- set mdi = (p.get('icone') or state_attr(g.e, 'icon') or '') | string -%}
              {%- set icone = icones_mdi.get(mdi, defaut) if mdi else defaut -%}
              {%- set lien = tuiles | selectattr('e', 'eq', g.e) | map(attribute='cle') | first | default('') -%}
              {%- set b = reglables_bornes.get(g.cle, [0, 100, 1, '']) -%}
              {%- set nom = (p.get('nom') or state_attr(g.e, 'friendly_name') or g.e) | string | trim -%}
              {#- Option t (la TV du blueprint) : hors du motif des options des tuiles, que
                  tests/test_tuiles_blueprint.py compte une fois chacune. -#}
              {%- set opt = 't' if dom == 'media_player' and g.e == sources.tv else '' -%}
              {%- set ns.r = ns.r ~ g.cle ~ '|' ~ g.type ~ '|' ~ icone ~ '|' ~ opt
                            ~ '|' ~ lien ~ '|' ~ b[0] ~ '|' ~ b[1] ~ '|' ~ b[2] ~ '|'
                            ~ (b[3] | string | replace('|', '/') | replace(';', ',')) ~ '|'
                            ~ (nom | replace('|', '/') | replace(';', ',')) ~ ';' -%}
            {%- endfor -%}
            {{ ns.r }}
      - if: "{{ protocole == 2 }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_tuiles"
            data:
              payload: "{{ definitions }}"
            continue_on_error: true
  # États : « tRT|état|valeur|couleur; » (ADR-0023). Valeur = luminosité 0-255 (lum),
  # position (vol), la mesure (cap), la température de la pièce (cli), nan sinon ;
  # couleur = « RRGGBB » d'une lumière allumée qui donne rgb_color. Dans la même
  # poussée, les clims des tuiles (crRT avant, ceRT après, ADR-0027) et les éléments de
  # la rangée sous l'horloge (« hLI|état|valeur|couleur; », mêmes champs, ADR-0031).
  - if: "{{ tuiles_a_pousser | count > 0 }}"
    then:
      - variables:
          etats_tuiles: >-
            {%- set ns = namespace(r='') -%}
            {%- for t in tuiles + rangee if t.cle in tuiles_a_pousser and states[t.e] is not none -%}
              {%- set st = states[t.e] -%}
              {%- if t.e == volet_suivi -%}
                {%- set etat = {'En_mouvement': 'opening', 'Ouvert': 'open', 'Ferme': 'closed', 'Partiel': 'open'}.get(states('input_text.volet_serre_etat'), st.state) -%}
                {#- Pas de vraie position (course simulée) : nan au bout de la course, où la
                    flèche de la tablette repart dans l'autre sens comme à 100 / 0 ; -1 pour
                    « Partiel » (arrêté en route), qui garde le sens choisi. nan plutôt que
                    100 / 0 depuis le 05/10/2026 : le popup du volet n'offre un curseur qu'à
                    une position connue, et ce volet ne sait pas en régler une. -#}
                {%- set v = {'Partiel': -1}.get(states('input_text.volet_serre_etat'), 'nan') -%}
              {%- else -%}
                {%- set etat = st.state -%}
                {%- set brut = st.attributes.get('brightness') if t.type == 'lum'
                          else st.attributes.get('current_position') if t.type == 'vol'
                          else st.state if t.type == 'cap'
                          else st.attributes.get('current_temperature') if t.type == 'cli'
                          else none -%}
                {%- set v = brut | float('nan') -%}
                {#- Lampe allumée qui annonce une luminosité de 0 (Govee, vu chez l'auteur) :
                    pas de « 0 % » à l'écran, « Allumé ». -#}
                {%- set v = 'nan' if t.type == 'lum' and not ((v | float(0)) > 0) else v -%}
              {%- endif -%}
              {%- set rgb = st.attributes.get('rgb_color') if t.type == 'lum' and st.state == 'on' else none -%}
              {%- set couleur = ('%02X%02X%02X' | format(rgb[0] | int(0), rgb[1] | int(0), rgb[2] | int(0))) if rgb and rgb | count == 3 else '' -%}
              {%- set ns.r = ns.r ~ t.cle ~ '|' ~ (etat | string | replace('|', '/') | replace(';', ',')) ~ '|' ~ v ~ '|' ~ couleur ~ ';' -%}
            {%- endfor -%}
            {{ ns.r }}
          # Clims des tuiles (ADR-0027), avec leurs tuiles : réglages « crRT|min|max|pas|
          # unité|capacités|nom; » (ceux de climr : reglages_clims) après les définitions,
          # ou quand ils ont pu changer (reglages_changes) ; état « ceRT|consigne|pièce|
          # mode|préréglage|ventilation|oscillation; » (les champs de tab5_maj_clim, nan
          # quand HA n'en a pas), à chaque poussée de la tuile. Un firmware sans les clims
          # des tuiles ignore ces clés.
          reglages_tuiles: >-
            {%- set tout = trigger.id in ['connexion', 'rechargement', 'maj_ecran', 'demarrage_ha', 'zones'] or redefinir -%}
            {%- set ns = namespace(r='') -%}
            {%- for t in tuiles_clim if t.cle in tuiles_a_pousser and t.e in reglages_clims -%}
              {%- if tout or (reglages_changes and trigger.entity_id == t.e) -%}
                {%- set ns.r = ns.r ~ 'cr' ~ t.cle[1:] ~ '|' ~ reglages_clims[t.e] ~ ';' -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.r }}
          etats_clims: >-
            {%- set ns = namespace(r='') -%}
            {%- for t in tuiles_clim if t.cle in tuiles_a_pousser and states[t.e] is not none -%}
              {%- set a = states[t.e].attributes -%}
              {%- set champs = [a.get('temperature') | float('nan'), a.get('current_temperature') | float('nan'),
                                states(t.e), a.get('preset_mode') | default('none', true),
                                a.get('fan_mode') | default('auto', true), a.get('swing_mode') | default('stop', true)] -%}
              {%- set ns.r = ns.r ~ 'ce' ~ t.cle[1:] ~ '|'
                            ~ (champs | map('string') | map('replace', '|', '/') | map('replace', ';', ',') | join('|')) ~ ';' -%}
            {%- endfor -%}
            {{ ns.r }}
      - if: "{{ protocole == 2 and (reglages_tuiles ~ etats_tuiles ~ etats_clims) != '' }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
            data:
              payload: "{{ reglages_tuiles ~ etats_tuiles ~ etats_clims }}"
            continue_on_error: true
  # Tuile − / + au choix (ADR-0033) : « rN|état|valeur; », valeur dans l'unité de sa
  # définition : volume, luminosité, vitesse et position en % (0 pour une lampe ou un
  # ventilateur éteint ; 0 / 100 pour un volet sans position, fermé / ouvert), consigne
  # d'une clim ou d'un chauffe-eau, humidité visée, valeur d'un nombre ; nan quand HA n'en
  # a pas (lecteur éteint, sans volume). Le volet à course simulée : l'état tenu par son
  # package, comme ses tuiles.
  - if: "{{ protocole == 2 and reglables_a_pousser | count > 0 }}"
    then:
      - variables:
          etats_reglables: >-
            {%- set ns = namespace(r='') -%}
            {%- for g in reglables if g.cle in reglables_a_pousser and states[g.e] is not none -%}
              {%- set st = states[g.e] -%}
              {%- set a = st.attributes -%}
              {%- set etat = st.state -%}
              {%- if g.e == volet_suivi -%}
                {%- set etat = {'En_mouvement': 'opening', 'Ouvert': 'open', 'Ferme': 'closed', 'Partiel': 'open'}.get(states('input_text.volet_serre_etat'), etat) -%}
              {%- endif -%}
              {%- set pas = reglables_bornes.get(g.cle, [0, 100, 1, ''])[2] | float(1) -%}
              {%- if g.type == 'son' -%}
                {#- Lecteur éteint : pas de volume_level (`float('nan')` rendrait le texte
                    « nan », qu'on ne multiplie pas). -#}
                {%- set vl = a.get('volume_level') -%}
                {%- set v = ((vl | float(0)) * 100) | round(0) if vl | is_number else 'nan' -%}
              {%- elif g.type in ['lum', 'ven'] -%}
                {%- set brut = a.get('brightness') if g.type == 'lum' else a.get('percentage') -%}
                {%- if etat == 'off' -%}
                  {%- set v = 0 -%}
                {%- elif brut is none -%}
                  {#- Allumé sans valeur (lampe sans variateur, ventilateur à une vitesse). -#}
                  {%- set v = 100 if etat == 'on' else 'nan' -%}
                {%- elif g.type == 'lum' -%}
                  {#- Lampe allumée qui annonce 0 (Govee) : 1 %, jamais « éteinte » à l'écran. -#}
                  {%- set v = [(brut | float(0) / 2.55) | round(0), 1] | max -%}
                {%- else -%}
                  {%- set v = brut | float('nan') -%}
                {%- endif -%}
              {%- elif g.type in ['cli', 'eau'] -%}
                {%- set v = a.get('temperature') | float('nan') -%}
              {%- elif g.type == 'hum' -%}
                {%- set v = a.get('humidity') | float('nan') -%}
              {%- elif g.type == 'vol' -%}
                {%- set v = a.get('current_position') | float('nan') if pas < 100 else ({'open': 100, 'closed': 0}.get(etat, 'nan')) -%}
              {%- else -%}
                {%- set v = st.state | float('nan') -%}
              {%- endif -%}
              {%- set ns.r = ns.r ~ g.cle ~ '|' ~ (etat | string | replace('|', '/') | replace(';', ',')) ~ '|' ~ v ~ ';' -%}
            {%- endfor -%}
            {{ ns.r }}
      - if: "{{ etats_reglables != '' }}"
        then:
          - action: "esphome.{{ tablette }}_tab5_maj_emplacements"
            data:
              payload: "{{ etats_reglables }}"
            continue_on_error: true
