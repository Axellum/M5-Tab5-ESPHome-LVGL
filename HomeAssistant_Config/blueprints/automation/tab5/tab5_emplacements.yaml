    # Trois sections depuis le 07/10/2026 (solaire ; réseau et maison ; batterie) : HA
    # range les valeurs à plat sous use_blueprint.input, par nom d'entrée (Blueprint.inputs
    # de homeassistant/components/blueprint/models.py aplatit les sections) ; les clés des
    # entrées n'ont pas changé, les automatisations existantes gardent leurs valeurs.
    energie:
      name: "Énergie : solaire · Energy: solar"
      icon: mdi:solar-power
      collapsed: true
      description: >-
        Facultatif : une installation solaire, avec ou sans batterie (sections suivantes).
        Laissées vides, les trois sections « Énergie » n'ajoutent rien à l'écran. Remplies :
        placez l'un de leurs capteurs dans une pièce (le solaire, par exemple) ; sa tuile
        ouvre au toucher la fenêtre Énergie, avec solaire, maison, réseau et batterie en
        direct, et la production en barres par heure, jour et mois. Un champ vide fait
        disparaître sa carte ou sa ligne.


        Optional: a solar installation, with or without a battery (next sections). Left
        empty, the three « Énergie · Energy » sections add nothing to the screen. Filled:
        put one of their sensors in a room (the solar one, for instance); its tile opens
        the Energy window on tap, with solar, home, grid and battery live, and the
        production as bars per hour, day and month. An empty field hides its card or line.
      input:
        energie_solaire:
          name: Puissance solaire · Solar power
          description: >-
            Le capteur principal : ce que produisent les panneaux en ce moment (W ou kW).
            Plusieurs onduleurs : le premier ici, les autres dans le champ suivant.


            The main sensor: what the panels produce right now (W or kW). Several
            inverters: the first one here, the others in the next field.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        # Plusieurs sources (discussion #278, 05/10/2026 : pv1 + pv2 + …) : un champ à part,
        # en liste, plutôt que energie_solaire en multiple: true. Une automatisation déjà
        # créée garde une CHAÎNE dans energie_solaire, et l'éditeur de HA ne convertit pas
        # une chaîne quand le sélecteur passe en liste (ha-entities-picker fait value.map) :
        # le champ ne s'afficherait plus. Les modèles additionnent les deux champs, et
        # acceptent chaîne, liste ou vide dans chacun.
