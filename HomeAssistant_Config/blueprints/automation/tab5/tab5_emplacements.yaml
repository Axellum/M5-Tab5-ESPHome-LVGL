# ============================================================================
# [AI-CONTEXT]
# @file tab5_emplacements.yaml
# @role Blueprint HA (lot 6a de l'audit « ouverture », ADR-0019 ; pièces, ADR-0023) :
#       choisir à la souris les appareils de l'écran du M5Stack Tab5. Une automatisation
#       par tablette. Elle :
#       - décrit les pièces (firmware 3.2 et plus, ADR-0023) : jusqu'à 5 pièces de 5
#         tuiles, une par page de la rangée du bas. Définitions (tab5_maj_tuiles :
#         type, icône, options, complément, nom) à la connexion, au rechargement des
#         automatisations, au démarrage de HA et à la demande des zones ; puis états
#         « tRT|état|valeur|couleur » par tab5_maj_emplacements : tous après les
#         définitions, une tuile quand son appareil change, les capteurs (cap) avec les
#         mesures lentes de 5 minutes ;
#       - pousse l'état des emplacements 3.x (action tab5_maj_emplacements, « clé|état|valeur;… ») :
#         tous à la connexion (esphome.tab5_connected) et au démarrage de HA ; lumières,
#         PC et TV quand ce que montre l'écran change ; les mesures lentes (températures,
#         humidités, pots, batterie) groupées toutes les 5 minutes, celles qui ont changé
#         seulement ;
#       - pousse la clim (tab5_maj_clim) et un volet qui signale sa course (tab5_maj_volet_etat) ;
#       - pousse la clim de chaque tuile cli sans l'option m (ADR-0027) : réglages
#         « crRT|… » (ceux de climr) après les définitions, état « ceRT|… » (les champs de
#         tab5_maj_clim) avec les états des tuiles ;
#       - exécute les commandes de l'écran (événement esphome.tab5_action) : clés 3.x vers
#         l'entité choisie, tuiles (tRT) et pièces (pR) selon le DOMAINE de l'entité de la
#         tuile, jamais sur une entité qu'aucune tuile ne porte ; les commandes du popup
#         clim (« clim » ou « tRT » d'une clim de tuile) par les mêmes branches « Clim : … » ;
#       - répond à la demande des zones (esphome.tab5_zones → tab5_maj_zones) : un
#         emplacement vide, ou dont l'entité n'existe pas, disparaît de l'écran (ADR-0018) ;
#       - section « Météo » (discussion #278, 03/10/2026), facultative : la météo des
#         prévisions, la source de la pluie et celle des vigilances. Remplie, elle est ÉCRITE
#         dans les listes de packages/tab5_meteo_sources.yaml (input_text et input_select),
#         qui restent la seule source lue par les capteurs et les poussées ; une liste changée
#         à la main y revient, avec une notification. Vide : rien n'est écrit, les listes font
#         foi comme avant (déclencheurs meteo_*, variable meteo_a_ecrire) ;
#       - section « Énergie » (ADR-0028, 04/10/2026, discussion #278), facultative : les
#         capteurs d'une installation solaire. Une tuile cap de l'un d'eux prend l'option e
#         (elle ouvre le popup Énergie) ; l'événement esphome.tab5_energie (vue) lance
#         script.tab5_energie (packages/tab5_energie.yaml) avec ces capteurs. Vide : aucune
#         tuile e, et une réponse vide (le popup ouvert par « Aller à l'écran » le dit).
#         Avec la puissance crête (energie_crete, kWc), la production en % de la crête part
#         dans tab5_maj_emplacements (clé solaire, icône du bandeau d'état) : avec tous les
#         états, puis avec les mesures lentes si le capteur a changé ; « nan » sinon.
#         Plusieurs sources (05/10/2026, discussion #278) : energie_solaire_autres et
#         energie_production_autres s'ajoutent aux champs principaux ; puissances et
#         compteurs sont additionnés (energie_solaires, energie_productions).
#       - popup « Température » (ADR-0032, 06/10/2026) : à l'événement esphome.tab5_historique
#         (cle = salon | serre, vue), lance script.tab5_historique (packages/tab5_historique.yaml)
#         avec le capteur de l'emplacement et la case serre_exterieure (« la seconde
#         température est dehors »), qui pousse sa courbe et, pour la seconde, la prévision ;
#       - section « Sous l'horloge » (ADR-0031, 06/10/2026), facultative : la rangée sous
#         l'horloge de l'accueil, jusqu'à trois lignes de quatre éléments plus celle des
#         plantes. Définitions « hp » (place des plantes), « hd » (durée d'une ligne) et
#         « hLI » avec celles des tuiles, états « hLI » avec ceux des tuiles (variable
#         rangee, déclencheurs rangee_n). Affichage seul : hors de `tuiles`, donc hors de
#         la liste blanche des commandes.
#       - section « Tuile − / + » (ADR-0033, 06/10/2026), facultative : d'autres appareils
#         que la clim pour les boutons − / + de l'accueil, choisis sur la tablette.
#         Définitions « rN|type|icône|options|lien|min|max|pas|unité|nom » avec celles des
#         tuiles, états « rN|état|valeur » (variables reglables, reglables_bornes,
#         déclencheurs reglable_…) ; la commande « regler » (ou « consigne » pour une
#         clim) ne vise que ces entités-là.
#       - section « Boutons du haut » (07/10/2026), facultative : l'écran qu'ouvre l'appui
#         long de chacun des trois boutons en haut à droite de l'accueil. Clé
#         « appuis|maison|engrenage|manette » de tab5_maj_emplacements (variable appuis),
#         avec tous les états ; un code inconnu part en « auto ». Un firmware plus ancien
#         l'ignore et garde ses appuis longs.
# @architecture_constraint Aucun placeholder : ce fichier est générique, il s'importe tel
#       quel. Les clés d'emplacement et les commandes sont celles du firmware
#       (tab5-api-logic.yaml, script tab5_action) ; tests/test_emplacements.py et
#       tests/test_tuiles_blueprint.py comparent (tableaux de l'ADR-0023 compris).
#       Les événements esphome.* n'exigent pas l'option « autoriser l'appareil à effectuer
#       des actions HA » (manager.py de l'intégration ESPHome) : n'importe quel appareil
#       ESPHome peut donc les émettre. Première condition = garde d'origine (modèle
#       tab5-ha-hmi de l'appareil émetteur) ; tests/test_garde_origine.py.
#       Protocole (ADR-0023, Compatibilité) : la version du projet se lit dans le
#       sw_version de l'appareil (« 3.1.0 (ESPHome 2026.9.0) ») ; 3.2.0 ou plus =
#       tuiles ; en dessous, illisible ou aucune tablette = jamais tab5_maj_tuiles (une
#       action absente est une erreur que continue_on_error n'attrape pas).
# @ai_instruction Les entrées 3.x (lumiere_1..3, pc, volet) gardent leurs noms : des
#       automatisations existantes les référencent. Le bloc « icones » entre les
#       marqueurs est écrit par tools/gen_tuiles_icones.py : ne pas l'éditer à la main.
# ============================================================================
blueprint:
  # Libellés en deux langues, « français · english » (29/09/2026) : un blueprint n'a pas
  # de traductions, et l'écran s'installe aussi hors de France. Les clés des entrées ne
  # changent pas (des automatisations existantes les référencent).
  name: "Tab5 — emplacements de l'écran · screen slots"
  description: >-
    Choisissez les appareils de l'écran du M5Stack Tab5. Firmware 3.2 et plus : jusqu'à
    cinq pièces de cinq appareils, une par page de la rangée du bas (l'accueil, puis les
    pages atteintes d'un glissement) ; le nom, l'icône et le type de chaque tuile viennent
    de Home Assistant. Firmware 3.0 et 3.1 : les réglages 3.x (section repliée) servent
    toujours. Un emplacement laissé vide disparaît de l'écran, avec ses boutons. Une seule
    automatisation par tablette. Les états sont poussés à la connexion et au démarrage de
    Home Assistant, puis à chaque changement visible ; les mesures (températures,
    humidités, plantes, batterie, capteurs des pièces) sont regroupées toutes les 5 minutes.


    Pick the devices of the M5Stack Tab5 screen. Firmware 3.2 and later: up to five rooms
    of five devices, one per page of the bottom row (the home page, then the pages a swipe
    reaches); each tile's name, icon and kind come from Home Assistant. Firmware 3.0 and
    3.1: the 3.x settings (folded section) still apply. An empty slot disappears from the
    screen, with its buttons. One automation per tablet. States are pushed on connection
    and when Home Assistant starts, then on every visible change; measurements
    (temperatures, humidity, plants, battery, room sensors) are grouped every 5 minutes.
  domain: automation
  author: Axellum
  source_url: https://github.com/Axellum/M5-Tab5-ESPHome-LVGL/blob/main/HomeAssistant_Config/blueprints/automation/tab5/tab5_emplacements.yaml
  homeassistant:
    # Celle que demande le firmware 3.0 (clé API fournie par HA, docs/installation.md).
    # Elle couvre aussi les sélecteurs des pièces : objet à champs (2025.7) et entités
    # réordonnables (2025.8), relevés dans l'historique de homeassistant/helpers/selector.py.
    min_version: 2026.8.0
  input:
    # Pièce n ↔ page de la rangée du bas, dans l'ordre où un glissement les atteint
    # depuis l'accueil (ADR-0023) : R = n − 1.
    piece_1:
      name: "Pièce 1 — accueil (aujourd'hui → J+4) · Room 1 — home (today → day 4)"
      icon: mdi:home
      description: >-
        Les cinq tuiles de l'accueil (firmware 3.2 et plus). Laissée vide, elle reprend
        les réglages de la section « Tuiles de l'accueil (réglage 3.x) ».


        The five tiles of the home page (firmware 3.2 and later). Left empty, it takes the
        settings of the « Home tiles (3.x setup) » section.
      input:
        piece_1_nom:
          name: Nom de la pièce · Room name
          description: >-
            Vide = l'aire de ses appareils, s'ils en ont une seule (et au moins la moitié
            l'a), sinon « Pièce 1 ».


            Empty = the area of its devices, if they share one (and at least half have
            it), else « Pièce 1 ».
          default: ""
          selector:
            text:
        piece_1_tuiles:
          name: Appareils · Devices
          description: >-
            Cinq au plus, dans l'ordre des tuiles (de gauche à droite). Lumières,
            interrupteurs, volets, lecteurs, scènes et scripts, capteurs, climatisation.


            Five at most, in tile order (left to right). Lights, switches, covers, media
            players, scenes and scripts, sensors, climate.
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: &domaines_tuiles
                    - light
                    - switch
                    - input_boolean
                    - fan
                    - humidifier
                    - automation
                    - cover
                    - valve
                    - media_player
                    - scene
                    - script
                    - button
                    - input_button
                    - sensor
                    - number
                    - input_number
                    - binary_sensor
                    - device_tracker
                    - person
                    - lock
                    - climate
    piece_2:
      name: "Pièce 2 — J+5 → J+9 · Room 2 — day 5 → 9"
      icon: mdi:home-outline
      description: >-
        Un glissement vers la gauche depuis l'accueil.


        One swipe left from the home page.
      collapsed: true
      input:
        piece_2_nom:
          name: Nom de la pièce · Room name
          description: >-
            Vide = l'aire de ses appareils, s'ils en ont une seule (et au moins la moitié
            l'a), sinon « Pièce 2 ».


            Empty = the area of its devices, if they share one (and at least half have
            it), else « Pièce 2 ».
          default: ""
          selector:
            text:
        piece_2_tuiles:
          name: Appareils · Devices
          description: >-
            Cinq au plus, dans l'ordre des tuiles (de gauche à droite).


            Five at most, in tile order (left to right).
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: *domaines_tuiles
    piece_3:
      name: "Pièce 3 — J+10 → J+14 · Room 3 — day 10 → 14"
      icon: mdi:home-outline
      description: >-
        Deux glissements vers la gauche depuis l'accueil.


        Two swipes left from the home page.
      collapsed: true
      input:
        piece_3_nom:
          name: Nom de la pièce · Room name
          description: >-
            Vide = l'aire de ses appareils, s'ils en ont une seule (et au moins la moitié
            l'a), sinon « Pièce 3 ».


            Empty = the area of its devices, if they share one (and at least half have
            it), else « Pièce 3 ».
          default: ""
          selector:
            text:
        piece_3_tuiles:
          name: Appareils · Devices
          description: >-
            Cinq au plus, dans l'ordre des tuiles (de gauche à droite).


            Five at most, in tile order (left to right).
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: *domaines_tuiles
    piece_4:
      name: "Pièce 4 — prochaines heures · Room 4 — next hours"
      icon: mdi:home-outline
      description: >-
        Un glissement vers la droite depuis l'accueil.


        One swipe right from the home page.
      collapsed: true
      input:
        piece_4_nom:
          name: Nom de la pièce · Room name
          description: >-
            Vide = l'aire de ses appareils, s'ils en ont une seule (et au moins la moitié
            l'a), sinon « Pièce 4 ».


            Empty = the area of its devices, if they share one (and at least half have
            it), else « Pièce 4 ».
          default: ""
          selector:
            text:
        piece_4_tuiles:
          name: Appareils · Devices
          description: >-
            Cinq au plus, dans l'ordre des tuiles (de gauche à droite).


            Five at most, in tile order (left to right).
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: *domaines_tuiles
    piece_5:
      name: "Pièce 5 — heures suivantes · Room 5 — later hours"
      icon: mdi:home-outline
      description: >-
        Deux glissements vers la droite depuis l'accueil.


        Two swipes right from the home page.
      collapsed: true
      input:
        piece_5_nom:
          name: Nom de la pièce · Room name
          description: >-
            Vide = l'aire de ses appareils, s'ils en ont une seule (et au moins la moitié
            l'a), sinon « Pièce 5 ».


            Empty = the area of its devices, if they share one (and at least half have
            it), else « Pièce 5 ».
          default: ""
          selector:
            text:
        piece_5_tuiles:
          name: Appareils · Devices
          description: >-
            Cinq au plus, dans l'ordre des tuiles (de gauche à droite).


            Five at most, in tile order (left to right).
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: *domaines_tuiles
    personnaliser:
      name: Personnaliser des tuiles · Customise tiles
      icon: mdi:palette-outline
      description: >-
        Facultatif. Sans réglage, une tuile prend le nom de l'appareil (sans le nom de la
        pièce) et son icône dans Home Assistant.


        Optional. Without it, a tile takes the device's name (without the room's name)
        and its icon in Home Assistant.
      collapsed: true
      input:
        personnalisation:
          name: Personnalisations · Customisations
          description: >-
            Une ligne par appareil. L'icône doit être dans la palette de l'écran ; sinon,
            celle de son type. « Confirmer » : un second appui dans les 3 s envoie la commande.


            One line per device. The icon must be in the screen's palette; otherwise, the
            one of its kind. « Confirm »: a second tap within 3 s sends the command.
          default: []
          selector:
            object:
              multiple: true
              label_field: entite
              description_field: nom
              fields:
                entite:
                  label: Appareil · Device
                  required: true
                  selector:
                    entity:
                      filter:
                        - domain: *domaines_tuiles
                nom:
                  label: Nom sur l'écran · Name on the screen
                  selector:
                    text:
                icone:
                  label: Icône · Icon
                  selector:
                    icon:
                comportement:
                  label: Comportement · Behaviour
                  selector:
                    select:
                      mode: dropdown
                      options:
                        - label: Normal
                          value: normal
                        - label: Allumer seulement (jamais éteint depuis l'écran) · On only (never switched off from the screen)
                          value: allumer_seulement
                        - label: Confirmer (un second appui dans les 3 s) · Confirm (a second tap within 3 s)
                          value: confirmer
                        - label: Lecture seule (aucun appui) · Read only (no tap)
                          value: lecture_seule
    appareils:
      name: TV, téléphone · TV, phone
      icon: mdi:television
      input:
        tv:
          name: TV
          description: >-
            Le bouton « TV » ; placée dans une pièce, sa tuile ouvre la télécommande (appui
            long).


            The « TV » button; placed in a room, its tile opens the remote (long press).
          default: []
          selector:
            entity:
              filter:
                - domain: media_player
        tv_telecommande:
          name: Télécommande de la TV · TV remote
          description: >-
            Pour les touches du popup TV. Les applications passent par le script
            tab5_tv_app, s'il existe.


            For the keys of the TV popup. Apps go through the tab5_tv_app script, if it
            exists.
          default: []
          selector:
            entity:
              filter:
                - domain: remote
        telephone:
          name: Batterie du téléphone · Phone battery
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery
    temperatures:
      name: Températures · Temperatures
      icon: mdi:thermometer
      input:
        salon_temperature:
          name: Température de la pièce · Room temperature
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        salon_humidite:
          name: Humidité de la pièce · Room humidity
          description: >-
            Colore l'icône de la pièce.


            Colours the room's icon.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        serre_temperature:
          name: Seconde température (serre) · Second temperature (greenhouse)
          description: >-
            Sans elle, une manette ouvre l'arcade à sa place. Un appui long sur l'une des
            deux températures montre son historique ; celui de la seconde montre aussi la
            prévision de la météo (packages/tab5_historique.yaml).


            Without it, a gamepad opens the arcade in its place. A long press on either
            temperature shows its history; the second one's also shows the weather forecast
            (packages/tab5_historique.yaml).
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        serre_exterieure:
          name: La seconde température est dehors · The second temperature is outdoors
          description: >-
            Cochée : dans son historique, la prévision de la météo prolonge sa courbe.
            Décochée (une serre, une autre pièce) : la prévision reste à part, sous le nom
            « Dehors, prévu ».


            Ticked: in its history, the weather forecast extends its curve. Unticked (a
            greenhouse, another room): the forecast stays apart, named « Outdoors,
            forecast ».
          default: false
          selector:
            boolean: {}
    climatisation:
      name: Climatisation · Climate
      icon: mdi:air-conditioner
      input:
        clim:
          name: Climatisation · Climate
          description: >-
            − / consigne / + et le popup. Toute autre clim placée dans une pièce ouvre le
            popup pour elle-même.


            − / setpoint / + and the popup. Any other climate placed in a room opens the
            popup for itself.
          default: []
          selector:
            entity:
              filter:
                - domain: climate
    # Tuile − / + au choix (ADR-0033, 06/10/2026) : d'autres appareils que la clim pour
    # les boutons − / + de l'accueil, choisis sur la tablette dans une liste qui se
    # déroule au toucher de la température du salon. Clés rN de tab5_maj_tuiles
    # (définitions) et de tab5_maj_emplacements (états) ; un firmware plus ancien les
    # ignore (la clim seule, comme avant). Seules ces entités-là reçoivent « regler ».
    tuile_reglage:
      name: Tuile − / + · − / + tile
      icon: mdi:plus-minus-variant
      collapsed: true
      description: >-
        D'autres appareils à régler avec les boutons − / + de l'accueil (firmware plus
        récent que 3.6.0). Toucher la température du salon déroule la liste : la clim
        ci-dessus, ces appareils, puis le volume de la tablette ; le choix reste jusqu'au
        suivant, même après un redémarrage. Toucher la valeur entre − et + ouvre le popup
        de l'appareil quand il en a un (lampe ou volet placé dans une pièce, TV avec sa
        télécommande, clim).


        Other devices to adjust with the − / + buttons of the home page (firmware newer
        than 3.6.0). Touching the living-room temperature unfolds the list: the climate
        above, these devices, then the tablet's volume; the choice stays until the next
        one, even after a reboot. Touching the value between − and + opens the device's
        popup when it has one (a light or a shutter placed in a room, a TV with its
        remote, a climate).
      input:
        reglables:
          name: Appareils · Devices
          description: >-
            Huit au plus, dans l'ordre de la liste : volume d'un lecteur ou d'une barre de
            son, luminosité d'une lampe, consigne d'un thermostat, d'un chauffe-eau ou d'un
            humidificateur, vitesse d'un ventilateur, position d'un volet ou d'une vanne,
            valeur d'un nombre. Un appareil en lecture seule (section des tuiles) n'y entre
            pas.


            Eight at most, in the order of the list: volume of a player or a soundbar,
            brightness of a light, setpoint of a thermostat, a water heater or a
            humidifier, speed of a fan, position of a shutter or a valve, value of a
            number. A device set to read only (tiles section) is left out.
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain:
                    - media_player
                    - light
                    - climate
                    - water_heater
                    - humidifier
                    - fan
                    - cover
                    - valve
                    - number
                    - input_number
    plantes:
      name: Plantes · Plants
      icon: mdi:sprout
      description: >-
        Le capteur d'humidité de chaque pot. Conductivité, éclairement, température et
        batterie sont pris sur le même appareil (capteurs Flower Care et semblables).


        The moisture sensor of each pot. Conductivity, light, temperature and battery are
        taken from the same device (Flower Care sensors and the like).
      input:
        pot_1:
          name: Pot 1
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: moisture
        pot_2:
          name: Pot 2
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: moisture
        pot_3:
          name: Pot 3
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: moisture
        pot_4:
          name: Pot 4
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: moisture
        pot_5:
          name: Pot 5
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: moisture
    # Rangée sous l'horloge (ADR-0031, 06/10/2026) : jusqu'à trois lignes de quatre
    # éléments, plus celle des plantes, qui tournent avec la carte centrale. Affichage
    # seul : aucune commande ne vise un élément de la rangée (variable rangee, hors de
    # `tuiles`). Clés hLI, hp et hd de tab5_maj_tuiles, états hLI de
    # tab5_maj_emplacements ; un firmware plus ancien les ignore (plantes seules).
    sous_horloge:
      name: Sous l'horloge · Under the clock
      icon: mdi:view-sequential
      collapsed: true
      description: >-
        La rangée sous l'horloge de l'accueil (firmware plus récent que 3.6.0) : jusqu'à
        trois lignes de quatre capteurs, plus celle des plantes. Elles tournent avec la
        carte centrale ; un appui passe à la ligne suivante. Une valeur prend la couleur
        de sa mesure (température, humidité, batterie, puissance). Affichage seul : un
        interrupteur ou une lampe montre son état, sans se commander d'ici.


        The row under the clock of the home page (firmware newer than 3.6.0): up to three
        lines of four sensors, plus the plants line. They rotate with the central card; a
        tap shows the next line. A value takes the colour of its measurement
        (temperature, humidity, battery, power). Display only: a switch or a light shows
        its state, without being controlled from here.
      input:
        rangee_ligne_1:
          name: Ligne 1 · Line 1
          description: >-
            Quatre au plus, de gauche à droite : températures, humidités, production,
            batteries, détecteurs de présence ou d'ouverture, interrupteurs. Un capteur
            montre sa valeur, les autres leur icône.


            Four at most, left to right: temperatures, humidity, production, batteries,
            presence or opening detectors, switches. A sensor shows its value, the others
            their icon.
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: &domaines_rangee
                    - sensor
                    - number
                    - input_number
                    - binary_sensor
                    - device_tracker
                    - person
                    - lock
                    - climate
                    - light
                    - switch
                    - input_boolean
                    - fan
                    - humidifier
                    - automation
                    - cover
                    - valve
                    - media_player
        rangee_ligne_2:
          name: Ligne 2 · Line 2
          description: >-
            Quatre au plus. Une ligne vide est sautée.


            Four at most. An empty line is skipped.
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: *domaines_rangee
        rangee_ligne_3:
          name: Ligne 3 · Line 3
          description: >-
            Quatre au plus. Avec la ligne des plantes, la rangée garde trois lignes : la
            dernière attend que les plantes soient masquées.


            Four at most. With the plants line the row keeps three lines: the last one
            waits until the plants are hidden.
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: *domaines_rangee
        rangee_plantes:
          name: Ligne des plantes · Plants line
          description: >-
            Sa place dans la rangée (les pots de la section Plantes). Un appui long sur
            elle ouvre Mes Plantes.


            Its place in the row (the pots of the Plants section). A long press on it
            opens My Plants.
          default: "0"
          selector:
            select:
              options:
                - value: "0"
                  label: "En premier · First"
                - value: "1"
                  label: "En deuxième · Second"
                - value: "2"
                  label: "En troisième · Third"
                - value: masquees
                  label: "Masquée · Hidden"
        rangee_duree:
          name: Durée d'une ligne · Time per line
          description: >-
            La carte centrale change toutes les 8 secondes ; la rangée change un tour
            sur n, juste avant elle, pour un enchaînement de haut en bas.


            The central card changes every 8 seconds; the row changes every n turns,
            just before it, so the screen changes from top to bottom.
          default: 32
          selector:
            number:
              min: 8
              max: 120
              step: 8
              unit_of_measurement: s
              mode: slider
    # Boutons du haut (07/10/2026, demande d'Axel) : l'écran qu'ouvre l'appui long de chacun
    # des trois boutons en haut à droite de l'accueil. Les taps ne changent pas. Clé
    # « appuis » de tab5_maj_emplacements (variable appuis) ; un firmware plus ancien
    # l'ignore. Codes = kCodesEcran de Tab5/tab5_zones.cpp, plus « auto »
    # (tests/test_appuis.py) : ni traduits ni renommés sans le firmware.
    boutons_haut:
      name: Boutons du haut · Top buttons
      icon: mdi:gesture-tap-hold
      collapsed: true
      description: >-
        L'écran qu'ouvre l'appui long de chacun des trois boutons en haut à droite de
        l'accueil (firmware plus récent que 3.7.0-rc.4 ; un plus ancien garde ses appuis
        longs). Le tap ne change pas : appareils, Réglages, Arcade. Automatique : Énergie
        sur la maison (quand la production solaire s'affiche), console système sur
        l'engrenage, télécommande sur la manette (quand une TV est choisie). Un écran
        absent de la maison (clim, plantes, TV, production solaire pour Énergie) ne s'ouvre
        pas. Une petite icône dans le coin du bouton montre l'écran choisi. Si
        l'engrenage n'ouvre plus la console, elle reste joignable par l'entité « Aller à
        l'écran » de la tablette. Le bouton maison est masqué quand aucune pièce n'a
        d'appareil.


        The screen a long press opens on each of the three buttons at the top right of the
        home page (firmware newer than 3.7.0-rc.4; an older one keeps its long presses).
        The tap does not change: devices, Settings, Arcade. Automatic: Energy on the house
        (when the solar production shows), the system console on the gear, the remote on
        the gamepad (when a TV is picked). A screen your home lacks (climate, plants, TV,
        solar production for Energy) does not open. A small icon in the button's corner
        shows the chosen screen. If the gear no longer opens the console, it stays
        reachable from the tablet's « Aller à l'écran » entity. The house button is hidden
        when no room has a device.
      input:
        appui_maison:
          name: "Maison : appui long · House: long press"
          default: auto
          selector:
            select:
              mode: dropdown
              options: &ecrans_appui_long
                - label: "Automatique : comme aujourd'hui · Automatic: as today"
                  value: auto
                - label: "Rien · Nothing"
                  value: rien
                - label: "Assistant vocal · Voice assistant"
                  value: assistant
                - label: "Calendrier · Calendar"
                  value: calendrier
                - label: "Réveil · Alarm clock"
                  value: reveil
                - label: "Climatisation · Climate"
                  value: clim
                - label: "Plantes · Plants"
                  value: plantes
                - label: "Télécommande TV · TV remote"
                  value: tv
                - label: "Console système · System console"
                  value: console
                - label: "Énergie · Energy"
                  value: energie
                - label: "Réglages · Settings"
                  value: reglages
                - label: "Alertes · Alerts"
                  value: alertes
                - label: "Arcade"
                  value: arcade
                - label: "Maison · House"
                  value: maison
        appui_engrenage:
          name: "Engrenage : appui long · Gear: long press"
          default: auto
          selector:
            select:
              mode: dropdown
              options: *ecrans_appui_long
        appui_manette:
          name: "Manette : appui long · Gamepad: long press"
          default: auto
          selector:
            select:
              mode: dropdown
              options: *ecrans_appui_long
    planning:
      name: Planning de travail · Work schedule
      icon: mdi:calendar-clock
      input:
        agenda_travail:
          name: Agenda de travail · Work calendar
          description: >-
            Laissé vide : celui de la liste « Tab5 · agenda de travail » (package
            tab5_reglages), qui donne aussi les horaires et l'heure du réveil. Sans agenda
            du tout, le panneau planning sort de la carte centrale.


            Left empty: the one of the « Tab5 · agenda de travail · work calendar » list
            (tab5_reglages package), which also gives the hours and the alarm time. With no
            calendar at all, the planning panel leaves the central card.
          default: []
          selector:
            entity:
              filter:
                - domain: calendar
    # Météo (discussion #278, 03/10/2026) : les trois sources de packages/tab5_meteo_sources.yaml,
    # choisies ici comme les appareils. Laissées vides, rien ne change : les listes « Tab5 · … »
    # de HA font foi. Remplies, le blueprint ÉCRIT son choix dans ces listes (variable
    # meteo_a_ecrire, branche « Météo choisie dans le blueprint ») et elles restent la seule
    # chose que lisent les capteurs et les poussées. Options des deux selects = celles des
    # input_select du package, dans le même ordre, après « liste » (tests/test_meteo_blueprint.py).
    meteo:
      name: Météo · Weather
      icon: mdi:weather-partly-cloudy
      description: >-
        Facultatif. Laissés vides, ces choix restent ceux des listes « Tab5 · … » de Home
        Assistant (package tab5_meteo_sources). Remplis, ils sont écrits dans ces listes et y
        priment : un changement fait à la main dans la liste revient au choix d'ici, avec une
        notification ; videz le champ pour choisir de nouveau dans la liste. Ces listes valent
        pour toute la maison : avec plusieurs tablettes, remplissez-les dans une seule
        automatisation.


        Optional. Left empty, these choices stay those of the « Tab5 · … » lists of Home
        Assistant (tab5_meteo_sources package). Filled, they are written into these lists and
        take precedence: a change made by hand in the list goes back to the choice made here,
        with a notification; empty the field to choose in the list again. These lists apply to
        the whole home: with several tablets, fill them in one automation only.
      input:
        meteo_previsions:
          name: Météo des prévisions · Forecast weather
          description: >-
            Les pages des jours et des heures et la météo du moment : n'importe quelle entité
            météo. Vide : celle de la liste « Tab5 · source des prévisions » (par défaut la
            ville Météo-France, sinon la première entité météo).


            The day and hour pages and the current weather: any weather entity. Empty: the one
            of the « Tab5 · source des prévisions · forecast source » list (by default the
            Météo-France city, otherwise the first weather entity).
          default: []
          selector:
            entity:
              filter:
                - domain: weather
        meteo_pluie:
          name: Pluie dans l'heure · Next-hour rain
          description: >-
            Sans Météo-France dans Home Assistant, « Météo-France » donne Open-Meteo, qui répond
            partout sans clé.


            Without Météo-France in Home Assistant, « Météo-France » gives Open-Meteo, which
            answers everywhere without a key.
          default: liste
          selector:
            select:
              mode: dropdown
              options:
                - label: Celle de la liste « Tab5 · source de la pluie dans l'heure » · The one of the HA list
                  value: liste
                - label: Météo-France
                  value: Météo-France
                - label: OpenWeatherMap
                  value: OpenWeatherMap
                - label: Buienradar (Pays-Bas, Belgique · Netherlands, Belgium)
                  value: Buienradar
                - label: DWD (Allemagne · Germany)
                  value: DWD
                - label: Met.no (pays nordiques · Nordic countries)
                  value: Met.no
                - label: Open-Meteo (partout, sans clé · everywhere, no key)
                  value: Open-Meteo
                - label: Aucune (carte masquée) · None (card hidden)
                  value: Aucune
        meteo_vigilance:
          name: Vigilances · Weather warnings
          default: liste
          selector:
            select:
              mode: dropdown
              options:
                - label: Celle de la liste « Tab5 · source des vigilances » · The one of the HA list
                  value: liste
                - label: Météo-France
                  value: Météo-France
                - label: MeteoAlarm
                  value: MeteoAlarm
                - label: DWD (Allemagne · Germany)
                  value: DWD
                - label: CAP Alerts
                  value: CAP Alerts
                - label: Aucune (aucune icône) · None (no icons)
                  value: Aucune
    # Énergie (ADR-0028, 04/10/2026, discussion #278) : une installation solaire. Vide, rien
    # n'apparaît. Remplie, une tuile cap de l'un de ces capteurs ouvre le popup Énergie
    # (option e), dont script.tab5_energie (packages/tab5_energie.yaml) pousse les données.
    # Signe du réseau : + achat, − vente (case « Inverser » sinon, ou deux capteurs).
    energie:
      name: Énergie · Energy
      icon: mdi:solar-power
      collapsed: true
      description: >-
        Facultatif : une installation solaire, avec ou sans batterie. Laissée vide, l'écran
        n'a rien de plus. Remplie : placez l'un de ces capteurs dans une pièce (le capteur
        solaire, par exemple) ; sa tuile montre sa valeur et ouvre au toucher le popup
        Énergie : solaire, maison, réseau et batterie en direct, et la production en barres
        par heure, par jour et par mois. Il faut aussi le package tab5_energie. Un champ
        vide fait disparaître sa carte ou sa ligne.


        Optional: a solar installation, with or without a battery. Left empty, the screen
        shows nothing more. Filled: put one of these sensors in a room (the solar one, for
        instance); its tile shows its value and opens the Energy popup on tap: solar, home,
        grid and battery live, and the production as bars per hour, day and month. The
        tab5_energie package is needed too. An empty field hides its card or line.
      input:
        energie_solaire:
          name: Puissance solaire · Solar power
          description: >-
            Ce que produisent les panneaux en ce moment (W ou kW).


            What the panels produce right now (W or kW).
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        # Plusieurs sources (discussion #278, 05/10/2026 : pv1 + pv2 + …) : un champ à part,
        # en liste, plutôt que energie_solaire en multiple: true. Une automatisation déjà
        # créée garde une CHAÎNE dans energie_solaire, et l'éditeur de HA ne convertit pas
        # une chaîne quand le sélecteur passe en liste (ha-entities-picker fait value.map) :
        # le champ ne s'afficherait plus. Les modèles additionnent les deux champs, et
        # acceptent chaîne, liste ou vide dans chacun.
        energie_solaire_autres:
          name: Autres puissances solaires · Other solar power
          description: >-
            Plusieurs onduleurs ou plusieurs chaînes de panneaux (pv1, pv2…) : mettez ici
            les autres capteurs, ils sont additionnés à la puissance solaire (un capteur
            indisponible, la nuit par exemple, est ignoré tant qu'un autre a une valeur).


            Several inverters or several panel strings (pv1, pv2…): put the other sensors
            here, they are added to the solar power (an unavailable sensor, at night for
            instance, is skipped as long as another one has a value).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: power
        energie_crete:
          name: Puissance crête des panneaux · Panel peak power
          description: >-
            En kWc (kilowatts-crête, sur la facture ou l'onduleur). Remplie avec la puissance
            solaire : une icône du bandeau d'état, en haut à gauche, montre la production en
            pourcentage de cette crête, par sa couleur (gris la nuit, puis rouge, ambre,
            bleu, vert). Avec plusieurs sources : la crête de tous les panneaux. 0 : pas
            d'icône.


            In kWp (kilowatt-peak, on the invoice or the inverter). Filled together with the
            solar power: an icon of the status strip, top left, shows the production as a
            percentage of this peak, by its colour (grey at night, then red, amber, blue,
            green). With several sources: the peak of all the panels. 0: no icon.
          default: 0
          selector:
            number:
              min: 0
              max: 1000
              step: 0.01
              unit_of_measurement: kWc
              mode: box
        energie_production:
          name: Énergie solaire produite · Solar energy produced
          description: >-
            Compteur en kWh (celui du tableau Énergie de Home Assistant, avec des
            statistiques) : le total du jour et les barres viennent de son historique. Vide :
            pas de graphique.


            Meter in kWh (the one of the Home Assistant Energy dashboard, with statistics):
            the day total and the bars come from its history. Empty: no chart.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy
        energie_production_autres:
          name: Autres énergies solaires produites · Other solar energy produced
          description: >-
            Un compteur par onduleur : mettez ici les autres (kWh ou Wh, avec des
            statistiques). Le total du jour et chaque barre sont la somme de tous les
            compteurs ; un compteur sans donnée sur une période y compte pour 0.


            One meter per inverter: put the other ones here (kWh or Wh, with statistics).
            The day total and each bar are the sum of all the meters; a meter without data
            for a period counts as 0 in it.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: energy
        energie_reseau:
          name: Puissance du réseau · Grid power
          description: >-
            Positive quand la maison achète (importe), négative quand elle vend (exporte) ;
            dans l'autre sens, cochez « Inverser ». Compteur qui donne l'achat et la vente à
            part : l'achat ici, la vente dans le champ suivant.


            Positive when the home buys (imports), negative when it sells (exports); the other
            way round, tick « Invert ». Meter that gives import and export separately: import
            here, export in the next field.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        energie_reseau_export:
          name: Puissance vendue au réseau · Grid export power
          description: >-
            Seulement si le compteur donne la vente à part (positive) : le réseau affiché
            est alors l'achat moins la vente.


            Only if the meter gives the export separately (positive): the grid shown is then
            import minus export.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        energie_reseau_inverse:
          name: Inverser le signe du réseau · Invert the grid sign
          default: false
          selector:
            boolean: {}
        energie_maison:
          name: Consommation de la maison · Home consumption
          description: >-
            Vide : calculée, solaire + réseau − charge de la batterie.


            Empty: computed, solar + grid − battery charge.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        energie_batterie:
          name: Niveau de la batterie · Battery level
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery
        energie_batterie_puissance:
          name: Puissance de la batterie · Battery power
          description: >-
            Positive en charge, négative en décharge ; dans l'autre sens, cochez
            « Inverser ».


            Positive when charging, negative when discharging; the other way round, tick
            « Invert ».
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        energie_batterie_inverse:
          name: Inverser le signe de la batterie · Invert the battery sign
          default: false
          selector:
            boolean: {}
        energie_batterie_temperature:
          name: Température de la batterie · Battery temperature
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
    # Réglage 3.x (ADR-0019) : les cinq places fixes de l'accueil. Lu par un firmware
    # 3.0/3.1, et par un firmware 3.2 tant que la pièce 1 est vide (ADR-0023).
    accueil_3x:
      name: Tuiles de l'accueil (réglage 3.x) · Home tiles (3.x setup)
      icon: mdi:lightbulb-group
      description: >-
        Les cinq places fixes de l'accueil d'avant la 3.2 : PC ou TV, volet, trois lumières.
        Un firmware 3.0 ou 3.1 n'affiche que celles-ci ; un firmware 3.2 les montre tant
        que la pièce 1 est vide (et la tuile PC garde alors son comportement PC + TV).


        The five fixed places of the home page before 3.2: PC or TV, shutter, three lights.
        A 3.0 or 3.1 firmware shows only these; a 3.2 firmware shows them while room 1 is
        empty (and the PC tile then keeps its PC + TV behaviour).
      collapsed: true
      input:
        lumiere_1:
          name: Lumière 1 (tuile 3) · Light 1 (tile 3)
          default: []
          selector:
            entity:
              filter:
                - domain: light
        lumiere_2:
          name: Lumière 2 (tuile 4) · Light 2 (tile 4)
          default: []
          selector:
            entity:
              filter:
                - domain: light
        lumiere_3:
          name: Lumière 3 (tuile 5) · Light 3 (tile 5)
          default: []
          selector:
            entity:
              filter:
                - domain: light
        pc:
          name: PC
          description: >-
            Une prise ou un interrupteur (allumé par la tuile 1), ou un suivi de présence
            (affichage seul). La tuile 1 éteint la TV allumée, sinon allume PC et TV.


            A plug or a switch (turned on by tile 1), or a presence tracker (shown only).
            Tile 1 turns the TV off when it is on, otherwise turns the PC and the TV on.
          default: []
          selector:
            entity:
              filter:
                - domain: [switch, input_boolean, device_tracker, binary_sensor]
        volet:
          name: Volet · Shutter
          description: >-
            Tuile 2. Un volet qui signale sa course (opening/closing) est poussé ici ;
            avec le package volet_serre_tracking.yaml (volet qui ne la signale pas),
            c'est le package qui pousse son état. Laissez ici le volet que suit ce package,
            même s'il est aussi dans une pièce : ses commandes passent alors par le script
            du package et sa tuile montre l'état que le package tient.


            Tile 2. A shutter that reports its travel (opening/closing) is pushed here; with
            the volet_serre_tracking.yaml package (a shutter that does not report it), the
            package pushes its state. Keep here the shutter that package follows, even if it
            is also in a room: its commands then go through the package's script, and its
            tile shows the state the package keeps.
          default: []
          selector:
            entity:
              filter:
                - domain: cover
    avance:
      name: Avancé · Advanced
      icon: mdi:cog
      collapsed: true
      input:
        tablette:
          name: Nom de la tablette dans ESPHome · Tablet name in ESPHome
          description: >-
            Préfixe de ses actions (esphome.<nom>_tab5_maj_…). Ne changer que si l'appareil a
            été renommé.


            Prefix of its actions (esphome.<name>_tab5_maj_…). Change it only if the device
            was renamed.
          default: tab5_ha_hmi
          selector:
            text:

mode: queued
max: 25
