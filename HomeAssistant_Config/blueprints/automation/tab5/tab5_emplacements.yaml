# ============================================================================
# [AI-CONTEXT]
# @file tab5_emplacements.yaml
# @role Blueprint HA (lot 6a de l'audit « ouverture », ADR-0019 ; pièces, ADR-0023) :
#       choisir à la souris les appareils de l'écran du M5Stack Tab5. Une automatisation
#       par tablette. Elle :
#       - décrit les pièces (firmware 3.2 et plus, ADR-0023) : jusqu'à 5 pièces de 5
#         tuiles, une par page de la rangée du bas. Définitions (tab5_maj_tuiles :
#         type, icône, options, complément, nom) à la connexion, au rechargement des
#         automatisations, au démarrage de HA et à la demande des zones ; puis états
#         « tRT|état|valeur|couleur » par tab5_maj_emplacements : tous après les
#         définitions, une tuile quand son appareil change, les capteurs (cap) avec les
#         mesures lentes de 5 minutes ;
#       - pousse l'état des emplacements 3.x (action tab5_maj_emplacements, « clé|état|valeur;… ») :
#         tous à la connexion (esphome.tab5_connected) et au démarrage de HA ; lumières,
#         PC et TV quand ce que montre l'écran change ; les mesures lentes (températures,
#         humidités, pots, batterie) groupées toutes les 5 minutes, celles qui ont changé
#         seulement ;
#       - pousse la clim (tab5_maj_clim) et un volet qui signale sa course (tab5_maj_volet_etat) ;
#       - pousse la clim de chaque tuile cli sans l'option m (ADR-0027) : réglages
#         « crRT|… » (ceux de climr) après les définitions, état « ceRT|… » (les champs de
#         tab5_maj_clim) avec les états des tuiles ;
#       - exécute les commandes de l'écran (événement esphome.tab5_action) : clés 3.x vers
#         l'entité choisie, tuiles (tRT) et pièces (pR) selon le DOMAINE de l'entité de la
#         tuile, jamais sur une entité qu'aucune tuile ne porte ; les commandes du popup
#         clim (« clim » ou « tRT » d'une clim de tuile) par les mêmes branches « Clim : … » ;
#       - répond à la demande des zones (esphome.tab5_zones → tab5_maj_zones) : un
#         emplacement vide, ou dont l'entité n'existe pas, disparaît de l'écran (ADR-0018) ;
#       - section « Météo » (discussion #278, 03/10/2026), facultative : la météo des
#         prévisions, la source de la pluie et celle des vigilances. Remplie, elle est ÉCRITE
#         dans les listes de packages/tab5_meteo_sources.yaml (input_text et input_select),
#         qui restent la seule source lue par les capteurs et les poussées ; une liste changée
#         à la main y revient, avec une notification. Vide : rien n'est écrit, les listes font
#         foi comme avant (déclencheurs meteo_*, variable meteo_a_ecrire) ;
#       - sections « Énergie » (ADR-0028, 04/10/2026, discussion #278 ; trois depuis le
#         07/10/2026 : solaire, réseau et maison, batterie), facultatives : les
#         capteurs d'une installation solaire. Une tuile cap de l'un d'eux prend l'option e
#         (elle ouvre le popup Énergie) ; l'événement esphome.tab5_energie (vue) lance
#         script.tab5_energie (packages/tab5_energie.yaml) avec ces capteurs. Vide : aucune
#         tuile e, et une réponse vide (le popup ouvert par « Aller à l'écran » le dit).
#         Avec la puissance crête (energie_crete, kWc), la production en % de la crête part
#         dans tab5_maj_emplacements (clé solaire, icône du bandeau d'état) : avec tous les
#         états, puis avec les mesures lentes si le capteur a changé ; « nan » sinon.
#         Plusieurs sources (05/10/2026, discussion #278) : energie_solaire_autres et
#         energie_production_autres s'ajoutent aux champs principaux ; puissances et
#         compteurs sont additionnés (energie_solaires, energie_productions).
#       - popup « Température » (ADR-0032, 06/10/2026) : à l'événement esphome.tab5_historique
#         (cle = salon | serre, vue), lance script.tab5_historique (packages/tab5_historique.yaml)
#         avec le capteur de l'emplacement et la case serre_exterieure (« la seconde
#         température est dehors »), qui pousse sa courbe et, pour la seconde, la prévision ;
#       - popup « Musique » (ADR-0050, 10/10/2026) : à l'événement esphome.tab5_lecteur
#         « ouvrir » d'une tuile med sans option t (lecteur = sa clé tRT), lance
#         script.tab5_lecteur_montrer (packages/tab5_lecteur.yaml) avec le media_player de la
#         tuile : le popup montre ce lecteur. Le reste du lecteur (liste, commandes) est au
#         package, pas ici ;
#       - section « Sous l'horloge » (ADR-0031, 06/10/2026), facultative : la rangée sous
#         l'horloge de l'accueil, jusqu'à trois lignes de quatre éléments plus celle des
#         plantes. Définitions « hp » (place des plantes), « hd » (durée d'une ligne) et
#         « hLI » avec celles des tuiles, états « hLI » avec ceux des tuiles (variable
#         rangee, déclencheurs rangee_n). Affichage seul : hors de `tuiles`, donc hors de
#         la liste blanche des commandes.
#       - section « Tuile − / + » (ADR-0033, 06/10/2026), facultative : d'autres appareils
#         que la clim pour les boutons − / + de l'accueil, choisis sur la tablette.
#         Définitions « rN|type|icône|options|lien|min|max|pas|unité|nom » avec celles des
#         tuiles, états « rN|état|valeur » (variables reglables, reglables_bornes,
#         déclencheurs reglable_…) ; la commande « regler » (ou « consigne » pour une
#         clim) ne vise que ces entités-là.
#       - section « Horloge et boutons du haut » (07/10/2026, étendue le 09/10/2026, lot A,
#         ADR-0039), facultative : le tap et l'appui long des trois zones de l'horloge
#         (heures, minutes, date) et des trois boutons en haut à droite de l'accueil. Clé
#         « gestes|c1|…|c12 » de tab5_maj_emplacements (variable gestes, ordre de l'enum
#         Geste) et l'ancienne « appuis|maison|engrenage|manette » (variable appuis, pour un
#         firmware 3.7), avec tous les états ; un code inconnu part en « auto ». Un
#         firmware plus ancien les ignore et garde ses gestes.
#       - section « Caméras » (ADR-0049, 09/10/2026, discussion #278), facultative : les
#         caméras du popup Caméras de la tablette (image fixe rafraîchie, pas de vidéo).
#         À l'événement esphome.tab5_cameras (ouverture du popup, puis toutes les
#         4 minutes et après un échec tant qu'il reste ouvert), pousse tab5_maj_cameras :
#         l'adresse (cameras_adresse, vide = celle que la tablette voit) et
#         « nom|image|pièce|depuis » par caméra, image = entity_picture (jeton qui change
#         toutes les 5 minutes), pièce = area_name (ADR-0057), depuis = heure de
#         l'indisponibilité. Rien tant que le popup est fermé ; aucun package à installer.
# @architecture_constraint Aucun placeholder : ce fichier est générique, il s'importe tel
#       quel. Les clés d'emplacement et les commandes sont celles du firmware
#       (tab5-api-logic.yaml, script tab5_action) ; tests/test_emplacements.py et
#       tests/test_tuiles_blueprint.py comparent (tableaux de l'ADR-0023 compris).
#       Les événements esphome.* n'exigent pas l'option « autoriser l'appareil à effectuer
#       des actions HA » (manager.py de l'intégration ESPHome) : n'importe quel appareil
#       ESPHome peut donc les émettre. Première condition = garde d'origine (modèle
#       tab5-ha-hmi de l'appareil émetteur) ; tests/test_garde_origine.py. Cette garde
#       et « tablette connectée » sont des macros de custom_templates/tab5_tablette.jinja
#       (08/10/2026, audit du 07/10, HA-7) : ce fichier doit être dans config/custom_templates/
#       (archive, HACS) et rechargé AVANT le blueprint, sinon ses conditions échouent.
#       Protocole (ADR-0023, Compatibilité) : la version du projet se lit dans le
#       sw_version de l'appareil (« 3.1.0 (ESPHome 2026.9.0) ») ; 3.2.0 ou plus =
#       tuiles ; en dessous, illisible ou aucune tablette = jamais tab5_maj_tuiles (une
#       action absente est une erreur que continue_on_error n'attrape pas).
# @ai_instruction Les entrées 3.x (lumiere_1..3, pc, volet) gardent leurs noms : des
#       automatisations existantes les référencent. Le bloc « icones » entre les
#       marqueurs est écrit par tools/gen_tuiles_icones.py : ne pas l'éditer à la main.
# ============================================================================
blueprint:
  # Libellés en deux langues, « français · english » (29/09/2026) : un blueprint n'a pas
  # de traductions, et l'écran s'installe aussi hors de France. Les clés des entrées ne
  # changent pas (des automatisations existantes les référencent).
  name: "Tab5 — emplacements de l'écran · screen slots"
  description: >-
    Choisissez les appareils de l'écran du M5Stack Tab5 : jusqu'à cinq pièces de cinq
    appareils, une par page de la rangée du bas (l'accueil, puis les pages atteintes d'un
    glissement). Le nom, l'icône et le type de chaque tuile viennent de Home Assistant.
    Tout est facultatif : ce qui reste vide disparaît de l'écran, avec ses boutons. Une
    seule automatisation par tablette. Un changement part tout de suite ; les mesures
    (températures, plantes, capteurs) sont mises à jour toutes les 5 minutes. Pas à pas :
    [étape 6 de l'installation](https://github.com/Axellum/M5-Tab5-ESPHome-LVGL/blob/main/docs/installation/devices.md#version-française).


    Pick the devices of the M5Stack Tab5 screen: up to five rooms of five devices, one per
    page of the bottom row (the home page, then the pages a swipe reaches). Each tile's
    name, icon and kind come from Home Assistant. Everything is optional: what you leave
    empty disappears from the screen, with its buttons. One automation per tablet. A
    change is sent at once; measurements (temperatures, plants, sensors) are updated every
    5 minutes. Step by step:
    [step 6 of the installation](https://github.com/Axellum/M5-Tab5-ESPHome-LVGL/blob/main/docs/installation/devices.md).
  domain: automation
  author: Axellum
  source_url: https://github.com/Axellum/M5-Tab5-ESPHome-LVGL/blob/main/HomeAssistant_Config/blueprints/automation/tab5/tab5_emplacements.yaml
  homeassistant:
    # Celle que demande le firmware 3.0 (clé API fournie par HA, docs/installation.md).
    # Elle couvre aussi les sélecteurs des pièces : objet à champs (2025.7) et entités
    # réordonnables (2025.8), relevés dans l'historique de homeassistant/helpers/selector.py.
    min_version: 2026.8.0
  input:
    # Pièce n ↔ page de la rangée du bas, dans l'ordre où un glissement les atteint
    # depuis l'accueil (ADR-0023) : R = n − 1.
    piece_1:
      name: "Pièce 1 — accueil (aujourd'hui → J+4) · Room 1 — home (today → day 4)"
      icon: mdi:home
      description: >-
        Les cinq tuiles de l'accueil. Laissée vide, l'accueil garde les appareils de la
        section « Ancien accueil », tout en bas.


        The five tiles of the home page. Left empty, the home page keeps the devices of the
        « Former home page » section, at the bottom.
      input:
        piece_1_nom:
          name: Nom de la pièce · Room name
          description: >-
            Vide = l'aire de ses appareils, s'ils en ont une seule (et au moins la moitié
            l'a), sinon « Pièce 1 ».


            Empty = the area of its devices, if they share one (and at least half have
            it), else « Pièce 1 ».
          default: ""
          selector:
            text:
        piece_1_tuiles:
          name: Appareils · Devices
          description: >-
            Cinq au plus, dans l'ordre des tuiles (de gauche à droite). Lumières,
            interrupteurs, volets, lecteurs, scènes et scripts, capteurs, climatisation.


            Five at most, in tile order (left to right). Lights, switches, covers, media
            players, scenes and scripts, sensors, climate.
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: &domaines_tuiles
                    - light
                    - switch
                    - input_boolean
                    - fan
                    - humidifier
                    - automation
                    - cover
                    - valve
                    - media_player
                    - scene
                    - script
                    - button
                    - input_button
                    - sensor
                    - number
                    - input_number
                    - binary_sensor
                    - device_tracker
                    - person
                    - lock
                    - climate
        piece_1_temperature:
          name: Température de la pièce · Room temperature
          description: >-
            Facultatif. En mode « HA » sur cette pièce, elle remplace la température du
            salon en haut de l'accueil ; un appui long montre son historique.


            Optional. In « HA » mode on this room, it replaces the living-room temperature
            at the top of the home page; a long press shows its history.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        piece_1_humidite:
          name: Humidité de la pièce · Room humidity
          description: >-
            Facultatif, avec la température : elle prend la place de la seconde
            température (serre) et colore l'icône de la pièce.


            Optional, with the temperature: it takes the place of the second temperature
            (greenhouse) and colours the room's icon.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        piece_1_clim:
          name: Climatisation de la pièce · Room climate
          description: >-
            Facultatif, avec la température : les boutons − / + de l'accueil la règlent
            sur cette pièce, et toucher sa consigne ouvre sa fenêtre.


            Optional, with the temperature: the home page's − / + buttons adjust it on this
            room, and touching its setpoint opens its window.
          default: []
          selector:
            entity:
              filter:
                - domain: climate
    piece_2:
      name: "Pièce 2 — J+5 → J+9 · Room 2 — day 5 → 9"
      icon: mdi:home-outline
      description: >-
        Un glissement vers la gauche depuis l'accueil.


