    not_to: *etats_visibles
    id: nabu_2_sortie
  - trigger: state
    entity_id: !input nabu_ligne_3
    to: *etats_visibles
    id: nabu_3
  - trigger: state
    entity_id: !input nabu_ligne_3
    from: *etats_visibles
    not_to: *etats_visibles
    id: nabu_3_sortie
  # <<< déclencheurs du panneau Ok Nabu
  # Tuile − / + au choix (ADR-0033) : l'état (`to: ~`, sans les attributs), puis
  # l'attribut qui porte la valeur réglée tant que l'appareil reste allumé ou en place
  # (not_from / not_to [null] : l'allumage et l'extinction sont vus par « reglable »).
  # Un nombre porte sa valeur dans son état. Jamais sur tous les attributs : un lecteur
  # en change à chaque morceau (titre, position de lecture).
  - trigger: state
    entity_id: !input reglables
    to: ~
    id: reglable
  - trigger: state
    entity_id: !input reglables
    attribute: volume_level
    not_from: [null]
    not_to: [null]
    id: reglable_volume
  - trigger: state
