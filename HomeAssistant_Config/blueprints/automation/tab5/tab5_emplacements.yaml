          name: Autres puissances solaires · Other solar power
          description: >-
            Seulement avec plusieurs onduleurs ou chaînes de panneaux (pv1, pv2…) : les
            capteurs autres que le principal, ajoutés à lui. Un capteur indisponible (la
            nuit par exemple) est ignoré tant qu'un autre a une valeur.


            Only with several inverters or panel strings (pv1, pv2…): the sensors other
            than the main one, added to it. An unavailable sensor (at night for instance) is
            skipped as long as another one has a value.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: power
        energie_crete:
          name: Puissance crête des panneaux · Panel peak power
          description: >-
            En kWc (kilowatts-crête, sur la facture ou l'onduleur), pour tous les panneaux.
            Avec la puissance solaire, une icône en haut à gauche de l'écran montre la
            production par sa couleur (gris la nuit, puis rouge, ambre, bleu, vert). 0 : pas
            d'icône.


            In kWp (kilowatt-peak, on the invoice or the inverter), for all the panels. With
            the solar power, an icon at the top left of the screen shows the production by
            its colour (grey at night, then red, amber, blue, green). 0: no icon.
