          selector:
            number:
              min: 0
              max: 1000
              step: 0.01
              unit_of_measurement: kWc
              mode: box
        energie_production:
          name: Énergie solaire produite · Solar energy produced
          description: >-
            Le compteur principal, en kWh (celui du tableau Énergie de Home Assistant) : le
            total du jour et les barres viennent de son historique. Plusieurs onduleurs : le
