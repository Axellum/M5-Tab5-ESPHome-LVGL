          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy
        energie_production_autres:
          name: Autres énergies solaires produites · Other solar energy produced
          description: >-
            Seulement avec un compteur par onduleur : les compteurs autres que le principal
            (kWh ou Wh), ajoutés à lui. Un compteur sans donnée sur une période y compte
