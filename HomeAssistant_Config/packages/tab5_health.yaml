# ============================================================================
# [AI-CONTEXT]
# @file packages/tab5_health.yaml
# @role Package HA de surveillance santé du Tab5 (aucun nom d'entité à adapter
#       depuis le 28/09/2026 : voir « ENTITÉS DE LA TABLETTE »). Six gardes : instance primaire
#       bloquée OFF, reboot inattendu (nouvel horodatage de démarrage), API ESPHome
#       déconnectée, erreur de rendu d'un template dans une poussée écran,
#       journal des démarrages et coupures envoyé par le Tab5, fichiers HA plus
#       anciens que le firmware (f, 29/09/2026).
# @architecture_constraint L'écran est push-only (cf. docs/decisions/0001) : si
#       les poussées s'arrêtent, l'écran se fige SILENCIEUSEMENT, sans erreur HA
#       visible. Ces automations sont le filet de sécurité côté HA — il n'y a
#       volontairement AUCUN fallback pull côté firmware.
# @ai_warning Jamais de now() brut dans les templates (cf. l'en-tête
#       de packages/tab5_push.yaml) : toute la détection repose sur les fenêtres
#       `for:` des déclencheurs et sur trigger.from_state / trigger.to_state.
# @ai_instruction Les gardes notifient via le script tab5_health_notify
#       (notification persistante + notify.notify) : un seul endroit à adapter.
#       Chaque canal y porte continue_on_error: true : l'échec d'un canal
#       (téléphone hors ligne, service notify mal nommé) ne doit pas empêcher
#       l'autre de partir.
# @install Nécessite l'activation des packages dans configuration.yaml :
#         homeassistant:
#           packages: !include_dir_named packages
#       La garde (d) exige en plus que le journal système émette ses entrées
#       sur le bus (redémarrage de HA nécessaire), et on évite de les
#       enregistrer en base :
#         system_log:
#           fire_event: true
#         recorder:
#           exclude:
#             event_types:
#               - system_log_event
#       Sans `fire_event`, la garde (d) est chargée mais ne se déclenche jamais.
# ============================================================================
#
# ENTITÉS DE LA TABLETTE (piège réel, 06/08/2026) : leurs ids ne dérivent PAS du
# nom d'appareil ESPHome (`tab5-ha-hmi`) mais du nom que Home Assistant a
# enregistré, préfixe de pièce compris (`salon_…` chez l'auteur, pour une partie
# d'entre elles seulement). Une première version visait `sensor.tab5_uptime` /
# `binary_sensor.tab5_ha_hmi_ha_api_status`, qui N'EXISTAIENT PAS : les gardes
# (b) et (c) étaient `on` dans HA et ne pouvaient JAMAIS se déclencher — un
# filet de sécurité muet est pire que pas de filet. Depuis le 28/09/2026
# (ADR-0024), plus aucun id écrit ici : la tablette est trouvée par le modèle de
# son appareil (sensor.tab5_tablette, packages/tab5_reglages.yaml), et les gardes
# se déclenchent sur ses miroirs `sensor.tab5_demarrage` (« Tab5 Uptime ») et
# `binary_sensor.tab5_connectee` (« HA API Status »). Vérification : les attributs
# de « Tab5 · tablette » dans Outils de développement → États.
#
# Reste à adapter si vous réutilisez ce package ailleurs :
#   - notify.notify → votre service réel (ex : notify.mobile_app_votre_telephone)
#     (ici `notify.notify` existe bien et route vers les mobiles déclarés)
#   - input_boolean.is_primary_active est fourni par packages/tab5_push.yaml
#     (depuis le 26/09/2026), avec l'automatisation qui le remet à `on` au
#     démarrage de HA : rien à créer à la main.

script:
  # Canal unique des trois gardes : une notification persistante HA (remplacée si
  # le même notification_id existe déjà) + un push mobile via notify.notify.
  # mode parallel : deux gardes peuvent tomber en même temps (reboot + API).
  tab5_health_notify:
    alias: "Tab5 Santé — notifier (persistante + mobile)"
    mode: parallel
    max: 3
    fields:
      notification_id:
        description: "Clé de la notification persistante (une par garde)"
        required: true
        selector:
          text:
      title:
        description: "Titre de la notification persistante (et du mobile, sauf titre_court)"
        required: true
        selector:
          text:
      message:
        description: "Message détaillé (notification persistante)"
        required: true
        selector:
          text:
            multiline: true
      titre_court:
        description: "Titre du push mobile (défaut : title)"
        required: false
        selector:
          text:
      message_court:
        description: "Message du push mobile (défaut : message)"
        required: false
        selector:
          text:
            multiline: true
    sequence:
      - action: persistent_notification.create
        continue_on_error: true
        data:
          notification_id: "{{ notification_id }}"
          title: "{{ title }}"
          message: "{{ message }}"
      - action: notify.notify
        continue_on_error: true
        data:
          title: "{{ titre_court | default(title, true) }}"
          message: "{{ message_court | default(message, true) }}"

automation:
  # ==========================================================================
  # (a) Instance primaire inactive — is_primary_active OFF depuis plus de 5 min
  # --------------------------------------------------------------------------
  # Ce booléen conditionne toutes les automations de poussée vers l'écran.
  # S'il reste OFF, plus rien n'est envoyé et l'écran se fige sans erreur
  # (incident réel documenté dans docs/troubleshooting.md).
  # NB : le compteur `for:` repart de zéro si HA redémarre pendant la fenêtre —
  # limitation acceptée pour garder l'exemple événementiel (pas de polling).
  # ==========================================================================
  - id: tab5_health_primary_off_5min
    alias: "Tab5 Santé — is_primary_active OFF depuis 5 min"
    description: >-
      Alerte si le booléen qui autorise les poussées vers le Tab5 reste OFF
      plus de 5 minutes : l'écran ne reçoit plus aucune donnée.
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.is_primary_active
        to: "off"
        for: "00:05:00"
    action:
      - action: script.tab5_health_notify
        data:
          notification_id: tab5_health_primary
          title: "⚠️ Tab5 : instance primaire inactive"
          message: >-
            `input_boolean.is_primary_active` est OFF depuis plus de 5 minutes :
            plus aucune donnée n'est poussée vers l'écran (météo, planning et
            capteurs figés). Le remettre sur ON, ou vérifier l'automation qui
            le pilote.
          message_court: >-
            is_primary_active OFF depuis plus de 5 min — l'écran Tab5 ne reçoit
            plus rien.

  # ==========================================================================
  # (b) Reboot inattendu — nouvel horodatage de démarrage du Tab5
  # --------------------------------------------------------------------------
  # « Tab5 Uptime » est l'heure du dernier démarrage (capteur `uptime` de type
  # `timestamp`), publiée UNE fois par démarrage, dès que l'heure est valide.
  # Depuis le 26/09/2026 ; avant, des secondes publiées chaque minute, qui
  # faisaient tourner cette garde 1 440 fois par jour.
  # PRÉCISION ±64 s : l'état d'un capteur ESPHome est un float 32 bits, et un
  # horodatage Unix (≈ 1,79 × 10⁹) y est arrondi au multiple de 128 s le plus
  # proche. Mesuré le 26/09/2026 : reboot à 19:36:29 UTC, publié 19:35:28.
  # Détection sans now() ni polling, via trigger.from_state / to_state :
  #   1. un horodatage valide remplace un autre plus ancien (redémarrage sans
  #      passage par `unavailable`, rare) ;
  #   2. retour d'`unavailable`/`unknown` avec un démarrage postérieur (à 5 min
  #      près : arrondi de 64 s + retard de HA à voir la coupure) au moment où
  #      HA a perdu l'appareil. Une coupure Wi-Fi SANS reboot revient avec
  #      l'ancien démarrage et ne déclenche donc pas, sauf dans les 5 min qui
  #      suivent un démarrage (comme l'ancienne règle « uptime < 300 s ») ; un
  #      NTP en retard ne fait rien manquer (l'état reste `unknown` jusque-là).
  # as_timestamp(…, none) : sûr au boot, capteur pas encore initialisé (cf.
  # règles HA du projet).
  # ==========================================================================
  # REDÉMARRAGE DEMANDÉ (27/09/2026) : une mise à jour (depuis HA ou `esphome
  # upload`), le bouton « Redémarrage Système », un changement de langue ou un reset
  # par l'USB (flasheur web) ne sont pas inattendus. La raison du démarrage arrive
  # avec les autres états à la reconnexion, dans un ordre quelconque : on attend
  # qu'elle soit celle de CE démarrage (elle repasse par `unavailable` à chaque
  # coupure), au plus 1 min. Raisons « demandées » : « Reboot request from … »
  # (ESPHome : esphome.ota, http_request.update, api…), « software via esp_restart »
  # (le firmware, ex. le select Langue), « USB peripheral », et depuis la 3.0.1
  # « First boot after install (…) » : premier démarrage après une installation par
  # l'USB, flash effacée, que le flash termine par un reset du chien de garde RTC
  # (« other watchdogs », fausse alerte à l'installation à neuf du 28/09/2026 ; le
  # firmware ne l'excuse que si sa mémoire vient d'être effacée). Depuis le 06/10/2026
  # (discussion #278) : « Power button or RTC watchdog (…) », un appui sur le bouton
  # d'alimentation (chien de garde sans rapport de plantage, voir Tab5/tab5_journal.cpp) ;
  # un chien de garde AVEC rapport (« Crash, other watchdogs ») notifie toujours. Sans
  # raison fraîche (délai dépassé), on notifie : mieux vaut une alerte de trop qu'un
  # plantage muet.
  - id: tab5_health_unexpected_reboot
    alias: "Tab5 Santé — reboot inattendu (nouveau démarrage)"
    description: >-
      Alerte quand l'heure de démarrage du Tab5 change sans que le redémarrage ait
      été demandé : brownout, crash firmware, coupure d'alimentation. Une mise à
      jour, un redémarrage demandé ou un changement de langue ne notifient pas.
    mode: single
    trigger:
      # Miroir de « Tab5 Uptime » (tab5_reglages.yaml) : mêmes états, même
      # indisponibilité, au même instant.
      - platform: state
        entity_id: sensor.tab5_demarrage
    condition:
      # Précédent état sans attribut `source` : le miroir n'avait pas encore de
      # tablette (HA neuf, tablette ajoutée à l'instant). Comme la création de
      # l'entité d'origine (from_state absent), ce n'est pas un redémarrage.
      - condition: template
        value_template: >-
          {% set to_ts = as_timestamp(trigger.to_state.state, none)
             if trigger.to_state is not none else none %}
          {% set from_ts = as_timestamp(trigger.from_state.state, none)
             if trigger.from_state is not none else none %}
          {% set connue = trigger.from_state is not none
             and (trigger.from_state.attributes.get('source') or '') != '' %}
          {% if to_ts is none or not connue %}false
          {% elif from_ts is not none %}{{ to_ts > from_ts + 60 }}
          {% else %}{{ to_ts >= as_timestamp(trigger.from_state.last_changed) - 300 }}
          {% endif %}
    action:
      # « Raison du redémarrage » de la tablette détectée (sensor.tab5_tablette).
      - wait_template: >-
          {% set r = expand(state_attr('sensor.tab5_tablette', 'raison') or '') | first | default(none) %}
          {{ r is not none and r.state not in ['unavailable', 'unknown']
             and as_timestamp(r.last_changed) >= as_timestamp(trigger.to_state.last_changed) - 60 }}
        timeout: "00:01:00"
        continue_on_timeout: true
      - variables:
          raison: "{{ states(state_attr('sensor.tab5_tablette', 'raison') or '') }}"
          demande: >-
            {{ wait.completed and (raison is match('Reboot request from ')
               or raison is match('First boot after install')
               or raison is match('Power button or RTC watchdog')
               or raison in ['software via esp_restart', 'USB peripheral']) }}
      - condition: template
        value_template: "{{ not demande }}"
      - action: script.tab5_health_notify
        data:
          notification_id: tab5_health_reboot
          title: "⚠️ Tab5 : reboot inattendu détecté"
          titre_court: "⚠️ Tab5 : reboot inattendu"
          message: >-
            Le Tab5 a redémarré le
            {{ as_timestamp(trigger.to_state.state) | timestamp_custom('%d/%m à %H:%M:%S') }}
            (démarrage précédent : {{
              as_timestamp(trigger.from_state.state) | timestamp_custom('%d/%m à %H:%M:%S')
              if as_timestamp(trigger.from_state.state, none) is not none
              else 'inconnu' }}).
            Raison : {{ raison if wait.completed else 'pas encore reçue' }}.
            Vérifier l'alimentation et les logs ESPHome.
          message_court: >-
            Redémarré à
            {{ as_timestamp(trigger.to_state.state) | timestamp_custom('%H:%M:%S') }}
            ({{ raison if wait.completed else 'raison inconnue' }})
            — vérifier alimentation / logs ESPHome.

  # ==========================================================================
  # (c) API ESPHome déconnectée — HA API Status off/unavailable > 2 min
  # --------------------------------------------------------------------------
  # Le capteur `platform: status` passe à `off` quand la connexion API native
  # tombe ; selon les versions/configurations, l'intégration ESPHome peut
  # aussi marquer l'entité `unavailable` quand l'appareil disparaît du réseau.
  # Son miroir `binary_sensor.tab5_connectee` (tab5_reglages.yaml) vaut `off`
  # dans les deux cas, et n'est indisponible que sans tablette dans HA : pas
  # d'alerte sur un HA où la tablette n'est pas encore ajoutée.
  # ==========================================================================
  - id: tab5_health_api_off_2min
    alias: "Tab5 Santé — API ESPHome déconnectée depuis 2 min"
    description: >-
      Alerte si le Tab5 est déconnecté de l'API native Home Assistant depuis
      plus de 2 minutes : toutes les poussées échouent pendant ce temps.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.tab5_connectee
        to: "off"
        for: "00:02:00"
    action:
      - action: script.tab5_health_notify
        data:
          notification_id: tab5_health_api
          title: "⚠️ Tab5 : API Home Assistant déconnectée"
          titre_court: "⚠️ Tab5 : API déconnectée"
          message: >-
            Le Tab5 est déconnecté de l'API native depuis plus de 2 minutes
            (état : {{ states(state_attr('sensor.tab5_tablette', 'api') or '') }}). Vérifier le Wi-Fi,
            l'alimentation, ou si l'appareil a planté. Toutes les poussées
            vers l'écran échouent pendant la coupure.
          message_court: >-
            Tab5 hors ligne (API ESPHome) depuis plus de 2 min — vérifier
            Wi-Fi / alimentation.

  # ==========================================================================
  # (d) Erreur de rendu d'un template dans une poussée vers l'écran
  # --------------------------------------------------------------------------
  # Incident du 18/09/2026 : `fcasts[i].templow` (absent du 15e jour chez
  # Météo-France) levait UndefinedError, le payload des prévisions n'était
  # jamais rendu, et `continue_on_error: true` laissait l'automation finir
  # « réussie » : icônes figées sans aucune alerte. HA journalise pourtant
  # l'erreur en ERROR avant de continuer (helpers/script.py, `log_exceptions`
  # vrai par défaut pour les automations) : « <alias>: Error executing script.
  # … Error rendering data template: … ». On la capte via `system_log_event`
  # (prérequis `system_log: fire_event: true`, cf. @install).
  # Anti-rafale : mode single + délai d'une heure + max_exceeded silent — au
  # plus une notification par heure tant que l'erreur se répète (le push
  # /10 min la reproduit à chaque cycle).
  # ==========================================================================
  - id: tab5_health_template_error
    alias: "Tab5 Santé — erreur de rendu dans une poussée écran"
    description: >-
      Alerte quand une automation ou un script Tab5 journalise « Error
      rendering » : une action de poussée a été sautée en silence par
      continue_on_error, l'écran garde des données périmées.
    mode: single
    max_exceeded: silent
    trigger:
      - platform: event
        event_type: system_log_event
        event_data:
          level: ERROR
    condition:
      - condition: template
        value_template: >-
          {% set m = trigger.event.data.message %}
          {% set msg = ((m | join(' ')) if m is not string else m) | lower %}
          {{ 'tab5' in msg and 'error rendering' in msg }}
    action:
      - action: script.tab5_health_notify
        data:
          notification_id: tab5_health_template
          title: "⚠️ Tab5 : erreur de template dans une poussée écran"
          titre_court: "⚠️ Tab5 : erreur de template"
          message: >-
            {% set m = trigger.event.data.message %}
            {{ ((m | join(' ')) if m is not string else m)[:400] }}
            — l'action concernée a été sautée (continue_on_error) et l'écran
            garde ses anciennes données. Lire la trace de l'automation
            (Paramètres → Automatisations → ⋮ → Traces).
          message_court: >-
            Une poussée vers l'écran Tab5 échoue au rendu d'un template —
            voir la notification persistante.
      - delay: "01:00:00"

  # ==========================================================================
  # (e) Journal des démarrages et des coupures, envoyé par le Tab5
  # --------------------------------------------------------------------------
  # Le firmware (Tab5/tab5_journal.cpp, 26/09/2026) garde ses erreurs, et ses
  # avertissements tant que HA n'est pas connecté, dans une mémoire qui survit
  # aux redémarrages logiciels et aux plantages, avec une copie NVS quand le
  # Wi-Fi manque 90 s (pour survivre à une coupure de courant). À la connexion
  # de HA, il envoie `esphome.tab5_journal` pour : un reset anormal ou un
  # rapport de plantage (PC et pile d'appels des deux cœurs, à décoder avec
  # l'ELF du build), un Wi-Fi absent 90 s ou plus (lien du co-processeur C6,
  # routeur), un démarrage qui n'a jamais joint HA, une erreur (ESPHome ou
  # ESP-IDF) après la connexion à HA, ou HA joint plus de 90 s après le
  # démarrage. Les lignes d'avant la première connexion (lien ESP-Hosted « not
  # yet up », drapeaux d'état d'ESPHome) ne sont que du contexte : un démarrage
  # normal n'envoie rien, une absence de HA avec Wi-Fi présent non plus.
  # Données : raison, demarrages (depuis le dernier envoi), grave (oui/non),
  # lignes (« #n +t s [niveau][étiquette:ligne]: message »).
  # Chaque événement reste en base (table events). Notification persistante à
  # chaque fois (une par envoi, id daté), téléphone seulement si `grave` :
  # reset anormal, plantage, ou Wi-Fi absent 90 s ou plus.
  # ==========================================================================
  - id: tab5_health_journal
    alias: "Tab5 Santé — journal des démarrages et coupures"
    description: >-
      Notifie le journal envoyé par le Tab5 à sa reconnexion : plantage, erreurs
      du lien Wi-Fi (co-processeur C6), avertissements pendant une absence de HA.
    mode: queued
    trigger:
      - platform: event
        event_type: esphome.tab5_journal
    # Garde d'origine (audit sécurité du 30/09/2026) : seulement le journal d'une
    # tablette, reconnue au modèle de son appareil comme dans tab5_evenements.yaml.
    # Sans elle, un autre appareil ESPHome pouvait créer une notification par
    # événement, et une alerte téléphone au titre choisi (`grave: oui`).
    # tests/test_garde_origine.py.
    condition:
      - condition: template
        value_template: >-
          {%- set d = trigger.event.data.device_id | default('', true) | string -%}
          {{ '.' not in d and device_attr(d, 'model') == 'tab5-ha-hmi' }}
    variables:
      raison: "{{ trigger.event.data.raison | default('inconnue') }}"
      demarrages: "{{ trigger.event.data.demarrages | default('?') }}"
      lignes: "{{ trigger.event.data.lignes | default('') }}"
      id_notif: "tab5_journal_{{ as_timestamp(trigger.event.time_fired) | int }}"
      titre: >-
        {{ '⚠️ Tab5 : ' if trigger.event.data.grave == 'oui' else 'Tab5 : ' }}journal
        du démarrage ({{ raison }})
      # Bloc littéral : un bloc replié (>-) collerait le bloc de code sur une ligne.
      corps: |-
        Raison du dernier démarrage : {{ raison }}. Démarrages depuis le dernier journal : {{ demarrages }} (#0 = suite du démarrage déjà signalé).

        ```
        {{ lignes }}
        ```
    action:
      - if:
          - condition: template
            value_template: "{{ trigger.event.data.grave == 'oui' }}"
        then:
          - action: script.tab5_health_notify
            data:
              notification_id: "{{ id_notif }}"
              title: "{{ titre }}"
              titre_court: "⚠️ Tab5 : {{ raison }}"
              message: "{{ corps }}"
              message_court: >-
                {{ demarrages }} démarrage(s) depuis le dernier journal ; détail dans
                la notification persistante de HA.
        else:
          - action: persistent_notification.create
            data:
              notification_id: "{{ id_notif }}"
              title: "{{ titre }}"
              message: "{{ corps }}"

  # ==========================================================================
  # (f) Fichiers HA plus anciens que le firmware (29/09/2026)
  # --------------------------------------------------------------------------
  # Le firmware se met à jour depuis HA (entité « Firmware ») ; ces fichiers,
  # eux, se remplacent à la main (archive tab5_home_assistant.zip de la même
  # release) ou par l'intégration « Tab5 » de HACS (ADR-0035). Une tablette plus récente que ses fichiers (X.Y : une version
  # corrective ne compte pas) peut demander ce qu'ils ne savent pas encore
  # faire, sans aucune erreur visible. Notification
  # persistante seulement (pas de téléphone : rien ne presse), retirée quand
  # les versions se rejoignent.
  # ==========================================================================
  - id: tab5_health_fichiers_ha
    alias: "Tab5 Santé — fichiers HA plus anciens que le firmware"
    description: >-
      Prévient quand la tablette tourne une version plus récente que les fichiers
      Tab5 de Home Assistant (packages, modèles, blueprint).
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.tab5_fichiers_ha_en_retard
        to: ["on", "off"]
        for: "00:01:00"
      - platform: homeassistant
        event: start
    action:
      - if:
          - condition: state
            entity_id: binary_sensor.tab5_fichiers_ha_en_retard
            state: "on"
        then:
          - action: persistent_notification.create
            data:
              notification_id: tab5_fichiers_ha
              title: "Tab5 : fichiers Home Assistant à mettre à jour · HA files to update"
              message: >-
                La tablette est en {{ state_attr('binary_sensor.tab5_fichiers_ha_en_retard', 'tablette') }},
                ses fichiers Home Assistant en {{ state_attr('binary_sensor.tab5_fichiers_ha_en_retard', 'fichiers') }} :
                remplacez-les par ceux de l'archive tab5_home_assistant.zip de la release
                {{ state_attr('binary_sensor.tab5_fichiers_ha_en_retard', 'tablette') }},
                ou installez la mise à jour « Tab5 — fichiers HA » de HACS (Paramètres →
                Mises à jour). Guide : docs/installation/updates.md.


                The tablet runs {{ state_attr('binary_sensor.tab5_fichiers_ha_en_retard', 'tablette') }},
                its Home Assistant files {{ state_attr('binary_sensor.tab5_fichiers_ha_en_retard', 'fichiers') }}:
                replace them with the tab5_home_assistant.zip archive of release
                {{ state_attr('binary_sensor.tab5_fichiers_ha_en_retard', 'tablette') }},
                or install the « Tab5 — fichiers HA · HA files » update from HACS
                (Settings → Updates). Guide: docs/installation/updates.md.
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: tab5_fichiers_ha

template:
  # Version de ces fichiers : « dépôt » dans le dépôt, remplacée par la version de la
  # release dans l'archive tab5_home_assistant.zip (tools/publication/archive_ha.py,
  # marqueur en fin de ligne : une seule ligne le porte, tests/test_publication.py).
  - sensor:
      - name: "Tab5 · version des fichiers HA · HA files version"
        unique_id: tab5_version_des_fichiers_ha
        default_entity_id: sensor.tab5_version_des_fichiers_ha
        icon: mdi:package-variant
        state: "dépôt"  # >>> version de l'archive
    binary_sensor:
      # Allumé quand la tablette tourne une version X.Y (majeure, mineure) plus
      # récente que ces fichiers. Le correctif Z et un suffixe -rc.N ou -dev sont
      # ignorés : une version corrective ne change pas le contrat, et ne demande
      # parfois qu'un seul fichier (la 3.3.1 : le blueprint seul), ce qui laissait
      # ce marqueur à 3.3.0 et l'alerte allumée à tort (audit du 30/09/2026).
      # Éteint si l'une des deux est illisible : fichiers copiés depuis le dépôt
      # (« dépôt »), firmware sans version ; « 3.3.1-dev » est lisible et sert.
      # Rendu par tests/test_version.py.
      - name: "Tab5 · fichiers HA en retard · HA files out of date"
        unique_id: tab5_fichiers_ha_en_retard
        default_entity_id: binary_sensor.tab5_fichiers_ha_en_retard
        device_class: update
        state: >-
          {%- set f = states('sensor.tab5_version_des_fichiers_ha') | regex_findall('^(\\d+)\\.(\\d+)') -%}
          {%- set t = (state_attr('sensor.tab5_tablette', 'version') or '') | regex_findall('^(\\d+)\\.(\\d+)') -%}
          {{ (f | count > 0 and t | count > 0) and (t[0] | map('int') | list) > (f[0] | map('int') | list) }}
        attributes:
          fichiers: "{{ states('sensor.tab5_version_des_fichiers_ha') }}"
          tablette: "{{ state_attr('sensor.tab5_tablette', 'version') or '' }}"
