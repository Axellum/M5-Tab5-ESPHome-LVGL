# ============================================================================
# [AI-CONTEXT]
# @file packages/volet_serre_tracking.yaml
# @role Suivi d'un volet a moteur « aveugle » (Tuya sans retour de position) :
#       helpers d'etat, script central appele par le Tab5, synchro de l'ecran,
#       et suivi des commandes envoyees au volet par d'autres chemins.
# @install Necessite `homeassistant: packages: !include_dir_named packages`.
#
# @architecture_constraint Le moteur ne renvoie NI position NI fin de course. On
#       maintient donc l'etat cote HA : un input_boolean « en mouvement » arme
#       pendant la duree de course mesuree (26 s ici — a chronometrer chez vous),
#       et un input_text qui porte le libelle affiche sur l'ecran.
#       C'est cet input_text que l'automation push envoie au firmware via
#       `esphome.<device>_tab5_maj_volet_etat` (variable `etat_physique`), ce qui
#       arme aussi le wake word local « Stop » cote Tab5.
#
# @ai_warning Ce fichier DOIT rester un dictionnaire YAML valide avec des cles
#       d'integration au premier niveau (`input_boolean:`, `input_text:`,
#       `script:`, `automation:`). Un fichier de `packages/` reduit a des commentaires fait
#       echouer HA au demarrage avec « expected a dictionary » — c'est
#       exactement le piege documente dans HomeAssistant_Config/README.md.
#
# @ai_instruction Remplacer `VOTRE_VOLET` par votre entite cover. La duree 26 s
#       (`delay`) est la course complete mesuree : trop courte, l'ecran repasse
#       a l'arret avant la fin ; trop longue, il reste bloque sur « Mouvement ».
# ============================================================================

input_boolean:
  volet_serre_mouvement:
    name: "Mouvement Volet Serre"
    icon: mdi:arrow-up-down

input_text:
  volet_serre_etat:
    name: "Etat Volet Serre"
    # Repart sur « Ferme » à chaque démarrage : le moteur ne donne pas sa position.
    initial: "Ferme"

script:
  tab5_volet_action:
    alias: "Action Volet Serre depuis Tab5"
    # restart : un nouvel appui pendant la course annule le chrono precedent.
    mode: restart
    fields:
      action:
        description: "open | close | stop"
        example: "open"
        selector:
          select:
            options: ["open", "close", "stop"]
    sequence:
      - choose:
          # ---- STOP : arret immediat, position intermediaire inconnue ----
          - conditions:
              - condition: template
                value_template: "{{ action == 'stop' }}"
            sequence:
              - action: cover.stop_cover
                target:
                  entity_id: cover.VOTRE_VOLET
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.volet_serre_mouvement
              - action: input_text.set_value
                target:
                  entity_id: input_text.volet_serre_etat
                data:
                  value: "Partiel"
          # ---- OPEN : on arme le chrono de course ----
          - conditions:
              - condition: template
                value_template: "{{ action == 'open' }}"
            sequence:
              - action: cover.open_cover
                target:
                  entity_id: cover.VOTRE_VOLET
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.volet_serre_mouvement
              - action: input_text.set_value
                target:
                  entity_id: input_text.volet_serre_etat
                data:
                  value: "En_mouvement"
              # Course complete mesuree (26 s) — a adapter a votre volet.
              - delay:
                  seconds: 26
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.volet_serre_mouvement
              - action: input_text.set_value
                target:
                  entity_id: input_text.volet_serre_etat
                data:
                  value: "Ouvert"
          # ---- CLOSE : idem ----
          - conditions:
              - condition: template
                value_template: "{{ action == 'close' }}"
            sequence:
              - action: cover.close_cover
                target:
                  entity_id: cover.VOTRE_VOLET
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.volet_serre_mouvement
              - action: input_text.set_value
                target:
                  entity_id: input_text.volet_serre_etat
                data:
                  value: "En_mouvement"
              # Course complete mesuree (26 s) — a adapter a votre volet.
              - delay:
                  seconds: 26
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.volet_serre_mouvement
              - action: input_text.set_value
                target:
                  entity_id: input_text.volet_serre_etat
                data:
                  value: "Ferme"

automation:
  # Pousse l'etat du volet vers l'ecran a chaque changement des helpers
  # (script `tab5_push_volet`, packages/tab5_push.yaml).
  - id: tab5_volet_updater
    alias: "Sync Tab5 Volet Serre"
    mode: queued
    trigger:
      - platform: state
        entity_id: input_text.volet_serre_etat
      - platform: state
        entity_id: input_boolean.volet_serre_mouvement
    condition:
      - condition: state
        entity_id: input_boolean.is_primary_active
        state: "on"
    action:
      - action: script.tab5_push_volet

  # Commandes `cover.*` venues d'ailleurs (interface HA, autre integration,
  # automatisations lever/coucher) : met les helpers a jour comme le ferait
  # `tab5_volet_action`, pour que l'ecran suive. Ignore ses propres appels
  # (script `tab5_volet_action` en cours).
  - id: volet_serre_track_direct_cover
    alias: "Volet serre — suivi écran si cover direct"
    description: "Appels cover.open/close/stop hors script Tab5 (UI HA, intégrations) → helpers + sync Tab5"
    mode: restart
    triggers:
      - trigger: event
        event_type: call_service
        event_data:
          domain: cover
    conditions:
      - condition: template
        value_template: >
          {% set eid = trigger.event.data.service_data.entity_id | default('') %}
          {{ eid == 'cover.VOTRE_VOLET' or (eid is iterable and 'cover.VOTRE_VOLET' in eid) }}
      - condition: template
        value_template: "{{ trigger.event.data.service in ['open_cover', 'close_cover', 'stop_cover'] }}"
      - condition: state
        entity_id: script.tab5_volet_action
        state: "off"
    actions:
      - choose:
          # ---- stop_cover ----
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.service == 'stop_cover' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.volet_serre_mouvement
              - action: input_text.set_value
                target:
                  entity_id: input_text.volet_serre_etat
                data:
                  value: "Partiel"
          # ---- open_cover ----
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.service == 'open_cover' }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.volet_serre_mouvement
              - action: input_text.set_value
                target:
                  entity_id: input_text.volet_serre_etat
                data:
                  value: "En_mouvement"
              # Course complete mesuree (26 s) — a adapter a votre volet.
              - delay:
                  seconds: 26
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.volet_serre_mouvement
              - action: input_text.set_value
                target:
                  entity_id: input_text.volet_serre_etat
                data:
                  value: "Ouvert"
          # ---- close_cover ----
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.service == 'close_cover' }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.volet_serre_mouvement
              - action: input_text.set_value
                target:
                  entity_id: input_text.volet_serre_etat
                data:
                  value: "En_mouvement"
              # Course complete mesuree (26 s) — a adapter a votre volet.
              - delay:
                  seconds: 26
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.volet_serre_mouvement
              - action: input_text.set_value
                target:
                  entity_id: input_text.volet_serre_etat
                data:
                  value: "Ferme"

# Vos automatisations lever/coucher de soleil peuvent appeler `cover.*`
# directement : l'automation ci-dessus met l'ecran a jour. Passer par
# `script.tab5_volet_action` reste preferable (un seul chrono de course).
