# ============================================================================
# [AI-CONTEXT]
# @file packages/tab5_meteo_sources.yaml
# @role Adaptateurs météo du Tab5 (lot 4c-2 de l'audit « ouverture », 27/09/2026).
#       Ramènent chaque fournisseur au format que lit la tablette, derrière deux
#       capteurs NORMALISÉS, seuls lus par les poussées (packages/tab5_push.yaml) :
#         - sensor.tab5_pluie_dans_l_heure : état = code « @niveau,début » (phrase
#           de pluie composée par la tablette), attribut `barres` = payload des
#           9 barres « idx|intensité;… » (tab5_maj_pluie_1h_bulk) ;
#         - sensor.tab5_vigilance : état = niveau global Vert / Jaune / Orange /
#           Rouge, attribut `phenomenes` = 11 niveaux séparés par « | » (les 9 cases
#           Météo-France, puis Brouillard et Feux de forêt).
#       La source se choisit dans HA, sans toucher au YAML : input_select
#       « Tab5 · source de la pluie dans l'heure » et « Tab5 · source des vigilances ».
# @sources Vérifiées dans le code de HA 2026.9.3 le 27/09/2026 :
#       - pluie dans l'heure : Météo-France (`sensor.<ville>_next_rain`, créneaux de
#         5 à 10 min) ou OpenWeatherMap en mode « v3.0 » (action
#         `openweathermap.get_minute_forecast`, série à la minute en mm/h, lue dans
#         le cache de l'intégration : aucun appel d'API en plus). Aucune autre
#         intégration officielle n'expose une série exploitable en barres ;
#       - vigilances : Météo-France (`sensor.<dept>_weather_alert`, 9 phénomènes),
#         MeteoAlarm (39 pays européens, `binary_sensor`, UNE seule alerte : la
#         bibliothèque s'arrête à la première ; `on` seulement si elle n'a pas expiré),
#         DWD (Allemagne, intégration `dwd_weather_warnings`, toutes les alertes de la
#         région) ou CAP Alerts (intégration HACS `cap_alerts` : MeteoAlarm, NWS,
#         Canada, services nationaux de l'OMM ; une entité par alerte). Ces deux-là
#         sont lus par la macro de custom_templates/tab5_vigilance.jinja (29/09/2026).
# @detection Depuis le 28/09/2026 (ADR-0024), plus de placeholder : les entités de
#       chaque fournisseur sont TROUVÉES par `sensor.tab5_sources_meteo` (capteur à
#       déclencheurs, plus bas) : Météo-France = la ville de l'entité météo choisie
#       si elle est de Météo-France, sinon la première ville Météo-France, et ses
#       capteurs sur le même appareil (noms anglais fixes de l'intégration :
#       `_next_rain`, `_weather_alert`, `_uv`, `_freeze_chance`, `_snow_chance`) ;
#       OpenWeatherMap = l'entité météo choisie si elle en est, sinon la première ;
#       MeteoAlarm = le binary_sensor signé « Information provided by MeteoAlarm »
#       (attribution fixe de l'intégration ; plateforme YAML sans unique_id, donc
#       absente du registre des entités et d'integration_entities()) ; DWD = les
#       capteurs de l'intégration (la macro lit la première région et écarte les
#       préavis) ; CAP Alerts = tous les capteurs de l'intégration (la macro garde ceux
#       qui portent incident_platform_version, donc les alertes).
#       Sans ces intégrations (données de test du CI), les mêmes formes sont
#       reconnues à leurs attributs.
#       Une source choisie sans entité donne « pas de données » (pluie) ou aucune
#       vigilance ; « Aucune » masque la carte.
# @install `homeassistant: packages: !include_dir_named packages`, puis ce fichier
#       dans config/packages/. Rien à renseigner.
# @ai_warning Les options des input_select sont lues par les modèles ci-dessous :
#       les renommer demande de changer les comparaisons (`source == '…'`).
# ============================================================================

input_select:
  tab5_source_pluie:
    name: "Tab5 · source de la pluie dans l'heure"
    icon: mdi:weather-pouring
    options:
      - "Météo-France"
      - "OpenWeatherMap"
      - "Aucune"
  tab5_source_vigilance:
    name: "Tab5 · source des vigilances"
    icon: mdi:alert-outline
    options:
      - "Météo-France"
      - "MeteoAlarm"
      - "DWD"
      - "CAP Alerts"
      - "Aucune"

# Source des prévisions (lot 4c-3) : mémorise l'entité weather.* choisie dans la
# liste « Tab5 · source des prévisions » (template select plus bas, dont les options
# sont les entités météo présentes). Sans `initial` : HA garde le choix au redémarrage.
# Vide ou entité disparue : la première entité Météo-France, sinon la première
# entité météo (sensor.tab5_sources_meteo, attribut `meteo`).
input_text:
  tab5_meteo_previsions:
    name: "Tab5 · entité météo choisie"
    icon: mdi:weather-partly-cloudy
    max: 255

template:
  # ──────────────────────────────────────────────────────────────────────────
  # Sources détectées — capteur à DÉCLENCHEURS : il parcourt les capteurs de la
  # maison, ce qu'un modèle ordinaire referait à chaque changement de l'un d'eux.
  # Recalculé au démarrage, au rechargement des modèles, à l'ajout ou au
  # renommage d'une entité et au changement de l'entité météo choisie.
  # ──────────────────────────────────────────────────────────────────────────
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: event
        event_type: entity_registry_updated
      - trigger: state
        entity_id: input_text.tab5_meteo_previsions
    variables:
      meteos: "{{ states.weather | map(attribute='entity_id') | list }}"
      choix: "{{ states('input_text.tab5_meteo_previsions') }}"
      mf_meteos: "{{ integration_entities('meteo_france') | select('match', 'weather[.]') | list }}"
      owm_meteos: "{{ integration_entities('openweathermap') | select('match', 'weather[.]') | list }}"
      meteo: "{{ choix if choix in meteos else (mf_meteos | first if mf_meteos else (meteos | first | default(''))) }}"
      mf_ville: "{{ meteo if meteo in mf_meteos else (mf_meteos | first | default('')) }}"
      mf_capteurs: "{{ device_entities(device_id(mf_ville)) | select('match', 'sensor[.]') | list if mf_ville else [] }}"
      # Sans intégration Météo-France, une entité météo et ses capteurs nommés comme
      # elle (weather.<ville>, sensor.<ville>_next_rain…) : ceux du test « HA neuf ».
      meme_nom: "{{ 'sensor.' ~ meteo.split('.', 1)[1] if meteo else '' }}"
      meteoalarm: >-
        {{ states.binary_sensor | selectattr('attributes.attribution', 'defined')
           | selectattr('attributes.attribution', 'eq', 'Information provided by MeteoAlarm')
           | map(attribute='entity_id') | first | default('') }}
      # DWD : les deux capteurs de chaque région (alertes et préavis), dans l'ordre du
      # registre. Leur identifiant suit la langue de HA (vérifié le 29/09/2026 sur un HA
      # en français : sensor.berlin_niveau_d_alerte_actuel / _anticipee) : la macro les
      # distingue par l'urgence de chaque alerte, pas par le nom.
      dwd: >-
        {%- set l = integration_entities('dwd_weather_warnings') | select('match', 'sensor[.]') | list -%}
        {{ l if l else (states.sensor | selectattr('attributes.attribution', 'defined')
                        | selectattr('attributes.attribution', 'eq', 'Data provided by DWD')
                        | selectattr('attributes.warning_count', 'defined')
                        | map(attribute='entity_id') | list) }}
      # CAP Alerts : les alertes vont et viennent (entity_registry_updated relance ce
      # capteur) ; les capteurs de diagnostic de la liste sont écartés par la macro.
      cap: >-
        {%- set l = integration_entities('cap_alerts') | select('match', 'sensor[.]') | list -%}
        {{ l if l else (states.sensor | selectattr('attributes.incident_platform_version', 'defined')
                        | map(attribute='entity_id') | list) }}
    sensor:
      - name: "Tab5 · sources météo"
        unique_id: tab5_sources_meteo
        icon: mdi:weather-cloudy-clock
        state: >-
          {%- set l = (['Météo-France'] if mf_ville else []) + (['OpenWeatherMap'] if owm_meteos else [])
                      + (['MeteoAlarm'] if meteoalarm else []) + (['DWD'] if dwd else [])
                      + (['CAP Alerts'] if cap else []) -%}
          {{ l | join(', ') if l else 'aucune' }}
        attributes:
          meteo: "{{ meteo }}"
          meteo_france: "{{ mf_ville }}"
          mf_pluie: >-
            {%- set l = mf_capteurs | select('match', '.*_next_rain$') | list -%}
            {%- set l = l if l else (integration_entities('meteo_france') | select('match', 'sensor[.].*_next_rain$') | list) -%}
            {{ l | first if l else (meme_nom ~ '_next_rain' if meme_nom and expand(meme_nom ~ '_next_rain') | count > 0 else '') }}
          mf_vigilance: >-
            {%- set l = mf_capteurs | select('match', '.*_weather_alert$') | list -%}
            {%- set l = l if l else (integration_entities('meteo_france') | select('match', 'sensor[.].*_weather_alert$') | list) -%}
            {%- set l = l if l else (states.sensor | map(attribute='entity_id') | select('match', 'sensor[.].*_weather_alert$') | list) -%}
            {{ l | first | default('') }}
          mf_uv: >-
            {%- set l = mf_capteurs | select('match', '.*_uv$') | list -%}
            {{ l | first if l else (meme_nom ~ '_uv' if meme_nom and expand(meme_nom ~ '_uv') | count > 0 else '') }}
          mf_gel: >-
            {%- set l = mf_capteurs | select('match', '.*_freeze_chance$') | list -%}
            {{ l | first if l else (meme_nom ~ '_freeze_chance' if meme_nom and expand(meme_nom ~ '_freeze_chance') | count > 0 else '') }}
          mf_neige: >-
            {%- set l = mf_capteurs | select('match', '.*_snow_chance$') | list -%}
            {{ l | first if l else (meme_nom ~ '_snow_chance' if meme_nom and expand(meme_nom ~ '_snow_chance') | count > 0 else '') }}
          owm: "{{ meteo if meteo in owm_meteos else (owm_meteos | first | default('')) }}"
          meteoalarm: "{{ meteoalarm }}"
          dwd: "{{ dwd }}"
          cap: "{{ cap }}"

  # Relevé de la pluie Météo-France : change à chaque mise à jour du capteur
  # (état et `forecast_time_ref`, toutes les 5 min) et déclenche le capteur de pluie
  # aussitôt, comme le faisait un déclencheur `state:` sur sensor.<ville>_next_rain.
  - sensor:
      - name: "Tab5 · relevé pluie Météo-France"
        unique_id: tab5_releve_pluie_meteo_france
        icon: mdi:weather-rainy
        state: >-
          {%- set e = state_attr('sensor.tab5_sources_meteo', 'mf_pluie') or '' -%}
          {{ (states(e) ~ ' ' ~ (state_attr(e, 'forecast_time_ref') or ''))[:250] if e else 'aucun' }}

  # ──────────────────────────────────────────────────────────────────────────
  # Pluie dans l'heure — capteur à déclencheurs : il peut appeler l'action
  # d'OpenWeatherMap (`actions:`), dont la réponse (`owm`) sert aux modèles.
  # ──────────────────────────────────────────────────────────────────────────
  - triggers:
      # Météo-France : état ET attributs (`1_hour_forecast` change toutes les 5 min).
      - trigger: state
        entity_id: sensor.tab5_releve_pluie_meteo_france
      # Sources détectées de nouveau (entité ajoutée, autre ville choisie).
      - trigger: state
        entity_id: sensor.tab5_sources_meteo
      # OpenWeatherMap : HA l'interroge toutes les 10 min ; 5 min ici pour que les
      # créneaux, calculés par rapport à maintenant, restent justes.
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: input_select.tab5_source_pluie
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    variables:
      mf_pluie: "{{ state_attr('sensor.tab5_sources_meteo', 'mf_pluie') or '' }}"
      owm_meteo: "{{ state_attr('sensor.tab5_sources_meteo', 'owm') or '' }}"
    actions:
      # Garde has_value() : sans l'intégration OpenWeatherMap, l'action n'existe pas
      # et HA lève « Action … not found », que continue_on_error ne rattrape PAS
      # (vérifié le 27/09/2026 : le capteur restait figé, une erreur toutes les
      # 5 min). Sans entité, `owm` reste indéfini → « pas de données ».
      - if:
          - condition: state
            entity_id: input_select.tab5_source_pluie
            state: "OpenWeatherMap"
          - condition: template
            value_template: "{{ has_value(owm_meteo) }}"
        then:
          - action: openweathermap.get_minute_forecast
            target:
              entity_id: "{{ owm_meteo }}"
            response_variable: owm
            continue_on_error: true
    sensor:
      - name: "Tab5 Pluie dans l'heure"
        unique_id: tab5_pluie_dans_l_heure
        icon: mdi:weather-rainy
        # Code « @niveau,début » lu par la tablette (lot 4c) : niveau -1 pas de
        # données, 0 temps sec, 1 à 4 pluie faible à très forte, 5 intensité
        # inconnue ; début = epoch UTC du début de la pluie, 0 s'il pleut déjà ;
        # « @- » = aucune source (phrase et carte masquées). La tablette compose la
        # phrase dans sa langue et décompte les minutes elle-même.
        state: >
          {% set source = states('input_select.tab5_source_pluie') %}
          {% if source == 'Aucune' %}
            @-
          {% elif source == 'OpenWeatherMap' %}
            {# Réponse d'une action d'entité : clé = entity_id (forme courante) ; la
               forme nue { forecast: [...] } est acceptée aussi. Seuils en mm/h :
               < 0,1 sec, < 2,5 faible, < 7,6 modérée, < 50 forte, au-delà très forte
               (classes usuelles « light / moderate / heavy / violent »). #}
            {% set r = (owm.get(owm_meteo, owm) if owm is defined and owm is mapping else {}) %}
            {% set m = r.get('forecast', []) if r is mapping else [] %}
            {% if m | length == 0 %}
              @-1,0
            {% else %}
              {# Minutes déjà passées ignorées : la série vient du cache de l'intégration,
                 rafraîchi toutes les 10 min — une averse finie il y a 5 min y figure
                 encore et donnait « pluie en cours » avec 9 barres vides (banc du
                 29/09/2026). #}
              {% set ns = namespace(debut=0, mmh=0, trouve=false) %}
              {% set depuis = now().timestamp() - 60 %}
              {% for e in m %}
                {% if not ns.trouve and as_timestamp(e.get('datetime'), 0) >= depuis
                      and (e.get('precipitation') | float(0)) >= 0.1 %}
                  {% set ns.trouve = true %}
                  {% set ns.debut = as_timestamp(e.get('datetime'), 0) | int(0) %}
                  {% set ns.mmh = e.get('precipitation') | float(0) %}
                {% endif %}
              {% endfor %}
              {% if not ns.trouve %}
                @0,0
              {% else %}
                {% set n = 1 if ns.mmh < 2.5 else 2 if ns.mmh < 7.6 else 3 if ns.mmh < 50 else 4 %}
                @{{ n }},{{ ns.debut if ns.debut > now().timestamp() else 0 }}
              {% endif %}
            {% endif %}
          {% else %}
            {# Météo-France — même logique que l'ancien capteur « Phrase Prochaine
               Pluie » (vérifiée à l'identique le 27/09/2026, lot 4c-1). #}
            {% set ent = mf_pluie %}
            {% set niv = {'Temps sec': 0, 'Pluie faible': 1, 'Pluie modérée': 2, 'Pluie forte': 3,
                          'Pluie très forte': 4, 'Pluie trés forte': 4} %}
            {% if ent == '' %}
              {# Pas d'intégration Météo-France (choix par défaut de la liste) : aucune
                 source, comme « Aucune » — et non « temps sec » (lot 5b). #}
              @-
            {% elif not has_value(ent) %}
              @0,0
            {% else %}
              {% set next_rain = states(ent) | as_timestamp(default=0) %}
              {% set ref = state_attr(ent, 'forecast_time_ref') | as_timestamp(default=0) %}
              {% set fc = state_attr(ent, '1_hour_forecast') %}
              {% if next_rain > 0 and ref > 0 and fc is not none %}
                {% set actuel = fc.get('0 min', 'Temps sec') %}
                {% if actuel != 'Temps sec' %}
                  @{{ niv.get(actuel, 5) }},0
                {% else %}
                  {% set cle = ((next_rain - ref) / 60) | int(0) ~ ' min' %}
                  @{{ niv.get(fc.get(cle, 'Pluie'), 5) }},{{ next_rain | int(0) }}
                {% endif %}
              {% else %}
                @-1,0
              {% endif %}
            {% endif %}
          {% endif %}
        attributes:
          # 9 barres « idx|intensité; » (idx 0..8 = 0, 5, 10, 15, 20, 25, 35, 45,
          # 55 min). Météo-France : ses libellés, tels quels. OpenWeatherMap : niveau
          # 0 à 4, le plus fort de la fenêtre (mêmes seuils que l'état). Aucune source
          # ou pas de données : 9 barres vides (le panneau Pluie ne tourne pas).
          barres: >
            {% set source = states('input_select.tab5_source_pluie') %}
            {% set ns = namespace(r='') %}
            {% if source == 'Météo-France' and state_attr(mf_pluie, '1_hour_forecast') is mapping %}
              {% set fc = state_attr(mf_pluie, '1_hour_forecast') %}
              {% set cles = ['0 min', '5 min', '10 min', '15 min', '20 min', '25 min', '35 min', '45 min', '55 min'] %}
              {% for k in cles %}{% set ns.r = ns.r ~ loop.index0 ~ '|' ~ fc.get(k, 'Inconnu') ~ ';' %}{% endfor %}
            {% elif source == 'OpenWeatherMap' %}
              {% set r = (owm.get(owm_meteo, owm) if owm is defined and owm is mapping else {}) %}
              {% set m = r.get('forecast', []) if r is mapping else [] %}
              {% set bornes = [0, 5, 10, 15, 20, 25, 35, 45, 55, 60] %}
              {% set maintenant = now().timestamp() %}
              {% for i in range(9) %}
                {% set f = namespace(mx=0) %}
                {% for e in m %}
                  {% set rel = (as_timestamp(e.get('datetime'), 0) - maintenant) / 60 %}
                  {% set p = e.get('precipitation') | float(0) %}
                  {% if rel >= bornes[i] and rel < bornes[i + 1] and p > f.mx %}{% set f.mx = p %}{% endif %}
                {% endfor %}
                {% set n = 0 if f.mx < 0.1 else 1 if f.mx < 2.5 else 2 if f.mx < 7.6 else 3 if f.mx < 50 else 4 %}
                {% set ns.r = ns.r ~ i ~ '|' ~ n ~ ';' %}
              {% endfor %}
            {% else %}
              {% for i in range(9) %}{% set ns.r = ns.r ~ i ~ '|0;' %}{% endfor %}
            {% endif %}
            {{ ns.r }}
          source: "{{ states('input_select.tab5_source_pluie') }}"

  # ──────────────────────────────────────────────────────────────────────────
  # Vigilances — capteur ordinaire : il se recalcule dès qu'une entité lue change.
  # DWD et CAP Alerts passent par la macro tab5_vigilance (custom_templates/), qui
  # rend « global|11 cases » ; l'import est DANS leur branche, pour que Météo-France et
  # MeteoAlarm marchent sans le fichier.
  # ──────────────────────────────────────────────────────────────────────────
  - sensor:
      - name: "Tab5 Vigilance"
        unique_id: tab5_vigilance
        icon: mdi:alert-outline
        # Niveau global : Vert, Jaune, Orange ou Rouge (codes lus par la tablette
        # et par le bandeau info, jamais traduits).
        state: >
          {% set source = states('input_select.tab5_source_vigilance') %}
          {% set alerte = state_attr('sensor.tab5_sources_meteo', 'meteoalarm') or '' %}
          {% if source == 'Météo-France' %}
            {% set v = states(state_attr('sensor.tab5_sources_meteo', 'mf_vigilance') or '') | capitalize %}
            {{ v if v in ['Vert', 'Jaune', 'Orange', 'Rouge'] else 'Vert' }}
          {% elif source == 'MeteoAlarm' and is_state(alerte, 'on') %}
            {# awareness_level « 3; orange; Severe » : 2 jaune, 3 orange, 4 rouge ; un
               1 (vert) alors que l'alerte est active compte comme jaune, comme le fait
               la carte HACS MeteoalarmCard. #}
            {% set n = (state_attr(alerte, 'awareness_level') | string).split(';')[0] | int(0) %}
            {{ 'Rouge' if n >= 4 else 'Orange' if n == 3 else 'Jaune' }}
          {% elif source in ['DWD', 'CAP Alerts'] %}
            {% from 'tab5_vigilance.jinja' import tab5_vigilance %}
            {{ tab5_vigilance(source, state_attr('sensor.tab5_sources_meteo', 'dwd') or [],
                              state_attr('sensor.tab5_sources_meteo', 'cap') or []).split('|')[0] }}
          {% else %}
            Vert
          {% endif %}
        attributes:
          # 11 niveaux séparés par « | », dans l'ordre du payload de la tablette :
          # vent, inondation, orages, pluie-inondation, neige-verglas, grand froid,
          # vagues-submersion, canicule, avalanches, brouillard, feux de forêt.
          phenomenes: >
            {% set source = states('input_select.tab5_source_vigilance') %}
            {% set alerte = state_attr('sensor.tab5_sources_meteo', 'meteoalarm') or '' %}
            {% if source == 'Météo-France' %}
              {% set ent = state_attr('sensor.tab5_sources_meteo', 'mf_vigilance') or '' %}
              {% set ns = namespace(l=[]) %}
              {% for ph in ['Vent violent', 'Inondation', 'Orages', 'Pluie-inondation', 'Neige-verglas',
                            'Grand-froid', 'Vagues-submersion', 'Canicule', 'Avalanches'] %}
                {% set ns.l = ns.l + [state_attr(ent, ph) | default('Vert', true) | capitalize] %}
              {% endfor %}
              {{ (ns.l + ['Vert', 'Vert']) | join('|') }}
            {% elif source == 'MeteoAlarm' and is_state(alerte, 'on') %}
              {# awareness_type « 8; forest-fire » → case de la tablette. Codes
                 MeteoAlarm : 1 vent, 2 neige-verglas, 3 orages, 4 brouillard,
                 5 canicule, 6 grand froid, 7 submersion, 8 feux de forêt,
                 9 avalanches, 10 pluie, 12 inondation, 13 pluie-inondation. #}
              {% set n = (state_attr(alerte, 'awareness_level') | string).split(';')[0] | int(0) %}
              {% set niveau = 'Rouge' if n >= 4 else 'Orange' if n == 3 else 'Jaune' %}
              {% set t = (state_attr(alerte, 'awareness_type') | string).split(';')[0] | int(0) %}
              {% set case = {1: 0, 2: 4, 3: 2, 4: 9, 5: 7, 6: 5, 7: 6, 8: 10, 9: 8, 10: 3, 12: 1, 13: 3} %}
              {% set ns = namespace(l=['Vert'] * 11) %}
              {% if t in case %}
                {% set i = case[t] %}
                {% set ns.l = ns.l[:i] + [niveau] + ns.l[i + 1:] %}
              {% endif %}
              {{ ns.l | join('|') }}
            {% elif source in ['DWD', 'CAP Alerts'] %}
              {% from 'tab5_vigilance.jinja' import tab5_vigilance %}
              {{ tab5_vigilance(source, state_attr('sensor.tab5_sources_meteo', 'dwd') or [],
                                state_attr('sensor.tab5_sources_meteo', 'cap') or []).split('|')[1:] | join('|') }}
            {% else %}
              {{ (['Vert'] * 11) | join('|') }}
            {% endif %}
          source: "{{ states('input_select.tab5_source_vigilance') }}"

  # ──────────────────────────────────────────────────────────────────────────
  # Prévisions et météo du moment (lot 4c-3) : n'importe quelle entité weather.*.
  # ──────────────────────────────────────────────────────────────────────────
  - select:
      - name: "Tab5 · source des prévisions"
        unique_id: tab5_source_previsions
        icon: mdi:weather-partly-cloudy
        options: "{{ states.weather | map(attribute='entity_id') | list }}"
        state: "{{ state_attr('sensor.tab5_meteo', 'entite') }}"
        select_option:
          - action: input_text.set_value
            target:
              entity_id: input_text.tab5_meteo_previsions
            data:
              value: "{{ option }}"
    sensor:
      - name: "Tab5 Météo"
        unique_id: tab5_meteo
        icon: mdi:weather-partly-cloudy
        # État = condition du moment de l'entité choisie (codes HA standard : sunny,
        # rainy… — ce que lit la tablette). Attributs : ce que lisent les poussées.
        # L'entité est relue dans CHAQUE modèle (même ligne en tête) : `this`
        # porterait l'état précédent. Elle vient de sensor.tab5_sources_meteo
        # (attribut `meteo`), recalculé dès que le choix change.
        state: >
          {% set e = state_attr('sensor.tab5_sources_meteo', 'meteo') or '' %}
          {{ states(e) }}
        attributes:
          entite: "{{ state_attr('sensor.tab5_sources_meteo', 'meteo') or '' }}"
          temperature: "{{ state_attr(state_attr('sensor.tab5_sources_meteo', 'meteo') or '', 'temperature') }}"
          humidite: "{{ state_attr(state_attr('sensor.tab5_sources_meteo', 'meteo') or '', 'humidity') }}"
          # Ce que l'entité sait fournir (WeatherEntityFeature : 1 jours, 2 heures,
          # 4 demi-journées, vérifié dans le code de HA 2026.9.3). Les poussées ne
          # demandent jamais un type non géré.
          type_jours: >
            {% set f = state_attr(state_attr('sensor.tab5_sources_meteo', 'meteo') or '', 'supported_features') | int(0) %}
            {{ 'daily' if f | bitwise_and(1) else 'twice_daily' if f | bitwise_and(4) else 'hourly' if f | bitwise_and(2) else '' }}
          heures_ok: >
            {{ (state_attr(state_attr('sensor.tab5_sources_meteo', 'meteo') or '', 'supported_features') | int(0)) | bitwise_and(2) > 0 }}
          # Probabilités : capteurs Météo-France s'ils existent (même ville), sinon ce
          # que donne l'entité choisie. La neige ne sert qu'à l'icône flocon (≥ 5) :
          # sans capteur, 100 si la condition du moment est neigeuse.
          uv: >
            {% set e = state_attr('sensor.tab5_sources_meteo', 'meteo') or '' %}
            {% set u = state_attr('sensor.tab5_sources_meteo', 'mf_uv') or '' %}
            {{ states(u) | int(0) if has_value(u) else state_attr(e, 'uv_index') | int(0) }}
          gel: "{{ states(state_attr('sensor.tab5_sources_meteo', 'mf_gel') or '') | int(0) }}"
          neige: >
            {% set e = state_attr('sensor.tab5_sources_meteo', 'meteo') or '' %}
            {% set n = state_attr('sensor.tab5_sources_meteo', 'mf_neige') or '' %}
            {{ states(n) | int(0) if has_value(n) else (100 if states(e) in ['snowy', 'snowy-rainy'] else 0) }}
