# Snippet à fusionner dans configuration.yaml (section input_text).
#
# ⚠️ ALTERNATIVE au package, PAS un complément. N'utilisez ce snippet que si vous
# ne chargez PAS `packages/tab5_alerts.yaml` — ce package fournit déjà cet
# `input_text`, et déclarer les deux casse le chargement du package avec
# « Integration 'input_text' has duplicate key 'name' » (constaté le 19/07/2026 sur
# une config de production, où les copies dans configuration.yaml / scripts.yaml /
# automations.yaml ont dû être retirées au profit du seul package).
#
# Depuis le 06/10/2026, cette liste n'est plus que l'ancienne mémoire des alertes
# lues : le capteur « Tab5 Alertes » du package la lit une fois, quand il démarre
# sans mémoire, puis ne l'écrit plus. Seul, ce snippet n'affiche aucune alerte : le
# package apporte le capteur, le script `tab5_dismiss_alert` et
# `sensor.tab5_unavailable_count`.
  tab5_alerts_dismissed:
    name: "Tab5 alertes HA ignorées"
    # Sans `initial` : HA la restaure au redémarrage (avec, les alertes lues revenaient).
    max: 255
    icon: mdi:bell-check
