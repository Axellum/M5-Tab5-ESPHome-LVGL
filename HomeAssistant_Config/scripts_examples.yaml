# ============================================================================
# [AI-CONTEXT]
# @file scripts_examples.yaml (généré depuis scripts_tab5.yaml)
# @role Scripts déclenchés PAR le Tab5 (appelés depuis un `homeassistant.service:` dans
#       00ProjetTab/Tab5/tab5-api-logic.yaml ou un `on_short_click:` LVGL), pas l'inverse.
#       Pass-through simple : le device envoie un événement, le script exécute l'action HA
#       correspondante — garde le C++ firmware léger.
#       En fin de fichier, les scripts de POUSSÉE `tab5_push_*` (appelés par les
#       automatisations, 26/09/2026).
# ============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# `tab5_volet_action` a ete DEPLACE dans `packages/volet_serre_tracking.yaml`.
#
# Il vivait ici en double : ce fichier se fusionne a la racine (`script:`) tandis
# que le package se charge via `!include_dir_named packages`, et la doc
# d'installation demande les deux. On obtenait donc deux definitions du meme
# script id, avec en prime des helpers incoherents (`VOTRE_VOLET_MOUVEMENT` ici
# contre `volet_serre_mouvement` la-bas) — le dernier charge gagnait, sans
# avertissement HA.
#
# Le package est desormais la source unique : il porte le script ET les deux
# helpers dont il depend, ce qui est justement ce qu'un package sait faire et
# pas un fichier de scripts nu.
# ─────────────────────────────────────────────────────────────────────────────

allumer_leds:
  alias: "Allumer LEDs depuis Tab5"
  mode: single
  sequence:
    - action: light.toggle
      target:
        entity_id: light.VOTRE_LEDS

# ─────────────────────────────────────────────────────────────────────────────
# Scripts de POUSSÉE vers le Tab5 (26/09/2026) — appelés par les automatisations
# (automations_examples.yaml.example), pas par le Tab5. Chaque bloc n'existe
# qu'ici au lieu d'être recopié dans la poussée complète ET dans son automatisation
# « au changement ». mode: queued — chaque passage relit l'état courant, le dernier
# gagne. tab5_push_alertes lit input_text.tab5_alerts_dismissed et
# sensor.tab5_unavailable_count, fournis par packages/tab5_alerts.yaml.
# ─────────────────────────────────────────────────────────────────────────────

tab5_push_alertes:
  alias: "Tab5 — pousser vigilance, bandeau info et alertes HA"
  description: >-
    Sections 1 (phrase pluie + vigilance Météo-France), 7 (bandeau info) et 7b
    (rotateur d'alertes HA) de l'écran Tab5. Appelé par la poussée complète
    (tab5_ha_hmi_updater) et par la poussée légère (tab5_ha_hmi_alerts_push).
    Les mises à jour, capteurs « problem » et le compte d'indisponibles sont
    relevés UNE fois (variables) au lieu de trois.
  mode: queued
  max: 10
  fields:
    vigilance_seule:
      name: "Vigilance seule"
      description: "Vrai : seulement la phrase pluie + vigilance (rebours minute de la phrase pluie)."
      default: false
      selector:
        boolean:
  sequence:
    - action: esphome.tab5_ha_hmi_tab5_maj_alerte_meteo_france
      continue_on_error: true
      data:
        payload: >-
          {{ states('sensor.phrase_prochaine_pluie') }}|{{ states('sensor.VOTRE_DEPARTEMENT_weather_alert') | capitalize }}|{{ state_attr('sensor.VOTRE_DEPARTEMENT_weather_alert', 'Vent violent') | default('Vert', true) | capitalize }}|{{ state_attr('sensor.VOTRE_DEPARTEMENT_weather_alert', 'Inondation') | default('Vert', true) | capitalize }}|{{ state_attr('sensor.VOTRE_DEPARTEMENT_weather_alert', 'Orages') | default('Vert', true) | capitalize }}|{{ state_attr('sensor.VOTRE_DEPARTEMENT_weather_alert', 'Pluie-inondation') | default('Vert', true) | capitalize }}|{{ state_attr('sensor.VOTRE_DEPARTEMENT_weather_alert', 'Neige-verglas') | default('Vert', true) | capitalize }}|{{ state_attr('sensor.VOTRE_DEPARTEMENT_weather_alert', 'Grand-froid') | default('Vert', true) | capitalize }}|{{ state_attr('sensor.VOTRE_DEPARTEMENT_weather_alert', 'Vagues-submersion') | default('Vert', true) | capitalize }}|{{ state_attr('sensor.VOTRE_DEPARTEMENT_weather_alert', 'Canicule') | default('Vert', true) | capitalize }}|{{ state_attr('sensor.VOTRE_DEPARTEMENT_weather_alert', 'Avalanches') | default('Vert', true) | capitalize }}
    - alias: "Rebours minute de la phrase pluie : pas de relevé santé HA"
      condition: template
      value_template: "{{ not (vigilance_seule | default(false)) }}"
    - variables:
        critiques:
          - update.home_assistant_core_update
          - update.home_assistant_supervisor_update
          - update.home_assistant_operating_system_update
        dismissed: >-
          {{ (states('input_text.tab5_alerts_dismissed') or '').split('|') | reject('equalto', '') | list }}
        alerte: "{{ states('sensor.VOTRE_DEPARTEMENT_weather_alert') }}"
        maj: >-
          {%- set ns = namespace(l=[]) -%}
          {%- for u in states.update | selectattr('state', 'eq', 'on') | rejectattr('entity_id', 'in', dismissed) | sort(attribute='entity_id') -%}
          {%- set ns.l = ns.l + [[u.entity_id, u.attributes.title | default(u.attributes.friendly_name, true)]] -%}
          {%- endfor -%}
          {{- ns.l -}}
        problemes: >-
          {%- set ns = namespace(l=[]) -%}
          {%- for p in states.binary_sensor | selectattr('attributes.device_class', 'defined') | selectattr('attributes.device_class', 'eq', 'problem') | selectattr('state', 'eq', 'on') | rejectattr('entity_id', 'in', dismissed) | sort(attribute='entity_id') -%}
          {%- set ns.l = ns.l + [[p.entity_id, p.attributes.friendly_name | default(p.entity_id, true)]] -%}
          {%- endfor -%}
          {{- ns.l -}}
        indispo: >-
          {{ 0 if 'ha:unavailable' in dismissed else states('sensor.tab5_unavailable_count') | int(0) }}
    - action: esphome.tab5_ha_hmi_tab5_maj_info_texte
      continue_on_error: true
      data:
        texte: >-
          {%- set meteo_key = 'meteo:' ~ (alerte | lower) if alerte in ['Rouge', 'Orange', 'Jaune'] else '' -%}
          {%- set meteo_vu = meteo_key != '' and meteo_key in dismissed -%}
          {%- if alerte in ['Rouge', 'Orange'] and not meteo_vu -%}
          Alerte Météo {{ alerte }} en cours ! Restez prudent.
          {%- else -%}
          {%- set ns = namespace(parts=[]) -%}
          {%- if maj | length == 1 -%}
          {%- set ns.parts = ns.parts + ['1 MAJ · ' ~ maj[0][1]] -%}
          {%- elif maj | length > 1 -%}
          {%- set ns.parts = ns.parts + [(maj | length) ~ ' MAJ'] -%}
          {%- endif -%}
          {%- if problemes | length > 0 -%}
          {%- set ns.parts = ns.parts + [(problemes | length) ~ ' erreur' ~ ('s' if problemes | length > 1 else '')] -%}
          {%- endif -%}
          {%- if indispo > 0 -%}
          {%- set ns.parts = ns.parts + [indispo ~ ' indispo'] -%}
          {%- endif -%}
          {%- set ha_line = ns.parts | join(' · ') -%}
          {%- if alerte == 'Jaune' and not meteo_vu -%}
          {{- 'Vigilance Jaune · ' ~ ha_line if ha_line else 'Vigilance Jaune' -}}
          {%- else -%}
          {{- ha_line -}}
          {%- endif -%}
          {%- endif -%}
        couleur: >-
          {%- if alerte == 'Rouge' -%}Rouge
          {%- elif alerte in ['Orange', 'Jaune'] -%}Orange
          {%- elif problemes | length > 0 or maj | map(attribute=0) | select('in', critiques) | list | length > 0 -%}Rouge
          {%- elif maj | length > 0 -%}Orange
          {%- else -%}Blanc
          {%- endif -%}
        meteo_id: >-
          {{ 'meteo:' ~ (alerte | lower) if alerte in ['Rouge', 'Orange', 'Jaune'] else '' }}
    - action: esphome.tab5_ha_hmi_tab5_maj_alertes_ha_bulk
      continue_on_error: true
      data:
        payload: >-
          {%- set ns = namespace(r=[]) -%}
          {%- for u in maj -%}
          {%- if ns.r | length < 4 -%}
          {%- set ns.r = ns.r + [u[0] ~ '|' ~ ('Rouge' if u[0] in critiques else 'Orange') ~ '|1 MAJ · ' ~ u[1]] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- for p in problemes -%}
          {%- if ns.r | length < 4 -%}
          {%- set ns.r = ns.r + [p[0] ~ '|Rouge|' ~ p[1]] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- if ns.r | length < 4 and indispo > 0 -%}
          {%- set ns.r = ns.r + ['ha:unavailable|Orange|' ~ indispo ~ ' indispo'] -%}
          {%- endif -%}
          {{- ns.r | join(';') -}}

tab5_push_meteo:
  alias: "Tab5 — pousser la météo actuelle et les probabilités"
  description: >-
    Carte météo (condition, température, humidité) et probabilités (UV, gel,
    neige). Appelé au changement (tab5_ha_hmi_meteo_push) et à la (re)connexion
    du Tab5 (tab5_ha_hmi_updater).
  mode: queued
  max: 10
  sequence:
    - action: esphome.tab5_ha_hmi_tab5_maj_meteo_actuelle
      continue_on_error: true
      data:
        condition: "{{ states('weather.VOTRE_VILLE') }}"
        temperature: "{{ state_attr('weather.VOTRE_VILLE', 'temperature') | float(0) }}"
        humidite: "{{ state_attr('weather.VOTRE_VILLE', 'humidity') | float(0) }}"
    - action: esphome.tab5_ha_hmi_tab5_maj_probabilites
      continue_on_error: true
      data:
        uv: "{{ states('sensor.VOTRE_VILLE_uv') | int(0) }}"
        gel: "{{ states('sensor.VOTRE_VILLE_freeze_chance') | int(0) }}"
        neige: "{{ states('sensor.VOTRE_VILLE_snow_chance') | int(0) }}"

tab5_push_clim:
  alias: "Tab5 — pousser l'état de la clim"
  description: >-
    Cible, température, mode, preset, ventilation, oscillation. Appelé au
    changement (tab5_ha_hmi_clim_push) et à la (re)connexion (tab5_ha_hmi_updater).
  mode: queued
  max: 10
  sequence:
    - action: esphome.tab5_ha_hmi_tab5_maj_clim
      continue_on_error: true
      data:
        target: "{{ state_attr('climate.VOTRE_CLIMATISATION', 'temperature') | float(20) }}"
        current: "{{ state_attr('climate.VOTRE_CLIMATISATION', 'current_temperature') | float(20) }}"
        mode: "{{ states('climate.VOTRE_CLIMATISATION') }}"
        preset: "{{ state_attr('climate.VOTRE_CLIMATISATION', 'preset_mode') | default('none', true) }}"
        fan: "{{ state_attr('climate.VOTRE_CLIMATISATION', 'fan_mode') | default('auto', true) }}"
        swing: "{{ state_attr('climate.VOTRE_CLIMATISATION', 'swing_mode') | default('stop', true) }}"

tab5_push_volet:
  alias: "Tab5 — pousser l'état du volet de la serre"
  description: >-
    En_mouvement pendant la course, sinon l'état mémorisé. Appelé au changement
    (tab5_volet_updater) et à la (re)connexion (tab5_ha_hmi_updater).
  mode: queued
  max: 10
  sequence:
    - action: esphome.tab5_ha_hmi_tab5_maj_volet_etat
      continue_on_error: true
      data:
        etat_physique: >-
          {{ 'En_mouvement' if is_state('input_boolean.volet_serre_mouvement', 'on') else states('input_text.volet_serre_etat') }}
