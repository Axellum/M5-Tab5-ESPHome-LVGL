# ============================================================================
# [AI-CONTEXT]
# @file placeholders.example.yaml — MODÈLE public de `placeholders.yaml` (gitignoré).
# @role Table `placeholder: valeur réelle` lue par `tools/render_ha_config.py`,
#       qui produit `HomeAssistant_Config/rendered/` : la copie déployable sur
#       Home Assistant des fichiers publics de ce dossier (packages/, snippets/,
#       custom_templates/). Les fichiers suivis par git ne contiennent QUE les
#       placeholders de la colonne de gauche.
# @install cp HomeAssistant_Config/placeholders.example.yaml HomeAssistant_Config/placeholders.yaml
#          puis remplacer chaque valeur ; `python tools/render_ha_config.py`
#          écrit le rendu, `--check` vérifie qu'aucune valeur réelle n'est
#          retombée dans un fichier public (utilisable en CI, n'affiche jamais
#          la valeur).
# @ai_instruction Une clé = un IDENTIFIANT complet ou un JETON qui apparaît tel
#       quel dans les fichiers publics. Les clés sont remplacées de la plus
#       longue à la plus courte, texte brut, sans notion de YAML.
# ============================================================================

# --- Météo (packages/tab5_push.yaml, packages/tab5_meteo_sources.yaml) ---
# La source de la pluie dans l'heure et celle des vigilances se choisissent ensuite
# dans HA (input_select « Tab5 · source … ») ; une source non installée reste inutilisée.
VOTRE_VILLE: your_city                      # weather.<ville> : source des prévisions PAR DÉFAUT (se change dans HA, « Tab5 · source des prévisions ») ; Météo-France : sensor.<ville>_next_rain / _uv / _snow_chance / _freeze_chance
VOTRE_DEPARTEMENT: "40"                     # Météo-France : sensor.<dept>_weather_alert (numéro de département)
# entity_id COMPLETS : « openweathermap » seul se retrouverait aussi dans le nom de
# l'action openweathermap.get_minute_forecast, et --check y verrait une fuite.
VOTRE_METEO_OWM: weather.openweathermap     # OpenWeatherMap (mode v3.0) : la pluie minute par minute
VOTRE_METEOALARM: binary_sensor.meteoalarm  # MeteoAlarm : vigilances (39 pays européens)

# --- Domotique ---
# Les appareils affichés par l'écran (lumières, clim, PC, TV, téléphone, températures,
# plantes) se choisissent dans le blueprint « Tab5 — emplacements » (lot 6a) : plus de
# placeholder pour eux. Restent ceux des packages suivants.
VOTRE_VOLET: your_roller_shutter                # cover.<…> (package volet_serre_tracking : volet à course simulée)
VOTRE_TV: your_samsung_tv                       # media_player.<…> ET remote.<…> (package tab5_tv : applications)
VOTRE_TELEPHONE: your_phone                     # device_tracker.<…> (allumage/extinction écran)
VOTRE_CAPTEUR_PRESENCE: your_presence_sensor    # binary_sensor.<…>

# --- Calendriers ---
VOTRE_EMAIL_gmail_com: your_email_gmail_com     # calendar.<…> (planning de travail, événements « Travail* »)

# --- Entités dérivées du nom de l'appareil ESPHome ---
# Avec le `friendly_name` livré (« M5Stack Tab5 Home Assistant HMI »), Home
# Assistant nomme les entités `…m5stack_tab5_home_assistant_hmi_…`. Si votre
# appareil a été créé sous un autre nom (ou préfixé par sa pièce, ex. `salon_`),
# mettez ici l'entity_id COMPLET tel qu'il apparaît dans Outils de développement.
number.m5stack_tab5_home_assistant_hmi_rendez_vous_annoncer_avant: number.m5stack_tab5_home_assistant_hmi_rendez_vous_annoncer_avant
binary_sensor.m5stack_tab5_home_assistant_hmi_reveil_en_cours: binary_sensor.m5stack_tab5_home_assistant_hmi_reveil_en_cours
sensor.m5stack_tab5_home_assistant_hmi_tab5_raison_du_redemarrage: sensor.m5stack_tab5_home_assistant_hmi_tab5_raison_du_redemarrage  # garde (b) de tab5_health.yaml
