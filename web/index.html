<script>
  // Avant tout affichage : l'accueil dans la langue du navigateur (français, sinon anglais).
  // replace() : la racine ne reste pas dans l'historique, « Retour » ne la rejoue pas.
  (function () {
    var langues = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    var code = "en";
    for (var i = 0; i < langues.length; i++) {
      var l = String(langues[i]).toLowerCase();
      if (l.indexOf("fr") === 0) { code = "fr"; break; }
      if (l.indexOf("en") === 0) break;
    }
    location.replace(code + "/" + location.hash);
  })();
</script>
