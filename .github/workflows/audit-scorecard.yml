name: Scorecard (contre-épreuve du lot C, ne pas merger)

# Branche temporaire : OpenSSF Scorecard rejoué sur `main` après le lot C (#271),
# même image que l'audit du 30/09/2026 (5,2/10). La PR est fermée sans merge.

on:
  pull_request:
    paths:
      - '.github/workflows/audit-scorecard.yml'

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: OpenSSF Scorecard (image officielle, jeton en lecture seule)
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gcr.io/openssf/scorecard refuse le téléchargement depuis le 01/10/2026
          # (« requires billing ») : ghcr.io, sinon la même version compilée par Go.
          if docker pull -q ghcr.io/ossf/scorecard:v5.5.0; then
            docker run --rm -e GITHUB_AUTH_TOKEN ghcr.io/ossf/scorecard:v5.5.0 \
              --repo="github.com/${{ github.repository }}" --format=json --show-details > scorecard.json || true
          else
            go install github.com/ossf/scorecard/v5@v5.5.0
            "$(go env GOPATH)/bin/scorecard" \
              --repo="github.com/${{ github.repository }}" --format=json --show-details > scorecard.json || true
          fi
          # Branch-Protection et Webhooks illisibles avec le jeton d'Actions (exclus à l'audit) :
          # Scorecard sort en erreur mais écrit le JSON (contrôle à -1).
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("scorecard.json"))
          print(f"## OpenSSF Scorecard : {r['score']} / 10 ({r['date']}, {r['repo']['commit'][:7]})\n")
          print("| Contrôle | Score | Raison |\n|---|---|---|")
          for c in sorted(r["checks"], key=lambda c: c["score"]):
              print(f"| {c['name']} | {c['score']} | {c['reason']} |")
          for c in r["checks"]:
              if c["name"] in ("Vulnerabilities", "Pinned-Dependencies"):
                  print(f"\n### {c['name']}\n")
                  for d in (c.get("details") or [])[:40]:
                      print("- " + d.replace("\n", " ")[:300])
          EOF
