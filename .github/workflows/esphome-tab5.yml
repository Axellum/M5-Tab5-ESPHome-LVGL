name: ESPHome Tab5 Compilation

# Trois jobs :
#   - python : hooks pre-commit (yamllint, BOM, secrets, placeholders HA),
#     tests hôte (pytest = outils + miroirs Python des moteurs + garde-fous
#     Marble/Lode/chrome modal), vrai moteur Go C++ compilé par g++, dry-run du
#     demo pusher. Toujours exécuté, ~1 min.
#   - build  : compilation ESPHome complète (~9 min sur ESP32-P4). Check REQUIS
#     par la protection de `main`, donc le job existe toujours ; il est SAUTÉ
#     (statut « skipped » = succès pour la protection) quand le push/la PR ne
#     touche ni tab5-ha-hmi.yaml, ni Tab5/, ni ce workflow — une typo Markdown
#     ne recompile plus le firmware. `workflow_dispatch` force la compilation.
#   - build-min : la même compilation avec la version PLANCHER d'ESPHome, lue dans
#     `min_version:` de tab5-ha-hmi.yaml (26/09/2026). Sans elle, rien ne vérifiait
#     que le plancher annoncé compile encore : une option apparue après lui
#     passerait inaperçue. Mêmes conditions de déclenchement que `build`, sans
#     artefact. Pour qu'il bloque un merge, l'ajouter aux checks requis de `main`
#     (réglage du dépôt, fait à la main).
#
# `esphome/build-action` sans `version:` tire l'image `latest` : c'est VOULU pour
# `build`. La CI sert de banc d'essai gratuit de la dernière ESPHome (le 25/08/2026
# elle compilait déjà en 2026.8.1, le 16/09/2026 en 2026.9.0, chaque fois avant que
# le projet ne relève son plancher). Une rupture amont se voit ici avant de toucher
# l'appareil ; `build-min` garde l'autre borne. `min_version:` dans tab5-ha-hmi.yaml
# reste la seule contrainte de version, et la seule source du plancher.

# `push` limité à main : une branche avec PR était compilée deux fois (push +
# pull_request), 2 × ~10 min par modification. Une branche sans PR se teste par
# `workflow_dispatch`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouveau commit sur une PR annule la compilation devenue inutile. Jamais sur
# main : chaque merge doit produire son artefact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # Inclus si un motif positif correspond ET aucun motif `!` : une PR
          # qui ne touche que Tab5/README.md ne recompile plus le firmware.
          predicate-quantifier: some-with-excludes
          filters: |
            firmware:
              - 'tab5-ha-hmi.yaml'
              - 'Tab5/**'
              - '.github/workflows/esphome-tab5.yml'
              - '!**/*.md'

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Dépendances des outils
        run: pip install -r requirements-dev.txt
      - name: Correspondances réelles des placeholders HA (secret du dépôt)
        # Sans placeholders.yaml, `render_ha_config.py --check` n'a rien à
        # chercher et répond 0 : le hook passait sans rien vérifier. Le fichier
        # (gitignoré) vient du secret HA_PLACEHOLDERS ; absent (fork, Dependabot),
        # on le dit au lieu de réussir en silence.
        env:
          HA_PLACEHOLDERS: ${{ secrets.HA_PLACEHOLDERS }}
        run: |
          if [ -n "$HA_PLACEHOLDERS" ]; then
            printf '%s\n' "$HA_PLACEHOLDERS" > HomeAssistant_Config/placeholders.yaml
          else
            echo "::warning::Secret HA_PLACEHOLDERS absent : render_ha_config.py --check ne vérifie rien."
          fi
      - name: Hooks pre-commit (yamllint, BOM, secrets, placeholders HA)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Tests hôte (outils, miroirs des moteurs, garde-fous de contenu)
        run: python -m pytest
      - name: Moteur Go C++ (le vrai go_engine.cpp, pas son miroir Python)
        # Le poste de dev n'a qu'un cross-compilateur RISC-V : ce test ne
        # tourne qu'ici. tools/test_go_engine.py reste le miroir exécutable en
        # local — si les deux divergent, c'est ce job qui fait foi.
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I Tab5 -o "$RUNNER_TEMP/test_go_engine" \
            tools/test_go_engine.cpp Tab5/go_engine.cpp
          "$RUNNER_TEMP/test_go_engine"
      - name: Moteur du réveil C++ (alarm_clock.cpp + tab5_core.cpp, horloge simulée)
        # Le réveil doit sonner sans Home Assistant : son moteur est pur (lot 8b)
        # et se teste ici, fuseau Europe/Paris, changements d'heure compris.
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I Tab5 -o "$RUNNER_TEMP/test_alarm_clock" \
            tools/test_alarm_clock.cpp Tab5/alarm_clock.cpp Tab5/tab5_core.cpp
          "$RUNNER_TEMP/test_alarm_clock"
      - name: Payloads du mode démo conformes au contrat firmware
        run: python tools/demo/demo_pusher.py --dry-run

  build:
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Générer user_entities.yaml et secrets.yaml factices pour la CI
        run: |
          cp Tab5/user_entities.example.yaml Tab5/user_entities.yaml
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "ci_dummy_ssid"
          wifi_password: "CI_DUMMY_PASSWORD"
          wifi_ap_password: "CI_DUMMY_AP_PASSWORD"
          api_encryption_key: "26IVe/bZ/aI+T8G96D7aYZlM2EH8QUG8JtsZ50HxaCE="
          EOF
      # ccache est déjà actif dans le conteneur ESPHome (« ccache will be used for
      # faster recompilation » dans le log), mais son cache mourait avec le
      # runner : ~2 000 objets ESP-IDF/LVGL/composants recompilés à chaque run
      # (8 min 20 s sur 10 min le 25/09/2026). build-action transmet CCACHE_DIR
      # au conteneur et monte $HOME au même chemin : un dossier sous
      # runner.temp est donc le même dedans et dehors. Clé unique par run ; la
      # restauration prend le plus récent (celui de la branche, sinon de main).
      - name: Cache ccache (objets de la compilation précédente)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-esp32p4-${{ github.run_id }}
          restore-keys: ccache-esp32p4-
      - name: Configuration ccache
        # CCACHE_DIR exporté pour tout le reste du job (dont les steps internes de
        # build-action). compiler_check = content : la toolchain est réinstallée
        # à chaque run, son mtime ne doit pas invalider tout le cache.
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ccache"
          printf 'max_size = 2G\ncompiler_check = content\n' > "$RUNNER_TEMP/ccache/ccache.conf"
      - name: Build ESPHome Firmware
        id: esphome-build
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: tab5-ha-hmi.yaml
      - name: Statistiques ccache
        # Diagnostic seulement : ne doit jamais faire échouer le check requis.
        # Remises à zéro après lecture : le run suivant n'affiche que les siennes.
        if: always()
        continue-on-error: true
        run: |
          ccache_run() {
            docker run --rm --entrypoint ccache --user "$(id -u):$(id -g)" \
              -e CCACHE_DIR -v "$HOME:$HOME" ghcr.io/esphome/esphome:latest "$@"
          }
          stats=$(ccache_run --show-stats)
          echo "$stats"
          printf '### ccache\n```\n%s\n```\n' "$stats" >> "$GITHUB_STEP_SUMMARY"
          ccache_run --zero-stats >/dev/null
      - name: Upload Artifact
        # Le binaire n'a d'usage que pour un push sur main (ou un lancement
        # manuel) : inutile d'en stocker un par commit de branche.
        # build-action copie ses binaires dans `<nom>-<variante>/`
        # (tab5-ha-hmi-esp32p4/ : .factory.bin, .ota.bin, manifest.json) — pas
        # dans l'ancien `.pioenvs/…/firmware.bin` de PlatformIO, d'où plus aucun
        # artefact du 15/07 au 25/09/2026 sans que la CI ne le signale.
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: tab5-firmware
          path: ${{ steps.esphome-build.outputs.name }}
          if-no-files-found: error
          retention-days: 30

  build-min:
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version plancher (min_version de tab5-ha-hmi.yaml)
        id: plancher
        # Lue dans le fichier plutôt que recopiée ici : relever le plancher dans
        # tab5-ha-hmi.yaml suffit, le job suit.
        run: |
          v=$(sed -n 's/^[[:space:]]*min_version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' tab5-ha-hmi.yaml | head -n 1)
          if [ -z "$v" ]; then
            echo "::error file=tab5-ha-hmi.yaml::min_version introuvable"
            exit 1
          fi
          echo "ESPHome plancher : $v" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Générer user_entities.yaml et secrets.yaml factices pour la CI
        run: |
          cp Tab5/user_entities.example.yaml Tab5/user_entities.yaml
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "ci_dummy_ssid"
          wifi_password: "CI_DUMMY_PASSWORD"
          wifi_ap_password: "CI_DUMMY_AP_PASSWORD"
          api_encryption_key: "26IVe/bZ/aI+T8G96D7aYZlM2EH8QUG8JtsZ50HxaCE="
          EOF
      # Cache ccache à part : les objets d'une autre version d'ESPHome (ou d'ESP-IDF)
      # ne resserviraient pas, et chaque job écraserait le cache de l'autre.
      - name: Cache ccache (objets de la compilation précédente)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-p4-min-${{ steps.plancher.outputs.version }}-${{ github.run_id }}
          restore-keys: ccache-p4-min-${{ steps.plancher.outputs.version }}-
      - name: Configuration ccache
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ccache"
          printf 'max_size = 2G\ncompiler_check = content\n' > "$RUNNER_TEMP/ccache/ccache.conf"
      - name: Build ESPHome Firmware (version plancher)
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: tab5-ha-hmi.yaml
          version: ${{ steps.plancher.outputs.version }}
