name: Site (vitrine et page de flashage)

# ADR-0022, révisée le 28/09/2026. Reconstruit le site GitHub Pages sans rien compiler :
# la vitrine et la page de flashage (web/, branche par défaut), leurs images (docs/images/,
# sous un nom parlant) et les fichiers des releases retenues pour les canaux stable et
# bêta (tools/publication/pages.py). Lancé :
#   - par publication.yml, une fois les fichiers joints à une release ;
#   - à chaque push sur main qui touche le site ;
#   - à la main (workflow_dispatch).
# Avant, seul publication.yml déployait le site : corriger la page recompilait les trois
# firmwares et remplaçait les fichiers de la release.

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/images/**'
      - 'tools/publication/pages.py'
      - '.github/workflows/site.yml'

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      # La page et l'outil viennent de la branche par défaut, même lancé pour un tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Canaux stable et bêta
        id: canaux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # L'API, pas `gh release list` : elle dit quels fichiers sont déjà joints (une
          # release dont publication.yml compile encore les binaires est ignorée). Un
          # fichier en cours d'envoi a l'état « open » : pas encore joint.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | {tagName: .tag_name,
            isPrerelease: .prerelease, isDraft: .draft, publishedAt: .published_at,
            assets: [.assets[] | select(.state == "uploaded") | .name]}]' > releases.json
          python tools/publication/pages.py choisir --releases releases.json | tee -a "$GITHUB_OUTPUT"
      - name: Fichiers des releases retenues
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ steps.canaux.outputs.stable }}
          BETA: ${{ steps.canaux.outputs.beta }}
        run: |
          for tag in $(printf '%s\n' "$STABLE" "$BETA" | sort -u); do
            [[ -n "$tag" ]] || continue
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "assets/$tag" \
              --pattern 'manifest-*.json' --pattern 'tab5-ha-hmi-*.bin'
          done
      - name: Site
        run: |
          python tools/publication/pages.py assembler --web web --assets assets --images docs/images \
            --stable "${{ steps.canaux.outputs.stable }}" --beta "${{ steps.canaux.outputs.beta }}" \
            --sortie site | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: artefact
        with:
          path: site
      # Pas actions/deploy-pages : il donne le commit (GITHUB_SHA) comme version du
      # déploiement, que l'API veut unique. Le 28/09/2026, la release v3.2.0-rc.1 visait le
      # commit que le push de #230 sur main venait de déployer : son déploiement s'est dit
      # réussi, mais le site servi est resté celui du push (canal bêta sur 3.1.0). Mêmes
      # appels à l'API que l'action (jeton OIDC, création, suivi jusqu'à « succeed », 10 min
      # au plus), avec une version propre à chaque run.
      - name: Déploiement
        id: deploiement
        env:
          GH_TOKEN: ${{ github.token }}
          ARTEFACT: ${{ steps.artefact.outputs.artifact_id }}
        run: |
          version="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          jeton=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          reponse=$(jq -n --argjson artefact "$ARTEFACT" --arg version "$version" --arg jeton "$jeton" \
                      '{artifact_id: $artefact, pages_build_version: $version, oidc_token: $jeton}' \
                    | gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" --input -)
          echo "page_url=$(jq -r '.page_url // empty' <<<"$reponse")" >> "$GITHUB_OUTPUT"
          id=$(jq -r '.id // (.status_url // "" | split("/") | last) // empty' <<<"$reponse")
          id=${id:-$version}
          echo "Déploiement $id (version $version)"
          for _ in $(seq 120); do
            sleep 5
            etat=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$id" --jq .status || echo "illisible")
            case "$etat" in
              succeed) echo "Site déployé : $version"; exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "::error title=Site::déploiement $version : $etat"; exit 1 ;;
              *) echo "état : $etat" ;;
            esac
          done
          echo "::error title=Site::déploiement $version toujours en cours après 10 min"
          exit 1
