name: Mesure des invalidations avec LVGL 9.6 (essai, jamais mergé)

# Branche essai/mesure-invalidation-lvgl96 (17/10/2026) : les mêmes fenêtres d'actions que
# mesure-invalidation.yml (tools/mesure/piloter_actions.py, tablette virtuelle 1024×600),
# compilées deux fois sur le même runner : « avant » avec l'ESPHome plancher (LVGL 9.5.0) et
# « lvgl96 » avec ESPHome dev figé à un commit (LVGL 9.6.0 depuis esphome/esphome#20257,
# parcours des flous fait une fois par image et sauté sans flou). Job à part : le firmware du
# Tab5 compilé avec l'image ESPHome dev, pour voir ce que la migration vers LVGL 9.6 casse.

on:
  push:
    branches: [essai/mesure-invalidation-lvgl96]

permissions:
  contents: read

env:
  # ESPHome dev du 17/10/2026 (LVGL 9.6.0).
  ESPHOME_DEV_SHA: 1b4721d4451c7d62dca91e571d4f494b440a66e6

jobs:
  firmware-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: user_entities.yaml du modèle et clé de signature jetable
        run: |
          cp Tab5/user_entities.example.yaml Tab5/user_entities.yaml
          openssl genrsa -out tab5_signature.pem 3072
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: ESPHome dev
        run: bash tools/ci/pip_reessai.sh "esphome @ https://github.com/esphome/esphome/archive/$ESPHOME_DEV_SHA.zip"
      - name: Compiler le firmware de la 7B avec ESPHome dev (LVGL 9.6.0)
        run: |
          esphome version
          set +e
          esphome -s tab5_carte waveshare-7b compile tab5-ha-hmi.yaml > firmware_dev.log 2>&1
          code=$?
          set -e
          {
            echo "## Firmware 7B, ESPHome dev ($ESPHOME_DEV_SHA) : code $code"
            echo
            echo "- erreurs : $(grep -c 'error:' firmware_dev.log || true)"
            echo "- avertissements « deprecated » : $(grep -c 'deprecated' firmware_dev.log || true)"
            echo "- avertissements : $(grep -c 'warning:' firmware_dev.log || true)"
            echo
            echo '```'
            grep -E 'error:|Error|ERROR' firmware_dev.log | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -o 'lvgl[^ ]*9\.[0-9]\.[0-9]' firmware_dev.log | sort -u | head
          tail -n 40 firmware_dev.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: firmware-esphome-dev
          path: firmware_dev.log
          retention-days: 14

  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Version plancher d'ESPHome
        id: version
        run: |
          v=$(sed -n 's/^[[:space:]]*min_version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' tab5-ha-hmi.yaml | head -n 1)
          echo "esphome=$v" >> "$GITHUB_OUTPUT"
      - name: Deux ESPHome (plancher et dev), Pillow, valgrind
        env:
          ESPHOME_VERSION: ${{ steps.version.outputs.esphome }}
        run: |
          python -m venv "$RUNNER_TEMP/v_avant"
          python -m venv "$RUNNER_TEMP/v_lvgl96"
          PATH="$RUNNER_TEMP/v_avant/bin:$PATH" bash tools/ci/pip_reessai.sh "esphome==$ESPHOME_VERSION" pillow
          PATH="$RUNNER_TEMP/v_lvgl96/bin:$PATH" bash tools/ci/pip_reessai.sh \
            "esphome @ https://github.com/esphome/esphome/archive/$ESPHOME_DEV_SHA.zip" pillow
          sudo apt-get update -q && sudo apt-get install -y -q valgrind
      - name: Compiler avec LVGL 9.5.0 puis 9.6.0
        env:
          TZ: Europe/Paris
          TAB5_SAN_LINKFLAGS: ""
          TAB5_SAN_CCFLAGS: "-g -fno-omit-frame-pointer"
        run: |
          mkdir -p programmes
          python tools/mesure/variante_actions.py tab5-mesure.yaml
          for v in avant lvgl96; do
            rm -rf .esphome/build
            touch repere
            set +e
            PATH="$RUNNER_TEMP/v_$v/bin:$PATH" esphome -s tab5_carte waveshare-7b compile tab5-mesure.yaml > "build_$v.log" 2>&1
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then tail -n 120 "build_$v.log"; exit "$code"; fi
            prog=$(find .esphome/build -name program -type f -newer repere | head -n 1)
            cp "$prog" "programmes/$v"
            find .esphome/build -name lv_version.h -path '*lvgl*' -exec grep -H "define LVGL_VERSION_M" {} \; | head -n 3
            echo "$v : $(grep -c 'deprecated' "build_$v.log" || true) avertissements « deprecated »"
          done
      - name: Trois passes natives par variante
        env:
          TZ: Europe/Paris
        run: |
          mkdir -p resultats
          for n in 1 2 3; do
            for v in avant lvgl96; do
              rm -rf "$RUNNER_TEMP/prefs" tools/demo/cle_demo.txt && mkdir -p "$RUNNER_TEMP/prefs" "$RUNNER_TEMP/captures"
              cmd="$RUNNER_TEMP/cmd_${v}_$n"
              MESURE_CMD="$cmd" ESPHOME_PREFDIR="$RUNNER_TEMP/prefs" ESPHOME_SNAPSHOT_DIR="$RUNNER_TEMP/captures" \
                "programmes/$v" > "resultats/natif_${v}_$n.log" 2>&1 &
              pid=$!
              PATH="$RUNNER_TEMP/v_avant/bin:$PATH" python tools/mesure/piloter_actions.py --cmd "$cmd" \
                > "resultats/pilote_natif_${v}_$n.log" 2>&1 || echo "::warning::pilote $v $n en échec"
              kill "$pid" || true
              wait "$pid" 2>/dev/null || true
            done
          done
      - name: Sous callgrind, un profil par fenêtre
        env:
          TZ: Europe/Paris
        run: |
          for v in avant lvgl96; do
            rm -rf "$RUNNER_TEMP/prefs" tools/demo/cle_demo.txt && mkdir -p "$RUNNER_TEMP/prefs" "resultats/callgrind_$v"
            cmd="$RUNNER_TEMP/cmd_cg_$v"
            MESURE_CMD="$cmd" ESPHOME_PREFDIR="$RUNNER_TEMP/prefs" ESPHOME_SNAPSHOT_DIR="$RUNNER_TEMP/captures" \
              valgrind --tool=callgrind --instr-atstart=no --callgrind-out-file="resultats/callgrind_$v/cg.out.%p" \
              "programmes/$v" > "resultats/callgrind_$v.log" 2>&1 &
            pid=$!
            PATH="$RUNNER_TEMP/v_avant/bin:$PATH" python tools/mesure/piloter_actions.py --cmd "$cmd" --facteur 5 \
              > "resultats/pilote_callgrind_$v.log" 2>&1 || echo "::warning::pilote callgrind $v en échec"
            sleep 2
            kill "$pid" || true
            wait "$pid" 2>/dev/null || true
          done
      - name: Bilan
        if: always()
        run: |
          {
            echo "## Invalidations, LVGL 9.5.0 (avant) contre 9.6.0 (lvgl96), tablette virtuelle 1024×600"
            python tools/mesure/bilan_actions.py resultats
          } >> "$GITHUB_STEP_SUMMARY"
          for v in avant lvgl96; do
            for f in resultats/callgrind_$v/cg.out.*; do
              [ -f "$f" ] || continue
              nom=$(sed -n 's/^desc: Trigger: Client Request: //p' "$f" | head -n 1)
              [ -n "$nom" ] || continue
              callgrind_annotate --inclusive=yes "$f" 2>/dev/null | head -n 80 > "resultats/callgrind_$v/incl_$nom.txt" || true
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mesure-invalidation-lvgl96
          path: |
            resultats/
            build_*.log
          retention-days: 14
