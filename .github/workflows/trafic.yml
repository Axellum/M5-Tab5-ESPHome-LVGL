name: Trafic du dépôt (archive au-delà de 14 jours)

# GitHub ne garde que 14 jours de trafic (vues, clones, sites d'origine, pages vues).
# Une fois par jour, github-repo-stats en relève un instantané et le range, avec un rapport
# HTML/PDF couvrant toute la période relevée, dans la branche `github-repo-stats` (branche
# orpheline, sans le code du dépôt). Rien n'est publié : le rapport reste dans la branche.
#
# Jeton : le GITHUB_TOKEN des Actions n'a pas accès au trafic (permission « Administration »).
# Secret `GHRS_GITHUB_API_TOKEN` = jeton à grain fin limité à ce dépôt, « Administration »
# en lecture (trafic) et « Contents » en lecture/écriture (commits dans la branche de données).
# L'action tourne dans un conteneur tiers qui reçoit ce jeton : elle est figée par SHA.
#
# Les commits de la branche de données ne relancent aucun autre workflow (tous limités à main
# ou aux PR).

on:
  schedule:
    # Fin de journée UTC (conseillé par l'action), hors de l'heure pile, très chargée.
    - cron: '43 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trafic
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Branche RELEASE de l'action = v1.4.2 + image de base figée par SHA.
      - uses: jgehrcke/github-repo-stats@d80572c9029636cd0e97e3a79e7a9c293bea3b02
        with:
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
