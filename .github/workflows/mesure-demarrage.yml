name: Mesure du démarrage avant / après (essai, jamais mergé)

# Branche essai/mesure-demarrage-avant-apres (16/10/2026) : la tablette virtuelle
# chronométrée bande par bande (tools/mesure/variante_demarrage.py), compilée deux fois sur le
# même runner : « avant » = les trois fichiers du correctif repris de origin/main, « après » =
# la branche fix/demarrage-labels-lvgl telle quelle. Trois démarrages normaux chacune, puis
# chacune sous callgrind avec un profil par bande (tools/mesure/bilan_callgrind.py).

on:
  push:
    branches: [essai/mesure-demarrage-avant-apres]

permissions:
  contents: read

jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Version plancher d'ESPHome
        id: version
        run: |
          v=$(sed -n 's/^[[:space:]]*min_version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' tab5-ha-hmi.yaml | head -n 1)
          echo "esphome=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: pip-esphome-${{ steps.version.outputs.esphome }}-py3.13
      - name: ESPHome, Pillow, valgrind
        env:
          ESPHOME_VERSION: ${{ steps.version.outputs.esphome }}
        run: |
          bash tools/ci/pip_reessai.sh "esphome==$ESPHOME_VERSION" pillow
          sudo apt-get update -q && sudo apt-get install -y -q valgrind
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.platformio
          key: pio-host-${{ steps.version.outputs.esphome }}
      - name: Compiler avant (fichiers de main) et après (correctif)
        env:
          TZ: Europe/Paris
          TAB5_SAN_LINKFLAGS: ""
          TAB5_SAN_CCFLAGS: "-g -fno-omit-frame-pointer"
        run: |
          FICHIERS="Tab5/ecran/tab5_demarrage.cpp Tab5/socle/tab5_demarrage.h Tab5/paquets/tab5-styles.yaml"
          mkdir -p programmes
          for v in avant apres; do
            if [ "$v" = avant ]; then git checkout origin/main -- $FICHIERS; else git checkout HEAD -- $FICHIERS; fi
            echo "--- $v"; git diff --stat HEAD -- $FICHIERS
            python tools/mesure/variante_demarrage.py tab5-mesure.yaml
            set +e
            esphome compile tab5-mesure.yaml > "build_$v.log" 2>&1
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then tail -n 80 "build_$v.log"; exit "$code"; fi
            prog=$(find .esphome/build/tab5-rendu -name program -type f | head -n 1)
            cp "$prog" "programmes/$v"
            echo "$v : appels de demarrage_preparer_lvgl dans main.cpp = $(grep -c demarrage_preparer_lvgl .esphome/build/tab5-rendu/src/main.cpp || true)"
          done
      - name: Trois démarrages normaux par variante
        env:
          TZ: Europe/Paris
        run: |
          mkdir -p resultats
          for v in avant apres; do
            for n in 1 2 3; do
              rm -rf "$RUNNER_TEMP/prefs" && mkdir -p "$RUNNER_TEMP/prefs" "$RUNNER_TEMP/captures"
              ESPHOME_PREFDIR="$RUNNER_TEMP/prefs" ESPHOME_SNAPSHOT_DIR="$RUNNER_TEMP/captures" \
                "programmes/$v" > "resultats/natif_${v}_$n.log" 2>&1 &
              pid=$!
              for _ in $(seq 1 120); do grep -q 'boucle_1s' "resultats/natif_${v}_$n.log" && break; sleep 0.5; done
              kill "$pid" || true
              wait "$pid" 2>/dev/null || true
            done
          done
          {
            echo "## Démarrages normaux (ms depuis les constructeurs)"
            echo '```'
            for v in avant apres; do for n in 1 2 3; do
              echo "--- $v $n"; grep '\[mesure\]' "resultats/natif_${v}_$n.log"
            done; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sous callgrind, un profil par bande
        env:
          TZ: Europe/Paris
        run: |
          for v in avant apres; do
            rm -rf "$RUNNER_TEMP/prefs" && mkdir -p "$RUNNER_TEMP/prefs" "resultats/callgrind_$v"
            ESPHOME_PREFDIR="$RUNNER_TEMP/prefs" ESPHOME_SNAPSHOT_DIR="$RUNNER_TEMP/captures" \
              valgrind --tool=callgrind --callgrind-out-file="resultats/callgrind_$v/cg.out.%p" "programmes/$v" \
              > "resultats/callgrind_$v.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 2400); do grep -q 'boucle_1s' "resultats/callgrind_$v.log" && break; sleep 1; done
            sleep 2
            kill "$pid" || true
            wait "$pid" 2>/dev/null || true
          done
          {
            echo "## Instructions par bande (callgrind)"
            python tools/mesure/bilan_callgrind.py resultats/callgrind_avant resultats/callgrind_apres
          } >> "$GITHUB_STEP_SUMMARY"
          for v in avant apres; do
            for f in resultats/callgrind_$v/cg.out.*; do
              nom=$(sed -n 's/^desc: Trigger: Client Request: //p' "$f" | head -n 1)
              [ -n "$nom" ] || nom=$(basename "$f")
              callgrind_annotate --inclusive=yes "$f" 2>/dev/null | head -n 70 > "resultats/callgrind_$v/incl_$nom.txt" || true
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mesure-demarrage-avant-apres
          path: |
            resultats/
            build_*.log
          retention-days: 14
