# [AI-CONTEXT]
# @file tab5-scripts.yaml
# @role Scripts ESPHome pour actions complexes (ex: toggle de lampes avec debounce).
# @ai_instruction Garder les scripts simples. La logique d'affichage pure doit aller dans le C++.
# ============================================================================
# tab5-scripts.yaml — Scripts ESPHome reutilisables (sequences temporisees,
# debounce). Preferer un script ici a un delay:+action duplique inline.
script:
  # Ferme TOUS les jeux ouverts. Un seul overlay de jeu peut vivre à la fois :
  # sans ça, ouvrir un jeu par-dessus un autre laisse le timer du précédent
  # tourner et son overlay sous celui du nouveau.
  # [AI-CONTEXT] Point d'entrée UNIQUE : le sélecteur arcade appelle ce script
  # avant chaque ouverture, au lieu de recopier la liste dans 8 lambdas (c'était
  # la source des oublis — Trivia manquait dans 5 cartes sur 8).
  # Toute nouvelle console DOIT être ajoutée ici.
  - id: tab5_games_close_all
    mode: single
    then:
      - lambda: |-
          if (Marble::is_open())   Marble::close();
          if (Arkanoid::is_open()) Arkanoid::close();
          if (Lode::is_open())     Lode::close();
          if (Go::is_open())       Go::close();
          if (Trivia::is_open())   Trivia::close();
          if (Draughts::is_open()) Draughts::close();
          if (Chess::is_open())    Chess::close();
          // « Neon Apron » en dernier : sa fermeture restaure la rotation 270 du
          // dashboard. Si un jour un autre jeu touche à l'orientation, il devra
          // lui aussi fermer après, pour que le dernier mot revienne au paysage.
          if (Pinball::is_open())  Pinball::close();

  # Ouvre le jeu « Fil d'Or » (page LVGL dédiée, marble_game.cpp).
  # Script unique appelé par le sélecteur arcade : la construction de Marble::UI
  # ne vit qu'à un seul endroit. `id(...)` n'étant utilisable que dans une lambda,
  # les pointeurs LVGL et les polices sont injectés ici plutôt que dans le C++.
  - id: tab5_marble_open
    mode: single
    then:
      - lambda: |-
          Marble::UI ui;
          ui.root    = id(marble_root);
          ui.field   = id(marble_field);
          ui.hud     = id(marble_hud);
          ui.panel   = id(marble_panel);
          ui.lvgl    = id(tab5_lvgl);
          ui.home_idx = 1;  // page_arcade
          ui.f_small = id(roboto_22);
          ui.f_mid   = id(roboto_32_b);
          ui.f_big   = id(roboto_45_b);
          Marble::open(ui);

  # Ouvre le jeu « Arcanoïde » (casse-briques rétro, arkanoid_game.cpp).
  # Même pattern que Marble : script unique, pointeurs LVGL injectés en lambda.
  - id: tab5_arkanoid_open
    mode: single
    then:
      - lambda: |-
          Arkanoid::UI ui;
          ui.root    = id(arkanoid_root);
          ui.field   = id(arkanoid_field);
          ui.hud     = id(arkanoid_hud);
          ui.panel   = id(arkanoid_panel);
          ui.lvgl    = id(tab5_lvgl);
          ui.home_idx = 1;  // page_arcade
          ui.f_small = id(roboto_22);
          ui.f_mid   = id(roboto_32_b);
          ui.f_big   = id(roboto_45_b);
          Arkanoid::open(ui);

  # Ouvre le jeu « Coureur d'Or » (Lode Runner, lode_game.cpp).
  # Même pattern : script unique, pointeurs LVGL injectés en lambda.
  - id: tab5_lode_open
    mode: single
    then:
      - lambda: |-
          Lode::UI ui;
          ui.root    = id(lode_root);
          ui.field   = id(lode_field);
          ui.hud     = id(lode_hud);
          ui.panel   = id(lode_panel);
          ui.pad     = id(lode_pad);
          ui.lvgl    = id(tab5_lvgl);
          ui.home_idx = 1;  // page_arcade
          ui.f_small = id(roboto_22);
          ui.f_mid   = id(roboto_32_b);
          ui.f_big   = id(roboto_45_b);
          auto t = id(sntp_time).now();
          if (t.is_valid()) ui.epoch = t.timestamp;
          Lode::open(ui);

  # Ouvre le jeu « Go Tab » (Go 9×9 / 13×13 / 19×19).
  # f_mono sert à la liste des coups du panneau latéral : en police
  # proportionnelle, « A1 » et « T19 » ne s'alignent pas et la colonne danse.
  - id: tab5_go_open
    mode: single
    then:
      - lambda: |-
          Go::UI ui;
          ui.root    = id(go_root);
          ui.field   = id(go_field);
          ui.hud     = id(go_hud);
          ui.panel   = id(go_panel);
          ui.lvgl    = id(tab5_lvgl);
          ui.home_idx = 1;  // page_arcade
          ui.f_small = id(roboto_22);
          ui.f_mid   = id(roboto_32_b);
          ui.f_big   = id(roboto_45_b);
          ui.f_mono  = id(roboto_mono_24);
          Go::open(ui);

  # Ouvre le jeu « Trial Poursuite » (Trivial Pursuit rétro-salon, trivia_game.cpp).
  # Même pattern : script unique, pointeurs LVGL injectés en lambda.
  - id: tab5_trivia_open
    mode: single
    then:
      - lambda: |-
          Trivia::UI ui;
          ui.root    = id(trivia_root);
          ui.hud     = id(trivia_hud);
          ui.board   = id(trivia_board);
          ui.panel   = id(trivia_panel);
          ui.lvgl    = id(tab5_lvgl);
          ui.home_idx = 1;  // page_arcade
          ui.f_small = id(roboto_22);
          ui.f_mid   = id(roboto_32_b);
          ui.f_big   = id(roboto_45_b);
          Trivia::open(ui);

  # Ouvre le jeu « Roi Noir » (échiquier FIDE + IA embarquée, chess_game.cpp).
  # Même pattern que Marble : script unique, pointeurs LVGL injectés en lambda.
  # Le 5e calque (menus) est créé en C++, il n'y a donc rien à injecter pour lui.
  - id: tab5_chess_open
    mode: single
    then:
      - lambda: |-
          Chess::UI ui;
          ui.root    = id(chess_root);
          ui.hud     = id(chess_hud);
          ui.board   = id(chess_board);
          ui.panel   = id(chess_panel);
          ui.lvgl    = id(tab5_lvgl);
          ui.home_idx = 1;  // page_arcade
          ui.f_small = id(roboto_22);
          ui.f_mid   = id(roboto_32_b);
          ui.f_big   = id(roboto_45_b);
          // Figurines d'échecs : police dédiée (Tab5/ChessPieces.ttf, 12 glyphes).
          ui.f_piece = id(chess_pieces_80);
          Chess::open(ui);

  # Ouvre le jeu « Dames » (draughts_game.cpp).
  # Même pattern que Marble : script unique, pointeurs LVGL injectés en lambda.
  - id: tab5_draughts_open
    mode: single
    then:
      - lambda: |-
          Draughts::UI ui;
          ui.root    = id(draughts_root);
          ui.field   = id(draughts_field);
          ui.hud     = id(draughts_hud);
          ui.panel   = id(draughts_panel);
          ui.lvgl    = id(tab5_lvgl);
          ui.home_idx = 1;  // page_arcade
          ui.f_small = id(roboto_22);
          ui.f_mid   = id(roboto_32_b);
          ui.f_big   = id(roboto_45_b);
          Draughts::open(ui);

  # Ouvre le flipper « Neon Apron » (pinball_game.cpp).
  # Même pattern que Marble, avec DEUX injections en plus :
  #   - f_score / f_led : le fronton imite un afficheur de borne. roboto_55_b ne
  #     contient QUE les chiffres et l'espace (cf. tab5-styles.yaml) — parfait
  #     pour le score, inutilisable pour du texte ; roboto_mono_24 sert aux
  #     libellés à chasse fixe (« BILLE 2 / 3 », « RECORD 1 250 000 »).
  #   - ui.lvgl : pointeur sur le LvglComponent. C'est LUI qui permet à
  #     Pinball::open() de basculer l'écran en portrait 720×1280 et à
  #     Pinball::close() de restaurer le paysage 270°. Sans lui, le jeu
  #     s'ouvrirait couché sur le côté. Voir [AI-CONTEXT] ORIENTATION dans
  #     pinball_game.cpp.
  - id: tab5_pinball_open
    mode: single
    then:
      - lambda: |-
          Pinball::UI ui;
          ui.root    = id(pinball_root);
          ui.field   = id(pinball_field);
          ui.hud     = id(pinball_hud);
          ui.panel   = id(pinball_panel);
          ui.lvgl    = id(tab5_lvgl);
          ui.home_idx = 1;  // page_arcade
          ui.f_small = id(roboto_22);
          ui.f_mid   = id(roboto_32_b);
          ui.f_big   = id(roboto_45_b);
          ui.f_score = id(roboto_55_b);
          ui.f_led   = id(roboto_mono_24);
          Pinball::open(ui);

  # Ouvre le sélecteur arcade (page_arcade). Point d'entrée unique depuis le
  # dashboard (tap sur température serre). Ferme d'abord tout jeu en cours.
  - id: tab5_arcade_open
    mode: single
    then:
      - script.execute: tab5_games_close_all
      - lvgl.page.show: page_arcade

  # Active le wake word interne « Stop » (désactivé par défaut par ESPHome, 2e modèle).
  # Uniquement via tab5_maj_volet_etat (push HA) — pas d'état optimiste au tap écran.
  - id: tab5_volet_end_movement
    mode: restart
    then:
      - globals.set:
          id: volet_en_mouvement
          value: 'false'
      - if:
          condition:
            lambda: 'return !id(va_stop_armed);'
          then:
            - micro_wake_word.disable_model:
                id: stop

  # Stop vocal local : annule un pipeline Okay Nabu en cours + TTS court (évite « aucune réponse reçue »).
  - id: tab5_volet_stop_voice_feedback
    mode: restart
    then:
      - voice_assistant.stop:
          id: va
      - homeassistant.service:
          service: assist_satellite.announce
          data:
            entity_id: assist_satellite.m5stack_tab5_home_assistant_hmi_satellite_assist
            message: "Volet arrêté."

  # Arme le flag d'interruption (Stop vocal local ne reçoit pas le micro pendant pipeline HA).
  - id: tab5_vocal_arm_stop
    mode: restart
    then:
      - globals.set:
          id: va_stop_armed
          value: 'true'
      # Une conversation ne touche pas la dalle : sans ça, le retour automatique
      # à l'écran principal (interval en bas de ce fichier) fermerait le popup
      # Assistant en pleine réponse. Appelé sur on_listening / on_stt_end /
      # on_tts_start, donc à chaque étape du pipeline.
      - lambda: 'ui_mark_activity();'

  - id: tab5_vocal_disarm_stop
    mode: restart
    then:
      - globals.set:
          id: va_stop_armed
          value: 'false'
      # Fin de pipeline (on_end / on_error) : les 45 s d'inactivité comptent à
      # partir de la fin de la réponse parlée, pas de son début.
      - lambda: 'ui_mark_activity();'
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - if:
                condition:
                  lambda: 'return !id(volet_en_mouvement);'
                then:
                  - micro_wake_word.disable_model:
                      id: stop

  # Interruption : coupe pipeline local + satellite HA + TTS (sans relancer l'écoute).
  - id: tab5_vocal_interrupt
    mode: restart
    then:
      - globals.set:
          id: va_stop_armed
          value: 'false'
      - voice_assistant.stop:
          id: va
      - media_player.stop:
          id: speaker_player
      - homeassistant.service:
          service: assist_satellite.stop
          data:
            entity_id: assist_satellite.m5stack_tab5_home_assistant_hmi_satellite_assist
      - homeassistant.service:
          service: media_player.media_stop
          data:
            entity_id: media_player.m5stack_tab5_home_assistant_hmi_media_player
      - homeassistant.service:
          service: media_player.media_stop
          data:
            entity_id: media_player.m5stack_tab5_home_assistant_hmi_tab5_media_player
      - lambda: |-
          if (id(icon_mic_status) != nullptr) {
            lv_obj_set_style_text_color(id(icon_mic_status), lv_color_hex(UIColor::TEXT_DIM), LV_PART_MAIN);
          }

  # Interruption puis ré-écoute immédiate (tap micro / barge-in Discussion).
  - id: tab5_vocal_interrupt_and_listen
    mode: restart
    then:
      - script.execute: tab5_vocal_interrupt
      - delay: 500ms
      - voice_assistant.start:
          id: va

  # Tap micro : coupe si assistant actif puis ré-écoute, sinon démarre (Click to Converse).
  - id: tab5_assist_toggle
    mode: restart
    then:
      - if:
          condition:
            or:
              - voice_assistant.is_running
              - lambda: 'return id(va_stop_armed);'
              - speaker.is_playing:
                  id: tab5_speaker
              - media_player.is_announcing:
                  id: speaker_player
          then:
            - logger.log: "Tap micro -> interrupt + re-ecoute"
            - script.execute: tab5_vocal_interrupt_and_listen
          else:
            - logger.log: "Tap micro -> start vocal"
            - voice_assistant.start:
                id: va

  # Debounce du slider volume : chaque glissement redémarre le délai, un seul
  # media_player.volume_set part réellement une fois le doigt immobile.
  - id: tab5_debounce_volume_set
    mode: restart
    then:
      - delay: 150ms
      - media_player.volume_set:
          id: speaker_player
          volume: !lambda 'return id(system_volume);'

  # ═══ Point d'entrée UNIQUE du volume ═══
  # Les 3 sources (slider console, slider popup assistant, number.tab5_volume
  # exposé à Home Assistant) passent obligatoirement par ici, sinon elles
  # divergent : avant, chaque slider n'écrivait que `system_volume` et ne
  # repeignait que le sien, donc un réglage venu de HA laissait l'écran sur
  # l'ancien % et le prochain démute le ré-appliquait — le réglage HA sautait.
  # `push_device: false` = on ne fait que refléter un volume déjà appliqué au
  # haut-parleur (rattrapage d'un media_player.volume_set venu de HA) ; renvoyer
  # un volume_set dans ce cas serait redondant.
  # Glisser le volume démute : c'était déjà le cas du slider assistant, la
  # console, elle, remontait le son sans jamais éteindre son icône « muet ».
  - id: tab5_volume_apply
    mode: restart
    parameters:
      vol: float
      push_device: bool
    then:
      - lambda: |-
          float v = vol < 0.0f ? 0.0f : (vol > 1.0f ? 1.0f : vol);
          id(system_volume) = v;
          id(system_muted) = false;
          ui_sync_volume_widgets(id(slider_volume), id(lbl_sys_vol_val),
                                 id(slider_assist_volume), v);
          ui_sync_mute_icons(id(icon_mute), id(icon_assist_mute), false);
          // Horodate AVANT le debounce : le haut-parleur va rester en retard
          // sur `system_volume` pendant tout le geste (le volume_set ne part
          // qu'à l'immobilité). Sans cette marque, le rattrapage de 5 s
          // recopierait le niveau périmé par-dessus le réglage en cours.
          if (push_device) id(volume_push_ts) = millis();
      - if:
          condition:
            lambda: 'return push_device;'
          then:
            - script.execute: tab5_debounce_volume_set
      - lambda: 'id(tab5_volume_pct).publish_state(id(system_volume) * 100.0f);'

  # Debounce de l'arc luminosité du popup lumière : chaque tick de glissement
  # redémarre le délai, un seul light.turn_on part une fois le doigt immobile
  # (même contrainte que le volume — ne pas spammer HA à chaque tick).
  - id: tab5_debounce_light_brightness
    mode: restart
    then:
      - delay: 200ms
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: !lambda 'return id(current_light_entity);'
            brightness: !lambda 'return to_string(lv_arc_get_value(id(arc_light_brightness)));'

  # Debounce de la cible clim (arc + boutons ± du popup clim) : un seul
  # climate.set_temperature par geste — les taps rapides ± sont groupés, la
  # cible affichée est optimiste (update_clim_target_ui) en attendant le retour
  # HA via tab5_maj_clim. Force le mode "cool" si la clim est éteinte (Daikin
  # refuse set_temperature en mode off), comme les anciens boutons ±.
  - id: tab5_debounce_clim_temp
    mode: restart
    then:
      - delay: 250ms
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: ${entity_climate_salon}
            hvac_mode: !lambda 'return (id(clim_hvac_mode) == "off" || id(clim_hvac_mode).empty()) ? std::string("cool") : id(clim_hvac_mode);'
            temperature: !lambda 'return to_string(id(clim_target_temp));'

  # Recoloration centralisée des icônes clim (source unique de vérité) — lit les 4
  # globals clim_hvac_mode / clim_preset_mode / clim_fan_mode / clim_swing_mode et
  # applique toutes les couleurs (mode, presets, silence, oscillation, brise + couleur
  # de la cible). Appelé par le service tab5_maj_clim (retour HA, autoritaire) ET par
  # chaque bouton du popup (affichage OPTIMISTE au tap, avant le round-trip HA/Daikin
  # cloud qui peut prendre plusieurs secondes). Ainsi taper un bouton recolore l'icône
  # instantanément ; le retour HA re-applique l'état réel et corrige tout écart.
  # NB: display logic exceptionnellement en YAML ici (accès id() requis pour ~12 objets)
  # — même approche que l'ancienne coloration inline de tab5_maj_clim qu'il remplace.
  - id: tab5_clim_recolor
    mode: restart
    then:
      - lambda: |-
          if (id(popup_icon_clim_cool) == nullptr) return;

          const std::string& mode  = id(clim_hvac_mode);
          const std::string& preset = id(clim_preset_mode);
          const std::string& fan   = id(clim_fan_mode);
          const std::string& swing = id(clim_swing_mode);

          uint32_t c_cool_active   = UIColor::CLIM_COOL_ACTIVE;
          uint32_t c_cool_inactive = UIColor::CLIM_COOL_INACTIVE;
          uint32_t c_heat_active   = UIColor::CLIM_HEAT_ACTIVE;
          uint32_t c_heat_inactive = UIColor::CLIM_HEAT_INACTIVE;
          uint32_t c_off_active    = UIColor::CLIM_OFF_ACTIVE;
          uint32_t c_off_inactive  = UIColor::CLIM_OFF_INACTIVE;
          uint32_t c_inactive      = UIColor::CLIM_TRACK_INACTIVE;
          uint32_t c_eco           = UIColor::CLIM_ECO;

          // Couleur de la cible (Bleu si froid, Rouge si chaud, Blanc sinon)
          uint32_t c_target_color = UIColor::TEXT_PRIMARY;
          if (mode == "cool") c_target_color = UIColor::CLIM_COOL_ACTIVE;
          else if (mode == "heat") c_target_color = UIColor::CLIM_HEAT_ACTIVE;
          if (id(clim_target) != nullptr)
            lv_obj_set_style_text_color(id(clim_target), lv_color_hex(c_target_color), LV_PART_MAIN);
          if (id(clim_target_popup) != nullptr)
            lv_obj_set_style_text_color(id(clim_target_popup), lv_color_hex(c_target_color), LV_PART_MAIN);

          // Mode (Cool/Heat/Dry/Fan/Off)
          lv_obj_set_style_text_color(id(popup_icon_clim_cool), lv_color_hex(c_cool_inactive), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(popup_icon_clim_heat), lv_color_hex(c_heat_inactive), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(popup_icon_clim_dry),  lv_color_hex(c_cool_inactive), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(popup_icon_clim_fan),  lv_color_hex(c_inactive), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(popup_icon_clim_off),  lv_color_hex(c_off_inactive), LV_PART_MAIN);

          if (mode == "cool") {
            lv_obj_set_style_text_color(id(popup_icon_clim_cool), lv_color_hex(c_cool_active), LV_PART_MAIN);
          } else if (mode == "heat") {
            lv_obj_set_style_text_color(id(popup_icon_clim_heat), lv_color_hex(c_heat_active), LV_PART_MAIN);
          } else if (mode == "dry") {
            lv_obj_set_style_text_color(id(popup_icon_clim_dry), lv_color_hex(c_cool_active), LV_PART_MAIN);
          } else if (mode == "fan_only") {
            lv_obj_set_style_text_color(id(popup_icon_clim_fan), lv_color_hex(c_eco), LV_PART_MAIN);
          } else {
            lv_obj_set_style_text_color(id(popup_icon_clim_off), lv_color_hex(c_off_active), LV_PART_MAIN);
          }

          // Eco (preset "eco"/"away")
          if (preset == "eco" || preset == "away") {
            lv_obj_set_style_text_color(id(popup_icon_clim_eco), lv_color_hex(c_eco), LV_PART_MAIN);
          } else {
            lv_obj_set_style_text_color(id(popup_icon_clim_eco), lv_color_hex(c_inactive), LV_PART_MAIN);
          }

          // Boost
          if (preset == "boost") {
            lv_obj_set_style_text_color(id(popup_icon_clim_boost), lv_color_hex(c_heat_active), LV_PART_MAIN);
          } else {
            lv_obj_set_style_text_color(id(popup_icon_clim_boost), lv_color_hex(c_inactive), LV_PART_MAIN);
          }

          // Silence / Auto
          if (fan == "low" || fan == "quiet" || fan == "Silence") {
            lv_obj_set_style_text_color(id(popup_icon_clim_quiet), lv_color_hex(c_cool_active), LV_PART_MAIN);
          } else {
            lv_obj_set_style_text_color(id(popup_icon_clim_quiet), lv_color_hex(c_inactive), LV_PART_MAIN);
          }

          // Oscillation (windnice exclu : bouton "Brise" séparé)
          if (swing == "swing" || swing == "vertical" || swing == "horizontal" || swing == "both" || swing == "on" || swing == "3d") {
            lv_obj_set_style_text_color(id(popup_icon_clim_swing), lv_color_hex(c_cool_active), LV_PART_MAIN);
          } else {
            lv_obj_set_style_text_color(id(popup_icon_clim_swing), lv_color_hex(c_inactive), LV_PART_MAIN);
          }

          // Brise (Daikin Onecta "windnice")
          if (swing == "windnice") {
            lv_obj_set_style_text_color(id(popup_icon_clim_windnice), lv_color_hex(c_cool_active), LV_PART_MAIN);
          } else {
            lv_obj_set_style_text_color(id(popup_icon_clim_windnice), lv_color_hex(c_inactive), LV_PART_MAIN);
          }

  # Rotateur central auto (8s) — mode restart : tout tap/advance remet le délai à zéro.
  - id: tab5_central_rotator_auto
    mode: restart
    then:
      - delay: 8s
      - if:
          condition:
            and:
              - light.is_on: backlight
              - lambda: 'return !id(is_showing_temp_planning) && !id(is_showing_vocal_response) && id(forecast_page_index) == 2;'
          then:
            - lambda: |-
                sync_central_ctx(g_central_ctx, id(has_rain), id(has_alerts), id(has_info),
                    id(has_ha_alert_0), id(has_ha_alert_1), id(has_ha_alert_2), id(has_ha_alert_3),
                    id(current_central_panel));
                advance_central_panel_rotator(g_central_ctx);
                id(current_central_panel) = g_central_ctx.current_panel;
      - script.execute: tab5_central_rotator_auto

  # Réponse vocale IA : pause rotateur 8s, affichage + défilement si long, puis reprise.
  - id: tab5_show_vocal_response
    mode: restart
    parameters:
      texte: string
    then:
      - if:
          condition:
            lambda: 'return id(forecast_page_index) == 2 && texte.size() > 0;'
          then:
            - script.stop: tab5_central_rotator_auto
            - globals.set:
                id: is_showing_vocal_response
                value: 'true'
            - lambda: |-
                sync_central_ctx(g_central_ctx, id(has_rain), id(has_alerts), id(has_info),
                    id(has_ha_alert_0), id(has_ha_alert_1), id(has_ha_alert_2), id(has_ha_alert_3),
                    id(current_central_panel));
                show_vocal_response_ui(texte,
                    id(vocal_wrapper), id(lbl_vocal_text),
                    id(page_title_wrapper), g_central_ctx,
                    id(roboto_45_b));
                id(current_central_panel) = g_central_ctx.current_panel;
            - delay: 8s
            - lambda: |-
                sync_central_ctx(g_central_ctx, id(has_rain), id(has_alerts), id(has_info),
                    id(has_ha_alert_0), id(has_ha_alert_1), id(has_ha_alert_2), id(has_ha_alert_3),
                    id(current_central_panel));
                hide_vocal_response_ui(id(vocal_wrapper), id(lbl_vocal_text), g_central_ctx);
                id(current_central_panel) = g_central_ctx.current_panel;
            - globals.set:
                id: is_showing_vocal_response
                value: 'false'
            - script.execute: tab5_central_rotator_auto

  # Tap navigation : planning / pluie / icônes MF → ligne suivante (sans dismiss HA).
  - id: tab5_central_panel_next
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(forecast_page_index) == 2 && !id(is_showing_temp_planning);'
          then:
            - lambda: |-
                sync_central_ctx(g_central_ctx, id(has_rain), id(has_alerts), id(has_info),
                    id(has_ha_alert_0), id(has_ha_alert_1), id(has_ha_alert_2), id(has_ha_alert_3),
                    id(current_central_panel));
                advance_central_panel_rotator(g_central_ctx);
                id(current_central_panel) = g_central_ctx.current_panel;
            - script.execute: tab5_central_rotator_auto

  # Tap panneau info (ligne météo HA) : dismiss définitif si vigilance, sinon navigation.
  - id: tab5_dismiss_info_tap
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(forecast_page_index) == 2 && !id(is_showing_temp_planning) && id(has_info);'
          then:
            - if:
                condition:
                  lambda: 'return id(info_meteo_dismiss_id).size() > 0;'
                then:
                  - lambda: |-
                      id(temp_dismiss_alert_id) = id(info_meteo_dismiss_id);
                      tab5_dismiss_local_add(id(tab5_dismissed_local), id(temp_dismiss_alert_id));
                      sync_central_ctx(g_central_ctx, id(has_rain), id(has_alerts), id(has_info),
                          id(has_ha_alert_0), id(has_ha_alert_1), id(has_ha_alert_2), id(has_ha_alert_3),
                          id(current_central_panel));
                      dismiss_central_info_immediate(id(lbl_info_text), g_central_ctx);
                      id(has_info) = g_central_ctx.has_info;
                      id(current_central_panel) = g_central_ctx.current_panel;
                  - homeassistant.service:
                      service: script.tab5_dismiss_alert
                      data:
                        alert_id: !lambda 'return id(temp_dismiss_alert_id);'
                  - globals.set:
                      id: temp_dismiss_alert_id
                      value: '""'
                else:
                  - lambda: |-
                      sync_central_ctx(g_central_ctx, id(has_rain), id(has_alerts), id(has_info),
                          id(has_ha_alert_0), id(has_ha_alert_1), id(has_ha_alert_2), id(has_ha_alert_3),
                          id(current_central_panel));
                      advance_central_panel_rotator(g_central_ctx);
                      id(current_central_panel) = g_central_ctx.current_panel;
            - script.execute: tab5_central_rotator_auto

  # Tap annonce HA (panneaux 4-7) : dismiss définitif + ligne suivante.
  # Script unique paramétré (slot 0-3) — remplace les ex-tab5_dismiss_ha_alert_0..3
  # identiques (#3). Les 4 objets/globals par slot sont résolus par tableaux indexés
  # (pattern &id(bool)/&id(std::string) déjà utilisé dans tab5-api-logic.yaml).
  - id: tab5_dismiss_ha_alert
    mode: restart
    parameters:
      slot: int
    then:
      - lambda: |-
          id(temp_dismiss_alert_id) = "";
          lv_obj_t* wraps[4] = {id(ha_alert_wrapper_0), id(ha_alert_wrapper_1), id(ha_alert_wrapper_2), id(ha_alert_wrapper_3)};
          lv_obj_t* lbls[4]  = {id(lbl_ha_alert_0), id(lbl_ha_alert_1), id(lbl_ha_alert_2), id(lbl_ha_alert_3)};
          bool* hasf[4]       = {&id(has_ha_alert_0), &id(has_ha_alert_1), &id(has_ha_alert_2), &id(has_ha_alert_3)};
          std::string* ids[4] = {&id(ha_alert_id_0), &id(ha_alert_id_1), &id(ha_alert_id_2), &id(ha_alert_id_3)};
          if (slot < 0 || slot > 3 || ids[slot]->size() == 0) return;
          id(temp_dismiss_alert_id) = *ids[slot];
          tab5_dismiss_local_add(id(tab5_dismissed_local), id(temp_dismiss_alert_id));
          sync_central_ctx(g_central_ctx, id(has_rain), id(has_alerts), id(has_info),
              id(has_ha_alert_0), id(has_ha_alert_1), id(has_ha_alert_2), id(has_ha_alert_3),
              id(current_central_panel));
          dismiss_ha_alert_slot_immediate(slot, wraps[slot], lbls[slot], *hasf[slot], *ids[slot], g_central_ctx);
          id(current_central_panel) = g_central_ctx.current_panel;
      - if:
          condition:
            lambda: 'return id(temp_dismiss_alert_id).size() > 0;'
          then:
            - homeassistant.service:
                service: script.tab5_dismiss_alert
                data:
                  alert_id: !lambda 'return id(temp_dismiss_alert_id);'
            - script.execute: tab5_central_rotator_auto

  # Popup lumière : sélection + synchro complète (titre, surbrillance sélecteur, icônes
  # d'état, icône power, arc luminosité depuis l'attribut brightness HA) puis affichage.
  # Appelé par forecast_daily.yaml (long_press cartes j2/j3/j4) et par les 3 boutons du
  # sélecteur interne du popup. light_idx : 0=Chambre, 1=Salon, 2=LEDs.
  - id: tab5_light_popup_show
    mode: restart
    parameters:
      light_idx: int
    then:
      - lambda: |-
          if (light_idx < 0 || light_idx > 2) return;
          static const char* const kTitles[3] = {"Ampoule Chambre", "Ampoule Salon", "Ampoule LEDs"};
          static const char* const kEntities[3] = {"${entity_light_chambre}", "${entity_light_salon}", "${entity_light_bureau}"};
          id(current_light_entity) = kEntities[light_idx];
          const bool is_on[3] = { id(light_chambre_state).state == "on",
                                  id(light_salon_state).state == "on",
                                  id(light_led_state).state == "on" };
          const float brightness[3] = { id(light_chambre_brightness).state,
                                        id(light_salon_brightness).state,
                                        id(light_led_brightness).state };
          show_light_popup_ui(light_idx, kTitles, is_on, brightness,
              id(light_options_popup), id(popup_light_title),
              id(btn_light_sel_0), id(btn_light_sel_1), id(btn_light_sel_2),
              id(icon_light_sel_0), id(icon_light_sel_1), id(icon_light_sel_2),
              id(btn_light_power_icon), id(arc_light_brightness), id(lbl_light_brightness_val));

  # ═══ Popup calendrier (calendar_popup.yaml) ═══
  # Ouverture (appui long horloge) : vue = mois courant (SNTP), le cache est
  # CONSERVÉ (stale-while-revalidate) — affichage instantané si données en cache,
  # refresh silencieux si périmé (> 10 min). Eviction des mois lointains.
  - id: tab5_calendar_open
    mode: restart
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (!t.is_valid()) return;  // pas d'heure SNTP -> pas de calendrier fiable
          id(cal_view_year) = t.year;
          id(cal_view_month) = t.month;
          id(cal_detail_date) = "";
          lv_obj_add_flag(id(cal_day_popup), LV_OBJ_FLAG_HIDDEN);
          // Eviction : garde max 3 mois autour de la vue (M-1, M, M+1)
          cal_cache_evict_distant(t.year, t.month);
          animate_popup_open(id(calendar_popup), nullptr);
          lv_obj_move_foreground(id(calendar_popup));
      - script.execute: tab5_cal_render

  # Rendu du mois affiché : grille locale (numéros/aujourd'hui/weekend) tout de
  # suite, enrichissement HA (travail/férié/vacances/RDV) depuis le cache si dispo.
  # Si absent OU périmé (> 10 min) → requête script.tab5_calendrier_mois (le push
  # re-déclenche ce rendu). Pré-fetch silencieux des mois adjacents (M-1, M+1).
  - id: tab5_cal_render
    mode: restart
    then:
      - lambda: |-
          if (id(cal_view_year) == 0) return;
          // static : les pointeurs LVGL sont constants (ids fixes au boot) —
          // évite de reconstruire 42×5 pointeurs sur la pile à chaque rendu.
          static CalCellUI cells[42] = {
              {id(cal_cell_0), id(cal_num_0), id(cal_sub_0), id(cal_dot_0), id(cal_dot2_0)},
              {id(cal_cell_1), id(cal_num_1), id(cal_sub_1), id(cal_dot_1), id(cal_dot2_1)},
              {id(cal_cell_2), id(cal_num_2), id(cal_sub_2), id(cal_dot_2), id(cal_dot2_2)},
              {id(cal_cell_3), id(cal_num_3), id(cal_sub_3), id(cal_dot_3), id(cal_dot2_3)},
              {id(cal_cell_4), id(cal_num_4), id(cal_sub_4), id(cal_dot_4), id(cal_dot2_4)},
              {id(cal_cell_5), id(cal_num_5), id(cal_sub_5), id(cal_dot_5), id(cal_dot2_5)},
              {id(cal_cell_6), id(cal_num_6), id(cal_sub_6), id(cal_dot_6), id(cal_dot2_6)},
              {id(cal_cell_7), id(cal_num_7), id(cal_sub_7), id(cal_dot_7), id(cal_dot2_7)},
              {id(cal_cell_8), id(cal_num_8), id(cal_sub_8), id(cal_dot_8), id(cal_dot2_8)},
              {id(cal_cell_9), id(cal_num_9), id(cal_sub_9), id(cal_dot_9), id(cal_dot2_9)},
              {id(cal_cell_10), id(cal_num_10), id(cal_sub_10), id(cal_dot_10), id(cal_dot2_10)},
              {id(cal_cell_11), id(cal_num_11), id(cal_sub_11), id(cal_dot_11), id(cal_dot2_11)},
              {id(cal_cell_12), id(cal_num_12), id(cal_sub_12), id(cal_dot_12), id(cal_dot2_12)},
              {id(cal_cell_13), id(cal_num_13), id(cal_sub_13), id(cal_dot_13), id(cal_dot2_13)},
              {id(cal_cell_14), id(cal_num_14), id(cal_sub_14), id(cal_dot_14), id(cal_dot2_14)},
              {id(cal_cell_15), id(cal_num_15), id(cal_sub_15), id(cal_dot_15), id(cal_dot2_15)},
              {id(cal_cell_16), id(cal_num_16), id(cal_sub_16), id(cal_dot_16), id(cal_dot2_16)},
              {id(cal_cell_17), id(cal_num_17), id(cal_sub_17), id(cal_dot_17), id(cal_dot2_17)},
              {id(cal_cell_18), id(cal_num_18), id(cal_sub_18), id(cal_dot_18), id(cal_dot2_18)},
              {id(cal_cell_19), id(cal_num_19), id(cal_sub_19), id(cal_dot_19), id(cal_dot2_19)},
              {id(cal_cell_20), id(cal_num_20), id(cal_sub_20), id(cal_dot_20), id(cal_dot2_20)},
              {id(cal_cell_21), id(cal_num_21), id(cal_sub_21), id(cal_dot_21), id(cal_dot2_21)},
              {id(cal_cell_22), id(cal_num_22), id(cal_sub_22), id(cal_dot_22), id(cal_dot2_22)},
              {id(cal_cell_23), id(cal_num_23), id(cal_sub_23), id(cal_dot_23), id(cal_dot2_23)},
              {id(cal_cell_24), id(cal_num_24), id(cal_sub_24), id(cal_dot_24), id(cal_dot2_24)},
              {id(cal_cell_25), id(cal_num_25), id(cal_sub_25), id(cal_dot_25), id(cal_dot2_25)},
              {id(cal_cell_26), id(cal_num_26), id(cal_sub_26), id(cal_dot_26), id(cal_dot2_26)},
              {id(cal_cell_27), id(cal_num_27), id(cal_sub_27), id(cal_dot_27), id(cal_dot2_27)},
              {id(cal_cell_28), id(cal_num_28), id(cal_sub_28), id(cal_dot_28), id(cal_dot2_28)},
              {id(cal_cell_29), id(cal_num_29), id(cal_sub_29), id(cal_dot_29), id(cal_dot2_29)},
              {id(cal_cell_30), id(cal_num_30), id(cal_sub_30), id(cal_dot_30), id(cal_dot2_30)},
              {id(cal_cell_31), id(cal_num_31), id(cal_sub_31), id(cal_dot_31), id(cal_dot2_31)},
              {id(cal_cell_32), id(cal_num_32), id(cal_sub_32), id(cal_dot_32), id(cal_dot2_32)},
              {id(cal_cell_33), id(cal_num_33), id(cal_sub_33), id(cal_dot_33), id(cal_dot2_33)},
              {id(cal_cell_34), id(cal_num_34), id(cal_sub_34), id(cal_dot_34), id(cal_dot2_34)},
              {id(cal_cell_35), id(cal_num_35), id(cal_sub_35), id(cal_dot_35), id(cal_dot2_35)},
              {id(cal_cell_36), id(cal_num_36), id(cal_sub_36), id(cal_dot_36), id(cal_dot2_36)},
              {id(cal_cell_37), id(cal_num_37), id(cal_sub_37), id(cal_dot_37), id(cal_dot2_37)},
              {id(cal_cell_38), id(cal_num_38), id(cal_sub_38), id(cal_dot_38), id(cal_dot2_38)},
              {id(cal_cell_39), id(cal_num_39), id(cal_sub_39), id(cal_dot_39), id(cal_dot2_39)},
              {id(cal_cell_40), id(cal_num_40), id(cal_sub_40), id(cal_dot_40), id(cal_dot2_40)},
              {id(cal_cell_41), id(cal_num_41), id(cal_sub_41), id(cal_dot_41), id(cal_dot2_41)}
          };
          auto t = id(sntp_time).now();
          cal_render_month(cells, id(lbl_cal_month), id(cal_view_year), id(cal_view_month),
              t.is_valid() ? t.year : 0, t.is_valid() ? t.month : 0,
              t.is_valid() ? t.day_of_month : 0);
          // Eviction : ne garde que M-1, M, M+1 autour de la vue courante
          cal_cache_evict_distant(id(cal_view_year), id(cal_view_month));
      # Refresh du mois affiché si absent ou périmé (> 10 min)
      - if:
          condition:
            lambda: 'return id(cal_view_year) != 0 && cal_month_is_stale(id(cal_view_year), id(cal_view_month));'
          then:
            - homeassistant.service:
                service: script.tab5_calendrier_mois
                data:
                  annee: !lambda 'return to_string(id(cal_view_year));'
                  mois: !lambda 'return to_string(id(cal_view_month));'
      # Pré-fetch silencieux des mois adjacents (M-1, M+1) si absents du cache
      - if:
          condition:
            lambda: |-
              if (id(cal_view_year) == 0) return false;
              int pm = id(cal_view_month) - 1, py = id(cal_view_year);
              if (pm < 1) { pm = 12; py--; }
              return cal_month_needs_fetch(py, pm);
          then:
            - homeassistant.service:
                service: script.tab5_calendrier_mois
                data:
                  annee: !lambda |-
                    int py = id(cal_view_year);
                    if (id(cal_view_month) == 1) py--;
                    return to_string(py);
                  mois: !lambda |-
                    int pm = id(cal_view_month) - 1;
                    if (pm < 1) pm = 12;
                    return to_string(pm);
      - if:
          condition:
            lambda: |-
              if (id(cal_view_year) == 0) return false;
              int nm = id(cal_view_month) + 1, ny = id(cal_view_year);
              if (nm > 12) { nm = 1; ny++; }
              return cal_month_needs_fetch(ny, nm);
          then:
            - homeassistant.service:
                service: script.tab5_calendrier_mois
                data:
                  annee: !lambda |-
                    int ny = id(cal_view_year);
                    if (id(cal_view_month) == 12) ny++;
                    return to_string(ny);
                  mois: !lambda |-
                    int nm = id(cal_view_month) + 1;
                    if (nm > 12) nm = 1;
                    return to_string(nm);

  # Navigation ◀ / ▶ / Aujourd'hui (le détail jour est refermé au changement de mois)
  - id: tab5_cal_prev
    mode: restart
    then:
      - lambda: |-
          if (id(cal_view_year) == 0) return;
          int m = id(cal_view_month) - 1;
          if (m < 1) { m = 12; id(cal_view_year) -= 1; }
          id(cal_view_month) = m;
          lv_obj_add_flag(id(cal_day_popup), LV_OBJ_FLAG_HIDDEN);
      - script.execute: tab5_cal_render

  - id: tab5_cal_next
    mode: restart
    then:
      - lambda: |-
          if (id(cal_view_year) == 0) return;
          int m = id(cal_view_month) + 1;
          if (m > 12) { m = 1; id(cal_view_year) += 1; }
          id(cal_view_month) = m;
          lv_obj_add_flag(id(cal_day_popup), LV_OBJ_FLAG_HIDDEN);
      - script.execute: tab5_cal_render

  - id: tab5_cal_today
    mode: restart
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (!t.is_valid()) return;
          id(cal_view_year) = t.year;
          id(cal_view_month) = t.month;
          lv_obj_add_flag(id(cal_day_popup), LV_OBJ_FLAG_HIDDEN);
      - script.execute: tab5_cal_render

  # Pré-fetch au boot / reconnect HA : charge le mois courant + ses adjacents en
  # arrière-plan (sans ouvrir le popup). Appelé par on_boot et status_ha rising edge.
  - id: tab5_cal_prefetch_boot
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              auto t = id(sntp_time).now();
              return t.is_valid() && id(status_ha).state;
          then:
            - homeassistant.service:
                service: script.tab5_calendrier_mois
                data:
                  annee: !lambda 'return to_string(id(sntp_time).now().year);'
                  mois: !lambda 'return to_string(id(sntp_time).now().month);'
            - delay: 2s
            # Mois suivant (le plus probable en navigation)
            - homeassistant.service:
                service: script.tab5_calendrier_mois
                data:
                  annee: !lambda |-
                    auto t = id(sntp_time).now();
                    int ny = t.year;
                    if (t.month == 12) ny++;
                    return to_string(ny);
                  mois: !lambda |-
                    auto t = id(sntp_time).now();
                    int nm = t.month + 1;
                    if (nm > 12) nm = 1;
                    return to_string(nm);

  # Tap sur une cellule : ouvre le sous-popup détail. Si le champ ~ de CE jour
  # est non vide → rendu instantané. Sinon "Chargement..." + script.tab5_calendrier_jour
  # (vieux HA / details absents / jour passé sans embed après clamp get_events).
  - id: tab5_cal_day_tap
    mode: restart
    parameters:
      cell_idx: int
    then:
      - lambda: |-
          id(cal_detail_date) = cal_date_for_cell(id(cal_view_year), id(cal_view_month), cell_idx);
          if (id(cal_detail_date).empty()) return;  // cellule vide (hors mois)
          CalDetailLineUI lines[6] = {
              {id(cal_det_icon_0), id(cal_det_txt_0)},
              {id(cal_det_icon_1), id(cal_det_txt_1)},
              {id(cal_det_icon_2), id(cal_det_txt_2)},
              {id(cal_det_icon_3), id(cal_det_txt_3)},
              {id(cal_det_icon_4), id(cal_det_txt_4)},
              {id(cal_det_icon_5), id(cal_det_txt_5)}
          };
          int y = 0, m = 0, d = 0;
          sscanf(id(cal_detail_date).c_str(), "%d-%d-%d", &y, &m, &d);
          const std::string detail = cal_cached_day_detail(y, m, d);
          if (!detail.empty()) {
            // Titre + lignes depuis le cache mois (instantané)
            cal_show_day_detail_loading(id(cal_day_popup), id(lbl_cal_day_title),
                id(lbl_cal_day_status), lines, id(cal_detail_date), true);
            cal_render_day_detail(detail, id(lbl_cal_day_status), lines);
          } else {
            cal_show_day_detail_loading(id(cal_day_popup), id(lbl_cal_day_title),
                id(lbl_cal_day_status), lines, id(cal_detail_date), id(status_ha).state);
          }
      - if:
          condition:
            lambda: |-
              if (id(cal_detail_date).empty() || !id(status_ha).state) return false;
              int y = 0, m = 0, d = 0;
              sscanf(id(cal_detail_date).c_str(), "%d-%d-%d", &y, &m, &d);
              return !cal_day_has_embedded_detail(y, m, d);
          then:
            - homeassistant.service:
                service: script.tab5_calendrier_jour
                data:
                  date: !lambda 'return id(cal_detail_date);'

  # ═══════════════════════════════════════════════════════════════════════════
  # Popup Assistant vocal (assistant_popup.yaml) — ouverture, réglages, réponse
  # ═══════════════════════════════════════════════════════════════════════════

  # Ouvre le popup plein écran + resynchronise l'affichage des réglages.
  - id: tab5_assist_open
    mode: restart
    then:
      - globals.set:
          id: assist_popup_open
          value: 'true'
      - lambda: |-
          // Ouverture programmée (réponse du moteur) : personne n'a touché la
          // dalle, on repart donc de 45 s pleines avant le retour automatique.
          ui_mark_activity();
          animate_popup_open(id(assistant_popup), nullptr);
          lv_obj_move_foreground(id(assistant_popup));
      - script.execute: tab5_assist_sync_settings

  - id: tab5_assist_close
    mode: restart
    then:
      - globals.set:
          id: assist_popup_open
          value: 'false'
      - lambda: 'animate_popup_close(id(assistant_popup), nullptr);'

  # Nouvelle demande reconnue : passe la réponse en "Réflexion..." et masque l'image
  # précédente. N'OUVRE le popup automatiquement qu'en mode Discussion (ou s'il est
  # déjà ouvert) — en mode Domotique, une commande courte ne doit pas voiler le
  # dashboard (le bandeau central 8 s reste le retour rapide). Long-press micro pour
  # ouvrir manuellement dans tous les cas.
  - id: tab5_assist_on_request
    mode: restart
    then:
      - lambda: |-
          esphome::font::Font* f = id(assist_text_size) == 0 ? id(roboto_mono_20)
                                 : (id(assist_text_size) == 2 ? id(roboto_mono_28) : id(roboto_mono_24));
          assist_set_response(id(lbl_assist_response), std::string("Reflexion..."), f);
          if (id(assist_img_widget) != nullptr) lv_obj_add_flag(id(assist_img_widget), LV_OBJ_FLAG_HIDDEN);
          if (id(assist_img_hint) != nullptr) lv_obj_add_flag(id(assist_img_hint), LV_OBJ_FLAG_HIDDEN);
      - if:
          condition:
            lambda: 'return id(conversation_mode) || id(assist_popup_open);'
          then:
            - script.execute: tab5_assist_open

  # Reflète l'état courant (pipeline/mute/wake/volume/taille) sur les contrôles du popup.
  - id: tab5_assist_sync_settings
    mode: restart
    then:
      - lambda: |-
          bool discu = id(conversation_mode);
          highlight_button_border(id(btn_assist_pipe_domo), !discu, UIColor::INFO);
          highlight_button_border(id(btn_assist_pipe_discu), discu, UIColor::SUCCESS);
          if (id(lbl_assist_wake) != nullptr) {
            bool wake = id(tab5_wake_word_active).state;
            lv_label_set_text(id(lbl_assist_wake), wake ? "Ok Nabu : ON" : "Ok Nabu : OFF");
            lv_obj_set_style_text_color(id(lbl_assist_wake),
                lv_color_hex(wake ? UIColor::SUCCESS : UIColor::TEXT_DIM), LV_PART_MAIN);
          }
          ui_sync_mute_icons(id(icon_mute), id(icon_assist_mute), id(system_muted));
          // Même helper que script.tab5_volume_apply : à l'ouverture du popup,
          // les deux sliders et le label % de la console repartent tous de
          // `system_volume` (qui peut avoir bougé depuis HA entre-temps).
          ui_sync_volume_widgets(id(slider_volume), id(lbl_sys_vol_val),
                                 id(slider_assist_volume), id(system_volume));
      - lambda: |-
          assist_apply_text_size(id(lbl_assist_response), id(assist_text_size),
              id(roboto_mono_20), id(roboto_mono_24), id(roboto_mono_28),
              id(btn_assist_size_s), id(btn_assist_size_m), id(btn_assist_size_l));

  # Choix du cerveau (pipeline HA). discussion=true => LLM libre, false => domotique.
  # Centralise la mise à jour des boutons du dashboard ET du popup (source unique).
  - id: tab5_set_assist_mode
    mode: restart
    parameters:
      discussion: bool
    then:
      - globals.set:
          id: conversation_mode
          value: !lambda 'return discussion;'
      - homeassistant.service:
          service: select.select_option
          data:
            entity_id: ${entity_tab5_pipeline_select}
            option: !lambda 'return discussion ? std::string("Discussion LLM") : std::string("preferred");'
      - lambda: |-
          if (discussion) {
            lv_label_set_text(id(icon_mode_status), "\U000F0450");
            lv_obj_set_style_text_color(id(icon_mode_status), lv_color_hex(UIColor::INFO), LV_PART_MAIN);
          } else {
            lv_label_set_text(id(icon_mode_status), "\U000F07D0");
            lv_obj_set_style_text_color(id(icon_mode_status), lv_color_hex(UIColor::TEXT_DIM), LV_PART_MAIN);
          }
          highlight_button_border(id(btn_mode_domo), !discussion, UIColor::INFO);
          highlight_button_border(id(btn_mode_discu), discussion, UIColor::SUCCESS);
          highlight_button_border(id(btn_assist_pipe_domo), !discussion, UIColor::INFO);
          highlight_button_border(id(btn_assist_pipe_discu), discussion, UIColor::SUCCESS);

  # Taille de la police de réponse : 0=S 1=M 2=L (persisté, confort de lecture).
  - id: tab5_assist_set_text_size
    mode: restart
    parameters:
      size: int
    then:
      - globals.set:
          id: assist_text_size
          value: !lambda 'return size;'
      - lambda: |-
          assist_apply_text_size(id(lbl_assist_response), size,
              id(roboto_mono_20), id(roboto_mono_24), id(roboto_mono_28),
              id(btn_assist_size_s), id(btn_assist_size_m), id(btn_assist_size_l));

# ═══════════════════════════════════════════════════════════════════════════════
# Retour automatique à l'écran principal (inactivité tactile)
# ───────────────────────────────────────────────────────────────────────────────
# [28/07/2026, demande Axel] Deux minuteries :
#   - un popup ouvert se referme au bout de UIIdle::POPUP_MS    (45 s)
#   - une page météo ≠ panneau principal revient page 2 au bout
#     de UIIdle::FORECAST_MS                                     (25 s)
#
# Ce sont des délais d'INACTIVITÉ, pas des délais depuis l'ouverture : le
# compteur LVGL repart de zéro à chaque appui, donc un popup ne se ferme jamais
# pendant qu'on s'en sert (lire le calendrier ou régler la clim prend plus de
# 45 s). Les événements du pipeline vocal le remettent aussi à zéro
# (ui_mark_activity() dans tab5_vocal_arm_stop / _disarm_stop / tab5_assist_open)
# — une conversation mains libres ne touche pas la dalle et fermerait sinon le
# popup Assistant en pleine réponse.
#
# Ordre volontaire popup PUIS météo : tant qu'un popup couvre l'écran, repeindre
# les prévisions cachées dessous ne sert à rien. Le retour météo se fait donc au
# tick suivant la fermeture (l'inactivité continue de courir), ce qui évite en
# prime de cumuler le fondu de fermeture et un refresh de prévisions dans la
# même frame.
#
# Les jeux sont volontairement exclus : un jeu n'est pas un popup, il ne doit
# jamais se fermer seul (une partie en pause, c'est zéro toucher pendant des
# minutes). Le sélecteur arcade (page_arcade) est géré séparément : si aucun
# jeu n'est ouvert et que l'inactivité dépasse le seuil popup, on revient au
# dashboard. Le panneau des switches HA l'est aussi : il s'affiche sur demande
# explicite (bouton « HA »), on ne le rend pas à la météo dans son dos.
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (Marble::is_open() || Arkanoid::is_open() || Lode::is_open() ||
              Go::is_open() || Trivia::is_open() || Draughts::is_open() ||
              Chess::is_open() || Pinball::is_open()) return;

          // Pointeurs LVGL constants après le boot (même motif que tab5_cal_render) :
          // pas de reconstruction du tableau à chaque seconde.
          // Toute nouvelle fenêtre modale DOIT être ajoutée ici.
          // L'écran de SONNERIE du réveil (alarm_ring_layer) est volontairement
          // absent de cette liste : c'est un calque plein cadre, pas une fenêtre
          // modale, et il ne doit surtout pas se refermer parce que personne ne
          // touche l'écran — c'est exactement la situation qu'il traite. Seuls
          // tab5_alarm_stop / _snooze_now / la durée maximale le referment.
          // La fenêtre de RÉGLAGES du réveil (alarm_popup), elle, est une modale
          // ordinaire et suit la règle commune.
          static lv_obj_t* const kPopups[] = {
              id(assistant_popup), id(calendar_popup), id(light_options_popup),
              id(clim_options_popup), id(pots_detail_popup), id(tv_remote_popup),
              id(alarm_popup), id(layer_console_sys)
          };
          constexpr int kNbPopups = sizeof(kPopups) / sizeof(kPopups[0]);

          const uint32_t idle = ui_idle_ms();

          // Sélecteur arcade (page_arcade) : si aucun jeu n'est ouvert et
          // inactivité > seuil popup, retour au dashboard.
          if (id(tab5_lvgl)->get_current_page() == 1) {  // page_arcade
              if (idle >= UIIdle::POPUP_MS) id(tab5_lvgl)->show_page(0, LV_SCREEN_LOAD_ANIM_NONE, 0);
              return;
          }

          if (any_popup_visible(kPopups, kNbPopups)) {
              if (idle < UIIdle::POPUP_MS) return;
              // Sous-fenêtres internes : masquage sec, elles n'ont pas de fondu
              // propre et disparaissent avec la carte qui les porte (mêmes gestes
              // que les croix de calendar_popup.yaml / console_sys.yaml).
              lv_obj_add_flag(id(cal_day_popup), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(overlay_confirm_ha), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(overlay_confirm_reboot), LV_OBJ_FLAG_HIDDEN);
              for (int i = 0; i < kNbPopups; i++) close_popup_if_open(kPopups[i]);
              id(assist_popup_open) = false;
              return;
          }

          if (idle < UIIdle::FORECAST_MS) return;
          if (id(forecast_page_index) == 2) return;   // déjà au panneau principal
          if (id(show_switches)) return;              // panneau HA affiché à la demande

          lv_obj_t* pbars[] = {id(pbar_0), id(pbar_1), id(pbar_2), id(pbar_3), id(pbar_4)};
          reset_forecast_to_main_page(id(forecast_page_index),
              id(layer_forecast_daily), id(layer_forecast_hourly),
              g_day_slots, g_hour_slots,
              id(font_meteo_main), id(font_meteo_card), id(font_meteo_main_small), id(font_meteo_card_small),
              pbars,
              id(page_title_wrapper), id(lbl_page_title),
              g_central_ctx);

