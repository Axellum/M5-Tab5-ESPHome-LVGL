# [AI-CONTEXT]
# @file tab5-globals.yaml
# @role Variables globales de l'interface (état des volets, page courante, mode vocal).
# @ai_instruction Ne déclarer ici que les variables globales pures.
# ============================================================================
# tab5-globals.yaml — État partagé entre tous les packages (voir table complète
# dans Tab5/README.md). Règle : tout état lu/écrit par plus d'un fichier ou par
# deux handlers différents (ex: on_short_click + on_long_press) vit ici, jamais
# en `static` dans une lambda (bug historique du double-tap reboot `reboot_armed`,
# corrigé le 05/07/2026 ; le pattern double-tap a depuis été remplacé par des
# overlays de confirmation dans console_sys.yaml — le global a été retiré le 16/07).
globals:
  # Variables globales (vide, prêt à l'emploi)
  - id: active_page
    type: int
    initial_value: '0'
    restore_value: false
  - id: clim_target_temp
    type: float
    initial_value: '20.0'
  - id: volet_target_open
    type: bool
    initial_value: 'true'
  - id: volet_en_mouvement
    type: bool
    initial_value: 'false'
  - id: va_stop_armed
    type: bool
    initial_value: 'false'
    restore_value: false
  - id: clim_hvac_mode
    type: std::string
    initial_value: '"off"'
  - id: clim_preset_mode
    type: std::string
    initial_value: '"none"'
  - id: clim_fan_mode
    type: std::string
    initial_value: '"auto"'
  - id: clim_swing_mode
    type: std::string
    initial_value: '"stop"'
  - id: global_neige
    type: int
    initial_value: '0'
  - id: global_humidite
    type: float
    initial_value: '50.0'
  
  - id: plan_ligne_1
    type: std::string
    initial_value: '""'
  - id: plan_ligne_2
    type: std::string
    initial_value: '""'
  - id: plan_cycle_counter
    type: int
    initial_value: '0'
  - id: boot_complete
    type: bool
    initial_value: 'false'
    restore_value: false
  - id: forecast_page_index
    type: int
    initial_value: '2'
    restore_value: false
  - id: conversation_mode
    type: bool
    initial_value: 'false'
    restore_value: true
  - id: show_switches
    type: bool
    initial_value: 'false'
    restore_value: false

  - id: current_light_entity
    type: std::string
    initial_value: '""'
  - id: has_alerts
    type: bool
    initial_value: 'false'
  - id: has_rain
    type: bool
    initial_value: 'false'
  - id: has_info
    type: bool
    initial_value: 'false'
  - id: has_ha_alert_0
    type: bool
    initial_value: 'false'
  - id: has_ha_alert_1
    type: bool
    initial_value: 'false'
  - id: has_ha_alert_2
    type: bool
    initial_value: 'false'
  - id: has_ha_alert_3
    type: bool
    initial_value: 'false'
  - id: ha_alert_id_0
    type: std::string
    initial_value: '""'
  - id: ha_alert_id_1
    type: std::string
    initial_value: '""'
  - id: ha_alert_id_2
    type: std::string
    initial_value: '""'
  - id: ha_alert_id_3
    type: std::string
    initial_value: '""'
  - id: temp_dismiss_alert_id
    type: std::string
    initial_value: '""'
  - id: info_meteo_dismiss_id
    type: std::string
    initial_value: '""'
  - id: tab5_dismissed_local
    type: std::string
    initial_value: '""'
  - id: current_central_panel
    type: int
    initial_value: '0'
  - id: system_volume
    type: float
    initial_value: '1.0'
  - id: system_muted
    type: bool
    initial_value: 'false'
  # Horodatage du dernier volume poussé DEPUIS la tablette ou HA (millis()).
  # Le rattrapage de `tab5-ha-controls.yaml` s'en sert pour ne pas recopier un
  # volume de haut-parleur encore périmé par-dessus le réglage en cours :
  # `media_player.volume_set` est débouncé de 150 ms et, pendant un glissement,
  # ne part qu'une fois le doigt immobile — le haut-parleur reste donc en retard
  # sur `system_volume` pendant tout le geste.
  - id: volume_push_ts
    type: uint32_t
    initial_value: '0'
  - id: temp_planning_text
    type: std::string
    initial_value: '""'
  - id: is_showing_temp_planning
    type: bool
    initial_value: 'false'
  - id: is_showing_vocal_response
    type: bool
    initial_value: 'false'

  # --- Popup Assistant vocal (assistant_popup.yaml) ---
  # Ouvert => les événements vocaux (demande/réponse) alimentent le popup plein écran
  # au lieu (en plus) du bandeau central 8 s. assist_text_size : 0=S 1=M 2=L (confort lecture).
  - id: assist_popup_open
    type: bool
    initial_value: 'false'
    restore_value: false
  - id: assist_text_size
    type: int
    initial_value: '1'
    restore_value: true

  # Popup calendrier (calendar_popup.yaml) : mois affiché + date du détail ouvert.
  # Partagés entre tab5-scripts.yaml (open/prev/next/today/tap) et
  # tab5-api-logic.yaml (tab5_maj_calendrier_mois/jour) — donc globals, pas de static.
  - id: cal_view_year
    type: int
    initial_value: '0'
    restore_value: false
  - id: cal_view_month
    type: int
    initial_value: '0'
    restore_value: false
  - id: cal_detail_date
    type: std::string
    initial_value: '""'
    restore_value: false

  # --- Réveil matin (tab5-alarm.yaml + alarm_clock.cpp) ---
  # Ce qui est RÉGLABLE vit dans des entités ESPHome (donc exposé à HA et
  # persisté par elles) ; seuls l'état de la sonnerie en cours et les deux
  # valeurs que HA n'a aucune raison de voir passent par des globals.
  - id: alarm_ringing
    type: bool
    initial_value: 'false'
    restore_value: false
  # True seulement si la sonnerie vient d'`alarm_due` (tick planifié / snooze),
  # pas d'un « Tester » HA ou dalle. `tab5_alarm_stop` n'appelle `alarm_dismiss`
  # que dans ce cas — sinon un test du matin mangerait le vrai réveil.
  - id: alarm_ring_scheduled
    type: bool
    initial_value: 'false'
    restore_value: false
  # Numéro du passage de sonnerie en cours : c'est lui qui fait monter le volume
  # progressif (alarm_ring_gain). Remis à 0 à chaque NOUVEAU déclenchement, PAS
  # au retour d'une répétition — un snooze reprend donc au volume déjà atteint.
  - id: alarm_ring_cycle
    type: int
    initial_value: '0'
    restore_value: false
  # millis() du début du passage sonore courant : garde-fou « durée max ».
  - id: alarm_ring_started
    type: uint32_t
    initial_value: '0'
    restore_value: false
  # Masque des jours (bit 0 = lundi). Écrit par les 7 chips de l'écran ET par le
  # select de préréglages exposé à HA — les deux passent par tab5_alarm_refresh,
  # jamais l'un sans l'autre. Défaut : lundi → vendredi.
  - id: alarm_days_mask
    type: uint8_t
    initial_value: '0x1F'
    restore_value: true
  # Plancher de recherche de la prochaine sonnerie, miroir NVS de
  # alarm_skip_floor(). Sans lui, un redémarrage dans les 2 min qui suivent un
  # arrêt (fenêtre de grâce ALARM_GRACE_S) ferait re-sonner le réveil qu'on vient
  # d'arrêter. Restauré vers le C++ au début de tab5_alarm_refresh (sinon le
  # miroir NVS est écrasé par un floor C++ encore à 0).
  - id: alarm_skip_before
    type: uint32_t
    initial_value: '0'
    restore_value: true
  # Tampons de passage vers les services HA (même motif que temp_dismiss_alert_id) :
  # une lambda remplit, l'action homeassistant.service qui suit relit.
  - id: alarm_rdv_speech
    type: std::string
    initial_value: '""'
    restore_value: false
  - id: alarm_rdv_screen
    type: std::string
    initial_value: '""'
    restore_value: false
  - id: alarm_ring_sub
    type: std::string
    initial_value: '""'
    restore_value: false


