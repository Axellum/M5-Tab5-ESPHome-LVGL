# ============================================================================
# [AI-CONTEXT]
# @file tab5-tuiles.yaml
# @role Pièces et tuiles génériques (ADR-0023, 28/09/2026) : pose les widgets que
#       tab5_tuiles.cpp dessine (g_tuiles_ui) et ses deux commandes (événement
#       esphome.tab5_action, tap du volet 3.x). Le modèle, la NVS et le dessin vivent
#       dans tab5_tuiles.cpp ; les définitions arrivent par l'action tab5_maj_tuiles et
#       les états par tab5_maj_emplacements (clés tRT), tab5-api-logic.yaml.
# @architecture_constraint id() n'existe que dans une lambda YAML et l'on_boot de
#       tab5-ha-hmi.yaml n'est pas à nous : tab5_zones_apply (tab5-zones.yaml), lancé à
#       la fin du setup AVANT la première image, exécute ce script en premier. Chargé
#       APRÈS tab5_lvgl : il référence des widgets. Aucun lv_* ici.
# @ai_instruction Un widget de plus pour les tuiles = son champ dans TuilesUI
#       (tab5_custom.h) et sa ligne ici. Les commandes sont des lambdas SANS capture
#       (pointeurs de fonction), comme le rappel des cellules du calendrier.
# ============================================================================

script:
  - id: tab5_tuiles_ui
    then:
      - lambda: |-
          TuilesUI& u = g_tuiles_ui;
          u.calque_jours = id(layer_forecast_daily);
          u.calque_heures = id(layer_forecast_hourly);
          u.calque_ha = id(layer_switches);
          u.pastilles[0] = id(pbar_0);
          u.pastilles[1] = id(pbar_1);
          u.pastilles[2] = id(pbar_2);
          u.pastilles[3] = id(pbar_3);
          u.pastilles[4] = id(pbar_4);
          u.titre_cadre = id(page_title_wrapper);
          u.titre = id(lbl_page_title);
          // Aussi posé par l'on_boot, mais seulement après l'attente de HA (30 s au plus) :
          // le titre d'une pièce peut s'afficher avant.
          g_central_ctx.page_title_sub = id(lbl_page_title_sub);
          u.bouton_ha = id(btn_control_ha);
          u.icone_ha = id(icon_ha);
          u.page = &id(forecast_page_index);
          u.police_meteo = id(font_meteo_card);
          u.police_meteo_petite = id(font_meteo_card_small);
          u.carte[0] = id(sw_card_0);
          u.carte[1] = id(sw_card_1);
          u.carte[2] = id(sw_card_2);
          u.carte[3] = id(sw_card_3);
          u.carte[4] = id(sw_card_4);
          u.carte_icone[0] = id(icon_sw0);
          u.carte_icone[1] = id(icon_sw1);
          u.carte_icone[2] = id(icon_sw2);
          u.carte_icone[3] = id(icon_sw3);
          u.carte_icone[4] = id(icon_sw4);
          u.carte_nom[0] = id(lbl_sw0_title);
          u.carte_nom[1] = id(lbl_sw1_title);
          u.carte_nom[2] = id(lbl_sw2_title);
          u.carte_nom[3] = id(lbl_sw3_title);
          u.carte_nom[4] = id(lbl_sw4_title);
          u.carte_etat[0] = id(lbl_sw0_state);
          u.carte_etat[1] = id(lbl_sw1_state);
          u.carte_etat[2] = id(lbl_sw2_state);
          u.carte_etat[3] = id(lbl_sw3_state);
          u.carte_etat[4] = id(lbl_sw4_state);
          u.popup_tv = id(tv_remote_popup);
          u.popup_clim = id(clim_options_popup);
          u.volet_sens = &id(volet_target_open);
          u.envoyer = [](const char* e, const char* a, const char* v) {
            id(tab5_action).execute(std::string(e), std::string(a), std::string(v));
          };
          u.volet_tap = []() { id(tab5_volet_tap).execute(); };
