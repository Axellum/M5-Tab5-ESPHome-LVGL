# Thème « Craie et ardoise » : une évolution calme du verre ardoise actuel : neutres
# froids, un seul accent sarcelle, les mêmes surfaces et la même police, avec un mode
# clair « craie » où le neutre des dégradés devient l'encre au lieu du blanc.
#
# Esquisse « Craie et ardoise » du 04/10/2026 (Claude Fable 5.1, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
