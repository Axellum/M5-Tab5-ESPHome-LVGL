# Thème « Ultraviolet » : noir pur, cartes à peine plus claires que le noir, filets de
# 1 px, coins courts (8 à 14), texte courant volontairement atténué : seuls l'heure (Anton,
# condensée et lourde) et les grandes valeurs sont blanches ; le jour garde l'identité, gris
# lavande froid, cartes blanches à filet d'encre et bandeau noir.
#
# Esquisse « Obsidienne » du 04/10/2026 (Claude Fable 5.1, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), renommée « Ultraviolet » : le nom « Obsidienne »
# est déjà celui d'un autre thème (esquisse de Claude Sonnet 5.5, obsidienne.yaml). Convertie
# au lot 3 des thèmes (ADR-0029) : couleurs, formes (`formes:`) et polices d'affichage
# (heure, date, titres) ; le reste du texte reste en Roboto. Les rôles absents héritent
# d'Ardoise (même mode).
#
# Non repris : la lueur violette du bouton choisi (ombre de 18 px couleur color_glow, la
# seule ombre de l'esquisse) : highlight_button_border() pose des propriétés locales, il
# faudrait du C++ ; ces boutons gardent la bordure d'accent de l'interface. L'interlettrage
# d'Anton (text_letter_space 2 à 3 px) : `polices:` ne le règle pas. Le texte du bandeau
# prend le texte courant de la palette sombre (zone sombre), pas color_banner_text.
nom: Ultraviolet
ordre: 21
herite: ardoise
zones_sombres: [bandeau]
polices:
  horloge: "Anton@400"
  date: "Anton@400"
  titre: "Anton@400"

formes:
  style_meteo_card_page:
    radius: 10
    sombre: {border_opa: 127}
    clair: {border_opa: 255, border_color: 0x15121F}
  style_bandeau_page:
    bg_color: 0x0B0A10
    bg_grad_dir: NONE
  style_onglet_jour_page:
    bg_grad_dir: NONE
    sombre: {bg_color: 0x1C1924}
    clair: {bg_color: 0xFFFFFF}
  style_onglet_temp_page:
    bg_grad_dir: NONE
    sombre: {bg_color: 0x1C1924}
    clair: {bg_color: 0xFFFFFF}
  style_clim_btn:
    radius: 8
    sombre: {border_opa: 127, bg_color: 0x141218, bg_grad_color: 0x0C0B10}
    clair: {border_opa: 255, bg_color: 0xF7F6FA, bg_grad_color: 0xECEAF2}
  style_modal_card:
    radius: 14
    border_width: 1
    clair: {border_opa: 255}
  style_glass_card:
    radius: 12
    border_width: 1
    sombre: {border_opa: 127}
    clair: {border_opa: 255}

