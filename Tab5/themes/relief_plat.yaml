# Thème « Relief plat » : relief doux sans dégradé : une seule matière à plat, ardoise le
# soir et plâtre le jour, où les boutons, les onglets et les cartes météo ressortent par
# l'ombre portée de l'original de juillet et un liseré clair en haut à gauche, pendant que
# l'horloge, la clim et le bandeau sont creusés d'un ton.
#
# Esquisse « Relief plat » du 04/10/2026 (Claude Sonnet 5.5, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
#
# Non repris : l'état « bouton actif » dessiné par l'esquisse (Domo, mode et ventilation
# actifs) ; ces boutons gardent la bordure d'accent de l'interface.
nom: Relief plat
ordre: 3
herite: ardoise
zones_sombres: [bandeau]

formes:
  style_meteo_card_page:
    bg_grad_dir: NONE
    radius: 24
    border_width: 2
    shadow_width: 30
    shadow_ofs_x: 10
    shadow_ofs_y: 10
    shadow_spread: 0
    border_opa: 255
    shadow_opa: 255
    border_side: [TOP, LEFT]
    sombre: {shadow_color: 0x121416}
    clair: {shadow_color: 0x9AA5B6}
  style_horloge_page:
    shadow_width: 0
    sombre: {bg_color: 0x24272C, border_color: 0x15171A}
    clair: {bg_color: 0xD4DAE2, border_color: 0xAAB4C2}
  style_bandeau_page:
    bg_color: 0x1D2127
    shadow_width: 0
    border_color: 0x101317
  style_clim_carte_page:
    shadow_width: 0
    sombre: {bg_color: 0x24272C, border_color: 0x15171A}
    clair: {bg_color: 0xD4DAE2, border_color: 0xAAB4C2}
  style_onglet_jour_page:
    radius: 16
    border_width: 2
    shadow_width: 12
    shadow_ofs_x: 4
    shadow_ofs_y: 4
  style_onglet_temp_page:
    radius: 16
    border_width: 2
    shadow_width: 12
    shadow_ofs_x: 4
    shadow_ofs_y: 4
  style_clim_btn:
    bg_grad_dir: NONE
    border_width: 2
    shadow_width: 15
    shadow_ofs_x: 5
    shadow_ofs_y: 5
    shadow_spread: 0
    border_opa: 255
    shadow_opa: 255
    border_side: [TOP, LEFT]
    sombre: {bg_color: 0x2D3138, shadow_color: 0x121416}
    clair: {bg_color: 0xE4E8EE, shadow_color: 0x9AA5B6}
  style_modal_card:
    bg_grad_dir: NONE
    radius: 30
    shadow_width: 50
    shadow_ofs_x: 15
    shadow_ofs_y: 15
    shadow_spread: 0
    border_opa: 255
    shadow_opa: 255
    border_side: [TOP, LEFT]
    sombre: {shadow_color: 0x0A0B0C}
    clair: {shadow_color: 0x7F8CA1}
  style_glass_card:
    bg_grad_dir: NONE
    radius: 22
    border_opa: 255
    border_side: [TOP, LEFT]
    sombre: {border_color: 0x15171A}
    clair: {border_color: 0xAAB4C2}

