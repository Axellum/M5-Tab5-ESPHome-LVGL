# Thème « Signalisation » : des panneaux routiers : aplats sans dégradé, coins à 10 px,
# liseré net de 2 px, Overpass (la police des panneaux, dérivée de Highway Gothic),
# libellés en capitales, et le bandeau central traité comme un afficheur noir.
#
# Esquisse « Signalisation » du 04/10/2026 (Claude Fable 5.1, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
nom: Signalisation
ordre: 16
herite: ardoise
zones_sombres: [bandeau]
polices:
  horloge: "Overpass@800"
  date: "Overpass@700"
  titre: "Overpass@700"

formes:
  style_meteo_card_page:
    bg_grad_dir: NONE
    radius: 10
    border_width: 2
    sombre: {border_opa: 216}
    clair: {border_opa: 255}
  style_bandeau_page:
    sombre: {bg_color: 0x0B0D10}
    clair: {bg_color: 0x0B0F14, border_color: 0x5B6B80}
  style_onglet_jour_page:
    radius: 8
  style_onglet_temp_page:
    radius: 8
  style_clim_btn:
    bg_grad_dir: NONE
    radius: 10
    border_width: 2
    sombre: {bg_color: 0x0C3F8F, border_opa: 216}
    clair: {bg_color: 0xE4EDF9, border_opa: 255}
  style_modal_card:
    bg_grad_dir: NONE
    radius: 14
    sombre: {border_opa: 216}
    clair: {border_opa: 255}
  style_glass_card:
    bg_grad_dir: NONE
    radius: 10
    sombre: {border_opa: 216}
    clair: {border_opa: 255}

