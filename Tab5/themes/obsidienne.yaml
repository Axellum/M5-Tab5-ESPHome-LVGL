# Thème « Obsidienne » : un noir violacé et des surfaces anthracite qui ne brillent que
# par leur arête haute, avec un filet champagne comme sur un boîtier de montre :
# l'éclairage vient toujours du haut, donc une carte posée est liserée en haut et une
# cuvette de popup est liserée en bas.
#
# Esquisse « Obsidienne » du 04/10/2026 (Claude Sonnet 5.5, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
nom: Obsidienne
ordre: 14
herite: ardoise
zones_sombres: [bandeau, horloge]
polices:
  horloge: "Gloock@400"
  date: "Gloock@400"
  titre: "Gloock@400"

formes:
  style_meteo_card_page:
    radius: 14
    border_width: 2
    border_side: TOP
    sombre: {border_opa: 191}
    clair: {border_opa: 216}
  style_horloge_page:
    border_opa: 229
    clair: {bg_color: 0x29263F, bg_grad_color: 0x131122}
  style_bandeau_page:
    border_opa: 229
    clair: {bg_color: 0x29263F, bg_grad_color: 0x131122}
  style_clim_btn:
    radius: 12
    border_side: FULL
    sombre: {bg_color: 0x211F31, bg_grad_color: 0x131120, border_opa: 76}
    clair: {bg_color: 0xFFFEFA, bg_grad_color: 0xF2EEE3, border_opa: 107}
  style_modal_card:
    radius: 18
    border_side: FULL
    sombre: {border_opa: 140}
  style_glass_card:
    radius: 14
    border_side: BOTTOM
    sombre: {border_opa: 114}

