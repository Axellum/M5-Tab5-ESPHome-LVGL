# Thème « Bonbon » : un mur rose bonbon où chaque carte et chaque bouton est un sticker :
# bord blanc de 3 px, ombre dure framboise décalée de 5 px vers le bas, coins de 24 à 36,
# boutons blancs (mûre la nuit), onglets rose dragée, heure, date et titres en Pacifico ;
# le bandeau prune noire porte les vigilances (FFFF00, FF0000) dans les deux modes.
#
# Esquisse « Bonbon » du 04/10/2026 (Claude Fable 5.1, galerie audit_tab5/themes_2026-10-04
# hors dépôt), convertie au lot 3 des thèmes (ADR-0029) : couleurs, formes (`formes:`) et
# polices d'affichage (heure, date, titres) ; le reste du texte reste en Roboto. Les rôles
# absents héritent d'Ardoise (même mode).
#
# Écarts à l'esquisse, pour les contrastes de tests/test_themes.py (texte 7:1, sémantique
# 3:1 sur les cartes) : TEXT_PRIMARY framboise assombri le jour (D4126F -> 970D4F) et rose
# éclairci la nuit (FF6EB4 -> FF91C6), GOLD assombri le jour (C98A00 -> B47B00).
#
# Ombres : celles de l'esquisse (cartes du tableau de bord, horloge, clim, bandeau, boutons),
# aucune sur le cadre des popups ni sur les cartes internes (style_meteo_card à 0). L'esquisse
# les estimait à ≈ 512 000 px ombrés sur la page, soit ≈ 50 ms au pire par redessin complet,
# et ≈ 294 000 px (≈ 29 ms) à l'ouverture du popup clim ; rien au repos ni sur le carrousel.
#
# Non repris : l'état « bouton choisi » (bordure d'accent de 3 px au lieu de 2) ; le texte du
# bandeau prend le texte courant de la palette sombre (zone sombre), pas color_banner_text.
nom: Bonbon
ordre: 19
herite: ardoise
zones_sombres: [bandeau]
polices:
  horloge: "Pacifico@400"
  date: "Pacifico@400"
  titre: "Pacifico@400"

formes:
  style_meteo_card_page:
    radius: 28
    border_width: 3
    shadow_width: 1
    shadow_ofs_y: 5
    shadow_opa: 255
    sombre: {border_opa: 127, shadow_color: 0xFF5EAE}
    clair: {border_opa: 255, border_color: 0xFFFFFF, shadow_color: 0xD4126F}
  style_bandeau_page:
    bg_grad_dir: NONE
    sombre: {bg_color: 0x16050F}
    clair: {bg_color: 0x1C0614}
  style_onglet_jour_page:
    radius: 23
    bg_grad_dir: NONE
    shadow_width: 0
    sombre: {bg_color: 0x5E1A4B}
    clair: {bg_color: 0xFFD9E7}
  style_onglet_temp_page:
    radius: 23
    bg_grad_dir: NONE
    shadow_width: 0
    sombre: {bg_color: 0x5E1A4B}
    clair: {bg_color: 0xFFD9E7}
  style_meteo_card:
    shadow_width: 0
  style_clim_btn:
    radius: 24
    border_width: 3
    shadow_width: 1
    shadow_ofs_y: 5
    shadow_opa: 255
    sombre: {border_opa: 127, bg_color: 0x5E1849, bg_grad_color: 0x47123A, shadow_color: 0xFF5EAE}
    clair: {border_opa: 255, bg_grad_color: 0xFFE9F1, shadow_color: 0xD4126F}
  style_clim_btn_page:
    sombre: {bg_color: 0x5E1849, bg_grad_color: 0x47123A}
    clair: {bg_color: 0xFFFFFF, bg_grad_color: 0xFFE9F1}
  style_modal_card:
    radius: 36
    border_width: 3
    sombre: {border_opa: 127}
    clair: {border_opa: 255}
  style_glass_card:
    radius: 28
    border_width: 3
    sombre: {border_opa: 127}
    clair: {border_opa: 255}

