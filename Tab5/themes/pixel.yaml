# Thème « Pixel » : l'écran d'un jeu 8 bits : boîtes de dialogue cadrées de 4 px, coins
# presque droits, aplats sans dégradé, police pixel Jersey 10, palette Sweetie 16 la nuit
# (indigo, cyan, lime) et PICO-8 le jour (pêche, encre marine, prune).
#
# Esquisse « Pixel » du 04/10/2026 (Claude Fable 5.1, galerie audit_tab5/themes_2026-10-04
# hors dépôt), convertie au lot 3 des thèmes (ADR-0029) : couleurs, formes (`formes:`) et
# polices d'affichage (heure, date, titres) ; le reste du texte reste en Roboto. Les rôles
# absents héritent d'Ardoise (même mode).
nom: Pixel
ordre: 18
herite: ardoise
zones_sombres: [bandeau]
polices:
  horloge: "Jersey 10@400"
  date: "Jersey 10@400"
  titre: "Jersey 10@400"

formes:
  style_meteo_card_page:
    bg_grad_dir: NONE
    radius: 6
    border_width: 4
    border_opa: 255
  style_bandeau_page:
    sombre: {bg_color: 0x0A0B16}
    clair: {bg_color: 0x14162A, border_color: 0x5F574F}
  style_onglet_jour_page:
    radius: 4
    sombre: {bg_color: 0x29366F}
    clair: {bg_color: 0xEADFD0}
  style_onglet_temp_page:
    radius: 4
    sombre: {bg_color: 0x29366F}
    clair: {bg_color: 0xEADFD0}
  style_clim_btn:
    bg_grad_dir: NONE
    radius: 6
    border_width: 4
    border_opa: 255
    sombre: {bg_color: 0x333C57, border_color: 0x566C86}
    clair: {bg_color: 0xDDE6F4}
  style_modal_card:
    bg_grad_dir: NONE
    radius: 8
    border_width: 4
    border_opa: 255
  style_glass_card:
    bg_grad_dir: NONE
    radius: 6
    border_width: 4
    border_opa: 255

