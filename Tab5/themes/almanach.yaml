# Thème « Almanach » : une page d'almanach accrochée au mur : papier crème et encre le
# jour, « édition de nuit » encre et parchemin le soir, avec une horloge et une date en
# serif (Fraunces), des cartes plates à filet d'encre, des coins peu arrondis et un ruban
# d'encre pour le bandeau central.
#
# Esquisse « Almanach » du 04/10/2026 (Claude Fable 5.1, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
nom: Almanach
ordre: 9
herite: ardoise
zones_sombres: [bandeau]
polices:
  horloge: "Fraunces@700"
  date: "Fraunces@700"
  titre: "Figtree@700"

formes:
  style_meteo_card_page:
    radius: 10
    sombre: {border_opa: 45}
    clair: {border_opa: 61}
  style_bandeau_page:
    sombre: {bg_color: 0x0E0C09, bg_grad_dir: NONE, border_opa: 63}
    clair: {bg_color: 0x2A241E, bg_grad_color: 0x1B1712, border_opa: 0}
  style_clim_btn:
    radius: 10
    sombre: {border_opa: 45}
    clair: {border_opa: 61}
  style_modal_card:
    radius: 14
    sombre: {border_opa: 76}
    clair: {border_opa: 89}
  style_glass_card:
    radius: 12
    sombre: {border_opa: 63}
    clair: {border_opa: 76}

