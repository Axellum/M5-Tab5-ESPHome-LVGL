# Thème « Terre cuite » : une maison du Sud plutôt qu'une salle de serveurs : murs à la
# chaux (ou veillée brun chaud la nuit), carreaux émaillés posés à plat avec une lèvre de
# terre cuite en bas, bleu canard des volets pour ce qui est choisi, lavande pour le
# salon, chiffres ronds et gras en Nunito.
#
# Esquisse « Terre cuite » du 04/10/2026 (Claude Opus 5.5 (effort extra), galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
nom: Terre cuite
ordre: 7
herite: ardoise
polices:
  horloge: "Nunito@800"
  date: "Nunito@800"
  titre: "Nunito@800"

