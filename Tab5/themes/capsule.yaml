# Thème « Capsule » : du plastique moulé des années 70 : tout est capsule (cartes à 36 px,
# boutons en pilule), un dégradé vertical doux pour le brillant, une seule arête épaisse
# en bas (tan sur les cartes, orange sur ce qui se touche), Fredoka ronde et grasse,
# crème, chocolat, teal et avocat le jour, salon chocolat et orange la nuit.
#
# Esquisse « Capsule » du 04/10/2026 (Claude Fable 5.1, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
nom: Capsule
ordre: 17
herite: ardoise
zones_sombres: [bandeau]
polices:
  horloge: "Fredoka@700"
  date: "Fredoka@700"
  titre: "Fredoka@700"

formes:
  style_meteo_card_page:
    radius: 36
    border_width: 4
    border_opa: 255
    border_side: BOTTOM
    clair: {bg_grad_color: 0xF7ECD6}
  style_bandeau_page:
    bg_grad_dir: NONE
    sombre: {bg_color: 0x120907, border_color: 0xFF7A33}
    clair: {bg_color: 0x2A1810, border_color: 0xE8571A}
  style_onglet_jour_page:
    radius: 23
  style_onglet_temp_page:
    radius: 23
  style_clim_btn:
    radius: 999
    border_width: 4
    border_opa: 255
    border_side: BOTTOM
    sombre: {bg_color: 0x553424, bg_grad_color: 0x42281B, border_color: 0xFF7A33}
    clair: {bg_color: 0xFFFFFF, bg_grad_color: 0xFBF3E4, border_color: 0xE8571A}
  style_modal_card:
    radius: 40
    border_width: 5
    border_opa: 255
    border_side: BOTTOM
  style_glass_card:
    radius: 32
    border_width: 5
    border_opa: 255
    border_side: BOTTOM

