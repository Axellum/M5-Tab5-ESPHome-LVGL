# Thème « Sorbet » : une vitrine de confiseur : cartes en coque de macaron lilas, boutons
# menthe, onglets blancs, toutes cerclées d'un bord blanc de 2 px, sans ombre, heure, date et
# titres en Quicksand ; encres poudrées mais foncées, et un bandeau indigo nuit, seul aplat
# sombre du jour, qui porte les vigilances (FFFF00, FF0000).
#
# Esquisse « Sorbet » du 04/10/2026 (Claude Fable 5.1, galerie audit_tab5/themes_2026-10-04
# hors dépôt), convertie au lot 3 des thèmes (ADR-0029) : couleurs, formes (`formes:`) et
# polices d'affichage (heure, date, titres) ; le reste du texte reste en Roboto. Les rôles
# absents héritent d'Ardoise (même mode).
#
# Écarts à l'esquisse, pour les contrastes de tests/test_themes.py (texte 7:1, sémantique
# 3:1 sur les cartes) : TEXT_PRIMARY violet poudré assombri le jour (5B4E9E -> 4B4082),
# GOLD assombri le jour (B8860B -> A87A0A).
#
# Non repris : le dégradé vertical de toute la page (rose dragée -> bleu layette, jeton
# color_bg_lo) : le fond des pages n'est pas un style de `formes:` (STYLES_FORMES), la page
# reste à plat sur BG ; le texte du bandeau prend le texte courant de la palette sombre
# (zone sombre), pas color_banner_text.
nom: Sorbet
ordre: 20
herite: ardoise
zones_sombres: [bandeau]
polices:
  horloge: "Quicksand@700"
  date: "Quicksand@700"
  titre: "Quicksand@700"

formes:
  style_meteo_card_page:
    radius: 26
    border_width: 2
    clair: {border_opa: 255, border_color: 0xFFFFFF}
  style_bandeau_page:
    bg_grad_dir: NONE
    sombre: {bg_color: 0x1C1A2E}
    clair: {bg_color: 0x332D55}
  style_onglet_jour_page:
    radius: 23
    bg_grad_dir: NONE
    sombre: {bg_color: 0x4A4670}
    clair: {bg_color: 0xFFFFFF}
  style_onglet_temp_page:
    radius: 23
    bg_grad_dir: NONE
    sombre: {bg_color: 0x4A4670}
    clair: {bg_color: 0xFFFFFF}
  style_clim_btn:
    radius: 20
    border_width: 2
    sombre: {bg_color: 0x3C4F52, bg_grad_color: 0x324345}
    clair: {border_opa: 255, bg_color: 0xEAF7F0, bg_grad_color: 0xD8EFE3}
  style_clim_btn_page:
    sombre: {bg_color: 0x3C4F52, bg_grad_color: 0x324345}
    clair: {bg_color: 0xEAF7F0, bg_grad_color: 0xD8EFE3}
  style_modal_card:
    radius: 32
    clair: {border_opa: 255}
  style_glass_card:
    radius: 26
    clair: {border_opa: 255}

