# Thème « Almanach imprimé » : une page d'almanach au mur : papier chaud le jour, nuit
# d'encre le soir, traits nets de 2 px, chiffres et titres en gros empattement, commandes
# en bâton, et deux panneaux d'encre (l'horloge et le bandeau central) qui ancrent la
# page.
#
# Esquisse « Almanach » du 04/10/2026 (Claude Sonnet 5.5, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
