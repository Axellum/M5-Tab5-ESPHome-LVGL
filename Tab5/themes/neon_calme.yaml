# Thème « Néon calme » : le néon n'est plus un décor mais un signal : filets cyan discrets
# sur ce qui s'affiche, liseré magenta sur ce qui se touche, trait plein seulement pour
# l'état actif, le tout sur un noir presque total et des angles vifs.
#
# Esquisse « Néon calme » du 04/10/2026 (Claude Sonnet 5.5, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
#
# Non repris : l'état « bouton actif » dessiné par l'esquisse (Domo, mode et ventilation
# actifs) ; ces boutons gardent la bordure d'accent de l'interface.
nom: Néon calme
ordre: 11
herite: ardoise
zones_sombres: [bandeau]
polices:
  horloge: "Oxanium@700"
  date: "Oxanium@700"
  titre: "Oxanium@700"

formes:
  style_meteo_card_page:
    radius: 0
    bg_main_stop: 77
    bg_grad_stop: 255
    sombre: {border_opa: 86}
    clair: {border_opa: 140}
  style_bandeau_page:
    border_width: 2
    border_side: [TOP, BOTTOM]
    sombre: {bg_color: 0x060A11, bg_grad_color: 0x091B27, border_opa: 140}
    clair: {bg_color: 0x0B121C, bg_grad_color: 0x0A2432, border_opa: 153}
  style_onglet_jour_page:
    border_width: 2
    border_opa: 191
    border_side: BOTTOM
  style_onglet_temp_page:
    border_width: 2
    border_opa: 191
    border_side: TOP
  style_clim_btn:
    radius: 0
    bg_main_stop: 77
    bg_grad_stop: 255
    sombre: {bg_color: 0x070C14, bg_grad_color: 0x0A2230, border_color: 0xFF3DC8, border_opa: 117}
    clair: {bg_color: 0xFAFCFE, bg_grad_color: 0xD6ECF3, border_color: 0xB2007D, border_opa: 153}
  style_modal_card:
    radius: 0
    sombre: {border_opa: 204}
    clair: {border_opa: 229}
  style_glass_card:
    radius: 0
    border_width: 1
    sombre: {border_opa: 107}

