# Thème « Zen Sumi » : le décor est d'encre, noir profond ou gravier clair, sans verre ni
# fond de carte, et la couleur ne sert qu'au sens : matcha, ocre, vermillon et indigo pour
# les états.
#
# Esquisse « Zen Sumi » du 04/10/2026 (Claude Sonnet 5.5, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
nom: Zen Sumi
ordre: 12
herite: ardoise
zones_sombres: [bandeau]
polices:
  horloge: "Murecho@300"
  date: "Murecho@400"
  titre: "Murecho@400"

formes:
  style_meteo_card_page:
    bg_grad_dir: NONE
    radius: 0
    border_side: BOTTOM
    sombre: {border_opa: 102}
    clair: {border_color: 0x55534E, border_opa: 107}
  style_bandeau_page:
    border_width: 0
    sombre: {bg_color: 0x1C1C1F}
    clair: {bg_color: 0x17171A}
  style_clim_btn:
    bg_grad_dir: NONE
    radius: 6
    border_opa: 96
  style_clim_btn_page:
    border_side: FULL
    sombre: {bg_color: 0x19191B, border_opa: 102}
    clair: {bg_color: 0xF8F7F3, border_opa: 107}
  style_modal_card:
    bg_grad_dir: NONE
    radius: 10
    border_width: 1
    sombre: {border_opa: 140}
  style_glass_card:
    bg_grad_dir: NONE
    radius: 0
    border_width: 1
    border_opa: 96
    border_side: TOP
    sombre: {bg_color: 0x141415}
    clair: {bg_color: 0xF4F3EF}

