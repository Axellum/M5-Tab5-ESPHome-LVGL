# Thème « Platine et or » : un écrin d'horloger : fond Vantablack, verre anthracite
# neutre, liseré platine d'un pixel et un seul métal chaud, l'or champagne, réservé au
# cadran, à la date, aux titres de section, au choix en cours et au cadre des popups ;
# saphir, émeraude et rubis ne servent que d'états, comme des pierres serties.
#
# Esquisse « Platine et or » du 04/10/2026 (Claude Sonnet 5.5, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
nom: Platine et or
ordre: 15
herite: ardoise
zones_sombres: [bandeau]
polices:
  horloge: "Bodoni Moda@700"
  date: "Manrope@700"
  titre: "Manrope@700"

formes:
  style_meteo_card_page:
    radius: 12
    sombre: {border_opa: 86}
    clair: {border_opa: 102}
  style_horloge_page:
    sombre: {border_color: 0xD5B26A, border_opa: 127}
    clair: {border_color: 0x7F5F08, border_opa: 140}
  style_bandeau_page:
    clair: {bg_color: 0x272834, bg_grad_color: 0x101117, border_color: 0xC9AC66, border_opa: 153}
  style_clim_btn:
    radius: 10
    sombre: {bg_color: 0x22232D, bg_grad_color: 0x0E0F14, border_opa: 86}
    clair: {bg_color: 0xFDFDFE, bg_grad_color: 0xECEDF3, border_opa: 102}
  style_modal_card:
    radius: 16
    sombre: {border_color: 0xD5B26A}
    clair: {border_color: 0x835A0A, border_opa: 165}
  style_glass_card:
    radius: 12
    sombre: {border_opa: 127}

