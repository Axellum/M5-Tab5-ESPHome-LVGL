# Thème « Ardoise » : le verre ardoise d'origine de l'interface (« Dark Mode Slate »,
# Tailwind Slate), et son mode clair « craie » : cartes blanches sur gris clair, encre
# ardoise, même matière, même police, même géométrie (esquisse « Craie et ardoise »
# du 04/10/2026, Claude Opus 5.5, audit_tab5/themes_2026-10-04 hors dépôt).
#
# Un thème = ce fichier (ADR-0029, lot 2). tools/gen_themes.py le traduit en C++
# (THEMES[], Tab5/tab5_tokens.h) et l'ajoute au select « Thème » ; `--check` échoue en CI si le
# C++ est périmé. Couleurs en 0xRRGGBB (sans guillemets : YAML les lit comme des
# entiers). Chaque mode donne TOUS les rôles de `struct Palette` (tab5_tokens.h),
# sauf le verre pré-mélangé (GLASS_HI_PAGE / LO_PAGE sur BG à 58 %, GLASS_HI_MODAL /
# LO_MODAL sur MODAL_SCRIM à 88 %) : calculé par le générateur s'il est absent.
#
# Le premier thème (`ordre: 1`) en sombre est PALETTE_SOMBRE, celle des jeux : ses
# valeurs ne changent pas sans changer l'écran (le rendu hors tablette le voit).
nom: Ardoise
ordre: 1

sombre:
  # --- Fonds et verre ---
  BG: 0x0B1120                 # ardoise profonde
  GLASS_HI: 0x2C3A52
  GLASS_LO: 0x131C2C
  GLASS_RIM: 0x93A3BC
  MODAL_SCRIM: 0x05080F
  CONSOLE_BG: 0x0A0E16
  ARC_TRACK: 0x2A2D35
  # --- Texte ---
  TEXT_SOFT: 0xF1F5F9          # slate-100
  TEXT_PRIMARY: 0xFFFFFF
  TEXT_DIM: 0x94A3B8           # slate-400
  CONSOLE_LABEL: 0x8595AD
  CONSOLE_VALUE: 0xFFFFFF
  ICON_MUTED: 0x555555
  TEXT_ON_ACCENT: 0xF1F5F9     # le texte courant, comme avant ce rôle
  # --- Sémantiques ---
  SUCCESS: 0x34D399            # emerald-400
  WARNING: 0xFBBF24            # amber-400
  ERROR: 0xFB7185              # rose-400
  INFO: 0x38BDF8               # sky-400
  GOLD: 0xFCD34D               # amber-300
  INACTIVE: 0x334155           # slate-700
  BAR_INACTIVE: 0x334155       # slate-700
  WARM_PINK: 0xF472B6          # pink-400
  ACCENT: 0x22D3EE             # cyan-400
  ACCENT_ALT: 0xA78BFA         # violet-400
  EARLY: 0xFB923C              # orange-400
  PAST: 0x64748B               # slate-500
  TEMP_MAX: 0xF87171           # red-400
  TEMP_MIN: 0x38BDF8           # sky-400
  RAIN_VALUE: 0xFB923C         # orange-400
  # --- Vigilance ---
  ALERT_YELLOW: 0xFFFF00
  ALERT_ORANGE: 0xFBBF24       # WARNING, comme avant ce rôle
  ALERT_RED: 0xFF0000
  ALERT_DATE_YELLOW: 0xFCF3CF
  ALERT_DATE_ORANGE: 0xF8C471
  ALERT_DATE_RED: 0xF1948A
  # --- Climatisation ---
  CLIM_COOL_ACTIVE: 0x4D94FF
  CLIM_COOL_INACTIVE: 0x60748F
  CLIM_HEAT_ACTIVE: 0xFF4D4D
  CLIM_HEAT_INACTIVE: 0x8F6060
