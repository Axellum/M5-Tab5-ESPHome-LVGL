# Thème « Graphite » : le thème actuel en plus calme : des aplats neutres à la place du
# verre ardoise, un seul accent bleu et des couleurs réservées aux états (vert, ambre,
# rouge), avec la police et la géométrie du firmware inchangées.
#
# Esquisse « Graphite » du 04/10/2026 (Claude Sonnet 5.5, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
nom: Graphite
ordre: 4
herite: ardoise

