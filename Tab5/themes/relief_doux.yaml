# Thème « Relief doux » : une seule matière, ardoise le soir et plâtre le jour : les
# boutons, les onglets et les cartes météo ressortent d'un liseré clair en haut à gauche
# et d'une ombre courte en bas à droite, pendant que l'horloge, la clim, le bandeau et les
# cadres des popups s'enfoncent en creux.
#
# Esquisse « Relief doux » du 04/10/2026 (Claude Sonnet 5.5, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
#
# Non repris : l'état « bouton actif » dessiné par l'esquisse (Domo, mode et ventilation
# actifs) ; ces boutons gardent la bordure d'accent de l'interface.
nom: Relief doux
ordre: 2
herite: ardoise
zones_sombres: [bandeau]
polices:
  horloge: "Nunito@800"
  date: "Nunito@800"
  titre: "Nunito@800"

formes:
  style_meteo_card_page:
    radius: 24
    border_width: 2
    shadow_width: 10
    shadow_ofs_x: 5
    shadow_ofs_y: 5
    border_opa: 255
    shadow_opa: 255
    border_side: [TOP, LEFT]
    sombre: {shadow_color: 0x131517}
    clair: {shadow_color: 0x9AA6B8}
  style_horloge_page:
    shadow_width: 0
    sombre: {bg_color: 0x1F2226, bg_grad_color: 0x2A2E34, border_color: 0x131517}
    clair: {bg_color: 0xD3D9E1, bg_grad_color: 0xE8ECF1, border_color: 0xA9B3C0}
  style_bandeau_page:
    bg_color: 0x14171B
    bg_grad_color: 0x1F2328
    shadow_width: 0
    border_color: 0x0C0E10
  style_clim_carte_page:
    shadow_width: 0
    sombre: {bg_color: 0x1F2226, bg_grad_color: 0x2A2E34, border_color: 0x131517}
    clair: {bg_color: 0xD3D9E1, bg_grad_color: 0xE8ECF1, border_color: 0xA9B3C0}
  style_onglet_jour_page:
    radius: 999
    border_width: 2
    shadow_width: 6
    shadow_ofs_x: 3
    shadow_ofs_y: 3
  style_onglet_temp_page:
    radius: 999
    border_width: 2
    shadow_width: 6
    shadow_ofs_x: 3
    shadow_ofs_y: 3
  style_clim_btn:
    radius: 22
    border_width: 2
    shadow_width: 6
    shadow_ofs_x: 3
    shadow_ofs_y: 3
    border_opa: 255
    shadow_opa: 255
    border_side: [TOP, LEFT]
    sombre: {bg_color: 0x363C44, bg_grad_color: 0x25292E, shadow_color: 0x131517}
    clair: {bg_color: 0xEFF2F6, bg_grad_color: 0xDADFE7, shadow_color: 0x9AA6B8}
  style_modal_card:
    radius: 30
    border_opa: 255
    border_side: [TOP, LEFT]
  style_glass_card:
    radius: 26
    border_opa: 255
    border_side: [TOP, LEFT]
    sombre: {border_color: 0x131517}
    clair: {border_color: 0xA9B3C0}

