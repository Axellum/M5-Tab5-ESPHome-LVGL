# Thème « Bento » : un plateau gris bleuté et des compartiments à la teinte franche,
# cernés d'un trait net : chaque zone de l'écran (assistant, horloge, boutons, prévisions)
# a sa couleur, et le bandeau central reste noir pour que les vigilances jaune et rouge se
# lisent toujours.
#
# Esquisse « Bento » du 04/10/2026 (Claude Sonnet 5.5, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
nom: Bento
ordre: 13
herite: ardoise
polices:
  horloge: "Familjen Grotesk@700"
  date: "Familjen Grotesk@700"
  titre: "Familjen Grotesk@700"

