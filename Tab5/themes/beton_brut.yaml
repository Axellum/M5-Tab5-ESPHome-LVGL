# Thème « Béton brut » : la signalétique de chantier : angles droits, traits noirs de 4
# px, ombres dures décalées, et un jaune de sécurité réservé à ce qu'on touche ou choisit.
#
# Esquisse « Béton brut » du 04/10/2026 (Claude Sonnet 5.5, galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
nom: Béton brut
ordre: 10
herite: ardoise
zones_sombres: [bandeau, horloge]
polices:
  horloge: "Barlow Condensed@800"
  date: "Barlow Semi Condensed@700"
  titre: "Barlow Semi Condensed@700"

formes:
  style_meteo_card_page:
    bg_grad_dir: NONE
    radius: 0
    border_width: 4
    shadow_width: 2
    shadow_ofs_x: 6
    shadow_ofs_y: 6
    border_opa: 255
    shadow_opa: 255
    sombre: {shadow_color: 0x46453F}
    clair: {shadow_color: 0x0A0A0A}
  style_horloge_page:
    sombre: {bg_color: 0x000000, shadow_width: 0, border_color: 0xFFCC00}
    clair: {bg_color: 0x0A0A0A, border_color: 0x0A0A0A, shadow_color: 0xFFCC00}
  style_bandeau_page:
    sombre: {bg_color: 0x000000, shadow_width: 0, border_color: 0xFFCC00}
    clair: {bg_color: 0x0A0A0A, border_color: 0x0A0A0A, shadow_color: 0xFFCC00}
  style_onglet_jour_page:
    border_width: 3
    shadow_width: 0
    clair: {bg_color: 0xFFCC00}
  style_clim_btn:
    bg_grad_dir: NONE
    radius: 0
    border_width: 3
    border_opa: 255
    sombre: {bg_color: 0x2A2A27}
    clair: {bg_color: 0xFFFFFF}
  style_modal_card:
    bg_grad_dir: NONE
    radius: 0
    border_width: 4
    border_opa: 255
    sombre: {border_color: 0xFFCC00}
    clair: {shadow_width: 2, shadow_ofs_x: 8, shadow_ofs_y: 8, shadow_color: 0x0A0A0A, shadow_opa: 255}
  style_glass_card:
    bg_grad_dir: NONE
    radius: 0
    border_width: 4
    border_opa: 255

