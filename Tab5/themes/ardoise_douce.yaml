# Thème « Ardoise douce » : le verre ardoise d'aujourd'hui avec une teinte de moins : gris
# neutres, accents désaturés au même niveau de clarté, et un mode clair « craie » (cartes
# blanches sur gris clair, encre ardoise) qui garde la même matière, la même police et la
# même géométrie.
#
# Esquisse « Craie et ardoise » du 04/10/2026 (Claude Opus 5.5 (effort extra), galerie
# audit_tab5/themes_2026-10-04 hors dépôt), convertie au lot 3 des thèmes (ADR-0029) :
# couleurs, formes (`formes:`) et polices d'affichage (heure, date, titres) ; le reste du
# texte reste en Roboto. Les rôles absents héritent d'Ardoise (même mode).
