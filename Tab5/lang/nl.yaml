# --- Règles du jeu ---
"RÈGLES DU JEU": "SPELREGELS"
"Réunissez les 6 parts de camembert, puis rejoignez le centre pour la question finale.\n\nLancez le dé avec le bouton, ou secouez la tablette.\nTouchez ensuite l'une des cases surlignées : vous choisissez votre direction,\nmais jamais de demi-tour en cours de déplacement.\n\nBonne réponse : vous rejouez.   Mauvaise réponse : au suivant.\n\nLes 6 grandes cases cerclées de blanc sont les QG de catégorie :\nelles seules rapportent une part de camembert.\nUne case violette à point blanc = Rejouer, relancez immédiatement le dé.\nLe centre sans les 6 parts = question de la catégorie de votre choix.\nLe centre avec les 6 parts = finale : l'équipe suivante choisit la catégorie,\net une bonne réponse remporte la partie.": "Verzamel alle 6 partjes en ga dan naar het midden voor de slotvraag.\n\nGooi de dobbelsteen met de knop, of schud de tablet.\nTik dan op een van de gemarkeerde vakken: je kiest zelf je richting,\nmaar tijdens een zet mag je nooit omkeren.\n\nGoed antwoord: je gooit opnieuw.   Fout antwoord: volgende team.\n\nDe 6 grote wit omrande vakken zijn de hoofdvakken per categorie:\nalleen die leveren een partje op.\nEen paars vak met witte stip = Nog eens, gooi meteen opnieuw.\nHet midden zonder de 6 partjes = vraag uit een categorie naar keuze.\nHet midden met alle 6 partjes = finale: het volgende team kiest de categorie,\nen een goed antwoord wint het spel."
