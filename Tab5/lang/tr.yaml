# ============================================================================
# [AI-CONTEXT]
# @file lang/tr.yaml — Turkish translation of the Tab5 screen.
# @role Flat mapping « French text as written in the code » → « Turkish ».
#       tools/gen_i18n.py turns it into Tab5/tab5_i18n_data.h (see its header for
#       adding a language: copy en.yaml, change _langue/_code/_index, translate).
#       Same keys, same order and same section comments as en.yaml.
# @ai_instruction
#   - The KEY must be byte-for-byte the French text of the code (accents, spaces,
#     punctuation). A key that no longer exists anywhere fails tests/test_i18n.py.
#   - Keep printf specifiers (%d, %s, %02d…) in the same order, and {names} as is
#     (a {name} may move inside the sentence: Turkish word order differs).
#   - Only characters of the fonts' `&latin1` set (tab5-styles.yaml): Latin-1
#     (ç Ç ö Ö ü Ü included) plus the Windows-1252 punctuation (“ ” ‘ ’ … – —),
#     plus the Turkish letters ğ Ğ ı İ ş Ş added to the glyph set. Nothing else
#     (no lira sign, no arrows).
#   - Capitals are written by hand, Turkish way: i → İ and ı → I (« AYARLAR »,
#     « İPTAL », « SİSTEM », « KAPALI »). Never rely on an automatic upper-casing.
#   - Long day and month names are written WITH an initial capital (Pazartesi,
#     Ağustos): the firmware only capitalizes an ASCII first letter (fr_capitalized).
#   - Never glue a suffix to a variable text or number (%d'de, %s'den…): the vowel
#     harmony depends on the value. Rephrase (« Saat: %s », « sonra »).
#   - "context|text" keys disambiguate a word with two meanings (tr_ctx in code).
#   - Never translate what Home Assistant reads (entity names, select options,
#     payload codes): only what the screen shows or the tablet says.
#   - Style: informal « sen » when a pronoun cannot be avoided, short imperatives
#     on buttons (İptal, Kapat, Tamam…). The screen is small: a text should not be
#     wider than the widest of the French, English, German and Dutch ones (usual
#     abbreviations: Maks., Min., Sıc., Sev., dk, sn…).
# ============================================================================
_langue: Türkçe
_code: tr
_index: 6
_statut: complet   # couvre tout ce que l'écran affiche (tests/test_i18n.py)

