# --- Règles du jeu ---
"RÈGLES DU JEU": "SPIELREGELN"
"Réunissez les 6 parts de camembert, puis rejoignez le centre pour la question finale.\n\nLancez le dé avec le bouton, ou secouez la tablette.\nTouchez ensuite l'une des cases surlignées : vous choisissez votre direction,\nmais jamais de demi-tour en cours de déplacement.\n\nBonne réponse : vous rejouez.   Mauvaise réponse : au suivant.\n\nLes 6 grandes cases cerclées de blanc sont les QG de catégorie :\nelles seules rapportent une part de camembert.\nUne case violette à point blanc = Rejouer, relancez immédiatement le dé.\nLe centre sans les 6 parts = question de la catégorie de votre choix.\nLe centre avec les 6 parts = finale : l'équipe suivante choisit la catégorie,\net une bonne réponse remporte la partie.": "Alle 6 Wissensecken sammeln, dann zur Finalfrage in die Mitte ziehen.\n\nWürfeln per Knopf oder durch Schütteln des Tablets.\nDann ein markiertes Feld antippen: Die Richtung ist frei wählbar,\naber während des Zugs wird nie umgekehrt.\n\nRichtige Antwort: nochmal würfeln.   Falsche Antwort: nächstes Team.\n\nDie 6 großen, weiß umrandeten Felder sind die Kategorie-Hauptfelder:\nnur sie bringen eine Wissensecke.\nEin lila Feld mit weißem Punkt = Nochmal: sofort erneut würfeln.\nDie Mitte ohne alle 6 Ecken = Frage aus einer Kategorie nach Wahl.\nDie Mitte mit allen 6 Ecken = Finale: Das nächste Team wählt die Kategorie,\nund eine richtige Antwort gewinnt das Spiel."
