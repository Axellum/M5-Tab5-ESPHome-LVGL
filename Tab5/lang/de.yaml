# ============================================================================
# [AI-CONTEXT]
# @file lang/de.yaml — German translation of the Tab5 screen.
# @role Flat mapping « French text as written in the code » → « German ».
#       tools/gen_i18n.py turns it into Tab5/socle/tab5_i18n_data.h (see its header for
#       adding a language: copy en.yaml, change _langue/_code/_index, translate).
# @ai_instruction
#   - The KEY must be byte-for-byte the French text of the code (accents, spaces,
#     punctuation). A key that no longer exists anywhere fails tests/test_i18n.py.
#   - Keep printf specifiers (%d, %s, %02d…) in the same order, and {names} as is.
#   - Only characters of the fonts' `&latin1` set (tab5-styles.yaml): Latin-1 plus
#     the Windows-1252 punctuation („ “ ‚ ‘ ’ … – —). Anything else (capital ẞ,
#     arrows…) shows as an empty box: write « SS » in capitals, never ẞ.
#   - "context|text" keys disambiguate a word with two meanings (tr_ctx in code).
#   - Never translate what Home Assistant reads (entity names, select options,
#     payload codes): only what the screen shows or the tablet says.
#   - Screen space is tight: keep each text no longer than the French or the
#     English one (usual abbreviations: Mo, Di, Temp., max., Geb.…). Informal
#     « du » when a pronoun cannot be avoided; neutral infinitives otherwise.
# ============================================================================
_langue: Deutsch
_code: de
_index: 2
_statut: complet   # couvre tout ce que l'écran affiche (tests/test_i18n.py)

