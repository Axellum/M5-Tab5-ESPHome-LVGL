# --- Trial Poursuite — quiz interface; the questions stay French (trivia_game.cpp) ---
# Lot 4b — interface du quiz « Trial Poursuite » (Tab5/jeux/trivia_game.cpp).
# Les questions et réponses (Tab5/jeux/trivia_questions.h) restent en français.
# Déjà plus haut, non répétées ici : Réglages, Retour, Confirmer, Annuler.
# Italien : part de camembert = spicchio (vocabulaire du Trivial Pursuit italien,
# plutôt que « triangolino », familier), case = casella, dé = dado, équipe = squadra.
# Catégories de l'édition italienne : Geografia, Spettacolo, Storia, Arte e
# Letteratura, Scienze e Natura, Sport e Tempo libero.
# --- Catégories (CAT_NAMES, CAT_SHORT) ---
"Géographie": "Geografia"
"Divertissement": "Spettacolo"
"Histoire": "Storia"
"Arts & Littérature": "Arte & Letteratura"
"Sciences & Nature": "Scienze & Natura"
"Sports & Loisirs": "Sport & Tempo libero"
"Divertis.": "Spettacolo"
"Arts": "Arte"
"Sciences": "Scienze"
"Sports": "Sport"
# --- Difficulté et temps de réponse ---
"Facile": "Facile"
"Moyen": "Medio"
"Difficile": "Difficile"
"Questions faciles": "Domande facili"
"Faciles + moyennes": "Facili + medie"
"Moyennes + difficiles": "Medie + difficili"
"Illimité": "Illimitato"
# --- Règles du jeu ---
"RÈGLES DU JEU": "REGOLE"
"Réunissez les 6 parts de camembert, puis rejoignez le centre pour la question finale.\n\nLancez le dé avec le bouton, ou secouez la tablette.\nTouchez ensuite l'une des cases surlignées : vous choisissez votre direction,\nmais jamais de demi-tour en cours de déplacement.\n\nBonne réponse : vous rejouez.   Mauvaise réponse : au suivant.\n\nLes 6 grandes cases cerclées de blanc sont les QG de catégorie :\nelles seules rapportent une part de camembert.\nUne case violette à point blanc = Rejouer, relancez immédiatement le dé.\nLe centre sans les 6 parts = question de la catégorie de votre choix.\nLe centre avec les 6 parts = finale : l'équipe suivante choisit la catégorie,\net une bonne réponse remporte la partie.": "Raccogli i 6 spicchi, poi raggiungi il centro per la domanda finale.\n\nTira il dado con il pulsante, o scuoti il tablet.\nPoi tocca una delle caselle evidenziate: scegli tu la direzione,\nma senza mai tornare indietro durante lo spostamento.\n\nRisposta esatta: tiri ancora.   Risposta sbagliata: passi la mano.\n\nLe 6 grandi caselle cerchiate di bianco sono le sedi di categoria:\nsolo loro fanno vincere uno spicchio.\nUna casella viola con un punto bianco = Tira ancora, ritira subito il dado.\nIl centro senza i 6 spicchi = domanda della categoria che preferisci.\nIl centro con i 6 spicchi = finale: la squadra successiva sceglie la categoria,\ne una risposta esatta vince la partita."
# --- Plateau : dé, bandeau d'état, HUD ---
"LANCER LE DÉ": "TIRA IL DADO"
"ou secouez la tablette": "o scuoti il tablet"
