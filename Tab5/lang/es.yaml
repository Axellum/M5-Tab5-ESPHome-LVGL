# --- Règles du jeu ---
"RÈGLES DU JEU": "REGLAS DEL JUEGO"
"Réunissez les 6 parts de camembert, puis rejoignez le centre pour la question finale.\n\nLancez le dé avec le bouton, ou secouez la tablette.\nTouchez ensuite l'une des cases surlignées : vous choisissez votre direction,\nmais jamais de demi-tour en cours de déplacement.\n\nBonne réponse : vous rejouez.   Mauvaise réponse : au suivant.\n\nLes 6 grandes cases cerclées de blanc sont les QG de catégorie :\nelles seules rapportent une part de camembert.\nUne case violette à point blanc = Rejouer, relancez immédiatement le dé.\nLe centre sans les 6 parts = question de la catégorie de votre choix.\nLe centre avec les 6 parts = finale : l'équipe suivante choisit la catégorie,\net une bonne réponse remporte la partie.": "Reúne los 6 quesitos y luego ve al centro para la pregunta final.\n\nTira el dado con el botón o sacude la tableta.\nDespués toca una de las casillas resaltadas: tú eliges la dirección,\npero nunca puedes dar media vuelta durante el movimiento.\n\nAcierto: vuelves a tirar.   Fallo: turno del siguiente.\n\nLas 6 casillas grandes con borde blanco son las sedes de categoría:\nsolo ellas dan un quesito.\nCasilla violeta con punto blanco = Otra tirada: tira el dado de nuevo.\nEl centro sin los 6 quesitos = pregunta de la categoría que elijas.\nEl centro con los 6 quesitos = final: el equipo siguiente elige la categoría,\ny una respuesta correcta gana la partida."
