# [AI-CONTEXT] Template paramétré (!include+vars), réutilisé 16x par rangee_panneau.yaml :
# un élément d'une ligne de capteurs d'une zone à lignes — la rangée sous l'horloge
# (ADR-0031) et le panneau « Ok Nabu » (lot 3, ADR-0041) —, 4 par panneau, 2 panneaux par
# zone. Var : el (« a0 » … « b3 » sous l'horloge, « na0 » … « nb3 » dans le panneau Ok
# Nabu : panneau, élément 0 à 3). clickable: false : le toucher va à la zone tactile.
# Icône + valeur côte à côte, ou l'une au-dessus de l'autre : tab5_rangee.cpp (remplir)
# choisit les polices et le sens (flex ROW / COLUMN) selon la place, masque la valeur
# d'un appareil qui n'en a pas et l'élément vide. pad_column = kEcart de tab5_rangee.cpp.
# Couleurs posées par le C++ (règle 8). L'icône est en mdi_font_32 ici, en 45 ou 70 px
# selon la ligne : la palette des tuiles est dans les trois (MDI_CODE_TARGETS,
# motif rangee_icone_*). La valeur prend la police de la date du thème (45 px) quand le
# C++ ne lui en pose pas une plus petite.
obj:
  id: "rangee_el_${el}"
  width: SIZE_CONTENT
  height: SIZE_CONTENT
  styles: style_transparent
  clickable: false
  scrollable: false
  hidden: true
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_main: CENTER
    flex_align_cross: CENTER
    flex_align_track: CENTER
    pad_column: 6
    pad_row: 0
  widgets:
    - label: { id: "rangee_icone_${el}", text: "", text_font: mdi_font_32 }
    - label: { id: "rangee_texte_${el}", text: "", styles: style_police_date }
