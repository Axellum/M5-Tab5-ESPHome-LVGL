# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file tv_remote_popup.yaml
# @role Popup télécommande TV Samsung (carte modale standard 1250×690, cadre v4).
#       Grille symétrique 3 colonnes (290 | 440 | 290) + rangée basse 5 boutons.
#       Ouvert par long-press carte PC (switches_card) ou btn_control_tv.
# @ai_instruction Le modèle « Samsung S95B — Salon » n'est plus affiché en
#       sous-titre : la barre de titre est identique pour tous les popups (ADR-0009).
# @architecture_constraint remote.send_command / remote.toggle sur ${entity_tv_remote}.
# ═══════════════════════════════════════════════════════
obj:
  id: tv_remote_popup
  align: CENTER
  width: 100%
  height: 100%
  hidden: true
  scrollable: false
  styles: style_invisible
  widgets:
    - !include { file: modal_scrim.yaml, vars: { scrim_opa: "85", close_lambda: "animate_popup_close(id(tv_remote_popup), nullptr);" } }

    # Carte modale — 15 px des bords écran (1280×720)
    - obj:
        align: CENTER
        width: ${modal_card_w}
        height: ${modal_card_h}
        styles: style_modal_card
        scrollable: false
        widgets:

          # ═══ BARRE DE TITRE (cadre v4 : icône + titre + croix, corps à y=72) ═══
          - !include { file: modal_header.yaml, vars: { icon: "\U000F07C0", icon_color: "color_info", title: "Télécommande TV", title_id: "popup_tv_title", close_btn_id: "btn_tv_close", close_lambda: "animate_popup_close(id(tv_remote_popup), nullptr);" } }

          # ═══ CORPS — grille (laisse place à la rangée basse) ═══
          - obj:
              align: TOP_MID
              y: ${modal_body_y}
              width: 1170
              height: 488
              styles: style_transparent
              scrollable: false
              widgets:

                # ── Colonne gauche (290) ──
                - obj:
                    align: LEFT_MID
                    x: 0
                    width: 290
                    height: 488
                    styles: style_transparent
                    scrollable: false
                    widgets:
                      - button:
                          y: 0
                          width: 290
                          height: 128
                          radius: 18
                          styles: style_clim_btn
                          pressed:
                            bg_opa: 30%
                          on_short_click:
                            - homeassistant.service:
                                service: remote.toggle
                                data:
                                  entity_id: ${entity_tv_remote}
                          widgets:
                            - label: { text: "\U000F0425", align: LEFT_MID, x: 22, text_font: mdi_font_45, text_color: color_error }
                            - label: { text: "Marche / Arrêt", align: LEFT_MID, x: 82, text_font: roboto_22, text_color: color_text }
                      - button:
                          y: 180
                          width: 290
                          height: 128
                          radius: 18
                          styles: style_clim_btn
                          pressed:
                            bg_opa: 30%
                          on_short_click:
                            - homeassistant.service:
                                service: remote.send_command
                                data:
                                  entity_id: ${entity_tv_remote}
                                  command: "KEY_SOURCE"
                          widgets:
                            - label: { text: "\U000F0379", align: LEFT_MID, x: 22, text_font: mdi_font_45, text_color: color_info }
                            - label: { text: "Source", align: LEFT_MID, x: 82, text_font: roboto_22, text_color: color_text }
                      - button:
                          y: 360
                          width: 290
                          height: 128
                          radius: 18
                          styles: style_clim_btn
                          pressed:
                            bg_opa: 30%
                          on_short_click:
                            - homeassistant.service:
                                service: remote.send_command
                                data:
                                  entity_id: ${entity_tv_remote}
                                  command: "KEY_MENU"
                          widgets:
                            - label: { text: "\U000F035C", align: LEFT_MID, x: 22, text_font: mdi_font_45, text_color: color_text_dim }
                            - label: { text: "Menu", align: LEFT_MID, x: 82, text_font: roboto_22, text_color: color_text }

                # ── Colonne centre (440) — anneau directionnel ──
                # [AI-CONTEXT] Les 4 boutons du pavé (138×100 / 100×138) sont
                # posés a y=18 / x=18 depuis le bord du disque, PAS a 10 : a 10 px,
                # les coins exterieurs du bouton (rectangle, meme arrondi) sortent
                # du disque de rayon 180 de 3,5 px — visible en permanence car le
                # disque a un fond + une bordure (style_meteo_card), pas juste un
                # halo au press. A 18 px, marge de secu ~4 px (verifie :
                # sqrt(69^2 + (180-18)^2) = 176,1 < 180). Ne pas redescendre sous
                # y/x=16 sans refaire ce calcul.
                - obj:
                    align: CENTER
                    width: 440
                    height: 488
                    styles: style_transparent
                    scrollable: false
                    widgets:
                      - obj:
                          align: CENTER
                          width: 360
                          height: 360
                          radius: 180
                          styles: style_meteo_card
                          scrollable: false
                          widgets:
                            - button:
                                align: TOP_MID
                                y: 18
                                width: 138
                                height: 100
                                radius: 36
                                styles: style_invisible
                                bg_color: color_accent
                                pressed:
                                  bg_opa: 25%
                                on_short_click:
                                  - homeassistant.service:
                                      service: remote.send_command
                                      data:
                                        entity_id: ${entity_tv_remote}
                                        command: "KEY_UP"
                                widgets:
                                  - label: { text: "\U000F005D", align: CENTER, text_font: mdi_font_45, text_color: color_text }
                            - button:
                                align: BOTTOM_MID
                                y: -18
                                width: 138
                                height: 100
                                radius: 36
                                styles: style_invisible
                                bg_color: color_accent
                                pressed:
                                  bg_opa: 25%
                                on_short_click:
                                  - homeassistant.service:
                                      service: remote.send_command
                                      data:
                                        entity_id: ${entity_tv_remote}
                                        command: "KEY_DOWN"
                                widgets:
                                  - label: { text: "\U000F0045", align: CENTER, text_font: mdi_font_45, text_color: color_text }
                            - button:
                                align: LEFT_MID
                                x: 18
                                width: 100
                                height: 138
                                radius: 36
                                styles: style_invisible
                                bg_color: color_accent
                                pressed:
                                  bg_opa: 25%
                                on_short_click:
                                  - homeassistant.service:
                                      service: remote.send_command
                                      data:
                                        entity_id: ${entity_tv_remote}
                                        command: "KEY_LEFT"
                                widgets:
                                  - label: { text: "\U000F004D", align: CENTER, text_font: mdi_font_45, text_color: color_text }
                            - button:
                                align: RIGHT_MID
                                x: -18
                                width: 100
                                height: 138
                                radius: 36
                                styles: style_invisible
                                bg_color: color_accent
                                pressed:
                                  bg_opa: 25%
                                on_short_click:
                                  - homeassistant.service:
                                      service: remote.send_command
                                      data:
                                        entity_id: ${entity_tv_remote}
                                        command: "KEY_RIGHT"
                                widgets:
                                  - label: { text: "\U000F0054", align: CENTER, text_font: mdi_font_45, text_color: color_text }
                            - button:
                                align: CENTER
                                width: 148
                                height: 148
                                radius: 74
                                styles: style_pill_accent
                                pressed:
                                  bg_opa: 45%
                                on_short_click:
                                  - homeassistant.service:
                                      service: remote.send_command
                                      data:
                                        entity_id: ${entity_tv_remote}
                                        command: "KEY_ENTER"
                                widgets:
                                  - label: { text: "OK", align: CENTER, text_font: roboto_45_b, text_color: color_text }

                      # ── 4 boutons apps dans les coins autour de la raquette ──
                      # Netflix (haut-gauche) — rouge signature
                      - button:
                          align: TOP_LEFT
                          x: 5
                          y: 4
                          width: 100
                          height: 55
                          radius: 27
                          styles: style_clim_btn
                          pressed:
                            bg_opa: 30%
                          on_short_click:
                            - homeassistant.service:
                                service: media_player.select_source
                                data:
                                  entity_id: media_player.samsung_s95ba_55_tv
                                  source: "Netflix"
                          widgets:
                            - label: { text: "Netflix", align: CENTER, text_font: roboto_22, text_color: color_error }
                      # Amazon Prime Video (haut-droite) — bleu signature
                      - button:
                          align: TOP_RIGHT
                          x: 5
                          y: 4
                          width: 100
                          height: 55
                          radius: 27
                          styles: style_clim_btn
                          pressed:
                            bg_opa: 30%
                          on_short_click:
                            - homeassistant.service:
                                service: media_player.select_source
                                data:
                                  entity_id: media_player.samsung_s95ba_55_tv
                                  source: "Amazon Prime Video"
                          widgets:
                            - label: { text: "Amazon", align: CENTER, text_font: roboto_22, text_color: color_info }
                      # Canal+ (bas-gauche) — violet signature
                      - button:
                          align: BOTTOM_LEFT
                          x: 5
                          y: 0
                          width: 100
                          height: 55
                          radius: 27
                          styles: style_clim_btn
                          pressed:
                            bg_opa: 30%
                          on_short_click:
                            - homeassistant.service:
                                service: media_player.select_source
                                data:
                                  entity_id: media_player.samsung_s95ba_55_tv
                                  source: "Canal+"
                          widgets:
                            - label: { text: "Canal+", align: CENTER, text_font: roboto_22, text_color: color_warning }
                      # HDMI PC (bas-droit) — vert signature
                      - button:
                          align: BOTTOM_RIGHT
                          x: 5
                          y: 0
                          width: 100
                          height: 55
                          radius: 27
                          styles: style_clim_btn
                          pressed:
                            bg_opa: 30%
                          on_short_click:
                            - homeassistant.service:
                                service: media_player.select_source
                                data:
                                  entity_id: media_player.samsung_s95ba_55_tv
                                  source: "HDMI"
                          widgets:
                            - label: { text: "HDMI PC", align: CENTER, text_font: roboto_22, text_color: color_success }

                # ── Colonne droite (290) — rocker volume centré ──
                - obj:
                    align: RIGHT_MID
                    x: 0
                    width: 290
                    height: 488
                    styles: style_transparent
                    scrollable: false
                    widgets:
                      - obj:
                          align: CENTER
                          width: 150
                          height: 360
                          radius: 75
                          styles: style_meteo_card
                          scrollable: false
                          widgets:
                            - button:
                                align: TOP_MID
                                y: 0
                                width: 150
                                height: 150
                                radius: 75
                                styles: style_invisible
                                bg_color: color_accent
                                pressed:
                                  bg_opa: 25%
                                on_short_click:
                                  - homeassistant.service:
                                      service: remote.send_command
                                      data:
                                        entity_id: ${entity_tv_remote}
                                        command: "KEY_VOLUP"
                                widgets:
                                  - label: { text: "\U000F0415", align: CENTER, y: 8, text_font: mdi_font_45, text_color: color_text }
                            - label:
                                text: "VOL"
                                align: CENTER
                                text_font: roboto_22
                                text_color: color_text_dim
                            - button:
                                align: BOTTOM_MID
                                y: 0
                                width: 150
                                height: 150
                                radius: 75
                                styles: style_invisible
                                bg_color: color_accent
                                pressed:
                                  bg_opa: 25%
                                on_short_click:
                                  - homeassistant.service:
                                      service: remote.send_command
                                      data:
                                        entity_id: ${entity_tv_remote}
                                        command: "KEY_VOLDOWN"
                                widgets:
                                  - label: { text: "\U000F0374", align: CENTER, y: -6, text_font: mdi_font_45, text_color: color_text }

          # ═══ RANGÉE BASSE — offset bas standard ═══
          - obj:
              align: BOTTOM_MID
              y: ${modal_bottom_y}
              width: 1170
              height: 102
              styles: style_transparent
              scrollable: false
              widgets:
                - button:
                    x: 0
                    width: 221
                    height: 102
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - homeassistant.service:
                          service: remote.send_command
                          data:
                            entity_id: ${entity_tv_remote}
                            command: "KEY_PLAY"
                    widgets:
                      - label: { text: "\U000F040A", align: CENTER, text_font: mdi_font_45, text_color: color_success }
                - button:
                    x: 237
                    width: 221
                    height: 102
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - homeassistant.service:
                          service: remote.send_command
                          data:
                            entity_id: ${entity_tv_remote}
                            command: "KEY_PAUSE"
                    widgets:
                      - label: { text: "\U000F03E4", align: CENTER, text_font: mdi_font_45, text_color: color_text }
                - button:
                    x: 474
                    width: 221
                    height: 102
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - homeassistant.service:
                          service: remote.send_command
                          data:
                            entity_id: ${entity_tv_remote}
                            command: "KEY_RETURN"
                    widgets:
                      - label: { text: "\U000F054C", align: LEFT_MID, x: 20, text_font: mdi_font_45, text_color: color_text_dim }
                      - label: { text: "Retour", align: LEFT_MID, x: 72, text_font: roboto_22, text_color: color_text }
                - button:
                    x: 711
                    width: 221
                    height: 102
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - homeassistant.service:
                          service: remote.send_command
                          data:
                            entity_id: ${entity_tv_remote}
                            command: "KEY_HOME"
                    widgets:
                      - label: { text: "\U000F02DC", align: LEFT_MID, x: 20, text_font: mdi_font_45, text_color: color_text_dim }
                      - label: { text: "Accueil", align: LEFT_MID, x: 72, text_font: roboto_22, text_color: color_text }
                - button:
                    x: 948
                    width: 221
                    height: 102
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - homeassistant.service:
                          service: remote.send_command
                          data:
                            entity_id: ${entity_tv_remote}
                            command: "KEY_MUTE"
                    widgets:
                      - label: { text: "\U000F0581", align: CENTER, y: -12, text_font: mdi_font_45, text_color: color_warning }
                      - label: { text: "Muet", align: CENTER, y: 28, text_font: roboto_22, text_color: color_text }
