# ============================================================================
# [AI-CONTEXT]
# @file forecast_hourly.yaml
# @role Conteneur des 5 cartes prévisions horaires. Visible quand `g_central_ctx.forecast_page`
#       est < 2, piloté par `handle_swipe_gesture()` (tab5_central.cpp),
#       alterne avec forecast_daily.yaml (sibling, page >= 2).
# ============================================================================
obj:
  id: layer_forecast_hourly
  x: 0
  y: ${acc_tuiles_y}
  width: ${carte_ecran_l}
  height: ${acc_tuiles_h}
  styles: style_transparent
  scrollbar_mode: "OFF"
  hidden: true

  widgets:
    # 5 cartes identiques factorisees via forecast_hour_card.yaml (#T164) : seul x_pos
    # (position horizontale) et idx (suffixe id hN_*) varient. Note : le suffixe des
    # objets décroît de gauche à droite (carte 0 = h4, carte 4 = h0), mais les heures
    # s'affichent dans l'ordre chronologique, la plus proche à gauche : la carte de
    # position T montre le créneau page × 5 + T (refresh_hourly_forecast, discussion #278).
    # `tuile` = position visuelle des pièces (ADR-0023) : 4 − idx.
    - !include { file: forecast_hour_card.yaml, vars: { x_pos: "${acc_tuile_x0}", idx: "4", tuile: "0" } }
    - !include { file: forecast_hour_card.yaml, vars: { x_pos: "${acc_tuile_x1}", idx: "3", tuile: "1" } }
    - !include { file: forecast_hour_card.yaml, vars: { x_pos: "${acc_tuile_x2}", idx: "2", tuile: "2" } }
    - !include { file: forecast_hour_card.yaml, vars: { x_pos: "${acc_tuile_x3}", idx: "1", tuile: "3" } }
    - !include { file: forecast_hour_card.yaml, vars: { x_pos: "${acc_tuile_x4}", idx: "0", tuile: "4" } }
