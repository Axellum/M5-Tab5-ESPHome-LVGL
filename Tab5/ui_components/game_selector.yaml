        widgets:
          - label: { text: "\U000F134A", align: TOP_MID, y: 18, text_font: mdi_font_56, text_color: 0xFF9800 }
          - label: { text: "Trial Poursuite", align: TOP_MID, y: 84, width: 266, text_align: CENTER, text_font: roboto_32_b, text_color: 0xF1F5F9 }
          - label: { text: "Quiz rétro-salon\n1 à 6 équipes", align: TOP_MID, y: 168, width: 266, text_align: CENTER, text_font: roboto_22, text_color: 0x8595AD }

    # 7 · Dames Tab (draughts_game) — dames internationales
    - button:
        id: btn_game_draughts
        align: TOP_LEFT
        x: 648
        y: 402
        width: 298
        height: 252
        radius: 16
        bg_color: 0x241810
        bg_opa: 100%
        border_color: 0xD4B896
        border_width: 2
        border_opa: 50%
        pressed: { bg_opa: 80%, border_opa: 100% }
        on_short_click:
          - script.execute: tab5_games_close_all
          - lvgl.page.show: page_draughts
          - script.execute: tab5_draughts_open
        widgets:
          - label: { text: "\U000F013A", align: TOP_MID, y: 18, text_font: mdi_font_56, text_color: 0xD4B896 }
          - label: { text: "Dames Tab", align: TOP_MID, y: 84, width: 266, text_align: CENTER, text_font: roboto_32_b, text_color: 0xF1F5F9 }
          - label: { text: "Dames internationales 10×10\nPrise majoritaire · rafles", align: TOP_MID, y: 168, width: 266, text_align: CENTER, text_font: roboto_22, text_color: 0x8595AD }

    # 8 · Roi Noir (chess_game) — échecs
    - button:
        id: btn_game_chess
        align: TOP_LEFT
        x: 962
        y: 402
        width: 298
        height: 252
        radius: 16
        bg_color: 0x121A16
        bg_opa: 100%
        border_color: 0x8FBF6A
        border_width: 2
        border_opa: 50%
        pressed: { bg_opa: 80%, border_opa: 100% }
        on_short_click:
          - script.execute: tab5_games_close_all
          - lvgl.page.show: page_chess
          - script.execute: tab5_chess_open
        widgets:
          - label: { text: "\U000F0857", align: TOP_MID, y: 18, text_font: mdi_font_56, text_color: 0x8FBF6A }
          - label: { text: "Roi Noir", align: TOP_MID, y: 84, width: 266, text_align: CENTER, text_font: roboto_32_b, text_color: 0xF1F5F9 }
