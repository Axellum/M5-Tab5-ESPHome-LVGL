# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file game_selector.yaml
# @role Sélecteur de jeux — PAGE LVGL dédiée (page_arcade), 1280×720, 8 consoles.
# @architecture_constraint Page LVGL autonome (pas un overlay/popup).
#     Déclarée dans tab5-lvgl.yaml sous `pages:` avec `skip: true`.
#     Grille RÉGULIÈRE 4 colonnes × 2 rangées — toutes les cartes ont
#     la même taille.
#
#     Géométrie vérifiée : carte 298×252 ; colonnes x = 20 / 334 / 648 / 962
#     (4×298 + 3×16 de gouttière = 1240, marges 20 à gauche et à droite) ;
#     rangées y = 132 et 402 (2×252 + 18 = 522, fin à 654). Ne pas modifier une
#     valeur sans refaire l'addition.
#
# @ai_instruction Navigation via lvgl.page.show: page_arcade.
#     Chaque carte fait TROIS choses, dans cet ordre :
#       1. script.execute: tab5_games_close_all   (ferme le jeu en cours)
#       2. lvgl.page.show: page_<jeu>             (navigue vers la page du jeu)
#       3. script.execute: tab5_<jeu>_open        (ouvre la console)
#     Ne PAS recopier la liste des fermetures ici : elle vit dans
#     GameRegistry::kGames (tab5_registry.cpp), que tab5_games_close_all
#     (tab5-arcade.yaml) se contente d'appeler — un seul endroit à maintenir.
#
#     Les icônes MDI utilisées ici DOIVENT figurer dans la liste `glyphs` de
#     mdi_font_56 / mdi_font_45 (tab5-styles.yaml), sinon elles ne s'affichent
#     pas du tout.
#     Couleurs : uniquement des tokens `color_*` de tab5-styles.yaml (section
#     « Sélecteur arcade ») — règle 1, plus aucun hex en dur ici depuis le 08/09/2026.
#     Ne PAS ajouter de logique C++ ici.
# ═══════════════════════════════════════════════════════
obj:
  id: game_selector_overlay
  align: TOP_LEFT
  x: 0
  y: 0
  width: 1280
  height: 720
  scrollable: false
  pad_all: 0
  radius: 0
  border_width: 0
  bg_color: color_arcade_bg
  bg_opa: 97%
  widgets:

    # ─── En-tête ───
    - label:
        text: "\U000F0297"
        align: TOP_MID
        x: -118
        y: 26
        text_font: mdi_font_45
        text_color: color_arcade_title
    - label:
        text: "ARCADE"
        align: TOP_MID
        x: 22
        y: 22
        text_font: roboto_45_b
        text_color: color_arcade_title
    - label:
        text: "8 consoles — une seule à la fois"
        align: TOP_MID
        y: 82
        text_font: roboto_22
        text_color: color_arcade_subtitle

    # ─── Croix de fermeture ───
    - button:
        id: btn_game_selector_close
        align: TOP_RIGHT
        x: -20
        y: 20
        width: 48
        height: 48
        radius: 24
        bg_color: color_arcade_close_bg
        bg_opa: 100%
        border_color: color_arcade_close_border
        border_width: 1
        border_opa: 60%
        on_short_click:
          - lvgl.page.show: page_main
        widgets:
          - label: { text: "\U000F0156", align: CENTER, text_font: mdi_font_32, text_color: color_arcade_close_icon }

    # ══════════ RANGÉE 1 ══════════

    # 1 · Fil d'Or (marble_game) — bille pilotée à l'inclinaison
    - !include { file: arcade_card.yaml, vars: { game: "marble", x: "20", y: "132", bg: "color_marble_floor", icon: "\U000F0E95", title: "Fil d'Or", subtitle: "Roguelite de bille\n6 salles · à l'inclinaison" } }

    # 2 · Arcanoïde (arkanoid_game) — casse-briques
    - !include { file: arcade_card.yaml, vars: { game: "arkanoid", x: "334", y: "132", bg: "color_arkanoid_floor", icon: "\U000F0570", title: "Arcanoïde", subtitle: "Casse-briques Atari\n8 niveaux · power-ups" } }

    # 3 · Neon Apron (pinball_game) — flipper PORTRAIT
    # Seule carte qui ouvre un jeu changeant l'orientation de l'écran : le
    # sous-titre le dit en clair, sinon le joueur croit à un bug d'affichage.
    - !include { file: arcade_card.yaml, vars: { game: "pinball", x: "648", y: "132", bg: "color_arcade_pinball_card", icon: "\U000F05DD", title: "Neon Apron", subtitle: "Flipper néon · 3 billes\nTablette à la verticale" } }

    # 4 · Coureur d'Or (lode_game) — Lode Runner
    - !include { file: arcade_card.yaml, vars: { game: "lode", x: "962", y: "132", bg: "color_arcade_lode_card", icon: "\U000F15A2", title: "Coureur d'Or", subtitle: "Lode Runner 1983\nCreuse · grimpe · fuis" } }

    # ══════════ RANGÉE 2 ══════════

    # 5 · Go Tab (go_game) — jeu de Go
    - !include { file: arcade_card.yaml, vars: { game: "go", x: "20", y: "402", bg: "color_arcade_go_card", icon: "\U000F0B38", title: "Go Tab", subtitle: "Go 9×9 / 13×13 / 19×19\nScore chinois · komi 6,5" } }

    # 6 · Trial Poursuite (trivia_game) — quiz
    - !include { file: arcade_card.yaml, vars: { game: "trivia", x: "334", y: "402", bg: "color_trivia_floor", icon: "\U000F134A", title: "Trial Poursuite", subtitle: "Quiz rétro-salon\n1 à 6 équipes" } }

    # 7 · Dames Tab (draughts_game) — dames internationales
    - !include { file: arcade_card.yaml, vars: { game: "draughts", x: "648", y: "402", bg: "color_arcade_draughts_card", icon: "\U000F013A", title: "Dames Tab", subtitle: "Internationales 10×10\nPrise majoritaire · rafles" } }

    # 8 · Roi Noir (chess_game) — échecs
    - !include { file: arcade_card.yaml, vars: { game: "chess", x: "962", y: "402", bg: "color_arcade_chess_card", icon: "\U000F0857", title: "Roi Noir", subtitle: "Échecs FIDE complets\n5 niveaux d'IA embarquée" } }

    # ─── Pied de page ───
    - label:
        text: "Sortie de chaque jeu : hub → « Quitter »"
        align: BOTTOM_MID
        y: -22
        text_font: roboto_22
        text_color: color_arcade_footer
