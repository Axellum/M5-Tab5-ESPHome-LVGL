# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file game_selector.yaml
# @role Sélecteur de jeux — PAGE LVGL dédiée (page_arcade), 1280×720, 8 consoles.
# @architecture_constraint Page LVGL autonome (pas un overlay/popup).
#     Déclarée dans tab5-lvgl.yaml sous `pages:` avec `skip: true`.
#     Grille RÉGULIÈRE 4 colonnes × 2 rangées — toutes les cartes ont
#     la même taille.
#
#     Géométrie vérifiée : carte 298×252 ; colonnes x = 20 / 334 / 648 / 962
#     (4×298 + 3×16 de gouttière = 1240, marges 20 à gauche et à droite) ;
#     rangées y = 132 et 402 (2×252 + 18 = 522, fin à 654). Ne pas modifier une
#     valeur sans refaire l'addition.
#
# @ai_instruction Navigation via lvgl.page.show: page_arcade.
#     Chaque carte fait TROIS choses, dans cet ordre :
#       1. script.execute: tab5_games_close_all   (ferme le jeu en cours)
#       2. lvgl.page.show: page_<jeu>             (navigue vers la page du jeu)
#       3. script.execute: tab5_<jeu>_open        (ouvre la console)
#     Ne PAS recopier la liste des fermetures ici : elle vit dans
#     tab5_games_close_all (tab5-scripts.yaml), un seul endroit à maintenir.
#
#     Les icônes MDI utilisées ici DOIVENT figurer dans la liste `glyphs` de
#     mdi_font_56 / mdi_font_45 (tab5-styles.yaml), sinon elles ne s'affichent
#     pas du tout.
#     Ne PAS ajouter de logique C++ ici.
# ═══════════════════════════════════════════════════════
obj:
  id: game_selector_overlay
  align: TOP_LEFT
  x: 0
  y: 0
  width: 1280
  height: 720
  scrollable: false
  pad_all: 0
  radius: 0
  border_width: 0
  bg_color: 0x080810
  bg_opa: 97%
  widgets:

    # ─── En-tête ───
    - label:
        text: "\U000F0297"
        align: TOP_MID
        x: -118
        y: 26
        text_font: mdi_font_45
        text_color: 0xFFDD22
    - label:
        text: "ARCADE"
        align: TOP_MID
        x: 22
        y: 22
        text_font: roboto_45_b
        text_color: 0xFFDD22
    - label:
        text: "8 consoles — une seule à la fois"
        align: TOP_MID
        y: 82
        text_font: roboto_22
        text_color: 0x8595AD

    # ─── Croix de fermeture ───
    - button:
        id: btn_game_selector_close
        align: TOP_RIGHT
        x: -20
        y: 20
        width: 48
        height: 48
        radius: 24
        bg_color: 0x222233
        bg_opa: 100%
        border_color: 0x445566
        border_width: 1
        border_opa: 60%
        on_short_click:
          - lvgl.page.show: page_main
        widgets:
          - label: { text: "\U000F0156", align: CENTER, text_font: mdi_font_32, text_color: 0xAABBCC }

    # ══════════ RANGÉE 1 ══════════

    # 1 · Fil d'Or (marble_game) — bille pilotée à l'inclinaison
    - button:
        id: btn_game_marble
        align: TOP_LEFT
        x: 20
        y: 132
        width: 298
        height: 252
        radius: 16
        bg_color: 0x111A28
        bg_opa: 100%
        border_color: 0xE8B44A
        border_width: 2
        border_opa: 50%
        pressed: { bg_opa: 80%, border_opa: 100% }
        on_short_click:
          - script.execute: tab5_games_close_all
          - lvgl.page.show: page_marble
          - script.execute: tab5_marble_open
        widgets:
          - label: { text: "\U000F0E95", align: TOP_MID, y: 18, text_font: mdi_font_56, text_color: 0xE8B44A }
          - label: { text: "Fil d'Or", align: TOP_MID, y: 84, width: 266, text_align: CENTER, text_font: roboto_32_b, text_color: 0xF1F5F9 }
          - label: { text: "Roguelite de bille\n6 salles · inclinaison BMI270", align: TOP_MID, y: 168, width: 266, text_align: CENTER, text_font: roboto_22, text_color: 0x8595AD }

    # 2 · Arcanoïde (arkanoid_game) — casse-briques
    - button:
        id: btn_game_arkanoid
        align: TOP_LEFT
        x: 334
        y: 132
        width: 298
        height: 252
        radius: 16
        bg_color: 0x111118
        bg_opa: 100%
        border_color: 0x44DDDD
        border_width: 2
        border_opa: 50%
        pressed: { bg_opa: 80%, border_opa: 100% }
        on_short_click:
          - script.execute: tab5_games_close_all
          - lvgl.page.show: page_arkanoid
          - script.execute: tab5_arkanoid_open
        widgets:
          - label: { text: "\U000F0570", align: TOP_MID, y: 18, text_font: mdi_font_56, text_color: 0x44DDDD }
          - label: { text: "Arcanoïde", align: TOP_MID, y: 84, width: 266, text_align: CENTER, text_font: roboto_32_b, text_color: 0xF1F5F9 }
          - label: { text: "Casse-briques Atari\n8 niveaux · power-ups", align: TOP_MID, y: 168, width: 266, text_align: CENTER, text_font: roboto_22, text_color: 0x8595AD }

    # 3 · Neon Apron (pinball_game) — flipper PORTRAIT
    # Seule carte qui ouvre un jeu changeant l'orientation de l'écran : le
    # sous-titre le dit en clair, sinon le joueur croit à un bug d'affichage.
    - button:
        id: btn_game_pinball
        align: TOP_LEFT
        x: 648
        y: 132
        width: 298
        height: 252
        radius: 16
        bg_color: 0x0D1420
        bg_opa: 100%
        border_color: 0x35E6FF
        border_width: 2
        border_opa: 50%
        pressed: { bg_opa: 80%, border_opa: 100% }
        on_short_click:
          - script.execute: tab5_games_close_all
          - lvgl.page.show: page_pinball
          - script.execute: tab5_pinball_open
        widgets:
          - label: { text: "\U000F05DD", align: TOP_MID, y: 18, text_font: mdi_font_56, text_color: 0x35E6FF }
          - label: { text: "Neon Apron", align: TOP_MID, y: 84, width: 266, text_align: CENTER, text_font: roboto_32_b, text_color: 0xF1F5F9 }
          - label: { text: "Flipper néon · 3 billes\nTournez la tablette à la verticale", align: TOP_MID, y: 168, width: 266, text_align: CENTER, text_font: roboto_22, text_color: 0x8595AD }

    # 4 · Coureur d'Or (lode_game) — Lode Runner
    - button:
        id: btn_game_lode
        align: TOP_LEFT
        x: 962
        y: 132
        width: 298
        height: 252
        radius: 16
        bg_color: 0x0A0A12
        bg_opa: 100%
        border_color: 0xFFC61A
        border_width: 2
        border_opa: 50%
        pressed: { bg_opa: 80%, border_opa: 100% }
        on_short_click:
          - script.execute: tab5_games_close_all
          - lvgl.page.show: page_lode
          - script.execute: tab5_lode_open
        widgets:
          - label: { text: "\U000F15A2", align: TOP_MID, y: 18, text_font: mdi_font_56, text_color: 0xFFC61A }
          - label: { text: "Coureur d'Or", align: TOP_MID, y: 84, width: 266, text_align: CENTER, text_font: roboto_32_b, text_color: 0xF1F5F9 }
          - label: { text: "Lode Runner 1983\nCreuse · grimpe · fuis", align: TOP_MID, y: 168, width: 266, text_align: CENTER, text_font: roboto_22, text_color: 0x8595AD }

    # ══════════ RANGÉE 2 ══════════

    # 5 · Go Tab (go_game) — jeu de Go
    - button:
        id: btn_game_go
        align: TOP_LEFT
        x: 20
        y: 402
        width: 298
        height: 252
        radius: 16
        bg_color: 0x1A150E
        bg_opa: 100%
        border_color: 0xC4A574
        border_width: 2
        border_opa: 50%
        pressed: { bg_opa: 80%, border_opa: 100% }
        on_short_click:
          - script.execute: tab5_games_close_all
          - lvgl.page.show: page_go
          - script.execute: tab5_go_open
        widgets:
          - label: { text: "\U000F0B38", align: TOP_MID, y: 18, text_font: mdi_font_56, text_color: 0xC4A574 }
          - label: { text: "Go Tab", align: TOP_MID, y: 84, width: 266, text_align: CENTER, text_font: roboto_32_b, text_color: 0xF1F5F9 }
          - label: { text: "Go 9×9 / 13×13 / 19×19\nScore chinois · komi 6,5", align: TOP_MID, y: 168, width: 266, text_align: CENTER, text_font: roboto_22, text_color: 0x8595AD }

    # 6 · Trial Poursuite (trivia_game) — quiz
    - button:
        id: btn_game_trivia
        align: TOP_LEFT
        x: 334
        y: 402
        width: 298
        height: 252
        radius: 16
        bg_color: 0x1A1028
        bg_opa: 100%
        border_color: 0xFF9800
        border_width: 2
        border_opa: 50%
        pressed: { bg_opa: 80%, border_opa: 100% }
        on_short_click:
          - script.execute: tab5_games_close_all
          - lvgl.page.show: page_trivia
