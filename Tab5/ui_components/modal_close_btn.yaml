# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Croix de fermeture popup — cadre modal v3 (ADR-0008).
# Geometry : TOP_RIGHT x=-10, y=6, 96×64, style_clim_btn (anti-décalage).
# vars : close_btn_id (id du bouton), close_lambda (corps C++ une ligne,
#        sans guillemets simples — substitué dans lambda: '...').
# ═══════════════════════════════════════════════════════
button:
  id: ${close_btn_id}
  align: TOP_RIGHT
  x: -10
  y: 6
  width: 96
  height: 64
  styles: style_clim_btn
  pressed:
    bg_opa: 30%
  on_short_click:
    - lambda: '${close_lambda}'
  widgets:
    - label: { text: "\U000F0156", align: CENTER, text_font: mdi_font_45, text_color: color_text }
