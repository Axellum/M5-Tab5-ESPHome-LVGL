# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Template paramétré (!include+vars) : un bouton à pas (− / +, ◀ / ▶), réutilisé
# 2× par reglages_popup.yaml (flèches du thème, 06/10/2026). Le popup du réveil, qui en
# avait 20, règle ses valeurs sur des rouleaux depuis le 09/10/2026 (rouleau.yaml).
# Le tap passe tel quel à ESPHome (var `appui`, liste d'actions) : un script avec un
# décalage (`[ script.execute: { id: tab5_reglages_choisir, reglage: 3, valeur: 1 } ]`), ou une entité
# `number` sans boucler (`[ number.increment: { id: …, cycle: false } ]`).
# vars : id (id du bouton), x, y, w, h, r (rayon), icon (glyphe MDI en mdi_font_32 :
#        il doit figurer dans la liste `glyphs` de mdi_font_32, sinon il s'affiche vide),
#        appui (actions du tap).
# Sorti de alarm_popup.yaml le 25/09/2026 (audit, lot 8e, règle 5 : un widget répété
# 3 fois ou plus passe par un template) ; alarm_step_script_btn.yaml et
# alarm_step_number_btn.yaml, identiques à l'action près, n'en font plus qu'un depuis le
# 08/10/2026 (audit, YML-16).
# Piège YAML : dans un mapping en ligne `{ … }`, une valeur contenant `${…}` doit être
# entre guillemets, sinon l'accolade casse la syntaxe (yamllint le signale).
# Piège ESPHome : la substitution garde le type de la variable — un `${appui}` seul sur
# sa valeur redevient la liste entière. Les paramètres d'un script doivent donc être des
# nombres NON quotés (`delta: 3`, pas `"3"`), sinon ils partent en chaîne ('3').
# ═══════════════════════════════════════════════════════
button:
  id: ${id}
  align: TOP_LEFT
  x: ${x}
  y: ${y}
  width: ${w}
  height: ${h}
  radius: ${r}
  styles: style_clim_btn
  pressed: { bg_opa: 30% }
  on_short_click: ${appui}
  widgets:
    - label: { text: "${icon}", align: CENTER, text_font: mdi_font_32 }
