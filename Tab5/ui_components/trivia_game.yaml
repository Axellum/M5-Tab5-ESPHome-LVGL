# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file trivia_game.yaml
# @role Page LVGL dédiée du jeu « Trial Poursuite » (Trivial Pursuit rétro).
# @architecture_constraint Page LVGL autonome (page_trivia dans tab5-lvgl.yaml,
#     skip: true). Pas de modal_scrim/modal_header — flux de jeu plein cadre.
#     La sortie du jeu se fait par le hub (« Quitter ») qui navigue vers
#     page_arcade via lv_scr_load() en C++.
# @ai_instruction Ce fichier ne déclare QUE 4 conteneurs vides. Tout le contenu
#     (plateau, HUD, modals, camemberts) est construit par trivia_game.cpp via
#     Trivia::open(). Ne JAMAIS ajouter de widget de gameplay ici.
# ═══════════════════════════════════════════════════════
obj:
  id: trivia_root
  align: TOP_LEFT
  x: 0
  y: 0
  width: 1280
  height: 720
  scrollable: false
  pad_all: 0
  radius: 0
  border_width: 0
  bg_color: color_trivia_void
  bg_opa: 100%
  widgets:
    # --- Bandeau HUD compact (48 px) : équipe active, dé, tour, timer ---
    - obj:
        id: trivia_hud
        align: TOP_LEFT
        x: 0
        y: 0
        width: 1280
        height: 48
        scrollable: false
        pad_all: 0
        radius: 0
        border_width: 0
        bg_color: color_trivia_hud
        bg_opa: 100%

    # --- Aire plateau 1280x672 : plateau circulaire + pions + dé ---
    - obj:
        id: trivia_board
        align: TOP_LEFT
        x: 0
        y: 48
        width: 1280
        height: 672
        scrollable: false
        pad_all: 0
        radius: 0
        border_width: 0
        bg_color: color_trivia_floor
        bg_opa: 100%

    # --- Calque des menus (hub / setup / question / victoire / stats).
    #     Contenu construit en C++, masqué pendant le jeu. ---
    - obj:
        id: trivia_panel
        align: TOP_LEFT
        x: 0
        y: 0
        width: 1280
        height: 720
        hidden: true
        scrollable: false
        pad_all: 0
        radius: 0
        border_width: 0
        bg_color: color_trivia_void
        bg_opa: 96%
