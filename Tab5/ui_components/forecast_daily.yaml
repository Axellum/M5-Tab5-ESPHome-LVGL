                - label: { id: j3_icon_layer1, text: "", hidden: true, align: CENTER, y: 0, text_font: font_meteo_card }
                - label: { id: j3_icon_layer2, text: "", hidden: true, align: CENTER, y: 0, text_font: font_meteo_card }
                - button:
