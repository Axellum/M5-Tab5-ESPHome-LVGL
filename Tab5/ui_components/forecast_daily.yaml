# ============================================================================
# [AI-CONTEXT]
# @file forecast_daily.yaml
# @role 5 cartes prévisions journalières (fenêtre glissante sur 15 jours, cf.
#       `cal_jours_data[15]`/`refresh_daily_forecast()` dans tab5_custom.cpp). Visible quand
#       `g_central_ctx.forecast_page` est >= 2, piloté par `handle_swipe_gesture()`.
# @architecture_constraint Onglet Titre (`forecast_day_title_tab.yaml`) et Onglet Température
#                          (`forecast_day_temp_tab.yaml`) sont factorisés (#T164, même motif x5).
#                          Pièces (ADR-0023) : sur les pages 2 à 4, ces mêmes objets montrent
#                          les appareils de la pièce de la page — épaules (icône à gauche,
#                          ampoule ou flèche à droite) et bouton invisible, posés par
#                          tab5_tuiles.cpp ; tap / appui long → tuile_appui(T, …). Le corps
#                          reste écrit cinq fois : les ids des épaules et des boutons sont
#                          posés dans g_day_slots par l'on_boot de tab5-ha-hmi.yaml, qu'on ne
#                          modifie pas sans Axel, et les épaules doivent garder des ids
#                          `icon_card_*` (motif de la règle 7 pour la palette des tuiles).
#                          `btn_j1_dir` (sens du volet 3.x) ne sert qu'au mode héritage.
# @ai_instruction Les icônes météo (`jN_icon_layer1/2`) sont mises à jour par
#                 `update_meteo_icon()`/`refresh_daily_forecast()` (tab5_custom.cpp) — ne jamais
#                 leur assigner de texte/couleur directement ici.
# ============================================================================
obj:
  id: layer_forecast_daily
  x: 0
  y: 430
  width: 1280
  height: 290
  styles: style_transparent
  scrollbar_mode: "OFF"
  hidden: false

  widgets:
    # Card 0
    - obj:
        x: 25
        y: ${meteo_cell_y}
        width: ${meteo_cell_width}
        height: ${meteo_cell_height}
        styles: style_transparent
        scrollbar_mode: "OFF"
        widgets:
          # Corps Sombre (recouvre les onglets)
          - obj:
              y: 35
              width: 230
              height: 205
              styles: style_meteo_card_page
              scrollbar_mode: "OFF"
              widgets:
                - label: { id: j0_icon_layer1, text: "", hidden: true, align: CENTER, y: 0, text_font: font_meteo_card }
                - label: { id: j0_icon_layer2, text: "", hidden: true, align: CENTER, y: 0, text_font: font_meteo_card }
                - button:
                    id: btn_j0_action
                    align: CENTER
                    y: 0
                    width: 140
                    height: 130
                    styles: style_invisible
                    on_short_click:
                      - lambda: 'tuile_appui(0, false);'
                    on_long_press:
                      - lambda: 'tuile_appui(0, true);'

          # Onglet Titre + Onglet Température : factorises (#T164), meme motif sur les 5 cartes
          - !include { file: forecast_day_title_tab.yaml, vars: { idx: "0", day_label: "Journee" } }
          - !include { file: forecast_day_temp_tab.yaml, vars: { idx: "0", toggle_width: "140" } }
          # Icônes latérales (épaules) ; la droite n'existait pas avant les pièces (ADR-0023)
          - label: { id: icon_card_pc, text: "\U000F07C0", align: TOP_LEFT, x: 10, y: 9, text_font: mdi_font_32, text_color: color_text_dim }
          - label: { id: icon_card_droite_j0, text: "\U000F0335", hidden: true, align: TOP_RIGHT, x: -10, y: 9, text_font: mdi_font_32, text_color: color_text_dim }
    # Card 1
    - obj:
        x: 275
        y: ${meteo_cell_y}
        width: ${meteo_cell_width}
        height: ${meteo_cell_height}
        styles: style_transparent
        scrollbar_mode: "OFF"
        widgets:
          # Corps Sombre
          - obj:
              y: 35
              width: 230
              height: 205
              styles: style_meteo_card_page
              scrollbar_mode: "OFF"
              widgets:
                - label: { id: j1_icon_layer1, text: "", hidden: true, align: CENTER, y: 0, text_font: font_meteo_card }
                - label: { id: j1_icon_layer2, text: "", hidden: true, align: CENTER, y: 0, text_font: font_meteo_card }
                - button:
                    id: btn_j1_action
                    align: CENTER
                    y: 0
                    width: 140
                    height: 130
                    styles: style_invisible
                    on_short_click:
                      - lambda: 'tuile_appui(1, false);'
                    on_long_press:
                      - lambda: 'tuile_appui(1, true);'

          # Icônes latérales (épaules)
          - label: { id: icon_card_shutter1, text: "\U000F111E", align: TOP_LEFT, x: 10, y: 9, text_font: mdi_font_32, text_color: color_text_dim }
          - label: { id: icon_card_shutter_arrow, text: "\U000F005D", align: TOP_RIGHT, x: -10, y: 9, text_font: mdi_font_32, text_color: color_text_dim }
          # Onglet Titre + Onglet Température : factorises (#T164), meme motif sur les 5 cartes
          - !include { file: forecast_day_title_tab.yaml, vars: { idx: "1", day_label: "Demain" } }
          - !include { file: forecast_day_temp_tab.yaml, vars: { idx: "1", toggle_width: "130" } }
          - button:
              id: btn_j1_dir
              align: TOP_MID
              x: 0
              y: 0
              width: 230
              height: 60
              styles: style_invisible
              pad_all: 0
              # Sens de la prochaine commande du volet 3.x (mode héritage seulement : sinon
              # masqué, la flèche suit l'état du volet de la tuile).
              on_short_click:
                - lambda: 'tuiles_heritage_volet_sens();'
    # Card 2
    - obj:
        x: 525
        y: ${meteo_cell_y}
        width: ${meteo_cell_width}
        height: ${meteo_cell_height}
        styles: style_transparent
        scrollbar_mode: "OFF"
        widgets:
          # Corps Sombre
          - obj:
              y: 35
