# [AI-CONTEXT] Template paramétré (!include+vars), réutilisé 5x par forecast_daily.yaml
# (j0..j4). Vars: idx, day_label. id `j${idx}_day` recoloré dynamiquement par
# refresh_daily_forecast() (tab5_custom.cpp). Page accueil = nom_jour HA ;
# pages journalieres 2-3 = "Lun 16". Le day_label YAML = texte initial seulement.
obj:
  align: TOP_MID
  y: ${acc_t_onglet_y}
  width: ${acc_t_onglet_l}
  height: ${acc_t_onglet_h}
  styles: style_transparent  # plus d'onglet en saillie (essai 10/10/2026) : le texte s'écrit sur la carte pleine cellule
  scrollbar_mode: "OFF"
  widgets:
    - label: { id: "j${idx}_day", text: "${day_label}", align: CENTER, text_font: roboto_32_b }
