# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Bouton de vue d'un graphique de popup, réutilisé 3 fois par chacun :
#   - energie_popup.yaml (ADR-0028) : 0 heures, 1 jours, 2 mois ;
#   - historique_popup.yaml (ADR-0032) : 0 24 h, 1 7 jours, 2 30 jours.
# vars : prefixe (energie | historique : id ${prefixe}_vue_N, et la fonction C++
#        ${prefixe}_choisir_vue appelée au toucher), n (0-2 : vue choisie), x_pos (depuis
#        le bord droit de la carte du graphique), label_text (traduit au démarrage).
# Surbrillance de la vue affichée : tab5_energie.cpp / tab5_historique.cpp
# (highlight_button_border).
# ═══════════════════════════════════════════════════════
button:
  id: "${prefixe}_vue_${n}"
  align: TOP_RIGHT
  x: ${x_pos}
  y: 10
  width: 150
  height: 48
  styles: style_clim_btn
  on_short_click:
    - lambda: '${prefixe}_choisir_vue(${n});'
  widgets:
    - label: { text: "${label_text}", align: CENTER }
