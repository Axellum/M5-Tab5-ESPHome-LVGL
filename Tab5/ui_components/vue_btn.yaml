# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Bouton de vue d'un graphique de popup, réutilisé 3 fois par chacun :
#   - energie_popup.yaml (ADR-0028) : 0 heures, 1 jours, 2 mois, deux fois (pages
#     Production, prefixe energie, et Bilan, prefixe energie_bilan, ADR-0058) ;
#   - historique_popup.yaml (ADR-0032) : 0 24 h, 1 7 jours, 2 30 jours.
# vars : prefixe (energie | energie_bilan | historique : id ${prefixe}_vue_N, et la fonction C++
#        ${prefixe}_choisir_vue appelée au toucher), n (0-2 : vue choisie), x_pos (depuis
#        le bord droit de la carte du graphique), label_text (traduit au démarrage).
# Hauteur et y ramenés au corps de la carte (lot 4 du portage, 1024×600) ; largeur `l`
# (facultative, 150 par défaut : la page Bilan passe ${bil_vue_l}, plus étroite sur la 7B).
# Surbrillance de la vue affichée : tab5_energie.cpp / tab5_historique.cpp
# (highlight_button_border).
# ═══════════════════════════════════════════════════════
button:
  id: "${prefixe}_vue_${n}"
  align: TOP_RIGHT
  x: ${x_pos}
  y: ${ 10 * (corps_h | int) // 598 }
  width: ${ l | default(150) }
  height: ${ 48 * (corps_h | int) // 598 }
  styles: style_clim_btn
  on_short_click:
    - lambda: '${prefixe}_choisir_vue(${n});'
  widgets:
    - label: { text: "${label_text}", align: CENTER }
