# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Carte du bas de la page « Détails » du popup Météo (ADR-0043), réutilisée
# 4 fois par meteo_popup.yaml : 0 humidité, 1 indice UV, 2 gel, 3 neige (MeteoCarte,
# tab5_meteo.h). 288 × 210, comme les cartes des popups Température et Énergie ; sur une
# autre carte, x (donné pour le Tab5), tailles et y ramenés au corps (lot 4 du portage).
# vars : n (0-3, suffixe des ids lus par tab5_meteo.cpp via g_meteo_ui), x, icone (glyphe
#        MDI de mdi_font_45, règle 9), label_text (le nom, traduit au démarrage).
# tab5_meteo.cpp écrit la valeur (à la couleur de son niveau) et le détail ; « -- » tant
# que Home Assistant n'a rien poussé.
# ═══════════════════════════════════════════════════════
obj:
  align: TOP_LEFT
  x: ${ 24 + ((x | int) - 24) * (corps_w | int) // 1202 }
  y: ${ 372 * (corps_h | int) // 598 + 16 }
  width: ${ 288 * (corps_w | int) // 1202 }
  height: ${ corps_h | int - 372 * (corps_h | int) // 598 - 16 }
  styles: style_glass_card
  scrollable: false
  widgets:
    - label: { text: "${label_text}", align: TOP_LEFT, x: 22, y: "${ 16 * (corps_h | int) // 598 }", styles: style_text_accent }
    - label: { text: "${icone}", align: TOP_RIGHT, x: -18, y: "${ 12 * (corps_h | int) // 598 }", text_font: mdi_font_45, styles: style_text_dim }
    - label: { id: "meteo_carte_valeur_${n}", text: "--", align: TOP_LEFT, x: 22, y: "${ 70 * (corps_h | int) // 598 }", styles: style_police_date }
    - label: { id: "meteo_carte_detail_${n}", text: "", align: TOP_LEFT, x: 22, y: "${ 150 * (corps_h | int) // 598 }", width: "${ 250 * (corps_w | int) // 1202 }", long_mode: DOT, styles: style_text_dim }
