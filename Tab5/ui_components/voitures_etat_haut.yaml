# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Carte du haut d'une voiture, page « État » du popup Voitures (ADR-0081), réutilisée
# 2 fois par voitures_page_etat.yaml (n = 0 ou 1) : une carte de verre qui porte le nom de la
# voiture, le verdict de ses pneus (icône puis texte) et la pression de chacun des quatre pneus.
# La voiture vue de dessus (pneus, carrosserie, vitres) est dessinée par tab5_voitures_etat.cpp.
# Ne rien assigner ici : le C++ pose, dimensionne et colorie tout (les widgets du verdict et des
# pressions n'apparaissent qu'avec une valeur).
# vars : n (0-1, suffixe des ids).
# @architecture_constraint ORDRE des enfants lu par tab5_voitures_etat.cpp (lier_carte) : nom,
#       icône du verdict, texte du verdict, puis la pression de AV_G, AV_D, AR_G, AR_D (voiture
#       lue dans l'ordre du payload : avant gauche, avant droit, arrière gauche, arrière droit).
#       Un widget de plus : en fin de liste, et kEnfantsHaut dans le C++.
# @ai_instruction Les glyphes affichés ici (icône du verdict) sont dans mdi_font_32 (règle 9) et posés
#       par glyphe_puce (MDI_CODE_TARGETS : voitures_etat_puce_icone_*).
# ═══════════════════════════════════════════════════════
obj:
  id: "voitures_etat_haut_${n}"
  align: TOP_LEFT
  x: 0
  y: 0
  width: ${ (corps_w | int - 16) // 2 }
  height: 300
  hidden: true
  styles: style_glass_card
  scrollable: false
  widgets:
    - label: { id: "voitures_etat_nom_${n}", text: "", align: TOP_LEFT, text_font: roboto_32_b, styles: style_text_accent }
    - label: { id: "voitures_etat_puce_icone_${n}", text: "", align: TOP_LEFT, text_font: mdi_font_32, hidden: true, styles: style_text_dim }
    - label: { id: "voitures_etat_puce_${n}", text: "", align: TOP_LEFT, text_font: roboto_22, hidden: true, styles: style_text_dim }
    - !include { file: voitures_etat_pression.yaml, vars: { n: "${n}", p: "0" } }
    - !include { file: voitures_etat_pression.yaml, vars: { n: "${n}", p: "1" } }
    - !include { file: voitures_etat_pression.yaml, vars: { n: "${n}", p: "2" } }
    - !include { file: voitures_etat_pression.yaml, vars: { n: "${n}", p: "3" } }
