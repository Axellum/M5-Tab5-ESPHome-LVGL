# [AI-CONTEXT] Template paramétré (!include+vars), réutilisé 6x par roue_actions.yaml :
# un bouton du premier anneau de la roue d'actions rapides (ADR-0036) — une commande de la
# tuile, une famille de réglages (son point) ou un lien (« Maison », « Réglages »).
# Var : n (0 à 5, rang de gauche à droite, nombre NON quoté : c'est l'argument int de
# roue_actions_choisir()).
# Position, icône (mdi_font_36 : MDI_CODE_TARGETS, motif roue_bouton_*_icone, fonction
# glyphe_roue de tab5_roue.cpp), point, aspect (verre, verre teinté et halo de l'état
# courant, contour d'un lien) : posés par tab5_roue.cpp à chaque ouverture, qui masque aussi
# les boutons en trop.
# @ai_instruction Le bouton garde le verre partagé des boutons des popups (style_clim_btn,
#        celui d'Ouvrir / Stop / Fermer du popup du volet), en rond (rayon 36 sur 72 px) :
#        son effet d'appui vient de tab5_anim.cpp, qui le retient par le drapeau USER_1
#        posé par roue_brancher() (il ne reconnaît sinon que les boutons de rayon 18).
#        Enfants dans cet ordre (roue_brancher les lit par rang) : icône, point. Ni l'un
#        ni l'autre ne prend le toucher : l'appui va au bouton.
button:
  id: "roue_bouton_${n}"
  x: 0
  y: 0
  width: 72
  height: 72
  hidden: true
  styles: style_clim_btn
  radius: 36
  pad_all: 0
  on_short_click:
    - lambda: 'roue_actions_choisir(${n});'
  widgets:
    - label: { id: "roue_bouton_${n}_icone", text: "", align: CENTER, text_font: mdi_font_36, styles: style_text_soft }
    - obj: { id: "roue_bouton_${n}_point", align: CENTER, width: 8, height: 8, radius: 4, hidden: true, styles: style_invisible, bg_opa: 100%, clickable: false, scrollable: false }
