# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Template paramétré (!include+vars), réutilisé 5× par light_popup.yaml :
# une ligne du sélecteur de lumière (carte AMPOULE) = une lumière de la pièce (ADR-0023).
# Le tap passe par script.tab5_light_popup_show (tab5-scripts.yaml) → popup_lumiere_choisir().
# vars : idx (0-4 = rang de la lumière dans la pièce, nombre NON quoté : c'est le
#        paramètre int light_idx du script), y (position d'avant la première ouverture :
#        tab5_tuiles.cpp repose y et hauteur), icon (glyphe MDI en mdi_font_45 : il doit
#        figurer dans la liste `glyphs` de mdi_font_45), name (libellé initial).
# [AI-WARNING] Les ids btn_light_sel_${idx} / icon_light_sel_${idx} / lbl_light_sel_${idx}
#        sont lus par tab5-tuiles.yaml : ne pas les renommer (icon_light_sel_* est aussi le
#        motif de la règle 7 pour la palette des tuiles).
# Sorti de light_popup.yaml le 26/09/2026 (audit, lot 7.3), rendu inchangé.
# ═══════════════════════════════════════════════════════
button:
  id: btn_light_sel_${idx}
  align: TOP_LEFT
  x: 22
  y: ${y}
  width: 342
  height: 86
  styles: style_clim_btn
  on_short_click:
    - script.execute: { id: tab5_light_popup_show, light_idx: "${idx}" }
  widgets:
    - label: { id: "icon_light_sel_${idx}", text: "${icon}", align: LEFT_MID, x: 20, text_font: mdi_font_45, text_color: color_text_dim }
    - label: { id: "lbl_light_sel_${idx}", text: "${name}", align: LEFT_MID, x: 88, text_font: roboto_32_b }
