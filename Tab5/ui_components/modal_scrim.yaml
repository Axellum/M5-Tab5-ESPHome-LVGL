# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Voile sombre plein écran (tap = fermer) — cadre modal v4.
# Seul voile du projet : aucun popup ne redéfinit un scrim inline (ADR-0009).
# vars : close_lambda (même contrat que modal_header.yaml),
#        scrim_opa (opacité SANS le %, "85" pour un popup de premier niveau,
#        "60" pour un sous-popup empilé sur un voile déjà présent).
# ═══════════════════════════════════════════════════════
button:
  align: CENTER
  width: 100%
  height: 100%
  bg_color: color_modal_scrim
  bg_opa: ${scrim_opa}%
  border_width: 0
  on_short_click:
    - lambda: '${close_lambda}'
