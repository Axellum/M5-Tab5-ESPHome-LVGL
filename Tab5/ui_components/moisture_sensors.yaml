# ============================================================================
# [AI-CONTEXT]
# @file moisture_sensors.yaml
# @role 4 slots UI fixes affichant un sous-ensemble dynamique de 5 capteurs d'humidité BLE
#       (plantes). Slot 0 = le plus sec, 1 = 2e plus sec, 2 = médiane, 3 = le plus
#       humide — PAS un mapping fixe capteur→slot. Icône seule depuis le 05/10/2026 (le
#       texte « Pot N » / « Moy: » est retiré) : sa couleur dit l'humidité, le nom et la
#       valeur de chaque pot sont dans le popup « Mes Plantes » (appui long).
# @architecture_constraint Les 4 slots (`icon_pot_sN`) sont remplis par
#                          `sort_and_update_moisture_slots()` (tab5_cards.cpp), appelée à
#                          chaque mise à jour de n'importe lequel des 5 capteurs
#                          (`moisture_1`..`moisture_5`, script `tab5_pots_maj` de
#                          tab5-sensors-domotique.yaml, pots_humidite_maj()). Ne jamais assigner icône/couleur ici :
#                          quel capteur physique tombe dans quel slot change à chaque update.
# @architecture_constraint Grille du haut (tab5-lvgl.yaml) : la rangée a la largeur de
#                          l'horloge (401 px) et le pied de l'encre des icônes à y 308, la
#                          ligne du bas d'Ok Nabu et de la tuile clim (icônes de 70 px, encre
#                          à 6-64 px du haut du slot ; ligne de la police = 70 px pile, d'où
#                          scrollable: false sur chaque slot). 4 × 70 = 280 px ≤ 401 (SPACE_EVENLY,
#                          pad_column à 0 : sans lui le thème ajoute 14 px entre les slots,
#                          vu le 03/10/2026 avec « Planta 2 » rogné).
# @architecture_constraint Depuis le 06/10/2026 (ADR-0031), c'est la ligne des plantes de la
#                          rangée sous l'horloge : seul enfant du panneau rangee_plantes
#                          (rangee.yaml, à y 244), qui l'anime comme la carte centrale. Le
#                          panneau, pas cette carte, est masqué quand la ligne n'est pas à
#                          l'écran ; l'appui long (`btn_rangee`, tab5-lvgl.yaml) n'ouvre
#                          « Mes Plantes » que sur elle.
# ============================================================================
obj:
  id: moisture_sensors_card
  x: 0
  y: 0
  width: 401
  height: 70
  styles: style_transparent
  scrollbar_mode: "OFF"
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_main: SPACE_EVENLY
    flex_align_cross: CENTER
    pad_column: 0

  widgets:
    # Slot 0 : Plus sec (rempli dynamiquement par sort_and_update_moisture_slots)
    - obj:
        width: 70
        height: 70
        styles: style_transparent
        scrollable: false
        widgets:
          - label: { id: icon_pot_s0, text: "\U000F024A", align: CENTER, text_font: mdi_font_70, styles: style_text_dim }

    # Slot 1 : 2e plus sec
    - obj:
        width: 70
        height: 70
        styles: style_transparent
        scrollable: false
        widgets:
          - label: { id: icon_pot_s1, text: "\U000F0E66", align: CENTER, text_font: mdi_font_70, styles: style_text_dim }

    # Slot 2 : Médiane
    - obj:
        width: 70
        height: 70
        styles: style_transparent
        scrollable: false
        widgets:
          - label: { id: icon_pot_s2, text: "\U000F02E5", align: CENTER, text_font: mdi_font_70, styles: style_text_dim }

    # Slot 3 : Plus humide
    - obj:
        width: 70
        height: 70
        styles: style_transparent
        scrollable: false
        widgets:
          - label: { id: icon_pot_s3, text: "\U000F09F1", align: CENTER, text_font: mdi_font_70, styles: style_text_dim }
