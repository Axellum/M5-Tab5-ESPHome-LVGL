# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Bouton de vue du graphique du popup Énergie (ADR-0028), réutilisé 3 fois
# par energie_popup.yaml : 0 heures, 1 jours, 2 mois.
# vars : n (0-2 : id energie_vue_N et vue choisie), x_pos (depuis le bord droit de la
#        carte du graphique), label_text (traduit au démarrage).
# Surbrillance de la vue affichée : tab5_energie.cpp (highlight_button_border).
# ═══════════════════════════════════════════════════════
button:
  id: "energie_vue_${n}"
  align: TOP_RIGHT
  x: ${x_pos}
  y: 10
  width: 150
  height: 48
  styles: style_clim_btn
  on_short_click:
    - lambda: 'energie_choisir_vue(${n});'
  widgets:
    - label: { text: "${label_text}", align: CENTER }
