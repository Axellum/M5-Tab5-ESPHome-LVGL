# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Nom d'une page d'un popup à pages (tab5_pages.cpp) : « Réglages »
# (reglages_popup.yaml, 08/10/2026 : Écran, Apparence, Batterie, Système) et « Réveil »
# (alarm_popup.yaml, 09/10/2026 : Heure, Jours, Ouverture, Sonnerie, Annonces). Un tap
# montre sa page (fonction `afficher`), qui met le nom de la page affichée en couleur
# d'accent comme l'option active d'une rangée (premier enfant = le texte).
# Options d'en-tête : frères de la barre de titre (modal_header.yaml), alignés sur sa
# ligne (y=4, hauteur 44) ; le popup les pose après l'include de la barre.
# vars : id, x, page (numéro de page, ReglagesPage ou ReveilPage, en nombre NON quoté),
#        label_text (traduit au démarrage) ; facultatives : afficher (fonction C++
#        `void (int)` qui montre la page, défaut reglages_afficher_page), w (largeur,
#        défaut 200).
# ═══════════════════════════════════════════════════════
button:
  id: ${id}
  align: TOP_LEFT
  x: ${x}
  y: 4
  width: ${ w | default(200) }
  height: 44
  radius: 14
  pad_all: 0   # positions exactes : le thème ajoutait ~21 px
  styles: style_clim_btn
  pressed: { bg_opa: 30% }
  on_short_click:
    - lambda: 'if (!ui_appui_glisse()) ${ afficher | default("reglages_afficher_page") }(${page});'
  widgets:
    # 5 px d'air de chaque côté du nom (190 sur 200 avant le 09/10/2026).
    - label:
        text: "${label_text}"
        align: CENTER
        width: 100%
        pad_left: 5
        pad_right: 5
        text_align: CENTER
        long_mode: DOT
