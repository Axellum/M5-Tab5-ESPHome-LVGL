# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Nom d'une page d'un popup à pages, en haut à côté du titre : « Réglages »
# (reglages_popup.yaml, 08/10/2026 : Écran, Apparence, Batterie, Système) et « Météo »
# (meteo_popup.yaml, ADR-0043 : Aujourd'hui, 10 jours, Détails). Un tap montre sa page
# (${prefixe}_afficher_page : reglages_afficher_page, tab5_reglages.cpp, ou
# meteo_afficher_page, tab5_meteo.cpp), qui met le nom de la page affichée en couleur
# d'accent comme l'option active d'une rangée (ui_choix_peindre ; premier enfant = le texte).
# Options d'en-tête : frères de la barre de titre (modal_header.yaml), alignés sur sa
# ligne (y=4, hauteur 44) ; le popup les pose après l'include de la barre.
# vars : prefixe (reglages | meteo), id, x, page (ReglagesPage ou MeteoPage, en nombre NON
#        quoté), label_text (traduit au démarrage).
# ═══════════════════════════════════════════════════════
button:
  id: ${id}
  align: TOP_LEFT
  x: ${x}
  y: 4
  width: 200
  height: 44
  radius: 14
  pad_all: 0   # positions exactes : le thème ajoutait ~21 px
  styles: style_clim_btn
  pressed: { bg_opa: 30% }
  on_short_click:
    - lambda: 'if (!ui_appui_glisse()) ${prefixe}_afficher_page(${page});'
  widgets:
    - label: { text: "${label_text}", align: CENTER, width: 190, text_align: CENTER, long_mode: DOT }
