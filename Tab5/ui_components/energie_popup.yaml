# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file energie_popup.yaml
# @role Popup « Énergie » (ADR-0028, 04/10/2026, discussion #278) : en haut l'instantané
#       d'une installation solaire (cartes solaire, maison, réseau, batterie), en bas
#       l'historique de la production en barres (Heures / Jours / Mois) avec son total.
#       Ouvert par une tuile cap à l'option e (capteur de la section « Énergie » du
#       blueprint, tuile_appui → tab5_energie_ouvrir) ou par « Aller à l'écran → Énergie ».
# @architecture_constraint Chrome modal partagé (ADR-0009 : modal_scrim + modal_header,
#       corps à y = ${modal_body_y}), registre unique (ADR-0013 : « Énergie » dans
#       tab5_modal_registry_init). Corps : x 24..1226, y 72..670 — cartes de 210 px en
#       haut (y 72), graphique de 372 px en bas (y 298, 16 px d'écart, 20 px du bord).
#       Tout ce qui bouge est écrit par tab5_energie.cpp (cartes montrées, largeurs,
#       barres) : aucune valeur posée ici.
# @ai_instruction Un widget de plus = son champ dans EnergieUI (tab5_custom.h) et sa
#       ligne dans le script tab5_energie_ouvrir (tab5-energie.yaml).
# ═══════════════════════════════════════════════════════
obj:
  id: energie_popup
  align: CENTER
  width: 100%
  height: 100%
  hidden: true
  scrollable: false
  styles: style_invisible
  widgets:
    - !include { file: modal_scrim.yaml, vars: { scrim_opa: "100", close_lambda: "animate_popup_close(id(energie_popup));" } }

    # Carte modale — 15 px des bords écran (1280×720)
    - obj:
        align: CENTER
        width: ${modal_card_w}
        height: ${modal_card_h}
        styles: style_modal_card
        scrollable: false
        widgets:

          # ═══ BARRE DE TITRE (cadre v4 : icône + titre + croix, corps à y=72) ═══
          - !include { file: modal_header.yaml, vars: { icon: "\U000F0A72", icon_style: "style_text_gold", title: "Énergie", title_id: "energie_popup_titre", close_btn_id: "btn_energie_close", close_lambda: "animate_popup_close(id(energie_popup));" } }

          # ═══ INSTANTANÉ : 4 cartes, celles d'un capteur choisi seulement ═══
          #     (0 solaire, 1 maison, 2 réseau, 3 batterie ; noms écrits par tab5_energie.cpp)
          - !include { file: energie_carte.yaml, vars: { n: "0" } }
          - !include { file: energie_carte.yaml, vars: { n: "1" } }
          - !include { file: energie_carte.yaml, vars: { n: "2" } }
          - !include { file: energie_carte.yaml, vars: { n: "3" } }

          # ═══ HISTORIQUE DE LA PRODUCTION (capteur d'énergie choisi seulement) ═══
          - obj:
              id: energie_graphique
              align: TOP_LEFT
              x: 24
              y: 298
              width: 1202
              height: 372
              hidden: true
              styles: style_glass_card
              scrollable: false
              widgets:
                # « Aujourd'hui · 12.4 kWh », « 30 derniers jours · … », « 12 derniers mois · … »
                - label: { id: energie_titre, text: "", align: TOP_LEFT, x: 22, y: 18, text_font: roboto_32_b }
                - !include { file: energie_vue_btn.yaml, vars: { n: "0", x_pos: "-338", label_text: "Heures" } }
                - !include { file: energie_vue_btn.yaml, vars: { n: "1", x_pos: "-178", label_text: "Jours" } }
                - !include { file: energie_vue_btn.yaml, vars: { n: "2", x_pos: "-18", label_text: "Mois" } }
                # Barres, repère, maximum et axe : créés par tab5_energie.cpp (1166 × 286).
                - obj:
                    id: energie_zone
                    align: TOP_LEFT
                    x: 18
                    y: 72
                    width: 1166
                    height: 286
                    styles: style_transparent
                    scrollable: false

          # Avant le premier instantané de Home Assistant (ou sans le package tab5_energie).
          - label: { id: energie_attente, text: "En attente de Home Assistant", align: CENTER, y: 26, styles: style_text_dim }
