# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file climate_popup.yaml
# @role Popup plein écran clim (carte 1250×690, 15 px des bords écran 1280×720).
#       3 cartes de verre : MODE (Froid/Chaud/Sec/Ventil./Éteint), TEMPÉRATURE
#       (arc 320 px + cible au centre + boutons ± + température pièce) et OPTIONS
#       (presets Éco/Boost, Silence, flux d'air Oscillation/Brise).
#       Ouvert en tapant la cible de la carte clim compacte (climate_card.yaml), par
#       « Aller à l'écran → Climatisation », ou par une tuile cli (ADR-0023, ADR-0027).
# @architecture_constraint NON factorisable au-delà de ce qui l'est déjà (décision explicite,
#                          #T164, ADR-0007) : chaque bouton restant envoie une commande
#                          DIFFÉRENTE (oscillation / ventilation / eteindre) avec son geste
#                          propre. Seuls 6/10 boutons ont un template commun
#                          (climate_hvac_mode_btn.yaml ×4, climate_preset_toggle_btn.yaml ×2).
#                          Ne pas renommer arc_temp_popup / clim_target_popup / val_temp_int_popup
#                          / popup_icon_clim_* : posés dans g_clim_ui (script tab5_clim_ui) et
#                          peints par tab5_cards.cpp.
#                          CLIM AFFICHÉE (ADR-0027) : le popup montre la clim du blueprint, ou
#                          celle d'une tuile cli sans l'option m. Ses gestes (clim_popup_*) et
#                          ses commandes (emplacement clim_affichee_cle() : « clim » ou « tRT »)
#                          vont à celle-là ; la carte de l'accueil reste celle du blueprint. À
#                          la fermeture (croix, voile), le popup revient à la clim du blueprint.
# @ai_instruction Cadre modal v3 (ADR-0008) : scrim / marque / croix via modal_*.yaml
#       (en-tête y=6, côtés 10 px). `scrollable: false` partout — NE PAS retirer.
#       Cible optimiste via clim_popup_consigne() / clim_popup_pas() (tab5_cards.cpp),
#       qui lancent le débounce de la clim affichée (tab5_debounce_clim_temp ou _tuile).
#       Boutons Mode/Preset/… : geste clim_popup_* (état optimiste + couleurs,
#       clim_recolorer) AVANT l'envoi de la commande.
#       `pressed: bg_opa: 30%` répété (ESPHome rejette pressed: dans un style partagé).
#       Réglages de l'appareil (clé climr, ADR-0026, tab5_cards.cpp) : bornes de l'arc,
#       pas des ±, unité, titre = nom de la clim, boutons que l'appareil n'a pas masqués
#       et sections de la carte OPTIONS ré-empilées (leurs y ci-dessous sont ceux de
#       « tout affiché », repris par les constantes kOptions* : changer les deux ensemble).
#       Sans climr (blueprint plus ancien), l'écran reste tel que décrit ici. Les bascules
#       (Silence, Oscillation, Éco) testent l'état actif par clim_*_actif() : un mode
#       « low » ou « on » se désactive aussi.
# ═══════════════════════════════════════════════════════
obj:
  id: clim_options_popup
  align: CENTER
  width: 100%
  height: 100%
  hidden: true
  scrollable: false
  styles: style_invisible
  widgets:
    - !include { file: modal_scrim.yaml, vars: { scrim_opa: "100", close_lambda: "animate_popup_close(id(clim_options_popup)); clim_afficher_blueprint();" } }

    # Carte modale — 15 px des bords écran (1280×720)
    - obj:
        align: CENTER
        width: ${modal_card_w}
        height: ${modal_card_h}
        styles: style_modal_card
        scrollable: false
        widgets:

          # ═══ BARRE DE TITRE (cadre v4 : icône + titre + croix, corps à y=72) ═══
          - !include { file: modal_header.yaml, vars: { icon: "\U000F0717", icon_color: "color_info", title: "Climatisation Salon", title_id: "popup_clim_title", close_btn_id: "btn_clim_close", close_lambda: "animate_popup_close(id(clim_options_popup)); clim_afficher_blueprint();" } }

          # ═══ CARTE MODE (gauche) : 5 modes HVAC empilés ═══
          - obj:
              align: TOP_LEFT
              x: 24
              y: ${modal_body_y}
              width: 386
              height: 598
              styles: style_glass_card
              scrollable: false
              widgets:
                - label: { text: "MODE", align: TOP_LEFT, x: 22, y: 14, text_color: color_accent }

                # Pile flex : 4 modes via template + Éteint (climate.turn_off, service différent)
                - obj:
                    align: TOP_LEFT
                    x: 22
                    y: 50
                    width: 342
                    height: 540
                    styles: style_transparent
                    scrollable: false
                    layout:
                      type: FLEX
                      flex_flow: COLUMN
                      flex_align_main: START
                      flex_align_cross: CENTER
                      pad_row: 10
                    widgets:
                      - !include { file: climate_hvac_mode_btn.yaml, vars: { suffix: "cool", hvac_mode: "cool", icon: "\U000F0717", label_text: "Froid" } }
                      - !include { file: climate_hvac_mode_btn.yaml, vars: { suffix: "heat", hvac_mode: "heat", icon: "\U000F0238", label_text: "Chaud" } }
                      - !include { file: climate_hvac_mode_btn.yaml, vars: { suffix: "dry", hvac_mode: "dry", icon: "\U000F058E", label_text: "Sec" } }
                      - !include { file: climate_hvac_mode_btn.yaml, vars: { suffix: "fan", hvac_mode: "fan_only", icon: "\U000F0210", label_text: "Ventilation" } }
                      - button:
                          id: popup_btn_clim_off
                          width: 342
                          height: 88
                          radius: 18
                          styles: style_clim_btn
                          pressed:
                            bg_opa: 30%
                          on_short_click:
                            # Optimiste : mode "off" sur la clim affichée + couleurs avant le retour HA
                            - lambda: 'clim_popup_mode("off");'
                            - script.execute: { id: tab5_action, emplacement: !lambda 'return clim_affichee_cle();', commande: eteindre, valeur: "" }
                          widgets:
                            - label: { id: popup_icon_clim_off, text: "\U000F0425", align: LEFT_MID, x: 20, text_font: mdi_font_45, text_color: color_text_dim }
                            - label: { text: "Éteint", align: LEFT_MID, x: 88, text_font: roboto_32_b }

          # ═══ CARTE TEMPÉRATURE (centre) : arc + cible + ± + pièce ═══
          - obj:
              align: TOP_LEFT
              x: 426
              y: ${modal_body_y}
              width: 398
              height: 598
              styles: style_glass_card
              scrollable: false
              widgets:
                - label: { text: "TEMPÉRATURE", align: TOP_LEFT, x: 22, y: 14, text_color: color_accent }

                # Arc thermostat (16-30 °C, puis les bornes de la clim affichée) — cible
                # optimiste + appel HA débouncé
                - arc:
                    id: arc_temp_popup
                    align: TOP_MID
                    y: 52
                    width: 320
                    height: 320
                    min_value: 16
                    max_value: 30
                    value: 22
                    arc_color: color_arc_track
                    arc_width: 22
                    adjustable: true
                    indicator:
                      arc_color: color_info
                      arc_width: 22
                    knob:
                      bg_opa: 100%
                      bg_color: color_text
                      pad_all: 6
                    on_value:
                      - lambda: 'clim_popup_consigne(x);'

                # Cible au centre de l'arc (couleur pilotée par tab5_maj_clim : bleu/rouge/blanc)
                - label:
                    id: clim_target_popup
                    text: "--"
                    align: TOP_MID
                    y: 184
                    text_font: roboto_55_b
                # Unité : °C, ou °F selon HA (clim_reglages_recu).
                - label: { id: clim_unite_popup, text: "°C", align: TOP_MID, y: 248, text_color: color_text_dim }

                # Boutons − / + (pas de la clim affichée, 0,5° par défaut ; groupés par le
                # débounce si taps rapides ; consigne inconnue : rien, l'arc la choisit)
                - button:
                    align: TOP_LEFT
                    x: 22
                    y: 396
                    width: 160
                    height: 84
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - lambda: 'clim_popup_pas(-1);'
                    widgets:
                      - label: { text: "\U000F0374", align: CENTER, text_font: mdi_font_56 }
                - button:
                    align: TOP_LEFT
                    x: 216
                    y: 396
                    width: 160
                    height: 84
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - lambda: 'clim_popup_pas(+1);'
                    widgets:
                      - label: { text: "\U000F0415", align: CENTER, text_font: mdi_font_56 }

                # Température réelle de la pièce (tab5_maj_clim, ou clé ceRT d'une tuile)
                - label: { text: "\U000F050F", align: BOTTOM_MID, x: -135, y: -20, text_font: mdi_font_32, text_color: color_text_dim }
                - label: { text: "Pièce", align: BOTTOM_MID, x: -70, y: -20, text_color: color_text_dim }
                - label:
                    id: val_temp_int_popup
                    text: "-- °C"
                    align: BOTTOM_MID
                    x: 55
                    y: -20
                    text_font: roboto_32_b

          # ═══ CARTE OPTIONS (droite) : presets + ventilation + flux d'air ═══
          - obj:
              align: TOP_LEFT
              x: 840
              y: ${modal_body_y}
              width: 386
              height: 598
              styles: style_glass_card
              scrollable: false
              widgets:
                - label: { text: "OPTIONS", align: TOP_LEFT, x: 22, y: 14, text_color: color_accent }

                # ── Presets (toggle : re-taper = retour à "none") ──
                # ids des titres et de la rangée : ré-empilés par clim_options_empiler()
                # (tab5_cards.cpp) quand une section n'a pas de bouton sur l'appareil.
                - label: { id: clim_titre_presets, text: "Presets", align: TOP_LEFT, x: 22, y: 50, text_color: color_text_dim }
                - obj:
                    id: clim_rangee_presets
                    align: TOP_LEFT
                    x: 22
                    y: 76
                    width: 342
                    height: 92
                    styles: style_transparent
                    scrollable: false
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: START
                      flex_align_cross: CENTER
                      pad_column: 14
                    widgets:
                      # Éco envoie "away" (Daikin : pas de preset "eco") ; le blueprint envoie
                      # "eco" à un appareil qui l'a (ADR-0026). Actif sur eco OU away.
                      - !include { file: climate_preset_toggle_btn.yaml, vars: { suffix: "eco", preset_name: "away", icon: "\U000F032A", label_text: "Éco" } }
                      - !include { file: climate_preset_toggle_btn.yaml, vars: { suffix: "boost", preset_name: "boost", icon: "\U000F14DE", label_text: "Boost" } }

                # ── Ventilation ──
                - label: { id: clim_titre_ventilation, text: "Ventilation", align: TOP_LEFT, x: 22, y: 192, text_color: color_text_dim }
                - button:
                    id: popup_btn_clim_quiet
                    align: TOP_LEFT
                    x: 22
                    y: 218
                    width: 342
                    height: 88
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      # Optimiste : calcule la bascule sur la clim affichée et recolore
                      # (clim_popup_silence), puis envoie ce qu'elle vient de poser (pas de
                      # double bascule inversée). Actif sous tous ses noms (quiet, silence,
                      # low…) : sinon un appareil en « low » recevait « quiet » à chaque appui.
                      - lambda: 'clim_popup_silence();'
                      - script.execute: { id: tab5_action, emplacement: !lambda 'return clim_affichee_cle();', commande: ventilation, valeur: !lambda 'return clim_affichee_ventilation();' }
                    widgets:
                      - label: { id: popup_icon_clim_quiet, text: "\U000F146D", align: LEFT_MID, x: 20, text_font: mdi_font_45, text_color: color_text_dim }
                      - label: { text: "Silence", align: LEFT_MID, x: 88, text_font: roboto_32_b }

                # ── Flux d'air (Daikin Onecta : stop / swing / windnice ; ailleurs, le
                # blueprint traduit vers off, on, both, vertical…) ──
                - label: { id: clim_titre_flux, text: "Flux d'air", align: TOP_LEFT, x: 22, y: 330, text_color: color_text_dim }
                - button:
                    id: popup_btn_clim_swing
                    align: TOP_LEFT
                    x: 22
                    y: 356
                    width: 342
                    height: 88
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      # Optimiste : bascule sur la clim affichée, couleurs, puis envoi de ce
                      # qu'elle vient de poser. Actif sous tous ses noms (swing, on, both,
                      # vertical…), windnice exclu.
                      - lambda: 'clim_popup_oscillation();'
                      - script.execute: { id: tab5_action, emplacement: !lambda 'return clim_affichee_cle();', commande: oscillation, valeur: !lambda 'return clim_affichee_oscillation();' }
                    widgets:
                      - label: { id: popup_icon_clim_swing, text: "\U000F0E79", align: LEFT_MID, x: 20, text_font: mdi_font_45, text_color: color_text_dim }
                      - label: { text: "Oscillation", align: LEFT_MID, x: 88, text_font: roboto_32_b }
                - button:
                    id: popup_btn_clim_windnice
                    align: TOP_LEFT
                    x: 22
                    y: 454
                    width: 342
                    height: 88
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      # Optimiste : bascule windnice ↔ stop sur la clim affichée, couleurs,
                      # puis envoi de ce qu'elle vient de poser.
                      - lambda: 'clim_popup_brise();'
                      - script.execute: { id: tab5_action, emplacement: !lambda 'return clim_affichee_cle();', commande: oscillation, valeur: !lambda 'return clim_affichee_oscillation();' }
                    widgets:
                      - label: { id: popup_icon_clim_windnice, text: "\U000F059D", align: LEFT_MID, x: 20, text_font: mdi_font_45, text_color: color_text_dim }
                      - label: { text: "Brise", align: LEFT_MID, x: 88, text_font: roboto_32_b }
