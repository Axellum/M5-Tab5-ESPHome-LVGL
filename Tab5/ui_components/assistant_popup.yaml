# ═══════════════════════════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file assistant_popup.yaml
# @role Popup plein écran de l'Assistant vocal (carte modale standard 1250×690, cadre v4).
#       Gauche = réglages (choix LLM/pipeline, Ok Nabu, muet, volume, taille texte).
#       Droite = "Votre demande" (STT) + "Réponse" écrite (Markdown : tableaux
#       alignés en monospace + image via online_image). Barre d'action en bas.
# @architecture_constraint Positions ABSOLUES (x/y fixes) + les états actifs ne
#       changent que la bordure (dessinée à l'intérieur) => aucun bouton ne se
#       décale. Toute la logique vit en C++/scripts (décision 0006), pas ici.
# @open Ouvert par appui long sur la zone micro (tab5-lvgl.yaml), par une demande
#       vocale (on_stt_end -> tab5_assist_on_request) ou par le service HA
#       tab5_assist_reponse. Fermé par le scrim, la croix ou "Fermer".
# ═══════════════════════════════════════════════════════════════════════════
obj:
  id: assistant_popup
  align: CENTER
  width: 100%
  height: 100%
  hidden: true
  scrollable: false
  styles: style_invisible
  widgets:
    # Voile modal (ferme au tap)
    - !include { file: modal_scrim.yaml, vars: { scrim_opa: "85", close_lambda: "id(tab5_assist_close).execute();" } }

    # Carte modale
    - obj:
        align: CENTER
        width: ${modal_card_w}
        height: ${modal_card_h}
        styles: style_modal_card
        scrollable: false
        widgets:

          # ═══ BARRE DE TITRE (cadre v4 : icône + titre + croix, corps à y=72) ═══
          - !include { file: modal_header.yaml, vars: { icon: "\U000F036C", icon_color: "color_info", title: "Assistant vocal", title_id: "popup_assist_title", close_btn_id: "btn_assist_close", close_lambda: "id(tab5_assist_close).execute();" } }

          # ═══════════════════════════════════════════════════════════════════
          # COLONNE GAUCHE — RÉGLAGES
          # ═══════════════════════════════════════════════════════════════════
          - obj:
              id: assist_settings_panel
              align: TOP_LEFT
              x: 24
              y: ${modal_body_y}
              width: 380
              height: 506
              styles: style_glass_card
              scrollable: false
              widgets:
                - label: { text: "\U000F062E", align: TOP_LEFT, x: 16, y: 14, text_font: mdi_assist_36, text_color: color_text_dim }
                - label: { text: "Réglages", align: TOP_LEFT, x: 60, y: 18, text_font: roboto_32_b, text_color: color_text }

                # --- Cerveau / LLM ---
                # [AI-CONTEXT] Panneau reglages 380x506 — layout recalcule le 29/07
                # (2e passe, demande Axel sur capture ecran). Boutons LLM en
                # ICONE SEULE (le texte "Domotique"/"Discussion" est retire — trop
                # a l'etroit avec l'icone, cf. 1re passe qui avait deja du monter le
                # bouton a 84 px pour separer icone/texte de 6 px). L'etat actif
                # reste visible par la bordure coloree (highlight_button_border,
                # tab5-scripts.yaml:915-916/961-962 — reference id(btn_assist_pipe_*),
                # ne touche pas au contenu interne). Barre de son ANCREE EN BAS du
                # panneau (marge 24 px, symetrique de la marge haute) plutot que
                # juste sous Ok Nabu : c'est ce qui etait demande.
                - label: { text: "Cerveau / LLM", align: TOP_LEFT, x: 16, y: 68, text_font: roboto_22, text_color: color_text_dim }
                - button:
                    id: btn_assist_pipe_domo
                    align: TOP_LEFT
                    x: 16
                    y: 104
                    width: 168
                    height: 72
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - script.execute:
                          id: tab5_set_assist_mode
                          discussion: false
                    widgets:
                      - label: { text: "\U000F07D0", align: CENTER, text_font: mdi_assist_36, text_color: color_text }
                - button:
                    id: btn_assist_pipe_discu
                    align: TOP_LEFT
                    x: 196
                    y: 104
                    width: 168
                    height: 72
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - script.execute:
                          id: tab5_set_assist_mode
                          discussion: true
                    widgets:
                      - label: { text: "\U000F0450", align: CENTER, text_font: mdi_assist_36, text_color: color_text }

                # --- Ok Nabu (mot de réveil) ---
                - button:
                    id: btn_assist_wake
                    align: TOP_LEFT
                    x: 16
                    y: 196
                    width: 348
                    height: 56
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - switch.toggle: tab5_wake_word_active
                      - script.execute: tab5_assist_sync_settings
                    widgets:
                      - label: { id: lbl_assist_wake, text: "Ok Nabu : ON", align: CENTER, text_font: roboto_22, text_color: color_success }

                # --- Taille du texte de réponse (remontee : la barre de son est
                # maintenant ancree au bas du panneau, voir plus bas) ---
                - label: { text: "Taille du texte", align: TOP_LEFT, x: 16, y: 276, text_font: roboto_22, text_color: color_text_dim }
                - button:
                    id: btn_assist_size_s
                    align: TOP_LEFT
                    x: 16
                    y: 312
                    width: 108
                    height: 52
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - script.execute:
                          id: tab5_assist_set_text_size
                          size: 0
                    widgets:
                      - label: { text: "A-", align: CENTER, text_font: roboto_22, text_color: color_text }
                - button:
                    id: btn_assist_size_m
                    align: TOP_LEFT
                    x: 136
                    y: 312
                    width: 108
                    height: 52
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - script.execute:
                          id: tab5_assist_set_text_size
                          size: 1
                    widgets:
                      - label: { text: "A", align: CENTER, text_font: roboto_32_b, text_color: color_text }
                - button:
                    id: btn_assist_size_l
                    align: TOP_LEFT
                    x: 256
                    y: 312
                    width: 108
                    height: 52
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - script.execute:
                          id: tab5_assist_set_text_size
                          size: 2
                    widgets:
                      - label: { text: "A+", align: CENTER, text_font: roboto_32_b, text_color: color_text }

                # --- Muet + Volume --- ANCRES EN BAS du panneau (y=422/442,
                # marge basse 24 px symetrique de la marge haute), comme demande
                # explicitement : la barre de son avait deja ete descendue une 1re
                # fois (y=292) mais restait juste sous "Ok Nabu", pas "en bas".
                # 58 px de respiration avec les boutons A-/A/A+ au-dessus.
                - button:
                    id: btn_assist_mute
                    align: TOP_LEFT
                    x: 16
                    y: 422
                    width: 80
                    height: 60
                    radius: 18
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - if:
                          condition:
                            lambda: 'return id(system_muted);'
                          then:
                            - globals.set:
                                id: system_muted
                                value: 'false'
                            - media_player.volume_set:
                                id: speaker_player
                                volume: !lambda 'return id(system_volume);'
                          else:
                            - globals.set:
                                id: system_muted
                                value: 'true'
                            - media_player.volume_set:
                                id: speaker_player
                                volume: 0.0
                      - script.execute: tab5_assist_sync_settings
                    widgets:
                      - label: { id: icon_assist_mute, text: "\U000F057E", align: CENTER, text_font: mdi_assist_36, text_color: color_text }
                - slider:
                    id: slider_assist_volume
                    align: TOP_LEFT
                    x: 112
                    y: 442
                    width: 252
                    height: 20
                    min_value: 0
                    max_value: 100
                    value: 100
                    on_value:
                      - globals.set:
                          id: system_volume
                          value: !lambda 'return x / 100.0f;'
                      - globals.set:
                          id: system_muted
                          value: 'false'
                      - script.execute: tab5_debounce_volume_set

          # ═══════════════════════════════════════════════════════════════════
          # COLONNE DROITE — DEMANDE + RÉPONSE
          # ═══════════════════════════════════════════════════════════════════
          # --- Votre demande ---
          - obj:
              align: TOP_LEFT
              x: 420
              y: ${modal_body_y}
              width: 806
              height: 104
              styles: style_glass_card
              scrollable: false
              widgets:
                - label: { text: "\U000F0361", align: TOP_LEFT, x: 16, y: 14, text_font: mdi_assist_36, text_color: color_info }
                - label: { text: "VOTRE DEMANDE", align: TOP_LEFT, x: 60, y: 16, text_font: roboto_22, text_color: color_text_dim }
                - label:
                    id: lbl_assist_request
                    align: TOP_LEFT
                    x: 60
                    y: 44
                    width: 746
                    text: "Appuyez sur le micro puis parlez…"
                    text_font: roboto_22
                    text_color: color_text

          # --- Réponse (texte + tableaux + image) ---
          - obj:
              align: TOP_LEFT
              x: 420
              y: ${assist_resp_y}
              width: 806
              height: 390
              styles: style_glass_card
              scrollable: false
              widgets:
                - label: { text: "\U000F021A", align: TOP_LEFT, x: 16, y: 14, text_font: mdi_assist_36, text_color: color_success }
                - label: { text: "RÉPONSE", align: TOP_LEFT, x: 60, y: 16, text_font: roboto_22, text_color: color_text_dim }
                - label: { text: "\U000F0A71", align: TOP_RIGHT, x: -60, y: 16, text_font: mdi_assist_36, text_color: color_text_dim }
                - label: { text: "\U000F021F", align: TOP_RIGHT, x: -16, y: 16, text_font: mdi_assist_36, text_color: color_text_dim }

                # Zone défilante : réponse + image (défile verticalement si long)
                - obj:
                    id: assist_response_scroll
                    align: TOP_LEFT
                    x: 16
                    y: 54
                    width: 790
                    height: 322
                    styles: style_transparent
                    scrollbar_mode: AUTO
                    layout:
                      type: FLEX
                      flex_flow: COLUMN
                      flex_align_main: START
                      flex_align_cross: START
                      pad_row: 10
                    widgets:
                      - label:
                          id: lbl_assist_response
                          width: 100%
                          text: ""
                          text_font: roboto_mono_24
                          text_color: color_text
                      - image:
                          id: assist_img_widget
                          src: assist_response_image
                          hidden: true
                      - label:
                          id: assist_img_hint
                          text: ""
                          hidden: true
                          text_font: roboto_22
                          text_color: color_text_dim

          # ═══ BARRE D'ACTION (bas) ═══
          - obj:
              align: BOTTOM_MID
              y: ${modal_bottom_y}
              width: 1202
              height: 84
              styles: style_transparent
              scrollable: false
              widgets:
                - label: { id: lbl_assist_status, text: "Prêt", align: LEFT_MID, x: 8, text_font: roboto_22, text_color: color_text_dim }

                # Micro : démarre / interrompt + ré-écoute (Click to Converse)
                - button:
                    id: btn_assist_mic
                    align: CENTER
                    x: -100
                    width: 240
                    height: 68
                    radius: 20
                    styles: style_pill_accent
                    pressed:
                      bg_opa: 45%
                    on_short_click:
                      - script.execute: tab5_assist_toggle
                    widgets:
                      - label: { text: "\U000F036C", align: LEFT_MID, x: 30, text_font: mdi_assist_36, text_color: color_text }
                      - label: { text: "Parler", align: CENTER, x: 20, text_font: roboto_32_b, text_color: color_text }

                # Stop : coupe pipeline + TTS
                - button:
                    id: btn_assist_stop
                    align: CENTER
                    x: 150
                    width: 130
                    height: 68
                    radius: 20
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - script.execute: tab5_vocal_interrupt
                    widgets:
                      - label: { text: "\U000F04DB", align: CENTER, text_font: mdi_assist_36, text_color: color_error }

                # Fermer
                - button:
                    align: RIGHT_MID
                    x: -4
                    width: 180
                    height: 68
                    radius: 20
                    styles: style_clim_btn
                    pressed:
                      bg_opa: 30%
                    on_short_click:
                      - script.execute: tab5_assist_close
                    widgets:
                      - label: { text: "Fermer", align: CENTER, text_font: roboto_22, text_color: color_text }
