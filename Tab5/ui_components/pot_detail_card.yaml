# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Template paramétré (!include+vars), réutilisé 5x par pots_popup.yaml.
# vars : pot_idx (1-5 — suffixe des ids icon_pot_d*/lbl_pot_d*_*), x_pos (X de la carte
#        dans la modale), pot_nom (titre affiché), icon (glyphe MDI du pot — MÊME icône
#        que le dashboard, tableau icones[] de pots_humidite_maj(), tab5_rangee.cpp).
# Ne rien assigner ici : icône/valeurs/couleurs sont poussées en continu par
# update_pots_popup_moisture_ui et update_pot_metric_ui (tab5_custom.cpp) via les
# capteurs de tab5-sensors-domotique.yaml.
# Taille de la carte (lot 4 du portage, ADR-0061) : x_pos est la place du Tab5 (pas de 244),
# ramenée au pas de la carte (pot_carte_pas, tab5-ui-tokens.yaml) ; largeur pot_carte_l
# (226 sur le Tab5, 178 sur la 7B), les y ramenés à la hauteur du corps. Lignes Fertilité,
# Lumière, Température, Batterie : marge pot_ligne_marge, texte à pot_texte_x (14 et 50 sur
# le Tab5 ; 5 et 38 sur la 7B, roboto_22 ne rétrécissant pas), légende et valeur centrées
# en hauteur (deux lignes de 27 px de roboto_22). tests/test_plantes_popup.py.
# ═══════════════════════════════════════════════════════
obj:
  # Masquée et recentrée par zones_apply_ui() quand le pot est absent (lot 5).
  id: "pot_card_${pot_idx}"
  align: TOP_LEFT
  x: ${ 24 + ((x_pos | int) - 24) // 244 * (pot_carte_pas | int) }
  y: ${modal_body_y}
  width: ${pot_carte_l}
  height: ${corps_h}
  styles: style_glass_card
  scrollable: false
  widgets:
    # Nom + icône plante (couleur = humidité, comme les slots du dashboard)
    - label: { text: "${pot_nom}", align: TOP_MID, y: "${ 16 * (corps_h | int) // 598 }", text_font: roboto_32_b }
    - label: { id: "icon_pot_d${pot_idx}", text: "${icon}", align: TOP_MID, y: "${ 58 * (corps_h | int) // 598 }", text_font: mdi_font_56, styles: style_text_dim }

    # Humidité du sol (grande valeur) + statut arrosage (OK / Bientôt sec / À arroser / Hors ligne)
    - label: { id: "lbl_pot_d${pot_idx}_moist", text: "--", align: TOP_MID, y: "${ 130 * (corps_h | int) // 598 }", styles: [style_police_date, style_text_dim] }
    - label: { id: "lbl_pot_d${pot_idx}_status", text: "", align: TOP_MID, y: "${ 188 * (corps_h | int) // 598 }", styles: style_text_dim }

    # ─── Fertilité (conductivité EC, µS/cm) ───
    - obj:
        align: TOP_LEFT
        x: ${pot_ligne_marge}
        y: ${ 236 * (corps_h | int) // 598 }
        width: ${pot_ligne_l}
        height: ${ 74 * (corps_h | int) // 598 }
        styles: style_transparent
        scrollable: false
        widgets:
          - label: { text: "\U000F0241", align: LEFT_MID, x: 2, text_font: mdi_font_32, styles: style_text_accent_alt }
          - label: { text: "Fertilité", align: TOP_LEFT, x: "${pot_texte_x}", y: "${ (74 * (corps_h | int) // 598 - 54) // 2 + 2 }", styles: style_text_dim }
          - label: { id: "lbl_pot_d${pot_idx}_ec", text: "--", align: TOP_LEFT, x: "${pot_texte_x}", y: "${ (74 * (corps_h | int) // 598 - 54) // 2 + 30 }" }

    # ─── Éclairement (lx) ───
    - obj:
        align: TOP_LEFT
        x: ${pot_ligne_marge}
        y: ${ 316 * (corps_h | int) // 598 }
        width: ${pot_ligne_l}
        height: ${ 74 * (corps_h | int) // 598 }
        styles: style_transparent
        scrollable: false
        widgets:
          - label: { text: "\U000F05A9", align: LEFT_MID, x: 2, text_font: mdi_font_32, styles: style_text_gold }
          - label: { text: "Lumière", align: TOP_LEFT, x: "${pot_texte_x}", y: "${ (74 * (corps_h | int) // 598 - 54) // 2 + 2 }", styles: style_text_dim }
          - label: { id: "lbl_pot_d${pot_idx}_lux", text: "--", align: TOP_LEFT, x: "${pot_texte_x}", y: "${ (74 * (corps_h | int) // 598 - 54) // 2 + 30 }" }

    # ─── Température (°C, gradient get_temperature_color) ───
    - obj:
        align: TOP_LEFT
        x: ${pot_ligne_marge}
        y: ${ 396 * (corps_h | int) // 598 }
        width: ${pot_ligne_l}
        height: ${ 74 * (corps_h | int) // 598 }
        styles: style_transparent
        scrollable: false
        widgets:
          - label: { text: "\U000F050F", align: LEFT_MID, x: 2, text_font: mdi_font_32, styles: style_text_info }
          - label: { text: "Température", align: TOP_LEFT, x: "${pot_texte_x}", y: "${ (74 * (corps_h | int) // 598 - 54) // 2 + 2 }", styles: style_text_dim }
          - label: { id: "lbl_pot_d${pot_idx}_temp", text: "--", align: TOP_LEFT, x: "${pot_texte_x}", y: "${ (74 * (corps_h | int) // 598 - 54) // 2 + 30 }" }

    # ─── Batterie du capteur (%, échelle get_battery_color) ───
    - obj:
        align: TOP_LEFT
        x: ${pot_ligne_marge}
        y: ${ 476 * (corps_h | int) // 598 }
        width: ${pot_ligne_l}
        height: ${ 74 * (corps_h | int) // 598 }
        styles: style_transparent
        scrollable: false
        widgets:
          - label: { text: "\U000F0079", align: LEFT_MID, x: 2, text_font: mdi_font_32, styles: style_text_success }
          - label: { text: "Batterie", align: TOP_LEFT, x: "${pot_texte_x}", y: "${ (74 * (corps_h | int) // 598 - 54) // 2 + 2 }", styles: style_text_dim }
          - label: { id: "lbl_pot_d${pot_idx}_bat", text: "--", align: TOP_LEFT, x: "${pot_texte_x}", y: "${ (74 * (corps_h | int) // 598 - 54) // 2 + 30 }" }
