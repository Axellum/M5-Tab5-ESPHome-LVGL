# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file climate_card.yaml
# @role Zone clim dashboard : températures Salon/Serre hors carte, verre
#       `style_clim_carte_page` uniquement autour de − / température cible / + —
#       la « tuile − / + », qui règle l'appareil choisi (ADR-0033).
#       Appui long sur une des deux températures : son historique (popup « Température »,
#       ADR-0032) ; appui court sur la serre : l'arcade.
# @architecture_constraint Grille du haut (tab5-lvgl.yaml, 05/10/2026) : la carte occupe la
#                          colonne de droite sous HA / Sys / TV (855-1260, bord droit
#                          aligné sur le bandeau central). Tuile verre 405 × 90, bas à y 308
#                          (25 px au-dessus du bandeau, comme bandeau → titres météo),
#                          − et + de 62 px à 14 px des quatre bords. Températures centrées
#                          entre les boutons du haut (y 110) et la tuile (y 218), alignées
#                          sur le bord gauche du − et le bord droit du +. Valeurs et consigne
#                          dans la police de la date du thème (style_police_date).
# @architecture_constraint `current_serre`/`val_temp_salon` sont mis à jour par
#                          tab5_piece_climat.cpp (capteurs temp_salon / temp_serre de
#                          tab5-sensors-domotique.yaml, clé « pR » de tab5_maj_emplacements). `clim_target` est aussi poussé par
#                          tab5_maj_clim (autoritaire), MAIS mis à jour de façon OPTIMISTE au
#                          tap ± ci-dessous (21/07) via update_clim_target_ui + débounce.
# @architecture_constraint Tuile − / + au choix (ADR-0033, 06/10/2026) : toucher l'icône ou la
#                          température du salon (btn_reglables_liste) déroule la liste
#                          (reglables_liste.yaml) : la clim du blueprint, les appareils de la
#                          section « Tuile − / + » du blueprint, le volume de la tablette. Le
#                          choix reste (NVS). Clim choisie : tout ce qui suit est inchangé.
#                          Autre appareil : clim_target est masqué, reglable_rangee montre son
#                          icône et sa valeur ; − / + passent par reglables_pas() et la valeur
#                          par reglables_valeur_appui() (tab5_reglables.cpp).
# @architecture_constraint Climat de la pièce (ADR-0040, 09/10/2026) : en mode HA, sur une
#                          pièce dont le blueprint a déclaré la température, les deux rangées
#                          du haut montrent un thermomètre et sa température (gauche), une
#                          goutte et son humidité si elle est déclarée (droite, sinon rien),
#                          et la tuile − / + règle la clim de la pièce si elle en a une.
#                          Textes, glyphes, couleurs et masquage de ces quatre labels :
#                          tab5_piece_climat.cpp seulement (accueil_temperatures_ui).
# @ai_instruction Les boutons +/- reprennent le mécanisme optimiste+débounce du popup
#                 (accumulation dans clim_target_temp, un seul set_temperature par geste via
#                 tab5_debounce_clim_temp). Pas et bornes : clim_consigne_suivante() (réglages
#                 de l'appareil, ADR-0026), jamais de 0.5f / 16 / 30 en dur. Le clic sur la
#                 cible ouvre le popup sur la clim du blueprint (ADR-0027 : il peut aussi
#                 montrer celle d'une tuile). Conteneur parent = transparent (ids conservés).
#                 La consigne (clim_target) montre TOUJOURS la clim du blueprint (ses globals
#                 clim_*), même masquée quand un autre appareil est choisi.
# ═══════════════════════════════════════════════════════
obj:
  id: climate_card
  x: 855
  y: 110
  width: 405
  height: 198
  styles: style_transparent
  scrollbar_mode: "OFF"
  pad_all: 0
  widgets:

    # ═══ Températures pièces — HORS zone verre ═══
    # Icône de 45 px + valeur dans la police de la date du thème (style_police_date,
    # demande d'Axel du 05/10/2026), en rangées flex : l'icône suit la largeur du texte,
    # qui change avec la police (« -12.5 ° » : 97 à 145 px selon le thème). Rangées
    # centrées à y 54 de la carte (164 sur l'écran, milieu de 110-218), alignées sur le
    # bord gauche du − et le bord droit du + ; 8 px entre icône et valeur : au pire
    # (police la plus large, serre à -12.5 °) salon 14..192 et serre 193..391 ne se
    # touchent pas. Une valeur masquée (zones_apply_ui) sort de la rangée (flex).
    - obj:
        align: LEFT_MID
        x: 14
        y: -45
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        styles: style_transparent
        scrollable: false
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_cross: CENTER
          pad_column: 8
        widgets:
          - label: { id: icon_salon, text: "\U000F04B9", text_font: mdi_font_45, styles: style_text_dim }
          - label: { id: val_temp_salon, text: "-- °", styles: [style_police_date, style_text_temp_max] }
    - obj:
        align: RIGHT_MID
        x: -14
        y: -45
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        styles: style_transparent
        scrollable: false
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_cross: CENTER
          pad_column: 8
        widgets:
          - label: { id: icon_serre, text: "\U000F002D", text_font: mdi_font_45, styles: style_text_dim }
          - label: { id: current_serre, text: "-- °", styles: [style_police_date, style_text_temp_max] }
    # Zone tactile sur la température serre → appui court : le sélecteur de jeux Arcade ;
    # appui long : l'historique et la prévision de la seconde température (ADR-0032 ; LVGL
    # n'envoie pas l'appui court après un appui long). Sans serre, l'icône est une manette
    # et l'appui long ne fait rien.
    # [26/07/2026] FIX : la zone était posée à côté de ce qu'elle est censée
    # couvrir (elle ne touchait QUE l'icône, jamais la valeur affichée : taper la
    # température ne déclenchait rien). Depuis le 05/10/2026 (rangée de 45 px) : la
    # rangée serre occupe au plus 193..391 et y 24..85 (texte jusqu'à 61 px de haut) ;
    # la zone couvre 199..399 et y 22..86, sans toucher la rangée salon (≤ 192 dans la
    # police la plus large) ni climate_controls_zone (± et cible, dès y 108).
    - button:
        id: btn_serre_games
        align: TOP_RIGHT
        x: -6
        y: 22
        width: 200
        height: 64
        styles: style_invisible
        on_short_click:
          - script.execute: tab5_arcade_open
        on_long_press:
          # « serre », rien sans serre ; en mode HA sur une pièce à température déclarée
          # (ADR-0040), la droite montre son humidité : rien non plus.
          - lambda: |-
              const char* cle = accueil_historique_cle(true);
              if (cle != nullptr) id(tab5_historique_ouvrir).execute(std::string(cle));

    # Zone tactile sur l'icône et la température du salon → déroule la liste des
    # appareils de la tuile − / + (ADR-0033, demande d'Axel du 06/10/2026). Même boîte que
    # celle de la serre, côté gauche : la rangée salon occupe au plus 14..192 et y 24..85 ;
    # la zone couvre 4..196 et y 22..86, sans toucher btn_serre_games (199..399) ni
    # climate_controls_zone (dès y 108). Elle reste là sans capteur du salon (sa place).
    # Appui long : l'historique de la température de la pièce (popup « Température »,
    # ADR-0032) ; pièce absente, il ne fait rien. Une seule zone pour les deux gestes
    # (LVGL n'envoie pas l'appui court après un appui long), comme btn_serre_games.
    - button:
        id: btn_reglables_liste
        align: TOP_LEFT
        x: 4
        y: 22
        width: 192
        height: 64
        styles: style_invisible
        on_short_click:
          - lambda: 'reglables_liste_basculer();'
        on_long_press:
          # « salon », rien sans salon ; en mode HA sur une pièce à température déclarée
          # (ADR-0040), l'historique de cette température : « pR ».
          - lambda: |-
              const char* cle = accueil_historique_cle(false);
              if (cle != nullptr) id(tab5_historique_ouvrir).execute(std::string(cle));

    # ═══ Zone verre uniquement autour de − / cible / + ═══
    - obj:
        id: climate_controls_zone
        align: BOTTOM_MID
        y: 0
        width: 405
        height: 90
        styles: style_clim_carte_page
        scrollbar_mode: "OFF"
        # − et + en verre plein (style_clim_btn, opaque depuis le 01/10/2026) : ils sont
        # posés sur cette tuile, pas sur la page — un pré-mélange sur BG serait faux ici.
        widgets:
          - label:
              id: clim_target
              text: ""
              align: CENTER
              # Police de la date du thème (05/10/2026, avant roboto_55_b).
              styles: style_police_date

          # Autre appareil que la clim (ADR-0033) : son icône (palette des tuiles) et sa
          # valeur dans la police de la date, centrées entre − et + (75..330 : 255 px ;
          # « 100 % » et une icône de 45 px en prennent ~180). Masquée quand la clim est
          # choisie ; peinte par tab5_reglables.cpp.
          - obj:
              id: reglable_rangee
              align: CENTER
              width: SIZE_CONTENT
              height: SIZE_CONTENT
              hidden: true
              styles: style_transparent
              scrollable: false
              layout:
                type: FLEX
                flex_flow: ROW
                flex_align_cross: CENTER
                pad_column: 8
              widgets:
                - label: { id: reglable_icone, text: "", text_font: mdi_font_45, styles: style_text_dim }
                - label: { id: reglable_valeur, text: "--", styles: style_police_date }

          - button:
              id: btn_clim_target_click
              align: CENTER
              # 200 : couvre la valeur d'un autre appareil (icône + texte, jusqu'à 243 px)
              # sans toucher − (13 à 75) ni + (330 à 392).
              width: 200
              height: 68
              styles: style_invisible
              on_short_click:
                # Le popup montre la clim du blueprint, celle de cette carte (il a pu
                # montrer celle d'une tuile, ADR-0027). Un autre appareil choisi (ADR-0033) :
                # le popup de sa tuile ou la télécommande, sinon rien.
                - lambda: |-
                    if (!reglables_clim_choisie()) {
                      reglables_valeur_appui();
                      return;
                    }
                    clim_afficher_blueprint();
                    animate_popup_open(id(clim_options_popup));

          - button:
              id: btn_clim_minus
              align: LEFT_MID
              x: 13  # + bordure 1 px de la tuile = 14 px du bord, comme en haut et en bas
              width: 62
              height: 62
              radius: 12
              styles: style_clim_btn
              pressed:
                bg_opa: 30%
              on_short_click:
                # Optimiste + débounce (même mécanisme que le popup) : on accumule dans
                # clim_target_temp, on met à jour le label tout de suite, et un seul
                # set_temperature part une fois le doigt immobile. Avant, l'appel HA direct
                # ne mettait jamais à jour le global → taps rapides = même valeur renvoyée +
                # aucun retour visuel avant le push HA. Pas et bornes : ceux de l'appareil
                # (clé climr, ADR-0026), 0,5 entre 16 et 30 tant que HA ne les a pas donnés.
                # Un autre appareil choisi (ADR-0033) : reglables_pas(), même principe.
                - if:
                    condition:
                      lambda: 'return reglables_clim_choisie();'
                    then:
                      - lambda: |-
                          const float t = clim_consigne_suivante(id(clim_target_temp), -1);
                          id(clim_target_temp) = t;
                          update_clim_target_ui(id(clim_target), nullptr, t);
                      - script.execute: tab5_debounce_clim_temp
                    else:
                      - lambda: 'reglables_pas(-1);'
              widgets:
                - label: { text: "\U000F0374", align: CENTER, text_font: mdi_font_56 }

          - button:
              id: btn_clim_plus
              align: RIGHT_MID
              x: -13
              width: 62
              height: 62
              radius: 12
              styles: style_clim_btn
              pressed:
                bg_opa: 30%
              on_short_click:
                # Optimiste + débounce (même mécanisme que le popup) — voir bouton −.
                - if:
                    condition:
                      lambda: 'return reglables_clim_choisie();'
                    then:
                      - lambda: |-
                          const float t = clim_consigne_suivante(id(clim_target_temp), +1);
                          id(clim_target_temp) = t;
                          update_clim_target_ui(id(clim_target), nullptr, t);
                      - script.execute: tab5_debounce_clim_temp
                    else:
                      - lambda: 'reglables_pas(+1);'
              widgets:
                - label: { text: "\U000F0415", align: CENTER, text_font: mdi_font_56 }
