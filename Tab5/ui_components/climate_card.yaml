# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file climate_card.yaml
# @role Zone clim dashboard : températures Salon/Serre hors carte, verre
#       `style_clim_carte_page` uniquement autour de − / température cible / +.
# @architecture_constraint Grille du haut (tab5-lvgl.yaml, 05/10/2026) : la carte occupe la
#                          colonne de droite sous HA / Sys / TV (855-1260, bord droit
#                          aligné sur le bandeau central). Tuile verre 405 × 90, bas à y 308
#                          (25 px au-dessus du bandeau, comme bandeau → titres météo),
#                          − et + de 62 px à 14 px des quatre bords. Températures centrées
#                          entre les boutons du haut (y 110) et la tuile (y 218), alignées
#                          sur le bord gauche du − et le bord droit du +.
# @architecture_constraint `current_serre`/`val_temp_salon` sont mis à jour par les services
#                          `tab5_maj_clim`/helpers C++ (tab5-api-logic.yaml,
#                          tab5-sensors-domotique.yaml). `clim_target` est aussi poussé par
#                          tab5_maj_clim (autoritaire), MAIS mis à jour de façon OPTIMISTE au
#                          tap ± ci-dessous (21/07) via update_clim_target_ui + débounce.
# @ai_instruction Les boutons +/- reprennent le mécanisme optimiste+débounce du popup
#                 (accumulation dans clim_target_temp, un seul set_temperature par geste via
#                 tab5_debounce_clim_temp). Pas et bornes : clim_consigne_suivante() (réglages
#                 de l'appareil, ADR-0026), jamais de 0.5f / 16 / 30 en dur. Le clic sur la
#                 cible ouvre le popup sur la clim du blueprint (ADR-0027 : il peut aussi
#                 montrer celle d'une tuile). Conteneur parent = transparent (ids conservés).
#                 La carte montre TOUJOURS la clim du blueprint (ses globals clim_*).
# ═══════════════════════════════════════════════════════
obj:
  id: climate_card
  x: 855
  y: 110
  width: 405
  height: 198
  styles: style_transparent
  scrollbar_mode: "OFF"
  pad_all: 0
  widgets:

    # ═══ Températures pièces — HORS zone verre ═══
    # Icônes de 45 px à y 31 : centre à y 163,5 sur l'écran, au milieu de 110-218.
    - label: { id: icon_salon, text: "\U000F04B9", align: TOP_LEFT, x: 14, y: 31, text_font: mdi_font_45, styles: style_text_dim }
    - label: { id: val_temp_salon, text: "-- °", align: TOP_LEFT, x: 81, y: 36, text_font: roboto_32_b, styles: style_text_temp_max }
    - label: { id: icon_serre, text: "\U000F002D", align: TOP_RIGHT, x: -120, y: 31, text_font: mdi_font_45, styles: style_text_dim }
    - label: { id: current_serre, text: "-- °", align: TOP_RIGHT, x: -14, y: 36, text_font: roboto_32_b, styles: style_text_temp_max }
    # Zone tactile sur la température serre → ouvre le sélecteur de jeux Arcade.
    # [26/07/2026] FIX : la zone était posée à côté de ce qu'elle est censée
    # couvrir (elle ne touchait QUE l'icône, jamais la valeur affichée : taper la
    # température ne déclenchait rien). Arithmétique (carte large de 405 depuis le
    # 05/10/2026, alignement TOP_RIGHT donc les offsets x sont comptés depuis le
    # bord DROIT de la carte) :
    #   icon_serre     x=-120, police 45  -> occupe ~240..285
    #   current_serre  x=-14,  police 32b -> occupe ~311..391
    # La zone couvre 227..399 et y 25..79, c'est-à-dire l'icône ET la valeur, avec
    # 8 à 13 px de marge. Ne pas l'agrandir davantage : au-delà de 405 on sort de la
    # carte, et sous y=108 on entre dans climate_controls_zone (± et cible).
    - button:
        id: btn_serre_games
        align: TOP_RIGHT
        x: -6
        y: 25
        width: 172
        height: 54
        styles: style_invisible
        on_short_click:
          - script.execute: tab5_arcade_open

    # ═══ Zone verre uniquement autour de − / cible / + ═══
    - obj:
        id: climate_controls_zone
        align: BOTTOM_MID
        y: 0
        width: 405
        height: 90
        styles: style_clim_carte_page
        scrollbar_mode: "OFF"
        # − et + en verre plein (style_clim_btn, opaque depuis le 01/10/2026) : ils sont
        # posés sur cette tuile, pas sur la page — un pré-mélange sur BG serait faux ici.
        widgets:
          - label:
              id: clim_target
              text: ""
              align: CENTER
              text_font: roboto_55_b

          - button:
              id: btn_clim_target_click
              align: CENTER
              width: 150
              height: 68
              styles: style_invisible
              on_short_click:
                # Le popup montre la clim du blueprint, celle de cette carte (il a pu
                # montrer celle d'une tuile, ADR-0027).
                - lambda: |-
                    clim_afficher_blueprint();
                    animate_popup_open(id(clim_options_popup));

          - button:
              id: btn_clim_minus
              align: LEFT_MID
              x: 13  # + bordure 1 px de la tuile = 14 px du bord, comme en haut et en bas
              width: 62
              height: 62
              radius: 12
              styles: style_clim_btn
              pressed:
                bg_opa: 30%
              on_short_click:
                # Optimiste + débounce (même mécanisme que le popup) : on accumule dans
                # clim_target_temp, on met à jour le label tout de suite, et un seul
                # set_temperature part une fois le doigt immobile. Avant, l'appel HA direct
                # ne mettait jamais à jour le global → taps rapides = même valeur renvoyée +
                # aucun retour visuel avant le push HA. Pas et bornes : ceux de l'appareil
                # (clé climr, ADR-0026), 0,5 entre 16 et 30 tant que HA ne les a pas donnés.
                - lambda: |-
                    const float t = clim_consigne_suivante(id(clim_target_temp), -1);
                    id(clim_target_temp) = t;
                    update_clim_target_ui(id(clim_target), nullptr, t);
                - script.execute: tab5_debounce_clim_temp
              widgets:
                - label: { text: "\U000F0374", align: CENTER, text_font: mdi_font_56 }

          - button:
              id: btn_clim_plus
              align: RIGHT_MID
              x: -13
              width: 62
              height: 62
              radius: 12
              styles: style_clim_btn
              pressed:
                bg_opa: 30%
              on_short_click:
                # Optimiste + débounce (même mécanisme que le popup) — voir bouton −.
                - lambda: |-
                    const float t = clim_consigne_suivante(id(clim_target_temp), +1);
                    id(clim_target_temp) = t;
                    update_clim_target_ui(id(clim_target), nullptr, t);
                - script.execute: tab5_debounce_clim_temp
              widgets:
                - label: { text: "\U000F0415", align: CENTER, text_font: mdi_font_56 }
