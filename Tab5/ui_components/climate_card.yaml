# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file climate_card.yaml
# @role Zone clim dashboard : températures Salon/Serre hors carte (même
#       place absolue), verre `style_meteo_card` uniquement autour de
#       − / température cible / +.
# @architecture_constraint `current_serre`/`val_temp_salon` sont mis à jour par les services
#                          `tab5_maj_clim`/helpers C++ (tab5-api-logic.yaml,
#                          tab5-sensors-domotique.yaml). `clim_target` est aussi poussé par
#                          tab5_maj_clim (autoritaire), MAIS mis à jour de façon OPTIMISTE au
#                          tap ± ci-dessous (21/07) via update_clim_target_ui + débounce.
# @ai_instruction Les boutons +/- reprennent le mécanisme optimiste+débounce du popup
#                 (accumulation dans clim_target_temp, un seul set_temperature par geste via
#                 tab5_debounce_clim_temp). Pas et bornes : clim_consigne_suivante() (réglages
#                 de l'appareil, ADR-0026), jamais de 0.5f / 16 / 30 en dur. Le clic sur la
#                 cible ouvre le popup sur la clim du blueprint (ADR-0027 : il peut aussi
#                 montrer celle d'une tuile). Conteneur parent = transparent (ids conservés).
#                 La carte montre TOUJOURS la clim du blueprint (ses globals clim_*).
# ═══════════════════════════════════════════════════════
obj:
  id: climate_card
  x: 855
  y: 125
  width: 413
  height: 180
  styles: style_transparent
  scrollbar_mode: "OFF"
  pad_all: 0
  widgets:

    # ═══ Températures pièces — même place, HORS zone verre ═══
    - label: { id: icon_salon, text: "\U000F04B9", align: TOP_LEFT, x: 18, y: 12, text_font: mdi_font_45, text_color: color_text_dim }
    - label: { id: val_temp_salon, text: "-- °", align: TOP_LEFT, x: 85, y: 17, text_font: roboto_32_b, text_color: color_temp_max }
    - label: { id: icon_serre, text: "\U000F002D", align: TOP_RIGHT, x: -124, y: 12, text_font: mdi_font_45, text_color: color_text_dim }
    - label: { id: current_serre, text: "-- °", align: TOP_RIGHT, x: -18, y: 17, text_font: roboto_32_b, text_color: color_temp_max }
    # Zone tactile sur la température serre → ouvre le sélecteur de jeux Arcade.
    # [26/07/2026] FIX : la zone était posée à côté de ce qu'elle est censée
    # couvrir. Arithmétique (carte large de 413, alignement TOP_RIGHT donc les
    # offsets x sont comptés depuis le bord DROIT de la carte) :
    #   icon_serre     x=-124, police 45  -> occupe ~244..289
    #   current_serre  x=-18,  police 32b -> occupe ~315..395
    #   ancienne zone  x=-130, largeur 125 -> couvrait 158..283
    # => elle ne touchait QUE l'icône, jamais la valeur affichée : taper la
    # température ne déclenchait rien. La zone couvre désormais 231..403,
    # c'est-à-dire l'icône ET la valeur, avec une marge de 8 px.
    # Ne pas l'agrandir davantage : au-delà de 403 on mord sur le bord de la
    # carte, et sous y=60 on entre dans climate_controls_zone (± et cible).
    - button:
        id: btn_serre_games
        align: TOP_RIGHT
        x: -10
        y: 6
        width: 172
        height: 54
        styles: style_invisible
        on_short_click:
          - script.execute: tab5_arcade_open

    # ═══ Zone verre uniquement autour de − / cible / + ═══
    - obj:
        id: climate_controls_zone
        align: BOTTOM_MID
        y: -10
        width: 340
        height: 88
        styles: style_meteo_card_page
        scrollbar_mode: "OFF"
        # − et + restent en verre TRANSLUCIDE (style_clim_btn) : ils sont posés sur
        # cette tuile, pas sur la page — un pré-mélange sur color_bg serait faux ici.
        widgets:
          - label:
              id: clim_target
              text: ""
              align: CENTER
              text_font: roboto_55_b

          - button:
              id: btn_clim_target_click
              align: CENTER
              width: 150
              height: 68
              styles: style_invisible
              on_short_click:
                # Le popup montre la clim du blueprint, celle de cette carte (il a pu
                # montrer celle d'une tuile, ADR-0027).
                - lambda: |-
                    clim_afficher_blueprint();
                    animate_popup_open(id(clim_options_popup));

          - button:
              id: btn_clim_minus
              align: LEFT_MID
              x: 14
              width: 62
              height: 62
              radius: 12
              styles: style_clim_btn
              pressed:
                bg_opa: 30%
              on_short_click:
                # Optimiste + débounce (même mécanisme que le popup) : on accumule dans
                # clim_target_temp, on met à jour le label tout de suite, et un seul
                # set_temperature part une fois le doigt immobile. Avant, l'appel HA direct
                # ne mettait jamais à jour le global → taps rapides = même valeur renvoyée +
                # aucun retour visuel avant le push HA. Pas et bornes : ceux de l'appareil
                # (clé climr, ADR-0026), 0,5 entre 16 et 30 tant que HA ne les a pas donnés.
                - lambda: |-
                    const float t = clim_consigne_suivante(id(clim_target_temp), -1);
                    id(clim_target_temp) = t;
                    update_clim_target_ui(id(clim_target), nullptr, t);
                - script.execute: tab5_debounce_clim_temp
              widgets:
                - label: { text: "\U000F0374", align: CENTER, text_font: mdi_font_56 }

          - button:
              id: btn_clim_plus
              align: RIGHT_MID
              x: -14
              width: 62
              height: 62
              radius: 12
              styles: style_clim_btn
              pressed:
                bg_opa: 30%
              on_short_click:
                # Optimiste + débounce (même mécanisme que le popup) — voir bouton −.
                - lambda: |-
                    const float t = clim_consigne_suivante(id(clim_target_temp), +1);
                    id(clim_target_temp) = t;
                    update_clim_target_ui(id(clim_target), nullptr, t);
                - script.execute: tab5_debounce_clim_temp
              widgets:
                - label: { text: "\U000F0415", align: CENTER, text_font: mdi_font_56 }
