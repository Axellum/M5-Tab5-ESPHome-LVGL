# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file lode_game.yaml
# @role Page LVGL dédiée du jeu « Coureur d'Or » (clone de Lode Runner).
# @architecture_constraint Page LVGL autonome (page_lode dans tab5-lvgl.yaml,
#     skip: true). Pas de modal_scrim/modal_header — flux de jeu plein cadre.
#     La sortie du jeu se fait par le hub (« Quitter ») qui navigue vers
#     page_arcade via lv_scr_load() en C++.
# @ai_instruction Ce fichier ne declare QUE 5 conteneurs vides. Tout le contenu
#     (HUD, damier, or, joueur, gardes, zones tactiles, menus) est construit par
#     lode_game.cpp via Lode::open(). Ne JAMAIS ajouter de widget de gameplay ici.
#     Aucune couleur n'est posee ici non plus : les fonds sont appliques en C++
#     depuis Lode::Pal (aucun nouveau token dans tab5-styles.yaml).
#     ORDRE DES ENFANTS = ordre de dessin : hud < field < pad < panel.
# ═══════════════════════════════════════════════════════
obj:
  id: lode_root
  align: TOP_LEFT
  x: 0
  y: 0
  width: 1280
  height: 720
  scrollable: false
  pad_all: 0
  radius: 0
  border_width: 0
  widgets:
    # --- Bandeau HUD compact (48 px) : score, vies, niveau, or restant, record ---
    # Cliquable : un appui pendant la partie ouvre la pause (il n'y a
    # volontairement pas de croix, le jeu est un flux plein cadre).
    - obj:
        id: lode_hud
        align: TOP_LEFT
        x: 0
        y: 0
        width: 1280
        height: 48
        scrollable: false
        pad_all: 0
        radius: 0
        border_width: 0

    # --- Damier 1280x672 : 30 x 16 cases de 42 px, centrees (marge de 10 px) ---
    - obj:
        id: lode_field
        align: TOP_LEFT
        x: 0
        y: 48
        width: 1280
        height: 672
        scrollable: false
        pad_all: 0
        radius: 0
        border_width: 0

    # --- Calque des zones tactiles (D-pad + 2 boutons « creuser ») -------------
    # Transparent et non cliquable lui-meme : seuls ses enfants captent le doigt.
    # Masque hors partie, et le D-pad disparait en mode « Inclinaison ».
    - obj:
        id: lode_pad
        align: TOP_LEFT
        x: 0
        y: 48
        width: 1280
        height: 672
        hidden: true
        scrollable: false
        pad_all: 0
        radius: 0
        border_width: 0

    # --- Calque des menus (hub / niveaux / classement / reglages / pause /
    #     niveau termine / game over). Contenu construit en C++. ---
    - obj:
        id: lode_panel
        align: TOP_LEFT
        x: 0
        y: 0
        width: 1280
        height: 720
        hidden: true
        scrollable: false
        pad_all: 0
        radius: 0
        border_width: 0
