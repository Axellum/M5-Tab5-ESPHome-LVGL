# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Bouton à choix du popup « Réglages » (reglages_popup.yaml, 06/10/2026),
# réutilisé 37 fois : extinction auto (6), Oui / Non (4 × 2), clair ou sombre (3),
# langues (7), animations (3), limite (2) et mode de charge (2), économie d'énergie (3),
# Wi-Fi éco (3). Un appui écrit l'entité par le script tab5_reglages_choisir
# (tab5-reglages.yaml) ; la surbrillance de l'option active est posée par
# reglages_peindre() (tab5_reglages.cpp), qui lit le texte comme premier enfant du bouton.
# vars : id, x, y, w (hauteur fixe 56 px), reglage (ReglageId de tab5_custom.h, en nombre),
#        valeur (index de l'option ; Oui = 1, Non = 0), label_text (traduit au démarrage ;
#        vide pour les langues, dont reglages_preparer() écrit le nom natif).
# Taille (lot 4 du portage 1024×600, ADR-0061) : x, y et w sont ceux du Tab5, ramenés ici au
#        corps de la carte : x et w × corps_w / 1202 ; le bouton reste 40 px sous le titre de sa
#        rangée (reglages_rangee.yaml avec fixe: 46, y × reglages_h / 552) : y − 40 est ramené,
#        puis + 40 ; hauteur 56 × corps_h / 598. Ces 40 px ne rétrécissent pas : les rangées se
#        répartissent sur reglages_h (corps_h − 46, 552 sur le Tab5) pour que la dernière garde
#        son air au-dessus du bas de la carte (16 px sur la 7B, 19 sur le Tab5).
# Piège ESPHome (comme bouton_pas.yaml) : `reglage` et `valeur` doivent rester
# des nombres NON quotés dans les vars, sinon ils partent en chaîne.
# ═══════════════════════════════════════════════════════
button:
  id: ${id}
  align: TOP_LEFT
  x: ${ (x | int) * (corps_w | int) // 1202 }
  y: ${ ((y | int) - 40) * (reglages_h | int) // 552 + 40 }
  width: ${ (w | int) * (corps_w | int) // 1202 }
  height: ${ 56 * (corps_h | int) // 598 }
  radius: 14
  pad_all: 0   # positions exactes : le thème ajoutait ~21 px
  styles: style_clim_btn
  pressed: { bg_opa: 30% }
  on_short_click:
    - script.execute:
        id: tab5_reglages_choisir
        reglage: ${reglage}
        valeur: ${valeur}
  widgets:
    - label: { text: "${label_text}", align: CENTER }
