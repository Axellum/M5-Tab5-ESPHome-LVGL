# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file maison_popup.yaml
# @role Popup « Maison » (ADR-0037, 07/10/2026, discussion #278) : toute la maison, pièce
#       par pièce, comme un tableau de bord HA. Une colonne par pièce qui a des appareils
#       (en-tête = son nom), une ligne par tuile (pastille de l'icône, nom, état, « ⋯ »),
#       « Éteindre les lumières » dans la barre de titre. Ouvert par « Aller à l'écran →
#       Maison » ou, en mode HA, par un tap sur le titre de la pièce (carte centrale).
# @architecture_constraint Chrome modal partagé (ADR-0009 : modal_scrim + modal_header,
#       corps à y = ${modal_body_y}), registre unique (ADR-0013 : « Maison » dans
#       tab5_modal_registry_init). Corps : x 12..1238, y 72..672 — colonnes de
#       (1226 − 12 × (n − 1)) / n px, en-têtes de 40 px, lignes de 104 px tous les 112,
#       cinq par colonne et par page (ADR-0066 : une pièce de plus de cinq éléments donne
#       des pages, glissement et noms « 1–5 », « 6–10 »… sur la ligne du titre).
#       Position, largeur, textes et couleurs : tab5_maison.cpp (disposer) ; aucune
#       valeur posée ici que celles d'avant la première ouverture. L'icône de la barre de
#       titre (home) vient de la palette des tuiles de mdi_font_32. Le bouton est 10 px à
#       gauche de la croix, comme « Tout marquer comme lu » des alertes (alertes_popup.yaml).
# @ai_instruction Un widget de plus = son champ dans MaisonUI (tab5_custom.h) et sa ligne
#       dans le script tab5_maison_ouvrir (tab5-maison.yaml).
# ═══════════════════════════════════════════════════════
obj:
  id: maison_popup
  align: CENTER
  width: 100%
  height: 100%
  hidden: true
  scrollable: false
  styles: style_invisible
  widgets:
    - !include { file: modal_scrim.yaml, vars: { scrim_opa: "100", popup_id: maison_popup } }

    # Carte modale — 15 px des bords écran (1280×720)
    - obj:
        align: CENTER
        width: ${modal_card_w}
        height: ${modal_card_h}
        styles: style_modal_card
        scrollable: false
        widgets:

          # ═══ BARRE DE TITRE (cadre v4 : icône + titre + croix, corps à y=72) ═══
          - !include { file: modal_header.yaml, vars: { icon: "\U000F02DC", icon_style: "style_text_accent", title: "Maison", title_id: "maison_popup_titre", close_btn_id: "btn_maison_close", popup_id: maison_popup } }

          # « Éteindre les lumières » : masqué sans aucune lumière (tab5_maison.cpp).
          - button:
              id: btn_maison_eteindre
              align: TOP_RIGHT
              x: -100
              y: 4
              width: 320
              height: 44
              hidden: true
              styles: style_clim_btn
              on_short_click:
                - lambda: 'maison_eteindre_lumieres();'
              widgets:
                - label: { text: "Éteindre les lumières", align: CENTER, width: 300, long_mode: DOT, text_align: CENTER, text_font: roboto_22 }

          # Onglets des pages (ADR-0066) : un par groupe de colonnes (« Pièces 1 à 5 », plus
          # de cinq pièces) ou, avec un seul groupe, un par tranche de cinq lignes (« 1–5 »,
          # « 6–10 »…, plus de cinq éléments dans une pièce) ; sur la ligne du titre, posés et
          # montrés par tab5_maison.cpp (peindre_onglets), aucun sous deux pages.
          - !include { file: pages_onglet.yaml, vars: { id: maison_onglet_0, page: 0, choisir: maison_page } }
          - !include { file: pages_onglet.yaml, vars: { id: maison_onglet_1, page: 1, choisir: maison_page } }
          - !include { file: pages_onglet.yaml, vars: { id: maison_onglet_2, page: 2, choisir: maison_page } }
          - !include { file: pages_onglet.yaml, vars: { id: maison_onglet_3, page: 3, choisir: maison_page } }

          # Aucune pièce n'a d'appareil (« Aller à l'écran → Maison » sur une tablette vide).
          - label: { id: maison_vide, text: "Aucun appareil", align: CENTER, y: 36, hidden: true, styles: style_text_dim }

          # ═══ EN-TÊTES : le nom de chaque pièce ═══
          - !include { file: maison_entete.yaml, vars: { c: "0" } }
          - !include { file: maison_entete.yaml, vars: { c: "1" } }
          - !include { file: maison_entete.yaml, vars: { c: "2" } }
          - !include { file: maison_entete.yaml, vars: { c: "3" } }
          - !include { file: maison_entete.yaml, vars: { c: "4" } }

          # ═══ LIGNES : la place (colonne C, ligne K) de la page affichée (maison_ligne_CK) ═══
          - !include { file: maison_ligne.yaml, vars: { c: "0", k: "0" } }
          - !include { file: maison_ligne.yaml, vars: { c: "0", k: "1" } }
          - !include { file: maison_ligne.yaml, vars: { c: "0", k: "2" } }
          - !include { file: maison_ligne.yaml, vars: { c: "0", k: "3" } }
          - !include { file: maison_ligne.yaml, vars: { c: "0", k: "4" } }
          - !include { file: maison_ligne.yaml, vars: { c: "1", k: "0" } }
          - !include { file: maison_ligne.yaml, vars: { c: "1", k: "1" } }
          - !include { file: maison_ligne.yaml, vars: { c: "1", k: "2" } }
          - !include { file: maison_ligne.yaml, vars: { c: "1", k: "3" } }
          - !include { file: maison_ligne.yaml, vars: { c: "1", k: "4" } }
          - !include { file: maison_ligne.yaml, vars: { c: "2", k: "0" } }
          - !include { file: maison_ligne.yaml, vars: { c: "2", k: "1" } }
          - !include { file: maison_ligne.yaml, vars: { c: "2", k: "2" } }
          - !include { file: maison_ligne.yaml, vars: { c: "2", k: "3" } }
          - !include { file: maison_ligne.yaml, vars: { c: "2", k: "4" } }
          - !include { file: maison_ligne.yaml, vars: { c: "3", k: "0" } }
          - !include { file: maison_ligne.yaml, vars: { c: "3", k: "1" } }
          - !include { file: maison_ligne.yaml, vars: { c: "3", k: "2" } }
          - !include { file: maison_ligne.yaml, vars: { c: "3", k: "3" } }
          - !include { file: maison_ligne.yaml, vars: { c: "3", k: "4" } }
          - !include { file: maison_ligne.yaml, vars: { c: "4", k: "0" } }
          - !include { file: maison_ligne.yaml, vars: { c: "4", k: "1" } }
          - !include { file: maison_ligne.yaml, vars: { c: "4", k: "2" } }
          - !include { file: maison_ligne.yaml, vars: { c: "4", k: "3" } }
          - !include { file: maison_ligne.yaml, vars: { c: "4", k: "4" } }
