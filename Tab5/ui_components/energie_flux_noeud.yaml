# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Cercle de la page « Flux » du popup Énergie (ADR-0058), réutilisé 4 fois par
# energie_popup.yaml : 0 solaire, 1 maison, 2 réseau, 3 batterie (l'ordre des cartes).
# vars : n (0-3, suffixe des ids lus par tab5_energie.cpp via g_energie_ui).
# Ne rien assigner ici : tab5_energie.cpp place le cercle (x, y : les traits partent de son
# bord), le montre (la batterie seulement si elle est choisie), colore son bord (la source),
# et écrit l'icône (mdi_font_45, glyphe_carte → MDI_CODE_TARGETS), la valeur et le texte
# du dessous (coupé avec « … » à la largeur du cercle).
# @geometry Cercle de 190 px (kFluxD) : icône y 18, valeur y 70, texte y 118 (sa corde y
#           fait 176 px, le texte en prend 156 au plus).
# ═══════════════════════════════════════════════════════
obj:
  id: "energie_flux_${n}"
  align: TOP_LEFT
  x: 0
  y: 0
  width: 190
  height: 190
  radius: 95
  hidden: true
  styles: style_glass_card
  scrollable: false
  widgets:
    - label: { id: "energie_flux_icone_${n}", text: "", align: TOP_MID, y: 18, text_font: mdi_font_45, styles: style_text_dim }
    - label: { id: "energie_flux_valeur_${n}", text: "--", align: TOP_MID, y: 70, text_font: roboto_32_b }
    - label: { id: "energie_flux_texte_${n}", text: "", align: TOP_MID, y: 118, styles: style_text_dim }
