# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file roue_actions.yaml
# @role Roue d'actions rapides (ADR-0036, 07/10/2026, discussion #278 de husyildiz :
#       « one click opens a mini popup, like a spring, or a circular popup », d'après le
#       module sub_button_wheel de Bubble Card). L'appui long d'une lampe, d'un volet ou
#       d'une clim (tuile météo, carte du mode HA, ligne du popup Maison) pose un moyeu sur
#       la tuile (icône, état, jauge) et fait surgir au-dessus deux anneaux de boutons
#       ronds : le premier porte les commandes, les familles de réglages (un point) et deux
#       liens aux bouts, « Maison » et « Détails » (le popup complet) ; toucher une
#       famille déplie ses choix sur le second. Toucher un choix envoie sa commande et
#       ferme la roue ; toucher le voile ou le moyeu replie le second anneau, puis ferme.
# @architecture_constraint Ce n'est pas un popup modal : ni en-tête ni carte (ADR-0009
#       vise les fenêtres modales), comme la liste de la tuile − / + (reglables_liste.yaml),
#       mais le voile partagé des popups (modal_scrim.yaml) à 60 % : les tuiles restent
#       visibles dessous. Le conteneur plein écran `roue_actions` porte tout ; il est
#       enregistré en SUBWINDOW
#       (tab5_modal_registry_init) : refermé avec les popups, et par l'intervalle
#       d'inactivité (tab5-scripts.yaml). Inclus APRÈS les cartes du tableau de bord et
#       AVANT les popups : la roue couvre les tuiles, un popup ouvert par « Détails » la
#       couvre. Ouverture, dépliage et fermeture secs.
# @ai_instruction Positions, tailles des bandes, couleurs, glyphes et textes : tab5_roue.cpp
#       (roue_ouvrir), à chaque ouverture ; les valeurs d'ici ne sont que celles d'avant.
#       Ordre = ordre de dessin : bandes de verre (arcs à bouts ronds, dessous), second
#       anneau et ses mots, premier anneau et les mots des liens, jauge, moyeu, nom. Les
#       arcs ne prennent pas le toucher (roue_brancher leur retire CLICKABLE et le bouton) :
#       un toucher sur une bande arrive au voile. Un bouton de plus = kRoueBoutons ou
#       kRoueChoix (tab5_custom.h), une ligne ici et ses pointeurs dans tab5-roue.yaml.
# ═══════════════════════════════════════════════════════
obj:
  id: roue_actions
  x: 0
  y: 0
  width: 1280
  height: 720
  hidden: true
  styles: style_invisible
  scrollable: false
  widgets:
    # Voile : un toucher hors des boutons (bandes comprises) replie le second anneau, ou
    # ferme la roue.
    - !include { file: modal_scrim.yaml, vars: { scrim_opa: "60", close_lambda: "roue_replier_ou_fermer();" } }
    # Bandes de verre sous les anneaux (couleurs et angles posés en C++) : l'arc entier
    # (value = max) et son cœur plus clair (l'indicateur, en retrait).
    - arc:
        id: roue_bande_0
        x: 0
        y: 0
        width: 456
        height: 456
        hidden: true
        min_value: 0
        max_value: 1
        value: 1
        start_angle: 195
        end_angle: 345
        bg_opa: 0
        arc_width: 96
        indicator:
          arc_width: 76
    - arc:
        id: roue_bande_1
        x: 0
        y: 0
        width: 676
        height: 676
        hidden: true
        min_value: 0
        max_value: 1
        value: 1
        start_angle: 225
        end_angle: 315
        bg_opa: 0
        arc_width: 96
        indicator:
          arc_width: 76
    - !include { file: roue_choix.yaml, vars: { n: 0 } }
    - !include { file: roue_choix.yaml, vars: { n: 1 } }
    - !include { file: roue_choix.yaml, vars: { n: 2 } }
    - !include { file: roue_choix.yaml, vars: { n: 3 } }
    - !include { file: roue_choix.yaml, vars: { n: 4 } }
    - !include { file: roue_choix.yaml, vars: { n: 5 } }
    - !include { file: roue_legende.yaml, vars: { id: roue_choix_0_legende } }
    - !include { file: roue_legende.yaml, vars: { id: roue_choix_1_legende } }
    - !include { file: roue_legende.yaml, vars: { id: roue_choix_2_legende } }
    - !include { file: roue_legende.yaml, vars: { id: roue_choix_3_legende } }
    - !include { file: roue_legende.yaml, vars: { id: roue_choix_4_legende } }
    - !include { file: roue_legende.yaml, vars: { id: roue_choix_5_legende } }
    - !include { file: roue_bouton.yaml, vars: { n: 0 } }
    - !include { file: roue_bouton.yaml, vars: { n: 1 } }
    - !include { file: roue_bouton.yaml, vars: { n: 2 } }
    - !include { file: roue_bouton.yaml, vars: { n: 3 } }
    - !include { file: roue_bouton.yaml, vars: { n: 4 } }
    - !include { file: roue_bouton.yaml, vars: { n: 5 } }
    - !include { file: roue_legende.yaml, vars: { id: roue_lien_0 } }
    - !include { file: roue_legende.yaml, vars: { id: roue_lien_1 } }
    # Jauge autour du moyeu : luminosité, position ou consigne (piste des arcs, valeur dans
    # la couleur d'état posée en C++), ouverte en bas, sous le nom.
    - arc:
        id: roue_jauge
        x: 0
        y: 0
        width: 148
        height: 148
        hidden: true
        min_value: 0
        max_value: 100
        value: 0
        start_angle: 135
        end_angle: 45
        bg_opa: 0
        styles: style_arc_arc_track
        arc_width: 6
        indicator:
          arc_width: 6
    # Moyeu sur l'ancre : le verre des boutons, liseré de la couleur d'état (C++). Le
    # toucher replie le second anneau, ou ferme la roue.
    - button:
        id: roue_moyeu
        x: 0
        y: 0
        width: 120
        height: 120
        styles: style_clim_btn
        radius: 60
        pad_all: 0
        on_short_click:
          - lambda: 'roue_replier_ou_fermer();'
        widgets:
          - label: { id: roue_moyeu_icone, text: "", align: CENTER, y: -14, text_font: mdi_font_45, styles: style_text_soft }
          - label: { id: roue_moyeu_valeur, text: "", align: CENTER, y: 30, text_font: roboto_22, styles: style_text_soft }
    - label:
        id: roue_nom
        x: 0
        y: 0
        width: 320
        hidden: true
        text: ""
        text_align: CENTER
        long_mode: CLIP
        text_font: roboto_22
        styles: style_text_dim
