# ============================================================================
# [AI-CONTEXT]
# @file switches_card.yaml
# @role Calque du mode HA (bouton « HA », ADR-0023) : 5 cartes = les 5 tuiles de la pièce
#       de la page courante. Depuis le 06/10/2026 (discussion #278 : « buttons can be like
#       ha dashboard buttons »), chaque carte ressemble à la carte « tile » d'un tableau de
#       bord Home Assistant, en version verticale : l'icône (palette, 70 px) dans une
#       pastille ronde de la couleur de son état (couleur à 20 %, icône pleine), le nom
#       dessous, l'état sous le nom. Pastille, icône, nom (coupé avec « … ») et ligne
#       d'état sont posés par tab5_tuiles.cpp (peindre_carte) ; les cartes vides sont
#       masquées et les autres centrées. Tap et appui long sur la pastille : tuile_appui(),
#       qui envoie la commande du type de la tuile ou ouvre son popup (ou, en mode
#       héritage, ce que faisait la 3.x). Toucher du nom : sens d'un volet.
#       Alterne avec forecast_daily.yaml/forecast_hourly.yaml : tuiles_mode_ha().
# @architecture_constraint Nom (`switch_card_title_tab.yaml`) et état
#                          (`switch_card_state_tab.yaml`) sont factorisés (#T164, même motif x5).
#                          Le corps reste écrit cinq fois : les ids `icon_swN` doivent rester
#                          littéraux (motif `icon_sw?` de la règle 7, palette des tuiles) et
#                          `sw_card_N` / `sw_pastille_N` sont lus par tab5-tuiles.yaml.
#                          Le bouton invisible ne couvre que la pastille (130 × 130, comme
#                          avant) : un geste parti ailleurs sur la carte reste un swipe.
# @ai_instruction Icônes, titres, états, couleurs et positions sont écrits par le C++ —
#                 les textes, glyphes et couleurs d'ici ne sont que ceux d'avant la
#                 première image. La pastille et le nom ne prennent pas l'appui du bouton.
# ============================================================================
obj:
  id: layer_switches
  x: 0
  y: 430
  width: 1280
  height: 290
  styles: style_transparent
  scrollbar_mode: "OFF"
  hidden: true

  widgets:
    # Tuile 0
    - obj:
        id: sw_card_0
        x: 25
        y: ${meteo_cell_y}
        width: ${meteo_cell_width}
        height: ${meteo_cell_height}
        styles: style_meteo_card_page
        scrollbar_mode: "OFF"
        widgets:
          # Pastille ronde : la couleur de l'état à 20 % (posée par le C++), l'icône pleine.
          - obj:
              id: sw_pastille_0
              align: TOP_MID
              y: 26
              width: 130
              height: 130
              radius: 65
              styles: style_bg_dim
              bg_opa: 20%
              border_width: 0
              clickable: false
              scrollable: false
              widgets:
                - label: { id: icon_sw0, text: "\U000F0379", align: CENTER, text_font: mdi_font_70, styles: style_text_dim }
          - button:
              id: btn_sw0_action
              align: TOP_MID
              y: 26
              width: 130
              height: 130
              styles: style_invisible
              on_short_click:
                - lambda: 'tuile_appui(0, false);'
              on_long_press:
                - lambda: 'tuile_appui(0, true);'
          - !include { file: switch_card_title_tab.yaml, vars: { idx: "0", title: "PC Bureau" } }
          - !include { file: switch_card_state_tab.yaml, vars: { idx: "0", state_text: "Éteint" } }
