# ============================================================================
# [AI-CONTEXT]
# @file switches_card.yaml
# @role Calque du mode HA (bouton « HA », ADR-0023) : 5 cartes = les 5 tuiles de la pièce
#       de la page courante. Icône (palette, 70 px), nom (onglet titre, coupé avec « … »)
#       et ligne d'état sont posés par tab5_tuiles.cpp (peindre_cartes) ; les cartes vides
#       sont masquées et les autres centrées. Tap et appui long : tuile_appui(), qui envoie
#       la commande du type de la tuile (ou, en mode héritage, celle de la 3.x).
#       Alterne avec forecast_daily.yaml/forecast_hourly.yaml : tuiles_mode_ha().
# @architecture_constraint Onglet Titre (`switch_card_title_tab.yaml`) et Onglet État
#                          (`switch_card_state_tab.yaml`) sont factorisés (#T164, même motif x5).
#                          Le corps reste écrit cinq fois : les ids `icon_swN` doivent rester
#                          littéraux (motif `icon_sw?` de la règle 7, palette des tuiles) et
#                          `sw_card_N` sont lus par tab5-tuiles.yaml.
# @ai_instruction Icônes, titres, états, couleurs et positions sont écrits par le C++ —
#                 les textes et glyphes d'ici ne sont que ceux d'avant la première image.
# ============================================================================
obj:
  id: layer_switches
  x: 0
  y: 430
  width: 1280
  height: 290
  styles: style_transparent
  scrollbar_mode: "OFF"
  hidden: true

  widgets:
    # Tuile 0
    - obj:
        id: sw_card_0
        x: 25
        y: ${meteo_cell_y}
        width: ${meteo_cell_width}
        height: ${meteo_cell_height}
        styles: style_transparent
        scrollbar_mode: "OFF"
        widgets:
          # Corps Sombre
          - obj:
              y: 35
              width: 230
              height: 205
              styles: style_meteo_card_page
              widgets:
                - label: { id: icon_sw0, text: "\U000F0379", align: CENTER, text_font: mdi_font_70, text_color: color_text_dim }
                - button:
                    id: btn_sw0_action
                    align: CENTER
                    y: 0
                    width: 130
                    height: 130
                    styles: style_invisible
                    on_short_click:
                      - lambda: 'tuile_appui(0, false);'
                    on_long_press:
                      - lambda: 'tuile_appui(0, true);'
          # Onglets Titre + État (factorisés, #T164) APRÈS le corps : dessinés par-dessus,
          # comme les tuiles de prévisions (forecast_daily.yaml).
          - !include { file: switch_card_title_tab.yaml, vars: { idx: "0", title: "PC Bureau" } }
          - !include { file: switch_card_state_tab.yaml, vars: { idx: "0", state_text: "Éteint" } }

    # Tuile 1
