          # Onglets Titre + État (factorisés, #T164) APRÈS le corps : dessinés par-dessus,
          # comme les tuiles de prévisions (forecast_daily.yaml).
          - !include { file: switch_card_title_tab.yaml, vars: { title: "Chambre" } }
          - !include { file: switch_card_state_tab.yaml, vars: { idx: "2", state_text: "Éteint" } }

    # Card 3 : Salon
