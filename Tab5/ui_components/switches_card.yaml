        id: sw_card_3
        x: 775
        y: ${meteo_cell_y}
        width: ${meteo_cell_width}
        height: ${meteo_cell_height}
        styles: style_transparent
        scrollbar_mode: "OFF"
        widgets:
          # Corps Sombre
          - obj:
              y: 35
              width: 230
              height: 205
              styles: style_meteo_card_page
              widgets:
                - label: { id: icon_sw3, text: "\U000F04B9", align: CENTER, text_font: mdi_font_70, text_color: color_text_dim }
                - button:
