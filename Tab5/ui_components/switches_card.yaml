                    on_short_click:
                      - script.execute: { id: tab5_action, emplacement: lumiere_2, commande: basculer, valeur: "" }
          # Onglets Titre + État (factorisés, #T164) APRÈS le corps : dessinés par-dessus,
          # comme les tuiles de prévisions (forecast_daily.yaml).
          - !include { file: switch_card_title_tab.yaml, vars: { title: "Salon" } }
          - !include { file: switch_card_state_tab.yaml, vars: { idx: "3", state_text: "Éteint" } }

    # Card 4 : LEDs Bureau
    - obj:
        id: sw_card_4
        x: 1025
        y: ${meteo_cell_y}
        width: ${meteo_cell_width}
        height: ${meteo_cell_height}
        styles: style_transparent
        scrollbar_mode: "OFF"
        widgets:
          # Corps Sombre
          - obj:
              y: 35
              width: 230
              height: 205
              styles: style_meteo_card_page
              widgets:
                - label: { id: icon_sw4, text: "\U000F1051", align: CENTER, text_font: mdi_font_70, text_color: color_text_dim }
                - button:
                    id: btn_sw4_action
                    align: CENTER
                    y: 0
                    width: 130
