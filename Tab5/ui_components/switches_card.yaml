                    styles: style_invisible
                    on_short_click:
                      - script.execute: { id: tab5_action, emplacement: lumiere_3, commande: basculer, valeur: "" }
          # Onglets Titre + État (factorisés, #T164) APRÈS le corps : dessinés par-dessus,
          # comme les tuiles de prévisions (forecast_daily.yaml).
          - !include { file: switch_card_title_tab.yaml, vars: { title: "LEDs" } }
