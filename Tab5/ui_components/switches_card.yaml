# ============================================================================
# [AI-CONTEXT]
# @file switches_card.yaml
# @role 5 cartes switches (PC bureau, volet, lumière chambre/salon, LEDs bureau). Alterne
#       avec forecast_daily.yaml/forecast_hourly.yaml via `btn_control_ha` (tab5-lvgl.yaml,
#       global `show_switches`).
# @architecture_constraint Onglet Titre (`switch_card_title_tab.yaml`) et Onglet État
#                          (`switch_card_state_tab.yaml`) sont factorisés (#T164, même motif x5).
#                          Le bouton d'action (`btn_swN_action`) N'EST PAS factorisé : chaque
#                          carte appelle un service Home Assistant différent — même décision
#                          que forecast_daily.yaml (cartes j0-j4), voir etat_tab5.md.
#                          Le volet (sw1) partage son action avec la carte j1 : script
#                          `tab5_volet_tap` (tab5-scripts.yaml, lot 7.3).
# @ai_instruction `lbl_swN_state`/`icon_swN` sont mis à jour par les fonctions C++ (ex:
#                 `update_light_card_ui()`) ou les lambdas de tab5-sensors-domotique.yaml/tab5-api-logic.yaml
#                 — ne pas leur assigner de texte/couleur directement ici.
# ============================================================================
obj:
  id: layer_switches
  x: 0
  y: 430
  width: 1280
  height: 290
  styles: style_transparent
  scrollbar_mode: "OFF"
  hidden: true

  widgets:
    # Card 0 : PC Bureau
    - obj:
        id: sw_card_0
        x: 25
        y: ${meteo_cell_y}
        width: ${meteo_cell_width}
        height: ${meteo_cell_height}
        styles: style_transparent
        scrollbar_mode: "OFF"
        widgets:
          # Corps Sombre
          - obj:
              y: 35
              width: 230
              height: 205
              styles: style_meteo_card_page
              widgets:
                - label: { id: icon_sw0, text: "\U000F0379", align: CENTER, text_font: mdi_font_70, text_color: color_text_dim }
                - button:
                    id: btn_sw0_action
                    align: CENTER
                    y: 0
                    width: 130
                    height: 130
                    styles: style_invisible
                    on_short_click:
                      - script.execute: { id: tab5_action, emplacement: pc, commande: basculer, valeur: "" }
                    on_long_press:
                      # Sans TV (zone absente, lot 5), la télécommande n'a rien à piloter.
                      - lambda: |-
                          if (!zone_absente(Zone::TV)) animate_popup_open(id(tv_remote_popup));
          # Onglets Titre + État (factorisés, #T164) APRÈS le corps : dessinés par-dessus,
          # comme les tuiles de prévisions (forecast_daily.yaml).
          - !include { file: switch_card_title_tab.yaml, vars: { title: "PC Bureau" } }
          - !include { file: switch_card_state_tab.yaml, vars: { idx: "0", state_text: "Éteint" } }

    # Card 1 : Volet
    - obj:
        id: sw_card_1
        x: 275
        y: ${meteo_cell_y}
        width: ${meteo_cell_width}
        height: ${meteo_cell_height}
        styles: style_transparent
        scrollbar_mode: "OFF"
        widgets:
          # Corps Sombre
          - obj:
              y: 35
              width: 230
              height: 205
              styles: style_meteo_card_page
              widgets:
                - label: { id: icon_sw1, text: "\U000F111E", align: CENTER, text_font: mdi_font_70, text_color: color_text_dim }
                - button:
                    id: btn_sw1_action
                    align: CENTER
                    y: 0
                    width: 130
                    height: 130
                    styles: style_invisible
                    on_short_click:
                      # Stop si le volet bouge, sinon sens de la flèche (partagé avec forecast_daily.yaml)
                      - script.execute: tab5_volet_tap
          # Onglets Titre + État (factorisés, #T164) APRÈS le corps : dessinés par-dessus,
          # comme les tuiles de prévisions (forecast_daily.yaml).
          - !include { file: switch_card_title_tab.yaml, vars: { title: "Volet" } }
          - !include { file: switch_card_state_tab.yaml, vars: { idx: "1", state_text: "Fermé" } }

    # Card 2 : Chambre
    - obj:
        id: sw_card_2
        x: 525
        y: ${meteo_cell_y}
        width: ${meteo_cell_width}
