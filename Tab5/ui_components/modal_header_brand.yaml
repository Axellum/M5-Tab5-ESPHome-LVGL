# ═══════════════════════════════════════════════════════
# [AI-CONTEXT] Marque d'en-tête de popup (icône + titre) — cadre modal v3.
# Inclus via !include+vars par light/climate/pots/calendar/console.
# Geometry ADR-0008 : x=10, y=6, hauteur 64 (alignée sur la croix 96×64).
# vars : icon (glyphe MDI), icon_color (token), title, title_id (id LVGL du
#        label titre — obligatoire même si non mis à jour, ESPHome),
#        brand_width (largeur zone gauche, éviter le chevauchement nav centrale).
# NOTE : labels en style bloc (pas flow) car ${icon_color} non quotable en flow.
# ═══════════════════════════════════════════════════════
obj:
  align: TOP_LEFT
  x: 10
  y: 6
  width: ${brand_width}
  height: 64
  styles: style_transparent
  scrollable: false
  widgets:
    - label:
        text: "${icon}"
        align: LEFT_MID
        x: 0
        text_font: mdi_font_45
        text_color: ${icon_color}
    - label:
        id: ${title_id}
        text: "${title}"
        align: LEFT_MID
        x: 54
        text_font: roboto_45_b
        text_color: color_text
