# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file volet_popup.yaml
# @role Popup « Volets » (05/10/2026, discussion #278 : « la position du volet, dans une
#       fenêtre, et les boutons aussi »), à pages depuis le 09/10/2026 (ADR-0046) : une
#       page par pièce qui a des volets, les noms des pièces en haut (pages_onglet.yaml),
#       on passe de l'une à l'autre d'un glissement ou d'un tap sur son nom. Une seule
#       pièce : ni noms ni glissement. Deux cartes de verre :
#       - VOLETS : les volets de la pièce (5 au plus, piece_ligne.yaml) — pastille = le
#         toucher de la tuile (son sens), ligne = le choisir, appui long = sa roue
#         (ADR-0036) — et « Tout ouvrir » / « Tout fermer » (la pièce affichée) ;
#       - POSITION, du volet choisi : un volet dessiné (06/10/2026, discussion #278 :
#         « like ha animation, not a basic slider ») — une fenêtre dont le tablier à lames
#         descend depuis le coffre selon la position — et, à sa droite, son nom, la
#         position en grand (« 45 », chiffres de l'horloge, « % » de la date), l'état en
#         mots dessous (« Partiel », « En mouvement »…) et Ouvrir / Stop / Fermer
#         (gabarit volet_btn.yaml). On fait glisser le volet du doigt, vers le haut ou le
#         bas : le dessin et le nombre suivent, la position part au relâcher. Position
#         inconnue (NaN, -1 du volet à course simulée, volet qui ne la donne pas) : le
#         dessin montre l'état (ouvert en haut, fermé en bas, sinon à mi-hauteur en lames
#         estompées), sans glissement ni nombre.
#       Ouvert par l'appui long d'une tuile vol (ou « Détails » de sa roue) sur sa pièce et
#       ce volet, ou par « Aller à l'écran → Volets » / un geste de l'accueil sur la pièce
#       affichée (la première qui a des volets sinon). Un volet de l'option k (confirmation)
#       ou r (lecture seule) n'y est pas : ses commandes passent par sa tuile.
#       Tout est repeint par tab5_tuiles_popups.cpp quand l'état ou la position d'un volet
#       change, popup ouvert, sans animation (« transitions instantanées »).
# @architecture_constraint Chrome modal partagé (ADR-0009 : modal_scrim + modal_header,
#       corps à y = ${modal_body_y}), registre unique (ADR-0013 : « Volets » dans
#       tab5_modal_registry_init). Commandes : celles des tuiles (ouvrir, fermer, arreter)
#       et « position » (0-100), événement esphome.tab5_action, emplacement tRT ; le
#       blueprint « Tab5 — emplacements » les applique à l'entité de CETTE tuile.
#       Corps : x 24..1226, y 72..670 (cartes de 386 et 800 px, 16 px d'écart).
#       Sur une autre carte (lot 4 du portage, ADR-0061) : la même disposition ramenée au
#       corps (largeurs × corps_w / 1202, hauteurs × corps_h / 598, arrondies en dessous) ;
#       les marges de 22 px des cartes et le haut du volet dessiné (y 56, aligné sur le
#       nom) ne bougent pas, le volet dessiné prend la hauteur qui reste (88 px de moins
#       que le corps, comme les 510 du Tab5), en 12 lames entières.
#       Ne pas renommer volet_popup / volet_nom / volet_nombre / volet_position /
#       volet_etat / volet_cadre / volet_tablier / volet_ligne_N / vol_onglet_N : posés
#       dans g_tuiles_ui (tab5-tuiles.yaml). Le cadre n'a pas d'événement ici : glisser et
#       relâcher sont branchés en C++ (tuiles_brancher_popup_volet), qui seul sait ignorer
#       un toucher sans glissement et un PRESS_LOST ; il y crée aussi les lames du tablier
#       (builder, règle 5) et leur style, dont il pose les couleurs (palette du thème) à
#       chaque repeint. Hauteur de la fenêtre (456) et des lames : kVoletFenetreH /
#       kVoletLameH de tab5_tuiles_popups.cpp (tests/test_tuiles_firmware.py compare les deux).
#       Glisser sur le volet dessiné le règle ; ce n'est pas un changement de pièce (la
#       brique des pages, tab5_pages.cpp, ne voit pas ce geste : le cadre le garde).
# @ai_instruction `scrollable: false` partout — NE PAS retirer. `clickable: false` sur la
#       fenêtre et le tablier : le toucher doit arriver au cadre, seul à porter les
#       événements du glissement. Le label volet_nombre est dans la police de l'horloge
#       (chiffres et « : » seulement) : n'y écrire que des chiffres. Un texte de plus = sa
#       ligne dans Tab5/lang/*.yaml (gen_i18n.py).
# ═══════════════════════════════════════════════════════
obj:
  id: volet_popup
  align: CENTER
  width: 100%
  height: 100%
  hidden: true
  scrollable: false
  styles: style_invisible
  widgets:
    - !include { file: modal_scrim.yaml, vars: { scrim_opa: "100", popup_id: volet_popup } }

    # Carte modale — 15 px des bords écran (1280×720)
    - obj:
        align: CENTER
        width: ${modal_card_w}
        height: ${modal_card_h}
        styles: style_modal_card
        scrollable: false
        widgets:

          # ═══ BARRE DE TITRE (cadre v4 : icône + titre + croix, corps à y=72) ═══
          - !include { file: modal_header.yaml, vars: { icon: "\U000F111E", icon_style: "style_text_accent", title: "Volets", title_id: "volet_popup_titre", close_btn_id: "btn_volet_close", popup_id: volet_popup } }

          # Noms des pièces, sur la ligne du titre (pages_onglet.yaml) : posés par pages_onglets().
          - !include { file: pages_onglet.yaml, vars: { id: vol_onglet_0, page: 0, choisir: popup_volet_page } }
          - !include { file: pages_onglet.yaml, vars: { id: vol_onglet_1, page: 1, choisir: popup_volet_page } }
          - !include { file: pages_onglet.yaml, vars: { id: vol_onglet_2, page: 2, choisir: popup_volet_page } }
          - !include { file: pages_onglet.yaml, vars: { id: vol_onglet_3, page: 3, choisir: popup_volet_page } }
          - !include { file: pages_onglet.yaml, vars: { id: vol_onglet_4, page: 4, choisir: popup_volet_page } }
          - !include { file: pages_onglet.yaml, vars: { id: vol_onglet_5, page: 5, choisir: popup_volet_page } }
          - !include { file: pages_onglet.yaml, vars: { id: vol_onglet_6, page: 6, choisir: popup_volet_page } }
          - !include { file: pages_onglet.yaml, vars: { id: vol_onglet_7, page: 7, choisir: popup_volet_page } }
          - !include { file: pages_onglet.yaml, vars: { id: vol_onglet_8, page: 8, choisir: popup_volet_page } }
          - !include { file: pages_onglet.yaml, vars: { id: vol_onglet_9, page: 9, choisir: popup_volet_page } }

          # ═══ CARTE VOLETS (gauche) : les volets de la pièce + Tout ouvrir / Tout fermer ═══
          - obj:
              align: TOP_LEFT
              x: 24
              y: ${modal_body_y}
              width: ${ 386 * (corps_w | int) // 1202 }
              height: ${corps_h}
              styles: style_glass_card
              scrollable: false
              widgets:
                - label: { text: "VOLETS", align: TOP_LEFT, x: 22, y: 14, styles: style_text_accent }

                # Une ligne par volet de la pièce, 5 au plus (ADR-0023), 84 px tous les 92
                # sur le Tab5 (jetons piece_ligne_h / piece_ligne_pas : à la carte ailleurs) :
                # icône, nom, état, surbrillance et affichage posés par tab5_tuiles_popups.cpp.
                - !include { file: piece_ligne.yaml, vars: { id: volet_ligne_0, icone_id: volet_ligne_0_icone, choisir: popup_volet_choisir, appui: popup_volet_ligne_appui, idx: 0 } }
                - !include { file: piece_ligne.yaml, vars: { id: volet_ligne_1, icone_id: volet_ligne_1_icone, choisir: popup_volet_choisir, appui: popup_volet_ligne_appui, idx: 1 } }
                - !include { file: piece_ligne.yaml, vars: { id: volet_ligne_2, icone_id: volet_ligne_2_icone, choisir: popup_volet_choisir, appui: popup_volet_ligne_appui, idx: 2 } }
                - !include { file: piece_ligne.yaml, vars: { id: volet_ligne_3, icone_id: volet_ligne_3_icone, choisir: popup_volet_choisir, appui: popup_volet_ligne_appui, idx: 3 } }
                - !include { file: piece_ligne.yaml, vars: { id: volet_ligne_4, icone_id: volet_ligne_4_icone, choisir: popup_volet_choisir, appui: popup_volet_ligne_appui, idx: 4 } }

                # Toute la pièce affichée d'un coup : la commande de chacun de ses volets
                # listés (popup_volets_tout, une action par volet, comme sa tuile). À 88 px
                # du bas de la carte (y 510 sur le Tab5), côte à côte sous les lignes (163 px
                # de large sur le Tab5, 16 px entre eux ; jetons volet_tout_* : plus larges que
                # les lignes sur une carte où le mot n'y tiendrait pas).
                - !include { file: volet_btn.yaml, vars: { x: "${volet_tout_x}", y: "${ corps_h | int - 88 }", w: "${volet_tout_l}", h: 76, pastille: 36, rayon: 18, pastille_y: 6, texte_y: -6, appel: popup_volets_tout, commande: ouvrir, icon: "\U000F005D", icon_font: mdi_font_32, icon_style: style_text_accent, text: "Tout ouvrir" } }
                - !include { file: volet_btn.yaml, vars: { x: "${ (volet_tout_x | int) + (volet_tout_l | int) + (volet_tout_ecart | int) }", y: "${ corps_h | int - 88 }", w: "${volet_tout_l}", h: 76, pastille: 36, rayon: 18, pastille_y: 6, texte_y: -6, appel: popup_volets_tout, commande: fermer, icon: "\U000F0045", icon_font: mdi_font_32, icon_style: style_text_accent, text: "Tout fermer" } }

          # ═══ CARTE POSITION (droite) : le volet choisi, dessiné, sa position, ses commandes ═══
          - obj:
              align: TOP_LEFT
              x: ${ 24 + 402 * (corps_w | int) // 1202 }
              y: ${modal_body_y}
              width: ${ corps_w | int - 402 * (corps_w | int) // 1202 }   # jusqu'au bord du corps
              height: ${corps_h}
              styles: style_glass_card
              scrollable: false
              widgets:
                - label: { text: "POSITION", align: TOP_LEFT, x: 22, y: 14, styles: style_text_accent }

                # Le volet dessiné : un cadre (bâti et coffre, zone de glissement) qui
                # tient la fenêtre ; dans la fenêtre, le tablier glisse verticalement
                # (y = −position × 456 / 100) et la fenêtre le rogne : à 100 % il est
                # rentré dans le coffre, à 0 % il couvre toute la vitre. Haut et bas du
                # cadre (y 56..566) alignés sur le nom et le bas des commandes. Hauteur :
                # 12 lames entières (38 px sur le Tab5) dans ce qui reste du corps sous
                # y 56 et au-dessus de 32 px d'air, plus le coffre et le bas (54 px).
                - obj:
                    id: volet_cadre
                    align: TOP_LEFT
                    x: ${ 56 * (corps_w | int) // 1202 }
                    y: 56
                    width: ${ 336 * (corps_w | int) // 1202 }
                    height: ${ 12 * ((corps_h | int - 142) // 12) + 54 }
                    styles: [style_bg_arc_track, style_border_glass_rim]
                    bg_opa: COVER
                    border_width: 2
                    border_opa: 60%
                    radius: 16
                    pad_all: 0
                    scrollable: false
                    widgets:
                      # Vitre : l'accent très estompé sur le bâti (la lumière du dehors).
                      # Bordure de 2 px du cadre comprise : 12 px du bord, 42 en haut
                      # (le coffre), 12 en bas.
                      - obj:
                          id: volet_fenetre
                          align: TOP_LEFT
                          x: 10
                          y: 40
                          width: ${ 336 * (corps_w | int) // 1202 - 24 }
                          height: ${ 12 * ((corps_h | int - 142) // 12) }
                          styles: style_bg_accent
                          bg_opa: 15%
                          border_width: 0
                          radius: 0
                          pad_all: 0
                          clickable: false
                          scrollable: false
                          widgets:
                            # Tablier : 12 lames de 38 px créées en C++ (lames_construire).
                            - obj:
                                id: volet_tablier
                                align: TOP_LEFT
                                x: 0
                                y: 0
                                width: ${ 336 * (corps_w | int) // 1202 - 24 }
                                height: ${ 12 * ((corps_h | int - 142) // 12) }
                                styles: style_transparent
                                clickable: false
                                scrollable: false

                # À droite du volet (x 392..796, milieu à +196 du centre de la carte) :
                # le nom du volet choisi (coupé avec « … » par le C++), la position, l'état.
                - label:
                    id: volet_nom
                    text: ""
                    align: TOP_MID
                    x: ${ 196 * (corps_w | int) // 1202 }
                    y: 56
                    text_font: roboto_32_b

                # « 45 % » : chiffres dans la police de l'horloge, « % » dans celle de la
                # date, posés côte à côte (flex), le « % » remonté sur la ligne de base.
                - obj:
                    id: volet_position
                    align: TOP_MID
                    x: ${ 196 * (corps_w | int) // 1202 }
                    y: ${ 56 + 48 * (corps_h | int) // 598 }
                    width: SIZE_CONTENT
                    height: SIZE_CONTENT
                    styles: style_transparent
                    scrollable: false
                    hidden: true
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: CENTER
                      flex_align_cross: END
                      pad_column: 10
                    widgets:
                      - label: { id: volet_nombre, text: "0", styles: style_police_horloge }
                      - label: { text: "%", styles: style_police_date, pad_bottom: 24 }

                # État en mots : sous la position (y posé par tab5_tuiles_popups.cpp), ou
                # seul, entre le nom et les commandes, quand la position n'est pas connue.
                - label:
                    id: volet_etat
                    text: "--"
                    align: TOP_MID
                    x: ${ 196 * (corps_w | int) // 1202 }
                    y: ${ 56 + 144 * (corps_h | int) // 598 }
                    styles: style_police_date

                # Ouvrir / Stop / Fermer du volet choisi, côte à côte, le bas aligné sur
                # celui du volet dessiné (566 sur le Tab5 : y 404, 162 de haut).
                - !include { file: volet_btn.yaml, vars: { x: "${ 402 * (corps_w | int) // 1202 }", y: "${ 56 + 12 * ((corps_h | int - 142) // 12) + 54 - 162 * (corps_h | int) // 598 }", w: "${ 120 * (corps_w | int) // 1202 }", h: "${ 162 * (corps_h | int) // 598 }", pastille: "${ [80 * (corps_w | int) // 1202, 80 * (corps_h | int) // 598] | min }", rayon: "${ [80 * (corps_w | int) // 1202, 80 * (corps_h | int) // 598] | min // 2 }", pastille_y: "${ 24 * (corps_h | int) // 598 }", texte_y: "${ 0 - 22 * (corps_h | int) // 598 }", appel: popup_volet_commande, commande: ouvrir, icon: "\U000F005D", icon_font: mdi_font_45, icon_style: style_text_accent, text: "Ouvrir" } }
                - !include { file: volet_btn.yaml, vars: { x: "${ 534 * (corps_w | int) // 1202 }", y: "${ 56 + 12 * ((corps_h | int - 142) // 12) + 54 - 162 * (corps_h | int) // 598 }", w: "${ 120 * (corps_w | int) // 1202 }", h: "${ 162 * (corps_h | int) // 598 }", pastille: "${ [80 * (corps_w | int) // 1202, 80 * (corps_h | int) // 598] | min }", rayon: "${ [80 * (corps_w | int) // 1202, 80 * (corps_h | int) // 598] | min // 2 }", pastille_y: "${ 24 * (corps_h | int) // 598 }", texte_y: "${ 0 - 22 * (corps_h | int) // 598 }", appel: popup_volet_commande, commande: arreter, icon: "\U000F04DB", icon_font: mdi_font_45, icon_style: style_text_warning, text: "Stop" } }
                - !include { file: volet_btn.yaml, vars: { x: "${ 666 * (corps_w | int) // 1202 }", y: "${ 56 + 12 * ((corps_h | int - 142) // 12) + 54 - 162 * (corps_h | int) // 598 }", w: "${ 120 * (corps_w | int) // 1202 }", h: "${ 162 * (corps_h | int) // 598 }", pastille: "${ [80 * (corps_w | int) // 1202, 80 * (corps_h | int) // 598] | min }", rayon: "${ [80 * (corps_w | int) // 1202, 80 * (corps_h | int) // 598] | min // 2 }", pastille_y: "${ 24 * (corps_h | int) // 598 }", texte_y: "${ 0 - 22 * (corps_h | int) // 598 }", appel: popup_volet_commande, commande: fermer, icon: "\U000F0045", icon_font: mdi_font_45, icon_style: style_text_accent, text: "Fermer" } }
