# ═══════════════════════════════════════════════════════
# [AI-CONTEXT]
# @file volet_popup.yaml
# @role Popup d'un volet (05/10/2026, discussion #278 : « la position du volet, dans une
#       fenêtre, et les boutons aussi »). Ouvert par l'appui long d'une tuile vol (tuile
#       météo ou carte du mode HA, tuile_appui → popup_volet_ouvrir, tab5_tuiles.cpp),
#       sur ce volet. Deux cartes de verre :
#       - POSITION : un volet dessiné (06/10/2026, discussion #278 : « like ha animation,
#         not a basic slider ») — une fenêtre dont le tablier à lames descend depuis le
#         coffre selon la position — et, à sa droite, la position en grand (« 45 »,
#         chiffres de l'horloge, « % » de la date) avec l'état en mots dessous
#         (« Partiel », « En mouvement »…). On fait glisser le volet du doigt, vers le
#         haut ou le bas : le dessin et le nombre suivent, la position part au relâcher.
#         Position inconnue (NaN, -1 du volet à course simulée, volet qui ne la donne
#         pas) : le dessin montre l'état (ouvert en haut, fermé en bas, sinon à
#         mi-hauteur en lames estompées), sans glissement ni nombre ;
#       - COMMANDES : Ouvrir / Stop / Fermer (gabarit volet_btn.yaml), l'icône dans une
#         pastille ronde, comme les boutons d'un tableau de bord de Home Assistant.
#       Titre = nom de la tuile. Tout est repeint par tab5_tuiles.cpp quand l'état ou la
#       position du volet change, popup ouvert (popup_volet_etat), sans animation :
#       chaque position poussée redessine directement (« transitions instantanées »).
# @architecture_constraint Chrome modal partagé (ADR-0009 : modal_scrim + modal_header,
#       corps à y = ${modal_body_y}), registre unique (ADR-0013 : « Volet » dans
#       tab5_modal_registry_init). Commandes : celles des tuiles (ouvrir, fermer, arreter)
#       et « position » (0-100), événement esphome.tab5_action, emplacement tRT ; le
#       blueprint « Tab5 — emplacements » les applique à l'entité de CETTE tuile.
#       Corps : x 24..1226, y 72..670 (cartes de 800 et 386 px, 16 px d'écart).
#       Ne pas renommer volet_popup / volet_popup_titre / volet_nombre / volet_position /
#       volet_etat / volet_cadre / volet_tablier : posés dans g_tuiles_ui
#       (tab5-tuiles.yaml). Le cadre n'a pas d'événement ici : glisser et relâcher sont
#       branchés en C++ (tuiles_brancher_popup_volet), qui seul sait ignorer un toucher
#       sans glissement et un PRESS_LOST ; il y crée aussi les lames du tablier (builder,
#       règle 5) et leur style, dont il pose les couleurs (palette du thème) à chaque repeint.
#       Hauteur de la fenêtre (456) et des lames : kVoletFenetreH / kVoletLameH de
#       tab5_tuiles.cpp (tests/test_tuiles_firmware.py compare les deux).
# @ai_instruction `scrollable: false` partout — NE PAS retirer. `clickable: false` sur la
#       fenêtre et le tablier : le toucher doit arriver au cadre, seul à porter les
#       événements du glissement. Le label volet_nombre est dans la police de l'horloge
#       (chiffres et « : » seulement) : n'y écrire que des chiffres. Un texte de plus = sa
#       ligne dans Tab5/lang/*.yaml (gen_i18n.py).
# ═══════════════════════════════════════════════════════
obj:
  id: volet_popup
  align: CENTER
  width: 100%
  height: 100%
  hidden: true
  scrollable: false
  styles: style_invisible
  widgets:
    - !include { file: modal_scrim.yaml, vars: { scrim_opa: "100", close_lambda: "animate_popup_close(id(volet_popup));" } }

    # Carte modale — 15 px des bords écran (1280×720)
    - obj:
        align: CENTER
        width: ${modal_card_w}
        height: ${modal_card_h}
        styles: style_modal_card
        scrollable: false
        widgets:

          # ═══ BARRE DE TITRE (cadre v4 : icône + titre + croix, corps à y=72) ═══
          # Titre : le nom de la tuile, posé par popup_volet_peindre().
          - !include { file: modal_header.yaml, vars: { icon: "\U000F111E", icon_style: "style_text_accent", title: "Volet", title_id: "volet_popup_titre", close_btn_id: "btn_volet_close", close_lambda: "animate_popup_close(id(volet_popup));" } }

          # ═══ CARTE POSITION (gauche) : le volet dessiné, la position, l'état ═══
          - obj:
              align: TOP_LEFT
              x: 24
              y: ${modal_body_y}
              width: 800
              height: 598
              styles: style_glass_card
              scrollable: false
              widgets:
                - label: { text: "POSITION", align: TOP_LEFT, x: 22, y: 14, styles: style_text_accent }

                # Le volet dessiné : un cadre (bâti et coffre, zone de glissement) qui
                # tient la fenêtre ; dans la fenêtre, le tablier glisse verticalement
                # (y = −position × 456 / 100) et la fenêtre le rogne : à 100 % il est
                # rentré dans le coffre, à 0 % il couvre toute la vitre. Haut et bas du
                # cadre (y 56..566) alignés sur ceux des boutons Ouvrir et Fermer.
                - obj:
                    id: volet_cadre
                    align: TOP_LEFT
                    x: 56
                    y: 56
                    width: 336
                    height: 510
                    styles: [style_bg_arc_track, style_border_glass_rim]
                    bg_opa: COVER
                    border_width: 2
                    border_opa: 60%
                    radius: 16
                    pad_all: 0
                    scrollable: false
                    widgets:
                      # Vitre : l'accent très estompé sur le bâti (la lumière du dehors).
                      # Bordure de 2 px du cadre comprise : 12 px du bord, 42 en haut
                      # (le coffre), 12 en bas.
                      - obj:
                          id: volet_fenetre
                          align: TOP_LEFT
                          x: 10
                          y: 40
                          width: 312
                          height: 456
                          styles: style_bg_accent
                          bg_opa: 15%
                          border_width: 0
                          radius: 0
                          pad_all: 0
                          clickable: false
                          scrollable: false
                          widgets:
                            # Tablier : 12 lames de 38 px créées en C++ (lames_construire).
                            - obj:
                                id: volet_tablier
                                align: TOP_LEFT
                                x: 0
                                y: 0
                                width: 312
                                height: 456
                                styles: style_transparent
                                clickable: false
                                scrollable: false

                # « 45 % » : chiffres dans la police de l'horloge, « % » dans celle de la
                # date, posés côte à côte (flex), le « % » remonté sur la ligne de base.
                # Centré sur la place à droite du volet (x 392..800 : milieu à +196).
                - obj:
                    id: volet_position
                    align: TOP_MID
                    x: 196
                    y: 184
                    width: SIZE_CONTENT
                    height: SIZE_CONTENT
                    styles: style_transparent
                    scrollable: false
                    hidden: true
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: CENTER
                      flex_align_cross: END
                      pad_column: 10
                    widgets:
                      - label: { id: volet_nombre, text: "0", styles: style_police_horloge }
                      - label: { text: "%", styles: style_police_date, pad_bottom: 24 }

                # État en mots : sous la position (y posé par tab5_tuiles.cpp), ou seul,
                # au milieu de la carte, quand la position n'est pas connue.
                - label:
                    id: volet_etat
                    text: "--"
                    align: TOP_MID
                    x: 196
                    y: 272
                    styles: style_police_date

          # ═══ CARTE COMMANDES (droite) : Ouvrir / Stop / Fermer ═══
          - obj:
              align: TOP_LEFT
              x: 840
              y: ${modal_body_y}
              width: 386
              height: 598
              styles: style_glass_card
              scrollable: false
              widgets:
                - label: { text: "COMMANDES", align: TOP_LEFT, x: 22, y: 14, styles: style_text_accent }
                - !include { file: volet_btn.yaml, vars: { y: 56, commande: ouvrir, icon: "\U000F005D", icon_style: style_text_accent, text: "Ouvrir" } }
                - !include { file: volet_btn.yaml, vars: { y: 232, commande: arreter, icon: "\U000F04DB", icon_style: style_text_warning, text: "Stop" } }
                - !include { file: volet_btn.yaml, vars: { y: 408, commande: fermer, icon: "\U000F0045", icon_style: style_text_accent, text: "Fermer" } }
