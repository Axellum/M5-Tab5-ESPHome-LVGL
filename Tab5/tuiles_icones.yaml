# ============================================================================
# [AI-CONTEXT]
# @file tuiles_icones.yaml
# @role SOURCE UNIQUE de la palette des icônes des tuiles de pièce (ADR-0023, section
#       « Icons: one palette, generated »). Ce n'est PAS un package ESPHome : rien ne
#       l'inclut ; tools/gen_tuiles_icones.py le lit et écrit trois choses :
#       - Tab5/tab5_tuiles_icones.h : la table C++ `tuile_icone(code, actif, type)` ;
#       - Tab5/tab5-styles.yaml : les glyphes de la palette dans mdi_font_70, mdi_font_45
#         et mdi_font_32 (entre `# >>> tuiles` et `# <<< tuiles`) ;
#       - le blueprint tab5_emplacements.yaml : `icones_mdi` (nom « mdi:… » → code) et
#         `icones_defaut` (domaine ou « domaine.classe » → code), entre ses marqueurs.
#       `python tools/gen_tuiles_icones.py --check` échoue si l'un d'eux est périmé
#       (tests/test_tuiles_icones.py le joue).
# @architecture_constraint
#       - Police : Tab5/materialdesignicons-webfont.ttf = Material Design Icons 7.4.47
#         (7 447 glyphes, mêmes points de code que meta.json de @mdi/svg@7.4.47).
#         Chaque glyphe ci-dessous est écrit « FXXXX nom » ; le couple a été VÉRIFIÉ le
#         28/09/2026 contre ce meta.json ET le cmap du TTF (fontTools), jamais deviné.
#         Revérifier après un ajout :
#           curl -sL https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/meta.json -o meta.json
#           python tools/gen_tuiles_icones.py --meta meta.json
#         Sans réseau, le test compare au cmap et aux noms de glyphes du TTF.
#       - Un glyphe coûte ~0,5 Ko de flash par taille (70, 45 et 32 px, bpp 1) : une
#         variante allumée distincte n'est prise que si MDI en a une (-on, -off, -open,
#         fermé / ouvert, -alert). Sinon `allume` est omis (= `eteint`) et la couleur
#         de l'état suffit.
#       - lit, canape, led, ordinateur et volet gardent exactement les glyphes de la 3.1
#         (compatibilité de la pièce 1 construite depuis les emplacements 3.x, ADR-0023).
#       - `code` : [a-z0-9_]{1,15}, en français, jamais renommé (HA l'envoie, la tablette
#         le garde en NVS). Retirer un code = le laisser retomber sur le défaut du type.
#       - `mdi` : les noms d'icônes HA (sans « mdi: ») que ce code représente ; un nom
#         n'appartient qu'à un code. Noms canoniques de MDI 7.4.47, non dépréciés.
#       - `types` : type de tuile dont c'est l'icône par défaut (lum int vol med act cap
#         bin cli, un code par type). `domaines` : domaine HA ou « domaine.classe »
#         (device_class) dont c'est l'icône par défaut.
#       - `actif` (côté firmware) = allumé / ouvert / en marche / détecté / présent /
#         déverrouillé : c'est la variante `allume` qui s'affiche.
# @ai_instruction Ajouter une icône = une entrée ici (points de code relevés dans le
#       meta.json de la MÊME version que le TTF), puis `python tools/gen_tuiles_icones.py`
#       et une release (le firmware embarque les glyphes). Docs : docs/tiles_icons.md.
# ============================================================================

# Code montré quand ni l'icône reçue ni le type de la tuile ne sont connus.
repli: etat

icones:
  # --- Lumières -------------------------------------------------------------
  - code: ampoule
    eteint: F0335 lightbulb
    allume: F06E8 lightbulb-on
    mdi: [lightbulb, lightbulb-outline, lightbulb-on, lightbulb-on-outline, lightbulb-off,
          lightbulb-off-outline, lightbulb-variant, lightbulb-variant-outline, lightbulb-night,
          lightbulb-spot, lightbulb-group, lightbulb-group-outline, lightbulb-multiple,
          lightbulb-multiple-outline]
    types: [lum]
    domaines: [light, binary_sensor.light]
  - code: plafonnier
    eteint: F0769 ceiling-light
    mdi: [ceiling-light, ceiling-light-outline, ceiling-light-multiple,
          ceiling-light-multiple-outline, light-recessed, ceiling-fan-light]
  - code: lampadaire
    eteint: F08DD floor-lamp
    mdi: [floor-lamp, floor-lamp-outline, floor-lamp-dual, floor-lamp-dual-outline,
          floor-lamp-torchiere, floor-lamp-torchiere-outline, floor-lamp-torchiere-variant,
          floor-lamp-torchiere-variant-outline]
  - code: lampe
    eteint: F06B5 lamp
    mdi: [lamp, lamp-outline, lamps, lamps-outline]
  - code: lampe_bureau
    eteint: F095F desk-lamp
    allume: F1B20 desk-lamp-on
    mdi: [desk-lamp, desk-lamp-on, desk-lamp-off]
  # Glyphe unique : c'est l'icône « LEDs » de la 3.1 (tuile 5), qui ne change pas.
  - code: led
    eteint: F1051 led-strip-variant
    mdi: [led-strip-variant, led-strip-variant-off, led-strip, led-on, led-off, led-outline,
          led-variant-on, led-variant-off]
  - code: guirlande
    eteint: F12BB string-lights-off
    allume: F12BA string-lights
    mdi: [string-lights, string-lights-off]
  - code: applique
    eteint: F091C wall-sconce
    mdi: [wall-sconce, wall-sconce-outline, wall-sconce-flat, wall-sconce-flat-outline,
          wall-sconce-flat-variant, wall-sconce-flat-variant-outline, wall-sconce-round,
          wall-sconce-round-outline, wall-sconce-round-variant,
          wall-sconce-round-variant-outline]
  - code: lustre
    eteint: F1793 chandelier
    mdi: [chandelier]

  # --- Pièces (icônes de la 3.1 : « Chambre », « Salon ») -------------------
  - code: lit
    eteint: F02E3 bed
    mdi: [bed, bed-outline, bed-empty, bed-double, bed-double-outline, bed-king, bed-queen,
          bed-single, bed-single-outline]
  - code: canape
    eteint: F04B9 sofa
    mdi: [sofa, sofa-outline, sofa-single, sofa-single-outline]

  # --- Appareils ------------------------------------------------------------
  - code: prise
    eteint: F06A6 power-plug-off
    allume: F06A5 power-plug
    mdi: [power-plug, power-plug-off, power-plug-outline, power-plug-off-outline, power-socket,
          power-socket-eu, power-socket-fr, power-socket-de, power-socket-uk, power-socket-us,
          power-socket-it, power-socket-ch]
