  - code: interrupteur
    eteint: F1A26 toggle-switch-variant-off
    allume: F1A25 toggle-switch-variant
    mdi: [toggle-switch-variant, toggle-switch-variant-off, toggle-switch, toggle-switch-off,
          toggle-switch-outline, toggle-switch-off-outline, light-switch, light-switch-off,
          electric-switch, electric-switch-closed]
    types: [int]
    domaines: [switch, switch.switch, input_boolean, automation]
  # Glyphe unique : c'est l'icône « PC Bureau » de la 3.1 (tuile 1), qui ne change pas.
  - code: ordinateur
    eteint: F0379 monitor
    mdi: [monitor, monitor-off, monitor-shimmer, desktop-classic, desktop-tower,
