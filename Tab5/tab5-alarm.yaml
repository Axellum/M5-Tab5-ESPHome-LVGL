# ============================================================================
# [AI-CONTEXT]
# @file tab5-alarm.yaml
# @role Réveil matin + annonce des rendez-vous : entités exposées à Home
#       Assistant, sonnerie, machine d'état, et pont vers les deux fenêtres LVGL
#       (ui_components/alarm_popup.yaml et alarm_ring_overlay.yaml).
# @architecture_constraint AUCUNE logique de calcul ici : les dates, le choix du
#       jour, les bornes et les libellés vivent dans Tab5/alarm_clock.cpp, qui ne
#       dépend ni de HA ni du réseau. Ce fichier ne fait que (a) recopier les
#       entités dans `g_alarm_cfg`, (b) déclencher la sonnerie, (c) rendre l'UI.
# @architecture_constraint Le réveil DOIT sonner sans Home Assistant : l'heure
#       vient de SNTP, les horaires de travail sont déjà en cache dans
#       `cal_jours_data[]`, et la mélodie est synthétisée sur l'appareil (rtttl,
#       sinus pur — pas un fichier). HA n'apporte que du confort : l'annonce
#       parlée du réveil, la liste des rendez-vous, et une sonnerie personnalisée
#       par URL (repli automatique sur la mélodie locale si HA ne répond pas).
# @ai_instruction Le volume ne s'écrit JAMAIS en dur ici. `rtttl` appelle
#       `speaker->set_volume()`, qui pilote AUSSI le volume matériel de l'ES8388
#       (i2s_audio_speaker.cpp:145) : sans la restauration faite par
#       `tab5_alarm_ring_cleanup`, la première réponse vocale après une sonnerie
#       sortirait au volume du réveil.
# @ai_instruction Toute nouvelle entité de réglage doit (1) appeler
#       `script.tab5_alarm_refresh` dans son `on_value`, sinon `g_alarm_cfg` reste
#       périmé et la prochaine sonnerie ne bouge pas, et (2) être ajoutée au
#       rendu de `alarm_render_settings()` si elle apparaît dans le popup.
# ============================================================================

# ─── Sonnerie locale ────────────────────────────────────────────────────────
# rtttl écrit directement dans `tab5_speaker`, en DEHORS du media_player. Il
# attend que le haut-parleur soit à l'arrêt avant de démarrer (rtttl.cpp, état
# INIT) : aucune collision avec une réponse vocale en cours, juste une attente.
# `gain` n'est qu'une valeur de départ — chaque passage la réécrit via
# `set_gain()` pour le volume progressif.
#
# [AI-WARNING][I2S-BUS] Écrire dans le haut-parleur exige le bus I2S, et le
# micro et le haut-parleur du Tab5 sont sur le MÊME bus `mic_bus`, protégé par un
# mutex unique (i2s_audio.h, `Mutex lock_`) : ils ne peuvent PAS fonctionner en
# même temps. Le premier qui prend le mutex le garde ; l'autre échoue
# (« Parent bus is busy ») et retente indéfiniment, une fois par seconde.
# Conséquence mesurée sur l'appareil le 05/08 : micro en écoute (« Ok Nabu »
# actif, l'état par défaut) = sonnerie totalement muette, et haut-parleur laissé
# bloqué en STATE_STARTING ensuite. Le media_player, lui, gère déjà ce relais
# pour le TTS (tab5-hardware.yaml : `on_announcement` coupe microWakeWord,
# `on_idle` le rend) — c'est pour ça que les réponses vocales, elles, s'entendent.
# Tout chemin qui joue du son HORS media_player doit refaire ce relais lui-même.
# C'est ce que font `tab5_alarm_ring_loop` et `tab5_alarm_preview`.
rtttl:
  - id: alarm_rtttl
    speaker: tab5_speaker
    gain: 0.8

# ═══════════════════════════════════════════════════════════════════════════
# ENTITÉS DE RÉGLAGE — toutes exposées à Home Assistant (catégorie « config »)
# ═══════════════════════════════════════════════════════════════════════════
switch:
  - platform: template
    id: tab5_alarm_enabled
    name: "Réveil"
    icon: mdi:alarm
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - script.execute: tab5_alarm_refresh
    on_turn_off:
      # Éteindre le réveil doit AUSSI couper une répétition en cours et une
      # sonnerie en train de retentir — sinon la bascule ne « rend » pas la main.
      - lambda: |-
          auto t = id(sntp_time).now();
          if (t.is_valid()) alarm_dismiss(t.timestamp);
      - if:
          condition:
            lambda: 'return id(alarm_ringing);'
          then:
            - script.execute: tab5_alarm_stop
      - script.execute: tab5_alarm_refresh

  - platform: template
    id: tab5_alarm_repos_fixe
    name: "Réveil : sonner les jours de repos"
    icon: mdi:calendar-remove
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - script.execute: tab5_alarm_refresh
    on_turn_off:
      - script.execute: tab5_alarm_refresh

  - platform: template
    id: tab5_alarm_crescendo
    name: "Réveil : volume progressif"
    icon: mdi:volume-plus
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: tab5_alarm_refresh
    on_turn_off:
      - script.execute: tab5_alarm_refresh

  - platform: template
    id: tab5_alarm_tts
    name: "Réveil : annonce parlée"
    icon: mdi:account-voice
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: tab5_alarm_refresh
    on_turn_off:
      - script.execute: tab5_alarm_refresh

  - platform: template
    id: tab5_alarm_rdv_on
    name: "Annonce des rendez-vous"
    icon: mdi:calendar-clock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: tab5_alarm_refresh
    on_turn_off:
      - script.execute: tab5_alarm_refresh

datetime:
  # `type: time` donne une vraie horloge dans Home Assistant (sélecteur d'heure)
  # et un état lisible, là où un `number` de minutes obligerait à convertir des
  # deux côtés. `on_time` n'est PAS utilisé : il ne déclencherait qu'à heure
  # fixe, alors que le mode calendrier change l'heure tous les jours — c'est
  # `alarm_due()` qui décide, à partir de l'heure lue ici.
  - platform: template
    id: tab5_alarm_time
    name: "Réveil : heure"
    icon: mdi:clock-outline
    type: time
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"
    entity_category: config
    on_value:
      - script.execute: tab5_alarm_refresh

  - platform: template
    id: tab5_alarm_early
    name: "Réveil : jamais avant"
    icon: mdi:clock-start
    type: time
    optimistic: true
    restore_value: true
    initial_value: "05:00:00"
    entity_category: config
    on_value:
      - script.execute: tab5_alarm_refresh

  - platform: template
    id: tab5_alarm_late
    name: "Réveil : jamais après"
    icon: mdi:clock-end
    type: time
    optimistic: true
    restore_value: true
    initial_value: "09:00:00"
    entity_category: config
    on_value:
      - script.execute: tab5_alarm_refresh

number:
  - platform: template
    id: tab5_alarm_lead
    name: "Réveil : délai avant l'ouverture"
    icon: mdi:timer-sand
    unit_of_measurement: "min"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 90
    min_value: 0
    max_value: 240
