  - platform: template
    id: tab5_alarm_snooze_min
    name: "Réveil : répétition"
    icon: mdi:alarm-snooze
    unit_of_measurement: "min"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 9
    min_value: 1
    max_value: 30
    step: 1
    on_value:
      - script.execute: tab5_alarm_refresh

  - platform: template
    id: tab5_alarm_max_ring
    name: "Réveil : durée max de sonnerie"
    icon: mdi:timer-outline
    unit_of_measurement: "min"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 1
    max_value: 60
    step: 1
    on_value:
      - script.execute: tab5_alarm_refresh

  - platform: template
    id: tab5_alarm_volume
    name: "Réveil : volume"
    icon: mdi:volume-high
    unit_of_measurement: "%"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 80
    min_value: 10
    max_value: 100
