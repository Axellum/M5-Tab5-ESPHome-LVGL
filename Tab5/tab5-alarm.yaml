    name: "Réveil : repos mini après la fermeture"
    icon: mdi:sleep
    unit_of_measurement: "h"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 14
    step: 1
    on_value:
