# ============================================================================
# [AI-CONTEXT]
# @file tab5-lvgl.yaml
# @role Layout complet de l'interface LVGL (pages, widgets statiques, grille).
# @architecture_constraint Ne jamais créer de tableaux C++ ou de logique métier complexe
#                         (comme le calcul de pagination) dans ce fichier YAML.
# @ai_instruction Ce fichier doit rester purement déclaratif (UI). Toute logique de swipe
#                 doit être déléguée au C++.
# ============================================================================
lvgl:

  pages:

    - id: page_main
      scrollbar_mode: "OFF"
      # L'écran ne défile jamais. Pendant un swipe des prévisions, le calque entrant
      # part 110 px hors écran (animate_swipe_horizontal) : la page devenait alors
      # défilable, le doigt encore posé la faisait glisser, et tout l'affichage
      # restait décalé (vu le 29/09/2026). Le geste, lui, ne dépend pas du défilement.
      scrollable: false

      on_gesture:
        then:
          # [AI-CONTEXT] Pagination previsions (swipe gauche/droite, y>=333 carte centrale)
          # deleguee a handle_swipe_gesture(). Console diag : appui long sur btn_control_console (choix « auto »).
          - lambda: |-
              lv_indev_t * indev = lv_indev_active();
              if (indev) {
                  lv_point_t pt;
                  lv_indev_get_point(indev, &pt);
                  lv_dir_t d = lv_indev_get_gesture_dir(indev);

                  lv_obj_t* pbars[] = {id(pbar_0), id(pbar_1), id(pbar_2), id(pbar_3), id(pbar_4)};
                  handle_swipe_gesture(d, pt.y,
                      id(layer_forecast_daily), id(layer_forecast_hourly),
                      g_day_slots, g_hour_slots,
                      id(font_meteo_card), id(font_meteo_card_small),
                      pbars,
                      id(page_title_wrapper), id(lbl_page_title),
                      g_central_ctx);
              }

      widgets:

        # --- Top Left: Status Icons (Moved lower) ---

        # --- Grille du haut (05/10/2026) ---
        # Trois colonnes à 20 px des bords de l'écran, comme le bandeau central : gauche
        # 20-425 (Domo, micro, Discu, Ok Nabu), horloge 440-841, droite 855-1260 (HA,
        # Sys, TV, températures, clim) ; 15 px entre les boutons, 15 px à gauche de
        # l'horloge et 14 px à droite (1280 − 2 × 20 − 2 × 405 = 430 = 401 + 29 : LVGL
        # centre la tuile à 640 − 401 / 2 = 440, mesuré sur le rendu du 05/10/2026).
        # Hauts alignés à y 20 (horloge, HA / Sys / TV) ; bas alignés à y 308 (Ok Nabu,
        # pied des icônes des pots, tuile clim), 25 px au-dessus du bandeau central :
        # le même écart qu'entre le bandeau et les titres des cartes météo (417 → 442).
        # Boutons 125 × 90 et icônes MDI de 70 px (mdi_font_70, encre de 58 px) : 16 px
        # d'air au-dessus et au-dessous de l'icône dans chaque bouton.

        # --- Voice Assistant Panel (Left) ---
        # Micro au milieu de la colonne (160-285, encre centrée sur la rangée Domo / Discu).
        - label: { id: icon_mic_status, text: "\U000F036C", align: TOP_LEFT, x: 162, y: 69, text_font: mdi_font_120, styles: style_text_dim }
        - button:
            id: btn_assist_trigger
            align: TOP_LEFT
            x: 162
            y: 69
            width: 120
            height: 120
            styles: style_invisible
            on_short_click:
              - script.execute: tab5_assist_toggle
            on_long_press:
              # Appui long sur la zone micro -> popup Assistant vocal plein écran
              - script.execute: tab5_assist_open

        # Bouton Domo (et Discu ci-dessous) : masqués sans pipeline de discussion dans HA
        # (zone « discussion », zones_apply_ui) ; le micro reste au milieu.
        # Icône seule (05/10/2026). Rangée centrée entre le bandeau d'état (encre jusqu'à
        # y 34) et Ok Nabu (y 218) : 47 px d'air au-dessus, 47 au-dessous.
        - button:
            id: btn_mode_domo
            align: TOP_LEFT
            x: 20
            y: 81
            width: 125
            height: 90
            styles: style_clim_btn_page
            on_short_click:
              - script.execute:
                  id: tab5_set_assist_mode
                  discussion: false
            widgets:
              - label: { text: "\U000F07D0", align: CENTER, text_font: mdi_font_70 }

        # Bouton Discu
        - button:
            id: btn_mode_discu
            align: TOP_LEFT
            x: 300
            y: 81
            width: 125
            height: 90
            styles: style_clim_btn_page
            on_short_click:
              - script.execute:
                  id: tab5_set_assist_mode
                  discussion: true
            widgets:
              - label: { text: "\U000F06A9", align: CENTER, text_font: mdi_font_70 }

        # Bouton OK Nabu : même place que la tuile clim, en miroir (toute la colonne,
        # 90 px de haut, bas à y 308), texte à la taille de la date (45 px). Le bouton
        # Muet qui le précédait est retiré le 05/10/2026 : le son se coupe depuis le
        # popup Assistant vocal (btn_assist_mute).
        - button:
            id: btn_ok_nabu
            align: TOP_LEFT
            x: 20
            y: 218
            width: 405
            height: 90
            styles: style_clim_btn_page
            on_short_click:
              - switch.toggle: tab5_wake_word_active
            widgets:
              - label: { id: lbl_ok_nabu, text: "Ok Nabu: ON", align: CENTER, styles: [style_police_date, style_text_success] }

        # --- Centre: Horloge ---
        # Marges égales (05/10/2026, demande d'Axel) : autant d'air entre le haut de la
        # tuile et l'encre des chiffres qu'entre le bas des jambages de la date et le bas
        # de la tuile (23 px en Roboto) ; sur les côtés, l'encre de HH:MM est centrée.
        # Valeurs pour Roboto et une bordure de 1 px : theme_polices() (tab5_theme.cpp)
        # repose cadres, « : » et date pour la police et la bordure du thème (05/10/2026).
        - obj:
            id: clock_tile
            align: TOP_MID
            x: 0
            y: 20
            width: 401
            height: 210
            styles: style_horloge_page
            scrollbar_mode: "OFF"
            widgets:
              # Horloge à rouleau : UN conteneur qui rogne PAR CHIFFRE (H H : M M),
              # 2 labels chacun (l'affiché + celui qui arrive), et le ":" fixe.
              # De 22 à 23 mn, seul le dernier chiffre tourne.
              # [AI-WARNING] Géométrie posée ICI seulement (01/10/2026). Jusque-là
              # layout_clock_roller() la recalculait en C++ 2 s après le boot, et ces
              # cadres provisoires de 105 px coupaient le bas des chiffres (encre de
              # 27 à 123 px) pendant ~1,5 s au démarrage. Valeurs de roboto_130_b
              # (Roboto 700, 130 px) : chiffre 75 px de large (tabulaire), « : »
              # 37 px, encre des chiffres à 27-123 px du haut du label.
              #   - cadre 75 × 104 à y 17 (clock_roller.yaml, gabarit des 4 rouleaux) :
              #     l'encre + 3 px de marge en haut et 5 en bas ; l'encre visible (bpp 2 :
              #     la 1re rangée des chiffres ronds est vide) à 23 px du haut de la tuile
              #     (bordure 1 px), autant que sous le bas des jambages de la date. Plus
              #     court que le label (152 px), sinon le chiffre qui arrive, posé
              #     un cadre plus bas, déborderait sur la date ;
              #   - label à y -23 : remonte l'encre dans le cadre ;
              #   - x : HH:MM centré dans les 399 px de la tuile (bordure 1 px),
              #     4 px de respiration de chaque côté du « : » ;
              #   - date : ligne de base à y 177, 32 px au-dessus du bas de la tuile,
              #     jambages jusqu'à 23 px ; label à y 135 en Roboto 45 (ascendante
              #     42 px). Une police de thème repose ce y, et les cadres selon ses
              #     jambages (theme_polices(), tools/police_theme.py).
              # La hauteur du cadre EST la course du rouleau (lue par le C++).
              # tests/test_horloge.py refait ces calculs depuis la police : changer
              # la taille de police ou une valeur ici sans les autres le fait échouer.
              # Ne pas remettre un label unique `lbl_time` : le C++ pilote ces
              # 8 labels via g_clock_roller.
              - !include { file: ui_components/clock_roller.yaml, vars: { d: h10, x: 27 } }
              - !include { file: ui_components/clock_roller.yaml, vars: { d: h1, x: 102 } }
              - label: { id: lbl_time_colon, text: ":", align: TOP_LEFT, x: 181, y: -6, styles: [style_police_horloge, style_horloge_text_soft] }
              - !include { file: ui_components/clock_roller.yaml, vars: { d: m10, x: 222 } }
              - !include { file: ui_components/clock_roller.yaml, vars: { d: m1, x: 297 } }
              - label: { id: lbl_date, text: "", align: TOP_MID, y: 135, styles: [style_police_date, style_horloge_text_soft] }

        # Zone tactile invisible par-dessus l'horloge/date. Deux gestes sur la
        # même tuile, dans l'ordre qui va de soi quand on regarde une horloge :
        #   - tap court  -> réglages du RÉVEIL (alarm_popup.yaml)
        #   - appui long -> CALENDRIER mensuel (inchangé depuis juillet)
        # Le tap court ne faisait rien jusqu'au 05/08/2026 : aucun geste existant
        # n'est repris à un autre usage.
        - button:
            id: btn_clock_calendar_zone
            align: TOP_MID
            x: 0
            y: 20
            width: 401
            height: 210
            styles: style_invisible
            on_short_click:
              - script.execute: tab5_alarm_open
            on_long_press:
              - script.execute: tab5_calendar_open

        # --- Top Left: Status Icons (Small) ---
        # TV = icon_card_pc (épaule carte J0, moniteur) — pas d'icône TV ici
        - label: { id: icon_pc, text: "\U000F0379", align: TOP_LEFT, x: 10, y: 10, text_font: mdi_font_26, styles: style_text_dim }
        - label: { id: icon_phone, text: "\U000F011E", align: TOP_LEFT, x: 45, y: 10, text_font: mdi_font_26, styles: style_text_dim }
        - label: { id: icon_wifi, text: "\U000F05A9", align: TOP_LEFT, x: 80, y: 10, text_font: mdi_font_26, styles: style_text_dim }
        # Pastille réveil : cloche verte = armé avec une sonnerie calculée,
        # ambre = armé mais aucun jour retenu (piège du mode « jours travaillés »
        # pendant une semaine de congés), barrée et éteinte = réveil coupé.
        # Repeinte par alarm_render_status_icon() depuis tab5_alarm_sync_ui.
        - label: { id: icon_alarm_status, text: "\U000F0023", align: TOP_LEFT, x: 115, y: 10, text_font: mdi_font_26, styles: style_text_inactive }
        # Production solaire (04/10/2026) : % de la puissance crête, poussé par le blueprint
        # (clé « solaire » de tab5_maj_emplacements, section « Énergie »). Cachée tant
        # qu'aucune valeur n'est reçue, ou sans solaire ; glyphe et couleur posés par
        # solaire_peindre() (tab5_zones.cpp). Ordre et pas de 35 px : BandeauIcone.
        - label: { id: icon_solaire, text: "\U000F0D9B", align: TOP_LEFT, x: 150, y: 10, text_font: mdi_font_26, styles: style_text_inactive, hidden: true }
        # Batterie de la tablette (04/10/2026), en dernier comme sur un téléphone : la
        # montrer ou la cacher (interrupteur « Tab5 Batterie montée », tab5-ha-controls.yaml)
        # ne déplace aucune autre icône. Cachée jusqu'au premier tab5_zones_apply ;
        # glyphe et couleur posés par batterie_peindre() (tab5_zones.cpp) : une prise
        # quand la batterie n'est pas détectée (05/10/2026). Ordre et pas
        # de 35 px : BandeauIcone (tab5_custom.h).
        - label: { id: icon_batterie, text: "\U000F0091", align: TOP_LEFT, x: 185, y: 10, text_font: mdi_font_26, styles: style_text_inactive, hidden: true }

        # --- Top Right Buttons (même habillage verre que Domo/Discu) ---
        # Icône seule (05/10/2026). x 855 / 995 / 1135 : bord droit à 1260 comme le
        # bandeau central. Chaque bouton a un tap et un appui long (06/10/2026, demande
        # d'Axel) ; une mini icône (mdi_font_26, le jeu du bandeau d'état en haut à gauche)
        # en haut à droite de la tuile dit ce qu'ouvre l'appui long, quand il ouvre quelque
        # chose. Les trois restent à leur place : sans TV, la manette ouvre toujours l'Arcade.
        # Appuis longs au choix (07/10/2026, section « Boutons du haut » du blueprint, clé
        # appuis) : bouton_haut_ecran() (tab5_zones.cpp) donne l'écran, 0 = rien, et
        # tab5_ecran_ouvrir (tab5-ha-controls.yaml), la routine du select « Aller à
        # l'écran », l'ouvre. « auto » : Énergie, console, télécommande TV, comme avant.
        # Glyphe et visibilité des mini icônes : boutons_haut_apply_ui().
        # pad_all: 0 : la mini icône se pose au pixel près (le thème ajoutait ~21 px de
        # marge intérieure), l'icône centrale ne bouge pas.
        - button:
            id: btn_control_ha
            align: TOP_LEFT
            x: 855
            y: 20
            width: 125
            height: 90
            radius: 18
            pad_all: 0
            styles: style_clim_btn_page
            on_short_click:
              # Mode HA (ADR-0023) : les cartes de la pièce de la page courante (ou de la
              # plus proche qui a des appareils), fondu croisé avec la météo, titre de la
              # pièce dans la carte centrale, bouton en couleur d'accent. Masqué sans
              # aucun appareil. Tout est dans tuiles_mode_ha() (tab5_tuiles.cpp).
              - lambda: 'tuiles_mode_ha(!g_central_ctx.ha_mode);'
            on_long_press:
              # « auto » : popup Énergie (ADR-0028), quand HA pousse la production solaire
              # (puissance crête choisie dans le blueprint).
              - lambda: |-
                  const int e = bouton_haut_ecran(BOUTON_MAISON);
                  if (e != 0) id(tab5_ecran_ouvrir).execute(e);
            widgets:
              - label: { id: icon_ha, text: "\U000F07D0", align: CENTER, text_font: mdi_font_70 }
              # Glyphe et visibilité : boutons_haut_apply_ui() (tab5_zones.cpp).
              - label: { id: icon_mini_ha, text: "\U000F0D9B", align: TOP_RIGHT, x: -8, y: 6, text_font: mdi_font_26, styles: style_text_dim, hidden: true }

        # Engrenage : tap = Réglages de la tablette (tab5-reglages.yaml), appui long =
        # console système en « auto » (avant le 06/10/2026, le flocon l'ouvrait d'un tap),
        # sans mini icône en « auto ».
        - button:
            id: btn_control_console
            align: TOP_LEFT
            x: 995
            y: 20
            width: 125
            height: 90
            radius: 18
            pad_all: 0
            styles: style_clim_btn_page
            on_short_click:
              - script.execute: tab5_reglages_ouvrir
            on_long_press:
              # La console : script tab5_console_ouvrir (tab5-scripts.yaml), le même que
              # celui du select « Aller à l'écran ».
              - lambda: |-
                  const int e = bouton_haut_ecran(BOUTON_ENGRENAGE);
                  if (e != 0) id(tab5_ecran_ouvrir).execute(e);
            widgets:
              - label: { text: "\U000F0493", align: CENTER, text_font: mdi_font_70 }
              # Glyphe et visibilité : boutons_haut_apply_ui() (tab5_zones.cpp).
              - label: { id: icon_mini_sys, text: "\U000F018D", align: TOP_RIGHT, x: -8, y: 6, text_font: mdi_font_26, styles: style_text_dim, hidden: true }

        # Manette : tap = Arcade (comme la seconde température), appui long = télécommande
        # TV quand une TV est choisie dans le blueprint (zone TV) : la mini icône de l'écran
        # le signale. Avant le 06/10/2026, ce bouton était la télécommande et disparaissait
        # sans TV.
        - button:
            id: btn_control_tv
            align: TOP_LEFT
            x: 1135
            y: 20
            width: 125
            height: 90
            radius: 18
            pad_all: 0
            styles: style_clim_btn_page
            on_short_click:
              - script.execute: tab5_arcade_open
            on_long_press:
              # « auto » : la télécommande, quand une TV est choisie (zone TV).
              - lambda: |-
                  const int e = bouton_haut_ecran(BOUTON_MANETTE);
                  if (e != 0) id(tab5_ecran_ouvrir).execute(e);
            widgets:
              - label: { text: "\U000F0297", align: CENTER, text_font: mdi_font_70 }
              # Glyphe et visibilité : boutons_haut_apply_ui() (tab5_zones.cpp) ; en
              # « auto », celui de la télécommande (en-tête de tv_remote_popup.yaml).
              - label: { id: icon_mini_tv, text: "\U000F07C0", align: TOP_RIGHT, x: -8, y: 6, text_font: mdi_font_26, styles: style_text_dim, hidden: true }

        # ==================== RANGÉE SOUS L'HORLOGE (ADR-0031) ====================
        # Les plantes et jusqu'à trois lignes de capteurs décrites par HA, qui se
        # relaient calées sur la carte centrale (tab5_rangee.cpp).
        - !include ui_components/rangee.yaml

        # Zone tactile invisible par-dessus la rangée (même géométrie que rangee_capteurs) :
        # toucher -> ligne suivante ; appui long sur la ligne des plantes -> popup détails
        # plantes (rien sur une ligne de capteurs : affichage seul). Masquée avec la rangée.
        - button:
            id: btn_rangee
            align: TOP_MID
            x: 0
            y: 244
            width: 401
            height: 70
            styles: style_invisible
            on_short_click:
              - lambda: 'rangee_toucher();'
            on_long_press:
              - lambda: |-
                  if (rangee_plantes_affichees()) animate_popup_open(id(pots_detail_popup));

        # Pastilles de la rangée : une par ligne, sous elle (entre ses icônes, encre jusqu'à
        # y 308, et la carte centrale, y 333), comme celles de la carte centrale ;
        # masquées sous deux lignes (tab5_rangee.cpp, pastilles()).
        - obj:
            id: rangee_pastilles
            align: TOP_MID
            x: 0
            y: 319
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            styles: style_transparent
            hidden: true
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 6
            widgets:
              - obj: { id: rangee_pastille_0, width: 30, height: 4, radius: 2, styles: style_bg_dim, bg_opa: 100%, border_width: 0 }
              - obj: { id: rangee_pastille_1, width: 16, height: 4, radius: 2, styles: style_bg_dim, bg_opa: 40%, border_width: 0 }
              - obj: { id: rangee_pastille_2, width: 16, height: 4, radius: 2, styles: style_bg_dim, bg_opa: 40%, border_width: 0 }

        # ==================== CLIMATE CONTROL (MIDDLE RIGHT) ====================

        - !include ui_components/climate_card.yaml
        # ==================== CENTRAL CARD (Alertes, Pluie, Planning) ====================
        # Appui long sur un panneau de l'accueil (planning, pluie, vigilance, info, alertes HA) :
        # historique des alertes (popup « Alertes », lot 4 du plan des alertes, 06/10/2026).
        - obj:
            id: central_card
            x: 20
            y: 333
            width: 1240
            height: 84
            styles: style_bandeau_page
            scrollbar_mode: "OFF"
            pad_left: 20
            pad_right: 20
            widgets:
              - obj:
                  id: alert_container
                  align: CENTER
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: style_transparent
                  scrollbar_mode: "OFF"  # le texte déborde en glissant (transition_widgets)
                  hidden: true
                  widgets:
                    - obj:
                        align: CENTER
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        styles: style_transparent
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: CENTER
                          flex_align_cross: CENTER
                          pad_column: 15
                        widgets:
                          - label: { id: alerte_slot_0, text: "", text_font: mdi_font_alert, hidden: true }
                          - label: { id: alerte_slot_1, text: "", text_font: mdi_font_alert, hidden: true }
                          - label: { id: alerte_slot_2, text: "", text_font: mdi_font_alert, hidden: true }
                          - label: { id: alerte_slot_3, text: "", text_font: mdi_font_alert, hidden: true }
                    - button:
                        id: btn_alerts_mf_tap
                        align: CENTER
                        width: ${central_w}
                        height: 80
                        styles: style_invisible
                        on_short_click:
                          - script.execute: tab5_central_panel_next
                        on_long_press:
                          - script.execute: tab5_alertes_ouvrir

              # Pluie Wrapper
              - obj:
                  id: rain_wrapper
                  align: CENTER
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: style_transparent
                  scrollbar_mode: "OFF"  # le texte déborde en glissant (transition_widgets)
                  hidden: true
                  widgets:
                    - obj:
                        align: CENTER
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        styles: style_transparent
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: CENTER
                          flex_align_cross: CENTER
                          pad_column: 15
                        widgets:
                          - label: { id: icon_rain_predict, text: "\U000F0597", text_font: mdi_font_alert, styles: style_bandeau_text_temp_min }
                          - obj:
                              id: rain_bar_container
                              width: SIZE_CONTENT
                              height: 50
                              styles: style_transparent
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_main: CENTER
                                flex_align_cross: END
                              widgets:
                                - !include { file: ui_components/rain_bar.yaml, vars: { n: 0, w: 25 } }
                                - !include { file: ui_components/rain_bar.yaml, vars: { n: 1, w: 25 } }
                                - !include { file: ui_components/rain_bar.yaml, vars: { n: 2, w: 25 } }
                                - !include { file: ui_components/rain_bar.yaml, vars: { n: 3, w: 25 } }
                                - !include { file: ui_components/rain_bar.yaml, vars: { n: 4, w: 25 } }
                                - !include { file: ui_components/rain_bar.yaml, vars: { n: 5, w: 25 } }
                                - !include { file: ui_components/rain_bar.yaml, vars: { n: 6, w: 55 } }
                                - !include { file: ui_components/rain_bar.yaml, vars: { n: 7, w: 55 } }
                                - !include { file: ui_components/rain_bar.yaml, vars: { n: 8, w: 55 } }
                          - obj:
                              width: SIZE_CONTENT
                              height: 100%
                              styles: style_transparent
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_main: CENTER
                                flex_align_cross: END
                                pad_column: 6
                              widgets:
                                - label: { id: lbl_proc_pluie, text: "Synchronisation...", styles: [style_police_date, style_bandeau_text_soft], pad_bottom: 15 }
                                - label: { id: lbl_pluie_val, text: "", styles: [style_police_date, style_bandeau_text_rain_value], pad_bottom: 10 }
                                - label: { id: lbl_pluie_unit, text: "", styles: [style_police_date, style_bandeau_text_soft], pad_bottom: 15 }
                    - button:
                        id: btn_rain_tap
                        align: CENTER
                        width: ${central_w}
                        height: 80
                        styles: style_invisible
                        on_short_click:
                          - script.execute: tab5_central_panel_next
                        on_long_press:
                          - script.execute: tab5_alertes_ouvrir

              # Réponse vocale IA (remplace le rotateur 8s le temps de l'affichage)
              - obj:
                  id: vocal_wrapper
                  align: CENTER
                  width: SIZE_CONTENT
                  height: 100%
                  styles: style_transparent
                  hidden: true
                  widgets:
                    - label:
                        id: lbl_vocal_text
                        align: CENTER
                        y: 0
                        width: ${central_w}
                        text: ""
                        styles: style_police_date

              # Planning Wrapper
              - obj:
                  id: planning_wrapper
                  align: CENTER
                  width: SIZE_CONTENT
                  height: 100%
                  styles: style_transparent
                  scrollbar_mode: "OFF"  # le texte déborde en glissant (transition_widgets)
                  widgets:
                    - label: { id: lbl_planning_text, text: "", align: CENTER, y: 0, styles: [style_police_date, style_bandeau_text_soft] }
                    - button:
                        id: btn_planning_tap
                        align: CENTER
                        width: ${central_w}
                        height: 80
                        styles: style_invisible
                        on_short_click:
                          - script.execute: tab5_central_panel_next
                        on_long_press:
                          - script.execute: tab5_alertes_ouvrir

              # Titre de page previsions (pages horaires / journalieres, masque sur accueil),
              # rempli par update_central_forecast_page_ui() (tab5_central.cpp) : une ligne,
              # la plage "Du mercredi 5 aout au dimanche 9 aout", centree, dans la police de
              # la date (05/10/2026 : plus de chapeau « Previsions journalieres · 2/3 »).
              # Mode pieces de HA : chapeau « Piece n/N » (roboto_22) + nom de la piece, a
              # y -26 / +13 : 26 px + 53 px (ligne de Roboto 45) dans les 82 px de la carte.
              # [AI-WARNING] Ce panneau doit rester structurellement IDENTIQUE a ses freres de
              # central_card (planning / pluie / alertes / info) : wrapper SIZE_CONTENT + bouton
              # invisible ${central_w}x80 pose en dernier. Le bouton n'est pas decoratif — c'est lui qui
              # recoit l'appui, et cette structure est celle qui laisse le swipe paginer (verifie :
              # sur l'accueil, ou le panneau planning est actif, la pagination marche). Une version
              # 31/07/2026 sans bouton, avec un wrapper a largeur fixe, faisait deriver le contenu
              # sous le doigt au lieu de paginer sur les pages previsions. Ne pas "simplifier".
              - obj:
                  id: page_title_wrapper
                  align: CENTER
                  width: SIZE_CONTENT
                  height: 100%
                  styles: style_transparent
                  hidden: true
                  widgets:
                    - label: { id: lbl_page_title_sub, text: "", align: CENTER, y: -26, styles: style_bandeau_text_dim }
                    - label: { id: lbl_page_title, text: "", align: CENTER, y: 0, styles: [style_police_date, style_bandeau_text_soft] }
                    - button:
                        id: btn_page_title_tap
                        align: CENTER
                        width: ${central_w}
                        height: 80
                        styles: style_invisible
                        # Mode HA : un tap sur le titre de la pièce ouvre le popup Maison
                        # (ADR-0037). Pages de prévisions : rien, comme avant.
                        on_short_click:
                          - if:
                              condition:
                                lambda: 'return maison_titre_appui_valide();'
                              then:
                                - script.execute: tab5_maison_ouvrir

              # Info Wrapper (résumé test — panneau 3, tap météo = dismiss définitif)
              - obj:
                  id: info_wrapper
                  align: CENTER
                  width: SIZE_CONTENT
                  height: 100%
                  styles: style_transparent
                  scrollbar_mode: "OFF"  # le texte déborde en glissant (transition_widgets)
                  hidden: true
                  widgets:
                    - label: { id: lbl_info_text, text: "", align: CENTER, styles: [style_police_date, style_bandeau_text_soft] }
                    - button:
                        id: btn_info_tap
                        align: CENTER
                        width: ${central_w}
                        height: 80
                        styles: style_invisible
                        on_short_click:
                          - script.execute: tab5_dismiss_info_tap
                        on_long_press:
                          - script.execute: tab5_alertes_ouvrir

              # Alertes HA individuelles (panneaux 4-7, tap = lu définitif + ligne suivante)
              - !include { file: ui_components/ha_alert_panel.yaml, vars: { n: 0 } }

              - !include { file: ui_components/ha_alert_panel.yaml, vars: { n: 1 } }

              - !include { file: ui_components/ha_alert_panel.yaml, vars: { n: 2 } }

              - !include { file: ui_components/ha_alert_panel.yaml, vars: { n: 3 } }

        # ==================== PAGINATION BARS ====================
        # Zone de pagination (points de navigation des pages forecast).
        - obj:
            id: pagination_container
            x: 480
            y: 414
            width: 310
            height: 30
            styles: style_transparent
            scrollbar_mode: "OFF"
            clickable: true
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 8
            widgets:
              - obj: { id: pbar_0, width: 16, height: 4, radius: 2, styles: style_bg_dim, bg_opa: 40%, border_width: 0 }
              - obj: { id: pbar_1, width: 16, height: 4, radius: 2, styles: style_bg_dim, bg_opa: 40%, border_width: 0 }
              - obj: { id: pbar_2, width: 30, height: 4, radius: 2, styles: style_bg_soft, bg_opa: 100%, border_width: 0 }
              - obj: { id: pbar_3, width: 16, height: 4, radius: 2, styles: style_bg_dim, bg_opa: 40%, border_width: 0 }
              - obj: { id: pbar_4, width: 16, height: 4, radius: 2, styles: style_bg_dim, bg_opa: 40%, border_width: 0 }

        # ==================== BOTTOM CARDS (FORECAST) ====================

        # --- °CK 1: J0 to J4 ---

        - !include ui_components/forecast_daily.yaml
        - !include ui_components/forecast_hourly.yaml
        - !include ui_components/switches_card.yaml
        # Liste de la tuile − / + (ADR-0033) : au-dessus des cartes, sous les popups.
        - !include ui_components/reglables_liste.yaml
        # Roue d'actions rapides (ADR-0036) : au-dessus des cartes, sous les popups (« ⋯ »).
        - !include ui_components/roue_actions.yaml
        - !include ui_components/console_sys.yaml
        - !include ui_components/climate_popup.yaml
        - !include ui_components/light_popup.yaml
        - !include ui_components/volet_popup.yaml
        - !include ui_components/appareil_popup.yaml
        - !include ui_components/tv_remote_popup.yaml
        - !include ui_components/pots_popup.yaml
        - !include ui_components/energie_popup.yaml
        - !include ui_components/reglages_popup.yaml
        - !include ui_components/historique_popup.yaml
        - !include ui_components/alertes_popup.yaml
        # Popup Maison (ADR-0037) : passe derrière un popup ouvert depuis une de ses lignes.
        - !include ui_components/maison_popup.yaml
        - !include ui_components/calendar_popup.yaml
        - !include ui_components/assistant_popup.yaml
        - !include ui_components/alarm_popup.yaml
        # EN DERNIER, volontairement : l'ordre de déclaration est l'ordre de
        # dessin LVGL, et l'écran de sonnerie doit couvrir toutes les fenêtres
        # ci-dessus. `lv_obj_move_to_index(…, -1)` le confirme à chaque affichage,
        # mais partir déjà au bon rang évite un cadre de clignotement.
        - !include ui_components/alarm_ring_overlay.yaml
        # ═══ Les 8 jeux + le sélecteur arcade vivent désormais dans leurs
        # propres pages LVGL (page_arcade, page_marble, … page_pinball).
        # Voir ci-dessous. ═══

    # ═══════════════════════════════════════════════════════════════
    # PAGES GAMING — chacune est un écran LVGL autonome (skip: true
    # empêche le swipe gesture de naviguer vers/depuis ces pages).
    # Navigation : lvgl.page.show (YAML) ou lv_screen_load (C++).
    # ═══════════════════════════════════════════════════════════════

    # ─── Sélecteur arcade (grille 8 consoles) ───
    - id: page_arcade
      skip: true
      scrollbar_mode: "OFF"
      widgets:
        - !include ui_components/game_selector.yaml

    # ─── Fil d'Or (marble) ───
    - id: page_marble
      skip: true
      scrollbar_mode: "OFF"
      widgets:
        - !include ui_components/marble_game.yaml

    # ─── Arcanoïde (arkanoid) ───
    - id: page_arkanoid
      skip: true
      scrollbar_mode: "OFF"
      widgets:
        - !include ui_components/arkanoid_game.yaml

    # ─── Neon Apron (pinball — PORTRAIT 720×1280) ───
    - id: page_pinball
      skip: true
      scrollbar_mode: "OFF"
      widgets:
        - !include ui_components/pinball_game.yaml

    # ─── Coureur d'Or (lode) ───
    - id: page_lode
      skip: true
      scrollbar_mode: "OFF"
      widgets:
        - !include ui_components/lode_game.yaml

    # ─── Go Tab ───
    - id: page_go
      skip: true
      scrollbar_mode: "OFF"
      widgets:
        - !include ui_components/go_game.yaml

    # ─── Trial Poursuite (trivia) ───
    - id: page_trivia
      skip: true
      scrollbar_mode: "OFF"
      widgets:
        - !include ui_components/trivia_game.yaml

    # ─── Roi Noir (chess) ───
    - id: page_chess
      skip: true
      scrollbar_mode: "OFF"
      widgets:
        - !include ui_components/chess_game.yaml

    # ─── Dames Tab (draughts) ───
    - id: page_draughts
      skip: true
      scrollbar_mode: "OFF"
      widgets:
        - !include ui_components/draughts_game.yaml
