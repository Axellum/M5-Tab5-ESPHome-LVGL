# ============================================================================
# [AI-CONTEXT]
# @file tab5-ha-controls.yaml
# @role Entités ESPHome supplémentaires exposées à Home Assistant pour observer
#       et piloter l'écran depuis un dashboard HA (« Console Tab5 »), sans être
#       devant la dalle. Aussi des réglages de l'écran gardés en mémoire (langue,
#       interrupteurs « Tab5 Batterie montée », « Tab5 Appareils sur la météo » et
#       « Tab5 Rallumer l'écran à Okay Nabu », lu par tab5-assist.yaml),
#       qui passent chacun par une fonction C++ nommée (règle 2), et l'extinction
#       automatique de l'écran (select « Tab5 Extinction auto de l'écran » + son
#       interval de 10 s : réveil, assistant vocal, jeu et OTA l'empêchent).
# @architecture_constraint Ce fichier ne construit AUCUN widget LVGL. Il se
#       contente (a) de lire l'état de l'UI et (b) de rejouer exactement les
#       mêmes chemins d'ouverture que les boutons de l'écran — pour que l'état
#       soit strictement identique qu'on passe par le doigt ou par HA. La liste
#       des fenêtres vit dans ModalRegistry (remplie par
#       `tab5_modal_registry_init`, tab5-scripts.yaml) : une nouvelle modale
#       s'y enregistre UNE fois, le text_sensor la nomme aussitôt. Pour l'ouvrir
#       depuis HA, ajouter en plus son option au `select` ci-dessous avec le
#       MÊME libellé (c'est par ce nom que `ModalRegistry::find()` la retrouve —
#       tools/check_tab5_registry.py le vérifie), et un `case` si son ouverture
#       passe par un script.
# @ai_instruction Le volume ne s'écrit JAMAIS directement ici : tout passe par
#       `script.tab5_volume_apply` (tab5-scripts.yaml), point d'entrée unique
#       partagé avec les deux sliders de l'écran.
# ============================================================================

number:
  # Volume système exposé à HA. Le getter lit `system_volume` (source de vérité
  # de l'écran) plutôt que `speaker_player->volume` : quand le son est coupé, le
  # haut-parleur est à 0 mais le volume mémorisé — celui que le démute va
  # restaurer, et celui que montrent les sliders — ne l'est pas.
  - platform: template
    id: tab5_volume_pct
    name: "Volume"
    icon: mdi:volume-high
    unit_of_measurement: "%"
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    # Publié par tab5_volume_apply (tab5-scripts.yaml), point d'entrée unique de
    # tous les changements, rattrapage de 5 s compris : le relire chaque minute
    # renvoyait la même valeur à HA (1 440 messages/jour ; audit 26/09, lot 3).
    update_interval: never
    lambda: 'return id(system_volume) * 100.0f;'
    set_action:
      - script.execute:
          id: tab5_volume_apply
          vol: !lambda 'return x / 100.0f;'
          push_device: true

text_sensor:
  # Écran réellement affiché. Utile à distance : savoir si la tablette est restée
  # sur un popup, dans un jeu ou sur l'accueil.
  # Publié SEULEMENT quand il change (audit du 25/09/2026, lot 3 bis) : avant, la
  # même valeur partait toutes les 5 s, et le panneau du rotateur central (planning,
  # pluie, vigilance, info, alertes, 8 s chacun) en faisait ≈ 10 700 lignes par jour
  # en base. L'accueil est donc « Accueil » tout court. HA reçoit quand même l'état
  # courant à chaque reconnexion (ESPHome le renvoie à l'abonnement).
  - platform: template
    id: tab5_screen_name
    name: "Écran courant"
    icon: mdi:monitor-dashboard
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      static std::string last;
      std::string name;
      // D'ABORD la page LVGL : les popups sont des enfants de `page_main` et le
      // sélecteur Arcade est le widget RACINE de `page_arcade` — il n'a donc
      // jamais le flag HIDDEN. Les tester sans regarder la page affichée
      // annoncerait « Arcade » en permanence, et un popup laissé ouvert
      // masquerait un jeu en cours.
      if (!id(page_main)->is_showing()) {
        const char* game = GameRegistry::open_name();
        name = (game != nullptr) ? std::string("Jeu · ") + game : std::string("Arcade");
      } else {
        // Ordre = priorité d'affichage : les popups couvrent le dashboard, on
        // nomme donc le premier visible. C'est l'ordre d'enregistrement de
        // tab5_modal_registry_init (tab5-scripts.yaml), sonnerie du réveil en
        // tête : c'est le seul calque qui couvre aussi les fenêtres modales.
        id(tab5_modal_registry_init).execute();
        const char* modal = ModalRegistry::visible_name();
        name = (modal != nullptr) ? std::string(modal) : std::string("Accueil");
      }
      if (name == last) return {};
      last = name;
      return name;

select:
  # Commande d'ouverture à distance, PAS un miroir de l'état (c'est le rôle du
  # text_sensor ci-dessus) : le select retombe sur « — » aussitôt l'action faite.
  # Republier « — » redéclenche bien on_value, mais l'index 0 ne fait rien —
  # la récursion s'arrête là.
  # Volontairement absents : « Lumières » (le popup dépend de
  # `current_light_slot`, positionné par la carte qui l'ouvre — l'ouvrir à
  # froid afficherait les réglages de la dernière lampe touchée) et « Arcade »
  # (lancer un jeu à distance sur une tablette murale n'a pas d'usage).
  - platform: template
    id: tab5_goto_screen
    name: "Aller à l'écran"
    icon: mdi:gesture-tap-button
    entity_category: config
    optimistic: true
    options:
      - "—"
      - "Accueil"
      - "Assistant vocal"
      - "Calendrier"
      - "Réveil"
      - "Climatisation"
      - "Plantes"
      - "Télécommande TV"
      - "Console système"
      # ADR-0028 : à la fin, les index des autres options ne bougent pas.
      - "Énergie"
      # Réglages de la tablette (06/10/2026), à la fin pour la même raison.
      - "Réglages"
    on_value:
      # Les popups sont des enfants de `page_main` : si la tablette est sur le
      # sélecteur Arcade ou dans une partie, en ouvrir un jouerait hors écran
      # pendant que l'utilisateur regarde toujours le jeu — et « Accueil » ne
      # ramènerait rien. On revient donc d'abord sur le dashboard, en fermant le
      # jeu par la liste unique `tab5_games_close_all` (jamais recopiée : c'est
      # elle qui restaure aussi la rotation paysage après « Neon Apron »).
      # Conditionné : rejouer `page.show` alors qu'on y est déjà provoquerait un
      # rechargement d'écran visible pour rien.
      - if:
          condition:
            and:
              # `return` dans une lambda ne sort que de la lambda, pas de la
              # séquence : le filtre « — » doit être dans la condition.
              - lambda: 'return i != 0;'
              - not:
                  lvgl.page.is_showing: page_main
          then:
            - script.execute: tab5_games_close_all
            - lvgl.page.show: page_main
      - lambda: |-
          if (i == 0) return;  // « — » : position de repos, aucune action

          // [26/08/2026] SONNERIE EN COURS : refuser d'ouvrir une fenêtre.
          // `alarm_ring_layer` est un calque plein cadre que alarm_clock.cpp
          // (alarm_ring_show) remonte au premier plan à chaque affichage. Or le
          // premier plan que pose `animate_popup_open(target)` ci-dessous s'applique
          // SANS CONDITION : un popup ouvert depuis HA pendant que le réveil
          // sonne passerait donc PAR-DESSUS l'écran de sonnerie et masquerait
          // son bouton d'arrêt. C'est le pendant exact de la protection déjà en
          // place contre la fermeture automatique (alarm_ring_layer est un LAYER
          // du ModalRegistry : nommé, jamais refermé par close_all()) : tant que
          // ça sonne, ce calque ne doit être ni refermé, ni recouvert.
          // « Accueil » (i == 1) reste AUTORISÉ : il ne fait que fermer les
          // popups et revenir sur page_main, ce qui RÉVÈLE la sonnerie au lieu
          // de la cacher — utile si une partie était ouverte quand elle a
          // démarré. ESP_LOGI et pas ESP_LOGD : un refus muet serait
          // indiscernable d'une commande perdue, et le projet tourne à INFO.
          if (i >= 2 && id(alarm_ringing)) {
            ESP_LOGI("TAB5", "Ouverture d'ecran refusee depuis HA : le reveil sonne");
            id(tab5_goto_screen).publish_state("—");
            return;
          }

          // Zone absente de cette maison (lot 5, tab5-zones.yaml) : sa fenêtre n'aurait
          // rien à montrer ni à piloter. Les options restent : HA lit la liste fixe.
          if ((i == 5 && zone_absente(Zone::CLIM)) || (i == 6 && zones_pots_presents() == 0) ||
              (i == 7 && zone_absente(Zone::TV))) {
            ESP_LOGI("TAB5", "Aller a l'ecran : '%s' absent de cette maison", x.c_str());
            id(tab5_goto_screen).publish_state("—");
            return;
          }

          // Cible déjà affichée : ne rien faire, sinon le fermer-puis-rouvrir
          // ci-dessous se verrait comme un clignotement. La cible est retrouvée
          // PAR SON LIBELLÉ dans ModalRegistry (x = option choisie) : l'option
          // du select et le nom enregistré dans tab5_modal_registry_init doivent
          // être identiques — tools/check_tab5_registry.py le vérifie. Un écart
          // serait sinon un no-op muet sur les cas 5-7 (clim, plantes, TV) : on
          // le journalise à WARN, le projet tourne à INFO.
          id(tab5_modal_registry_init).execute();
          lv_obj_t* target = ModalRegistry::find(x.c_str());
          if (i >= 2 && target == nullptr) {
            ESP_LOGW("TAB5", "Aller a l'ecran : option '%s' sans fenetre enregistree", x.c_str());
          }
          if (target != nullptr && !lv_obj_has_flag(target, LV_OBJ_FLAG_HIDDEN)) {
            // Re-demander l'écran déjà affiché sert à prolonger son affichage.
            ui_mark_activity();
            id(tab5_goto_screen).publish_state("—");
            return;
          }

          // Fermeture de tout ce qui est ouvert — même chemin que le retour
          // automatique à l'inactivité (tab5-scripts.yaml), pour laisser
          // exactement le même état derrière soi.
          ModalRegistry::close_all();
          id(assist_popup_open) = false;
          // « Accueil » quitte aussi le mode HA (ADR-0023) : la météo de la page revient.
          if (i == 1) tuiles_mode_ha(false);

          switch (i) {
            case 2:  // L'assistant a son propre script : il arme aussi l'état
                     // vocal et la synchro des réglages du panneau gauche.
              id(tab5_assist_open).execute();
              break;
            case 3:  // Le calendrier a besoin de son mois courant + du rendu.
              id(tab5_calendar_open).execute();
              break;
            case 4:  // Le réveil resynchronise g_alarm_cfg et recalcule la
                     // prochaine sonnerie avant de s'afficher, sinon la carte
                     // « Prochaine sonnerie » montrerait un état périmé.
              id(tab5_alarm_open).execute();
              break;
            case 5:  // La clim du blueprint : le popup a pu montrer celle d'une
                     // tuile (ADR-0027) et être refermé par close_all() ci-dessus.
              clim_afficher_blueprint();
              if (target != nullptr) animate_popup_open(target);
              break;
            case 8:  // La console est un layer plein cadre : pas d'animation
                     // d'ouverture, comme son bouton (tab5-lvgl.yaml).
              lv_obj_remove_flag(id(layer_console_sys), LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_to_index(id(layer_console_sys), -1);
              // Comme l'appui long : batterie tout de suite, charge du processeur
              // repartie de zéro (sinon l'ancienne valeur jusqu'au tick 2 s).
              update_console_batterie_ui(id(lbl_sys_batterie_icone), id(lbl_sys_batterie_val));
              update_console_cpu_ui(id(lbl_sys_cpu_val), true);
              break;
            case 9:  // Énergie (ADR-0028) : son script pose les widgets à la première
                     // ouverture et demande ses données à HA.
              id(tab5_energie_ouvrir).execute();
              break;
            case 10:  // Réglages : son script pose les widgets et peint avant d'ouvrir.
              id(tab5_reglages_ouvrir).execute();
              break;
            default:
              if (target != nullptr) {
                animate_popup_open(target);
              }
              break;
          }
          // OUVERTURE PROGRAMMÉE : remettre le compteur d'inactivité à zéro est
          // OBLIGATOIRE, pas un confort. Le retour automatique de
          // `tab5-scripts.yaml` tourne toutes les SECONDES et referme tout popup
          // dès que `ui_idle_ms() >= 45 s` — or personne n'a touché la dalle, le
          // compteur est donc déjà très au-delà. Sans cette ligne, le popup
          // ouvert depuis HA est refermé au tick suivant, en moins d'une
          // seconde : la commande semble ne rien faire. Même piège que celui
          // déjà traité pour le pipeline vocal (`tab5_vocal_arm_stop`), et c'est
          // exactement l'usage documenté de `ui_mark_activity()` dans
          // `tab5_custom.h` : « ouverture programmée d'un popup ».
          // « Accueil » (i == 1) en est exclu : il ne laisse rien d'ouvert, et
          // geler le compteur retarderait pour rien le retour auto de la page
          // météo (25 s).
          if (i >= 2) ui_mark_activity();

          // Le geste est consommé : on repasse en position de repos pour que la
          // même destination puisse être redemandée juste après.
          id(tab5_goto_screen).publish_state("—");

  # Langue de l'écran (lot 4 de l'audit « ouverture », 27/09/2026). Les options sont
  # les noms natifs de Tab5/lang/*.yaml, DANS L'ORDRE de leurs `_index` : la tablette
  # mémorise l'INDEX choisi (restore_value), donc une nouvelle langue s'ajoute
  # TOUJOURS à la fin (tests/test_i18n.py vérifie l'ordre). Seul l'écran change :
  # noms d'entités, options de select et codes vus par HA restent en français.
  # Au démarrage, la valeur restaurée règle la langue AVANT la traduction des textes
  # du YAML (on_boot -100). Un changement en cours de route redémarre la tablette :
  # les textes posés par le YAML ne se traduisent qu'au démarrage.
  - platform: template
    id: tab5_langue
    name: "Langue"
    icon: mdi:translate
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Français"
      - "English"
      - "Deutsch"
      - "Nederlands"
      - "Español"
      - "Italiano"
      - "Türkçe"
    # Défaut d'un premier démarrage : `tab5_langue:` dans Tab5/user_entities.yaml
    # (nom natif, par ex. « English »), sinon le français.
    initial_option: "${ tab5_langue | default('Français') }"
    on_value:
      - if:
          condition:
            lambda: 'return id(boot_complete) && i != i18n_language();'
          then:
            - logger.log:
                format: "Langue de l'ecran : %s -> redemarrage"
                args: ['x.c_str()']
            - delay: 1s
            - lambda: 'App.safe_reboot();'
          else:
            - lambda: 'i18n_set_language(i);'

  # Extinction automatique de l'écran (06/10/2026, discussion #278 : « sur batterie ou
  # sur USB, l'écran ne devrait se réveiller que quand on le touche »). Après ce délai
  # sans toucher la dalle, l'écran s'éteint comme quand HA l'éteint (light.turn_off de
  # `backlight`, qui met LVGL en pause) ; le toucher, la tape (« Tab5 Tap-to-Wake »),
  # HA et le réveil le rallument comme avant. « Jamais » par défaut : rien ne change
  # pour qui ne choisit rien. Les options sont lues par HA : jamais traduites. La
  # tablette garde l'INDEX choisi (restore_value) : une option nouvelle s'ajoute à la
  # fin, et DELAIS_MIN de l'interval en bas de ce fichier suit le même ordre
  # (tests/test_extinction_auto.py).
  - platform: template
    id: tab5_extinction_auto
    name: "Tab5 Extinction auto de l'écran"
    icon: mdi:monitor-off
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Jamais"
      - "1 min"
      - "2 min"
      - "5 min"
      - "10 min"
      - "30 min"
    initial_option: "Jamais"
    on_value:
      # Popup Réglages (tab5-reglages.yaml) : repeint s'il a déjà été ouvert.
      - script.execute: tab5_reglages_sync_ui

switch:
  # Batterie de la tablette montée (04/10/2026) : montre son icône dans le bandeau
  # d'état, en dernier (niveau, charge et tension : tab5-sensors-diagnostics.yaml).
  # Un réglage : montrer l'icône ou pas. Allumé, l'icône devient une prise quand la
  # tension dit qu'il n'y a pas de batterie (« Tab5 Batterie détectée », 05/10/2026 ;
  # sans batterie, le chargeur dit pourtant « en charge »). Éteint par défaut, gardé en
  # mémoire d'un démarrage à l'autre.
  # Ici avec les autres réglages de l'écran : le rendu hors tablette, qui charge ce
  # fichier mais pas celui des diagnostics, peut ainsi montrer l'icône.
  - platform: template
    id: tab5_batterie_montee
    name: "Tab5 Batterie montée"
    icon: mdi:battery
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - lambda: 'batterie_montee_ui(x);'

  # Appareils des pièces sur les prévisions (05/10/2026, discussion #278 : un
  # utilisateur préfère des cartes météo seules). Éteint, le mode météo ne montre plus
  # les épaules ni le bouton d'action des tuiles, et le titre d'une tuile de volet ne
  # bascule plus son sens ; le mode HA (bouton « HA ») montre toujours les pièces.
  # Allumé par défaut (ADR-0023), gardé en mémoire, appliqué sans redémarrage.
  - platform: template
    id: tab5_appareils_meteo
    name: "Tab5 Appareils sur la météo"
    icon: mdi:lightbulb-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lambda: 'tuiles_appareils_meteo(x);'

  # « Okay Nabu » rallume l'écran éteint (06/10/2026, demande d'Axel avec l'extinction
  # auto, discussion #278). Lu par la branche START_PIPELINE de tab5_wake_word_dispatch
  # (tab5-assist.yaml) : seulement quand le pipeline démarre vraiment (mot de réveil
  # actif, HA joignable), jamais sur « Stop ». Allumé par défaut ; éteint, l'écran reste
  # noir et la réponse n'est que parlée (comme avant), pour qui ne veut le rallumer qu'au
  # toucher : le mot de réveil se déclenche parfois seul (télé, conversation).
  - platform: template
    id: tab5_ecran_okay_nabu
    name: "Tab5 Rallumer l'écran à Okay Nabu"
    icon: mdi:account-voice
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - script.execute: tab5_reglages_sync_ui

button:
  # Recharge le mois courant + M+1 du calendrier (même script que le pré-fetch
  # de boot). À utiliser quand un RDV ajouté dans HA n'apparaît pas encore.
  # `force` : redemande même un mois reçu il y a moins de 30 s (tab5-calendar.yaml).
  - platform: template
    id: tab5_reload_calendar
    name: "Recharger le calendrier"
    icon: mdi:calendar-refresh
    entity_category: config
    on_press:
      - script.execute:
          id: tab5_cal_prefetch
          force: true

interval:
  # Rattrapage du volume changé côté HA directement sur le media_player (slider
  # du dashboard, app mobile, automatisation). ESPHome n'expose aucun trigger
  # `on_volume` sur media_player, donc on compare. Sans ça, `system_volume`
  # resterait sur l'ancienne valeur : les sliders de l'écran afficheraient un %
  # faux et le prochain démute écraserait le réglage venu de HA.
  # `!system_muted` est indispensable : quand le son est coupé, le haut-parleur
  # est à 0 alors que `system_volume` porte la valeur à restaurer — comparer les
  # deux dans cet état effacerait le volume mémorisé.
  # La fenêtre de garde de 2 s l'est tout autant : `media_player.volume_set` est
  # débouncé de 150 ms et, pendant un glissement, ne part qu'une fois le doigt
  # immobile. Le haut-parleur reste donc en retard sur `system_volume` pendant
  # tout le geste — un tick tombant dans cette fenêtre recopierait le niveau
  # périmé par-dessus le réglage en cours et ferait sauter le slider sous le
  # doigt. `volume_push_ts` est réarmé à CHAQUE tick du glissement, la garde
  # couvre donc le geste entier, pas seulement son premier instant.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              return !id(system_muted) &&
                     (millis() - id(volume_push_ts)) > 2000 &&
                     fabsf(id(speaker_player)->volume - id(system_volume)) > 0.01f;
          then:
            - script.execute:
                id: tab5_volume_apply
                vol: !lambda 'return id(speaker_player)->volume;'
                push_device: false

  # Extinction automatique de l'écran (select « Tab5 Extinction auto de l'écran »
  # plus haut). Vérifiée toutes les 10 s : à « 1 min », l'écran s'éteint entre 60 et
  # 70 s après le dernier toucher. L'inactivité compte depuis le plus récent de deux
  # instants : le dernier appui lu par LVGL (ui_idle_ms(), le compteur du retour à
  # l'accueil, aussi remis à zéro par chaque étape du pipeline vocal) et le dernier
  # allumage (ecran_allume_ms, posé par on_turn_on de `backlight`, tab5-hardware.yaml) :
  # LVGL est en pause écran éteint, un rallumage par HA ou par la tape laisserait
  # sinon une inactivité ancienne et l'écran se rééteindrait aussitôt.
  # Jamais pendant :
  #   - le réveil qui sonne (`alarm_ringing`, tab5-alarm.yaml) ;
  #   - l'assistant vocal : pipeline en cours (`va` is_running/is_continuous, comme la
  #     condition `voice_assistant.is_running`), ou réponse parlée pas finie
  #     (`va_stop_armed`, armé à l'écoute, désarmé quand le haut-parleur se tait) ;
  #   - un jeu de l'Arcade ouvert (GameRegistry::any_open() : une partie en pause,
  #     c'est zéro toucher pendant des minutes, comme pour le retour à l'accueil) ;
  #   - une mise à jour du firmware (`ota_en_cours`).
  # Pas avant la fin du démarrage (`boot_complete`).
  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              // Délai de chaque option du select, dans le même ordre (0 = « Jamais »).
              constexpr uint32_t DELAIS_MIN[] = {0, 1, 2, 5, 10, 30};
              constexpr size_t NB_DELAIS = sizeof(DELAIS_MIN) / sizeof(DELAIS_MIN[0]);
              const auto choix = id(tab5_extinction_auto).active_index();
              if (!choix.has_value() || *choix == 0 || *choix >= NB_DELAIS) return false;
              if (!id(boot_complete) || !id(backlight).remote_values.is_on()) return false;
              if (id(alarm_ringing)) return false;
              if (id(va)->is_running() || id(va)->is_continuous() || id(va_stop_armed)) return false;
              if (GameRegistry::any_open()) return false;
              if (id(ota_en_cours)) return false;
              const uint32_t depuis_allumage = millis() - id(ecran_allume_ms);
              const uint32_t inactif = std::min(ui_idle_ms(), depuis_allumage);
              return inactif >= DELAIS_MIN[*choix] * 60000u;
          then:
            # [AI-DEBUG] « Pourquoi l'écran s'est éteint ? » : cette ligne le dit.
            - logger.log:
                level: INFO
