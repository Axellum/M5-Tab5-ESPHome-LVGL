# ============================================================================
# [AI-CONTEXT]
# @file tab5-ha-controls.yaml
# @role Entités ESPHome supplémentaires exposées à Home Assistant pour observer
#       et piloter l'écran depuis un dashboard HA (« Console Tab5 »), sans être
#       devant la dalle.
# @architecture_constraint Ce fichier ne construit AUCUN widget LVGL. Il se
#       contente (a) de lire l'état de l'UI et (b) de rejouer exactement les
#       mêmes chemins d'ouverture que les boutons de l'écran — pour que l'état
#       soit strictement identique qu'on passe par le doigt ou par HA. La liste
#       des fenêtres vit dans ModalRegistry (remplie par
#       `tab5_modal_registry_init`, tab5-scripts.yaml) : une nouvelle modale
#       s'y enregistre UNE fois, le text_sensor la nomme aussitôt. Pour l'ouvrir
#       depuis HA, ajouter en plus son option au `select` ci-dessous avec le
#       MÊME libellé (c'est par ce nom que `ModalRegistry::find()` la retrouve —
#       tools/check_tab5_registry.py le vérifie), et un `case` si son ouverture
#       passe par un script.
# @ai_instruction Le volume ne s'écrit JAMAIS directement ici : tout passe par
#       `script.tab5_volume_apply` (tab5-scripts.yaml), point d'entrée unique
#       partagé avec les deux sliders de l'écran.
# ============================================================================

number:
  # Volume système exposé à HA. Le getter lit `system_volume` (source de vérité
  # de l'écran) plutôt que `speaker_player->volume` : quand le son est coupé, le
  # haut-parleur est à 0 mais le volume mémorisé — celui que le démute va
  # restaurer, et celui que montrent les sliders — ne l'est pas.
  - platform: template
    id: tab5_volume_pct
    name: "Volume"
    icon: mdi:volume-high
    unit_of_measurement: "%"
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    update_interval: 60s
    lambda: 'return id(system_volume) * 100.0f;'
    set_action:
      - script.execute:
          id: tab5_volume_apply
          vol: !lambda 'return x / 100.0f;'
          push_device: true

text_sensor:
  # Écran réellement affiché. Utile à distance : savoir si la tablette est restée
  # sur un popup, ou sur quel panneau du rotateur central elle en est.
  - platform: template
    id: tab5_screen_name
    name: "Écran courant"
    icon: mdi:monitor-dashboard
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      // D'ABORD la page LVGL : les popups sont des enfants de `page_main` et le
      // sélecteur Arcade est le widget RACINE de `page_arcade` — il n'a donc
      // jamais le flag HIDDEN. Les tester sans regarder la page affichée
      // annoncerait « Arcade » en permanence, et un popup laissé ouvert
      // masquerait un jeu en cours.
      if (!id(page_main)->is_showing()) {
        const char* game = GameRegistry::open_name();
        if (game != nullptr) return {std::string("Jeu · ") + game};
        return {std::string("Arcade")};
      }

      // Ordre = priorité d'affichage : les popups couvrent le dashboard, on
      // nomme donc le premier visible. C'est l'ordre d'enregistrement de
      // tab5_modal_registry_init (tab5-scripts.yaml), sonnerie du réveil en
      // tête : c'est le seul calque qui couvre aussi les fenêtres modales.
      id(tab5_modal_registry_init).execute();
      const char* modal = ModalRegistry::visible_name();
      if (modal != nullptr) return {std::string(modal)};
      // Rien par-dessus : on nomme le panneau du rotateur central (8 s).
      // Indices figés par update_central_panel_rotation (tab5_custom.h) :
      // 0 planning, 1 pluie, 2 vigilance Météo-France, 3 info, 4-7 alertes HA.
      const int p = id(current_central_panel);
      if (p == 1) return {std::string("Accueil · Pluie")};
      if (p == 2) return {std::string("Accueil · Vigilance météo")};
      if (p == 3) return {std::string("Accueil · Info")};
      if (p >= 4 && p <= 7) return {std::string("Accueil · Alerte HA")};
      return {std::string("Accueil · Planning")};

select:
  # Commande d'ouverture à distance, PAS un miroir de l'état (c'est le rôle du
  # text_sensor ci-dessus) : le select retombe sur « — » aussitôt l'action faite.
  # Republier « — » redéclenche bien on_value, mais l'index 0 ne fait rien —
  # la récursion s'arrête là.
  # Volontairement absents : « Lumières » (le popup dépend de
  # `current_light_entity`, positionné par la carte qui l'ouvre — l'ouvrir à
  # froid afficherait les réglages de la dernière lampe touchée) et « Arcade »
  # (lancer un jeu à distance sur une tablette murale n'a pas d'usage).
  - platform: template
    id: tab5_goto_screen
    name: "Aller à l'écran"
    icon: mdi:gesture-tap-button
    entity_category: config
    optimistic: true
    options:
      - "—"
      - "Accueil"
      - "Assistant vocal"
      - "Calendrier"
      - "Réveil"
      - "Climatisation"
      - "Plantes"
      - "Télécommande TV"
      - "Console système"
    on_value:
      # Les popups sont des enfants de `page_main` : si la tablette est sur le
      # sélecteur Arcade ou dans une partie, en ouvrir un jouerait hors écran
      # pendant que l'utilisateur regarde toujours le jeu — et « Accueil » ne
      # ramènerait rien. On revient donc d'abord sur le dashboard, en fermant le
      # jeu par la liste unique `tab5_games_close_all` (jamais recopiée : c'est
      # elle qui restaure aussi la rotation paysage après « Neon Apron »).
      # Conditionné : rejouer `page.show` alors qu'on y est déjà provoquerait un
      # rechargement d'écran visible pour rien.
      - if:
          condition:
            and:
              # `return` dans une lambda ne sort que de la lambda, pas de la
              # séquence : le filtre « — » doit être dans la condition.
              - lambda: 'return i != 0;'
              - not:
                  lvgl.page.is_showing: page_main
          then:
            - script.execute: tab5_games_close_all
            - lvgl.page.show: page_main
      - lambda: |-
          if (i == 0) return;  // « — » : position de repos, aucune action

          // [26/08/2026] SONNERIE EN COURS : refuser d'ouvrir une fenêtre.
          // `alarm_ring_layer` est un calque plein cadre que alarm_clock.cpp
          // (alarm_ring_show) remonte au premier plan à chaque affichage. Or le
          // `lv_obj_move_foreground(target)` du switch ci-dessous s'applique
          // SANS CONDITION : un popup ouvert depuis HA pendant que le réveil
          // sonne passerait donc PAR-DESSUS l'écran de sonnerie et masquerait
          // son bouton d'arrêt. C'est le pendant exact de la protection déjà en
          // place contre la fermeture automatique (alarm_ring_layer est un LAYER
          // du ModalRegistry : nommé, jamais refermé par close_all()) : tant que
          // ça sonne, ce calque ne doit être ni refermé, ni recouvert.
          // « Accueil » (i == 1) reste AUTORISÉ : il ne fait que fermer les
          // popups et revenir sur page_main, ce qui RÉVÈLE la sonnerie au lieu
          // de la cacher — utile si une partie était ouverte quand elle a
          // démarré. ESP_LOGI et pas ESP_LOGD : un refus muet serait
          // indiscernable d'une commande perdue, et le projet tourne à INFO.
          if (i >= 2 && id(alarm_ringing)) {
            ESP_LOGI("TAB5", "Ouverture d'ecran refusee depuis HA : le reveil sonne");
            id(tab5_goto_screen).publish_state("—");
            return;
          }

          // Cible déjà affichée : ne rien faire, sinon le fermer-puis-rouvrir
          // ci-dessous se verrait comme un clignotement. La cible est retrouvée
          // PAR SON LIBELLÉ dans ModalRegistry (x = option choisie) : l'option
          // du select et le nom enregistré dans tab5_modal_registry_init doivent
          // être identiques — tools/check_tab5_registry.py le vérifie. Un écart
          // serait sinon un no-op muet sur les cas 5-7 (clim, plantes, TV) : on
          // le journalise à WARN, le projet tourne à INFO.
          id(tab5_modal_registry_init).execute();
          lv_obj_t* target = ModalRegistry::find(x.c_str());
          if (i >= 2 && target == nullptr) {
            ESP_LOGW("TAB5", "Aller a l'ecran : option '%s' sans fenetre enregistree", x.c_str());
          }
          if (target != nullptr && !lv_obj_has_flag(target, LV_OBJ_FLAG_HIDDEN)) {
            // Re-demander l'écran déjà affiché sert à prolonger son affichage.
            ui_mark_activity();
            id(tab5_goto_screen).publish_state("—");
            return;
          }

          // Fermeture de tout ce qui est ouvert — même chemin que le retour
          // automatique à l'inactivité (tab5-scripts.yaml), pour laisser
          // exactement le même état derrière soi.
          ModalRegistry::close_all();
          id(assist_popup_open) = false;

          switch (i) {
            case 2:  // L'assistant a son propre script : il arme aussi l'état
                     // vocal et la synchro des réglages du panneau gauche.
              id(tab5_assist_open).execute();
              break;
            case 3:  // Le calendrier a besoin de son mois courant + du rendu.
              id(tab5_calendar_open).execute();
              break;
            case 4:  // Le réveil resynchronise g_alarm_cfg et recalcule la
                     // prochaine sonnerie avant de s'afficher, sinon la carte
                     // « Prochaine sonnerie » montrerait un état périmé.
              id(tab5_alarm_open).execute();
              break;
            case 8:  // La console est un layer plein cadre : pas d'animation
                     // d'ouverture, comme son bouton (tab5-lvgl.yaml).
              lv_obj_clear_flag(id(layer_console_sys), LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_foreground(id(layer_console_sys));
              break;
            default:
              if (target != nullptr) {
                animate_popup_open(target, nullptr);
                lv_obj_move_foreground(target);
              }
              break;
          }
          // OUVERTURE PROGRAMMÉE : remettre le compteur d'inactivité à zéro est
          // OBLIGATOIRE, pas un confort. Le retour automatique de
          // `tab5-scripts.yaml` tourne toutes les SECONDES et referme tout popup
          // dès que `ui_idle_ms() >= 45 s` — or personne n'a touché la dalle, le
          // compteur est donc déjà très au-delà. Sans cette ligne, le popup
          // ouvert depuis HA est refermé au tick suivant, en moins d'une
          // seconde : la commande semble ne rien faire. Même piège que celui
          // déjà traité pour le pipeline vocal (`tab5_vocal_arm_stop`), et c'est
          // exactement l'usage documenté de `ui_mark_activity()` dans
          // `tab5_custom.h` : « ouverture programmée d'un popup ».
          // « Accueil » (i == 1) en est exclu : il ne laisse rien d'ouvert, et
          // geler le compteur retarderait pour rien le retour auto de la page
          // météo (25 s).
          if (i >= 2) ui_mark_activity();

          // Le geste est consommé : on repasse en position de repos pour que la
          // même destination puisse être redemandée juste après.
          id(tab5_goto_screen).publish_state("—");

button:
  # Recharge le mois courant + M+1 du calendrier (même script que le pré-fetch
  # de boot). À utiliser quand un RDV ajouté dans HA n'apparaît pas encore.
  - platform: template
    id: tab5_reload_calendar
    name: "Recharger le calendrier"
    icon: mdi:calendar-refresh
    entity_category: config
    on_press:
      - script.execute: tab5_cal_prefetch_boot

interval:
  # Rattrapage du volume changé côté HA directement sur le media_player (slider
  # du dashboard, app mobile, automatisation). ESPHome n'expose aucun trigger
  # `on_volume` sur media_player, donc on compare. Sans ça, `system_volume`
  # resterait sur l'ancienne valeur : les sliders de l'écran afficheraient un %
  # faux et le prochain démute écraserait le réglage venu de HA.
  # `!system_muted` est indispensable : quand le son est coupé, le haut-parleur
  # est à 0 alors que `system_volume` porte la valeur à restaurer — comparer les
  # deux dans cet état effacerait le volume mémorisé.
  # La fenêtre de garde de 2 s l'est tout autant : `media_player.volume_set` est
  # débouncé de 150 ms et, pendant un glissement, ne part qu'une fois le doigt
  # immobile. Le haut-parleur reste donc en retard sur `system_volume` pendant
  # tout le geste — un tick tombant dans cette fenêtre recopierait le niveau
  # périmé par-dessus le réglage en cours et ferait sauter le slider sous le
  # doigt. `volume_push_ts` est réarmé à CHAQUE tick du glissement, la garde
  # couvre donc le geste entier, pas seulement son premier instant.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              return !id(system_muted) &&
                     (millis() - id(volume_push_ts)) > 2000 &&
                     fabsf(id(speaker_player)->volume - id(system_volume)) > 0.01f;
          then:
            - script.execute:
                id: tab5_volume_apply
                vol: !lambda 'return id(speaker_player)->volume;'
                push_device: false
