# ============================================================================
# [AI-CONTEXT]
# @file tab5-sensors-domotique.yaml
# @role Entités domotique poussées par HA : plantes (moisture), lumières,
#       températures/humidité, batterie téléphone, présence PC, audio
#       (ampli, jack, wake word).
# @architecture_constraint Ce fichier ne DOIT contenir AUCUNE logique de présentation.
#                         Les blocs on_value: doivent se contenter d'appeler des fonctions
#                         C++ depuis tab5_custom.cpp (ex: update_light_card_ui(...) ).
# @anti_pattern_evité Ne pas utiliser std::string ou to_string() ici (hot-path).
# @ai_instruction Si l'utilisateur demande d'ajouter un nouveau capteur de température,
#                 génère l'entité platform: homeassistant, et dans on_value, appelle
#                 simplement update_temp_ui(id(mon_label), x); Ne génère pas de lv_label_set_text ici.
#                 (Scission de tab5-sensors.yaml le 14/07/2026 ; entités
#                 système dans tab5-sensors-diagnostics.yaml.)
# ============================================================================
switch:
  - platform: gpio
    id: speaker_enable
    name: "Speaker Enable"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: DISABLED

  - platform: template
    name: "Tab5 Wake Word Active"
    id: tab5_wake_word_active
    icon: mdi:microphone-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - micro_wake_word.start:
      - lambda: 'assist_wake_word_indicator_ui(id(lbl_ok_nabu), true);'
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - micro_wake_word.stop:
      - lambda: 'assist_wake_word_indicator_ui(id(lbl_ok_nabu), false);'

binary_sensor:
  - platform: gpio
    id: headphone_detect
    name: "Headphone Detect"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 7

text_sensor:
  - platform: homeassistant
    id: pc_status
    entity_id: ${entity_tracker_pc}
    on_value:
      - lambda: |-
          // Accepte device_tracker (home) et switch (on)
          update_pc_status_ui(x == "home" || x == "on", id(icon_pc), id(icon_sw0), id(lbl_sw0_state));

  # TV → icône moniteur existante sur la carte J0 (icon_card_pc), pas une 4e icône bandeau
  - platform: homeassistant
    id: tv_status
    entity_id: ${entity_tracker_tv}
    on_value:
      - lambda: |-
          bool active = (x == "home" || x == "on" || x == "playing" || x == "idle" || x == "paused");
          set_icon_active_ui(id(icon_card_pc), active, UIColor::SUCCESS, UIColor::TEXT_DIM);

  - platform: homeassistant
    id: light_chambre_state
    entity_id: ${entity_light_chambre}
    on_value:
      # Bloc factorise dans update_light_card_ui() (#T164, ex-triplique chambre/salon/led)
      - lambda: |-
          update_light_card_ui(id(icon_card_lit_j2), id(icon_card_light_j2), id(icon_sw2), id(lbl_sw2_state),
              id(btn_light_power_icon), id(current_light_entity), "${entity_light_chambre}", x == "on");
          update_light_selector_icon(id(icon_light_sel_0), x == "on");

  - platform: homeassistant
    id: light_salon_state
    entity_id: ${entity_light_salon}
    on_value:
      - lambda: |-
          update_light_card_ui(id(icon_card_salon_j3), id(icon_card_light_j3), id(icon_sw3), id(lbl_sw3_state),
              id(btn_light_power_icon), id(current_light_entity), "${entity_light_salon}", x == "on");
          update_light_selector_icon(id(icon_light_sel_1), x == "on");

  - platform: homeassistant
    id: light_led_state
    entity_id: ${entity_light_bureau}
    on_value:
      - lambda: |-
          update_light_card_ui(id(icon_card_led_j4), id(icon_card_light_j4), id(icon_sw4), id(lbl_sw4_state),
              id(btn_light_power_icon), id(current_light_entity), "${entity_light_bureau}", x == "on");
          update_light_selector_icon(id(icon_light_sel_2), x == "on");

# Détails pots (popup appui long) : les 4 capteurs × 5 pots viennent d'UN
# package paramétré (pot_sensors.yaml, règle 5) inclus 5 fois — ESPHome
# concatène les listes `sensor:` des packages (un `- !include` dans une liste
# imbriquerait la liste). Un 6ᵉ pot = une ligne ici + ses 4 clés entity_plante_6_*.
packages:
  pot_sensors_1: !include { file: pot_sensors.yaml, vars: { n: 1 } }
  pot_sensors_2: !include { file: pot_sensors.yaml, vars: { n: 2 } }
  pot_sensors_3: !include { file: pot_sensors.yaml, vars: { n: 3 } }
  pot_sensors_4: !include { file: pot_sensors.yaml, vars: { n: 4 } }
  pot_sensors_5: !include { file: pot_sensors.yaml, vars: { n: 5 } }

sensor:
  # Luminosité (attribut brightness 0-255) des 3 lumières — synchronise l'arc du popup
  # lumière quand il est ouvert sur cette entité (helper inerte popup fermé / pendant
  # un drag utilisateur — voir sync_light_popup_brightness, tab5_custom.cpp).
  - platform: homeassistant
    id: light_chambre_brightness
    entity_id: ${entity_light_chambre}
    attribute: brightness
    on_value:
      - lambda: |-
          if (id(current_light_entity) == "${entity_light_chambre}")
            sync_light_popup_brightness(id(light_options_popup), id(arc_light_brightness),
                id(lbl_light_brightness_val), x);

  - platform: homeassistant
    id: light_salon_brightness
    entity_id: ${entity_light_salon}
    attribute: brightness
    on_value:
      - lambda: |-
          if (id(current_light_entity) == "${entity_light_salon}")
            sync_light_popup_brightness(id(light_options_popup), id(arc_light_brightness),
                id(lbl_light_brightness_val), x);

  - platform: homeassistant
    id: light_led_brightness
    entity_id: ${entity_light_bureau}
    attribute: brightness
    on_value:
      - lambda: |-
          if (id(current_light_entity) == "${entity_light_bureau}")
            sync_light_popup_brightness(id(light_options_popup), id(arc_light_brightness),
                id(lbl_light_brightness_val), x);

  - platform: homeassistant
    id: phone_battery
    entity_id: ${entity_phone_battery}
    on_value:
      - lambda: |-
          // Echelle de couleur factorisee dans get_battery_color (partagee popup pots)
          set_icon_color_ui(id(icon_phone), get_battery_color(x));

  - platform: homeassistant
    id: temp_serre
    entity_id: ${entity_temp_plante}
    on_value:
      - lambda: |-
          update_temp_ui(id(current_serre), x); // AXE1/Phase 3 : helper centralise

  - platform: homeassistant
    id: temp_salon
    entity_id: ${entity_temp_salon}
    on_value:
      - lambda: |-
          update_temp_ui(id(val_temp_salon), x); // Gradient continu colorimetrique (helper centralise)

  - platform: homeassistant
    id: hum_salon
    entity_id: ${entity_hum_salon}
    on_value:
      - lambda: |-
          if (!isnan(x)) set_icon_color_ui(id(icon_salon), get_humidity_color(x));

  - platform: homeassistant
    id: moisture_1
    entity_id: ${entity_plante_1}
    on_value: &moisture_on_value
      # Tri dynamique des 4 slots plantes a chaque mise a jour (bloc partage via ancre YAML, cf. #T164)
      - lambda: |-
          float vals[5] = {id(moisture_1).state, id(moisture_2).state, id(moisture_3).state, id(moisture_4).state, id(moisture_5).state};
          const char* icons[5] = {"\U000F0E66", "\U000F09F1", "\U000F0D08", "\U000F024A", "\U000F02E5"};
          MoistureSlotUI slots[4] = {
              {id(icon_pot_s0), id(val_pot_s0)},
              {id(icon_pot_s1), id(val_pot_s1)},
              {id(icon_pot_s2), id(val_pot_s2)},
              {id(icon_pot_s3), id(val_pot_s3)}
          };
          sort_and_update_moisture_slots(vals, icons, slots);
          // Popup details pots : humidite + statut des 5 cartes FIXES (carte N = capteur N)
          PotDetailUI cards[5] = {
              {id(icon_pot_d1), id(lbl_pot_d1_moist), id(lbl_pot_d1_status)},
              {id(icon_pot_d2), id(lbl_pot_d2_moist), id(lbl_pot_d2_status)},
              {id(icon_pot_d3), id(lbl_pot_d3_moist), id(lbl_pot_d3_status)},
              {id(icon_pot_d4), id(lbl_pot_d4_moist), id(lbl_pot_d4_status)},
              {id(icon_pot_d5), id(lbl_pot_d5_moist), id(lbl_pot_d5_status)}
          };
          update_pots_popup_moisture_ui(vals, cards);

  - platform: homeassistant
    id: moisture_2
    entity_id: ${entity_plante_2}
    on_value: *moisture_on_value

  - platform: homeassistant
    id: moisture_3
    entity_id: ${entity_plante_3}
    on_value: *moisture_on_value

  - platform: homeassistant
    id: moisture_4
    entity_id: ${entity_plante_4}
    on_value: *moisture_on_value

  - platform: homeassistant
    id: moisture_5
    entity_id: ${entity_plante_5}
    on_value: *moisture_on_value
