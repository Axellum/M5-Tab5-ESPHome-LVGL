# ============================================================================
# [AI-CONTEXT]
# @file tab5-api-logic.yaml
# @role Contrat API avec Home Assistant (api: services:).
# @payload_contract Chaque service tab5_maj_* reçoit un payload d'une automation HA et doit
#                   appeler une fonction de tab5_custom.cpp pour traiter la donnée.
# @ui_mapping Les services mettent à jour l'UI en cascade via les fonctions C++.
# @ai_instruction Ne change pas les noms des services sans mettre à jour les automations
#                 HomeAssistant_Config/packages/tab5_push.yaml. Ne mets pas de logique LVGL
#                 directe ici : un service résout ses `id()`, pose ses globals et appelle une
#                 fonction de tab5_custom.cpp. Vérifié par tools/check_tab5_code_rules.py
#                 (pytest) : tout `lv_*` autre que lv_obj_has_flag fait échouer la suite.
# @metadata [2026.9.0] Chaque action porte une `description:`, et chaque variable la forme
#                 longue `type:` + `description:` + `example:` — c'est ce que Home Assistant
#                 affiche dans « Outils de développement → Actions », et le seul endroit où
#                 le format d'un payload sérialisé à la main se lit sans ouvrir ce fichier.
#                 Une action ou une variable sans métadonnées fait échouer `pytest`
#                 (règle 5 de tools/check_tab5_code_rules.py). Coût : des chaînes en flash,
#                 rien en RAM tant qu'aucune action n'est appelée.
# ============================================================================
api:

  # Clé fournie par Home Assistant (lot 6b, ADR-0020) : aucune clé dans le firmware.
  # À l'ajout de la tablette, HA génère une clé, l'envoie par une connexion déjà
  # chiffrée (clé nulle bien connue de Noise) et la garde ; la tablette l'écrit en NVS
  # et refuse ensuite toute autre connexion. Une tablette sans clé n'accepte ce premier
  # contact que pendant la fenêtre `provisioning:` ci-dessous. Changer de HA : effacer
  # la clé (flash USB complet) ou la donner au nouveau HA.
  encryption: {}

  # ═══════════════════════════════════════════════════════════════════════
  # Redémarrage automatique quand Home Assistant ne se connecte plus
  # ═══════════════════════════════════════════════════════════════════════
  # ESPHome redémarre l'appareil quand AUCUN client API n'est connecté pendant
  # cette durée. Le compteur repart à zéro à chaque connexion, même brève.
  #
  # [Audit F-04] `0s` = jamais de reboot, donc état « zombie » possible : pile
  # API figée, appareil en ligne mais muet, jusqu'à une intervention physique.
  # On garde donc un filet — la question n'est que sa durée.
  #
  # [Incident 31/07→01/08/2026] Le serveur HA a mis longtemps à démarrer. Le
  # Tab5, WiFi bon mais sans client API, a redémarré en boucle toutes les
  # ~15-20 min (15 min de timeout + boot + reconnexions, le compteur repartant
  # à chaque connexion brève de HA en cours de démarrage). Rien n'était cassé
  # côté appareil : c'est ce garde-fou qui s'exécutait, comme prévu.
  #
  # 60min est un compromis assumé : une panne/maintenance HA d'une heure ne
  # fait plus cycler la tablette (qui reste utile hors HA — horloge, arcade,
  # console diag, dernier état météo affiché), et le filet anti-zombie est
  # conservé. Ne pas repasser à `0s` sans relire l'audit F-04.
  reboot_timeout: 60min

  # Reconnexion de Home Assistant (redémarrage de HA, coupure Wi-Fi sans reboot) :
  # l'écran a besoin d'un push complet. Remplace le battement `interval: 5min` retiré
  # le 25/09/2026 (tab5-ha-hmi.yaml, audit lot 3). Au boot, on_boot émet déjà
  # l'événement et boot_complete est encore faux quand HA se connecte : pas de doublon.
  # Filtre client_info : `esphome logs` (« ESPHome Logs … ») ne relance pas le push.
  # 2 s + api.connected(state_subscription_only) : laisser HA finir son abonnement,
  # sinon l'événement part dans le vide. Ces 2 s restent ici (le démarrage n'en a plus,
  # tab5-ha-hmi.yaml) : à une reconnexion, une ancienne connexion pas encore fermée
  # (coupure Wi-Fi) peut déjà être abonnée, et un `wait_until` passerait avant que la
  # nouvelle le soit. Côté HA, l'automation ne laisse passer
  # tab5_connected que si la liaison est `on` depuis moins de 3 min — vrai ici.
  on_client_connected:
    - if:
        condition:
          lambda: 'return id(boot_complete) && client_info.find("Home Assistant") != std::string::npos;'
        then:
          - delay: 2s
          - if:
              condition:
                api.connected:
                  state_subscription_only: true
              then:
                - homeassistant.event:
                    event: esphome.tab5_connected
    # Journal des démarrages et des coupures (Tab5/tab5_journal.cpp) : à chaque
    # connexion de HA, boot compris (d'où l'absence de boot_complete ici).
    - if:
        condition:
          lambda: 'return client_info.find("Home Assistant") != std::string::npos;'
        then:
          - script.execute: tab5_journal_envoi
          # Zones optionnelles (lot 5) : redemander à HA quelles zones sont absentes. La
          # demande part avec la première poussée des prévisions (tab5_zones_demande).
          - lambda: 'zones_nouvelle_connexion();'

  services:

    - service: tab5_maj_previsions_heures_bulk
      description: "Prévisions horaires : cinq créneaux en un appel (deux appels couvrent les dix heures affichées ; un bloc 10-14 est accepté mais jamais affiché)."
      variables:
        payload:
          type: string
          description: "Cinq créneaux « idx|heure|condition|température|pluie » séparés par ; — idx de 0 à 9 affichés (10 à 14 acceptés), condition = état météo Home Assistant."
          example: "0|14:00|sunny|21.4|0;1|15:00|cloudy|20.8|0.2;"
      then:
        - lambda: |-
            if (id(h4_time) == nullptr) return;
            // Bloc identique au précédent, ou pas à l'écran (calque journalier
            // affiché, autre page horaire) : rien à repeindre (audit 25/09, lot 3).
            const int fp = g_central_ctx.forecast_page;
            if (!accept_heures_bulk(payload, fp)) return;
            refresh_hourly_forecast(g_hour_slots, 1 - fp, id(font_meteo_card), id(font_meteo_card_small));
            // Les tuiles viennent de changer : le titre de la carte centrale annonce
            // leurs bornes, il doit suivre. No-op si ce titre n'est pas affiche.
            refresh_forecast_page_title_ui(fp, id(page_title_wrapper), id(lbl_page_title), g_central_ctx);

    - service: tab5_maj_previsions_jours_bulk
      description: "Prévisions journalières : les quinze jours en un seul appel. Le bandeau planning en est dérivé localement."
      variables:
        payload:
          type: string
          description: "Quinze jours « idx|libellé|condition|tmin|tmax|repos|dimanche|passé|heures » séparés par ; — repos, dimanche et passé valent 0 ou 1, heures vaut « HH:MM-HH:MM » ou reste vide."
          example: "0|Auj 17|sunny|12.1|24.3|0|0|0|;1|Ven 18|rainy|11.0|19.8|1|0|0|08:00-16:00;"
      then:
        - lambda: |-
            if (id(j0_day) == nullptr) return;
            // Zones optionnelles (lot 5) : une fois par connexion, avant la garde
            // ci-dessous. Cette poussée vient d'une automatisation de HA : elles
            // tournent, donc la réponse (tab5_maj_zones) aussi.
            if (zones_demande_a_envoyer()) id(tab5_zones_demande).execute();
            // Quinze jours identiques au push précédent : ni analyse ni rendu. Sûr
            // pour le réveil — le contenu change au moins une fois par jour (libellés
            // des jours décalés), donc la date d'ancrage suit (audit 25/09, lot 3).
            if (push_unchanged(PushChannel::JOURS, payload.c_str(), payload.size())) return;
            parse_and_update_jours_bulk(payload);
            int fp = g_central_ctx.forecast_page;
            // Tuiles journalières repeintes seulement si leur calque est affiché
            // (pages 2-4) : apply_forecast_page() les repeint au changement de page.
            if (fp >= 2) {
              refresh_daily_forecast(g_day_slots, fp - 2, id(font_meteo_card), id(font_meteo_card_small));
              // Idem horaire : le titre annonce les bornes des 5 tuiles, il suit leur MAJ.
              refresh_forecast_page_title_ui(fp, id(page_title_wrapper), id(lbl_page_title), g_central_ctx);
            }
            // Les horaires de travail des 15 prochains jours viennent d'être
            // réécrits : c'est la source du mode « avant l'ouverture » du réveil.
            // Sans cette invalidation, la prochaine sonnerie resterait calculée
            // sur le planning précédent jusqu'au filet des 60 s.
            alarm_invalidate();
            // Bandeau planning dérivé localement (plus de push HA tab5_maj_planning)
            if (!temp_planning_active() && id(lbl_planning_text) != nullptr) {
              std::string l1, l2;
              build_planning_lines_from_jours(l1, l2);
              update_planning_text_ui(id(lbl_planning_text), l1, l2,
                  id(plan_ligne_1), id(plan_ligne_2));
            }

    - service: tab5_maj_volet_etat
      description: "État du volet de la serre affiché sur sa carte."
      variables:
        etat_physique:
          type: string
          description: "État du volet : « En_mouvement » pendant une manœuvre, sinon le dernier état connu (Ouvert, Ferme, Stoppe…)."
          example: "En_mouvement"
      then:
        # Volet 3.x = tuile 1 de la pièce 0 du mode héritage (ADR-0023) : épaules de la
        # tuile météo et carte du mode HA, dessinées par tab5_tuiles.cpp. Le drapeau de
        # mouvement arme le mot « Stop » dans tous les modes.
        - lambda: 'id(volet_en_mouvement) = tuiles_heritage_volet(etat_physique);'
        - if:
            condition:
              lambda: 'return etat_physique == "En_mouvement";'
            then:
              - micro_wake_word.enable_model:
                  id: stop
            else:
              # Pas de désarmement direct : la poussée arrive toutes les 10 min,
              # y compris pendant une sonnerie du réveil (audit du 26/09/2026, §2.1).
              - script.execute: tab5_stop_model_release

    - service: tab5_maj_clim
      description: "État de la climatisation : carte d'accueil et popup. Ses bornes, son pas, son unité et ses boutons arrivent juste avant, par la clé climr de tab5_maj_emplacements."
      variables:
        target:
          type: string
          description: "Consigne, dans l'unité de température de Home Assistant (°C ou °F)."
          example: "21.5"
        current:
          type: string
          description: "Température mesurée par la climatisation, dans l'unité de Home Assistant."
          example: "20.8"
        mode:
          type: string
          description: "Mode HVAC Home Assistant : off, cool, heat, dry, fan_only ou auto."
          example: "cool"
        preset:
          type: string
          description: "Préréglage Home Assistant, « none » s'il n'y en a pas."
          example: "boost"
        fan:
          type: string
          description: "Vitesse de ventilation."
          example: "auto"
        swing:
          type: string
          description: "Oscillation des volets."
          example: "off"
      then:
        # La clim du blueprint : ses globals, puis la carte de l'accueil, le popup s'il la
        # montre (pas quand il montre la clim d'une tuile, ADR-0027) et les couleurs
        # (clim_blueprint_recu, tab5_clim.cpp : même code que les gestes optimistes).
        - lambda: |-
            // « inf »/« -inf » → NAN (« -- ») : jamais converti en entier (lot A, audit du 30/09).
            id(clim_target_temp) = tab5_fini_ou_nan(atof(target.c_str()));
            id(clim_hvac_mode) = mode;
            id(clim_preset_mode) = preset;
            id(clim_fan_mode) = fan;
            id(clim_swing_mode) = swing;
            clim_blueprint_recu(id(clim_target_temp), tab5_fini_ou_nan(atof(current.c_str())));

    # Nom historique : depuis le lot 4c (27/09/2026), la vigilance peut venir d'un autre
    # fournisseur (MeteoAlarm…), ramené à ces cases par les adaptateurs côté HA.
    - service: tab5_maj_alerte_meteo_france
      description: "Pluie dans l'heure (code) et vigilances météo, quel que soit le fournisseur."
      variables:
        payload:
          type: string
          description: "Champs séparés par | : code de pluie « @niveau,début » (niveau -1 pas de données, 0 sec, 1 à 4 faible à très forte, 5 intensité inconnue ; début = epoch UTC, 0 s'il pleut déjà ; « @- » = pas de source), niveau global, puis Vent violent, Inondation, Orages, Pluie-inondation, Neige-verglas, Grand-froid, Vagues-submersion, Canicule, Avalanches, et en option Brouillard et Feux de forêt — chacun Vert, Jaune, Orange ou Rouge. Un premier champ sans « @ » est affiché tel quel."
          example: "@2,1790000000|Jaune|Vert|Vert|Jaune|Vert|Vert|Vert|Vert|Vert|Vert"
      then:
        - lambda: |-
            if (id(lbl_proc_pluie) == nullptr) return;
            // Identique au précédent : has_mf_alerts garde sa valeur (audit 25/09, lot 3).
            if (push_unchanged(PushChannel::VIGILANCE, payload.c_str(), payload.size())) return;
            // 11 à 13 champs « | » : code pluie, vigilance globale, puis 9 phénomènes
            // (vent, inondation, orages, pluie-inondation, neige-verglas, grand
            // froid, vagues-submersion, canicule, avalanches), et en option
            // brouillard et feux de forêt (MeteoAlarm, lot 4c). Découpage, couleur
            // de la date et 4 slots d'icônes : parse_and_update_vigilance().
            VigilanceUI ui{id(lbl_proc_pluie), id(lbl_pluie_val), id(lbl_pluie_unit), id(lbl_date),
                           {id(alerte_slot_0), id(alerte_slot_1), id(alerte_slot_2), id(alerte_slot_3)}};
            central_set_vigilance(parse_and_update_vigilance(payload, ui));

    # `uv` et `gel` sont reçus mais non exploités par l'UI : paramètres RÉSERVÉS.
    # Le contrat a 3 appelants côté HA, on ne le rétrécit pas ; seule `neige` agit
    # (flocon si probabilité ≥ 5, sinon goutte colorée par l'hygrométrie).
    - service: tab5_maj_probabilites
      description: "Probabilités UV, gel et neige. Seule « neige » agit aujourd'hui ; « uv » et « gel » sont des paramètres réservés."
      variables:
        uv:
          type: string
          description: "Indice UV. Reçu mais pas affiché : paramètre réservé, le contrat n'est pas rétréci."
          example: "4"
        gel:
          type: string
          description: "Probabilité de gel en pourcent. Reçue mais pas affichée : paramètre réservé."
          example: "0"
        neige:
          type: string
          description: "Probabilité de neige en pourcent : l'icône devient un flocon à partir de 5."
          example: "0"
      then:
        - lambda: |-
            if (id(j0_day) == nullptr) return;
            id(global_neige) = atoi(neige.c_str());
            update_rain_predict_icon_ui(id(icon_rain_predict), id(global_neige), (float) id(global_humidite));

    # `condition` et `temperature` sont reçus mais non exploités : paramètres
    # RÉSERVÉS depuis le retrait de la grosse icône météo centrale (même raison,
    # contrat conservé). Seule `humidite` agit, sur la couleur de la goutte.
    - service: tab5_maj_meteo_actuelle
      description: "Conditions du moment. Seule « humidite » agit depuis le retrait de la grande icône météo centrale ; les deux autres sont réservées."
      variables:
        condition:
          type: string
          description: "Condition météo Home Assistant. Reçue mais pas affichée : paramètre réservé."
          example: "sunny"
        temperature:
          type: string
          description: "Température extérieure en degrés Celsius. Reçue mais pas affichée : paramètre réservé."
          example: "22.4"
        humidite:
          type: string
          description: "Hygrométrie en pourcent : elle colore la goutte de la carte centrale."
          example: "68"
      then:
        - lambda: |-
            if (id(icon_rain_predict) == nullptr) return;
            id(global_humidite) = tab5_fini_ou_nan(atof(humidite.c_str()));
            update_rain_predict_icon_ui(id(icon_rain_predict), id(global_neige), (float) id(global_humidite));

    # Les 9 barres en UN appel (ADR-0003, audit §4.1 point 3) : payload
    # « idx|intensité;idx|intensité;… », idx 0..8 = 0,5,10,15,20,25 puis 35,45,55 min,
    # intensité = libellé Météo-France (« Temps sec », « Pluie faible » … « Pluie très
    # forte ») ou niveau chiffré 0 à 4 (lot 4c : adaptateurs des autres fournisseurs).
    # Seul contrat depuis le 08/09/2026 : l'ancien tab5_maj_pluie_1h (une barre
    # par appel, 9 appels par rafraîchissement) a été retiré le même jour.
    - service: tab5_maj_pluie_1h_bulk
      description: "Les neuf barres de pluie de l'heure qui vient, en un appel."
      variables:
        payload:
          type: string
          description: "Neuf barres « idx|intensité » séparées par ; — idx de 0 à 8 pour 0, 5, 10, 15, 20, 25, 35, 45 et 55 minutes, intensité = libellé Météo-France ou niveau de 0 (sec) à 4 (très forte)."
          example: "0|Temps sec;1|Pluie faible;2|Pluie modérée;"
      then:
        - lambda: |-
            if (id(rb_0_in) == nullptr) return;
            // Identique au précédent : has_rain garde sa valeur (audit 25/09, lot 3).
            if (push_unchanged(PushChannel::PLUIE, payload.c_str(), payload.size())) return;
            lv_obj_t* const bars[9] = {id(rb_0_in), id(rb_1_in), id(rb_2_in), id(rb_3_in), id(rb_4_in),
                                       id(rb_5_in), id(rb_6_in), id(rb_7_in), id(rb_8_in)};
            central_set_pluie(update_rain_bars_bulk_ui(payload, bars));

    # Zone d'info de la carte centrale (panneau 3 du rotateur, cf. tab5-globals.yaml) :
    # récap calendrier 3 jours (multi-lignes avec recolor #hex ...#) ou alerte météo
    # (1 ligne). Alimenté par packages/tab5_push.yaml (script tab5_push_alertes) section 7 (texte + couleur Rouge/Orange/Blanc).
    - service: tab5_maj_info_texte
      description: "Zone d'info de la carte centrale : récapitulatif du calendrier sur trois jours, ou alerte météo."
      variables:
        texte:
          type: string
          description: "Texte affiché, sur une ou plusieurs lignes (un fragment entouré de « #RRGGBB » et « # » prend cette couleur), ou code composé par la tablette dans sa langue : « @ha|nb MAJ|titre de la MAJ|nb erreurs|nb indispo|jaune 0 ou 1|vigilance rouge, orange ou vide »."
          example: "@ha|1|Home Assistant Core|0|0|0|"
        couleur:
          type: string
          description: "Couleur du texte : Rouge, Orange ou Blanc."
          example: "Blanc"
        meteo_id:
          type: string
          description: "Identifiant d'acquittement du bandeau : un tap le masque jusqu'au prochain identifiant. Vide = bandeau non masquable. À fournir même vide."
          example: "meteo:orange"
      then:
        - lambda: |-
            id(info_meteo_dismiss_id) = meteo_id;
            // Empreinte sur les trois champs ET les acquittements locaux : un tap sur
            // la dalle change ce qui s'affiche pour un même texte (audit 25/09, lot 3).
            // (variables d'action = esphome::StringRef : pas d'operator+ avec un char,
            // d'où la construction par +=.)
            std::string cle = texte.str();
            cle += '\x1f';
            cle += couleur;
            cle += '\x1f';
            cle += meteo_id;
            cle += '\x1f';
            cle += id(tab5_dismissed_local);
            if (push_unchanged(PushChannel::INFO, cle)) return;
            // Vigilance rouge nouvelle montrée tout de suite : le rotateur repart de zéro
            // pour qu'elle reste un tour entier (alertes du 06/10/2026, lot 3).
            if (update_info_text_ui(id(lbl_info_text), id(info_wrapper), id(planning_wrapper),
                    texte, couleur, meteo_id, id(tab5_dismissed_local), g_central_ctx,
                    id(roboto_32_b))) {
              id(tab5_central_rotator_auto).execute();
            }

    - service: tab5_maj_reponse_vocale
      description: "Réponse vocale courte, affichée sous l'assistant sur l'écran d'accueil."
      variables:
        texte:
          type: string
          description: "Texte de la réponse, en clair."
          example: "Il fait 21 degrés dans le salon."
      then:
        - script.execute:
            id: tab5_show_vocal_response
            texte: !lambda 'return texte;'

    # Réponse "riche" du moteur pour le popup Assistant vocal : texte Markdown
    # (tableaux pris en charge, alignés approximativement : police proportionnelle
    # depuis l'essai D8 du 26/09/2026) + URL d'image optionnelle.
    # image_url vide => zone image masquée. Ouvre le popup automatiquement.
    - service: tab5_assist_reponse
      description: "Réponse riche du moteur dans le popup Assistant vocal, qui s'ouvre automatiquement."
      variables:
        texte:
          type: string
          description: "Réponse en Markdown ; les colonnes des tableaux sont réalignées à l'écran (approximativement, police proportionnelle)."
          example: "**Salon** : 21 degrés"
        image_url:
          type: string
          description: "URL d'une image PNG à afficher sous le texte. Vide : la zone image reste masquée."
          example: "http://moteur.local:8000/images/graphe.png"
      then:
        - lambda: |-
            assist_set_response(id(lbl_assist_response), texte,
                assist_font(id(assist_text_size), id(roboto_32_b)));
        - if:
            condition:
              lambda: 'return !image_url.empty();'
            then:
              - lambda: 'assist_image_state_ui(id(assist_img_hint), id(assist_img_widget), AssistImage::LOADING);'
              - online_image.set_url:
                  id: assist_response_image
                  url: !lambda 'return image_url;'
            else:
              - lambda: 'assist_image_state_ui(id(assist_img_hint), id(assist_img_widget), AssistImage::NONE);'
        - script.execute: tab5_assist_open

    - service: tab5_maj_alertes_ha_bulk
      description: "Bandeau des alertes Home Assistant du rotateur 8 s : quatre au maximum, en un appel."
      variables:
        payload:
          type: string
          description: "Jusqu'à quatre alertes « id|couleur|libellé » séparées par ; — couleur Rouge ou Orange, id renvoyé tel quel à l'acquittement quand l'écran est tapé. Libellés codés, composés par la tablette dans sa langue : « @maj:titre » et « @indispo:nombre ». En tête, « @n:nombre » quand il y a plus de quatre alertes à lire : chaque bandeau affiche alors son rang, « 2/6 »."
          example: "update.home_assistant_core_update|Rouge|@maj:Home Assistant Core;ha:unavailable|Orange|@indispo:3"
      then:
        - lambda: |-
            // Même empreinte que le bandeau info : payload + acquittements locaux
            // (tab5_dismissed_local filtre les slots au rendu) — audit 25/09, lot 3.
            std::string cle = payload.str();
            cle += '\x1f';
            cle += id(tab5_dismissed_local);
            if (push_unchanged(PushChannel::ALERTES_HA, cle)) return;
            // Widgets des 4 bandeaux : g_ha_alert_slots (tab5-alertes.yaml).
            id(tab5_ha_alert_slots_init).execute();
            // Alerte rouge nouvelle montrée tout de suite : le rotateur repart de zéro
            // pour qu'elle reste un tour entier (alertes du 06/10/2026, lot 3).
            if (parse_and_update_ha_alerts_bulk(payload, g_ha_alert_slots, g_central_ctx,
                    id(tab5_dismissed_local))) {
              id(tab5_central_rotator_auto).execute();
            }

    # Conservé pour compat (anciennes automations) — le bandeau est désormais dérivé
    # localement après tab5_maj_previsions_jours_bulk via build_planning_lines_from_jours().
    - service: tab5_maj_planning
      description: "Obsolète depuis le 08/09/2026 : la tablette dérive le bandeau planning des prévisions journalières. Gardé pour compatibilité, il sera retiré dans une future version majeure."
      variables:
        ligne1:
          type: string
          description: "Première ligne du bandeau."
          example: "Auj : TRAVAIL 08:00-16:00"
        ligne2:
          type: string
          description: "Seconde ligne du bandeau."
          example: "Demain : repos"
      then:
        - lambda: |-
            if (id(lbl_planning_text) == nullptr) return;
            update_planning_text_ui(id(lbl_planning_text), ligne1, ligne2,
                id(plan_ligne_1), id(plan_ligne_2));

    # Réveil — liste des prochains rendez-vous, poussée par
    # script.tab5_rdv_prochains (HomeAssistant_Config/packages/tab5_reveil.yaml).
    # payload = "epoch|titre~epoch|titre~…" (epoch UTC du début, max 8 entrées,
    # titres déjà nettoyés des séparateurs côté HA). Le firmware garde la liste
    # et déclenche l'annonce LUI-MÊME à la seconde près : une coupure HA entre la
    # poussée et l'échéance ne fait pas rater l'annonce. Un rendez-vous déjà
    # annoncé le reste après une nouvelle poussée (appariement par epoch dans
    # rdv_store), sinon le rappel repartirait toutes les 5 minutes.
    - service: tab5_maj_rdv_prochains
      description: "Liste des prochains rendez-vous. Le firmware la garde et déclenche l'annonce lui-même : une coupure Home Assistant ne la fait pas rater."
      variables:
        payload:
          type: string
          description: "Jusqu'à huit entrées « epoch|titre » séparées par ~ — epoch UTC du début, titres déjà nettoyés de leurs séparateurs."
          example: "1789552800|Dentiste~1789639200|Réunion équipe"
      then:
        - lambda: |-
            rdv_store(payload);
            id(tab5_rdv_next_sensor).update();

    # Popup calendrier — réponse de script.tab5_calendrier_mois (HA) : codes = 62 hex
    # (2/jour, bits 1 travail, 2 férié, 4 vacances scolaires, 8 RDV, 16 anniversaire),
    # heures = 31 champs "HH:MM-HH:MM" séparés par |, details = 31 champs "type|texte;..."
    # séparés par ~ (détail jour embarqué → tap instantané sans round-trip).
    # Mis en cache ; re-rendu seulement si le popup est ouvert sur ce mois.
    - service: tab5_maj_calendrier_mois
      description: "Enrichit un mois du popup calendrier. La réponse est mise en cache et re-rendue seulement si le popup est ouvert sur ce mois."
      variables:
        annee:
          type: string
          description: "Année sur quatre chiffres."
          example: "2026"
        mois:
          type: string
          description: "Mois, de 1 à 12."
          example: "9"
        codes:
          type: string
          description: "Soixante-deux caractères hexadécimaux, deux par jour : bits 1 travail, 2 férié, 4 vacances scolaires, 8 rendez-vous, 16 anniversaire."
          example: "010400000000000000…"
        heures:
          type: string
          description: "Trente-et-un champs « HH:MM-HH:MM » séparés par | — champ vide les jours sans horaire de travail."
          example: "08:00-16:00||14:00-22:00|…"
        details:
          type: string
          description: "Trente-et-un champs séparés par ~, chacun « type|texte;… » : le détail de chaque jour est embarqué, un tap l'affiche sans aller-retour."
          example: "travail|08:00-16:00~~ferie|Toussaint~…"
      then:
        - lambda: |-
            if (id(lbl_cal_month) == nullptr) return;
            cal_store_month_data(annee, mois, codes, heures, details);
        - if:
            condition:
              lambda: |-
                return id(lbl_cal_month) != nullptr
                    && !lv_obj_has_flag(id(calendar_popup), LV_OBJ_FLAG_HIDDEN)
                    && atoi(annee.c_str()) == id(cal_view_year)
                    && atoi(mois.c_str()) == id(cal_view_month);
            then:
              - script.execute: tab5_cal_render

    # Popup calendrier — réponse de script.tab5_calendrier_jour (HA) : payload =
    # "type|texte;..." (types travail/ferie/vacances/rdv/anniv/fete, max 6 lignes).
    # Ignoré si le détail affiché ne correspond plus à cette date (navigation rapide).
    - service: tab5_maj_calendrier_jour
      description: "Détail d'un jour du popup calendrier, en réponse au tap sur une cellule. Ignoré si l'affichage a changé de date entre-temps."
      variables:
        date:
          type: string
          description: "Date demandée, au format AAAA-MM-JJ."
          example: "2026-09-17"
        payload:
          type: string
          description: "Jusqu'à six lignes « type|texte » séparées par ; — types travail, ferie, vacances, rdv, anniv et fete."
          example: "travail|08:00-16:00;rdv|Dentiste 14:30"
      then:
        - lambda: |-
            if (id(lbl_cal_day_status) == nullptr) return;
            if (lv_obj_has_flag(id(cal_day_popup), LV_OBJ_FLAG_HIDDEN)) return;
            if (id(cal_detail_date) != date) return;
            CalDetailLineUI lines[6] = {
                {id(cal_det_icon_0), id(cal_det_txt_0)},
                {id(cal_det_icon_1), id(cal_det_txt_1)},
                {id(cal_det_icon_2), id(cal_det_txt_2)},
                {id(cal_det_icon_3), id(cal_det_txt_3)},
                {id(cal_det_icon_4), id(cal_det_txt_4)},
                {id(cal_det_icon_5), id(cal_det_txt_5)}
            };
            cal_render_day_detail(payload, id(lbl_cal_day_status), lines);

    # Zones optionnelles (lot 5, 27/09/2026) — réponse de l'automatisation HA
    # tab5_zones_reponse (package tab5_push.yaml) à l'événement esphome.tab5_zones
    # (script tab5_zones_demande, tab5-zones.yaml). La décision vit dans tab5_zones.cpp.
    - service: tab5_maj_zones
      description: "Zones optionnelles : les zones de l'écran dont l'entité n'existe pas dans Home Assistant, en réponse à l'événement esphome.tab5_zones. Elles disparaissent, les autres restent ou reviennent."
      variables:
        absentes:
          type: string
          description: "Clés des zones absentes, séparées par des virgules : lumiere_1, lumiere_2, lumiere_3, pc, tv, telephone, salon, serre, pot_1 à pot_5, clim, volet, planning, discussion (aucun pipeline de discussion : boutons Domo / Discu masqués). Vide : tout est là."
          example: "clim,pot_4,pot_5"
      then:
        - lambda: 'zones_reponse_ha(absentes);'
        # Toujours : le capteur « Zones masquées » part aussi quand rien ne change.
        - script.execute: tab5_zones_apply

    # Emplacements de la maison (lot 6a, ADR-0019) — poussés par le blueprint
    # « Tab5 — emplacements » (HomeAssistant_Config/blueprints/automation/tab5/) :
    # tous à la connexion, un seul à chaque changement de son entité. La tablette ne
    # connaît plus d'entité ; chaque clé est publiée dans le capteur interne qui la
    # porte (tab5-sensors-domotique.yaml, pot_sensors.yaml), dont les on_value n'ont
    # pas changé. Clé inconnue : ignorée (c'est ce qui rend « climr », ADR-0026, et les
    # clés « crRT » / « ceRT » des clims de tuile, ADR-0027, et « solaire », icône du
    # bandeau d'état, sans risque pour un firmware plus ancien).
    # tests/test_emplacements.py compare cette table au blueprint.
    - service: tab5_maj_emplacements
      description: "Emplacements de la maison choisis dans le blueprint « Tab5 — emplacements » : état et valeur de chacun. Tous à la connexion, un seul à chaque changement."
      variables:
        payload:
          type: string
          description: "« clé|état|valeur » séparés par ; — clés lumiere_1 à lumiere_3, pc, tv, telephone, salon, salon_hum, serre, pot_1 à pot_5 et pot_N_ec, _lux, _temp, _bat. État = état Home Assistant tel quel ; valeur = nombre affiché (luminosité 0-255, %, °C, µS/cm, lx), nan s'il n'y en a pas. Tuiles de pièce (ADR-0023, depuis 3.2.0) : « tRT|état|valeur|couleur », R pièce et T tuile de 0 à 4, valeur = luminosité 0-255, position 0-100, mesure ou température de la pièce (nan sinon), couleur = RRGGBB d'une lumière allumée, vide sinon. Réglages de la clim (ADR-0026, avant tab5_maj_clim) : « climr|min|max|pas|unité|capacités|nom », nombres à point décimal, unité °C ou °F, capacités = lettres des boutons gérés parmi c, h, d, f (froid, chaud, sec, ventilation), e (Éco), b (Boost), q (Silence), s (Oscillation), w (Brise). Clim d'une tuile cli sans l'option m (ADR-0027) : réglages « crRT|min|max|pas|unité|capacités|nom » (comme climr) et état « ceRT|consigne|pièce|mode|préréglage|ventilation|oscillation » (champs de tab5_maj_clim, nan si inconnu). Production solaire du bandeau d'état : « solaire|pourcentage », 0 à 100 de la puissance crête, nan = aucune valeur (icône masquée). Appareils de la tuile − / + (ADR-0033) : « rN|état|valeur », N de 0 à 7, valeur dans l'unité de sa définition (nan sinon). Appuis longs des trois boutons du haut : « appuis|maison|engrenage|manette », un code par bouton parmi auto, rien, assistant, calendrier, reveil, clim, plantes, tv, console, energie, reglages, alertes, arcade (un code inconnu vaut auto)."
          example: "lumiere_1|on|180;salon|21.4|21.4;t02|on|128|FFB347;t01|open|45|;"
      then:
        - lambda: |-
            static const EmplacementCible kCibles[] = {
                {"lumiere_1", id(light_chambre_state), id(light_chambre_brightness)},
                {"lumiere_2", id(light_salon_state), id(light_salon_brightness)},
                {"lumiere_3", id(light_led_state), id(light_led_brightness)},
                {"pc", id(pc_status), nullptr},
                {"tv", id(tv_status), nullptr},
                {"telephone", nullptr, id(phone_battery)},
                {"salon", nullptr, id(temp_salon)},
                {"salon_hum", nullptr, id(hum_salon)},
                {"serre", nullptr, id(temp_serre)},
                {"pot_1", nullptr, id(moisture_1)},
                {"pot_2", nullptr, id(moisture_2)},
                {"pot_3", nullptr, id(moisture_3)},
                {"pot_4", nullptr, id(moisture_4)},
                {"pot_5", nullptr, id(moisture_5)},
                {"pot_1_ec", nullptr, id(pot1_ec)}, {"pot_1_lux", nullptr, id(pot1_lux)},
                {"pot_1_temp", nullptr, id(pot1_temp)}, {"pot_1_bat", nullptr, id(pot1_bat)},
                {"pot_2_ec", nullptr, id(pot2_ec)}, {"pot_2_lux", nullptr, id(pot2_lux)},
                {"pot_2_temp", nullptr, id(pot2_temp)}, {"pot_2_bat", nullptr, id(pot2_bat)},
                {"pot_3_ec", nullptr, id(pot3_ec)}, {"pot_3_lux", nullptr, id(pot3_lux)},
                {"pot_3_temp", nullptr, id(pot3_temp)}, {"pot_3_bat", nullptr, id(pot3_bat)},
                {"pot_4_ec", nullptr, id(pot4_ec)}, {"pot_4_lux", nullptr, id(pot4_lux)},
                {"pot_4_temp", nullptr, id(pot4_temp)}, {"pot_4_bat", nullptr, id(pot4_bat)},
                {"pot_5_ec", nullptr, id(pot5_ec)}, {"pot_5_lux", nullptr, id(pot5_lux)},
                {"pot_5_temp", nullptr, id(pot5_temp)}, {"pot_5_bat", nullptr, id(pot5_bat)},
            };
            emplacements_appliquer(payload, kCibles, sizeof(kCibles) / sizeof(kCibles[0]));

    # Pièces et tuiles (ADR-0023, 3.2.0) — définitions poussées par le blueprint
    # « Tab5 — emplacements » à la (re)connexion, au rechargement des automatisations et à
    # la demande des zones, AVANT les états (clés tRT de tab5_maj_emplacements). Un
    # blueprint 3.2 ne l'appelle que si la tablette annonce au moins 3.2.0 (sw_version) :
    # une action absente est une erreur que continue_on_error ne rattrape pas. Modèle,
    # NVS et dessin : tab5_tuiles.cpp.
    - service: tab5_maj_tuiles
      description: "Pièces de l'écran (ADR-0023) : cinq pièces de cinq appareils au plus, une par page du bas ; et la rangée sous l'horloge (ADR-0031). Et les appareils de la tuile − / + (ADR-0033). Instantané complet, envoyé avant les états ; ce qui n'est pas listé est vide."
      variables:
        payload:
          type: string
          description: "Entrées séparées par ; — « pR|nom » (nom de la pièce R, 0 à 4) et « tRT|type|icône|options|complément|nom » (tuile T, 0 = gauche). Types lum, int, vol, med, act, cap, bin, cli ; icône = code de palette ([a-z0-9_], vide = défaut du type) ; options = lettres parmi d (graduable), c (couleur), o (allumer seulement), k (confirmer), r (lecture seule), t (télécommande TV), m (climatisation), e (capteur d'énergie : ouvre le popup Énergie) ; complément = unité d'un cap, classe d'appareil d'un bin ; nom gardé sur 24 octets. Rangée sous l'horloge (ADR-0031) : « hp|place » (ligne des plantes, 0 à 2 ; - = masquée), « hd|secondes » (durée d'une ligne, arrondie aux tours de 8 s de la carte centrale), « hLI|type|icône|options|complément|nom|classe » (élément I, 0 à 3, de la ligne L, 0 à 2 ; classe = classe d'appareil, la couleur de la valeur). Tuile − / + (ADR-0033) : « rN|type|icône|options|lien|min|max|pas|unité|nom » (appareil N, 0 à 7 ; types son, lum, cli, eau, hum, ven, vol, nbr ; option t = la TV du blueprint ; lien = tRT de la tuile qui porte la même entité, vide sinon). Dans chaque champ, | devient / et ; devient ,."
          example: "p0|Salon;t00|lum|lampadaire|d||Lampadaire;t01|vol||||Volet;t02|cap|thermometre||°C|Température;hp|0;hd|32;h00|cap|thermometre||°C|Salon|temperature;"
      then:
        - lambda: 'tuiles_definir(payload);'

    # Énergie (ADR-0028, discussion #278) : réponses à l'événement esphome.tab5_energie
    # (vue demandée), par script.tab5_energie (packages/tab5_energie.yaml) que lance le
    # blueprint « Tab5 — emplacements ». Rien n'est gardé : tout repart à l'ouverture.
    - service: tab5_maj_energie
      description: "Popup Énergie : l'instantané d'une installation solaire, poussé tant que le popup est ouvert."
      variables:
        payload:
          type: string
          description: "solaire|maison|reseau|batterie|batterie_puissance|batterie_temperature|unite_temperature|jour — champ vide = capteur non choisi (sa carte ou sa ligne disparaît), nan = choisi sans valeur. Puissances en W (réseau : + achat, − vente ; batterie : + charge, − décharge), batterie en %, température dans son unité, jour = production du jour en kWh."
          example: "3450|1180|-2270|78|0|24.5|°C|12.4"
      then:
        - lambda: 'energie_instantane(payload);'

    - service: tab5_maj_energie_historique
      description: "Popup Énergie : la production d'une vue en barres (heures du jour, 30 derniers jours, 12 derniers mois)."
      variables:
        vue:
          type: string
          description: "heures, jours ou mois"
          example: "heures"
        debut:
          type: string
          description: "AAAA-MM-JJ : le jour des heures, le premier des 30 jours, le 1er du premier des 12 mois"
          example: "2026-06-16"
        valeurs:
          type: string
          description: "Production de chaque heure, jour ou mois en kWh, séparée par ; (24, 30 ou 12 valeurs ; vide = pas de donnée)"
          example: "0;0;0;0;0;0;0.05;0.4;1.1;1.9;2.6;3;3.1;;;;;;;;;;;"
      then:
        - lambda: 'energie_historique(vue, debut, valeurs);'

    # Historique des températures (ADR-0032) : réponse à l'événement esphome.tab5_historique
    # (cle, vue), par script.tab5_historique (packages/tab5_historique.yaml) que lance le
    # blueprint « Tab5 — emplacements ». Rien n'est gardé : tout repart à l'ouverture.
    - service: tab5_maj_historique
      description: "Popup Température : la courbe d'une des deux températures de l'accueil, et la prévision de la météo à la suite de la seconde."
      variables:
        cle:
          type: string
          description: "salon (température de la pièce) ou serre (seconde température)"
          example: "serre"
        vue:
          type: string
          description: "jour (24 h, créneaux d'une heure), semaine (7 jours, trois heures) ou mois (30 jours, un jour)"
          example: "jour"
        entete:
          type: string
          description: "nom|debut|pas|maintenant|actuel|exterieur — nom affiché (vide : celui de l'emplacement), début du premier créneau en heure locale AAAA-MM-JJTHH:MM, minutes par créneau, minutes de debut à maintenant, valeur actuelle (nan sans), 1 si la seconde température est dehors"
          example: "Serre|2026-06-15T07:00|60|1485|18.2|0"
        mesures:
          type: string
          description: "moy,min,max de chaque créneau depuis debut, séparés par ; (vide = pas de donnée), 64 au plus"
          example: "17.1,16.8,17.5;16.9,16.6,17.2;;16.5,16.2,16.8"
        previsions:
          type: string
          description: "minute,moy[,min,max] de chaque point de prévision (minutes depuis debut, dans l'ordre), séparés par ; — vide pour la pièce ou sans météo, 48 au plus"
          example: "1500,19.4;1560,20.8;1620,22.1"
      then:
        - lambda: 'historique_recu(cle, vue, entete, mesures, previsions);'

    # Historique des alertes (lot 4 du plan des alertes, 06/10/2026) : réponse à
    # l'événement esphome.tab5_alertes_historique (ouverture du popup « Alertes »), par
    # script.tab5_push_alertes_historique (packages/tab5_push.yaml), qui la repousse
    # aussi quand l'historique change pendant que le popup est ouvert.
    - service: tab5_maj_alertes_historique
      description: "Popup Alertes : les 20 dernières alertes, la plus récente d'abord."
      variables:
        payload:
          type: string
          description: "Entrées « apparue|lue|terminée|gravité|libellé » séparées par ; — heures en secondes epoch (0 = pas encore), gravité Rouge, Orange ou Jaune, libellé codé comme ceux des bandeaux (« @maj:titre », « @indispo:nombre », « @vigi:niveau ») ou nom d'une entité. 20 entrées au plus."
          example: "1791381720|1791382200|0|Rouge|@maj:Home Assistant Core;1791370000|0|1791375400|Orange|Porte du garage"
      then:
        - lambda: 'alertes_historique_recu(payload);'

# Fenêtre d'appairage (lot 6b, ADR-0020) : une tablette qui n'a pas encore de clé API
# (neuve, ou jamais ajoutée à HA) n'accepte le premier contact de HA que pendant les
# 30 minutes qui suivent son démarrage. Passé ce délai, elle refuse toute connexion et
# coupe son AP de secours ; un redémarrage rouvre la fenêtre. Sans objet une fois la
# clé reçue : la fenêtre ne s'ouvre plus. Pendant la fenêtre, `reboot_timeout` est
# suspendu (la tablette attend d'être ajoutée au lieu de redémarrer).
provisioning:
  timeout: 30min
