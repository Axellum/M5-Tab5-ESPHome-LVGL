# ============================================================================
# [AI-CONTEXT]
# @file tab5-api-logic.yaml
# @role Contrat API avec Home Assistant (api: services:).
# @payload_contract Chaque service tab5_maj_* reçoit un payload d'une automation HA et doit
#                   appeler une fonction de tab5_custom.cpp pour traiter la donnée.
# @ui_mapping Les services mettent à jour l'UI en cascade via les fonctions C++.
# @ai_instruction Ne change pas les noms des services sans mettre à jour les automations
#                 HomeAssistant_Config/automations_tab5.yaml. Ne mets pas de logique LVGL
#                 directe ici : un service résout ses `id()`, pose ses globals et appelle une
#                 fonction de tab5_custom.cpp. Vérifié par tools/check_tab5_code_rules.py
#                 (pytest) : tout `lv_*` autre que lv_obj_has_flag fait échouer la suite.
# @metadata [2026.9.0] Chaque action porte une `description:`, et chaque variable la forme
#                 longue `type:` + `description:` + `example:` — c'est ce que Home Assistant
#                 affiche dans « Outils de développement → Actions », et le seul endroit où
#                 le format d'un payload sérialisé à la main se lit sans ouvrir ce fichier.
#                 Une action ou une variable sans métadonnées fait échouer `pytest`
#                 (règle 5 de tools/check_tab5_code_rules.py). Coût : des chaînes en flash,
#                 rien en RAM tant qu'aucune action n'est appelée.
# ============================================================================
api:

  encryption:

    key: !secret api_encryption_key

  # ═══════════════════════════════════════════════════════════════════════
  # Redémarrage automatique quand Home Assistant ne se connecte plus
  # ═══════════════════════════════════════════════════════════════════════
  # ESPHome redémarre l'appareil quand AUCUN client API n'est connecté pendant
  # cette durée. Le compteur repart à zéro à chaque connexion, même brève.
  #
  # [Audit F-04] `0s` = jamais de reboot, donc état « zombie » possible : pile
  # API figée, appareil en ligne mais muet, jusqu'à une intervention physique.
  # On garde donc un filet — la question n'est que sa durée.
  #
  # [Incident 31/07→01/08/2026] Le serveur HA a mis longtemps à démarrer. Le
  # Tab5, WiFi bon mais sans client API, a redémarré en boucle toutes les
  # ~15-20 min (15 min de timeout + boot + reconnexions, le compteur repartant
  # à chaque connexion brève de HA en cours de démarrage). Rien n'était cassé
  # côté appareil : c'est ce garde-fou qui s'exécutait, comme prévu.
  #
  # 60min est un compromis assumé : une panne/maintenance HA d'une heure ne
  # fait plus cycler la tablette (qui reste utile hors HA — horloge, arcade,
  # console diag, dernier état météo affiché), et le filet anti-zombie est
  # conservé. Ne pas repasser à `0s` sans relire l'audit F-04.
  reboot_timeout: 60min

  # Reconnexion de Home Assistant (redémarrage de HA, coupure Wi-Fi sans reboot) :
  # l'écran a besoin d'un push complet. Remplace le battement `interval: 5min` retiré
  # le 25/09/2026 (tab5-ha-hmi.yaml, audit lot 3). Au boot, on_boot émet déjà
  # l'événement et boot_complete est encore faux quand HA se connecte : pas de doublon.
  # Filtre client_info : `esphome logs` (« ESPHome Logs … ») ne relance pas le push.
  # 2 s + api.connected(state_subscription_only) : laisser HA finir son abonnement,
  # sinon l'événement part dans le vide. Côté HA, l'automation ne laisse passer
  # tab5_connected que si la liaison est `on` depuis moins de 3 min — vrai ici.
  on_client_connected:
    - if:
        condition:
          lambda: 'return id(boot_complete) && client_info.find("Home Assistant") != std::string::npos;'
        then:
          - delay: 2s
          - if:
              condition:
                api.connected:
                  state_subscription_only: true
              then:
                - homeassistant.event:
                    event: esphome.tab5_connected

  services:

    - service: tab5_maj_previsions_heures_bulk
      description: "Prévisions horaires : cinq créneaux en un appel (deux appels couvrent les dix heures affichées ; un bloc 10-14 est accepté mais jamais affiché)."
      variables:
        payload:
          type: string
          description: "Cinq créneaux « idx|heure|condition|température|pluie » séparés par ; — idx de 0 à 9 affichés (10 à 14 acceptés), condition = état météo Home Assistant."
          example: "0|14:00|sunny|21.4|0;1|15:00|cloudy|20.8|0.2;"
      then:
        - lambda: |-
            if (id(h4_time) == nullptr) return;
            // Bloc identique au précédent, ou pas à l'écran (calque journalier
            // affiché, autre page horaire) : rien à repeindre (audit 25/09, lot 3).
            const int fp = id(forecast_page_index);
            if (!accept_heures_bulk(payload, fp)) return;
            refresh_hourly_forecast(g_hour_slots, 1 - fp, id(font_meteo_card), id(font_meteo_card_small));
            // Les tuiles viennent de changer : le titre de la carte centrale annonce
            // leurs bornes, il doit suivre. No-op si ce titre n'est pas affiche.
            refresh_forecast_page_title_ui(fp, id(page_title_wrapper), id(lbl_page_title), g_central_ctx);

    - service: tab5_maj_previsions_jours_bulk
      description: "Prévisions journalières : les quinze jours en un seul appel. Le bandeau planning en est dérivé localement."
      variables:
        payload:
          type: string
          description: "Quinze jours « idx|libellé|condition|tmin|tmax|repos|dimanche|passé|heures » séparés par ; — repos, dimanche et passé valent 0 ou 1, heures vaut « HH:MM-HH:MM » ou reste vide."
          example: "0|Auj 17|sunny|12.1|24.3|0|0|0|;1|Ven 18|rainy|11.0|19.8|1|0|0|08:00-16:00;"
      then:
        - lambda: |-
            if (id(j0_day) == nullptr) return;
            // Quinze jours identiques au push précédent : ni analyse ni rendu. Sûr
            // pour le réveil — le contenu change au moins une fois par jour (libellés
            // des jours décalés), donc la date d'ancrage suit (audit 25/09, lot 3).
            if (push_unchanged(PushChannel::JOURS, payload.c_str(), payload.size())) return;
            parse_and_update_jours_bulk(payload);
            int fp = id(forecast_page_index);
            // Tuiles journalières repeintes seulement si leur calque est affiché
            // (pages 2-4) : apply_forecast_page() les repeint au changement de page.
            if (fp >= 2) {
              refresh_daily_forecast(g_day_slots, fp - 2, id(font_meteo_card), id(font_meteo_card_small));
              // Idem horaire : le titre annonce les bornes des 5 tuiles, il suit leur MAJ.
              refresh_forecast_page_title_ui(fp, id(page_title_wrapper), id(lbl_page_title), g_central_ctx);
            }
            // Les horaires de travail des 15 prochains jours viennent d'être
            // réécrits : c'est la source du mode « avant l'ouverture » du réveil.
            // Sans cette invalidation, la prochaine sonnerie resterait calculée
            // sur le planning précédent jusqu'au filet des 60 s.
            alarm_invalidate();
            // Bandeau planning dérivé localement (plus de push HA tab5_maj_planning)
            if (!id(is_showing_temp_planning) && id(lbl_planning_text) != nullptr) {
              std::string l1, l2;
              build_planning_lines_from_jours(l1, l2);
              update_planning_text_ui(id(lbl_planning_text), l1, l2,
                  id(plan_ligne_1), id(plan_ligne_2));
            }

    - service: tab5_maj_volet_etat
      description: "État du volet de la serre affiché sur sa carte."
      variables:
        etat_physique:
          type: string
          description: "État du volet : « En_mouvement » pendant une manœuvre, sinon le dernier état connu (Ouvert, Ferme, Stoppe…)."
          example: "En_mouvement"
      then:
        - lambda: |-
            if (id(icon_card_shutter_arrow) == nullptr) return;
            VoletUI ui{id(icon_card_shutter_arrow), id(icon_card_shutter1), id(icon_sw1), id(lbl_sw1_state)};
            id(volet_en_mouvement) = update_volet_ui(etat_physique, id(volet_target_open), ui);
        - if:
            condition:
              lambda: 'return etat_physique == "En_mouvement";'
            then:
              - micro_wake_word.enable_model:
                  id: stop
            else:
              # Pas de désarmement direct : la poussée arrive toutes les 10 min,
              # y compris pendant une sonnerie du réveil (audit du 26/09/2026, §2.1).
              - script.execute: tab5_stop_model_release

    - service: tab5_maj_clim
      description: "État de la climatisation du salon : carte d'accueil et popup."
      variables:
        target:
          type: string
          description: "Consigne en degrés Celsius."
          example: "21.5"
        current:
          type: string
          description: "Température mesurée par la climatisation, en degrés Celsius."
          example: "20.8"
        mode:
          type: string
          description: "Mode HVAC Home Assistant : off, cool, heat, dry, fan_only ou auto."
          example: "cool"
        preset:
          type: string
          description: "Préréglage Home Assistant, « none » s'il n'y en a pas."
          example: "boost"
        fan:
          type: string
          description: "Vitesse de ventilation."
          example: "auto"
        swing:
          type: string
          description: "Oscillation des volets."
          example: "off"
      then:
        - lambda: |-
            if (id(clim_target) == nullptr || id(clim_target_popup) == nullptr) return;
            float f_target = atof(target.c_str());
            float f_current = atof(current.c_str());
            id(clim_target_temp) = f_target;
            update_clim_from_ha_ui(id(clim_target), id(clim_target_popup), id(arc_temp_popup),
                id(val_temp_int_popup), f_target, f_current);
            id(clim_hvac_mode) = mode;
            id(clim_preset_mode) = preset;
            id(clim_fan_mode) = fan;
            id(clim_swing_mode) = swing;
        # Coloration des icônes déléguée au script centralisé tab5_clim_recolor
        # (tab5-scripts.yaml) — même code que les taps optimistes, une seule source
        # de vérité. Lit les 4 globals qu'on vient de poser ci-dessus.
        - script.execute: tab5_clim_recolor

    - service: tab5_maj_alerte_meteo_france
      description: "Phrase de prochaine pluie et les neuf vigilances Météo-France."
      variables:
        payload:
          type: string
          description: "Onze champs séparés par | : phrase de pluie, niveau global, puis Vent violent, Inondation, Orages, Pluie-inondation, Neige-verglas, Grand-froid, Vagues-submersion, Canicule et Avalanches — chacun Vert, Jaune, Orange ou Rouge."
          example: "Pas de pluie dans l'heure|Jaune|Vert|Vert|Jaune|Vert|Vert|Vert|Vert|Vert|Vert"
      then:
        - lambda: |-
            if (id(lbl_proc_pluie) == nullptr) return;
            // Identique au précédent : has_mf_alerts garde sa valeur (audit 25/09, lot 3).
            if (push_unchanged(PushChannel::VIGILANCE, payload.c_str(), payload.size())) return;
            // 11 champs « | » : phrase pluie, vigilance globale, puis 9 phénomènes
            // (vent, inondation, orages, pluie-inondation, neige-verglas, grand
            // froid, vagues-submersion, canicule, avalanches). Découpage, couleur
            // de la date et 4 slots d'icônes : parse_and_update_vigilance().
            VigilanceUI ui{id(lbl_proc_pluie), id(lbl_pluie_val), id(lbl_pluie_unit), id(lbl_date),
                           {id(alerte_slot_0), id(alerte_slot_1), id(alerte_slot_2), id(alerte_slot_3)}};
            g_central_ctx.has_mf_alerts = parse_and_update_vigilance(payload, ui);

    # `uv` et `gel` sont reçus mais non exploités par l'UI : paramètres RÉSERVÉS.
    # Le contrat a 3 appelants côté HA, on ne le rétrécit pas ; seule `neige` agit
    # (flocon si probabilité ≥ 5, sinon goutte colorée par l'hygrométrie).
    - service: tab5_maj_probabilites
      description: "Probabilités UV, gel et neige. Seule « neige » agit aujourd'hui ; « uv » et « gel » sont des paramètres réservés."
      variables:
        uv:
          type: string
          description: "Indice UV. Reçu mais pas affiché : paramètre réservé, le contrat n'est pas rétréci."
          example: "4"
        gel:
          type: string
          description: "Probabilité de gel en pourcent. Reçue mais pas affichée : paramètre réservé."
          example: "0"
        neige:
          type: string
          description: "Probabilité de neige en pourcent : l'icône devient un flocon à partir de 5."
          example: "0"
      then:
        - lambda: |-
            if (id(j0_day) == nullptr) return;
            id(global_neige) = atoi(neige.c_str());
            update_rain_predict_icon_ui(id(icon_rain_predict), id(global_neige), (float) id(global_humidite));

    # `condition` et `temperature` sont reçus mais non exploités : paramètres
    # RÉSERVÉS depuis le retrait de la grosse icône météo centrale (même raison,
    # contrat conservé). Seule `humidite` agit, sur la couleur de la goutte.
    - service: tab5_maj_meteo_actuelle
      description: "Conditions du moment. Seule « humidite » agit depuis le retrait de la grande icône météo centrale ; les deux autres sont réservées."
      variables:
        condition:
          type: string
          description: "Condition météo Home Assistant. Reçue mais pas affichée : paramètre réservé."
          example: "sunny"
        temperature:
          type: string
          description: "Température extérieure en degrés Celsius. Reçue mais pas affichée : paramètre réservé."
          example: "22.4"
        humidite:
          type: string
          description: "Hygrométrie en pourcent : elle colore la goutte de la carte centrale."
          example: "68"
      then:
        - lambda: |-
            if (id(icon_rain_predict) == nullptr) return;
            id(global_humidite) = atof(humidite.c_str());
            update_rain_predict_icon_ui(id(icon_rain_predict), id(global_neige), (float) id(global_humidite));

    # Les 9 barres en UN appel (ADR-0003, audit §4.1 point 3) : payload
    # « idx|intensité;idx|intensité;… », idx 0..8 = 0,5,10,15,20,25 puis 35,45,55 min,
    # intensité = libellé Météo-France (« Temps sec », « Pluie faible » … « Pluie très
    # forte »). Seul contrat depuis le 08/09/2026 : l'ancien tab5_maj_pluie_1h (une barre
    # par appel, 9 appels par rafraîchissement) a été retiré le même jour.
    - service: tab5_maj_pluie_1h_bulk
      description: "Les neuf barres de pluie de l'heure qui vient, en un appel."
      variables:
        payload:
          type: string
          description: "Neuf barres « idx|intensité » séparées par ; — idx de 0 à 8 pour 0, 5, 10, 15, 20, 25, 35, 45 et 55 minutes, intensité = libellé Météo-France."
          example: "0|Temps sec;1|Pluie faible;2|Pluie modérée;"
      then:
        - lambda: |-
            if (id(rb_0_in) == nullptr) return;
            // Identique au précédent : has_rain garde sa valeur (audit 25/09, lot 3).
            if (push_unchanged(PushChannel::PLUIE, payload.c_str(), payload.size())) return;
            lv_obj_t* const bars[9] = {id(rb_0_in), id(rb_1_in), id(rb_2_in), id(rb_3_in), id(rb_4_in),
                                       id(rb_5_in), id(rb_6_in), id(rb_7_in), id(rb_8_in)};
            g_central_ctx.has_rain = update_rain_bars_bulk_ui(payload, bars);

    # Zone d'info de la carte centrale (panneau 3 du rotateur, cf. tab5-globals.yaml) :
    # récap calendrier 3 jours (multi-lignes avec recolor #hex ...#) ou alerte météo
    # (1 ligne). Alimenté par automations_tab5.yaml section 7 (texte + couleur Rouge/Orange/Blanc).
    - service: tab5_maj_info_texte
      description: "Zone d'info de la carte centrale : récapitulatif du calendrier sur trois jours, ou alerte météo."
      variables:
        texte:
          type: string
          description: "Texte affiché, sur une ou plusieurs lignes. Un fragment entouré de « #RRGGBB » et « # » prend cette couleur."
          example: "Jeu : TRAVAIL 08:00-16:00"
        couleur:
          type: string
          description: "Couleur du texte : Rouge, Orange ou Blanc."
          example: "Blanc"
        meteo_id:
          type: string
          description: "Identifiant d'acquittement du bandeau : un tap le masque jusqu'au prochain identifiant. Vide = bandeau non masquable. À fournir même vide."
          example: "meteo:orange"
      then:
        - lambda: |-
            id(info_meteo_dismiss_id) = meteo_id;
            // Empreinte sur les trois champs ET les acquittements locaux : un tap sur
            // la dalle change ce qui s'affiche pour un même texte (audit 25/09, lot 3).
            // (variables d'action = esphome::StringRef : pas d'operator+ avec un char,
            // d'où la construction par +=.)
            std::string cle = texte.str();
            cle += '\x1f';
            cle += couleur;
            cle += '\x1f';
            cle += meteo_id;
            cle += '\x1f';
            cle += id(tab5_dismissed_local);
            if (push_unchanged(PushChannel::INFO, cle)) return;
            update_info_text_ui(id(lbl_info_text), id(info_wrapper), id(planning_wrapper),
                texte, couleur, meteo_id, id(tab5_dismissed_local), g_central_ctx.has_info, g_central_ctx.current_panel,
                id(roboto_32_b), id(roboto_45_b));

    - service: tab5_maj_reponse_vocale
      description: "Réponse vocale courte, affichée sous l'assistant sur l'écran d'accueil."
      variables:
        texte:
          type: string
          description: "Texte de la réponse, en clair."
          example: "Il fait 21 degrés dans le salon."
      then:
        - script.execute:
            id: tab5_show_vocal_response
            texte: !lambda 'return texte;'

    # Réponse "riche" du moteur pour le popup Assistant vocal : texte Markdown
    # (tableaux pris en charge, alignés en monospace) + URL d'image optionnelle.
    # image_url vide => zone image masquée. Ouvre le popup automatiquement.
    - service: tab5_assist_reponse
      description: "Réponse riche du moteur dans le popup Assistant vocal, qui s'ouvre automatiquement."
      variables:
        texte:
          type: string
          description: "Réponse en Markdown ; les tableaux sont réalignés en monospace à l'écran."
          example: "**Salon** : 21 degrés"
        image_url:
          type: string
          description: "URL d'une image PNG à afficher sous le texte. Vide : la zone image reste masquée."
          example: "http://moteur.local:8000/images/graphe.png"
      then:
        - lambda: |-
            assist_set_response(id(lbl_assist_response), texte,
                assist_font(id(assist_text_size), id(roboto_mono_20), id(roboto_mono_24), id(roboto_mono_28)));
        - if:
            condition:
              lambda: 'return !image_url.empty();'
            then:
              - lambda: 'assist_image_state_ui(id(assist_img_hint), id(assist_img_widget), AssistImage::LOADING);'
              - online_image.set_url:
                  id: assist_response_image
                  url: !lambda 'return image_url;'
            else:
              - lambda: 'assist_image_state_ui(id(assist_img_hint), id(assist_img_widget), AssistImage::NONE);'
        - script.execute: tab5_assist_open

    - service: tab5_maj_alertes_ha_bulk
      description: "Bandeau des alertes Home Assistant du rotateur 8 s : quatre au maximum, en un appel."
      variables:
        payload:
          type: string
          description: "Jusqu'à quatre alertes « id|couleur|libellé » séparées par ; — couleur Rouge ou Orange, id renvoyé tel quel à l'acquittement quand l'écran est tapé."
          example: "update.home_assistant_core_update|Rouge|1 MAJ · Home Assistant Core;ha:unavailable|Orange|3 indispo"
      then:
        - lambda: |-
            // Même empreinte que le bandeau info : payload + acquittements locaux
            // (tab5_dismissed_local filtre les slots au rendu) — audit 25/09, lot 3.
            std::string cle = payload.str();
            cle += '\x1f';
            cle += id(tab5_dismissed_local);
            if (push_unchanged(PushChannel::ALERTES_HA, cle)) return;
            HaAlertSlotUI slots[4] = {
              {id(ha_alert_wrapper_0), id(lbl_ha_alert_0), &id(ha_alert_id_0)},
              {id(ha_alert_wrapper_1), id(lbl_ha_alert_1), &id(ha_alert_id_1)},
              {id(ha_alert_wrapper_2), id(lbl_ha_alert_2), &id(ha_alert_id_2)},
              {id(ha_alert_wrapper_3), id(lbl_ha_alert_3), &id(ha_alert_id_3)},
            };
            parse_and_update_ha_alerts_bulk(payload, slots, g_central_ctx,
                id(tab5_dismissed_local));

    # Conservé pour compat (anciennes automations) — le bandeau est désormais dérivé
    # localement après tab5_maj_previsions_jours_bulk via build_planning_lines_from_jours().
    - service: tab5_maj_planning
      description: "Bandeau planning. Conservé pour compatibilité : depuis le 08/09/2026 le firmware le dérive lui-même des prévisions journalières."
      variables:
        ligne1:
          type: string
          description: "Première ligne du bandeau."
          example: "Auj : TRAVAIL 08:00-16:00"
        ligne2:
          type: string
          description: "Seconde ligne du bandeau."
          example: "Demain : repos"
      then:
        - lambda: |-
            if (id(lbl_planning_text) == nullptr) return;
            update_planning_text_ui(id(lbl_planning_text), ligne1, ligne2,
                id(plan_ligne_1), id(plan_ligne_2));

    # Réveil — liste des prochains rendez-vous, poussée par
    # script.tab5_rdv_prochains (HomeAssistant_Config/packages/tab5_reveil.yaml).
    # payload = "epoch|titre~epoch|titre~…" (epoch UTC du début, max 8 entrées,
    # titres déjà nettoyés des séparateurs côté HA). Le firmware garde la liste
    # et déclenche l'annonce LUI-MÊME à la seconde près : une coupure HA entre la
    # poussée et l'échéance ne fait pas rater l'annonce. Un rendez-vous déjà
    # annoncé le reste après une nouvelle poussée (appariement par epoch dans
    # rdv_store), sinon le rappel repartirait toutes les 5 minutes.
    - service: tab5_maj_rdv_prochains
      description: "Liste des prochains rendez-vous. Le firmware la garde et déclenche l'annonce lui-même : une coupure Home Assistant ne la fait pas rater."
      variables:
        payload:
          type: string
          description: "Jusqu'à huit entrées « epoch|titre » séparées par ~ — epoch UTC du début, titres déjà nettoyés de leurs séparateurs."
          example: "1789552800|Dentiste~1789639200|Réunion équipe"
      then:
        - lambda: |-
            rdv_store(payload);
            id(tab5_rdv_next_sensor).update();

    # Popup calendrier — réponse de script.tab5_calendrier_mois (HA) : codes = 62 hex
    # (2/jour, bits 1 travail, 2 férié, 4 vacances scolaires, 8 RDV, 16 anniversaire),
    # heures = 31 champs "HH:MM-HH:MM" séparés par |, details = 31 champs "type|texte;..."
    # séparés par ~ (détail jour embarqué → tap instantané sans round-trip).
    # Mis en cache ; re-rendu seulement si le popup est ouvert sur ce mois.
    - service: tab5_maj_calendrier_mois
      description: "Enrichit un mois du popup calendrier. La réponse est mise en cache et re-rendue seulement si le popup est ouvert sur ce mois."
      variables:
        annee:
          type: string
          description: "Année sur quatre chiffres."
          example: "2026"
        mois:
          type: string
          description: "Mois, de 1 à 12."
          example: "9"
        codes:
          type: string
          description: "Soixante-deux caractères hexadécimaux, deux par jour : bits 1 travail, 2 férié, 4 vacances scolaires, 8 rendez-vous, 16 anniversaire."
          example: "010400000000000000…"
        heures:
          type: string
          description: "Trente-et-un champs « HH:MM-HH:MM » séparés par | — champ vide les jours sans horaire de travail."
          example: "08:00-16:00||14:00-22:00|…"
        details:
          type: string
          description: "Trente-et-un champs séparés par ~, chacun « type|texte;… » : le détail de chaque jour est embarqué, un tap l'affiche sans aller-retour."
          example: "travail|08:00-16:00~~ferie|Toussaint~…"
      then:
        - lambda: |-
            if (id(lbl_cal_month) == nullptr) return;
            cal_store_month_data(annee, mois, codes, heures, details);
        - if:
            condition:
              lambda: |-
                return id(lbl_cal_month) != nullptr
                    && !lv_obj_has_flag(id(calendar_popup), LV_OBJ_FLAG_HIDDEN)
                    && atoi(annee.c_str()) == id(cal_view_year)
                    && atoi(mois.c_str()) == id(cal_view_month);
            then:
              - script.execute: tab5_cal_render

    # Popup calendrier — réponse de script.tab5_calendrier_jour (HA) : payload =
    # "type|texte;..." (types travail/ferie/vacances/rdv/anniv/fete, max 6 lignes).
    # Ignoré si le détail affiché ne correspond plus à cette date (navigation rapide).
    - service: tab5_maj_calendrier_jour
      description: "Détail d'un jour du popup calendrier, en réponse au tap sur une cellule. Ignoré si l'affichage a changé de date entre-temps."
      variables:
        date:
          type: string
          description: "Date demandée, au format AAAA-MM-JJ."
          example: "2026-09-17"
        payload:
          type: string
          description: "Jusqu'à six lignes « type|texte » séparées par ; — types travail, ferie, vacances, rdv, anniv et fete."
          example: "travail|08:00-16:00;rdv|Dentiste 14:30"
      then:
        - lambda: |-
            if (id(lbl_cal_day_status) == nullptr) return;
            if (lv_obj_has_flag(id(cal_day_popup), LV_OBJ_FLAG_HIDDEN)) return;
            if (id(cal_detail_date) != date) return;
            CalDetailLineUI lines[6] = {
                {id(cal_det_icon_0), id(cal_det_txt_0)},
                {id(cal_det_icon_1), id(cal_det_txt_1)},
                {id(cal_det_icon_2), id(cal_det_txt_2)},
                {id(cal_det_icon_3), id(cal_det_txt_3)},
                {id(cal_det_icon_4), id(cal_det_txt_4)},
                {id(cal_det_icon_5), id(cal_det_txt_5)}
            };
            cal_render_day_detail(payload, id(lbl_cal_day_status), lines);
