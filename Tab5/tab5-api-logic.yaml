# ============================================================================
# [AI-CONTEXT]
# @file tab5-api-logic.yaml
# @role Contrat API avec Home Assistant (api: services:).
# @payload_contract Chaque service tab5_maj_* reçoit un payload d'une automation HA et doit
#                   appeler une fonction de tab5_custom.cpp pour traiter la donnée.
# @ui_mapping Les services mettent à jour l'UI en cascade via les fonctions C++.
# @ai_instruction Ne change pas les noms des services sans mettre à jour les automations 
#                 HomeAssistant_Config/automations_tab5.yaml. Ne mets pas de logique LVGL directe ici.
# ============================================================================
api:

  encryption:

    key: !secret api_encryption_key

  # ═══════════════════════════════════════════════════════════════════════
  # Redémarrage automatique quand Home Assistant ne se connecte plus
  # ═══════════════════════════════════════════════════════════════════════
  # ESPHome redémarre l'appareil quand AUCUN client API n'est connecté pendant
  # cette durée. Le compteur repart à zéro à chaque connexion, même brève.
  #
  # [Audit F-04] `0s` = jamais de reboot, donc état « zombie » possible : pile
  # API figée, appareil en ligne mais muet, jusqu'à une intervention physique.
  # On garde donc un filet — la question n'est que sa durée.
  #
  # [Incident 31/07→01/08/2026] Le serveur HA a mis longtemps à démarrer. Le
  # Tab5, WiFi bon mais sans client API, a redémarré en boucle toutes les
  # ~15-20 min (15 min de timeout + boot + reconnexions, le compteur repartant
  # à chaque connexion brève de HA en cours de démarrage). Rien n'était cassé
  # côté appareil : c'est ce garde-fou qui s'exécutait, comme prévu.
  #
  # 60min est un compromis assumé : une panne/maintenance HA d'une heure ne
  # fait plus cycler la tablette (qui reste utile hors HA — horloge, arcade,
  # console diag, dernier état météo affiché), et le filet anti-zombie est
  # conservé. Ne pas repasser à `0s` sans relire l'audit F-04.
  reboot_timeout: 60min

  services:

    - service: tab5_maj_previsions_heures_bulk
      variables:
        payload: string
      then:
        - lambda: |-
            if (id(h4_time) == nullptr) return;
            parse_and_update_heures_bulk(payload);
            int fp = id(forecast_page_index);
            int hourly_pi = (fp < 2) ? (1 - fp) : 0;
            refresh_hourly_forecast(g_hour_slots, hourly_pi, id(font_meteo_main), id(font_meteo_card), id(font_meteo_main_small), id(font_meteo_card_small));
            // Les tuiles viennent de changer : le titre de la carte centrale annonce
            // leurs bornes, il doit suivre. No-op si ce titre n'est pas affiche.
            refresh_forecast_page_title_ui(fp, id(page_title_wrapper), id(lbl_page_title), g_central_ctx);

    - service: tab5_maj_previsions_jours_bulk
      variables:
        payload: string
      then:
        - lambda: |-
            if (id(j0_day) == nullptr) return;
            parse_and_update_jours_bulk(payload);
            int fp = id(forecast_page_index);
            int daily_pi = (fp >= 2) ? (fp - 2) : 0;
            refresh_daily_forecast(g_day_slots, daily_pi, id(font_meteo_main), id(font_meteo_card), id(font_meteo_main_small), id(font_meteo_card_small));
            // Idem horaire : le titre annonce les bornes des 5 tuiles, il suit leur MAJ.
            refresh_forecast_page_title_ui(fp, id(page_title_wrapper), id(lbl_page_title), g_central_ctx);
            // Les horaires de travail des 15 prochains jours viennent d'être
            // réécrits : c'est la source du mode « avant l'ouverture » du réveil.
            // Sans cette invalidation, la prochaine sonnerie resterait calculée
            // sur le planning précédent jusqu'au filet des 60 s.
            alarm_invalidate();
            // Bandeau planning dérivé localement (plus de push HA tab5_maj_planning)
            if (!id(is_showing_temp_planning) && id(lbl_planning_text) != nullptr) {
              std::string l1, l2;
              build_planning_lines_from_jours(l1, l2);
              update_planning_text_ui(id(lbl_planning_text), l1, l2,
                  id(plan_ligne_1), id(plan_ligne_2));
            }

    - service: tab5_maj_volet_etat

      variables:

        etat_physique: string

      then:

        - lambda: |-

            if (id(icon_card_shutter_arrow) == nullptr) return;

            if (etat_physique == "En_mouvement") {

              id(volet_en_mouvement) = true;

              lv_label_set_text(id(icon_card_shutter_arrow), "\U000F03E4");

              lv_obj_set_style_text_color(id(icon_card_shutter_arrow), lv_color_hex(UIColor::INFO), LV_PART_MAIN);

              if (id(icon_sw1) != nullptr && id(lbl_sw1_state) != nullptr) {
                lv_obj_set_style_text_color(id(icon_sw1), lv_color_hex(UIColor::INFO), LV_PART_MAIN);
                lv_label_set_text(id(lbl_sw1_state), "Mouvement");
                lv_obj_set_style_text_color(id(lbl_sw1_state), lv_color_hex(UIColor::INFO), LV_PART_MAIN);
              }

            } else {

              id(volet_en_mouvement) = false;

              if (id(volet_target_open)) {

                lv_label_set_text(id(icon_card_shutter_arrow), "\U000F005D");

              } else {

                lv_label_set_text(id(icon_card_shutter_arrow), "\U000F0045");

              }

              lv_obj_set_style_text_color(id(icon_card_shutter_arrow), lv_color_hex(UIColor::TEXT_DIM), LV_PART_MAIN);

              

              if (etat_physique == "Ouvert" || etat_physique == "Partiel" || etat_physique == "open") {

                lv_label_set_text(id(icon_card_shutter1), "\U000F111E");

                lv_obj_set_style_text_color(id(icon_card_shutter1), lv_color_hex(UIColor::SUCCESS), LV_PART_MAIN);

                if (id(icon_sw1) != nullptr && id(lbl_sw1_state) != nullptr) {
                  lv_obj_set_style_text_color(id(icon_sw1), lv_color_hex(UIColor::SUCCESS), LV_PART_MAIN);
                  lv_label_set_text(id(lbl_sw1_state), "Ouvert");
                  lv_obj_set_style_text_color(id(lbl_sw1_state), lv_color_hex(UIColor::SUCCESS), LV_PART_MAIN);
                }

              } else if (etat_physique == "Ferme" || etat_physique == "closed") {

                lv_label_set_text(id(icon_card_shutter1), "\U000F111C");

                lv_obj_set_style_text_color(id(icon_card_shutter1), lv_color_hex(UIColor::ERROR), LV_PART_MAIN);

                if (id(icon_sw1) != nullptr && id(lbl_sw1_state) != nullptr) {
                  lv_obj_set_style_text_color(id(icon_sw1), lv_color_hex(UIColor::TEXT_DIM), LV_PART_MAIN);
                  lv_label_set_text(id(lbl_sw1_state), "Fermé");
                  lv_obj_set_style_text_color(id(lbl_sw1_state), lv_color_hex(UIColor::TEXT_DIM), LV_PART_MAIN);
                }

              }

            }

        - if:
            condition:
              lambda: 'return etat_physique == "En_mouvement";'
            then:
              - micro_wake_word.enable_model:
                  id: stop
            else:
              - micro_wake_word.disable_model:
                  id: stop

    - service: tab5_maj_clim
      variables:
        target: string
        current: string
        mode: string
        preset: string
        fan: string
        swing: string
      then:
        - lambda: |-
            if (id(clim_target) == nullptr || id(clim_target_popup) == nullptr) return;

            float f_target = atof(target.c_str());
            float f_current = atof(current.c_str());

            id(clim_target_temp) = f_target;
            char buf_target[16];
            sprintf(buf_target, "%.1f", f_target);
            lv_label_set_text(id(clim_target), buf_target);
            lv_label_set_text(id(clim_target_popup), buf_target);
            lv_arc_set_value(id(arc_temp_popup), (int)f_target);

            char buf_curr[16];
            sprintf(buf_curr, "%.1f \xC2\xB0""C", f_current);
            lv_label_set_text(id(val_temp_int_popup), buf_curr);

            id(clim_hvac_mode) = mode;

            id(clim_preset_mode) = preset;

            id(clim_fan_mode) = fan;

            id(clim_swing_mode) = swing;
        # Coloration des icônes déléguée au script centralisé tab5_clim_recolor
        # (tab5-scripts.yaml) — même code que les taps optimistes, une seule source
        # de vérité. Lit les 4 globals qu'on vient de poser ci-dessus.
        - script.execute: tab5_clim_recolor

    - service: tab5_maj_alerte_meteo_france
      variables:
        payload: string
      then:
        - lambda: |-
            if (id(lbl_proc_pluie) == nullptr) return;
            // 1024 (etait 512) : la phrase de vigilance Meteo-France peut etre longue,
            // un payload complet (11 champs pipe-delimited) depassait parfois 512 et
            // tronquait silencieusement les derniers champs (#T165).
            char buf[1024];
            strncpy(buf, payload.c_str(), sizeof(buf)-1);
            buf[sizeof(buf)-1] = '\0';
            char* saveptr;
            char* phrase_pluie = strtok_r(buf, "|", &saveptr);
            char* globale = strtok_r(NULL, "|", &saveptr);
            char* vent = strtok_r(NULL, "|", &saveptr);
            char* inondation = strtok_r(NULL, "|", &saveptr);
            char* orages = strtok_r(NULL, "|", &saveptr);
            char* pluie_inondation = strtok_r(NULL, "|", &saveptr);
            char* neige_verglas = strtok_r(NULL, "|", &saveptr);
            char* grand_froid = strtok_r(NULL, "|", &saveptr);
            char* vagues_submersion = strtok_r(NULL, "|", &saveptr);
            char* canicule = strtok_r(NULL, "|", &saveptr);
            char* avalanches = strtok_r(NULL, "|", &saveptr);

            if (!phrase_pluie) phrase_pluie = (char*)"";
            if (!globale) globale = (char*)"";
            
            update_rain_phrase_ui(id(lbl_proc_pluie), std::string(phrase_pluie));
            lv_obj_add_flag(id(lbl_pluie_val), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_pluie_unit), LV_OBJ_FLAG_HIDDEN);

            // Couleur de la date selon vigilance globale
            uint32_t col_date = UIColor::SUCCESS;
            if (strcmp(globale, "Jaune") == 0) col_date = UIColor::ALERT_DATE_YELLOW;
            else if (strcmp(globale, "Orange") == 0) col_date = UIColor::ALERT_DATE_ORANGE;
            else if (strcmp(globale, "Rouge") == 0) col_date = UIColor::ALERT_DATE_RED;
            lv_obj_set_style_text_color(id(lbl_date), lv_color_hex(col_date), LV_PART_MAIN);

            // Filtrage statique
            struct AlertEntry { const char* icon; const char* level; };
            constexpr size_t MAX_ALERTES = 4;
            AlertEntry actives[MAX_ALERTES];
            size_t active_count = 0;

            auto check_alert = [&](const char* state, const char* icon_code) {
              if (active_count >= MAX_ALERTES) return;
              if (!state || strcmp(state, "Vert") == 0 || strlen(state) == 0 || strcmp(state, "unknown") == 0) return;
              actives[active_count].icon  = icon_code;
              actives[active_count].level = state;
              ++active_count;
            };

            check_alert(vent, "\U000F059D");
            check_alert(inondation, "\U000F0EFA");
            check_alert(orages, "\U000F0593");
            check_alert(pluie_inondation, "\U000F0596");
            check_alert(neige_verglas, "\U000F0F36");
            check_alert(grand_froid, "\U000F0F29");
            check_alert(vagues_submersion, "\U000F078D");
            check_alert(canicule, "\U000F0E01");
            check_alert(avalanches, "\U000F067E");

            id(has_alerts) = (active_count > 0);
            
            lv_obj_t* slots[] = {id(alerte_slot_0), id(alerte_slot_1), id(alerte_slot_2), id(alerte_slot_3)};
            for (size_t i = 0; i < 4; i++) {
              if (i < active_count) {
                lv_label_set_text(slots[i], actives[i].icon);
                uint32_t c = UIColor::ALERT_YELLOW;
                if (strcmp(actives[i].level, "Orange") == 0) c = UIColor::WARNING;
                else if (strcmp(actives[i].level, "Rouge") == 0) c = UIColor::ALERT_RED;
                lv_obj_set_style_text_color(slots[i], lv_color_hex(c), LV_PART_MAIN);
                lv_obj_set_style_text_opa(slots[i], 255, LV_PART_MAIN);
                lv_obj_clear_flag(slots[i], LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_add_flag(slots[i], LV_OBJ_FLAG_HIDDEN);
              }
            }


    - service: tab5_maj_probabilites
      variables:
        uv: string
        gel: string
        neige: string
      then:
        - lambda: |-
            if (id(j0_day) == nullptr) return;
            
            int i_uv = atoi(uv.c_str());
            int i_gel = atoi(gel.c_str());
            int i_neige = atoi(neige.c_str());
            
            id(global_neige) = i_neige;
            
            if(i_neige >= 5) {
              lv_label_set_text(id(icon_rain_predict), "\U000F0598");
              lv_obj_set_style_text_color(id(icon_rain_predict), lv_color_hex(UIColor::WARNING), LV_PART_MAIN);
            } else {
              lv_label_set_text(id(icon_rain_predict), "\U000F0597");
              uint32_t c_hydro = get_humidity_color((float)id(global_humidite));
              lv_obj_set_style_text_color(id(icon_rain_predict), lv_color_hex(c_hydro), LV_PART_MAIN);
            }

    - service: tab5_maj_meteo_actuelle
      variables:
        condition: string
        temperature: string
        humidite: string
      then:
        - lambda: |-
            if (id(icon_rain_predict) == nullptr) return;

            id(global_humidite) = atof(humidite.c_str());

            if (id(global_neige) < 5) {
              uint32_t c_hydro = get_humidity_color((float)id(global_humidite)); // AXE2: factorisation
              lv_obj_set_style_text_color(id(icon_rain_predict), lv_color_hex(c_hydro), LV_PART_MAIN);
            }



    - service: tab5_maj_pluie_1h
      variables:
        index_5mn: string
        intensite: string
      then:
        - lambda: |-
            if (id(rb_0_in) == nullptr) return;
            int idx = atoi(index_5mn.c_str());

            uint32_t c_empty = UIColor::CLIM_TRACK_INACTIVE;
            uint32_t c_faible = UIColor::RAIN_LIGHT;
            uint32_t c_modere = UIColor::RAIN_MODERATE;
            uint32_t c_forte = UIColor::RAIN_HEAVY;
            uint32_t c_tres_forte = UIColor::RAIN_EXTREME;

            uint32_t c = c_empty;
            int h = 0;

            if (intensite == "Pluie faible") { c = c_faible; h = 13; } // ~1/4 hauteur
            else if (intensite == "Pluie modérée") { c = c_modere; h = 25; } // 1/2 hauteur
            else if (intensite == "Pluie forte") { c = c_forte; h = 38; } // 3/4 hauteur
            else if (intensite == "Pluie très forte" || intensite == "Pluie trés forte") { c = c_tres_forte; h = 50; } // hauteur max

            lv_obj_t* target = NULL;

            switch(idx) {
              case 0: target = id(rb_0_in); break;
              case 1: target = id(rb_1_in); break;
              case 2: target = id(rb_2_in); break;
              case 3: target = id(rb_3_in); break;
              case 4: target = id(rb_4_in); break;
              case 5: target = id(rb_5_in); break;
              case 6: target = id(rb_6_in); break;
              case 7: target = id(rb_7_in); break;
              case 8: target = id(rb_8_in); break;
            }

            if(target != NULL) {
              lv_obj_set_style_bg_color(target, lv_color_hex(c), LV_PART_MAIN);
              lv_obj_set_height(target, h);
            }
            
            bool is_raining = false;
            lv_obj_t* targets[] = {id(rb_0_in), id(rb_1_in), id(rb_2_in), id(rb_3_in), id(rb_4_in), id(rb_5_in), id(rb_6_in), id(rb_7_in), id(rb_8_in)};
            for(int i=0; i<9; i++) {
               if (lv_obj_get_height(targets[i]) > 0) is_raining = true;
            }
            id(has_rain) = is_raining;

    # Zone d'info de la carte centrale (panneau 3 du rotateur, cf. tab5-globals.yaml) :
    # récap calendrier 3 jours (multi-lignes avec recolor #hex ...#) ou alerte météo
    # (1 ligne). Alimenté par automations_tab5.yaml section 7 (texte + couleur Rouge/Orange/Blanc).
    - service: tab5_maj_info_texte
      variables:
        texte: string
        couleur: string
        meteo_id: string
      then:
        - lambda: |-
            id(info_meteo_dismiss_id) = meteo_id;
            update_info_text_ui(id(lbl_info_text), id(info_wrapper), id(planning_wrapper),
                texte, couleur, meteo_id, id(tab5_dismissed_local), id(has_info), id(current_central_panel),
                id(roboto_32_b), id(roboto_45_b));

    - service: tab5_maj_reponse_vocale
      variables:
        texte: string
      then:
        - script.execute:
            id: tab5_show_vocal_response
            texte: !lambda 'return texte;'

    # Réponse "riche" du moteur pour le popup Assistant vocal : texte Markdown
    # (tableaux pris en charge, alignés en monospace) + URL d'image optionnelle.
    # image_url vide => zone image masquée. Ouvre le popup automatiquement.
    - service: tab5_assist_reponse
      variables:
        texte: string
        image_url: string
      then:
        - lambda: |-
            esphome::font::Font* f = id(assist_text_size) == 0 ? id(roboto_mono_20)
                                   : (id(assist_text_size) == 2 ? id(roboto_mono_28) : id(roboto_mono_24));
            assist_set_response(id(lbl_assist_response), texte, f);
        - if:
            condition:
              lambda: 'return !image_url.empty();'
            then:
              - lambda: |-
                  if (id(assist_img_hint) != nullptr) {
                    lv_label_set_text(id(assist_img_hint), "Chargement image...");
                    lv_obj_clear_flag(id(assist_img_hint), LV_OBJ_FLAG_HIDDEN);
                  }
                  if (id(assist_img_widget) != nullptr) lv_obj_add_flag(id(assist_img_widget), LV_OBJ_FLAG_HIDDEN);
              - online_image.set_url:
                  id: assist_response_image
                  url: !lambda 'return image_url;'
            else:
              - lambda: |-
                  if (id(assist_img_widget) != nullptr) lv_obj_add_flag(id(assist_img_widget), LV_OBJ_FLAG_HIDDEN);
                  if (id(assist_img_hint) != nullptr) lv_obj_add_flag(id(assist_img_hint), LV_OBJ_FLAG_HIDDEN);
        - script.execute: tab5_assist_open

    - service: tab5_maj_alertes_ha_bulk
      variables:
        payload: string
      then:
        - lambda: |-
            HaAlertSlotUI slots[4] = {
              {id(ha_alert_wrapper_0), id(lbl_ha_alert_0), &id(has_ha_alert_0), &id(ha_alert_id_0)},
              {id(ha_alert_wrapper_1), id(lbl_ha_alert_1), &id(has_ha_alert_1), &id(ha_alert_id_1)},
              {id(ha_alert_wrapper_2), id(lbl_ha_alert_2), &id(has_ha_alert_2), &id(ha_alert_id_2)},
              {id(ha_alert_wrapper_3), id(lbl_ha_alert_3), &id(has_ha_alert_3), &id(ha_alert_id_3)},
            };
            g_central_ctx.has_rain = id(has_rain);
            g_central_ctx.has_mf_alerts = id(has_alerts);
            g_central_ctx.has_info = id(has_info);
            g_central_ctx.has_ha[0] = id(has_ha_alert_0);
            g_central_ctx.has_ha[1] = id(has_ha_alert_1);
            g_central_ctx.has_ha[2] = id(has_ha_alert_2);
            g_central_ctx.has_ha[3] = id(has_ha_alert_3);
            g_central_ctx.current_panel = id(current_central_panel);
            parse_and_update_ha_alerts_bulk(payload, slots, g_central_ctx,
                id(roboto_45_b), id(tab5_dismissed_local));
            id(has_ha_alert_0) = g_central_ctx.has_ha[0];
            id(has_ha_alert_1) = g_central_ctx.has_ha[1];
            id(has_ha_alert_2) = g_central_ctx.has_ha[2];
            id(has_ha_alert_3) = g_central_ctx.has_ha[3];
            id(current_central_panel) = g_central_ctx.current_panel;

    # Conservé pour compat (anciennes automations) — le bandeau est désormais dérivé
    # localement après tab5_maj_previsions_jours_bulk via build_planning_lines_from_jours().
    - service: tab5_maj_planning
      variables:
        ligne1: string
        ligne2: string
      then:
        - lambda: |-
            if (id(lbl_planning_text) == nullptr) return;
            update_planning_text_ui(id(lbl_planning_text), ligne1, ligne2,
                id(plan_ligne_1), id(plan_ligne_2));

    # Réveil — liste des prochains rendez-vous, poussée par
    # script.tab5_rdv_prochains (HomeAssistant_Config/packages/tab5_reveil.yaml).
    # payload = "epoch|titre~epoch|titre~…" (epoch UTC du début, max 8 entrées,
    # titres déjà nettoyés des séparateurs côté HA). Le firmware garde la liste
    # et déclenche l'annonce LUI-MÊME à la seconde près : une coupure HA entre la
    # poussée et l'échéance ne fait pas rater l'annonce. Un rendez-vous déjà
    # annoncé le reste après une nouvelle poussée (appariement par epoch dans
    # rdv_store), sinon le rappel repartirait toutes les 5 minutes.
    - service: tab5_maj_rdv_prochains
      variables:
        payload: string
      then:
        - lambda: |-
            rdv_store(payload);
            id(tab5_rdv_next_sensor).update();

    # Popup calendrier — réponse de script.tab5_calendrier_mois (HA) : codes = 62 hex
    # (2/jour, bits 1 travail, 2 férié, 4 vacances scolaires, 8 RDV, 16 anniversaire),
    # heures = 31 champs "HH:MM-HH:MM" séparés par |, details = 31 champs "type|texte;..."
    # séparés par ~ (détail jour embarqué → tap instantané sans round-trip).
    # Mis en cache ; re-rendu seulement si le popup est ouvert sur ce mois.
    - service: tab5_maj_calendrier_mois
      variables:
        annee: string
        mois: string
        codes: string
        heures: string
        details: string
      then:
        - lambda: |-
            if (id(lbl_cal_month) == nullptr) return;
            cal_store_month_data(annee, mois, codes, heures, details);
        - if:
            condition:
              lambda: |-
                return id(lbl_cal_month) != nullptr
                    && !lv_obj_has_flag(id(calendar_popup), LV_OBJ_FLAG_HIDDEN)
                    && atoi(annee.c_str()) == id(cal_view_year)
                    && atoi(mois.c_str()) == id(cal_view_month);
            then:
              - script.execute: tab5_cal_render

    # Popup calendrier — réponse de script.tab5_calendrier_jour (HA) : payload =
    # "type|texte;..." (types travail/ferie/vacances/rdv/anniv/fete, max 6 lignes).
    # Ignoré si le détail affiché ne correspond plus à cette date (navigation rapide).
    - service: tab5_maj_calendrier_jour
      variables:
        date: string
        payload: string
      then:
        - lambda: |-
            if (id(lbl_cal_day_status) == nullptr) return;
            if (lv_obj_has_flag(id(cal_day_popup), LV_OBJ_FLAG_HIDDEN)) return;
            if (id(cal_detail_date) != date) return;
            CalDetailLineUI lines[6] = {
                {id(cal_det_icon_0), id(cal_det_txt_0)},
                {id(cal_det_icon_1), id(cal_det_txt_1)},
                {id(cal_det_icon_2), id(cal_det_txt_2)},
                {id(cal_det_icon_3), id(cal_det_txt_3)},
                {id(cal_det_icon_4), id(cal_det_txt_4)},
                {id(cal_det_icon_5), id(cal_det_txt_5)}
            };
            cal_render_day_detail(payload, id(lbl_cal_day_status), lines);

