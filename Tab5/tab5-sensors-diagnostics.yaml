# ============================================================================
# [AI-CONTEXT]
# @file tab5-sensors-diagnostics.yaml
# @role Entités système/diagnostic : WiFi (bloc wifi:, antenne, RSSI, IP/SSID),
#       alimentations GPIO (internes), statut API HA, uptime, RAM/loop time (debug),
#       température coeur, horloge SNTP et intervals de la console système.
# @architecture_constraint Ce fichier ne DOIT contenir AUCUNE logique de présentation.
#                         Les blocs on_value: doivent se contenter d'appeler des fonctions
#                         C++ depuis tab5_custom.cpp (ex: update_light_card_ui(...) ).
# @anti_pattern_evité Ne pas utiliser std::string ou to_string() ici (hot-path).
# @ai_instruction Fichier issu de la scission de tab5-sensors.yaml (14/07/2026).
#                 Les entités domotique (plantes, lumières, capteurs HA, audio)
#                 vivent dans tab5-sensors-domotique.yaml. Un nouveau capteur
#                 système (RAM, réseau, alimentation...) se déclare ici.
# ============================================================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  # Point d'accès de secours, conservé à dessein (audit du 06/09/2026, §4.1
  # point 16) : avec `captive_portal:` (tab5-ha-hmi.yaml), c'est le seul chemin
  # de récupération sans câble USB si un firmware est flashé avec de mauvais
  # identifiants Wi-Fi. L'AP ne démarre qu'après l'échec de la connexion
  # (`ap_timeout`, 1 min par défaut) ; en fonctionnement normal il ne coûte que
  # sa configuration en RAM et le code du portail dans le binaire.
  ap:
    ssid: "Tab5 Fallback AP"
    password: !secret wifi_ap_password

# Alimentations : internes (`internal: true`), plus aucune entité HA. Elles ne servent
# qu'à être allumées au démarrage (ALWAYS_ON), et « WiFi Power » coupé depuis HA rendait
# la tablette injoignable jusqu'au `reboot_timeout` de l'API, 60 min plus tard (audit des
# ressources du 26/09/2026, §6). Aucune automation ni lambda ne les lit.
switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: usb_5v_power
    name: "USB Power"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: wifi_antenna_int_ext
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0

  - platform: gpio
    id: external_5v_power
    name: "External 5V Power"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 2
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: status
    name: "HA API Status"
    id: status_ha
    on_state:
      - lambda: 'set_icon_active_ui(id(icon_ha), x, UIColor::INFO, UIColor::INACTIVE);'
      # Pré-fetch calendrier au reconnect HA (rising edge) : recharge le mois
      # courant + M+1 pour que le popup s'ouvre instantanément même après une coupure.
      - if:
          condition:
            binary_sensor.is_on: status_ha
          then:
            - delay: 2s
            - script.execute: tab5_cal_prefetch_boot

text_sensor:
  - platform: wifi_info
    ip_address:
      id: sys_wifi_ip
      name: "Tab5 IP"
    ssid:
      id: sys_wifi_ssid
      name: "Tab5 SSID"

  # Raison du dernier démarrage (esp_reset_reason), publiée une fois par démarrage :
  # « Software Reset », « Exception », « Task Watchdog », « Brownout », « Power On »…
  # L'historique HA dit si un redémarrage était un plantage (26/09/2026, journal des
  # démarrages, voir Tab5/tab5_journal.cpp).
  - platform: debug
    reset_reason:
      name: "Tab5 Raison du redémarrage"

  # Version du logiciel ESP-Hosted du co-processeur Wi-Fi (ESP32-C6), qu'ESPHome ne met
  # pas à jour : celle installée en usine tant que personne ne l'a reflashé. Lue une
  # fois, Wi-Fi connecté (la requête passe par le C6). Chaque essai peut bloquer la
  # boucle jusqu'à 1 s si le C6 ne répond pas : 3 essais au plus, puis « inconnue ».
  - platform: template
    id: sys_c6_version
    name: "Tab5 C6 Version"
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      static uint8_t essais = 0;
      if (essais >= 3 || !network::is_connected()) return {};
      char buf[16];
      if (read_c6_firmware_version(buf, sizeof(buf))) { essais = 3; return std::string(buf); }
      if (++essais >= 3) return std::string("inconnue");
      return {};

sensor:
  # Uptime en deux capteurs (audit des ressources du 26/09/2026, H4) :
  # - en secondes, pour la console seulement : sans `name:`, il reste interne ;
  # - pour HA, l'heure du dernier démarrage, publiée UNE fois par démarrage, au
  #   premier rappel de synchro de `sntp_time` où l'heure est valide
  #   (`uptime_timestamp_sensor.cpp` ne republie jamais). Après un redémarrage
  #   logiciel l'heure système survit : ce rappel part alors dès la première boucle,
  #   avant le Wi-Fi. Avant, la valeur en secondes partait chaque minute : 1 440
  #   lignes par jour en base et autant d'exécutions de la garde « reboot inattendu »
  #   de packages/tab5_health.yaml.
  #   Même nom que l'ancien capteur, donc même entité HA
  #   (sensor.m5stack_tab5_home_assistant_hmi_tab5_uptime), qui devient un horodatage.
  #   Précision ±64 s : l'état passe par un float 32 bits, qui arrondit un horodatage
  #   Unix au multiple de 128 s (reboot à 19:36:29 UTC publié 19:35:28, le 26/09/2026).
  #   Mise à jour depuis l'ancien capteur en secondes : recharger l'intégration ESPHome
  #   dans HA, sinon l'entité garde son unité « s » et reste `unavailable`
  #   (docs/troubleshooting.md).
  - platform: uptime
    id: sys_uptime
    update_interval: 60s
    on_value:
      - lambda: |-
          if (!is_console_layer_visible(id(layer_console_sys))) return;
          update_console_uptime_label(id(lbl_sys_uptime_val), x);

  - platform: uptime
    type: timestamp
    name: "Tab5 Uptime"
    time_id: sntp_time

  - platform: wifi_signal
    id: sys_wifi_rssi
    name: "Tab5 WiFi Signal"
    update_interval: 60s
    # ≈ 42 lignes/h dans la base HA pour ±1 dB de bruit : publié quand le signal
    # bouge de 2 dB, et au moins toutes les 15 min pour le graphe (audit 26/09, lot 3).
    filters:
      - or:
          - throttle: 15min
          - delta: 2.0
    on_value:
      - lambda: |-
          if (!is_console_layer_visible(id(layer_console_sys))) return;
          update_console_rssi_label(id(lbl_sys_rssi_val), x);

  - platform: internal_temperature
    id: sys_core_temp
    name: "Tab5 Core Temp"
    update_interval: 60s
    on_value:
      - lambda: |-
          if (!is_console_layer_visible(id(layer_console_sys))) return;
          update_console_temp_label(id(lbl_sys_temp_val), x);

  - platform: debug
    free:
      id: sys_free_heap
      name: "Tab5 Free Ram"
    loop_time:
      id: sys_loop_time
      name: "Tab5 Loop Time"

  # Mesures de référence des expériences de performance (audit du 25/09/2026, §3.3),
  # publiées chaque minute comme le temps de boucle.
  # Image LVGL la plus longue de la minute écoulée : rendu + envoi à l'écran, de
  # LV_EVENT_RENDER_START à LV_EVENT_REFR_READY (on_draw_start / on_draw_end, bloc
  # lvgl: plus bas). 0 = aucune image dessinée pendant la minute.
  # `internal: true` (audit ressources du 26/09/2026, lot 2) : la campagne de mesure est
  # close et la valeur change chaque minute — ≈ 1 500 lignes par jour dans la base HA
  # pour rien. Un capteur interne n'apparaît plus non plus dans `esphome logs` (vérifié
  # après le flash du 26/09) : pour une nouvelle mesure, retirer `internal: true`.
  - platform: template
    id: sys_draw_max
    name: "Tab5 Draw Max"
    internal: true
    unit_of_measurement: ms
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      const float v = id(draw_max_us) / 1000.0f;
      id(draw_max_us) = 0;
      return v;

  # Pile libre minimale de la boucle ESPHome depuis le démarrage (16 Ko en tout, #150).
  # La lambda tourne dans la boucle elle-même : nullptr = la tâche courante.
  - platform: template
    id: sys_stack_free
    name: "Tab5 Stack Free Min"
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return (float) uxTaskGetStackHighWaterMark(nullptr);'

select:
  - platform: template
    id: wifi_antenna_select
    name: "WiFi Antenna"
    options:
      - "Internal"
      - "External"
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: return i == 0;
          then:
            - switch.turn_off: wifi_antenna_int_ext
          else:
            - switch.turn_on: wifi_antenna_int_ext

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Paris
    # Peint l'horloge dès la 1re sync NTP (sinon placeholders YAML jusqu'au
    # prochain tick minute de on_time). Indépendant de HA.
    on_time_sync:
      then:
        # Recale l'horloge matérielle à chaque synchro NTP (elle stocke l'heure UTC).
        - rx8130.write_time:
            id: rtc_time
        - lambda: |-
            auto t_now = id(sntp_time).now();
            if (t_now.is_valid()) {
              update_clock_date_ui(id(lbl_date),
                  t_now.hour, t_now.minute, t_now.day_of_week, t_now.day_of_month, t_now.month);
            }
    on_time:
      - seconds: 0
        minutes: "*"
        then:
          - lambda: |-
              auto t_now = id(sntp_time).now();
              if (t_now.is_valid()) {
                update_clock_date_ui(id(lbl_date),
                    t_now.hour, t_now.minute, t_now.day_of_week, t_now.day_of_month, t_now.month);
              }

  # Horloge matérielle RX8130 (0x32 sur bsp_bus, sauvegardée par un supercondensateur
  # de 70 000 µF) : le Tab5 a l'heure dès le démarrage, même sans réseau (horloge,
  # réveil). Lue une seule fois au démarrage (interval plus bas), écrite à chaque synchro
  # NTP. Pas de lecture périodique : elle recalerait l'heure système à la seconde près
  # et pourrait faire sauter les déclencheurs « on_time ».
  # Au setup, le composant écrit ses registres de contrôle, dont la charge du
  # supercondensateur (comme M5Unified, la bibliothèque de M5Stack).
  - platform: rx8130
    id: rtc_time
    i2c_id: bsp_bus
    timezone: Europe/Paris
    update_interval: never
    on_time_sync:
      then:
        - lambda: |-
            auto t_now = id(sntp_time).now();
            if (t_now.is_valid()) {
              update_clock_date_ui(id(lbl_date),
                  t_now.hour, t_now.minute, t_now.day_of_week, t_now.day_of_month, t_now.month);
            }

interval:
  # Heure de l'horloge RX8130 au démarrage, avant le réseau. Un interval s'exécute pour la
  # première fois dans les 5 s qui suivent le setup (décalage aléatoire du planificateur
  # d'ESPHome) : pas besoin de toucher à on_boot. Ensuite, une fois par jour, sans effet
  # tant que l'heure système est valide.
  - interval: 24h
    then:
      - lambda: |-
          if (id(sntp_time).now().is_valid()) return;
          id(rtc_time).read_time();
          const auto t = id(rtc_time).utcnow();
          if (t.is_valid()) {
            ESP_LOGI("tab5.rtc", "Heure reprise de l'horloge RX8130 : %04d-%02d-%02d %02d:%02d:%02d UTC",
                     t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
          } else {
            ESP_LOGW("tab5.rtc", "Horloge RX8130 illisible ou pas encore réglée : attente de NTP");
          }

  # Journal des démarrages et des coupures (Tab5/tab5_journal.cpp) : quand le Wi-Fi
  # manque depuis 90 s, une copie en NVS pour survivre à une coupure de courant (au plus
  # une toutes les 15 min, seulement s'il y a du nouveau). Rien à faire Wi-Fi présent.
  - interval: 30s
    then:
      - lambda: 'journal_tick();'

  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: 'set_icon_active_ui(id(icon_wifi), true, UIColor::SUCCESS, UIColor::INACTIVE);'
          else:
            - lambda: 'set_icon_active_ui(id(icon_wifi), false, UIColor::SUCCESS, UIColor::INACTIVE);'

  - interval: 2s
    then:
      - lambda: |-
          // Garde #T222 : pas de LVGL si la console est masquee.
          if (is_console_layer_visible(id(layer_console_sys))) {
             update_console_diagnostics_ui(id(lbl_sys_sram_val), id(bar_sys_sram),
                 id(lbl_sys_psram_val), id(bar_sys_psram), id(lbl_sys_frag_val), id(lbl_sys_flash_val),
                 id(sys_loop_time).has_state(), id(sys_loop_time).state, id(lbl_sys_loop_val),
                 id(sys_wifi_ip).has_state(), id(sys_wifi_ip).state.c_str(), id(lbl_sys_ip_val),
                 id(sys_wifi_ssid).has_state(), id(sys_wifi_ssid).state.c_str(), id(lbl_sys_ssid_val));
             // État connexion HA (carte RÉSEAU de la console) — reprend aussi la main
             // apres le "Redemarrage..." affiche par le bouton Redemarrer HA.
             update_console_ha_status_ui(id(lbl_sys_ha_val), id(status_ha).state);
          }

# Envoi du journal des démarrages et des coupures (Tab5/tab5_journal.cpp), lancé à
# chaque connexion de Home Assistant (on_client_connected, tab5-api-logic.yaml).
# 10 s : laisser HA finir ses abonnements (états, services, logs). Événement seulement
# si quelque chose le justifie (journal_has_report(), bits `anomalie` de
# tab5_journal.cpp) : jamais pour un démarrage normal. Côté HA, la garde (e) de
# packages/tab5_health.yaml en fait une notification. Journal vidé une fois HA joint.
script:
  - id: tab5_journal_envoi
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - if:
                condition:
                  lambda: 'return journal_has_report();'
                then:
                  - homeassistant.event:
                      event: esphome.tab5_journal
                      data:
                        raison: !lambda 'return journal_reset_reason();'
                        demarrages: !lambda 'return journal_boot_count();'
                        grave: !lambda 'return journal_is_serious() ? std::string("oui") : std::string("non");'
                        lignes: !lambda 'return journal_report_text();'
            - lambda: 'journal_mark_delivered();'

# Chronométrage des images LVGL pour « Tab5 Draw Max » (plus haut). Fusionné avec les
# blocs lvgl: de tab5-styles.yaml et tab5-lvgl.yaml. Deux lectures de micros() par
# image : coût négligeable, rien n'est touché à l'affichage.
lvgl:
  on_draw_start:
    - lambda: 'id(draw_t0_us) = micros();'
  # LV_EVENT_REFR_READY part à CHAQUE passage du timer de rafraîchissement, même
  # sans rien à redessiner (lv_refr.c : `goto refr_finish`) : sans l'appariement
  # avec un début de dessin, on mesurait le temps écoulé depuis la dernière image
  # (2,5 à 4,5 s au repos, relevé le 25/09 sur la première version).
  on_draw_end:
    - lambda: |-
        if (id(draw_t0_us) == 0) return;
        const uint32_t d = micros() - id(draw_t0_us);
        id(draw_t0_us) = 0;
        if (d > id(draw_max_us)) id(draw_max_us) = d;

globals:
  - id: draw_t0_us
    type: uint32_t
    initial_value: '0'
  - id: draw_max_us
    type: uint32_t
    initial_value: '0'
