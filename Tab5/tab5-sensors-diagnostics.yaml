# ============================================================================
# [AI-CONTEXT]
# @file tab5-sensors-diagnostics.yaml
# @role Entités système/diagnostic : WiFi (bloc wifi:, antenne, RSSI, IP/SSID),
#       alimentations GPIO (internes), batterie (charge activée, état de charge, tension
#       et niveau par l'INA226), statut API HA, uptime, RAM/loop time (debug),
#       température coeur, horloge SNTP et intervals de la console système.
# @batterie Batterie d'origine (discussion #278, 03/10/2026) : CHG_EN (pi4ioe2 P7) mis à 1,
#           charge rapide (P5) à l'arrêt, état CHG_STAT (P6) lu toutes les 10 s, INA226
#           en 0x41 (0x40 = ES7210). Testé par husyildiz avec la batterie d'origine
#           (~7,2 V, la charge suit la réalité) ; l'auteur n'en a pas. Sans batterie, le
#           chargeur dit « en charge » et la tension oscille ou reste sous 6 V : les
#           entités de charge, tension et niveau sont désactivées par défaut.
#           Batterie détectée (05/10/2026) : chaque lecture de l'INA226 passe par
#           batterie_tension_ui (on_raw_value) ; une lecture sous 6,0 V dans les 10
#           dernières minutes = pas de batterie (règle et mesures : tab5_core.h). Publié
#           par « Tab5 Batterie détectée » (activée par défaut) ; « Tab5 Batterie » vaut
#           alors inconnu.
#           Icône du bandeau d'état (04/10/2026) : niveau, charge et tension passés au C++
#           (batterie_niveau_ui, batterie_charge_ui, batterie_tension_ui), affichée
#           seulement si l'interrupteur « Tab5 Batterie montée » (tab5-ha-controls.yaml)
#           est allumé ; une prise quand la batterie n'est pas détectée.
#           Console système (06/10/2026) : la ligne « Batterie » relit le même état gardé
#           par le C++ (update_console_batterie_ui, interval 2 s plus bas, console ouverte).
# @architecture_constraint Ce fichier ne DOIT contenir AUCUNE logique de présentation.
#                         Les blocs on_value: doivent se contenter d'appeler des fonctions
#                         C++ depuis tab5_custom.cpp (ex: update_console_diagnostics_ui(...) ).
# @anti_pattern_evité Ne pas utiliser std::string ou to_string() ici (hot-path).
# @ai_instruction Fichier issu de la scission de tab5-sensors.yaml (14/07/2026).
#                 Les entités domotique (plantes, lumières, capteurs HA, audio)
#                 vivent dans tab5-sensors-domotique.yaml. Un nouveau capteur
#                 système (RAM, réseau, alimentation...) se déclare ici.
# ============================================================================
# Wi-Fi sans identifiants compilés (lot 6b, ADR-0020) : ils arrivent par Improv (USB,
# `improv_serial` ci-dessous, depuis le flasheur web ou ESPHome Web) ou par le portail
# de l'AP de secours, et restent en NVS d'une OTA à l'autre (emplacement fixe quand le
# YAML n'a pas d'identifiants). Un YAML avec identifiants les rangerait sous le hash de
# la config : ils ne passeraient pas d'un firmware à l'autre.
wifi:
  power_save_mode: NONE
  # Connexion sans balayage (01/10/2026, mesure du démarrage) : la tablette retourne
  # directement au point d'accès et au canal de sa dernière connexion, gardés en NVS
  # (réécrits seulement s'ils changent, emplacement fixe sans identifiants compilés).
  # Avant, le C6 balayait tous les canaux à chaque démarrage : ~2 s mesurées par le
  # port USB, entre « scanning for networks » et la liste des réseaux. Premier
  # démarrage, point d'accès éteint ou autre réseau : ESPHome repasse au balayage.
  fast_connect: true
  # Point d'accès de secours, conservé à dessein (audit du 06/09/2026, §4.1
  # point 16) : avec `captive_portal:` (tab5-ha-hmi.yaml), c'est le chemin sans câble
  # USB pour donner ou changer le réseau Wi-Fi. Il démarre tout de suite sur une
  # tablette sans réseau enregistré, sinon après l'échec de la connexion (`ap_timeout`,
  # 1 min par défaut). OUVERT depuis le lot 6b : un mot de passe écrit dans un dépôt
  # public ne protège rien. Au pire, quelqu'un à portée change le réseau d'une tablette
  # qui a perdu le sien ; il ne peut ni la flasher (signature) ni parler à son API (clé).
  # Il se coupe aussi quand la fenêtre d'appairage expire (tab5-api-logic.yaml).
  ap:
    ssid: "Tab5 Fallback AP"

# Improv par le port USB (lot 6b) : le flasheur web (lot 6c) ou ESPHome Web règlent le
# Wi-Fi juste après le flash. Partage le port du logger (USB_SERIAL_JTAG, 115 200 bauds,
# tab5-hardware.yaml), ce qu'improv_serial accepte sur le P4.
improv_serial:

# Alimentations : internes (`internal: true`), plus aucune entité HA. Elles ne servent
# qu'à être allumées au démarrage (ALWAYS_ON), et « WiFi Power » coupé depuis HA rendait
# la tablette injoignable jusqu'au `reboot_timeout` de l'API, 60 min plus tard (audit des
# ressources du 26/09/2026, §6). Aucune automation ni lambda ne les lit.
switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: usb_5v_power
    name: "USB Power"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
    restore_mode: ALWAYS_ON

  # Charge de la batterie d'origine (discussion #278, 03/10/2026) : sans CHG_EN (P7) à 1,
  # rien ne lance le chargeur. À 1 au démarrage comme M5Unified (Power_Class.inl,
  # OUT_SET de 0x44) et la config de référence ESPHome (PR #1396 de devices.esphome.io).
  - platform: gpio
    id: charge_enable
    name: "Charge Enable"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 7
    restore_mode: ALWAYS_ON

  # nCHG_QC_EN (P5, actif bas) : charge rapide ARRÊTÉE, comme la config de référence
  # ESPHome (M5Unified l'active au démarrage). La tablette reste branchée, le chargeur
  # USB fournit déjà jusqu'à 1,5 A (docs/hardware.md) et la charge rapide chauffe plus.
  # M5Unified appelle les deux modes 500 et 1 000 mA (setChargeCurrent), non mesuré.
  - platform: gpio
    id: quick_charge
    name: "Quick Charge"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 5
      inverted: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: wifi_antenna_int_ext
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0

  - platform: gpio
    id: external_5v_power
    name: "External 5V Power"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 2
    restore_mode: ALWAYS_ON

binary_sensor:
  # CHG_STAT (P6), 1 = en charge (M5Unified isCharging, config de référence ESPHome,
  # dont vient le tirage vers le bas). Lu par l'interval de 10 s plus bas ; un
  # changement n'est publié que s'il tient 30 s (battements de fin de charge).
  # Sans batterie, il dit « en charge » (relevé sur la tablette de l'auteur, 03/10/2026) :
  # les trois entités de la batterie sont désactivées par défaut dans HA, à activer
  # quand la batterie est montée.
  - platform: gpio
    id: batterie_en_charge
    name: "Tab5 Batterie en charge"
    device_class: battery_charging
    entity_category: diagnostic
    disabled_by_default: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 6
      mode: INPUT_PULLDOWN
    filters:
      - delayed_on_off: 30s
    # Icône de la batterie dans le bandeau d'état (éclair pendant la charge), visible
    # si l'interrupteur « Tab5 Batterie montée » est allumé (tab5-ha-controls.yaml).
    on_state:
      - lambda: 'batterie_charge_ui(x);'
      # Mode économie (tab5-economie.yaml) : la charge reprend, la tablette n'est plus
      # sur batterie, sans attendre la lecture suivante du courant.
      - lambda: |-
          if (economie_charge(x)) id(tab5_sur_batterie).publish_state(false);
      - script.execute: tab5_economie_appliquer

  # Batterie détectée (discussion #278, 05/10/2026) : la décision de la tablette, d'après
  # la tension (batterie_tension_ui, on_raw_value de batterie_tension plus bas ; règle
  # dans tab5_core.h). Publiée à chaque changement ; inconnue avant la première lecture
  # de l'INA226. Activée par défaut : c'est elle qui dit, sans batterie, que la tension
  # et le niveau ne veulent rien dire.
  - platform: template
    id: batterie_detectee
    name: "Tab5 Batterie détectée"
    icon: mdi:battery-check
    entity_category: diagnostic

  - platform: status
    name: "HA API Status"
    id: status_ha
    on_state:
      - lambda: 'set_icon_active_ui(id(icon_ha), x, UIColor.INFO, UIColor.INACTIVE);'
      # Pré-fetch calendrier au reconnect HA (rising edge) : recharge le mois
      # courant + M+1 pour que le popup s'ouvre instantanément même après une coupure.
      - if:
          condition:
            binary_sensor.is_on: status_ha
          then:
            - delay: 2s
            - script.execute: tab5_cal_prefetch_boot

text_sensor:
  - platform: wifi_info
    ip_address:
      id: sys_wifi_ip
      name: "Tab5 IP"
    ssid:
      id: sys_wifi_ssid
      name: "Tab5 SSID"

  # Raison du dernier démarrage (esp_reset_reason), publiée une fois par démarrage :
  # « Software Reset », « Exception », « Task Watchdog », « Brownout », « Power On »…
  # L'historique HA dit si un redémarrage était un plantage (26/09/2026, journal des
  # démarrages, voir Tab5/tab5_journal.cpp).
  # Premier démarrage après une installation par l'USB, flash effacée (28/09/2026) : le
  # flash finit par un reset du chien de garde RTC, « other watchdogs » devient « First
  # boot after install (other watchdogs) », que la garde « reboot inattendu » de
  # packages/tab5_health.yaml ne signale pas (voir Tab5/tab5_journal.cpp).
  # Appui sur le bouton d'alimentation (06/10/2026, discussion #278) : chien de garde
  # sans rapport de plantage. ESPHome y affichait la source du dernier redémarrage
  # DEMANDÉ (« Reboot request from esphome.ota », jamais effacée) : le filtre publie
  # « Power button or RTC watchdog (rst 0x..) » à la place, que la garde ne signale pas
  # non plus ; avec un rapport de plantage, « Crash, other watchdogs (rst 0x..) ».
  - platform: debug
    reset_reason:
      name: "Tab5 Raison du redémarrage"
      filters:
        - lambda: return journal_raison_ha(x);

  # Version du logiciel ESP-Hosted du co-processeur Wi-Fi (ESP32-C6), qu'ESPHome ne met
  # pas à jour : celle installée en usine tant que personne ne l'a reflashé. Lue une
  # fois, Wi-Fi connecté (la requête passe par le C6). Chaque essai peut bloquer la
  # boucle jusqu'à 1 s si le C6 ne répond pas : 3 essais au plus, puis « inconnue ».
  - platform: template
    id: sys_c6_version
    name: "Tab5 C6 Version"
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      static uint8_t essais = 0;
      if (essais >= 3 || !network::is_connected()) return {};
      char buf[16];
      if (read_c6_firmware_version(buf, sizeof(buf))) { essais = 3; return std::string(buf); }
      if (++essais >= 3) return std::string("inconnue");
      return {};

sensor:
  # Uptime en deux capteurs (audit des ressources du 26/09/2026, H4) :
  # - en secondes, pour la console seulement : sans `name:`, il reste interne ;
  # - pour HA, l'heure du dernier démarrage, publiée UNE fois par démarrage, au
  #   premier rappel de synchro de `sntp_time` où l'heure est valide
  #   (`uptime_timestamp_sensor.cpp` ne republie jamais). Après un redémarrage
  #   logiciel l'heure système survit : ce rappel part alors dès la première boucle,
  #   avant le Wi-Fi. Avant, la valeur en secondes partait chaque minute : 1 440
  #   lignes par jour en base et autant d'exécutions de la garde « reboot inattendu »
  #   de packages/tab5_health.yaml.
  #   Même nom que l'ancien capteur, donc même entité HA
  #   (sensor.m5stack_tab5_home_assistant_hmi_tab5_uptime), qui devient un horodatage.
  #   Précision ±64 s : l'état passe par un float 32 bits, qui arrondit un horodatage
  #   Unix au multiple de 128 s (reboot à 19:36:29 UTC publié 19:35:28, le 26/09/2026).
  #   Mise à jour depuis l'ancien capteur en secondes : recharger l'intégration ESPHome
  #   dans HA, sinon l'entité garde son unité « s » et reste `unavailable`
  #   (docs/troubleshooting.md).
  - platform: uptime
    id: sys_uptime
    update_interval: 60s
    on_value:
      - lambda: |-
          if (!is_console_layer_visible(id(layer_console_sys))) return;
          update_console_uptime_label(id(lbl_sys_uptime_val), x);

  - platform: uptime
    type: timestamp
    name: "Tab5 Uptime"
    time_id: sntp_time

  - platform: wifi_signal
    id: sys_wifi_rssi
    name: "Tab5 WiFi Signal"
    update_interval: 60s
    # ≈ 42 lignes/h dans la base HA pour ±1 dB de bruit : publié quand le signal
    # bouge de 2 dB, et au moins toutes les 15 min pour le graphe (audit 26/09, lot 3).
    filters:
      - or:
          - throttle: 15min
          - delta: 2.0
    on_value:
      - lambda: |-
          if (!is_console_layer_visible(id(layer_console_sys))) return;
          update_console_rssi_label(id(lbl_sys_rssi_val), x);

  - platform: internal_temperature
    id: sys_core_temp
    name: "Tab5 Core Temp"
    update_interval: 60s
    on_value:
      - lambda: |-
          if (!is_console_layer_visible(id(layer_console_sys))) return;
          update_console_temp_label(id(lbl_sys_temp_val), x);

  - platform: debug
    free:
      id: sys_free_heap
      name: "Tab5 Free Ram"
    loop_time:
      id: sys_loop_time
      name: "Tab5 Loop Time"

  # Mesures de référence des expériences de performance (audit du 25/09/2026, §3.3),
  # publiées chaque minute comme le temps de boucle.
  # Image LVGL la plus longue de la minute écoulée : rendu + envoi à l'écran, de
  # LV_EVENT_RENDER_START à LV_EVENT_REFR_READY (on_draw_start / on_draw_end, bloc
  # lvgl: plus bas). 0 = aucune image dessinée pendant la minute.
  # `internal: true` (audit ressources du 26/09/2026, lot 2) : la campagne de mesure est
  # close et la valeur change chaque minute — ≈ 1 500 lignes par jour dans la base HA
  # pour rien. Un capteur interne n'apparaît plus non plus dans `esphome logs` (vérifié
  # après le flash du 26/09) : pour une nouvelle mesure, retirer `internal: true`.
  - platform: template
    id: sys_draw_max
    name: "Tab5 Draw Max"
    internal: true
    unit_of_measurement: ms
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      const float v = id(draw_max_us) / 1000.0f;
      id(draw_max_us) = 0;
      return v;

  # Pile libre minimale de la boucle ESPHome depuis le démarrage (16 Ko en tout, #150).
  # La lambda tourne dans la boucle elle-même : nullptr = la tâche courante.
  - platform: template
    id: sys_stack_free
    name: "Tab5 Stack Free Min"
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return (float) uxTaskGetStackHighWaterMark(nullptr);'

  # Tension de la batterie (INA226, présent en 0x41 sur la tablette de l'auteur le
  # 26/09/2026 ; 0x40, défaut d'ESPHome, est l'ES7210). Shunt et max_current de la
  # config de référence ESPHome, utiles au seul courant. Publiée à 50 mV
  # près (≈ 2 %) ou toutes les 15 min. Sans batterie, elle lit le chargeur ou l'USB :
  # 4,2 V (husyildiz), 4,2 ↔ 8,39 V ou 5,71 V stable (tablette de l'auteur, 03 et
  # 04/10/2026) ; d'où disabled_by_default, et « Tab5 Batterie détectée ».
  # ESPHome lit la tension avant le courant à chaque mesure (ina226.cpp) : quand le
  # courant arrive, « batterie détectée » a déjà vu la lecture du même instant.
  - platform: ina226
    i2c_id: bsp_bus
    address: 0x41
    shunt_resistance: 0.005ohm
    max_current: 8.192A
    adc_averaging: 16
    update_interval: 60s
    bus_voltage:
      id: batterie_tension
      name: "Tab5 Tension batterie"
      accuracy_decimals: 2
      entity_category: diagnostic
      disabled_by_default: true
      filters:
        - or:
            - throttle: 15min
            - delta: 0.05
      # Chaque lecture (toutes les 60 s, avant les filtres : une oscillation sous le seuil
      # ne doit pas échapper au delta) décide si la batterie est là (tab5_core.h). Au
      # changement : « Tab5 Batterie détectée », et le niveau recalculé depuis cette
      # lecture (sinon, tension stable, il attendrait jusqu'à 15 min la suivante publiée).
      on_raw_value:
        - lambda: |-
            if (batterie_tension_ui(x, millis())) {
              id(batterie_detectee).publish_state(batterie_presente());
              id(batterie_niveau).publish_state(x);
            }
    # Courant de la batterie (06/10/2026, mode économie) : + = elle se décharge, la
    # tablette tourne sur elle ; − = elle charge. Sens d'après M5Unified
    # (getBatteryCurrent : le shunt du Tab5 est câblé pour que la charge se lise
    # négative ; ESPHome publie le registre signé tel quel), pas encore vu sur une
    # tablette. Chaque lecture (avant les filtres) décide « Tab5 Sur batterie »
    # (tab5_economie.h). Sans batterie il ne veut rien dire : désactivé par défaut,
    # comme la tension.
    current:
      id: batterie_courant
      name: "Tab5 Courant batterie"
      accuracy_decimals: 3
      entity_category: diagnostic
      disabled_by_default: true
      filters:
        - or:
            - throttle: 15min
            - delta: 0.05
      on_raw_value:
        - lambda: |-
            economie_courant(x, batterie_presente(), id(batterie_en_charge).state);
            id(tab5_sur_batterie).publish_state(economie_sur_batterie());
        - script.execute: tab5_economie_appliquer

  # Niveau d'après la tension, droite de battery-percentage.yaml (référence ESPHome) :
  # 6,0 V = 0 %, 8,23 V = 100 % ; trop haut pendant la charge. Inconnu (pas 0 ni 100 %)
  # tant que la batterie n'est pas détectée (05/10/2026 : une lecture sous 6,0 V dans
  # les 10 dernières minutes ; tab5_core.h) : sans batterie, le 8,39 V du chargeur
  # donnait 100 % et le 5,71 V 0 %.
  - platform: copy
    source_id: batterie_tension
    id: batterie_niveau
    name: "Tab5 Batterie"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    filters:
      - lambda: |-
          if (std::isnan(x) || !batterie_presente()) return NAN;
          const float p = (x - 6.0f) / (8.23f - 6.0f) * 100.0f;
          return p < 0.0f ? 0.0f : (p > 100.0f ? 100.0f : p);
    # Glyphe et couleur de l'icône du bandeau (même échelle que le téléphone,
    # get_battery_color) ; NAN = point d'interrogation gris, ou la prise si la batterie
    # n'est pas détectée (batterie_peindre lit la décision, pas ce niveau).
    on_value:
      - lambda: 'batterie_niveau_ui(x);'
      # Mode économie : à 35 % ou moins sur batterie, la luminosité au plus bas.
      - lambda: 'economie_niveau(x);'
      - script.execute: tab5_economie_appliquer

select:
  - platform: template
    id: wifi_antenna_select
    name: "WiFi Antenna"
    options:
      - "Internal"
      - "External"
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: return i == 0;
          then:
            - switch.turn_off: wifi_antenna_int_ext
          else:
            - switch.turn_on: wifi_antenna_int_ext

time:
  # Fuseau horaire de Home Assistant (lot 6b, ADR-0020), plus de `tab5_fuseau` : HA
  # (≥ 2026.3) l'envoie avec l'heure, à chaque connexion puis toutes les 6 h, et
  # ESPHome l'applique à toutes les horloges (sntp et rx8130 compris). Rien ne le garde
  # d'un démarrage à l'autre : fuseau_memoriser() le range en NVS (tick minute
  # ci-dessous) et fuseau_restaurer() le remet au démarrage (interval plus bas), pour
  # que le réveil sonne à l'heure locale même quand HA manque après une coupure. Avant
  # la toute première connexion à HA, c'est le fuseau du PC qui a compilé (UTC pour
  # un firmware compilé par la CI). SNTP reste la source de l'heure elle-même.
  - platform: homeassistant
    id: ha_time
    update_interval: 6h
    on_time_sync:
      then:
        - lambda: 'fuseau_recu_de_ha();'

  - platform: sntp
    id: sntp_time
    # Peint l'horloge dès la 1re sync NTP (sinon placeholders YAML jusqu'au
    # prochain tick minute de on_time). Indépendant de HA.
    on_time_sync:
      then:
        # Recale l'horloge matérielle à chaque synchro NTP (elle stocke l'heure UTC).
        - rx8130.write_time:
            id: rtc_time
        - lambda: |-
            auto t_now = id(sntp_time).now();
            if (t_now.is_valid()) {
              update_clock_date_ui(id(lbl_date),
                  t_now.hour, t_now.minute, t_now.day_of_week, t_now.day_of_month, t_now.month);
            }
    on_time:
      - seconds: 0
        minutes: "*"
        then:
          - lambda: |-
              auto t_now = id(sntp_time).now();
              if (t_now.is_valid()) {
                update_clock_date_ui(id(lbl_date),
                    t_now.hour, t_now.minute, t_now.day_of_week, t_now.day_of_month, t_now.month);
              }
              // Décompte « dans N mn » de la phrase pluie, fait ici depuis le lot 4c :
              // HA n'a plus à renvoyer la phrase à chaque minute.
              rain_phrase_tick();
              // Fuseau reçu de HA (lot 6b) : rangé en NVS s'il a changé, pour le
              // prochain démarrage. Simple comparaison en RAM le reste du temps.
              fuseau_memoriser();

  # Horloge matérielle RX8130 (0x32 sur bsp_bus, sauvegardée par un supercondensateur
  # de 70 000 µF) : le Tab5 a l'heure dès le démarrage, même sans réseau (horloge,
  # réveil). Lue une seule fois au démarrage (interval plus bas), écrite à chaque synchro
  # NTP. Pas de lecture périodique : elle recalerait l'heure système à la seconde près
  # et pourrait faire sauter les déclencheurs « on_time ».
  # Au setup, le composant écrit ses registres de contrôle, dont la charge du
  # supercondensateur (comme M5Unified, la bibliothèque de M5Stack).
  - platform: rx8130
    id: rtc_time
    i2c_id: bsp_bus
    update_interval: never
    on_time_sync:
      then:
        - lambda: |-
            auto t_now = id(sntp_time).now();
            if (t_now.is_valid()) {
              update_clock_date_ui(id(lbl_date),
                  t_now.hour, t_now.minute, t_now.day_of_week, t_now.day_of_month, t_now.month);
            }

interval:
  # Heure de l'horloge RX8130 au démarrage, avant le réseau. Un interval s'exécute pour la
  # première fois dans les 5 s qui suivent le setup (décalage aléatoire du planificateur
  # d'ESPHome) : pas besoin de toucher à on_boot. Ensuite, une fois par jour, sans effet
  # tant que l'heure système est valide.
  - interval: 24h
    then:
      - lambda: |-
          // Fuseau du dernier passage de HA (lot 6b), avant de lire l'horloge. N'agit
          // qu'au premier appel, au démarrage ; HA le remplacera à sa prochaine connexion.
          fuseau_restaurer();
          if (id(sntp_time).now().is_valid()) return;
          id(rtc_time).read_time();
          const auto t = id(rtc_time).utcnow();
          if (t.is_valid()) {
            ESP_LOGI("tab5.rtc", "Heure reprise de l'horloge RX8130 : %04d-%02d-%02d %02d:%02d:%02d UTC",
                     t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
          } else {
            ESP_LOGW("tab5.rtc", "Horloge RX8130 illisible ou pas encore réglée : attente de NTP");
          }

  # Journal des démarrages et des coupures (Tab5/tab5_journal.cpp) : quand le Wi-Fi
  # manque depuis 90 s, une copie en NVS pour survivre à une coupure de courant (au plus
  # une toutes les 15 min, seulement s'il y a du nouveau). Rien à faire Wi-Fi présent.
  - interval: 30s
    then:
      - lambda: 'journal_tick();'

  # État de charge : sans interruption sur pi4ioe2, ESPHome relirait l'expandeur en I²C
  # à chaque tour de boucle. Comme la prise casque (tab5-sensors-domotique.yaml).
  - interval: 10s
    then:
      - lambda: |-
          id(batterie_en_charge)->disable_loop();
          id(batterie_en_charge)->loop();

  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: 'set_icon_active_ui(id(icon_wifi), true, UIColor.SUCCESS, UIColor.INACTIVE);'
          else:
            - lambda: 'set_icon_active_ui(id(icon_wifi), false, UIColor.SUCCESS, UIColor.INACTIVE);'

  - interval: 2s
    then:
      - lambda: |-
          // Garde #T222 : pas de LVGL si la console est masquee.
          if (is_console_layer_visible(id(layer_console_sys))) {
             update_console_diagnostics_ui(id(lbl_sys_sram_val), id(bar_sys_sram),
                 id(lbl_sys_psram_val), id(bar_sys_psram), id(lbl_sys_frag_val), id(lbl_sys_flash_val),
                 id(sys_loop_time).has_state(), id(sys_loop_time).state, id(lbl_sys_loop_val),
                 id(sys_wifi_ip).has_state(), id(sys_wifi_ip).state.c_str(), id(lbl_sys_ip_val),
                 id(sys_wifi_ssid).has_state(), id(sys_wifi_ssid).state.c_str(), id(lbl_sys_ssid_val));
             // État connexion HA (carte RÉSEAU de la console) — reprend aussi la main
             // apres le "Redemarrage..." affiche par le bouton Redemarrer HA.
             update_console_ha_status_ui(id(lbl_sys_ha_val), id(status_ha).state);
             // Carte SYSTÈME (discussion #278, 06/10/2026) : charge de chaque cœur sur les
             // 2 s écoulées, batterie d'après le dernier état gardé par le C++.
             update_console_cpu_ui(id(lbl_sys_cpu_val), false);
             update_console_batterie_ui(id(lbl_sys_batterie_icone), id(lbl_sys_batterie_val));
          }

# Envoi du journal des démarrages et des coupures (Tab5/tab5_journal.cpp), lancé à
# chaque connexion de Home Assistant (on_client_connected, tab5-api-logic.yaml).
# 10 s : laisser HA finir ses abonnements (états, services, logs). Événement seulement
# si quelque chose le justifie (journal_has_report(), bits `anomalie` de
# tab5_journal.cpp) : jamais pour un démarrage normal. Côté HA, la garde (e) de
# packages/tab5_health.yaml en fait une notification. Journal vidé une fois HA joint.
script:
  - id: tab5_journal_envoi
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - if:
                condition:
                  lambda: 'return journal_has_report();'
                then:
                  - homeassistant.event:
                      event: esphome.tab5_journal
                      data:
                        raison: !lambda 'return journal_reset_reason();'
                        demarrages: !lambda 'return journal_boot_count();'
                        grave: !lambda 'return journal_is_serious() ? std::string("oui") : std::string("non");'
                        lignes: !lambda 'return journal_report_text();'
            - lambda: 'journal_mark_delivered();'

# Chronométrage des images LVGL pour « Tab5 Draw Max » (plus haut). Fusionné avec les
# blocs lvgl: de tab5-styles.yaml et tab5-lvgl.yaml. Deux lectures de micros() par
# image : coût négligeable, rien n'est touché à l'affichage.
lvgl:
  on_draw_start:
    - lambda: 'id(draw_t0_us) = micros();'
  # LV_EVENT_REFR_READY part à CHAQUE passage du timer de rafraîchissement, même
  # sans rien à redessiner (lv_refr.c : `goto refr_finish`) : sans l'appariement
  # avec un début de dessin, on mesurait le temps écoulé depuis la dernière image
  # (2,5 à 4,5 s au repos, relevé le 25/09 sur la première version).
  on_draw_end:
    - lambda: |-
        if (id(draw_t0_us) == 0) return;
        const uint32_t d = micros() - id(draw_t0_us);
        id(draw_t0_us) = 0;
        if (d > id(draw_max_us)) id(draw_max_us) = d;

globals:
  - id: draw_t0_us
    type: uint32_t
    initial_value: '0'
  - id: draw_max_us
    type: uint32_t
    initial_value: '0'
