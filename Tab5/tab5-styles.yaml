# [AI-CONTEXT]
# @file tab5-styles.yaml
# @role Définition des styles LVGL (polices, thèmes, bordures).
# @ai_instruction Interdiction d'utiliser des codes couleurs hexadécimaux en dur. Utiliser UIColor.
# ============================================================================
# =============================================================================
# THEME — "Dark Mode Slate" (Glassmorphism)
# -----------------------------------------------------------------------------
# Base ardoise (Tailwind Slate) + accents HSL vibrants (cyan / violet / emeraude).
# L'effet "verre depoli" est simule sur ESP32-P4 (pas de backdrop-blur materiel) :
#   - surfaces semi-transparentes (bg_opa)
#   - degrade vertical (haut clair -> bas sombre) = reflet de verre
#   - liseré fin lumineux (border_opa) = arête de verre
#   - ombre portee douce = profondeur / flottement
# IMPORTANT : tous les `id:` couleurs et styles existants sont CONSERVES
#             (le YAML HMI principal les reference par nom). Valeurs mises a jour
#             + nouveaux tokens ajoutes en fin de section.
# =============================================================================
color:
  # --- Surfaces ardoise (Slate) ---
  - id: color_bg
    hex: "0B1120"          # Ardoise profonde (fond application)
  - id: color_text
    hex: "F1F5F9"          # Blanc ardoise doux (slate-100)
  - id: color_text_dim
    hex: "94A3B8"          # Texte secondaire (slate-400)
  - id: color_temp_max
    hex: "F87171"          # Chaud (red-400)
  - id: color_temp_min
    hex: "38BDF8"          # Froid (sky-400)
  - id: color_bar_inactive
    hex: "334155"          # slate-700
  - id: color_orange_vif
    hex: "FB923C"          # orange-400 vibrant
  # --- Couleurs sémantiques (états) — versions HSL vibrantes ---
  - id: color_success
    hex: "34D399"          # emerald-400
  - id: color_warning
    hex: "FBBF24"          # amber-400
  - id: color_error
    hex: "FB7185"          # rose-400
  - id: color_info
    hex: "38BDF8"          # sky-400
  - id: color_gold
    hex: "FCD34D"          # amber-300
  - id: color_inactive
    hex: "334155"          # slate-700
  # --- Couleurs console ---
  - id: color_console_bg
    hex: "0A0E16"
  - id: color_console_label
    hex: "8595AD"
  # --- NOUVEAUX tokens "Slate Glass" (accents + matiere verre) ---
  - id: color_accent
    hex: "22D3EE"          # cyan-400 : accent primaire / halo
  - id: color_accent_alt
    hex: "A78BFA"          # violet-400 : accent secondaire
  - id: color_glass_hi
    hex: "2C3A52"          # Haut du degrade verre (reflet)
  - id: color_glass_lo
    hex: "131C2C"          # Bas du degrade verre (ombre interne)
  - id: color_glass_rim
    hex: "93A3BC"          # Liseré lumineux (arête de verre)
  - id: color_console_value
    hex: "FFFFFF"          # Valeurs numeriques console
  - id: color_icon_muted
    hex: "555555"          # Icone desactivee / placeholder
  - id: color_arc_track
    hex: "2A2D35"          # Fond arcslider clim / lumiere
  - id: color_modal_scrim
    hex: "05080F"          # Voile modal sombre
  - id: color_warm_pink
    hex: "F472B6"          # pink-400 (anniversaires calendrier ; miroir UIColor::WARM_PINK)
  # --- Jeu « Fil d'Or » (marble_game) : miroir des tokens Marble::Pal::* ---
  # Seuls les 3 fonds des conteneurs vivent ici ; toutes les autres couleurs du
  # jeu sont posees en C++ (marble_game.cpp) et n'ont donc pas de token YAML.
  - id: color_marble_void
    hex: "080C14"          # fond hors terrain (miroir Marble::Pal::VOID)
  - id: color_marble_floor
    hex: "111A28"          # sol jouable (miroir Marble::Pal::FLOOR)
  - id: color_marble_hud
    hex: "0C1220"          # bandeau HUD (miroir Marble::Pal::HUD_BG)
  # --- Jeu « Arcanoïde » (arkanoid_game) : miroir des tokens Arkanoid::Pal::* ---
  # Seuls les 3 fonds des conteneurs vivent ici ; toutes les autres couleurs du
  # jeu sont posées en C++ (arkanoid_game.cpp) et n'ont donc pas de token YAML.
  - id: color_arkanoid_void
    hex: "0A0A0F"          # fond hors terrain (miroir Arkanoid::Pal::VOID)
  - id: color_arkanoid_floor
    hex: "111118"          # sol jouable (miroir Arkanoid::Pal::FLOOR)
  - id: color_arkanoid_hud
    hex: "0D0D14"          # bandeau HUD (miroir Arkanoid::Pal::HUD_BG)
  # --- Jeu « Trial Poursuite » (trivia_game) ---------------------------------
  # trivia_game.yaml référençait ces 3 tokens sans qu'ils existent : la
  # compilation ESPHome échouait sur « Couldn't find ID 'color_trivia_void' ».
  # Contrairement aux 3 jeux ci-dessus, trivia_game.cpp ne pose PAS les fonds de
  # ses conteneurs en C++ — ils doivent donc bien vivre ici.
  # Teintes accordées à la carte Trivia du sélecteur arcade (accent
  # color_arcade_trivia_accent, plus bas).
  - id: color_trivia_void
    hex: "100A16"          # fond hors plateau
  - id: color_trivia_floor
    hex: "1A1028"          # plateau de jeu
  - id: color_trivia_hud
    hex: "150E22"          # bandeau HUD
  # --- Jeu « Neon Apron » (pinball_game) : miroir des tokens Pinball::Pal::* ---
  # Comme Marble et Arcanoïde : seuls les fonds des 4 conteneurs vivent ici, tout
  # le reste de la palette est posé en C++ (pinball_game.cpp).
  - id: color_pinball_void
    hex: "05070E"          # fond hors table (miroir Pinball::Pal::VOID)
  - id: color_pinball_felt
    hex: "121C2E"          # haut du sol (miroir Pinball::Pal::FELT_HI)
  - id: color_pinball_hud
    hex: "080C16"          # fronton / DMD (miroir Pinball::Pal::HUD_BG)
  # --- Sélecteur arcade (ui_components/game_selector.yaml) --------------------
  # Chaque carte = un fond (`_card`) + un accent (`_accent`, bordure et icône).
  # Les fonds des cartes Fil d'Or, Arcanoïde et Trial Poursuite réutilisent le
  # sol du jeu (color_marble_floor / color_arkanoid_floor / color_trivia_floor)
  # et les titres color_text ; tout le reste vit ici — plus aucun hex en dur dans
  # le sélecteur (audit du 06/09/2026, §4.1 point 11).
  - id: color_arcade_bg
    hex: "080810"          # fond de la page arcade
  - id: color_arcade_title
    hex: "FFDD22"          # icône + titre « ARCADE »
  - id: color_arcade_subtitle
    hex: "8595AD"          # sous-titre et descriptions des cartes (même gris que color_console_label)
  - id: color_arcade_footer
    hex: "4A5568"          # pied de page
  - id: color_arcade_close_bg
    hex: "222233"          # croix de fermeture : fond
  - id: color_arcade_close_border
    hex: "445566"          # croix de fermeture : bordure
  - id: color_arcade_close_icon
    hex: "AABBCC"          # croix de fermeture : glyphe
  - id: color_arcade_marble_accent
    hex: "E8B44A"
  - id: color_arcade_arkanoid_accent
    hex: "44DDDD"
  - id: color_arcade_pinball_card
    hex: "0D1420"
  - id: color_arcade_pinball_accent
    hex: "35E6FF"
  - id: color_arcade_lode_card
    hex: "0A0A12"
  - id: color_arcade_lode_accent
    hex: "FFC61A"
  - id: color_arcade_go_card
    hex: "1A150E"
  - id: color_arcade_go_accent
    hex: "C4A574"
  - id: color_arcade_trivia_accent
    hex: "FF9800"
  - id: color_arcade_draughts_card
    hex: "241810"
  - id: color_arcade_draughts_accent
    hex: "D4B896"
  - id: color_arcade_chess_card
    hex: "121A16"
  - id: color_arcade_chess_accent
    hex: "8FBF6A"

# =============================================================================
# FONTS — polices embarquées en flash
# =============================================================================
# Un glyphe absent de la police s'affiche VIDE, sans erreur de compilation.
# tools/check_tab5_code_rules.py (pytest) le vérifie : règle 6 pour la date,
# règle 7 pour les icônes MDI (chaque icône affichée est dans la police de son
# widget, et chaque glyphe déclaré est affiché quelque part — pas de poids mort).
font:
  # Texte libre (poussé par HA, réponses de l'assistant) : tout Latin-1 plus les
  # ajouts de Windows-1252 (€ … ’ « » œ Œ — –), 216 glyphes. Déclarée une fois
  # ici (ancre &latin1), reprise par *latin1 dans les cinq autres polices texte.
  - file: gfonts://Roboto@700
    id: roboto_32_b
    size: 32
    bpp: 4
    glyphs: &latin1 ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ¡¢£¤¥¦§¨©ª«¬®¯°±²³´µ¶·¸¹º»¼½¾¿ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖ×ØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõö÷øùúûüýþÿ'
  # Chiffres de l'horloge et de l'écran de sonnerie : rien d'autre.
  - file: gfonts://Roboto@700
    id: roboto_130_b
    size: 130
    bpp: 4
    glyphs: '0123456789:'
  # Heure du réveil, consigne et température de la clim, score du flipper. Le
  # tiret sert au « -- » de la consigne quand elle est inconnue (au boot, jusqu'au
  # 1er push de HA, ou consigne absente) : sans lui, le label restait vide.
  - file: gfonts://Roboto@700
    id: roboto_55_b
    size: 55
    bpp: 4
    glyphs: '-0123456789: °C.%'
  - file: gfonts://Roboto@700
    id: roboto_45_b
    size: 45
    bpp: 4
    glyphs: *latin1

  # roboto_45 ne sert QU'À lbl_date (« Jeu 02 Avr »), texte construit par le firmware
  # (update_clock_date_ui, tab5_anim.cpp : jours abrégés + %02d + clock_month_short_utf8).
  # 37 glyphes au lieu des 216 de *latin1 (25/09/2026, ≈ 59 Ko de flash) — la règle
  # « tout Latin-1 » ne vaut que pour le texte poussé par HA. Toucher au format de la
  # date ou aux tables de jours/mois = recalculer cette liste (règle 6).
  - file: gfonts://Roboto@400
    id: roboto_45
    size: 45
    bpp: 4
    glyphs: ' 0123456789ADFJLMNOSVaceilmnoprstuvéû'

  - file: gfonts://Roboto@700
    id: roboto_22
    size: 22
    bpp: 4
    glyphs: *latin1

  # --- Polices MONOSPACE (assistant vocal) ---
  # Roboto Mono : colonnes de largeur fixe => les tableaux Markdown (réponses IA)
  # restent alignés. 3 tailles pour le réglage "confort de lecture" S / M / L du popup.
  - file: gfonts://Roboto+Mono@500
    id: roboto_mono_20
    size: 20
    bpp: 4
    glyphs: *latin1
  - file: gfonts://Roboto+Mono@500
    id: roboto_mono_24
    size: 24
    bpp: 4
    glyphs: *latin1
  - file: gfonts://Roboto+Mono@500
    id: roboto_mono_28
    size: 28
    bpp: 4
    glyphs: *latin1

