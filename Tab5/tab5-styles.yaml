# =============================================================================
# LVGL — Glassmorphism "Slate"
# =============================================================================
lvgl:
  # [AI-CONTEXT] `id` explicite = seul moyen d'atteindre le LvglComponent depuis
  # une lambda (`id(tab5_lvgl)`), donc de changer la rotation À CHAUD. C'est ce
  # dont « Neon Apron » (pinball_game.cpp) a besoin pour passer le dashboard en
  # portrait 720×1280 le temps d'une partie, puis restaurer le paysage.
  # NE PAS retirer cet id, et NE PAS changer `rotation: 270` : c'est l'état de
  # repos du dashboard, celui que Pinball::close() rétablit.
  id: tab5_lvgl
  # [AI-WARNING] `rotation:` doit rester présent ici même si le jeu la surcharge
  # à chaud : ESPHome ne compile le support de rotation (rotation_type_ =
  # ROTATION_SOFTWARE, buffer de rotation + client PPA) QUE si la clé existe
  # dans la config. Sans elle, LvglComponent::set_rotation() se contente d'un
  # ESP_LOGW « rotation cannot be changed unless rotation was enabled during
  # setup » et le flipper resterait en paysage (vérifié dans
  # esphome/components/lvgl/lvgl_esphome.cpp, LvglComponent::set_rotation).
  rotation: 270
  color_depth: 16
  byte_order: little_endian
  buffer_size: 100%
  bg_color: color_bg
  style_definitions:
    # --- Panneau structurel plein-cadre ---
    # NB : radius volontairement CONSERVE a 0 (ce style sert de panneau plein-bord ;
    #      l'arrondir laisserait apparaitre le fond aux coins de l'ecran).
    #      On apporte la profondeur par un degrade vertical + liseré fin.
    - id: style_card
      bg_color: color_glass_hi
      bg_grad_color: color_glass_lo
      bg_grad_dir: VER
      bg_main_stop: 0
      bg_grad_stop: 255
      bg_opa: 100%
      border_width: 1
      border_color: color_glass_rim
      border_opa: 22%
      radius: 0

    # --- Carte meteo / tuiles dashboard ---
    # ESSAI C 16/07 : même décoration que les boutons Domo (style_clim_btn) —
    # fond 58%, bordure 1px/35%, radius 18. Couvre horloge, clim, bandeau central,
    # tuiles météo horaires/jours + page HA. pad/scrollbar conservés (conteneurs).
    # Rollback : docs/essais_design/tab5-styles_avant_meteo_comme_domo.yaml
    - id: style_meteo_card
