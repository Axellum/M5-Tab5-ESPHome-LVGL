# [AI-CONTEXT]
# @file tab5-styles.yaml
# @role Définition des styles LVGL (polices, thèmes, bordures).
# @ai_instruction Interdiction d'utiliser des codes couleurs hexadécimaux en dur. Utiliser UIColor.
# ============================================================================
# =============================================================================
# THEME — "Dark Mode Slate" (Glassmorphism)
# -----------------------------------------------------------------------------
# Base ardoise (Tailwind Slate) + accents HSL vibrants (cyan / violet / emeraude).
# L'effet "verre depoli" est simule sur ESP32-P4 (pas de backdrop-blur materiel) :
#   - surfaces semi-transparentes (bg_opa)
#   - degrade vertical (haut clair -> bas sombre) = reflet de verre
#   - liseré fin lumineux (border_opa) = arête de verre
#   - ombre portee douce = profondeur / flottement
# IMPORTANT : tous les `id:` couleurs et styles existants sont CONSERVES
#             (le YAML HMI principal les reference par nom). Valeurs mises a jour
#             + nouveaux tokens ajoutes en fin de section.
# =============================================================================
color:
  # --- Surfaces ardoise (Slate) ---
  - id: color_bg
    hex: "0B1120"          # Ardoise profonde (fond application)
  - id: color_card_bg
    hex: "1B2536"          # Carte opaque (fallback non-verre)
  - id: color_border
    hex: "5B6B85"          # Arête ardoise claire (utiliser avec border_opa)
  - id: color_text
    hex: "F1F5F9"          # Blanc ardoise doux (slate-100)
  - id: color_text_dim
    hex: "94A3B8"          # Texte secondaire (slate-400)
  - id: color_temp_max
    hex: "F87171"          # Chaud (red-400)
  - id: color_temp_min
    hex: "38BDF8"          # Froid (sky-400)
  - id: color_bar_active
    hex: "64748B"          # slate-500
  - id: color_bar_inactive
    hex: "334155"          # slate-700
  - id: color_orange_vif
    hex: "FB923C"          # orange-400 vibrant
  # --- Couleurs sémantiques (états) — versions HSL vibrantes ---
  - id: color_success
    hex: "34D399"          # emerald-400
  - id: color_warning
    hex: "FBBF24"          # amber-400
  - id: color_error
    hex: "FB7185"          # rose-400
  - id: color_info
    hex: "38BDF8"          # sky-400
  - id: color_gold
    hex: "FCD34D"          # amber-300
  - id: color_inactive
    hex: "334155"          # slate-700
  # --- Couleurs console ---
  - id: color_console_bg
    hex: "0A0E16"
  - id: color_console_border
    hex: "243047"
  - id: color_console_label
    hex: "8595AD"
  - id: color_reboot
    hex: "F43F5E"          # rose-500 (danger)
  # --- NOUVEAUX tokens "Slate Glass" (accents + matiere verre) ---
  - id: color_accent
    hex: "22D3EE"          # cyan-400 : accent primaire / halo
  - id: color_accent_alt
    hex: "A78BFA"          # violet-400 : accent secondaire
  - id: color_glass_hi
    hex: "2C3A52"          # Haut du degrade verre (reflet)
  - id: color_glass_lo
    hex: "131C2C"          # Bas du degrade verre (ombre interne)
  - id: color_glass_rim
    hex: "93A3BC"          # Liseré lumineux (arête de verre)
  - id: color_shadow
    hex: "000000"          # Ombre portee
  - id: color_console_value
    hex: "FFFFFF"          # Valeurs numeriques console
  - id: color_icon_muted
    hex: "555555"          # Icone desactivee / placeholder
  - id: color_arc_track
    hex: "2A2D35"          # Fond arcslider clim / lumiere
  - id: color_modal_scrim
    hex: "05080F"          # Voile modal sombre
  - id: color_warm_pink
    hex: "F472B6"          # pink-400 (anniversaires calendrier ; miroir UIColor::WARM_PINK)
  # --- Jeu « Fil d'Or » (marble_game) : miroir des tokens UIColor::MARBLE_* ---
  # Seuls les 3 fonds des conteneurs vivent ici ; toutes les autres couleurs du
  # jeu sont posees en C++ (marble_game.cpp) et n'ont donc pas de token YAML.
  - id: color_marble_void
    hex: "080C14"          # fond hors terrain (miroir UIColor::MARBLE_VOID)
  - id: color_marble_floor
    hex: "111A28"          # sol jouable (miroir UIColor::MARBLE_FLOOR)
  - id: color_marble_hud
    hex: "0C1220"          # bandeau HUD (miroir UIColor::MARBLE_HUD_BG)
  # --- Jeu « Arcanoïde » (arkanoid_game) : miroir des tokens UIColor::ARK_* ---
  # Seuls les 3 fonds des conteneurs vivent ici ; toutes les autres couleurs du
  # jeu sont posées en C++ (arkanoid_game.cpp) et n'ont donc pas de token YAML.
  - id: color_arkanoid_void
    hex: "0A0A0F"          # fond hors terrain (miroir UIColor::ARK_VOID)
  - id: color_arkanoid_floor
    hex: "111118"          # sol jouable (miroir UIColor::ARK_FLOOR)
  - id: color_arkanoid_hud
    hex: "0D0D14"          # bandeau HUD (miroir UIColor::ARK_HUD_BG)
  # --- Jeu « Trial Poursuite » (trivia_game) ---------------------------------
  # trivia_game.yaml référençait ces 3 tokens sans qu'ils existent : la
  # compilation ESPHome échouait sur « Couldn't find ID 'color_trivia_void' ».
  # Contrairement aux 3 jeux ci-dessus, trivia_game.cpp ne pose PAS les fonds de
  # ses conteneurs en C++ — ils doivent donc bien vivre ici.
  # Teintes accordées à la carte Trivia du sélecteur arcade (accent 0xFF9800).
  - id: color_trivia_void
    hex: "100A16"          # fond hors plateau
  - id: color_trivia_floor
    hex: "1A1028"          # plateau de jeu
  - id: color_trivia_hud
    hex: "150E22"          # bandeau HUD
  # --- Jeu « Neon Apron » (pinball_game) : miroir des tokens UIColor::PIN_* ---
  # Comme Marble et Arcanoïde : seuls les fonds des 4 conteneurs vivent ici, tout
  # le reste de la palette est posé en C++ (pinball_game.cpp).
  - id: color_pinball_void
    hex: "05070E"          # fond hors table (miroir UIColor::PIN_VOID)
  - id: color_pinball_felt
    hex: "121C2E"          # haut du sol (miroir UIColor::PIN_FELT_HI)
  - id: color_pinball_hud
    hex: "080C16"          # fronton / DMD (miroir UIColor::PIN_HUD_BG)

