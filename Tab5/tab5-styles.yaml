    glyphs: "\u2654\u2655\u2656\u2657\u2658\u2659\u265A\u265B\u265C\u265D\u265E\u265F"

# =============================================================================
# LVGL — Glassmorphism "Slate"
# =============================================================================
lvgl:
  # [AI-CONTEXT] `id` explicite = seul moyen d'atteindre le LvglComponent depuis
  # une lambda (`id(tab5_lvgl)`), donc de changer la rotation À CHAUD. C'est ce
  # dont « Neon Apron » (pinball_game.cpp) a besoin pour passer le dashboard en
  # portrait 720×1280 le temps d'une partie, puis restaurer le paysage.
  # NE PAS retirer cet id, et NE PAS changer `rotation: 270` : c'est l'état de
  # repos du dashboard, celui que Pinball::close() rétablit.
  id: tab5_lvgl
  # [AI-WARNING] `rotation:` doit rester présent ici même si le jeu la surcharge
  # à chaud : ESPHome ne compile le support de rotation (rotation_type_ =
  # ROTATION_SOFTWARE, buffer de rotation + client PPA) QUE si la clé existe
  # dans la config. Sans elle, LvglComponent::set_rotation() se contente d'un
  # ESP_LOGW « rotation cannot be changed unless rotation was enabled during
  # setup » et le flipper resterait en paysage (vérifié dans
  # esphome/components/lvgl/lvgl_esphome.cpp, LvglComponent::set_rotation).
  rotation: 270
  color_depth: 16
  byte_order: little_endian
  buffer_size: 100%
  bg_color: color_bg
  # Police par défaut (audit ressources du 26/09/2026, lot 6, D5) : aucun texte de
  # l'interface n'utilisait la montserrat_14 d'origine (tous les labels posent leur
  # police, mk_label() des jeux aussi) — elle n'est plus embarquée.
  default_font: roboto_22
  # Thème ESPHome : styles partagés posés sur CHAQUE widget du type à sa création,
  # avant ses `styles:` et ses propriétés locales, qui gardent donc la main.
  # - label : le blanc et la police courants de l'interface. Un label n'écrit plus
  #   `text_color: color_text` / `text_font: roboto_22` que s'il s'en écarte
  #   (292 réglages locaux retirés des sources).
  # - button : pas d'ombre. Le thème LVGL par défaut en posait une (3 px, décalée de
  #   4 px) sous tout bouton qui ne l'annulait pas — voiles des popups, cartes de
  #   l'arcade, pastilles — recalculée à chaque repeint, sans cache (D1).
  theme:
    label:
      text_font: roboto_22
      text_color: color_text
    button:
      shadow_width: 0
  style_definitions:
    # NB : `scrollbar_mode` n'est PAS une propriété de style : ESPHome l'ignore
    # sans avertissement dans style_definitions (vérifié dans main.cpp le
    # 26/09/2026, 6 occurrences retirées). Le poser sur le widget.
    # --- Carte meteo / tuiles dashboard ---
    # ESSAI C 16/07 : même décoration que les boutons Domo (style_clim_btn) —
    # fond 58%, bordure 1px/35%, radius 18. Couvre horloge, clim, bandeau central,
    # tuiles météo horaires/jours + page HA. pad/scrollbar conservés (conteneurs).
    # (Version d'avant l'essai : dans l'historique git du 16/07/2026 — le dossier
    #  docs/essais_design/ a ete retire du depot.)
    - id: style_meteo_card
      bg_color: color_glass_hi
      bg_grad_color: color_glass_lo
      bg_grad_dir: VER
      bg_opa: 58%
      border_width: 1
      border_color: color_glass_rim
      border_opa: 35%
      radius: 18
      shadow_width: 0
      outline_width: 0
      pad_all: 0

    # --- Conteneurs transparents (fonctionnel : inchanges) ---
    - id: style_transparent
      bg_opa: 0
      border_width: 0
      pad_all: 0
    - id: style_invisible
      bg_opa: 0
      border_width: 0
      shadow_width: 0
      outline_width: 0
      pad_all: 0

    # --- Bouton climatisation : pastille de verre ---
    - id: style_clim_btn
      bg_color: color_glass_hi
      bg_grad_color: color_glass_lo
      bg_grad_dir: VER
      bg_opa: 58%
      border_width: 1
      border_color: color_glass_rim
      border_opa: 35%
      radius: 18
      shadow_width: 0
      outline_width: 0

    # (style_modal_overlay supprimé le 25/07/2026 : le voile unique est
    #  ui_components/modal_scrim.yaml, opacité passée en var — ADR-0009.)

    # --- Carte modale "verre" flottante ---
    - id: style_modal_card
      bg_color: color_glass_hi
      bg_grad_color: color_glass_lo
      bg_grad_dir: VER
      bg_main_stop: 20
      bg_grad_stop: 245
      bg_opa: 88%
      border_width: 2
      border_color: color_glass_rim
      border_opa: 60%
      radius: 24
      shadow_width: 0
      pad_all: 0

    # --- NOUVEAU : carte de verre generique (reutilisable) ---
    - id: style_glass_card
      bg_color: color_glass_hi
      bg_grad_color: color_glass_lo
      bg_grad_dir: VER
      bg_main_stop: 25
      bg_grad_stop: 240
      bg_opa: 80%
      border_width: 2
      border_color: color_glass_rim
      border_opa: 55%
      radius: 20
      shadow_width: 0
      pad_all: 0

    # --- NOUVEAU : pastille / chip d'accent (cyan) ---
    - id: style_pill_accent
      bg_color: color_accent
      bg_opa: 18%
      border_width: 1
      border_color: color_accent
      border_opa: 70%
      radius: 999
      pad_all: 0
