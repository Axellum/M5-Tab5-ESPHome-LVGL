# ============================================================================
# [AI-CONTEXT]
# @file tab5-imu.yaml
# @role BMI270 (IMU embarquée) — accel/gyro/temp, tap-to-wake, et source
#     d'inclinaison du jeu « Fil d'Or » (marble_game.cpp).
# @architecture_constraint Bus I2C bsp_bus (GPIO31/32 @ 400 kHz), adresse 0x68.
#     Aucun conflit avec le PI4IOE (0x43/0x44). Composant natif ESPHome (motion:).
#     Les 3 axes d'accélération sont `internal: true` : à 10-30 Hz ils
#     saturaient l'API HA pour rien (~50 msg/s). Seuls pitch/roll/température
#     remontent à HA, fortement throttlés (diagnostic, pas télémétrie).
# @ai_instruction Ne pas modifier l'adresse I2C ni le bus. Ne pas retirer
#     `internal: true` des axes d'accélération. La cadence de poll est pilotée
#     dynamiquement par l'interval en bas de fichier : 100 ms au repos,
#     33 ms quand le jeu est ouvert. Ne pas la figer.
# ============================================================================

# --- Plateforme motion (BMI270) ---
# L'ODR matériel (100 Hz accel) est indépendant de la cadence de poll ESPHome :
# on lit toujours le dernier échantillon dispo, on change juste la fréquence de
# lecture selon qu'on joue ou non.
motion:
  - platform: bmi270
    id: tab5_imu
    address: 0x68
    i2c_id: bsp_bus
    accelerometer_range: 4G
    accelerometer_odr: 100HZ
    gyroscope_range: 2000DPS
    gyroscope_odr: 200HZ
    update_interval: 100ms    # valeur de repos ; ajustée à chaud (voir interval:)

sensor:
  # --- Axes d'accélération : usage 100 % local (jeu + tap-to-wake) ----------
  # `internal: true` => pas de publication HA. Les callbacks continuent de tourner.
  - platform: motion
    type: acceleration_x
    id: imu_accel_x
    internal: true

  - platform: motion
    type: acceleration_y
    id: imu_accel_y
    internal: true

  - platform: motion
    type: acceleration_z
    id: imu_accel_z
    internal: true
    # Z est publié en dernier dans le cycle du composant : on s'en sert comme
    # point de synchronisation pour pousser les 3 axes d'un coup (un seul appel
    # par cycle au lieu de trois) puis traiter le tap-to-wake.
    on_value:
      then:
        - lambda: |-
            float ax = id(imu_accel_x).state;
            float ay = id(imu_accel_y).state;
            float az = x;
            if (isnan(ax) || isnan(ay) || isnan(az)) return;

            // 1) Alimentation du jeu (simple stockage, aucun calcul lourd ici).
            Marble::on_imu(ax, ay, az);
            Arkanoid::on_imu(ax, ay, az);
            Pinball::on_imu(ax, ay, az);
            Lode::on_imu(ax, ay, az);

            // 2) Tap-to-wake : au repos la norme vaut ~1 g ; une tape franche
            // sur la dalle produit un pic > 2,5 g. Debounce 500 ms.
            if (!id(tab5_tap_to_wake).state) return;
            float mag = sqrtf(ax*ax + ay*ay + az*az);
            static uint32_t last_tap_ms = 0;
            uint32_t now = millis();
            if (mag > 2.5f && (now - last_tap_ms) > 500) {
                last_tap_ms = now;
                auto call = id(backlight).turn_on();
                call.perform();
            }

  # --- Diagnostic HA : orientation + température, throttlés ------------------
  - platform: motion
    type: pitch
    name: "Tab5 Pitch"
    id: imu_pitch
    filters:
      - throttle: 60s

  - platform: motion
    type: roll
    name: "Tab5 Roll"
    id: imu_roll
    filters:
      - throttle: 60s

  - platform: bmi270
    name: "Tab5 IMU Temperature"
    id: imu_temp
    filters:
      - throttle: 60s

# --- Switch : activer/désactiver le tap-to-wake ---
switch:
  - platform: template
    name: "Tab5 Tap-to-Wake"
    id: tab5_tap_to_wake
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# --- Cadence de poll adaptative -------------------------------------------
# Le jeu a besoin d'une entrée réactive (~30 Hz) ; le reste du temps 10 Hz
# suffit largement au tap-to-wake. `set_update_interval()` seul ne suffit pas :
# PollingComponent enregistre son interval une fois pour toutes dans
# call_setup(), il faut donc relancer le poller pour que la nouvelle valeur
# prenne effet (stop_poller/start_poller sont publics et prévus pour ça).
# On lit toujours le hub du jeu en premier, donc le passage en cadence rapide
# a tout le temps de se faire avant la première salle.
interval:
  - interval: 1s
    then:
      - lambda: |-
          static bool fast = false;
          bool want = Marble::is_open() || Arkanoid::is_open() || Pinball::is_open() || Lode::is_open();
          if (want == fast) return;
          fast = want;
          id(tab5_imu).set_update_interval(want ? 33 : 100);
          id(tab5_imu).stop_poller();
          id(tab5_imu).start_poller();
