# ============================================================================
# [AI-CONTEXT]
# @file tab5-alertes.yaml
# @role Popup « Alertes » (lot 4 du plan des alertes de la carte centrale, 06/10/2026) :
#       pose les widgets que tab5_alertes.cpp peint (g_alertes_ui) et ses deux demandes à
#       Home Assistant.
#         - tab5_alertes_ouvrir : ouvre le popup (« Alertes » de la roue de navigation,
#           ADR-0042, ou « Aller à l'écran → Alertes »). Pose les widgets
#           à la première ouverture, puis alertes_ouvrir() : dernière liste reçue, demande.
#         - tab5_alertes_demande : événement esphome.tab5_alertes_historique. HA y répond
#           par l'action tab5_maj_alertes_historique (tab5-api-logic.yaml) :
#           packages/tab5_evenements.yaml lance script.tab5_push_alertes_historique
#           (packages/tab5_push.yaml), qui repousse aussi la liste quand elle change
#           pendant que « Écran courant » vaut « Alertes ».
#         - tab5_alertes_tout_lu : bouton « Tout marquer comme lu » : les bandeaux de la
#           carte centrale sont lus tout de suite, comme un tap sur chacun
#           (central_tout_marquer_lu), et HA reçoit esphome.tab5_alerte_lue avec
#           alert_id « * », qu'il applique à toutes les alertes abonnées à lire.
#         - tab5_ha_alert_slots_init : table unique des 4 bandeaux de la carte centrale
#           (g_ha_alert_slots), voir son commentaire.
# @architecture_constraint Push-only, events-only (ADR-0001, ADR-0025) : la tablette ne
#       nomme aucune entité. Chargé APRÈS tab5_lvgl : il référence des widgets. Aucun lv_*
#       ici. La commande est une lambda SANS capture (pointeur de fonction), comme celle
#       de tab5-energie.yaml.
# @ai_instruction Un widget de plus = son champ dans AlertesUI (tab5_custom.h) et sa ligne
#       ici.
# ============================================================================

script:
  - id: tab5_alertes_ouvrir
    then:
      - lambda: |-
          AlertesUI& u = g_alertes_ui;
          if (u.popup == nullptr) {
            u.liste = id(alertes_liste);
            u.attente = id(alertes_attente);
            u.tout_lu = id(btn_alertes_tout_lu);
            u.police = id(roboto_32_b);
            u.police_heures = id(roboto_22);
            u.demander = []() { id(tab5_alertes_demande).execute(); };
            // En dernier : alertes_ouvrir() ne fait rien tant que popup est nul.
            u.popup = id(alertes_popup);
          }
          alertes_ouvrir();

  - id: tab5_alertes_demande
    mode: queued
    max_runs: 2
    then:
      - homeassistant.event:
          event: esphome.tab5_alertes_historique

  - id: tab5_alertes_tout_lu
    mode: single
    then:
      - lambda: |-
          // Widgets des 4 bandeaux : g_ha_alert_slots (script ci-dessous).
          id(tab5_ha_alert_slots_init).execute();
          central_tout_marquer_lu(g_ha_alert_slots, id(lbl_info_text), id(info_meteo_dismiss_id),
                                  id(tab5_dismissed_local), g_central_ctx);
          alertes_tout_lu_local();
      # Événement (ADR-0025) → script.tab5_dismiss_alert, alert_id « * ».
      - homeassistant.event:
          event: esphome.tab5_alerte_lue
          data:
            alert_id: "*"
      - script.execute: tab5_central_rotator_auto

  # Les 4 bandeaux d'alerte HA de la carte centrale (panneaux 4-7, ha_alert_panel.yaml
  # n = 0-3) : widgets et id d'acquittement de chacun, dans g_ha_alert_slots
  # (tab5_custom.h).
  # [AI-CONTEXT] SEUL endroit où cette table est écrite (06/10/2026 ; elle était
  # recopiée dans tab5_maj_alertes_ha_bulk, tab5_dismiss_ha_alert et
  # tab5_alertes_tout_lu) : `id()` n'existe que dans une lambda YAML, d'où ce script
  # plutôt qu'une table C++. Même modèle que tab5_modal_registry_init : idempotent,
  # chaque lecteur l'appelle avant de lire, peu importe lequel tourne en premier — le
  # service HA peut précéder l'on_boot, qui attend HA jusqu'à 30 s. Les cadres
  # restent aussi nommés dans l'on_boot (g_central_ctx.ha_wrap, tab5-ha-hmi.yaml et sa
  # copie tab5-rendu-host.yaml), qu'on ne touche pas sans l'accord d'Axel.
  - id: tab5_ha_alert_slots_init
    mode: single
    then:
      - lambda: |-
          if (g_ha_alert_slots[0].wrap != nullptr) return;
          g_ha_alert_slots[0] = {id(ha_alert_wrapper_0), id(lbl_ha_alert_0), &id(ha_alert_id_0), id(lbl_ha_alert_cpt_0)};
          g_ha_alert_slots[1] = {id(ha_alert_wrapper_1), id(lbl_ha_alert_1), &id(ha_alert_id_1), id(lbl_ha_alert_cpt_1)};
          g_ha_alert_slots[2] = {id(ha_alert_wrapper_2), id(lbl_ha_alert_2), &id(ha_alert_id_2), id(lbl_ha_alert_cpt_2)};
          g_ha_alert_slots[3] = {id(ha_alert_wrapper_3), id(lbl_ha_alert_3), &id(ha_alert_id_3), id(lbl_ha_alert_cpt_3)};
