# ============================================================================
# [AI-CONTEXT]
# @file geometrie-waveshare-7b.yaml
# @role Taille de l'écran de la Waveshare ESP32-P4-WIFI6-Touch-LCD-7B (ADR-0061) :
#       1024×600, dalle en paysage montée à l'envers : LVGL tourne l'image de 180°
#       (constaté sur la carte le 14/10/2026, comme agillis/esphome-modular-lvgl-buttons,
#       HomeTiles et le fil HA t/945864). Le tactile suit seul : ESPHome tourne les
#       appuis avec l'image (LvglComponent::rotate_coordinates) ; le transform du GT911
#       (carte-waveshare-7b.yaml) ne fait que caler la dalle tactile sur l'écran, quelle
#       que soit la rotation. Carte montée à l'envers : « Retourné » dans le select « Sens
#       de l'écran » de l'appareil (carte-waveshare-7b.yaml, ADR-0069), choisi dans Home
#       Assistant et gardé en NVS : rotation 0 à l'exécution, plus de rotation logicielle
#       (~69 ms au lieu de ~83 ms par écran entier, mesuré le 16/10/2026). Le firmware
#       publié sert donc les deux montages ; `carte_rotation` reste 180. Inclus par
#       carte-waveshare-7b.yaml (firmware) et par tab5-rendu-host.yaml
#       (`-s tab5_carte waveshare-7b`, captures en 1024×600).
# @architecture_constraint Mêmes clés que geometrie-tab5.yaml (voir son en-tête).
#       `carte_rotation` sert aussi à la rotation des captures du rendu
#       (tools/rendu/capturer.py --carte), qui n'a pas le select.
# @ai_instruction Seule la taille vient d'ici : les jetons de mise en page et
#       kEcranL/kEcranH en dérivent ; polices à 0,82 (≈ 1024 / 1280 et
#       600 / 720), arrondies.
# ============================================================================
substitutions:
  carte_ecran_l: "1024"
  carte_ecran_h: "600"
  carte_dalle_l: "1024"
  carte_dalle_h: "600"
  carte_rotation: "180"
  carte_police_echelle: "0.82"
