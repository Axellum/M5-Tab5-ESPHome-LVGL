# ============================================================================
# [AI-CONTEXT]
# @file geometrie-waveshare-7b.yaml
# @role Taille de l'écran de la Waveshare ESP32-P4-WIFI6-Touch-LCD-7B (ADR-0061) :
#       1024×600, dalle en paysage montée à l'envers : LVGL tourne l'image de 180°
#       (constaté sur la carte le 14/10/2026, comme agillis/esphome-modular-lvgl-buttons,
#       HomeTiles et le fil HA t/945864 ; le tactile suit par son transform,
#       carte-waveshare-7b.yaml). Inclus par
#       carte-waveshare-7b.yaml (firmware) et par tab5-rendu-host.yaml
#       (`-s tab5_carte waveshare-7b`, captures en 1024×600).
# @architecture_constraint Mêmes clés que geometrie-tab5.yaml (voir son en-tête).
#       `carte_rotation` sert aussi au retour au repos du flipper (kRotationRepos) et à
#       la rotation des captures du rendu (tools/rendu/capturer.py --carte).
# @ai_instruction EXPÉRIMENTAL : seule la taille vient d'ici. La mise en page des écrans
#       reste au pixel pour 1280×720 (lots suivants) ; polices à 0,82 (≈ 1024 / 1280 et
#       600 / 720), arrondies.
# ============================================================================
substitutions:
  carte_ecran_l: "1024"
  carte_ecran_h: "600"
  carte_dalle_l: "1024"
  carte_dalle_h: "600"
  carte_rotation: "180"
  carte_police_echelle: "0.82"
