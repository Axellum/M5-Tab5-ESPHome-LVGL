# ═══════════════════════════════════════════════════════════════════════════
# [AI-CONTEXT] Thèmes de l'écran (ADR-0029, lot 2) : le select « Thème », le select
# « Clair ou sombre » (Sombre, Clair, Auto), l'interrupteur « Nuit (thème auto) » que
# Home Assistant règle d'après le soleil (packages/tab5_push.yaml, mode Auto), et la
# repeinture après un changement de palette.
# - Les palettes : Tab5/themes/<thème>.yaml, écrites dans tab5_tokens.h (THEMES[]) par
#   tools/gen_themes.py. Les options du select « Thème » et la repeinture des styles
#   partagés ci-dessous sont générées aussi (entre `>>>` et `<<<`) : NE PAS les
#   modifier à la main, `python tools/gen_themes.py --check` échoue en CI.
# - [AI-WARNING] Démarrage : ESPHome 2026.9 crée les styles et les widgets dans main(),
#   AVANT le setup des composants. Les trois entités publient leur valeur gardée
#   pendant leur setup (priorité HARDWARE) : un thème clair gardé en mémoire est donc
#   appliqué à un écran déjà construit en sombre, comme une bascule. tab5_theme_repeindre
#   repeint les styles tout de suite, puis attend la fin du démarrage (theme_ui_pret())
#   pour faire repeindre aux modules ce qu'ils ont peint entre-temps. Ne pas « simplifier »
#   le wait_until : sans lui, un module repeindrait avant d'avoir ses widgets.
# - En marche, un changement passe par le même chemin. Preuve : le rendu hors tablette
#   compare la bascule à chaud au démarrage à froid dans le même thème, au pixel près
#   (tools/rendu/, .github/workflows/rendu-host.yml, tâches « clair » et « galerie »).
# - Le select « Thème » garde l'INDEX (restore_value) : un nouveau thème s'ajoute à la
#   fin (`ordre:`). Home Assistant lit les options : jamais traduites (le nom d'un
#   thème est un nom propre, les modes sont des valeurs que HA écrit).
# - Les jeux restent sombres (PALETTE_SOMBRE, ADR-0014) : leurs pages naissent avec
#   le `bg_color` de `lvgl:` (tab5-styles.yaml), évalué avant la restauration du
#   thème ; seule la page principale est repeinte ici.
# - Lot 3 : un thème peut aussi changer les formes des styles partagés (rayons,
#   bordures, dégradés, ombres : theme_formes), garder sombres le bandeau central et
#   l'horloge en mode clair (UIBandeau, UIHorloge) et changer trois polices
#   d'affichage (heure, date, titres : theme_polices). Les polices des thèmes sont
#   déclarées ci-dessous, générées elles aussi (tailles : tools/police_theme.py).
# - [AI-WARNING] Bascule rapide (08/10/2026) : les couleurs sont reposées avec le
#   rafraîchissement des styles COUPÉ (lv_obj_enable_style_refresh), puis l'écran entier
#   est redessiné une fois ; theme_formes ne rafraîchit que les porteurs de ses styles
#   (restent 3 lv_obj_report_style_change pour les polices, 5 pour le calendrier).
#   Avant : un par style, 3,2 s de boucle bloquée à chaque changement de thème ou de
#   mode (mesuré le 07/10/2026 ; prototype : ~0,2 s). Le bloc des couleurs ne doit donc
#   changer que des couleurs : une propriété de taille, de place ou de zone de dessin y
#   resterait sans effet jusqu'au prochain rafraîchissement. tests/test_themes.py le vérifie.
# ═══════════════════════════════════════════════════════════════════════════

