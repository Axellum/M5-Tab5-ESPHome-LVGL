# <<< polices

select:
  - platform: template
    id: tab5_theme
    name: "Thème"
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    # Thème d'une tablette neuve (choix d'Axel, 05/10/2026) ; un thème déjà choisi reste.
    initial_option: "Relief doux"
    options:
      # >>> themes (généré par tools/gen_themes.py, ne pas éditer)
      - "Ardoise"
      - "Relief doux"
      - "Relief plat"
      - "Graphite"
      - "Almanach imprimé"
      - "Ardoise douce"
      - "Terre cuite"
      - "Craie et ardoise"
      - "Almanach"
      - "Béton brut"
      - "Néon calme"
      - "Zen Sumi"
      - "Bento"
      - "Obsidienne"
      - "Platine et or"
      - "Signalisation"
      - "Capsule"
      - "Pixel"
      - "Bonbon"
      - "Sorbet"
      - "Ultraviolet"
      # <<< themes
    on_value:
      - script.execute: tab5_theme_choisir

  # Sombre / Clair : le mode du thème choisi. Auto : clair le jour, sombre la nuit,
  # d'après l'interrupteur « Nuit (thème auto) » que HA tient à jour.
  - platform: template
    id: tab5_theme_mode
    name: "Clair ou sombre"
    icon: mdi:theme-light-dark
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Sombre"
      - "Clair"
      - "Auto"
    initial_option: "Sombre"
    on_value:
      - script.execute: tab5_theme_choisir

switch:
  # Réglé par Home Assistant (soleil couché = allumé) : packages/tab5_push.yaml,
  # automatisation « Tab5 — thème jour/nuit ». Sans effet hors du mode Auto. Gardé
  # d'un démarrage à l'autre ; sans HA, le mode Auto reste sur le dernier état connu.
  - platform: template
    id: tab5_theme_nuit
    name: "Nuit (thème auto)"
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: tab5_theme_choisir
    on_turn_off:
      - script.execute: tab5_theme_choisir

script:
  # Palette du thème et du mode choisis ; repeint seulement si elle change.
  - id: tab5_theme_choisir
    then:
      - lambda: |-
          const auto theme = id(tab5_theme).active_index();
          const auto mode = id(tab5_theme_mode).active_index();
          if (theme_selectionner(theme.value_or(0), mode.value_or(0), id(tab5_theme_nuit).state))
            id(tab5_theme_repeindre).execute();
      # Popup Réglages (tab5-reglages.yaml) : nom du thème, mode et nuit choisis, même
      # sans changement de palette (Sombre → Auto la nuit), dans les couleurs du thème.
      - script.execute: tab5_reglages_sync_ui

  # restart : un nouveau changement pendant l'attente du démarrage reprend du début.
  - id: tab5_theme_repeindre
    mode: restart
    then:
      # [AI-WARNING] Avant les formes du thème : le repérage des boutons verre (on_boot,
      # apply_pressed_scale_to_tree, 2 s après le démarrage) les reconnaît à leur rayon de
      # 18, qu'un thème peut changer. Ils sont marqués ici, une fois, dans l'état compilé.
