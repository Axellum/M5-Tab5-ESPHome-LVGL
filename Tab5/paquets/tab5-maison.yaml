# ============================================================================
# [AI-CONTEXT]
# @file tab5-maison.yaml
# @role Popup « Maison » (ADR-0037, 07/10/2026, discussion #278) : pose les widgets que
#       tab5_maison.cpp dispose et peint (g_maison_ui), puis ouvre le popup.
#         - tab5_maison_ouvrir : « Aller à l'écran → Maison » (tab5-navigation.yaml) ou,
#           en mode HA, un tap sur le titre de la pièce dans la carte centrale
#           (btn_page_title_tap, tab5-lvgl.yaml, si maison_titre_appui_valide()).
# @architecture_constraint Rien vers Home Assistant ici : les lignes envoient les
#       commandes des tuiles par leur chemin habituel (tab5_tuiles.cpp, script
#       tab5_action). Chargé APRÈS tab5_lvgl : il référence des widgets. Aucun lv_* ici.
# @ai_instruction Un widget de plus = son champ dans MaisonUI (tab5_custom.h) et sa ligne
#       ici. Les widgets d'une ligne ne sont pas listés : tab5_maison.cpp les lit dans
#       l'ordre de ses enfants (maison_ligne.yaml).
# ============================================================================

script:
  - id: tab5_maison_ouvrir
    then:
      - lambda: |-
          MaisonUI& u = g_maison_ui;
          if (u.popup == nullptr) {
            u.vide = id(maison_vide);
            u.eteindre = id(btn_maison_eteindre);
            u.entete[0] = id(maison_entete_0);
            u.entete[1] = id(maison_entete_1);
            u.entete[2] = id(maison_entete_2);
            u.entete[3] = id(maison_entete_3);
            u.entete[4] = id(maison_entete_4);
            u.ligne[0][0] = id(maison_ligne_00);
            u.ligne[0][1] = id(maison_ligne_01);
            u.ligne[0][2] = id(maison_ligne_02);
            u.ligne[0][3] = id(maison_ligne_03);
            u.ligne[0][4] = id(maison_ligne_04);
            u.ligne[1][0] = id(maison_ligne_10);
            u.ligne[1][1] = id(maison_ligne_11);
            u.ligne[1][2] = id(maison_ligne_12);
            u.ligne[1][3] = id(maison_ligne_13);
            u.ligne[1][4] = id(maison_ligne_14);
            u.ligne[2][0] = id(maison_ligne_20);
            u.ligne[2][1] = id(maison_ligne_21);
            u.ligne[2][2] = id(maison_ligne_22);
            u.ligne[2][3] = id(maison_ligne_23);
            u.ligne[2][4] = id(maison_ligne_24);
            u.ligne[3][0] = id(maison_ligne_30);
            u.ligne[3][1] = id(maison_ligne_31);
            u.ligne[3][2] = id(maison_ligne_32);
            u.ligne[3][3] = id(maison_ligne_33);
            u.ligne[3][4] = id(maison_ligne_34);
            u.ligne[4][0] = id(maison_ligne_40);
            u.ligne[4][1] = id(maison_ligne_41);
            u.ligne[4][2] = id(maison_ligne_42);
            u.ligne[4][3] = id(maison_ligne_43);
            u.ligne[4][4] = id(maison_ligne_44);
            // En dernier : maison_ouvrir() et les repeintures ne font rien tant que popup est nul.
            u.popup = id(maison_popup);
          }
          maison_ouvrir();
