              default: break;
            }
          };
          // En dernier : le C++ ne peint rien tant que calque est nul.
          u.calque = id(musique_calque);

  - id: tab5_musique_evenement
    mode: queued
    max_runs: 8
    parameters:
      action: string
      piece: string
      valeur: string
    then:
      - homeassistant.event:
          event: esphome.tab5_musique
          data:
            action: !lambda 'return action;'
            piece: !lambda 'return piece;'
            valeur: !lambda 'return valeur;'

# « Chargement... » qui dure plus de 8 s devient une phrase courte (tab5_musique.cpp).
interval:
  - interval: 1s
    then:
      - lambda: 'musique_tic();'
