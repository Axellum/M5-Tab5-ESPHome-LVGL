# ============================================================================
# [AI-CONTEXT]
# @file tab5-musique.yaml
# @role Musique de toute la maison (ADR-0067, 18/10/2026) : pose les widgets que
#       tab5_musique.cpp peint (g_musique_ui), les pochettes de la bibliothèque et
#       l'événement des commandes.
#         - tab5_musique_lier : widgets et rappels dans g_musique_ui, une fois (appelé par
#           les deux poussées, tab5-api-logic.yaml, et à l'ouverture du popup Musique,
#           tab5_lecteur_ouvrir de tab5-lecteur.yaml) ;
#         - tab5_musique_evenement : événement esphome.tab5_musique (action, piece, valeur).
#           HomeAssistant_Config/packages/tab5_evenements.yaml le confie à
#           script.tab5_musique_commande (packages/tab5_musique.yaml), qui retrouve la pièce
#           par son rang et n'accepte qu'une ref « schéma://… » : aucune entité ni action ne
#           vient de la tablette ;
#         - les dix pochettes : musique_pochette.yaml, une image et son script chacune.
# @architecture_constraint Push-only, events-only (ADR-0001, ADR-0025). Chargé APRÈS
#       tab5_lvgl (il référence des widgets) et après tab5_assist (client HTTP des images).
#       Aucun lv_* ici. Les commandes sont des lambdas SANS capture (pointeurs de fonction).
# @ai_instruction Un widget de plus = son champ dans MusiqueUI (tab5_musique.h) et sa ligne
#       dans tab5_musique_lier.
# ============================================================================

# Les dix pochettes de la grille (règle 5 : un package paramétré inclus dix fois).
packages:
  musique_pochette_0: !include { file: musique_pochette.yaml, vars: { n: 0 } }
  musique_pochette_1: !include { file: musique_pochette.yaml, vars: { n: 1 } }
  musique_pochette_2: !include { file: musique_pochette.yaml, vars: { n: 2 } }
