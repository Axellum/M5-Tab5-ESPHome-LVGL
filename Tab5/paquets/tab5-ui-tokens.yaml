# ============================================================================
# [AI-CONTEXT]
# @file tab5-ui-tokens.yaml
# @role Tokens de GÉOMÉTRIE de l'UI (les tokens de COULEUR sont dans
#       tab5-styles.yaml sous `color:`). Package inclus par tab5-ha-hmi.yaml —
#       ESPHome fusionne les `substitutions:` des packages avec celles de la
#       racine (user_entities.yaml, gitignoré : ne pas y toucher).
# @architecture_constraint Source unique de la taille des fenêtres modales.
#       Changer modal_card_w/h ici change les 9 popups d'un coup. Le corps de
#       chaque popup démarre à y = ${modal_body_y} (= barre de titre de
#       modal_header.yaml + 20 px d'air). Voir ADR-0009.
# ============================================================================
substitutions:
  # Carte modale — 15 px des bords de l'écran 1280×720
  modal_card_w: "1250"
  modal_card_h: "690"
  # Barre de titre compacte : 4 (haut) + 44 (ligne) + 4
  modal_hdr_h: "52"
  # Premier y libre sous la barre de titre : ${modal_hdr_h} + 20 px d'air
  # (respiration titre/corps demandée le 28/07 — les hauteurs internes des
  # popups sont calées sur 690 - 72 - 20 = 598 px utiles).
  modal_body_y: "72"
  # Offset bas standard pour les barres d'action / légendes (BOTTOM_MID)
  modal_bottom_y: "-20"
  # Première ligne de la grille calendrier (modal_body_y + 30 px d'en-tête jours)
  cal_grid_y: "102"
  # Hauteur réservée à la grille, jusqu'à 10 px au-dessus de la légende (posée
  # à ${modal_bottom_y} du bas de la carte). cal_render_month() y répartit les
  # 4 à 6 semaines du mois et centre le tout.
  cal_grid_h: "528"
  # Carte "Réponse" de l'assistant vocal : sous la carte "Votre demande"
  # (modal_body_y + 104 px de haut + 12 px de respiration). Si modal_body_y
  # change, recalculer cette valeur à la main (ESPHome ne fait pas d'arithmétique
  # dans les substitutions) — sinon "Réponse" chevauche "Votre demande" sans
  # qu'aucun garde-fou ne le détecte.
  assist_resp_y: "188"
  # Largeur des panneaux de la carte centrale (central_card, tab5-lvgl.yaml : 1198 px
  # utiles = 1240 - 2 × 20 de marge - 2 × 1 de bordure) : boutons invisibles d'appui
  # des panneaux (tab5-lvgl.yaml, ha_alert_panel.yaml) et réponse vocale longue. Le C++
  # la reprend (kLargeurPanneauCentral, tab5_central.cpp) : tests/test_geometrie_partagee.py
  # vérifie que les deux restent égales.
  central_w: "1180"
  # Accueil, cadres « Ok Nabu » (btn_ok_nabu, tab5-lvgl.yaml) et − / + (climate_controls_zone,
  # climate_card.yaml), en miroir, bas à y 308 (09/10/2026, demande d'Axel : 90 px, le
  # texte « nageait » dedans). Leur intérieur est une ligne de zone (ligne_zone_h) : la
  # hauteur de la rangée sous l'horloge, où se dessinent les mêmes lignes de capteurs
  # (rangee_panneau.yaml) ; une ligne de texte de 45 px (encre 33 px en Roboto) y garde
  # 18 px d'air au-dessus et au-dessous. cadre_bas_h = ligne_zone_h + 2 × 1 px de bordure
  # (pas d'arithmétique dans les substitutions : changer l'un, c'est changer l'autre ;
  # tests/test_nabu.py les compare).
  ligne_zone_h: "70"
  cadre_bas_h: "72"
