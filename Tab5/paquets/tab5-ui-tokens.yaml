# ============================================================================
# [AI-CONTEXT]
# @file tab5-ui-tokens.yaml
# @role Tokens de GÉOMÉTRIE de l'UI (les tokens de COULEUR sont dans
#       tab5-styles.yaml sous `color:`). Package inclus par tab5-ha-hmi.yaml —
#       ESPHome fusionne les `substitutions:` des packages avec celles de la
#       racine (user_entities.yaml, gitignoré : ne pas y toucher).
# @architecture_constraint Source unique de la taille des fenêtres modales.
#       Changer modal_card_w/h ici change les 9 popups d'un coup. Le corps de
#       chaque popup démarre à y = ${modal_body_y} (= barre de titre de
#       modal_header.yaml + 20 px d'air). Voir ADR-0009.
# ============================================================================
substitutions:
  # Carte modale — 15 px des bords de l'écran : 1250×690 sur le Tab5 (1280×720). La
  # taille de l'écran vient de la carte (carte_ecran_l / carte_ecran_h,
  # Tab5/paquets/geometrie-<carte>.yaml, ADR-0061) ; ESPHome 2026.9 calcule l'expression
  # Jinja (vérifié le 12/10/2026). Le C++ fait le même calcul (kCarteL / kCarteH,
  # Tab5/socle/tab5_geometrie.h) : tests/test_geometrie_partagee.py compare, carte par carte.
  modal_card_w: ${ carte_ecran_l | int - 30 }
  modal_card_h: ${ carte_ecran_h | int - 30 }
  # Carte du popup Musique (ADR-0050) : centrée et plus petite, le tableau de bord voilé
  # reste visible autour. Le C++ la reprend (kLecteurCarteL/H, Tab5/socle/tab5_geometrie.h) :
  # tests/test_geometrie_partagee.py tient les deux égales.
  lecteur_card_w: "940"
  lecteur_card_h: "536"
  # Barre de titre compacte : 4 (haut) + 44 (ligne) + 4
  modal_hdr_h: "52"
  # Premier y libre sous la barre de titre : ${modal_hdr_h} + 20 px d'air
  # (respiration titre/corps demandée le 28/07 — les hauteurs internes des
  # popups sont calées sur 690 - 72 - 20 = 598 px utiles).
  modal_body_y: "72"
  # Offset bas standard pour les barres d'action / légendes (BOTTOM_MID)
  modal_bottom_y: "-20"
  # Ombre la plus large qu'un thème donne à un bouton (style_clim_btn) et à une carte
  # (style_meteo_card) : Relief plat, 13 et 26 px. Marge intérieure d'un conteneur dont les
  # touches touchent le bord : LVGL 9.5 coupe l'ombre d'un enfant au bord de son parent,
  # même en overflow_visible (seulement à la marge de dessin du parent, 0 s'il est
  # transparent). tests/test_telecommandes.py relit les thèmes.
  ombre_bouton_max: "13"
  ombre_carte_max: "26"
  # ─── Corps des popups (lot 2 du portage 1024×600, ADR-0061) ───────────────────────────
  # Ce que les popups ont en commun suit la carte modale ; le C++ fait les mêmes calculs
  # (Tab5/socle/tab5_geometrie.h : kCorpsW, kCorpsH, kGraphiqueL, kDemiL, kDemiX,
  # kOngletsFin…) et tests/test_geometrie_partagee.py compare, carte par carte. Valeurs du
  # Tab5 entre parenthèses.
  # Corps : x 24 de la carte, toute sa largeur moins 24 px de chaque côté (1202), de
  # ${modal_body_y} à 20 px du bas (598).
  corps_w: ${ modal_card_w | int - 48 }
  corps_h: ${ modal_card_h | int - 92 }
  # Zone d'un graphique dans une carte pleine largeur, 18 px de marge de chaque côté (1166).
  graphique_l: ${ corps_w | int - 36 }
  # Deux demi-cartes côte à côte, 24 px entre elles : largeur (589) et x de la seconde (637).
  demi_w: ${ (corps_w | int - 24) // 2 }
  demi_x: ${ 24 + (corps_w | int - 24) // 2 + 24 }
  # Mise en page propre de chaque popup (lot 4 du portage) : ses littéraux sont ceux du
  # Tab5, ramenés au corps de la carte dans l'expression même, arrondis en dessous — une
  # largeur ou un x `${ 386 * (corps_w | int) // 1202 }`, une hauteur ou un y
  # `${ 456 * (corps_h | int) // 598 }`, un carré la plus petite des deux, un négatif
  # `${ 0 - 22 * (corps_h | int) // 598 }`. Le C++ : largeur_carte(), hauteur_carte(),
  # taille_carte() (tab5_geometrie.h). Sur le Tab5 : les valeurs au pixel.
  # Onglets d'en-tête (reglages_onglet.yaml) : fin de leur zone, 8 px avant la croix (1148),
  # et la largeur de cette zone depuis x 196, plafonnée à celle du Tab5 (952) — les places
  # du Tab5 sont réduites de onglets_zone / 952 depuis la croix (onglet_x(), tab5_geometrie.h).
  onglets_fin: ${ modal_card_w | int - 102 }
  onglets_zone: ${ [modal_card_w | int - 298, 952] | min }
  # Colonnes du calendrier (kCalColPas, kCalColW, kCalColX0) : pas (172), case (168), x de
  # la première (25), grille centrée dans la carte.
  cal_col_pas: ${ (modal_card_w | int - 46) // 7 }
  cal_col_w: ${ cal_col_pas | int - 4 }
  cal_col_x0: ${ (modal_card_w | int - 7 * (cal_col_pas | int) + 4) // 2 }
  # En-tête du calendrier (calendar_popup.yaml) : ‹ et › (80 px) à cal_nav_x du milieu de
  # la carte (278), le mois entre eux (cal_mois_l, 420). Sur une carte plus étroite, › garde
  # 16 px d'air avant « Aujourd'hui » (150 px, à 100 px du bord droit) et le mois 16 px de
  # chaque côté : 191 et 270 sur la 7B, où › était caché sous « Aujourd'hui » (18/10/2026).
  cal_nav_x: ${ [278, (modal_card_w | int) // 2 - 306] | min }
  cal_mois_l: ${ [420, 2 * ([278, (modal_card_w | int) // 2 - 306] | min) - 112] | min }
  # Rangées du popup Réglages (reglages_rangee.yaml avec fixe: 46, reglages_choix_btn.yaml) :
  # chaque commande 40 px sous le titre de sa rangée, quelle que soit la carte ; les titres
  # se répartissent donc sur le corps moins 46 px (552 sur le Tab5, y × reglages_h / 552) et
  # la dernière commande garde son air au-dessus du bas de la carte : 19 px sur le Tab5,
  # 16 sur la 7B (elle en avait 3 avec y × corps_h / 598, rendu du 18/10/2026).
  reglages_h: ${ corps_h | int - 46 }
  # Lignes d'une pièce, popups Lumières et Volets (piece_ligne.yaml) : pas (92) et hauteur
  # (84) ; cinq lignes à partir de y 50 de leur carte, les boutons de la pièce au-dessous.
  piece_ligne_pas: ${ [92, (corps_h | int - 130) // 5] | min }
  piece_ligne_h: ${ piece_ligne_pas | int - 8 }
  # Largeur d'une ligne (342) : la carte de gauche de ces popups (386 sur le Tab5, ramenée
  # au corps : kPieceLigneL) moins 22 px de marge de chaque côté (lot 4 du portage).
  piece_ligne_l: ${ 386 * (corps_w | int) // 1202 - 44 }
  # Tout ouvrir / Tout fermer du popup Volets (volet_popup.yaml) : côte à côte sous les lignes,
  # à leurs bords (163 px, 16 px entre eux, x 22 sur le Tab5). Le mot (roboto_22, qui ne
  # rétrécit pas : « Tout fermer » 118 px) veut 134 px de bouton ; sur une carte trop étroite,
  # les boutons gagnent sur la marge de la carte, 10 px entre eux : 134 px à x 12 sur la 7B,
  # où le mot touchait les bords d'un bouton de 121 (rendu du 18/10/2026).
  volet_tout_l: ${ [(piece_ligne_l | int - 16) // 2, [134, (386 * (corps_w | int) // 1202 - 34) // 2] | min] | max }
  volet_tout_ecart: ${ 16 if (volet_tout_l | int) == (piece_ligne_l | int - 16) // 2 else 10 }
  volet_tout_x: ${ (386 * (corps_w | int) // 1202 - 2 * (volet_tout_l | int) - (volet_tout_ecart | int)) // 2 }
  # Raccourcis de luminosité du popup Lumières (light_level_btn.yaml) : quatre boutons de 80 px
  # au pas de 90 depuis x 22 sur le Tab5. « 100 % » (roboto_22) fait 60 px : sur une carte où
  # le bouton ramené n'aurait pas 5 px d'air de chaque côté (70 px), les boutons prennent la
  # carte, 6 px entre eux, centrés : 67 px à x 13 sur la 7B (3 px d'air), où le texte touchait
  # les bords d'un bouton de 62.
  lum_niveau_l: ${ [80 * (corps_w | int) // 1202, [70, (398 * (corps_w | int) // 1202 - 42) // 4] | min] | max }
  lum_niveau_pas: ${ 90 * (corps_w | int) // 1202 if (lum_niveau_l | int) == 80 * (corps_w | int) // 1202 else (lum_niveau_l | int) + 6 }
  lum_niveau_x: ${ 22 if (lum_niveau_l | int) == 80 * (corps_w | int) // 1202 else (398 * (corps_w | int) // 1202 - 3 * (lum_niveau_pas | int) - (lum_niveau_l | int)) // 2 }
  # Hauteur d'une ligne de Roboto Bold (roboto_700.ttf : ascendante 1900, descendante 500
  # sur 2048, arrondies vers le haut comme FreeType) à la taille de la carte (polices
  # × carte_police_echelle) : le pas des rouleaux du Réveil (rouleau.yaml) et ses lignes
  # de texte (lot 4 du portage). Tab5 : 153 (roboto_130_b), 53 (roboto_45_b), 38 (roboto_32_b).
  ligne_roboto_130_b: ${ ((1900 * ((130 * (carte_police_echelle | float)) | round | int) / 2048) | round(0, 'ceil') | int) + ((500 * ((130 * (carte_police_echelle | float)) | round | int) / 2048) | round(0, 'ceil') | int) }
  ligne_roboto_45_b: ${ ((1900 * ((45 * (carte_police_echelle | float)) | round | int) / 2048) | round(0, 'ceil') | int) + ((500 * ((45 * (carte_police_echelle | float)) | round | int) / 2048) | round(0, 'ceil') | int) }
  ligne_roboto_32_b: ${ ((1900 * ((32 * (carte_police_echelle | float)) | round | int) / 2048) | round(0, 'ceil') | int) + ((500 * ((32 * (carte_police_echelle | float)) | round | int) / 2048) | round(0, 'ceil') | int) }
  # Caméras (lot 4 du portage) : l'image, 1920 × 1080 en huitièmes (HA réduit par 1/8 … 7/8 :
  # la plus grande qui tient dans le corps avec le nom, l'heure et les pastilles dessous,
  # 58 px), dans son cadre (2 px de bordure) : 4/8, 964 × 544 sur le Tab5, 3/8, 724 × 409
  # sur la 7B ; kImageHuitiemes, kCadreL de tab5_cameras.cpp (même calcul,
  # tests/test_cameras_popup.py).
  cameras_huitiemes: ${ [4, (corps_h | int - 58) * 8 // 1080, (corps_w | int) * 8 // 1920] | min }
  cameras_cadre_l: ${ 240 * (cameras_huitiemes | int) + 4 }
  cameras_cadre_h: ${ 135 * (cameras_huitiemes | int) + 4 }
  # Mes Plantes (lot 4 du portage) : cinq cartes sur la largeur du corps, l'écart ramené au
  # corps — pas (244) et largeur (226) ; kPotPas, kPotEcart de tab5_zones.cpp. Dans une
  # carte, les lignes Fertilité… gardent 14 px de marge tant que la carte en a la place ;
  # sinon la marge cède (5 px sur la 7B, carte de 178) : roboto_22 ne rétrécit pas, et
  # « Température » (128 px) doit tenir à droite de son icône (2 + 32 px et 4 px d'air),
  # soit 168 px de ligne au moins ; le texte passe alors de x 50 à 38
  # (tests/test_plantes_popup.py).
  pot_carte_pas: ${ (corps_w | int + 18 * (corps_w | int) // 1202) // 5 }
  pot_carte_l: ${ pot_carte_pas | int - 18 * (corps_w | int) // 1202 }
  pot_ligne_marge: ${ [14, (pot_carte_l | int - 168) // 2] | min }
  pot_ligne_l: ${ pot_carte_l | int - 2 * (pot_ligne_marge | int) }
  pot_texte_x: ${ [50, pot_ligne_l | int - 130] | min }
  # Première ligne de la grille calendrier (modal_body_y + 30 px d'en-tête jours)
  cal_grid_y: ${ modal_body_y | int + 30 }
  # Hauteur réservée à la grille, jusqu'à 10 px au-dessus de la légende (posée
  # à ${modal_bottom_y} du bas de la carte). cal_render_month() y répartit les
  # 4 à 6 semaines du mois et centre le tout. 528 sur le Tab5 : la carte modale moins
  # 162 px (102 au-dessus, 60 pour la légende et son air), suit la carte (ADR-0061).
  cal_grid_h: ${ modal_card_h | int - 162 }
  # Carte "Réponse" de l'assistant vocal : sous la carte "Votre demande"
  # (modal_body_y + 104 px de haut + 12 px de respiration : 188). ESPHome 2026.9 calcule
  # l'expression (lot 2 du portage) : elle suit modal_body_y.
  assist_resp_y: ${ modal_body_y | int + 116 }
  # Boutons de vue de la page Bilan d'Énergie (vue_btn.yaml) : 150 px sur le Tab5 ; sur une
  # carte du graphique (corps_w − 434) où le titre n'aurait plus 184 px devant eux, plus étroits
  # (96 sur la 7B, où « Aujourd'hui » était caché sous eux). kBilVueL de tab5_energie.cpp.
  bil_vue_l: ${ [150, (corps_w | int - 434 - 222) // 3] | min }
  # ─── Accueil (lot 3 du portage 1024×600, ADR-0061) ────────────────────────────────────
  # La mise en page de l'accueil est celle du Tab5, ramenée à l'écran de la carte : un x ou
  # une largeur v du Tab5 devient (v × carte_ecran_l + 640) // 1280, un y ou une hauteur
  # (v × carte_ecran_h + 360) // 720 (arrondi au plus proche, en entiers comme le C++) ; ce
  # qui doit tomber juste (la colonne = trois boutons et deux gouttières, les bas alignés à
  # y 308…) est calculé des autres jetons. Sur le Tab5 chaque jeton redonne sa valeur au
  # pixel d'avant (tests/test_geometrie_partagee.py). Le C++ reprend ceux dont il a besoin
  # (kAcc…, tab5_geometrie.h). Valeurs du Tab5 entre parenthèses.
  # Grille horizontale : 20 px des bords, colonnes gauche (Domo / Discu, Ok Nabu) et droite
  # (HA / Sys / TV, températures, − / +) de trois boutons de 125 et deux gouttières de 15
  # (405), l'horloge entre elles (401, centrée : x 440 = 640 − 401 / 2, comme LVGL la pose).
  acc_marge: ${ (20 * (carte_ecran_l | int) + 640) // 1280 }
  acc_gout: ${ (15 * (carte_ecran_l | int) + 640) // 1280 }
  acc_bouton_l: ${ (125 * (carte_ecran_l | int) + 640) // 1280 }
  acc_col_l: ${ 3 * (acc_bouton_l | int) + 2 * (acc_gout | int) }
  acc_droite_x: ${ carte_ecran_l | int - (acc_marge | int) - (acc_col_l | int) }
  acc_discu_x: ${ (acc_marge | int) + (acc_col_l | int) - (acc_bouton_l | int) }
  acc_sys_x: ${ (acc_droite_x | int) + (acc_bouton_l | int) + (acc_gout | int) }
  acc_tv_x: ${ (acc_droite_x | int) + 2 * ((acc_bouton_l | int) + (acc_gout | int)) }
  acc_horloge_l: ${ carte_ecran_l | int - 2 * (acc_marge | int) - 2 * (acc_col_l | int) - 2 * (acc_gout | int) + 1 }
  acc_horloge_x: ${ (carte_ecran_l | int) // 2 - (acc_horloge_l | int) // 2 }
  acc_milieu: ${ (carte_ecran_l | int) // 2 }
  # Hauteurs du haut : boutons (y 20, 90 de haut), horloge (210), bandeau d'état (y 10).
  acc_haut_y: ${ (20 * (carte_ecran_h | int) + 360) // 720 }
  acc_bouton_h: ${ (90 * (carte_ecran_h | int) + 360) // 720 }
  acc_horloge_h: ${ (210 * (carte_ecran_h | int) + 360) // 720 }
  acc_bandeau_y: ${ (10 * (carte_ecran_h | int) + 360) // 720 }
  # Cadres « Ok Nabu » (btn_ok_nabu, tab5-lvgl.yaml) et − / + (climate_controls_zone,
  # climate_card.yaml), en miroir, bas à y 308 (09/10/2026, demande d'Axel : 90 px, le
  # texte « nageait » dedans). Leur intérieur est une ligne de zone (ligne_zone_h) : la
  # hauteur de la rangée sous l'horloge, où se dessinent les mêmes lignes de capteurs
  # (rangee_panneau.yaml) ; une ligne de texte de 45 px (encre 33 px en Roboto) y garde
  # 18 px d'air au-dessus et au-dessous. cadre_bas_h = ligne_zone_h + 2 × 1 px de bordure
  # (tests/test_nabu.py les compare). Largeur d'une ligne (rangée, panneaux Ok Nabu) :
  # celle de l'horloge, au plus l'intérieur du cadre Ok Nabu (401 ; kAccLigneL).
  ligne_zone_h: ${ (70 * (carte_ecran_h | int) + 360) // 720 }
  cadre_bas_h: ${ ligne_zone_h | int + 2 }
  acc_cadre_bas: ${ (308 * (carte_ecran_h | int) + 360) // 720 }
  acc_cadre_y: ${ (acc_cadre_bas | int) - (cadre_bas_h | int) }
  acc_ligne_l: ${ [acc_horloge_l | int, (acc_col_l | int) - 4] | min }
  acc_rangee_y: ${ (244 * (carte_ecran_h | int) + 360) // 720 }
  acc_pastilles_y: ${ (319 * (carte_ecran_h | int) + 360) // 720 }
  # Colonne de gauche : zone au choix (ADR-0051, x 20, y 42, 405 × 184 ; vocal : 440 × 230),
  # micro (x 162, y 78, 120 × 120), Domo / Discu (y 90).
  acc_zone_y: ${ (42 * (carte_ecran_h | int) + 360) // 720 }
  acc_zone_h: ${ (184 * (carte_ecran_h | int) + 360) // 720 }
  acc_vocal_h: ${ (230 * (carte_ecran_h | int) + 360) // 720 }
  acc_micro_x: ${ (162 * (carte_ecran_l | int) + 640) // 1280 }
  acc_micro_y: ${ (78 * (carte_ecran_h | int) + 360) // 720 }
  acc_micro_l: ${ (120 * (carte_ecran_h | int) + 360) // 720 }
  acc_domo_y: ${ (90 * (carte_ecran_h | int) + 360) // 720 }
  # Colonne de droite : zone des températures et de la tuile − / + (climate_card.yaml : y 110,
  # 198 de haut, bas sur le cadre Ok Nabu).
  acc_clim_y: ${ (110 * (carte_ecran_h | int) + 360) // 720 }
  acc_clim_h: ${ (acc_cadre_bas | int) - (acc_clim_y | int) }
  # Dans la zone des températures (climate_card.yaml) : rangées à 14 px des côtés et 36 px
  # au-dessus du milieu, 8 px entre icône et valeur ; zones tactiles à y 31, 64 de haut (serre :
  # 200 de large à 6 px du bord droit ; salon : 192 à x 4) ; dans la tuile − / + : − et + à
  # 13 px des côtés, 10 px d'air en haut et en bas (52), rayon 12 ; valeur touchable sur 200 px.
  acc_temp_x: ${ (14 * (carte_ecran_l | int) + 640) // 1280 }
  acc_temp_ecart: ${ (8 * (carte_ecran_l | int) + 640) // 1280 }
  acc_temp_y: ${ -((36 * (carte_ecran_h | int) + 360) // 720) }
  acc_temp_zone_y: ${ (31 * (carte_ecran_h | int) + 360) // 720 }
  acc_temp_zone_h: ${ (64 * (carte_ecran_h | int) + 360) // 720 }
  acc_serre_x: ${ -((6 * (carte_ecran_l | int) + 640) // 1280) }
  acc_serre_l: ${ (200 * (carte_ecran_l | int) + 640) // 1280 }
  acc_salon_x: ${ (4 * (carte_ecran_l | int) + 640) // 1280 }
  acc_salon_l: ${ (192 * (carte_ecran_l | int) + 640) // 1280 }
  acc_pas_x: ${ (13 * (carte_ecran_l | int) + 640) // 1280 }
  acc_pas_l: ${ (cadre_bas_h | int) - 20 }
  acc_pas_rayon: ${ (12 * (carte_ecran_h | int) + 360) // 720 }
  acc_consigne_l: ${ (200 * (carte_ecran_l | int) + 640) // 1280 }
  # Liste de la tuile − / + (reglables_liste.yaml) : panneau à x 740, 520 de large, sous les
  # boutons du haut (acc_clim_y) ; lignes de 52.
  acc_reglables_x: ${ (740 * (carte_ecran_l | int) + 640) // 1280 }
  acc_reglables_l: ${ (520 * (carte_ecran_l | int) + 640) // 1280 }
  acc_reglable_h: ${ (52 * (carte_ecran_h | int) + 360) // 720 }
  # Mini-barre du lecteur (lecteur_mini.yaml, sur le cadre Ok Nabu) : vignette et bouton de
  # 56 (le cadre moins 16), textes à x 76 (8 + vignette + 12), y 10 et 38 ; largeur des
  # textes (252, kMiniTexteL de tab5_lecteur.cpp).
  acc_mini_vignette: ${ (cadre_bas_h | int) - 16 }
  acc_mini_texte_x: ${ 20 + (acc_mini_vignette | int) }
  acc_mini_titre_y: ${ (10 * (carte_ecran_h | int) + 360) // 720 }
  acc_mini_artiste_y: ${ (38 * (carte_ecran_h | int) + 360) // 720 }
  # Lecteur compact de la zone à gauche (lecteur_zone.yaml) : précédent et suivant (52),
  # lecture / pause (60) ; tab5_lecteur.cpp les place (kZoneBtnL, kZoneLectureL).
  acc_lect_btn: ${ (52 * (carte_ecran_h | int) + 360) // 720 }
  acc_lect_lecture: ${ (60 * (carte_ecran_h | int) + 360) // 720 }
  # Carte centrale (central_card : x 20, y 333, 1240 × 84 sur le Tab5) et largeur de ses
  # panneaux (1180 : 1198 px utiles = 1240 - 2 × 20 de marge - 2 × 1 de bordure, arrondi) :
  # boutons invisibles d'appui des panneaux (tab5-lvgl.yaml, central_bouton.yaml, 80 de haut)
  # et réponse vocale longue. Le C++ les reprend (kCentralCarteL, kPanneauCentralL,
  # kAccCentraleY, tab5_geometrie.h) : tests/test_geometrie_partagee.py vérifie que les deux
  # côtés restent égaux.
  central_carte_w: ${ carte_ecran_l | int - 2 * (acc_marge | int) }
  central_w: ${ central_carte_w | int - 60 }
  acc_centrale_y: ${ (333 * (carte_ecran_h | int) + 360) // 720 }
  acc_centrale_h: ${ (84 * (carte_ecran_h | int) + 360) // 720 }
  acc_centrale_bouton_h: ${ (acc_centrale_h | int) - 4 }
  # Dans la carte centrale : barres de pluie (50 de haut ; 25 de large pour les tranches de
  # 5 min, 55 pour celles de 10 min, 15 px entre l'icône, les barres et le texte), air sous les
  # textes de la pluie (15 ; 10 sous la valeur).
  acc_pluie_h: ${ (50 * (carte_ecran_h | int) + 360) // 720 }
  acc_pluie_5mn_l: ${ (25 * (carte_ecran_l | int) + 640) // 1280 }
  acc_pluie_10mn_l: ${ (55 * (carte_ecran_l | int) + 640) // 1280 }
  acc_pluie_ecart: ${ (15 * (carte_ecran_l | int) + 640) // 1280 }
  acc_pluie_pad: ${ (15 * (carte_ecran_h | int) + 360) // 720 }
  acc_pluie_pad_val: ${ (10 * (carte_ecran_h | int) + 360) // 720 }
  # Points de pagination (x 480, y 420, 310 × 30) et mention « prévisions périmées » (x 800,
  # y 416, 455 × 26).
  acc_pagination_x: ${ (480 * (carte_ecran_l | int) + 640) // 1280 }
  acc_pagination_y: ${ (420 * (carte_ecran_h | int) + 360) // 720 }
  acc_pagination_l: ${ (310 * (carte_ecran_l | int) + 640) // 1280 }
  acc_perimees_x: ${ (800 * (carte_ecran_l | int) + 640) // 1280 }
  acc_perimees_y: ${ (416 * (carte_ecran_h | int) + 360) // 720 }
  acc_perimees_l: ${ (455 * (carte_ecran_l | int) + 640) // 1280 }
  # Hauteur de la mention : celle de son texte (police par défaut, pas mise à l'échelle) ;
  # réduite, elle coupait le bas des lettres sur la 7B (rendu du lot 3).
  acc_perimees_h: "26"
  # Bande des cinq tuiles (prévisions, mode HA) : calques à y 430 jusqu'au bas de l'écran ;
  # cellules de 230 × 275 au pas de 250, centrées (x 25), à y 5 du calque (kAccTuile…).
  acc_tuiles_y: ${ (430 * (carte_ecran_h | int) + 360) // 720 }
  acc_tuiles_h: ${ carte_ecran_h | int - (acc_tuiles_y | int) }
  acc_tuile_l: ${ (230 * (carte_ecran_l | int) + 640) // 1280 }
  acc_tuile_pas: ${ (250 * (carte_ecran_l | int) + 640) // 1280 }
  acc_tuile_x0: ${ (carte_ecran_l | int - 4 * (acc_tuile_pas | int) - (acc_tuile_l | int)) // 2 }
  acc_tuile_x1: ${ (acc_tuile_x0 | int) + (acc_tuile_pas | int) }
  acc_tuile_x2: ${ (acc_tuile_x0 | int) + 2 * (acc_tuile_pas | int) }
  acc_tuile_x3: ${ (acc_tuile_x0 | int) + 3 * (acc_tuile_pas | int) }
  acc_tuile_x4: ${ (acc_tuile_x0 | int) + 4 * (acc_tuile_pas | int) }
  acc_tuile_h: ${ (275 * (carte_ecran_h | int) + 360) // 720 }
  acc_tuile_cell_y: ${ (5 * (carte_ecran_h | int) + 360) // 720 }
  # Dans une tuile : onglet du titre (y 7, 130 × 46), onglet des températures (140 × 51, en
  # bas), icônes des épaules (x 10, y 9), bouton de l'appareil (140 × 130 ; 130 sur la
  # dernière), maxi / mini (x −25 / 35, y −7 du bas). Carte horaire : y 35, 205 de haut,
  # bande du bas de 210 × 51 (goutte x 5, y −14 ; pluie x 34 ; température x −5).
  acc_t_onglet_y: ${ (7 * (carte_ecran_h | int) + 360) // 720 }
  acc_t_onglet_l: ${ (130 * (carte_ecran_l | int) + 640) // 1280 }
  acc_t_onglet_h: ${ (46 * (carte_ecran_h | int) + 360) // 720 }
  acc_t_temp_l: ${ (140 * (carte_ecran_l | int) + 640) // 1280 }
  acc_t_bas_h: ${ (51 * (carte_ecran_h | int) + 360) // 720 }
  acc_t_epaule_x: ${ (10 * (carte_ecran_l | int) + 640) // 1280 }
  acc_t_epaule_y: ${ (9 * (carte_ecran_h | int) + 360) // 720 }
  acc_t_bouton_l: ${ (140 * (carte_ecran_l | int) + 640) // 1280 }
  acc_t_bouton_l4: ${ (130 * (carte_ecran_l | int) + 640) // 1280 }
  acc_t_bouton_h: ${ (130 * (carte_ecran_h | int) + 360) // 720 }
  acc_t_max_x: ${ -((25 * (carte_ecran_l | int) + 640) // 1280) }
  acc_t_min_x: ${ (35 * (carte_ecran_l | int) + 640) // 1280 }
  acc_t_texte_y: ${ -((7 * (carte_ecran_h | int) + 360) // 720) }
  acc_t_volet_h: ${ (60 * (carte_ecran_h | int) + 360) // 720 }
  acc_h_carte_y: ${ (35 * (carte_ecran_h | int) + 360) // 720 }
  acc_h_carte_h: ${ (205 * (carte_ecran_h | int) + 360) // 720 }
  acc_h_bas_l: ${ (210 * (carte_ecran_l | int) + 640) // 1280 }
  acc_h_goutte_x: ${ (5 * (carte_ecran_l | int) + 640) // 1280 }
  acc_h_goutte_y: ${ -((14 * (carte_ecran_h | int) + 360) // 720) }
  acc_h_pluie_x: ${ (34 * (carte_ecran_l | int) + 640) // 1280 }
  acc_h_temp_x: ${ -((5 * (carte_ecran_l | int) + 640) // 1280) }
  # Carte d'un appareil du mode HA (switch_card.yaml) : pastille ronde de 130 à y 26, nom à
  # y 166 (214 × 40), état à y 210. La pastille reste ronde : sa taille suit la hauteur.
  acc_sw_pastille_y: ${ (26 * (carte_ecran_h | int) + 360) // 720 }
  acc_sw_pastille: ${ (130 * (carte_ecran_h | int) + 360) // 720 }
  acc_sw_rayon: ${ (acc_sw_pastille | int) // 2 }
  acc_sw_nom_y: ${ (166 * (carte_ecran_h | int) + 360) // 720 }
  acc_sw_nom_l: ${ (214 * (carte_ecran_l | int) + 640) // 1280 }
  acc_sw_nom_h: ${ (40 * (carte_ecran_h | int) + 360) // 720 }
  acc_sw_etat_y: ${ (210 * (carte_ecran_h | int) + 360) // 720 }
  # Horloge (clock_tile) : sa géométrie intérieure est celle de la police des chiffres, à la
  # taille de la carte (carte_police_echelle, en pour cent : police_pct ; drapeau
  # TAB5_POLICE_PCT du C++) : un x, un y ou une taille v de la mise en page du Tab5 devient
  # (v × police_pct + 50) // 100, décalé de hor_dx / hor_dy pour centrer le tout dans la
  # tuile (0 sur le Tab5). theme_polices() (tab5_theme.cpp) fait le même calcul.
  police_pct: ${ ((carte_police_echelle | float) * 100) | round | int }
  hor_dx: ${ ((acc_horloge_l | int) - 2 - (399 * (police_pct | int) + 50) // 100) // 2 }
  hor_dy: ${ ((acc_horloge_h | int) - (210 * (police_pct | int) + 50) // 100) // 2 }
  hor_cadre_y: ${ (17 * (police_pct | int) + 50) // 100 + (hor_dy | int) }
  hor_cadre_l: ${ (75 * (police_pct | int) + 50) // 100 }
  hor_cadre_h: ${ (104 * (police_pct | int) + 50) // 100 }
  hor_label_y: ${ -((23 * (police_pct | int) + 50) // 100) }
  hor_h10_x: ${ (27 * (police_pct | int) + 50) // 100 + (hor_dx | int) }
  hor_h1_x: ${ (102 * (police_pct | int) + 50) // 100 + (hor_dx | int) }
  hor_m10_x: ${ (222 * (police_pct | int) + 50) // 100 + (hor_dx | int) }
  hor_m1_x: ${ (297 * (police_pct | int) + 50) // 100 + (hor_dx | int) }
  hor_dp_x: ${ (181 * (police_pct | int) + 50) // 100 + (hor_dx | int) }
  hor_dp_y: ${ -((6 * (police_pct | int) + 50) // 100) + (hor_dy | int) }
  hor_date_y: ${ (135 * (police_pct | int) + 50) // 100 + (hor_dy | int) }
  # Zones tactiles de l'horloge (horloge_zone.yaml) : coupe verticale au milieu de l'écran,
  # coupe horizontale à 40 px (à l'échelle) au-dessus de la ligne de base de la date (y 158
  # sur le Tab5 : 20 + 1 + 177 − 40, voir tab5-lvgl.yaml).
  hor_coupe_y: ${ (acc_haut_y | int) + 1 + (hor_dy | int) + (177 * (police_pct | int) + 50) // 100 - (40 * (police_pct | int) + 50) // 100 }
  hor_heures_l: ${ (acc_milieu | int) - (acc_horloge_x | int) }
  hor_minutes_l: ${ (acc_horloge_x | int) + (acc_horloge_l | int) - (acc_milieu | int) }
  hor_chiffres_h: ${ (hor_coupe_y | int) - (acc_haut_y | int) }
  hor_date_h: ${ (acc_haut_y | int) + (acc_horloge_h | int) - (hor_coupe_y | int) }
  hor_froid_x: ${ (acc_horloge_x | int) + (acc_horloge_l | int) - 35 }
