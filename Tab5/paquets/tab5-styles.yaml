  # --- Jeu « Roi Noir » : pièces d'échecs -----------------------------------
  # ChessPieces.ttf est un SOUS-ENSEMBLE (12 glyphes, 16 Ko) taillé dans DejaVu
  # Sans, exactement comme IconeMeteo.ttf : on n'embarque que ce qu'on affiche.
  # U+2654–2659 = pièces « blanches » (contour creux), U+265A–265F = « noires »
  # (silhouette pleine). chess_game.cpp superpose les deux pour dessiner une
  # pièce blanche (corps ivoire + contour sombre) — d'où les 12 glyphes et pas 6.
  # size 80 : encre 72×60 px dans une case de 84 (calibré, aucun débordement).
  # bpp 4 obligatoire : en bpp 1 les contours fins (couronne, crinière) crénellent.
  - file: "Tab5/fonts/ChessPieces.ttf"
    id: chess_pieces_80
    size: 80
    bpp: 4
    # Échappements plutôt que glyphes littéraux : même convention que les polices
    # MDI ci-dessus, et aucune dépendance à l'encodage de l'éditeur.
    glyphs: "\u2654\u2655\u2656\u2657\u2658\u2659\u265A\u265B\u265C\u265D\u265E\u265F"

# =============================================================================
# LVGL — Glassmorphism "Slate"
# =============================================================================
lvgl:
  # [AI-CONTEXT] `id` explicite = seul moyen d'atteindre le LvglComponent depuis
  # une lambda (`id(tab5_lvgl)`), donc de changer la rotation À CHAUD. C'est ce
  # dont « Neon Apron » (pinball_game.cpp) a besoin pour passer le dashboard en
  # portrait 720×1280 le temps d'une partie, puis restaurer le paysage.
  # NE PAS retirer cet id, et NE PAS changer `rotation: 270` : c'est l'état de
  # repos du dashboard, celui que Pinball::close() rétablit.
  id: tab5_lvgl
  # [AI-WARNING] `rotation:` doit rester présent ici même si le jeu la surcharge
  # à chaud : ESPHome ne compile le support de rotation (rotation_type_ =
  # ROTATION_SOFTWARE, buffer de rotation + client PPA) QUE si la clé existe
  # dans la config. Sans elle, LvglComponent::set_rotation() se contente d'un
  # ESP_LOGW « rotation cannot be changed unless rotation was enabled during
  # setup » et le flipper resterait en paysage (vérifié dans
  # esphome/components/lvgl/lvgl_esphome.cpp, LvglComponent::set_rotation).
  rotation: 270
  color_depth: 16
  byte_order: little_endian
  buffer_size: 100%
  # Fond de toutes les pages (jeux compris, que leurs conteneurs recouvrent). Évalué à
  # la création des pages, dans main(), avant que le select « Thème » ne restaure le
  # thème : toutes naissent dans la palette sombre par défaut, et tab5_theme_repeindre
  # (tab5-themes.yaml) ne repeint que page_main — les jeux restent sombres (ADR-0029).
  bg_color: !lambda 'return lv_color_hex(UIColor.BG);'
  # Police par défaut (audit ressources du 26/09/2026, lot 6, D5) : aucun texte de
  # l'interface n'utilisait la montserrat_14 d'origine (tous les labels posent leur
  # police, mk_label() des jeux aussi) — elle n'est plus embarquée.
  default_font: roboto_22
  # Thème ESPHome : styles partagés posés sur CHAQUE widget du type à sa création,
  # avant ses `styles:` et ses propriétés locales, qui gardent donc la main.
  # - label : le blanc et la police courants de l'interface. Un label n'écrit plus
  #   `styles: style_text_*` / `text_font: roboto_22` que s'il s'en écarte
  #   (292 réglages locaux retirés des sources).
  # - button : pas d'ombre. Le thème LVGL par défaut en posait une (3 px, décalée de
  #   4 px) sous tout bouton qui ne l'annulait pas — voiles des popups, cartes de
  #   l'arcade, pastilles — recalculée à chaque repeint, sans cache (D1).
  theme:
    label:
      text_font: roboto_22
      text_color: !lambda 'return lv_color_hex(UIColor.TEXT_SOFT);'
    button:
      shadow_width: 0
  style_definitions:
    # NB : `scrollbar_mode` n'est PAS une propriété de style : ESPHome l'ignore
    # sans avertissement dans style_definitions (vérifié dans main.cpp le
    # 26/09/2026, 6 occurrences retirées). Le poser sur le widget.
    # --- Carte meteo / tuiles dashboard ---
    # ESSAI C 16/07 : même décoration que les boutons Domo (style_clim_btn) —
    # fond 58%, bordure 1px/35%, radius 18. Couvre horloge, clim, bandeau central,
    # tuiles météo horaires/jours + page HA. pad/scrollbar conservés (conteneurs).
    # (Version d'avant l'essai : dans l'historique git du 16/07/2026 — le dossier
    #  docs/essais_design/ a ete retire du depot.)
    # Opaque depuis le 01/10/2026 (était à 58 %) : verre plein, voir l'en-tête.
    - id: style_meteo_card
      bg_color: !lambda 'return lv_color_hex(UIColor.GLASS_HI);'
      bg_grad_color: !lambda 'return lv_color_hex(UIColor.GLASS_LO);'
      bg_grad_dir: VER
      bg_opa: 100%
      border_width: 1
      border_color: !lambda 'return lv_color_hex(UIColor.GLASS_RIM);'
      border_opa: 35%
      radius: 18
      shadow_width: 0
      outline_width: 0
      pad_all: 0

    # --- Conteneurs transparents (fonctionnel : inchanges) ---
    # --- Verre du tableau de bord, pré-mélangé sur la page (essai D7) ---
    # Rendu identique à style_meteo_card / style_clim_btn posés sur BG,
    # mais opaque : un repeint du tableau de bord (fermeture d'un popup, swipe)
    # ne mélange plus ≈ 580 000 px. À n'utiliser QUE sur la page elle-même, jamais
    # dans un popup ni sur le voile (le fond n'y est pas BG).
    # Appui : l'effet pressé (tab5_anim.cpp) passe l'opacité à 52 % au lieu de
    # 30 % sur un fond opaque, pour la même teinte (30 % × 255 / 147).
    - id: style_meteo_card_page
      bg_color: !lambda 'return lv_color_hex(UIColor.GLASS_HI_PAGE);'
      bg_grad_color: !lambda 'return lv_color_hex(UIColor.GLASS_LO_PAGE);'
      bg_grad_dir: VER
      bg_opa: 100%
      border_width: 1
      border_color: !lambda 'return lv_color_hex(UIColor.GLASS_RIM);'
      border_opa: 35%
      radius: 18
      shadow_width: 0
      outline_width: 0
      pad_all: 0

    # --- Cartes de la page qu'un thème peut dessiner à part (thèmes, lot 3) ---
    # Copies exactes de style_meteo_card_page : un thème qui ne dit rien les voit
    # identiques aux cartes météo (tools/gen_themes.py leur reporte les `formes:` de
    # style_meteo_card_page), un thème peut aussi les dessiner à part (`formes:`
    # de Tab5/themes/<thème>.yaml) : horloge, bandeau central, carte de la clim et les
    # deux onglets des prévisions des jours. L'horloge et le bandeau lisent la palette
    # de leur zone (UIHorloge, UIBandeau : égale à UIColor, sauf en mode clair d'un
    # thème qui garde la zone sombre, `zones_sombres:`).
    - id: style_horloge_page
      bg_color: !lambda 'return lv_color_hex(UIHorloge.GLASS_HI_PAGE);'
      bg_grad_color: !lambda 'return lv_color_hex(UIHorloge.GLASS_LO_PAGE);'
      bg_grad_dir: VER
      bg_opa: 100%
      border_width: 1
      border_color: !lambda 'return lv_color_hex(UIHorloge.GLASS_RIM);'
      border_opa: 35%
      radius: 18
      shadow_width: 0
      outline_width: 0
      pad_all: 0
    - id: style_bandeau_page
      bg_color: !lambda 'return lv_color_hex(UIBandeau.GLASS_HI_PAGE);'
      bg_grad_color: !lambda 'return lv_color_hex(UIBandeau.GLASS_LO_PAGE);'
      bg_grad_dir: VER
      bg_opa: 100%
      border_width: 1
      border_color: !lambda 'return lv_color_hex(UIBandeau.GLASS_RIM);'
      border_opa: 35%
      radius: 18
      shadow_width: 0
      outline_width: 0
      pad_all: 0
    - id: style_clim_carte_page
      bg_color: !lambda 'return lv_color_hex(UIColor.GLASS_HI_PAGE);'
      bg_grad_color: !lambda 'return lv_color_hex(UIColor.GLASS_LO_PAGE);'
      bg_grad_dir: VER
      bg_opa: 100%
      border_width: 1
      border_color: !lambda 'return lv_color_hex(UIColor.GLASS_RIM);'
      border_opa: 35%
      radius: 18
      shadow_width: 0
      outline_width: 0
      pad_all: 0
    # Onglets des jours (nom du jour, températures) : sans bordure, comme le
    # `border_width: 0` que leurs gabarits posaient avant ce style.
    - id: style_onglet_jour_page
      bg_color: !lambda 'return lv_color_hex(UIColor.GLASS_HI_PAGE);'
      bg_grad_color: !lambda 'return lv_color_hex(UIColor.GLASS_LO_PAGE);'
      bg_grad_dir: VER
      bg_opa: 100%
      border_width: 0
      border_color: !lambda 'return lv_color_hex(UIColor.GLASS_RIM);'
      border_opa: 35%
      radius: 18
      shadow_width: 0
      outline_width: 0
      pad_all: 0
    - id: style_onglet_temp_page
      bg_color: !lambda 'return lv_color_hex(UIColor.GLASS_HI_PAGE);'
      bg_grad_color: !lambda 'return lv_color_hex(UIColor.GLASS_LO_PAGE);'
      bg_grad_dir: VER
      bg_opa: 100%
      border_width: 0
      border_color: !lambda 'return lv_color_hex(UIColor.GLASS_RIM);'
      border_opa: 35%
      radius: 18
      shadow_width: 0
      outline_width: 0
      pad_all: 0

    - id: style_clim_btn_page
      bg_color: !lambda 'return lv_color_hex(UIColor.GLASS_HI_PAGE);'
      bg_grad_color: !lambda 'return lv_color_hex(UIColor.GLASS_LO_PAGE);'
      bg_grad_dir: VER
      bg_opa: 100%
      border_width: 1
      border_color: !lambda 'return lv_color_hex(UIColor.GLASS_RIM);'
      border_opa: 35%
      radius: 18
      shadow_width: 0
      outline_width: 0

    - id: style_transparent
      bg_opa: 0
      border_width: 0
      pad_all: 0
    - id: style_invisible
      bg_opa: 0
      border_width: 0
      shadow_width: 0
      outline_width: 0
      pad_all: 0

    # --- Bouton climatisation : pastille de verre ---
    # Opaque depuis le 01/10/2026 (était à 58 %). L'appui (tab5_anim.cpp) voit un
    # fond opaque et passe à 52 % au lieu de 30 %.
    - id: style_clim_btn
      bg_color: !lambda 'return lv_color_hex(UIColor.GLASS_HI);'
      bg_grad_color: !lambda 'return lv_color_hex(UIColor.GLASS_LO);'
      bg_grad_dir: VER
      bg_opa: 100%
      border_width: 1
      border_color: !lambda 'return lv_color_hex(UIColor.GLASS_RIM);'
      border_opa: 35%
      radius: 18
      shadow_width: 0
      outline_width: 0

    # (style_modal_overlay supprimé le 25/07/2026 : le voile unique est
    #  ui_components/modal_scrim.yaml, opacité passée en var — ADR-0009.)

    # --- Carte modale "verre" flottante ---
    # Essai D7 (26/09/2026) : posée sur un voile désormais OPAQUE, elle est
    # pré-mélangée (même rendu, opaque) — LVGL ne mélange plus 860 000 px à chaque
    # ouverture. Un popup empilé sur un autre (voile à 60 %) prend
    # style_modal_card_verre : verre plein, opaque depuis le 01/10/2026 (88 % avant).
    - id: style_modal_card
      bg_color: !lambda 'return lv_color_hex(UIColor.GLASS_HI_MODAL);'
      bg_grad_color: !lambda 'return lv_color_hex(UIColor.GLASS_LO_MODAL);'
      bg_grad_dir: VER
      bg_main_stop: 20
      bg_grad_stop: 245
      bg_opa: 100%
      border_width: 2
      border_color: !lambda 'return lv_color_hex(UIColor.GLASS_RIM);'
      border_opa: 60%
      radius: 24
      shadow_width: 0
      pad_all: 0

    - id: style_modal_card_verre
      bg_color: !lambda 'return lv_color_hex(UIColor.GLASS_HI);'
      bg_grad_color: !lambda 'return lv_color_hex(UIColor.GLASS_LO);'
      bg_grad_dir: VER
      bg_main_stop: 20
      bg_grad_stop: 245
      bg_opa: 100%
      border_width: 2
      border_color: !lambda 'return lv_color_hex(UIColor.GLASS_RIM);'
      border_opa: 60%
      radius: 24
      shadow_width: 0
      pad_all: 0

    # --- NOUVEAU : carte de verre generique (reutilisable) ---
    # Opaque depuis le 01/10/2026 (était à 80 %).
    - id: style_glass_card
      bg_color: !lambda 'return lv_color_hex(UIColor.GLASS_HI);'
      bg_grad_color: !lambda 'return lv_color_hex(UIColor.GLASS_LO);'
      bg_grad_dir: VER
      bg_main_stop: 25
      bg_grad_stop: 240
      bg_opa: 100%
      border_width: 2
      border_color: !lambda 'return lv_color_hex(UIColor.GLASS_RIM);'
      border_opa: 55%
      radius: 20
      shadow_width: 0
      pad_all: 0

    # --- NOUVEAU : pastille / chip d'accent (cyan) ---
    # Cyan plein depuis le 01/10/2026 (était à 18 %) : « Tester », « Parler », « OK ».
    - id: style_pill_accent
      bg_color: !lambda 'return lv_color_hex(UIColor.ACCENT);'
      bg_opa: 100%
      border_width: 1
      border_color: !lambda 'return lv_color_hex(UIColor.ACCENT);'
      border_opa: 70%
      radius: 999
      pad_all: 0

    # --- Styles de rôle (lot 1 des thèmes, 04/10/2026, ADR-0029) ---------------
    # Une couleur de la palette sur une propriété, et rien d'autre. Un widget de
    # l'interface les prend par `styles:` au lieu de poser `text_color:` sur lui :
    # LVGL ne garde qu'UN style partagé par rôle, qu'un thème peut repeindre d'un
    # coup (tab5_theme_repeindre, Tab5/paquets/tab5-themes.yaml). Nommage : style_<propriété>_<rôle>, avec
    # dim = TEXT_DIM et soft = TEXT_SOFT ; le reste = le champ de `Palette`.
    # Dans une liste `styles:`, un style de rôle vient en DERNIER : il l'emporte sur
    # les styles posés avant lui, comme la couleur locale qu'il remplace.
    - id: style_text_dim
      text_color: !lambda 'return lv_color_hex(UIColor.TEXT_DIM);'
    - id: style_text_soft
      text_color: !lambda 'return lv_color_hex(UIColor.TEXT_SOFT);'
    - id: style_text_accent
      text_color: !lambda 'return lv_color_hex(UIColor.ACCENT);'
    - id: style_text_accent_alt
      text_color: !lambda 'return lv_color_hex(UIColor.ACCENT_ALT);'
    # Texte et icône posés sur l'accent plein (style_pill_accent) : sur un thème clair,
    # l'encre du texte courant ne se lirait pas sur l'accent foncé.
    - id: style_text_on_accent
      text_color: !lambda 'return lv_color_hex(UIColor.TEXT_ON_ACCENT);'
    - id: style_text_console_label
      text_color: !lambda 'return lv_color_hex(UIColor.CONSOLE_LABEL);'
    - id: style_text_console_value
      text_color: !lambda 'return lv_color_hex(UIColor.CONSOLE_VALUE);'
    - id: style_text_error
      text_color: !lambda 'return lv_color_hex(UIColor.ERROR);'
    - id: style_text_gold
      text_color: !lambda 'return lv_color_hex(UIColor.GOLD);'
    - id: style_text_inactive
      text_color: !lambda 'return lv_color_hex(UIColor.INACTIVE);'
    - id: style_text_info
      text_color: !lambda 'return lv_color_hex(UIColor.INFO);'
    - id: style_text_rain_value
      text_color: !lambda 'return lv_color_hex(UIColor.RAIN_VALUE);'
    - id: style_text_success
      text_color: !lambda 'return lv_color_hex(UIColor.SUCCESS);'
    - id: style_text_temp_max
      text_color: !lambda 'return lv_color_hex(UIColor.TEMP_MAX);'
    - id: style_text_temp_min
      text_color: !lambda 'return lv_color_hex(UIColor.TEMP_MIN);'
    - id: style_text_warning
      text_color: !lambda 'return lv_color_hex(UIColor.WARNING);'
    - id: style_bg_accent
      bg_color: !lambda 'return lv_color_hex(UIColor.ACCENT);'
    - id: style_bg_accent_alt
      bg_color: !lambda 'return lv_color_hex(UIColor.ACCENT_ALT);'
    - id: style_bg_arc_track
      bg_color: !lambda 'return lv_color_hex(UIColor.ARC_TRACK);'
    - id: style_bg_bar_inactive
      bg_color: !lambda 'return lv_color_hex(UIColor.BAR_INACTIVE);'
    - id: style_bg_console_bg
      bg_color: !lambda 'return lv_color_hex(UIColor.CONSOLE_BG);'
    - id: style_bg_dim
      bg_color: !lambda 'return lv_color_hex(UIColor.TEXT_DIM);'
    - id: style_bg_gold
      bg_color: !lambda 'return lv_color_hex(UIColor.GOLD);'
    - id: style_bg_modal_scrim
      bg_color: !lambda 'return lv_color_hex(UIColor.MODAL_SCRIM);'
    - id: style_bg_soft
      bg_color: !lambda 'return lv_color_hex(UIColor.TEXT_SOFT);'
    - id: style_bg_success
      bg_color: !lambda 'return lv_color_hex(UIColor.SUCCESS);'
    - id: style_bg_warm_pink
      bg_color: !lambda 'return lv_color_hex(UIColor.WARM_PINK);'
    - id: style_border_accent
      border_color: !lambda 'return lv_color_hex(UIColor.ACCENT);'
    - id: style_border_error
      border_color: !lambda 'return lv_color_hex(UIColor.ERROR);'
    - id: style_border_glass_rim
      border_color: !lambda 'return lv_color_hex(UIColor.GLASS_RIM);'
    - id: style_border_soft
      border_color: !lambda 'return lv_color_hex(UIColor.TEXT_SOFT);'
    - id: style_arc_arc_track
      arc_color: !lambda 'return lv_color_hex(UIColor.ARC_TRACK);'
    - id: style_arc_info
      arc_color: !lambda 'return lv_color_hex(UIColor.INFO);'
    - id: style_arc_warning
      arc_color: !lambda 'return lv_color_hex(UIColor.WARNING);'

    # --- Zones qu'un thème clair peut garder sombres (thèmes, lot 3) -------------
    # Le bandeau central et l'horloge : leurs textes lisent UIBandeau / UIHorloge
    # (Tab5/socle/tab5_tokens.h), égales à UIColor sauf en mode clair d'un thème à
    # `zones_sombres:`. Même rôle que style_text_* / style_bg_*, dans la zone.
    - id: style_bandeau_text_soft
      text_color: !lambda 'return lv_color_hex(UIBandeau.TEXT_SOFT);'
    - id: style_bandeau_text_dim
      text_color: !lambda 'return lv_color_hex(UIBandeau.TEXT_DIM);'
    - id: style_bandeau_text_rain_value
      text_color: !lambda 'return lv_color_hex(UIBandeau.RAIN_VALUE);'
    - id: style_bandeau_text_temp_min
      text_color: !lambda 'return lv_color_hex(UIBandeau.TEMP_MIN);'
    - id: style_bandeau_bg_bar_inactive
      bg_color: !lambda 'return lv_color_hex(UIBandeau.BAR_INACTIVE);'
    - id: style_horloge_text_soft
      text_color: !lambda 'return lv_color_hex(UIHorloge.TEXT_SOFT);'

    # --- Polices d'affichage (thèmes, lot 3) -----------------------------------
    # L'heure (rouleaux, « : » et écran de sonnerie), la date sous l'horloge, les
    # titres (en-tête des popups) : un thème peut changer leur police (`polices:`,
    # theme_polices() dans tab5_theme.cpp). Ici, celles de l'état compilé ; la
    # géométrie de l'horloge (y des rouleaux, place du « : ») reste posée sur ses
    # labels (tab5-lvgl.yaml, clock_roller.yaml). style_police_date sert aussi, depuis
    # le 05/10/2026 (demande d'Axel), aux textes de 45 px de l'accueil (températures et
    # consigne de la clim, « Ok Nabu », carte centrale et titres des prévisions) et à
    # quelques valeurs des popups : une seule police de 45 px à l'écran par thème.
    - id: style_police_horloge
      text_font: roboto_130_b
    - id: style_police_date
      text_font: roboto_45_b
    - id: style_police_titre
      text_font: roboto_32_b
