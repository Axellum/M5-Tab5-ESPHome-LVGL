# [AI-CONTEXT]
# @file tab5-styles.yaml
# @role Styles LVGL partagés (verre, styles de rôle, thème des widgets), polices, et
#       couleurs des jeux.
# @ai_instruction Aucune couleur de l'interface dans ce fichier : elles vivent dans la
#       palette C++ (`Palette`, Tab5/socle/tab5_tokens.h ; thèmes : ADR-0029). Un style lit la
#       palette active par une lambda (`!lambda 'return lv_color_hex(UIColor.X);'`), et un
#       widget de l'interface prend sa couleur par un style de rôle
#       (`styles: style_text_dim`), jamais par une couleur posée sur lui
#       (tools/check_tab5_code_rules.py, règle 8).
# =============================================================================
# THÈME — "Dark Mode Slate" (Glassmorphism), valeurs : PALETTE_SOMBRE
# -----------------------------------------------------------------------------
# Base ardoise (Tailwind Slate) + accents HSL vibrants (cyan / violet / emeraude).
# L'effet "verre depoli" est simule sur ESP32-P4 (pas de backdrop-blur materiel) :
#   - surfaces OPAQUES depuis le 01/10/2026 (verre plein, choix d'Axel après l'essai :
#     « c'était plus joli », et 14 à 32 ms de moins à l'ouverture des popups) ;
#     le tableau de bord garde son verre pré-mélangé (essai D7, même rendu qu'à 58 %)
#   - degrade vertical (haut clair -> bas sombre) = reflet de verre
#   - liseré fin lumineux (border_opa) = arête de verre
#   - ombre portee douce = profondeur / flottement
# =============================================================================
# Couleurs des JEUX et du sélecteur arcade seulement : ils restent sombres, avec leurs
# palettes locales (ADR-0014, ADR-0029). Les couleurs de l'interface ont quitté cette
# section le 04/10/2026 (lot 1 des thèmes) : un `color:` ESPHome est figé à la
# compilation (ESPHome écrit lv_color_make(r, g, b) dans main.cpp), un thème ne pourrait
# pas le changer.
color:
  # --- Jeu « Fil d'Or » (marble_game) : miroir des tokens Marble::Pal::* ---
  # Seuls les 3 fonds des conteneurs vivent ici ; toutes les autres couleurs du
  # jeu sont posees en C++ (marble_game.cpp) et n'ont donc pas de token YAML.
  - id: color_marble_void
    hex: "080C14"          # fond hors terrain (miroir Marble::Pal::VOID)
  - id: color_marble_floor
    hex: "111A28"          # sol jouable (miroir Marble::Pal::FLOOR)
  - id: color_marble_hud
    hex: "0C1220"          # bandeau HUD (miroir Marble::Pal::HUD_BG)
  # --- Jeu « Arcanoïde » (arkanoid_game) : miroir des tokens Arkanoid::Pal::* ---
  # Seuls les 3 fonds des conteneurs vivent ici ; toutes les autres couleurs du
  # jeu sont posées en C++ (arkanoid_game.cpp) et n'ont donc pas de token YAML.
  - id: color_arkanoid_void
    hex: "0A0A0F"          # fond hors terrain (miroir Arkanoid::Pal::VOID)
  - id: color_arkanoid_floor
    hex: "111118"          # sol jouable (miroir Arkanoid::Pal::FLOOR)
  - id: color_arkanoid_hud
    hex: "0D0D14"          # bandeau HUD (miroir Arkanoid::Pal::HUD_BG)
  # --- Jeu « Trial Poursuite » (trivia_game) ---------------------------------
  # trivia_game.yaml référençait ces 3 tokens sans qu'ils existent : la
  # compilation ESPHome échouait sur « Couldn't find ID 'color_trivia_void' ».
  # Contrairement aux 3 jeux ci-dessus, trivia_game.cpp ne pose PAS les fonds de
  # ses conteneurs en C++ — ils doivent donc bien vivre ici.
  # Teintes accordées à la carte Trivia du sélecteur arcade (accent
  # color_arcade_trivia_accent, plus bas).
  - id: color_trivia_void
    hex: "100A16"          # fond hors plateau
  - id: color_trivia_floor
    hex: "1A1028"          # plateau de jeu
  - id: color_trivia_hud
    hex: "150E22"          # bandeau HUD
  # --- Jeu « Neon Apron » (pinball_game) : miroir des tokens Pinball::Pal::* ---
  # Comme Marble et Arcanoïde : seuls les fonds des 4 conteneurs vivent ici, tout
  # le reste de la palette est posé en C++ (pinball_game.cpp).
  - id: color_pinball_void
    hex: "05070E"          # fond hors table (miroir Pinball::Pal::VOID)
  - id: color_pinball_felt
    hex: "121C2E"          # haut du sol (miroir Pinball::Pal::FELT_HI)
  - id: color_pinball_hud
    hex: "080C16"          # fronton / DMD (miroir Pinball::Pal::HUD_BG)
  # --- Sélecteur arcade (ui_components/game_selector.yaml) --------------------
  # Chaque carte = un fond (`_card`) + un accent (`_accent`, bordure et icône).
  # Les fonds des cartes Fil d'Or, Arcanoïde et Trial Poursuite réutilisent le
  # sol du jeu (color_marble_floor / color_arkanoid_floor / color_trivia_floor)
  # et les titres le texte de la palette sombre (PALETTE_SOMBRE.TEXT_SOFT, posé
  # sur le label : le sélecteur reste sombre) ; tout le reste vit ici — plus aucun hex en dur dans
  # le sélecteur (audit du 06/09/2026, §4.1 point 11).
  - id: color_arcade_bg
    hex: "080810"          # fond de la page arcade
  - id: color_arcade_title
    hex: "FFDD22"          # icône + titre « ARCADE »
  - id: color_arcade_subtitle
    hex: "8595AD"          # sous-titre et descriptions des cartes (même gris que le rôle CONSOLE_LABEL de la palette sombre)
  - id: color_arcade_footer
    hex: "4A5568"          # pied de page
  - id: color_arcade_close_bg
    hex: "222233"          # croix de fermeture : fond
  - id: color_arcade_close_border
    hex: "445566"          # croix de fermeture : bordure
  - id: color_arcade_close_icon
    hex: "AABBCC"          # croix de fermeture : glyphe
  - id: color_arcade_marble_accent
    hex: "E8B44A"
  - id: color_arcade_arkanoid_accent
    hex: "44DDDD"
  - id: color_arcade_pinball_card
    hex: "0D1420"
  - id: color_arcade_pinball_accent
    hex: "35E6FF"
  - id: color_arcade_lode_card
    hex: "0A0A12"
  - id: color_arcade_lode_accent
    hex: "FFC61A"
  - id: color_arcade_go_card
    hex: "1A150E"
  - id: color_arcade_go_accent
    hex: "C4A574"
  - id: color_arcade_trivia_accent
    hex: "FF9800"
  - id: color_arcade_draughts_card
    hex: "241810"
  - id: color_arcade_draughts_accent
    hex: "D4B896"
  - id: color_arcade_chess_card
    hex: "121A16"
  - id: color_arcade_chess_accent
    hex: "8FBF6A"

# =============================================================================
# FONTS — polices embarquées en flash
# =============================================================================
# Un glyphe absent de la police s'affiche VIDE, sans erreur de compilation.
# tools/check_tab5_code_rules.py (pytest) le vérifie : règle 6 pour la date,
# règle 7 pour les icônes MDI (chaque icône affichée est dans la police de son
# widget, et chaque glyphe déclaré est affiché quelque part — pas de poids mort).
font:
  # Roboto 700 : fichier figé du dépôt (Tab5/fonts/, licence dans Tab5/fonts/OFL.txt),
  # celui que Google Fonts servait à ESPHome par gfonts://Roboto@700 jusqu'au 08/10/2026
  # (audit du 07/10, DO-15 : une nouvelle version chez Google changeait le firmware sans
  # un mot). Empreinte vérifiée par tests/test_polices_themes.py.
  # Texte libre (poussé par HA, réponses de l'assistant) : tout Latin-1 plus les
  # ajouts de Windows-1252 (€ … ’ « » œ Œ — –), İ ō ř des questions de Trial
  # Poursuite (İnönü, Jōmon Sugi, Dvořák ; 27/09/2026) et Ğ ğ ı Ş ş du turc (avec İ et
  # le Latin-1 : ç ö ü â î û ; 02/10/2026), 224 glyphes. Déclarée une fois
  # ici (ancre &latin1), reprise par *latin1 dans roboto_45_b et roboto_22.
  - file: "Tab5/fonts/roboto_700.ttf"
    id: roboto_32_b
    size: 32
    bpp: 2   # 4 niveaux de lissage au lieu de 16 (essai D8, 26/09/2026) :
             # bitmaps divisés par deux, validé à l'œil par Axel
    glyphs: &latin1 ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ¡¢£¤¥¦§¨©ª«¬®¯°±²³´µ¶·¸¹º»¼½¾¿ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖ×ØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõö÷øùúûüýþÿİōřĞğıŞş'
  # Chiffres de l'horloge et de l'écran de sonnerie : rien d'autre.
  - file: "Tab5/fonts/roboto_700.ttf"
    id: roboto_130_b
    size: 130
    bpp: 2   # 4 niveaux de lissage au lieu de 16 (essai D8, 26/09/2026) :
             # bitmaps divisés par deux, validé à l'œil par Axel
    glyphs: '0123456789:'
  # Heure du réveil, consigne et température du popup clim, score du flipper. Le
  # tiret sert au « -- » de la consigne quand elle est inconnue (au boot, jusqu'au
  # 1er push de HA, ou consigne absente) : sans lui, le label restait vide. La
  # consigne de l'accueil est dans la police de la date depuis le 05/10/2026.
  - file: "Tab5/fonts/roboto_700.ttf"
    id: roboto_55_b
    size: 55
    bpp: 4
    glyphs: '-0123456789: °C.%'
  - file: "Tab5/fonts/roboto_700.ttf"
    id: roboto_45_b
    size: 45
    bpp: 2   # 4 niveaux de lissage au lieu de 16 (essai D8, 26/09/2026) :
             # bitmaps divisés par deux, validé à l'œil par Axel
    glyphs: *latin1
  # La date sous l'horloge (lbl_date) est en roboto_45_b depuis l'essai D8 du
  # 26/09/2026 : la police fine roboto_45, qui ne servait qu'à elle, est retirée
  # (−12,4 Ko). La règle 6 de tools/check_tab5_code_rules.py vérifie toujours que
  # la police de lbl_date couvre ses jours, mois et chiffres.

  - file: "Tab5/fonts/roboto_700.ttf"
    id: roboto_22
    size: 22
    bpp: 4
    glyphs: *latin1

  # Plus de police MONOSPACE depuis l'essai D8 du 26/09/2026 (−83 Ko) : à la
  # demande d'Axel, l'assistant vocal réutilise roboto_32_b (A-) et la police de la
  # date du thème (A+, roboto_45_b en Roboto), le Go et le flipper roboto_22. Les tableaux Markdown des réponses ne sont
  # plus alignés qu'approximativement (format_assist_markdown, tab5_assist.cpp).

