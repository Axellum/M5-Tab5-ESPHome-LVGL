# ============================================================================
# [AI-CONTEXT]
# @file tab5-cameras.yaml
# @role Popup « Caméras » (ADR-0049, 09/10/2026, discussion #278) : pose les widgets que
#       tab5_cameras.cpp peint (g_cameras_ui), l'image téléchargée et la demande à Home
#       Assistant.
#         - tab5_cameras_ouvrir : « Aller à l'écran → Caméras » (HA, une sonnette par
#           exemple) ou un geste de l'accueil (code « cameras », ADR-0039), tous par
#           tab5_ecran_ouvrir et la ligne du registre (tab5-navigation.yaml). Pose les
#           widgets à la première ouverture, puis cameras_ouvrir().
#         - tab5_cameras_demande : événement esphome.tab5_cameras. Le blueprint « Tab5 —
#           emplacements » y répond par l'action tab5_maj_cameras (tab5-api-logic.yaml).
#         - tab5_cameras_charger / tab5_cameras_attente : une image à la fois, la suivante
#           5 s après la fin de la précédente, tant que le popup est ouvert.
#         - cameras_image (online_image, JPEG) : l'image de la caméra montrée.
# @architecture_constraint Push-only, events-only (ADR-0001, ADR-0025) : la tablette ne
#       nomme aucune entité. Chargé APRÈS tab5_lvgl (il référence des widgets) et après
#       tab5_assist (client http_request assist_http). Aucun lv_* ici.
# @ai_warning [AI-WARNING] online_image télécharge dans la boucle principale : la requête
#       attend la réponse de HA (jusqu'au timeout de 12 s d'assist_http), puis le JPEG est
#       décodé en un seul appel. Ne pas raccourcir l'attente de tab5_cameras_attente sans
#       mesurer ce blocage sur la tablette (ADR-0049, « Coûts »).
# @ai_instruction Un widget de plus = son champ dans CamerasUI (tab5_cameras.h) et sa ligne
#       ici. Les commandes sont des lambdas SANS capture (pointeurs de fonction).
# ============================================================================

image:
  # Une seule image pour toutes les caméras, décodée à SA taille en RGB565 en PSRAM
  # (RAMAllocator d'ESPHome : PSRAM d'abord ; 640 × 480 = 614 400 octets, 960 × 540 =
  # 1 036 800), rendue par online_image.release quand le popup se ferme. HA réduit déjà
  # l'image (width / height ajoutés par camera_url) ; une image plus grande que le cadre
  # est réduite à l'affichage par LVGL (cameras_image_prete).
  # [AI-WARNING] Pas de resize: ici. ESPHome met alors l'image à la taille donnée en
  # l'AGRANDISSANT aussi (640 × 480 → 720 × 540), pixel par pixel dans le décodage :
  # 1,45 s de boucle bloquée par image mesurées le 10/10/2026 avec une caméra 640 × 480.
  # JPEG progressif refusé par le décodeur d'ESPHome (JPEGDEC) : « Image indisponible ».
  - platform: online_image
    id: cameras_image
    url: "http://127.0.0.1/placeholder.jpg"   # remplacé au runtime par set_url
    format: JPEG
    type: RGB565
    http_request_id: assist_http
    # Tampon du téléchargement : agrandi à la taille du JPEG (il le faut entier pour le
    # décoder), il le reste ensuite (~40 Ko pour une caméra 640 × 480, mesuré le 10/10).
    buffer_size: 16384
    on_download_finished:
      - lambda: 'cameras_image_prete();'
    on_error:
      - lambda: 'cameras_image_erreur();'

script:
  - id: tab5_cameras_ouvrir
    then:
      - lambda: |-
          CamerasUI& u = g_cameras_ui;
          if (u.popup == nullptr) {
            u.image = id(cameras_img);
            u.message = id(cameras_message);
            u.nom = id(cameras_nom);
            u.heure = id(cameras_heure);
            u.pastilles = id(cameras_pastilles);
            u.pastille[0] = id(cameras_pastille_0);
            u.pastille[1] = id(cameras_pastille_1);
            u.pastille[2] = id(cameras_pastille_2);
            u.pastille[3] = id(cameras_pastille_3);
            u.pastille[4] = id(cameras_pastille_4);
            u.pastille[5] = id(cameras_pastille_5);
            u.pastille[6] = id(cameras_pastille_6);
            u.pastille[7] = id(cameras_pastille_7);
            u.source = id(cameras_image);
            u.charger = [](const char* url) { id(tab5_cameras_charger).execute(std::string(url)); };
            u.liberer = [] { id(tab5_cameras_liberer).execute(); };
            u.demander = [] { id(tab5_cameras_demande).execute(); };
            u.attendre = [](int ms) { id(tab5_cameras_attente).execute(ms); };
            // En dernier : cameras_ouvrir() ne fait rien tant que popup est nul.
            u.popup = id(cameras_popup);
          }
          cameras_ouvrir();

  - id: tab5_cameras_demande
    mode: queued
    max_runs: 3
    then:
      - homeassistant.event:
          event: esphome.tab5_cameras

  # set_url télécharge tout de suite (update: true par défaut).
  - id: tab5_cameras_charger
    parameters:
      url: string
    then:
      - online_image.set_url:
          id: cameras_image
          url: !lambda 'return url;'

  - id: tab5_cameras_liberer
    then:
      - online_image.release: cameras_image

  # Un seul rappel en attente (restart) : cameras_tic() décide s'il charge, attend la fin
  # d'un téléchargement ou libère tout (popup fermé).
  - id: tab5_cameras_attente
    mode: restart
    parameters:
      ms: int
    then:
      - delay: !lambda 'return (uint32_t) ms;'
      - lambda: 'cameras_tic();'
