            u.flux_valeur[0] = id(energie_flux_valeur_0);
            u.flux_valeur[1] = id(energie_flux_valeur_1);
            u.flux_valeur[2] = id(energie_flux_valeur_2);
            u.flux_valeur[3] = id(energie_flux_valeur_3);
            u.flux_texte[0] = id(energie_flux_texte_0);
            u.flux_texte[1] = id(energie_flux_texte_1);
            u.flux_texte[2] = id(energie_flux_texte_2);
            u.flux_texte[3] = id(energie_flux_texte_3);
            u.flux_detail[0] = id(energie_flux_detail_0);
            u.flux_detail[1] = id(energie_flux_detail_1);
            u.flux_detail[2] = id(energie_flux_detail_2);
            u.flux_detail[3] = id(energie_flux_detail_3);
            u.soleil_zone = id(energie_soleil_zone);
            u.soleil_infos = id(energie_soleil_infos);
            u.bilan_titre = id(energie_bilan_titre);
            u.bilan_vue_btn[0] = id(energie_bilan_vue_0);
            u.bilan_vue_btn[1] = id(energie_bilan_vue_1);
            u.bilan_vue_btn[2] = id(energie_bilan_vue_2);
            u.bilan_zone = id(energie_bilan_zone);
            u.police = id(roboto_22);
            u.police_grasse = id(roboto_32_b);
            u.demander = [](const char* vue) { id(tab5_energie_demande).execute(std::string(vue)); };
            // En dernier : energie_ouvrir() ne fait rien tant que popup est nul.
            u.popup = id(energie_popup);
          }
          energie_ouvrir();

  - id: tab5_energie_demande
    mode: queued
    max_runs: 3
    parameters:
      vue: string
    then:
      - homeassistant.event:
          event: esphome.tab5_energie
          data:
            vue: !lambda 'return vue;'
