# [AI-CONTEXT]
# @file tab5-hardware.yaml
# @role Configuration bas niveau (I2C, I2S, DSI Display, Audio, DAC).
# @ai_instruction FICHIER CRITIQUE. Ne modifier AUCUNE broche GPIO ou fréquence I2C sans l'accord d'Axel.
# ============================================================================
# [2026.7.0] st7123 est un composant officiel ESPHome : plus d'external_components ni de
# dossier Tab5/my_components/ (retire du depot le 06/07/2026, PR #15).

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      # Performance (audit du 25/09/2026, §3.3), mesurée le 25/09 avec les capteurs
      # « Tab5 Draw Max » / « Tab5 Loop Time » : code et données constantes (glyphes
      # compris) copiés au boot en PSRAM hex 200 MHz et exécutés de là, au lieu de la
      # flash DIO 40 MHz ; -O2 au lieu de -Os. Images −14 à −15 %, boucle au repos
      # −19 % ; coût : −15,5 Ko de RAM interne libre, firmware +468 Ko. Validé par
      # 5 redémarrages de contrôle (séquence de l'écran noir, voir on_boot).
      execute_from_psram: true
      compiler_optimization: PERF
      # Pile de la boucle ESPHome (setup() + toute la boucle : LVGL, API, lambdas) :
      # 16 Ko au lieu des 8 Ko par défaut. Mesuré le 25/09/2026 (capteur « Tab5 Stack
      # Free Min ») : 8 Ko n'en laissaient que 1,5-1,8 libres, minimum atteint pendant
      # l'initialisation (premier rendu LVGL + snprintf, 1 152 o à lui seul). Coût :
      # 8 Ko de RAM interne. Garder une marge d'au moins 4 Ko en cas de nouvelle mesure.
      loop_task_stack_size: 16384
    sdkconfig_options:
      # Fenêtre gardée à 16 Ko : 64 Ko (défaut ESPHome) ne raccourcit pas l'OTA,
      # borné par l'écriture flash (14,7 → 14,5 s, essai du 25/09/2026).
      CONFIG_LWIP_TCP_WND_DEFAULT: "16384"        # AXE7: Fenetre TCP 16Ko pour OTA stable
      CONFIG_SPI_FLASH_YIELD_DURING_ERASE: "y"   # AXE7: Evite gel CPU pendant effacement flash OTA
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_360: "y"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ: "360"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"         # AXE7: WDT 15s (boot long possible si reseau lent)

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1
  sdio_frequency: 20MHz
  use_psram: true             # [2026.6.0] Buffers SDIO en PSRAM: evite crash mempool + libere SRAM interne

logger:
  # ═══════════════════════════════════════════════════════════════════════
  # [06/07/2026] CAUSE RACINE CONFIRMEE — ecran noir apres reboot logiciel.
  # ═══════════════════════════════════════════════════════════════════════
  # Bug historique (recurrent, plusieurs sessions) : apres un redemarrage
  # LOGICIEL (OTA, bouton HA, esp_restart), l'ecran restait NOIR alors que
  # TOUT le reste fonctionnait parfaitement (WiFi/API/donnees/uptime sains).
  # Contourne le 05/07/2026 par `level: VERY_VERBOSE` permanent (hasard :
  # les logs verbeux ajoutaient assez de temps pour masquer le vrai probleme).
  #
  # Cause reelle confirmee le 06/07/2026 (Axel present, ecran surveille en
  # direct a chaque reboot, 5 essais OTA) : le reset_pin de l'ecran
  # (display: mipi_dsi:) passe par le GPIO expander I2C PI4IOE5V6408 (pas un
  # GPIO natif) qui a besoin d'un peu de temps pour se stabiliser apres le
  # boot avant que son reset ait un effet fiable. Preuve par elimination :
  #   - INFO + action YAML `delay: 300ms`/`1000ms` entre l'init du GPIO
  #     expander (setup_priority::IO=900) et l'init ecran (DATA=600) ->
  #     ECRAN NOIR dans les 2 cas. Ces essais etaient en fait invalides :
  #     l'action `delay:` d'ESPHome n'est PAS bloquante (programme un
  #     callback via le scheduler et rend la main aussitot), donc l'ecran
  #     demarrait en realite SANS AUCUN delai reel injecte avant lui.
  #   - INFO + `lambda: delay(1000);` (delay() C bloquant, meme fonction que
  #     st7123_touchscreen.cpp utilise pour son propre reset), donc un vrai
  #     delai qui bloque Application::setup() avant l'init ecran -> ECRAN
  #     ALLUME, reproduit 3 fois de suite (voir esphome:on_boot:priority:700
  #     dans tab5-ha-hmi.yaml).
  # Donc : ce n'est pas la verbosite des logs qui compte, c'est le temps reel
  # ecoule avant de toucher le reset_pin. level: INFO peut etre garde (plus
  # rapide, moins de bruit serie) tant que le delai bloquant de 1s reste en
  # place dans tab5-ha-hmi.yaml. Meme si l'oscilloscope sur le bus I2C n'a
  # pas ete fait (pas verifiable a distance), la preuve experimentale directe
  # (delai reel present/absent = ecran OK/noir, teste et reteste) est solide.
  #
  # NE PAS retirer le delai bloquant de tab5-ha-hmi.yaml (esphome:on_boot:
  # priority:700) sans re-tester a fond — c'est lui le vrai garde-fou
  # desormais, pas le niveau de log.
  # [05/08/2026] `DEBUG` fonctionne de nouveau (vérifié : build complet, 0 erreur,
  # 0 warning de format, +0,3 pt de flash pour les corps de ESP_LOGD). Il était
  # cassé : un `!lambda` dans les `args:` d'un `logger.log` ne compilait pas, et
  # ça ne pouvait pas se voir à INFO puisque le corps du ESP_LOGD est alors
  # compilé hors binaire. Piège général à garder en tête : **tout `logger.log`
  # est du code jamais compilé tant qu'on reste à INFO.**
  level: INFO
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG
  tx_buffer_size: 2048

psram:
  mode: hex
  speed: 200MHz

ota:
  platform: esphome
  # [2026.9.0] OTA chiffrée avec la clé API (`api: encryption: key`, tab5-api-logic.yaml) :
  # le bloc `encryption:` vide hérite de cette clé, une seule clé protège l'appareil
  # (ESPHome #18489 + #18979). Depuis ce firmware, l'upload en CLAIR est REFUSÉ : le PC
  # qui flashe doit avoir `api_encryption_key` dans secrets.yaml — le CLI la lit dans le
  # YAML et chiffre tout seul, rien à passer en ligne de commande. L'ancien `password:`
  # est retiré : redondant (la clé authentifie déjà l'uploader), coûteux (~3,5 Ko de
  # flash + 60 o de RAM, warning ESPHome 2026.9.0) et de toute façon incompatible avec
  # `encryption:` (erreur de validation). Migration faite en deux OTA le 16/09/2026 :
  # 2026.9.0 sans ce bloc d'abord (le firmware « offre » alors le chiffrement tout en
  # acceptant le clair), puis ce bloc. Revenir en arrière = retirer `encryption:`,
  # remettre `password:` et flasher (l'OTA de retour part chiffrée, donc acceptée).
  encryption:
  # Pas de `on_end` ici. ESPHome redémarre lui-même juste après une OTA réussie
  # (components/esphome/ota/ota_esphome.cpp : notify_state_(OTA_COMPLETED) ->
  # delay(100) -> App.safe_reboot()). L'ancien `on_end: delay 2s + button.press
  # btn_restart` (« fix reboot OTA » du 05/07/2026) ne pouvait donc jamais
  # s'exécuter : l'appareil redémarrait 100 ms après le déclencheur, bien avant la
  # fin du délai. Retiré le 08/09/2026 (audit du 06/09, §4.1 point 13).
  # L'écran noir après OTA (co-processeur C6 non réinitialisé par un reboot
  # logiciel, cf. docs/troubleshooting.md) ne se règle par AUCUN redémarrage
  # logiciel, seulement par un cycle d'alimentation : ne pas remettre de on_end.

safe_mode:
  num_attempts: 10
  boot_is_good_after: 30s

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
  - id: pi4ioe2
    address: 0x44

esp_ldo:
  - voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    dimensions:
      height: 1280
      width: 720
    model: M5STACK-TAB5-ST7123   # [2026.7.0] Renomme depuis M5STACK-TAB5-V2 (deprecated)
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    pixel_mode: 16bit
    color_order: RGB
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: st7123
    interrupt_pin: GPIO23
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    update_interval: 100ms   # [2026.7.0] Requis: le composant officiel init dans update() (pas set_timeout). Le poller s'arrete seul une fois l'interruption attachee.
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
    id: touch
    on_release:
      then:
        - if:
            condition:
              light.is_off: backlight
            then:
              - light.turn_on: backlight

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms
    on_turn_on:
      - lvgl.resume:
    on_turn_off:
      - lvgl.pause:


i2s_audio:
  - id: mic_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30

audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000
    # [AUDIO-2026] 24 -> 30 dB : les 6 dB qui etaient pris en NUMERIQUE (gain_factor: 2 sur le
    # wake word et le vocal) sont deplaces ICI, en ANALOGIQUE, avant le convertisseur.
    # Meme niveau sonore en sortie, mais un vrai gain de rapport signal/bruit : le gain numerique
    # d'ESPHome est une multiplication entiere suivie d'un clamp dur (microphone_source.cpp), donc
    # il amplifie le bruit de fond du convertisseur autant que la voix ET ecrete net les cretes --
    # une crete ecretee devient un signal carre, poison pour Whisper. Le seuil d'ecretage ne bouge
    # pas (on a juste deplace les memes 6 dB en amont). Valeurs admises : 0, 3, ... 33, 34.5, 36, 37.5.
    mic_gain: 30dB

microphone:
  - platform: i2s_audio
    id: tab5_microphone
    i2s_din_pin: GPIO28
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external
    correct_dc_offset: true   # [AUDIO-2026] Corrige un eventuel decalage DC du signal ES7210

audio_dac:
  - platform: es8388
    id: es8388_dac

speaker:
  - platform: i2s_audio
    id: tab5_speaker
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    dac_type: external
    channel: stereo
    # [AUDIO-2026] 500ms = le defaut ESPHome (le commentaire precedent "100->200ms" datait d'une
    # version ou le defaut valait 100ms : on tournait donc SOUS le defaut). Quand ce ring buffer se
    # vide, la tache speaker ne coupe pas le flux : elle remplit le buffer DMA de silence
    # (i2s_audio_speaker_standard.cpp, "pad the rest of this DMA buffer with silence") -> micro-trous
    # audibles = gresillements. Le TTS arrive en HTTP streame depuis HA PENDANT sa generation
    # (voice_assistant.cpp, tts_start_streaming), via le WiFi porte par le co-processeur C6 en SDIO :
    # les hoquets sont la regle, pas l'exception. Ce buffer est le seul amortisseur en aval du decodeur.
    buffer_duration: 500ms
    timeout: 2000ms
    bits_per_sample: 16bit
    sample_rate: 48000

select:
  - platform: es8388
    dac_output:
      id: es8388_dac_output
      internal: true
  - platform: template
    name: "Tab5 DAC Output"
    id: tab5_dac_output_template
    options:
      - "LINE1"
      - "LINE2"
      - "BOTH"
    restore_value: true
    optimistic: true
    on_value:
      then:
        - select.set:
            id: es8388_dac_output
            option: !lambda "return x;"

media_player:
  - platform: speaker
    name: tab5_media_player
    id: speaker_player
    announcement_pipeline:
      speaker: tab5_speaker
      # [AUDIO-2026] Ce bloc n'est PAS un reglage de sortie : c'est le format PREFERE annonce a HA
      # (media_player/__init__.py, validate_preferred_format), donc ce que HA transcode et envoie.
      #   - 16000 Hz bridait la voix a 8 kHz de bande passante alors que le modele Piper reellement
      #     utilise par les 2 pipelines Assist du Tab5 (fr_FR-upmc-medium) sort du 22050 Hz : HA
      #     sous-echantillonnait, et toutes les sifflantes (s, ch, f) passaient a la trappe.
      #     24000 = le taux du plus haut des deux moteurs desormais en service : Piper local
      #     (fr_FR-upmc-medium, 22050 Hz) reste sur le pipeline "Domotique", et "Discussion LLM" est
      #     passe sur HA Cloud / AlainNeural (24000 Hz) le 05/08/2026. A 24000, le cloud est natif et
      #     Piper est simplement surechantillonne -- ce qui ne COUPE aucun contenu ; demander 22050
      #     ferait l'inverse et raboterait le cloud au-dessus de 11 kHz. Si les deux pipelines
      #     revenaient un jour sur Piper seul, redescendre a 22050 (zero reechantillonnage).
      #   - FLAC (defaut ESPHome, et ce qu'utilise le firmware officiel Home Assistant Voice PE) :
      #     sans perte, ~2x moins de reseau que le WAV brut -> compense la montee en frequence.
      # Limites du speaker i2s en mode primary : 16000-48000 Hz, 1-2 canaux (i2s_audio/speaker/__init__.py).
      format: FLAC
      sample_rate: 24000
      num_channels: 1
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing: tab5_microphone
          then:
            - micro_wake_word.stop:
    on_idle:
      - if:
          condition:
            - and:
                - not:
                    voice_assistant.is_running:
                - switch.is_on: tab5_wake_word_active
                # [I2S-BUS] Pendant une sonnerie de réveil, c'est
                # `tab5_alarm_ring_loop` et lui seul qui décide quand le micro
                # écoute : il doit lui laisser le bus I2S le temps de chaque
                # passage de mélodie (micro et haut-parleur partagent `mic_bus`
                # et son mutex unique). Sans ce garde, le `media_player.stop` du
                # démarrage de sonnerie passe le lecteur en IDLE, ce hook
                # relance microWakeWord dans la foulée, le micro reprend le bus
                # et la mélodie est muette — constaté sur l'appareil le 05/08.
                - lambda: 'return !id(alarm_ringing);'
          then:
            - micro_wake_word.start:

# Pile vocale (micro_wake_word, voice_assistant) et image de la réponse de
# l'assistant (http_request, online_image) : Tab5/tab5-assist.yaml (lot 8c).

button:
  - platform: restart
    id: btn_restart
    name: "Redémarrage Système"

debug:
