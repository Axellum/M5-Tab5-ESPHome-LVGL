# [AI-CONTEXT]
# @file tab5-hardware.yaml
# @role Configuration bas niveau (I2C, I2S, DSI Display, Audio, DAC).
# @ai_instruction FICHIER CRITIQUE. Ne modifier AUCUNE broche GPIO ou fréquence I2C sans l'accord d'Axel.
# ============================================================================
# [2026.7.0] st7123 est un composant officiel ESPHome : plus d'external_components ni de
# dossier Tab5/my_components/ (retire du depot le 06/07/2026, PR #15).

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_LWIP_TCP_WND_DEFAULT: "16384"        # AXE7: Fenetre TCP 16Ko pour OTA stable
      CONFIG_SPI_FLASH_YIELD_DURING_ERASE: "y"   # AXE7: Evite gel CPU pendant effacement flash OTA
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_360: "y"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ: "360"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"         # AXE7: WDT 15s (boot long possible si reseau lent)

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1
  sdio_frequency: 20MHz
  use_psram: true             # [2026.6.0] Buffers SDIO en PSRAM: evite crash mempool + libere SRAM interne

logger:
  # ═══════════════════════════════════════════════════════════════════════
  # [06/07/2026] CAUSE RACINE CONFIRMEE — ecran noir apres reboot logiciel.
  # ═══════════════════════════════════════════════════════════════════════
  # Bug historique (recurrent, plusieurs sessions) : apres un redemarrage
  # LOGICIEL (OTA, bouton HA, esp_restart), l'ecran restait NOIR alors que
  # TOUT le reste fonctionnait parfaitement (WiFi/API/donnees/uptime sains).
  # Contourne le 05/07/2026 par `level: VERY_VERBOSE` permanent (hasard :
  # les logs verbeux ajoutaient assez de temps pour masquer le vrai probleme).
  #
  # Cause reelle confirmee le 06/07/2026 (Axel present, ecran surveille en
  # direct a chaque reboot, 5 essais OTA) : le reset_pin de l'ecran
  # (display: mipi_dsi:) passe par le GPIO expander I2C PI4IOE5V6408 (pas un
  # GPIO natif) qui a besoin d'un peu de temps pour se stabiliser apres le
  # boot avant que son reset ait un effet fiable. Preuve par elimination :
  #   - INFO + action YAML `delay: 300ms`/`1000ms` entre l'init du GPIO
  #     expander (setup_priority::IO=900) et l'init ecran (DATA=600) ->
  #     ECRAN NOIR dans les 2 cas. Ces essais etaient en fait invalides :
  #     l'action `delay:` d'ESPHome n'est PAS bloquante (programme un
  #     callback via le scheduler et rend la main aussitot), donc l'ecran
  #     demarrait en realite SANS AUCUN delai reel injecte avant lui.
  #   - INFO + `lambda: delay(1000);` (delay() C bloquant, meme fonction que
  #     st7123_touchscreen.cpp utilise pour son propre reset), donc un vrai
  #     delai qui bloque Application::setup() avant l'init ecran -> ECRAN
  #     ALLUME, reproduit 3 fois de suite (voir esphome:on_boot:priority:700
  #     dans tab5-ha-hmi.yaml).
  # Donc : ce n'est pas la verbosite des logs qui compte, c'est le temps reel
  # ecoule avant de toucher le reset_pin. level: INFO peut etre garde (plus
  # rapide, moins de bruit serie) tant que le delai bloquant de 1s reste en
  # place dans tab5-ha-hmi.yaml. Meme si l'oscilloscope sur le bus I2C n'a
  # pas ete fait (pas verifiable a distance), la preuve experimentale directe
  # (delai reel present/absent = ecran OK/noir, teste et reteste) est solide.
  #
  # NE PAS retirer le delai bloquant de tab5-ha-hmi.yaml (esphome:on_boot:
  # priority:700) sans re-tester a fond — c'est lui le vrai garde-fou
  # desormais, pas le niveau de log.
  # [05/08/2026] `DEBUG` fonctionne de nouveau (vérifié : build complet, 0 erreur,
  # 0 warning de format, +0,3 pt de flash pour les corps de ESP_LOGD). Il était
  # cassé : un `!lambda` dans les `args:` d'un `logger.log` ne compilait pas, et
  # ça ne pouvait pas se voir à INFO puisque le corps du ESP_LOGD est alors
  # compilé hors binaire. Piège général à garder en tête : **tout `logger.log`
  # est du code jamais compilé tant qu'on reste à INFO.**
  level: INFO
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG
  tx_buffer_size: 2048

psram:
  mode: hex
  speed: 200MHz

ota:
  platform: esphome
  password: !secret ota_password
  on_end:
    then:
      - delay: 2s
      - button.press: btn_restart

safe_mode:
  num_attempts: 10
  boot_is_good_after: 30s

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
  - id: pi4ioe2
    address: 0x44

esp_ldo:
  - voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    dimensions:
      height: 1280
      width: 720
    model: M5STACK-TAB5-ST7123   # [2026.7.0] Renomme depuis M5STACK-TAB5-V2 (deprecated)
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    pixel_mode: 16bit
    color_order: RGB
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: st7123
    interrupt_pin: GPIO23
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    update_interval: 100ms   # [2026.7.0] Requis: le composant officiel init dans update() (pas set_timeout). Le poller s'arrete seul une fois l'interruption attachee.
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
    id: touch
    on_release:
      then:
        - if:
            condition:
              light.is_off: backlight
            then:
              - light.turn_on: backlight

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms
    on_turn_on:
      - lvgl.resume:
    on_turn_off:
      - lvgl.pause:


i2s_audio:
  - id: mic_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30

audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000
    # [AUDIO-2026] 24 -> 30 dB : les 6 dB qui etaient pris en NUMERIQUE (gain_factor: 2 sur le
    # wake word et le vocal) sont deplaces ICI, en ANALOGIQUE, avant le convertisseur.
    # Meme niveau sonore en sortie, mais un vrai gain de rapport signal/bruit : le gain numerique
    # d'ESPHome est une multiplication entiere suivie d'un clamp dur (microphone_source.cpp), donc
    # il amplifie le bruit de fond du convertisseur autant que la voix ET ecrete net les cretes --
    # une crete ecretee devient un signal carre, poison pour Whisper. Le seuil d'ecretage ne bouge
    # pas (on a juste deplace les memes 6 dB en amont). Valeurs admises : 0, 3, ... 33, 34.5, 36, 37.5.
    mic_gain: 30dB

microphone:
  - platform: i2s_audio
    id: tab5_microphone
    i2s_din_pin: GPIO28
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external
    correct_dc_offset: true   # [AUDIO-2026] Corrige un eventuel decalage DC du signal ES7210

audio_dac:
  - platform: es8388
    id: es8388_dac

speaker:
  - platform: i2s_audio
    id: tab5_speaker
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    dac_type: external
    channel: stereo
    # [AUDIO-2026] 500ms = le defaut ESPHome (le commentaire precedent "100->200ms" datait d'une
    # version ou le defaut valait 100ms : on tournait donc SOUS le defaut). Quand ce ring buffer se
    # vide, la tache speaker ne coupe pas le flux : elle remplit le buffer DMA de silence
    # (i2s_audio_speaker_standard.cpp, "pad the rest of this DMA buffer with silence") -> micro-trous
    # audibles = gresillements. Le TTS arrive en HTTP streame depuis HA PENDANT sa generation
    # (voice_assistant.cpp, tts_start_streaming), via le WiFi porte par le co-processeur C6 en SDIO :
    # les hoquets sont la regle, pas l'exception. Ce buffer est le seul amortisseur en aval du decodeur.
    buffer_duration: 500ms
    timeout: 2000ms
    bits_per_sample: 16bit
    sample_rate: 48000

select:
  - platform: es8388
    dac_output:
      id: es8388_dac_output
      internal: true
  - platform: template
    name: "Tab5 DAC Output"
    id: tab5_dac_output_template
    options:
      - "LINE1"
      - "LINE2"
      - "BOTH"
    restore_value: true
    optimistic: true
    on_value:
      then:
        - select.set:
            id: es8388_dac_output
            option: !lambda "return x;"

media_player:
  - platform: speaker
    name: tab5_media_player
    id: speaker_player
    announcement_pipeline:
      speaker: tab5_speaker
      # [AUDIO-2026] Ce bloc n'est PAS un reglage de sortie : c'est le format PREFERE annonce a HA
      # (media_player/__init__.py, validate_preferred_format), donc ce que HA transcode et envoie.
      #   - 16000 Hz bridait la voix a 8 kHz de bande passante alors que le modele Piper reellement
      #     utilise par les 2 pipelines Assist du Tab5 (fr_FR-upmc-medium) sort du 22050 Hz : HA
      #     sous-echantillonnait, et toutes les sifflantes (s, ch, f) passaient a la trappe.
      #     24000 = le taux du plus haut des deux moteurs desormais en service : Piper local
      #     (fr_FR-upmc-medium, 22050 Hz) reste sur le pipeline "Domotique", et "Discussion LLM" est
      #     passe sur HA Cloud / AlainNeural (24000 Hz) le 05/08/2026. A 24000, le cloud est natif et
      #     Piper est simplement surechantillonne -- ce qui ne COUPE aucun contenu ; demander 22050
      #     ferait l'inverse et raboterait le cloud au-dessus de 11 kHz. Si les deux pipelines
      #     revenaient un jour sur Piper seul, redescendre a 22050 (zero reechantillonnage).
      #   - FLAC (defaut ESPHome, et ce qu'utilise le firmware officiel Home Assistant Voice PE) :
      #     sans perte, ~2x moins de reseau que le WAV brut -> compense la montee en frequence.
      # Limites du speaker i2s en mode primary : 16000-48000 Hz, 1-2 canaux (i2s_audio/speaker/__init__.py).
      format: FLAC
      sample_rate: 24000
      num_channels: 1
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing: tab5_microphone
          then:
            - micro_wake_word.stop:
    on_idle:
      - if:
          condition:
            - and:
                - not:
                    voice_assistant.is_running:
                - switch.is_on: tab5_wake_word_active
                # [I2S-BUS] Pendant une sonnerie de réveil, c'est
                # `tab5_alarm_ring_loop` et lui seul qui décide quand le micro
                # écoute : il doit lui laisser le bus I2S le temps de chaque
                # passage de mélodie (micro et haut-parleur partagent `mic_bus`
                # et son mutex unique). Sans ce garde, le `media_player.stop` du
                # démarrage de sonnerie passe le lecteur en IDLE, ce hook
                # relance microWakeWord dans la foulée, le micro reprend le bus
                # et la mélodie est muette — constaté sur l'appareil le 05/08.
                - lambda: 'return !id(alarm_ringing);'
          then:
            - micro_wake_word.start:

micro_wake_word:
  id: mww
  stop_after_detection: false
  task_stack_in_psram: true   # [AUDIO-2026] ~3Ko SRAM interne economises (P4 a PSRAM hex 200MHz)
  microphone:
    microphone: tab5_microphone
    gain_factor: 1            # [AUDIO-2026] Les 6 dB sont passes en analogique (es7210 mic_gain: 30dB)
  vad:                        # [AUDIO-2026] Voice Activity Detection: reduit faux declenchements
  models:
    - okay_nabu
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  on_wake_word_detected:
    - logger.log:
        format: "DEBUG: WAKE WORD DETECTED (%s)"
        # Les entrées de `args:` sont des expressions C++ BRUTES, pas des
        # lambdas : un `!lambda` y est recopié tel quel dans le code généré
        # (`ESP_LOGD(..., !lambda return wake_word;)`) et ne compile pas. Le
        # corps d'un `logger.log` est un ESP_LOGD, donc compilé hors binaire
        # tant que `logger.level` reste à INFO — l'erreur ne se voyait qu'en
        # passant le projet en DEBUG. `wake_word` est un `std::string`
        # (Trigger<std::string>), d'où le `.c_str()` qu'attend `%s`.
        args: ['wake_word.c_str()']
    # La décision vit dans WakeWord::decide() (tab5_custom.cpp) : une table à
    # six sorties au lieu de cinq niveaux d'if/else ici. Les entrées sont lues
    # UNE fois ci-dessous, puis tab5_wake_word_dispatch (tab5-scripts.yaml)
    # exécute l'action. Priorités, dans l'ordre :
    #   1. réveil en train de sonner : TOUT mot l'arrête, « Stop » comme « Okay
    #      Nabu » — c'est la promesse « arrêt à la voix », elle passe avant les
    #      deux autres usages du mot « Stop » (volet en mouvement, interruption
    #      d'une réponse) qui n'ont aucun sens pendant que ça sonne ;
    #   2. « Stop » + volet en mouvement : arrêt local + HA ;
    #   3. réponse en cours (va_stop_armed + audio ou pipeline pas démarré) :
    #      on la coupe et on ré-écoute, que le mot soit « Stop » ou « Okay Nabu » ;
    #   4. « Okay Nabu » au repos : pipeline si le wake word est actif et HA
    #      joignable. Le modèle « Stop » est armé par tab5_alarm_ring_start /
    #      le volet / le pipeline, et désarmé par leurs fins.
    # [AI-WARNING] La mélodie est un SINUS pur (rtttl.cpp) et microWakeWord est
    # entraîné sur de la parole : un faux déclenchement par la sonnerie
    # elle-même est improbable mais n'a pas été mesuré. Si Axel constate que le
    # réveil se coupe tout seul, ajouter un global `alarm_listen_window` posé
    # à `true` par la pause de 2 500 ms de tab5_alarm_ring_loop et l'ajouter
    # aux entrées de decide() — le silence entre deux passages est justement
    # là pour ça.
    - lambda: |-
        WakeWord::Inputs in;
        in.alarm_ringing      = id(alarm_ringing);
        in.is_stop            = (wake_word == "Stop");
        in.volet_en_mouvement = id(volet_en_mouvement);
        in.va_stop_armed      = id(va_stop_armed);
        // Mêmes tests que les anciennes conditions YAML : speaker.is_playing,
        // media_player.is_announcing, not voice_assistant.is_running.
        in.audio_busy = id(tab5_speaker)->is_running()
            || id(speaker_player)->state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING
            || !(id(va)->is_running() || id(va)->is_continuous());
        in.wake_word_enabled  = id(tab5_wake_word_active)->state;
        in.api_connected      = global_api_server->is_connected();
        const WakeWord::Action a = WakeWord::decide(in);
        // INFO et pas DEBUG : un mot de réveil est rare et c'est la seule trace
        // de ce qui a été décidé (le projet tourne à INFO).
        ESP_LOGI("TAB5", "Mot de reveil '%s' -> %s", wake_word.c_str(), WakeWord::action_name(a));
        id(tab5_wake_word_dispatch).execute((int) a, wake_word);

voice_assistant:
  id: va
  microphone:
    microphone: tab5_microphone
    gain_factor: 1            # [AUDIO-2026] Les 6 dB sont passes en analogique (es7210 mic_gain: 30dB)
  media_player: speaker_player
  micro_wake_word: mww
  # [AUDIO-2026] 2 -> 0. Ce reglage est bien vivant : HA l'applique cote pipeline via
  # MicroVadSpeexEnhancer (assist_pipeline/pipeline.py). Mais un debruiteur DEFORME la parole et
  # Whisper est entraine sur de l'audio naturel -- le debruitage degrade souvent sa transcription.
  # Remettre a 1 ou 2 si la reconnaissance se degrade dans une piece bruyante.
  noise_suppression_level: 0
  auto_gain: 15dBFS           # [AUDIO-2026] Controle auto gain cote HA (0-31dBFS)
  # Les cinq callbacks partagent assist_set_pipeline_state() (tab5_custom.cpp) :
  # un état = une couleur d'icône micro + un libellé de statut dans le popup.
  on_listening:
    - logger.log: "DEBUG: VOICE_ASSISTANT on_listening"
    - lambda: 'assist_set_pipeline_state(id(icon_mic_status), id(lbl_assist_status), AssistState::LISTENING);'
    - script.execute: tab5_vocal_arm_stop
  on_stt_end:
    - logger.log: "DEBUG: VOICE_ASSISTANT on_stt_end"
    - lambda: 'assist_set_pipeline_state(id(icon_mic_status), id(lbl_assist_status), AssistState::THINKING);'
    - script.execute: tab5_vocal_arm_stop
    # Popup assistant : affiche la demande reconnue (STT) puis « Réflexion… »
    - lambda: 'assist_set_request(id(lbl_assist_request), x);'
    - script.execute: tab5_assist_on_request
  on_tts_start:
    - logger.log: "DEBUG: VOICE_ASSISTANT on_tts_start"
    - lambda: 'assist_set_pipeline_state(id(icon_mic_status), id(lbl_assist_status), AssistState::SPEAKING);'
    - script.execute: tab5_vocal_arm_stop
    # Réponse "par défaut" = texte parlé (TTS). Le moteur peut la remplacer par une
    # version riche (tableaux + image) via le service HA tab5_assist_reponse.
    - lambda: |-
        esphome::font::Font* f = id(assist_text_size) == 0 ? id(roboto_mono_20)
                               : (id(assist_text_size) == 2 ? id(roboto_mono_28) : id(roboto_mono_24));
        assist_set_response(id(lbl_assist_response), x, f);
  on_end:
    - logger.log: "DEBUG: VOICE_ASSISTANT on_end"
    - lambda: 'assist_set_pipeline_state(id(icon_mic_status), id(lbl_assist_status), AssistState::IDLE);'
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 3s    # AXE9: Augmente de 0.5s a 3s pour eviter coupure TTS / re-arm premature du wake word
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing: tab5_speaker
    - if:
        condition:
          - switch.is_on: tab5_wake_word_active
        then:
          - micro_wake_word.start:
    - script.execute: tab5_vocal_disarm_stop
  on_error:
    - logger.log:
        format: "DEBUG: VOICE_ASSISTANT on_error: %s"
        args: [ "code.c_str()" ]
    - lambda: 'assist_set_pipeline_state(id(icon_mic_status), id(lbl_assist_status), AssistState::ERROR);'
    - delay: 2s
    # Retour au gris de l'icône seule : le popup garde « Erreur » sous les yeux.
    - lambda: 'assist_set_mic_state(id(icon_mic_status), AssistState::IDLE);'
    - if:
        condition:
          - switch.is_on: tab5_wake_word_active
        then:
          - micro_wake_word.start:
    - script.execute: tab5_vocal_disarm_stop

# ─── Image de la réponse assistant (popup) ───────────────────────────────────
# Le moteur (via le service HA tab5_assist_reponse) fournit une URL d'image PNG ;
# le Tab5 la télécharge à la demande (online_image.set_url + update) et l'affiche
# dans le popup. Décodage en PSRAM (RGB565), redimensionné à la zone image.
http_request:
  id: assist_http
  timeout: 12s
  verify_ssl: false
  watchdog_timeout: 20s

# [2026.8.1] Migré depuis le bloc `online_image:` de premier niveau, déprécié et
# supprimé en ESPHome 2027.1.0. C'est un pur déplacement de clé : le shim déprécié
# (online_image/__init__.py) réutilise le MÊME schéma et le MÊME codegen que la
# plateforme (ONLINE_IMAGE_CONFIG_SCHEMA / setup_online_image), et les actions
# `online_image.set_url` / `online_image.release` gardent leurs noms — donc rien à
# changer dans tab5-api-logic.yaml, qui appelle set_url au runtime.
image:
  - platform: online_image
    id: assist_response_image
    url: "http://127.0.0.1/placeholder.png"   # remplacé au runtime par set_url
    format: PNG
    type: RGB565
    resize: 760x360
    on_download_finished:
      - lambda: 'assist_image_state_ui(id(assist_img_hint), id(assist_img_widget), AssistImage::READY);'
    on_error:
      - lambda: 'assist_image_state_ui(id(assist_img_hint), id(assist_img_widget), AssistImage::ERROR);'

button:
  - platform: restart
    id: btn_restart
    name: "Redémarrage Système"

debug:


