# ============================================================================
# [AI-CONTEXT]
# @file Tab5/rendu/bouchons.yaml
# @role Bouchons du rendu hors tablette (tab5-rendu-host.yaml, lot 7) : les id du
#       matériel que l'interface référence, sans matériel derrière. Les packages
#       tab5-hardware.yaml, ecran-*.yaml, tab5-sensors-diagnostics.yaml et
#       tab5-imu.yaml ne sont pas chargés ; ce fichier fournit ce que l'interface
#       y prend. L'assistant vocal (tab5-assist.yaml) est chargé, mais ses composants
#       matériels sont remplacés par Tab5/rendu/composants/.
# ============================================================================

# L'écran : un affichage en mémoire (plateforme host), même taille que la dalle du
# Tab5 et même `rotation: 270` côté LVGL (tab5-styles.yaml). snapshot.take écrit un BMP.
display:
  - platform: snapshot
    id: tab5_display
    dimensions:
      width: 720
      height: 1280
    update_interval: never

# Heure de la machine (fuseau de la compilation). sntp_time porte le tick minute de
# l'horloge, comme sur la tablette (tab5-sensors-diagnostics.yaml).
time:
  - platform: host
    id: sntp_time
    on_time_sync:
      then:
        - lambda: |-
            auto t_now = id(sntp_time).now();
            if (t_now.is_valid()) {
              update_clock_date_ui(id(lbl_date),
                  t_now.hour, t_now.minute, t_now.day_of_week, t_now.day_of_month, t_now.month);
            }
    on_time:
      - seconds: 0
        minutes: "*"
        then:
          - lambda: |-
              auto t_now = id(sntp_time).now();
              if (t_now.is_valid()) {
                update_clock_date_ui(id(lbl_date),
                    t_now.hour, t_now.minute, t_now.day_of_week, t_now.day_of_month, t_now.month);
              }
              rain_phrase_tick();
  - platform: host
    id: rtc_time

# Rétroéclairage : un variateur sans broche (la veille de l'écran le pilote).
output:
  - platform: template
    id: backlight_pwm
    type: float
    write_action: []

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    restore_mode: ALWAYS_ON

# Audio : muet, mais avec les id et les actions d'ESPHome (media_player.*, speaker.*,
# microphone.*, rtttl.*) que l'interface et le réveil appellent.
speaker:
  - platform: rendu_muet
    id: tab5_speaker

microphone:
  - platform: rendu_muet
    id: tab5_microphone

media_player:
  - platform: rendu_muet
    id: speaker_player
    name: "Tab5 Media Player"
    internal: true

switch:
  # Ampli (broche de l'expander sur la tablette) : un interrupteur sans matériel.
  - id: !extend speaker_enable
    platform: template
    pin: !remove
    optimistic: true

binary_sensor:
  # Prise casque (expander) : jamais branchée ici.
  - id: !extend headphone_detect
    platform: template
    pin: !remove
  # Liaison avec HA : celle de l'API du rendu (le mode démo s'y connecte). Même nom que
  # sur la tablette (tab5-sensors-diagnostics.yaml) : la poussée complète de
  # packages/tab5_push.yaml lit binary_sensor.<appareil>_ha_api_status à la connexion,
  # et sa condition échoue quand l'entité manque (job installation-ha, 28/09/2026).
  - platform: status
    name: "HA API Status"
    id: status_ha

# Capteurs lus par la console système : valeurs fixes, sans Wi-Fi ni sonde.
sensor:
  # Temps actif figé (1 h 02) : le vrai suivait l'horloge monotone et la capture de la
  # console changeait d'une minute selon le run (vu le 27/09/2026).
  - platform: template
    id: sys_uptime
    internal: true
    lambda: 'return 3720.0f;'
  - platform: template
    id: sys_wifi_rssi
    internal: true
    lambda: 'return -55.0f;'
  - platform: template
    id: sys_core_temp
    internal: true
    lambda: 'return 45.0f;'
  - platform: template
    id: sys_loop_time
    internal: true
    lambda: 'return 30.0f;'

text_sensor:
  - platform: template
    id: sys_wifi_ssid
    internal: true
    lambda: 'return {"Rendu"};'
  - platform: template
    id: sys_wifi_ip
    internal: true
    lambda: 'return {"127.0.0.1"};'

button:
  - platform: template
    id: btn_restart
    internal: true

# Capture de l'écran, appelée par tools/rendu/capturer.py après chaque scène. S'ajoute
# aux actions de tab5-api-logic.yaml (les listes `services:` des packages se suivent).
api:
  services:
    - service: rendu_capture
      description: "Rendu hors tablette (lot 7) : écrit l'écran courant dans un BMP."
      variables:
        fichier:
          type: string
          description: "Nom du fichier, sans extension (dossier : ESPHOME_SNAPSHOT_DIR)."
          example: "scene_1"
      then:
        - snapshot.take:
            id: tab5_display
            filename: !lambda 'return fichier;'
    # La carte centrale change de panneau toutes les 8 s (tab5_central_rotator_auto) :
    # une capture tombait parfois dans le fondu de 190 ms entre deux panneaux, ou sur
    # un autre panneau selon le nombre de tours déjà faits (vu le 27/09/2026, scène 2
    # en anglais). tools/rendu/capturer.py appelle donc cette action avant chaque
    # capture : le rotateur s'arrête et la carte avance, un pas à la fois comme un
    # appui, jusqu'au panneau demandé (ordre de central_wraps(), tab5_central.cpp).
    - service: rendu_panneau
      description: "Rendu hors tablette (lot 7) : arrête le rotateur de la carte centrale sur un panneau."
      variables:
        panneau:
          type: int
          description: "0 planning, 1 pluie, 2 vigilance, 3 info, 4-7 alertes HA (un panneau inactif est sauté)."
          example: "1"
      then:
        - script.stop: tab5_central_rotator_auto
        - repeat:
            count: 8
            then:
              - if:
                  condition:
                    lambda: 'return g_central_ctx.current_panel != panneau;'
                  then:
                    - lambda: 'advance_central_panel_rotator(g_central_ctx);'
                    - delay: 500ms
    # Doigt virtuel (Tab5/rendu/rendu_doigt.h) : tools/rendu/capturer.py ouvre chaque
    # fenêtre, jeu et sous-fenêtre en touchant l'écran comme on le ferait sur la dalle,
    # aux coordonnées des captures (paysage 1280×720). Mêmes gestionnaires que le doigt :
    # on_click, on_long_press, recherche du widget touché par LVGL.
    - service: rendu_toucher
      description: "Rendu hors tablette : appui en (x, y), levé après `duree` ms (1000 et plus : appui long)."
      variables:
        x: int
        y: int
        duree: int
      then:
        - lambda: 'rendu_doigt_poser(x, y);'
        - delay: !lambda 'return duree;'
        - lambda: 'rendu_doigt_lever();'
    # Batterie de la tablette (04/10/2026) : tab5-sensors-diagnostics.yaml n'est pas
    # chargé ici, l'action passe au C++ ce que lui passeraient l'INA226 et CHG_STAT, et
    # actionne le vrai interrupteur « Tab5 Batterie montée » (tab5-ha-controls.yaml).
    - service: rendu_batterie
      description: "Rendu hors tablette : icône de la batterie du bandeau (montée, niveau en %, en charge)."
      variables:
        montee: bool
        niveau: float
        en_charge: bool
      then:
        - lambda: |-
            batterie_niveau_ui(niveau);
            batterie_charge_ui(en_charge);
        - if:
            condition:
              lambda: 'return montee;'
            then:
              - switch.turn_on: tab5_batterie_montee
            else:
              - switch.turn_off: tab5_batterie_montee
    - service: rendu_glisser
      description: "Rendu hors tablette : geste de (x1, y1) à (x2, y2), en 10 pas de 30 ms."
      variables:
        x1: int
        y1: int
        x2: int
        y2: int
      then:
        - repeat:
            count: 11
            then:
              - lambda: |-
                  rendu_doigt_poser(x1 + (x2 - x1) * (int32_t) iteration / 10,
                                    y1 + (y2 - y1) * (int32_t) iteration / 10);
              - delay: 30ms
        - lambda: 'rendu_doigt_lever();'

script:
  # Journal des démarrages (tab5_journal.cpp) : rien à envoyer depuis le rendu.
  - id: tab5_journal_envoi
    then: []
