# Garde-fous locaux avant chaque commit (audit du 06/09/2026, §6 : « yamllint,
# détection de BOM et vérificateur de secrets suffiraient »).
#
# Installation, une fois :
#   pip install -r requirements-dev.txt
#   pre-commit install            # pose .git/hooks/pre-commit
# À la main sur tout le dépôt :
#   pre-commit run --all-files
#
# La CI (job `python`) rejoue `pre-commit run --all-files` : ce qui passe ici
# passe là-bas. Rien ici ne modifie un fichier — les hooks signalent, ils ne
# corrigent pas.
#
# Seul le hook clang-format regarde ce qui est indexé, pas les fichiers entiers :
# en CI (`--all-files`, rien d'indexé) il ne contrôle donc rien, c'est voulu — le
# C++ existant n'est pas reformaté (voir .clang-format).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # NE PAS passer en v6 par `pre-commit autoupdate` sans remplacer d'abord
    # check-byte-order-marker par un hook local qui signale sans réécrire :
    # en v6.0.0 l'id existe encore mais son entrée est `pre-commit-hooks-removed`
    # (vérifié le 25/09/2026) — le hook échoue à chaque commit et en CI.
    rev: v5.0.0
    hooks:
      # Détection seulement (« deprecated » au profit de fix-byte-order-marker, qui
      # réécrit le fichier : on préfère signaler). Un BOM UTF-8 casse ESPHome et !include.
      - id: check-byte-order-marker
      - id: check-merge-conflict
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint                     # règles dans .yamllint (base « relaxed »)
        args: ["--strict"]               # les avertissements aussi font échouer
        # `identify` classe `*.yaml.example` en `text` : sans cet élargissement,
        # l'exemple d'automations HA (le fichier public le plus copié) échappait
        # au lint. Les motifs d'exclusion de .yamllint s'appliquent toujours.
        types: [file]
        files: \.ya?ml(\.example)?$
  - repo: local
    hooks:
      - id: verifier-secrets
        name: aucun secret en clair dans un fichier suivi (tools/verifier_secrets_config.py)
        entry: python tools/verifier_secrets_config.py
        language: system
        pass_filenames: false
        always_run: true
      - id: render-ha-config-check
        name: ni identifiant HA réel ni placeholder dans un fichier public (tools/render_ha_config.py --check)
        entry: python tools/render_ha_config.py --check
        language: system
        pass_filenames: false
        always_run: true
      # Style C++ (.clang-format) contrôlé sur les SEULES lignes indexées : `git-clang-format
      # --diff --staged` compare l'index à HEAD et ne passe à clang-format que les plages
      # modifiées (clang-format les étend à l'instruction entière). Écart = diff affiché et
      # échec ; aucune réécriture. Vérifié le 08/10/2026 avec clang-format 23.1.3 : ligne
      # modifiée mal formatée → échec (code 1) ; ligne voisine mal formatée mais intacte →
      # rien ; rien d'indexé → succès. Pour passer outre sur un commit :
      #   SKIP=clang-format-lignes-modifiees git commit …
      # Exclus : les fichiers générés (tools/gen_i18n.py, gen_themes.py, gen_tuiles_icones.py),
      # tab5_tokens.h (sa palette sombre est générée dans un format que clang-format réécrit)
      # et la table de questions de Trial Poursuite (écrite serrée exprès).
      - id: clang-format-lignes-modifiees
        name: style C++ des lignes modifiées (.clang-format, git-clang-format --diff --staged)
        entry: git-clang-format --diff --staged --
        language: python
        additional_dependencies: ["clang-format==23.1.3"]
        files: \.(cpp|h)$
        exclude: (^|/)(tab5_i18n_data\.h|tab5_themes_data\.h|tab5_tuiles_icones\.h|tab5_tokens\.h|trivia_questions\.h)$
        require_serial: true
