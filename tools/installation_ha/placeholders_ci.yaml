# ============================================================================
# [AI-CONTEXT]
# @file tools/installation_ha/placeholders_ci.yaml
# @role Valeurs FACTICES des placeholders des packages HA pour le job « installation
#       dans un HA neuf » (.github/workflows/installation-ha.yml). Même format que
#       HomeAssistant_Config/placeholders.example.yaml, lu par
#       tools/render_ha_config.py (--map). Aucune valeur réelle : ce sont les entités
#       de test de donnees_test.yaml, de l'intégration demo et de verifier_installation.py.
# @ai_instruction Un placeholder ajouté dans un package doit l'être ici aussi :
#       tests/test_installation_ha.py rend les packages avec ce fichier et échoue s'il
#       reste un « VOTRE_ ».
# ============================================================================

# --- Météo (donnees_test.yaml) ---
VOTRE_VILLE: ville_ci                              # weather.ville_ci, sensor.ville_ci_next_rain
VOTRE_DEPARTEMENT: "99"                            # sensor.99_weather_alert
# Sources facultatives absentes, comme chez un utilisateur sans elles.
VOTRE_METEO_OWM: weather.openweathermap_ci_absente
VOTRE_METEOALARM: binary_sensor.meteoalarm_ci_absent

# --- Domotique ---
VOTRE_VOLET: hall_window                           # cover.hall_window (demo)
VOTRE_TV: living_room                              # media_player.living_room (demo) ; pas de remote.living_room
VOTRE_TELEPHONE: telephone_ci                      # device_tracker absent
VOTRE_CAPTEUR_PRESENCE: presence_ci                # binary_sensor absent

# --- Calendriers ---
VOTRE_EMAIL_gmail_com: travail_ci                  # calendar.travail_ci (Calendrier local créé par verifier_installation.py)
